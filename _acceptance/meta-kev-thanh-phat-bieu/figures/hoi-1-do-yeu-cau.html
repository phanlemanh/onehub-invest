<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hỏi-1 đo Yêu cầu</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Lora:ital,wght@0,400;1,400&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Lora', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1040px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.25;
      color: var(--color-ink);
      margin-bottom: 0.5rem;
    }
    .sub {
      font-size: 0.875rem;
      color: var(--color-muted);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Cổng Phạm vi · meta-kev-thanh-phat-bieu · hoi-1-do-yeu-cau</p>
    <h1>Hỏi-1: đo «bài khách tìm… ra Yêu cầu» thế nào</h1>
    <p class="sub">AC-9 · hai nhánh, nhánh tô cam là nhánh khuyến nghị</p>

    <svg viewBox="0 0 1000 712" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- ============ Khung nhánh (nền, vẽ trước) ============ -->
      <!-- Nhánh A: khung nhấn duy nhất -->
      <rect x="48" y="168" width="440" height="420" rx="8" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4"/>
      <text x="64" y="192" fill="#ba4513" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.14em">NHÁNH A · KHUYẾN NGHỊ</text>
      <!-- Nhánh B -->
      <rect x="512" y="168" width="440" height="420" rx="8" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="528" y="192" fill="#4f5d75" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.14em">NHÁNH B</text>

      <!-- ============ Mũi tên (vẽ trước nút) ============ -->
      <!-- Gốc → A (attach x=440) -->
      <path d="M 440 120 L 440 136 Q 440 144 432 144 L 276 144 Q 268 144 268 152 L 268 168" fill="none" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <!-- Gốc → B (attach x=560) -->
      <path d="M 560 120 L 560 136 Q 560 144 568 144 L 724 144 Q 732 144 732 152 L 732 168" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Trong nhánh A -->
      <line x1="268" y1="260" x2="268" y2="284" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <line x1="268" y1="364" x2="268" y2="388" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <line x1="268" y1="468" x2="268" y2="492" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <!-- Trong nhánh B -->
      <line x1="732" y1="260" x2="732" y2="284" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="732" y1="364" x2="732" y2="388" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="732" y1="468" x2="732" y2="492" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- ============ Nút gốc: tình huống chung ============ -->
      <rect x="120" y="24" width="760" height="96" rx="6" fill="#f5f5f5"/>
      <rect x="120" y="24" width="760" height="96" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="500" y="44" fill="#4f5d75" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">TÌNH HUỐNG CHUNG · HỎI-1 · AC-9</text>
      <text x="500" y="72" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">12 bài «khách tìm thuê 2pn…» (Yêu cầu thật) → Kev-4B chấm</text>
      <text x="500" y="100" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif" text-anchor="middle">Thử 30/10: <tspan font-weight="600">3/12</tspan> ra Yêu cầu · <tspan font-weight="600">9/12</tspan> ra Tin rao</text>

      <!-- ============ Nhánh A ============ -->
      <!-- A0 · cách đo -->
      <rect x="64" y="204" width="408" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="64" y="204" width="408" height="56" rx="6" fill="#ffffff" stroke="#eb6c36" stroke-width="1"/>
      <text x="268" y="237" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Đo không bị bỏ + in tỉ lệ (khuyến nghị)</text>

      <!-- A1 · đo -->
      <rect x="64" y="284" width="408" height="80" rx="6" fill="#f5f5f5"/>
      <rect x="64" y="284" width="408" height="80" rx="6" fill="#ffffff" stroke="#eb6c36" stroke-width="1"/>
      <text x="80" y="304" fill="#4f5d75" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.14em">ĐO</text>
      <text x="80" y="336" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif">Mọi bài có phát biểu ý định?</text>

      <!-- A2 · kết quả -->
      <rect x="64" y="388" width="408" height="80" rx="6" fill="#f5f5f5"/>
      <rect x="64" y="388" width="408" height="80" rx="6" fill="#ffffff" stroke="#eb6c36" stroke-width="1"/>
      <text x="80" y="408" fill="#4f5d75" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.14em">KẾT QUẢ</text>
      <text x="80" y="440" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif"><tspan font-weight="600">ĐẠT</tspan> · in «<tspan font-family="'Geist Mono', monospace">Yêu cầu: 3/12 = 25%</tspan>»</text>

      <!-- A3 · hệ quả -->
      <rect x="64" y="492" width="408" height="80" rx="6" fill="#f5f5f5"/>
      <rect x="64" y="492" width="408" height="80" rx="6" fill="#ffffff" stroke="#eb6c36" stroke-width="1"/>
      <text x="80" y="512" fill="#4f5d75" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.14em">HỆ QUẢ</text>
      <text x="80" y="536" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif">Độ chính xác của Kev để hàng PH3</text>
      <text x="80" y="556" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif">(huấn luyện lại)</text>

      <!-- ============ Nhánh B ============ -->
      <!-- B0 · cách đo -->
      <rect x="528" y="204" width="408" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="528" y="204" width="408" height="56" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.40)" stroke-width="1"/>
      <text x="732" y="237" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Đặt ngưỡng tỉ lệ (vd ≥ 80%)</text>

      <!-- B1 · đo -->
      <rect x="528" y="284" width="408" height="80" rx="6" fill="#f5f5f5"/>
      <rect x="528" y="284" width="408" height="80" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.40)" stroke-width="1"/>
      <text x="544" y="304" fill="#4f5d75" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.14em">ĐO</text>
      <text x="544" y="336" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif">Tỉ lệ ra Yêu cầu ≥ 80%?</text>

      <!-- B2 · kết quả -->
      <rect x="528" y="388" width="408" height="80" rx="6" fill="#f5f5f5"/>
      <rect x="528" y="388" width="408" height="80" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.40)" stroke-width="1"/>
      <text x="544" y="408" fill="#4f5d75" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.14em">KẾT QUẢ</text>
      <text x="544" y="440" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif"><tspan font-family="'Geist Mono', monospace">25% &lt; 80%</tspan> → <tspan font-weight="600">TRƯỢT</tspan></text>

      <!-- B3 · hệ quả -->
      <rect x="528" y="492" width="408" height="80" rx="6" fill="#f5f5f5"/>
      <rect x="528" y="492" width="408" height="80" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.40)" stroke-width="1"/>
      <text x="544" y="512" fill="#4f5d75" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.14em">HỆ QUẢ</text>
      <text x="544" y="536" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif">Vòng không ký được tới khi</text>
      <text x="544" y="556" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif">Kev được huấn luyện lại</text>

      <!-- ============ Chân hình ============ -->
      <text x="500" y="624" fill="#4f5d75" font-size="12" font-family="'Geist', sans-serif" text-anchor="middle">Dòng lệnh duyệt điền sẵn A; muốn B thì trả «<tspan fill="#2d3142" font-family="'Geist Mono', monospace">sửa: Hỏi-1 = B</tspan>»</text>

      <!-- ============ Chú giải ============ -->
      <line x1="48" y1="652" x2="952" y2="652" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <text x="48" y="676" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.18em">CHÚ GIẢI</text>

      <rect x="48" y="688" width="24" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="80" y="698" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Tình huống chung</text>

      <rect x="208" y="688" width="24" height="12" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4"/>
      <text x="240" y="698" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Nhánh khuyến nghị</text>

      <rect x="388" y="688" width="24" height="12" rx="2" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="420" y="698" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Nhánh còn lại</text>
    </svg>
  </div>
</body>
</html>
