schema_version: 1
feature_slug: ops-nhan-theo-context
# Eval máy đọc ca mang tiền tố «ON12-AC-n» trong TAP: app/tests/ops-nhan-theo-context.test.tsx (AC-1…AC-7, AC-10) và
# scripts/smoke-ops-nhan.mjs (AC-8: trang chạy thật + chiều đỏ trên HTML viết trước).
evals:
  - id: E1
    criterion: AC-1
    executor: test
    cmd: config:executors.test.app_ui
    paths: [CONTEXT.md, scripts/lib/ops-nhan.mjs, app/tests/ops-nhan/**, app/tests/ops-nhan-theo-context.test.tsx, app/src/app/ops/**, app/src/components/ops/**, app/src/components/shell/**, app/src/components/page/**, app/src/components/states/**, app/src/lib/*.ts]
    expected: "exit 0; ca 'ON12-AC-1 0 từ _Avoid_ trên chuỗi hiển thị của phạm vi quét' (in danh sách tệp và số chuỗi đã quét; danh sách tệp deepEqual danh sách viết trước ở design doc §3.1, kể cả chuỗi trong <code>), ca 'ON12-AC-1 danh sách tệp quét thiếu một tệp → đỏ nêu tệp', và ba chiều đỏ 'ON12-AC-1 bản sao <tiêu đề review | mục thanh bên | Heartbeat trong code> → báo tệp:dòng và từ' ok"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E2
    criterion: AC-2
    executor: test
    cmd: config:executors.test.app_ui
    paths: [CONTEXT.md, scripts/lib/ops-nhan.mjs, app/tests/ops-nhan/**, app/tests/ops-nhan-theo-context.test.tsx, app/src/app/ops/**, app/src/components/ops/**, app/src/components/shell/**, app/src/components/page/**, app/src/components/states/**, app/src/lib/*.ts]
    expected: "exit 0; ca 'ON12-AC-2 ma trận phân loại token viết trước' (mỗi phần tử một assert: Heartbeat, Job, market, offline, Uptime, hanoi, hcmc → tiếng Anh; Tin, Xem, thu, Listing, Staging, S02, QR, L4b, Hà Nội, Hồ Chí Minh, 24h, m², tr/m² → không báo), ca 'ON12-AC-2 0 từ tiếng Anh ngoài danh sách giữ trên chuỗi hiển thị' và chiều đỏ 'ON12-AC-2 bản sao thêm «Uptime 24h» và title=\"Toggle\" → báo cả hai' ok"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E3
    criterion: AC-3
    executor: test
    cmd: config:executors.test.app_ui
    paths: [app/src/components/shell/ops-shell/ops-header.tsx, app/src/components/page/page-header.tsx, app/tests/ops-nhan-theo-context.test.tsx]
    expected: "exit 0; ca 'ON12-AC-3 OpsHeader và PageHeader không còn sr-only tiếng Anh' — markup có «Mở hoặc gập thanh bên», aria-label đường dẫn tiếng Việt, không «Toggle Sidebar», không aria-label=\"breadcrumb\"; đối chứng 'ON12-AC-3 SidebarTrigger của component đã cài → phép đo thấy Toggle Sidebar' ok"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E4
    criterion: AC-4
    executor: test
    cmd: config:executors.test.app_ui
    paths: [app/src/lib/dq-labels.ts, pipeline/sql/450_dq_checks.sql, pipeline/dq-truthful-coverage.mjs, pipeline/dq-enum-vocab.mjs, pipeline/scripts/bench-extraction.mjs, app/tests/ops-nhan-theo-context.test.tsx]
    expected: "exit 0; ca 'ON12-AC-4 dqDetail ma trận khuôn bên ghi' (mỗi khuôn một assert giá trị viết trước; số assert = số khuôn trong ma trận), 'ON12-AC-4 dqCheckName và dqEntityLabel ma trận', 'ON12-AC-4 khuôn lạ → (chưa diễn giải)', và 'ON12-AC-4 khuôn ma trận còn trong tệp bên ghi' (mỗi khuôn tìm thấy trong đúng tệp; bản sao 450_dq_checks.sql đổi 'vi phạm: ' → ca đỏ nêu tệp) ok"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E5
    criterion: AC-5
    executor: test
    cmd: config:executors.test.app_ui
    layer: backend-effect
    paths: [app/src/lib/dq-labels.ts, app/src/lib/market-names.ts, app/src/app/ops/quality/page.tsx, app/src/components/ops/quality/dq-checks-table.tsx, app/tests/ops-nhan-theo-context.test.tsx]
    expected: "exit 0; ca 'ON12-AC-5 bảng kiểm chất lượng trên DB local diễn giải đủ' — nạp bằng đúng hàm nạp của /ops/quality, in số dòng và số loại kiểm đã đo (≥ 2 loại), 0 «(chưa diễn giải)», 0 khuôn \\w+=, 0 tên kiểm thô, 0 mã vn-…; DB local :5433 không tới được → ca đỏ có tên (không bỏ qua lặng)"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E6
    criterion: AC-6
    executor: test
    cmd: config:executors.test.app_ui
    layer: backend-effect
    paths: [app/src/lib/market-names.ts, app/src/lib/queries.ts, app/src/lib/collections-queries.ts, app/src/components/ops/quality-tables.tsx, app/src/components/ops/collections/pipe-panels.tsx, app/tests/ops-nhan-theo-context.test.tsx]
    expected: "exit 0; ca 'ON12-AC-6 s02MarketName ma trận viết trước' (Quang Tr → Quảng Trị, Binh Thu → Bình Thuận, Phan RangaThap Cham → Phan Rang – Tháp Chàm, Hanoi → Hà Nội, Ho Chi Minh City → Hồ Chí Minh, mã lạ → «<tên gốc> (chưa có tên Việt)»), 'ON12-AC-6 mọi thị trường S02 trên DB local có tên Việt' (nạp bằng getAirdnaMarkets, in số dòng đã đo), 'ON12-AC-6 render bảng thị trường S02 và vòng thu từ hàm nạp thật' (có tên Việt, cột khu vực hiện areas.name, không vn-… làm chữ link, không #<mã>) ok"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E7
    criterion: AC-7
    executor: test
    cmd: config:executors.test.app_ui
    layer: backend-effect
    paths: [app/src/lib/market-names.ts, app/src/lib/ops-labels.ts, app/src/lib/ops-queries.ts, app/src/lib/queries.ts, app/src/components/ops/sources/**, app/src/components/ops/review-card.tsx, app/src/components/ops/overview/**, app/tests/ops-nhan-theo-context.test.tsx]
    expected: "exit 0; ca 'ON12-AC-7 bảng nhãn giá trị thô ma trận viết trước' (mỗi giá trị một assert, mã lạ → nhãn chung + <code>), 'ON12-AC-7 render danh mục nguồn, thẻ duyệt, cột thị trường tổng quan' (nhãn Việt, không active/apartment/yes/hanoi trần), 'ON12-AC-7 mọi giá trị đang có trên DB local có nhãn' (nạp bằng getCoverageOverview và hàm nạp danh mục nguồn; hanoi → Hà Nội, vn → Toàn quốc) ok"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E8
    criterion: AC-8
    executor: script
    cmd: config:executors.script.ops_nhan_smoke
    paths: [scripts/smoke-ops-nhan.mjs, scripts/lib/ops-nhan.mjs, CONTEXT.md, app/src/**]
    expected: "exit 0; dòng 'ok   chiều đỏ HTML viết trước: báo đủ 9 mục' và 7 dòng 'ok   /ops… 200 · 0 _Avoid_ · 0 tiếng Anh · 0 mã DQ · không Toggle Sidebar · 0 mã khu vực · 0 dự phòng' (mỗi dòng in số ký tự chữ đã quét > 0 và danh sách chuỗi trong <code>); phiên admin tạm đã xoá (dòng 'dọn: 0 phiên tạm còn lại'); app không lên được hay DB không tới được → exit ≠ 0 có tên"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E9
    criterion: AC-9
    executor: judgment
    inputs: [CONTEXT.md, docs/superpowers/specs/2026-10-24-ops-nhan-theo-context-design.md]
    question: "Trong CONTEXT.md, mỗi khối thuật ngữ mới «Khoá an toàn», «Lượt máy tự trả lời», «Bộ canh», «Tín hiệu sống», «Danh sách cho phép», «Tác vụ», «Bài», «Máy chủ» có đủ nhãn · code · định nghĩa · dòng _Avoid_ ghi chữ tiếng Anh cũ không, và định nghĩa có khớp nghĩa mà bảng nhãn §4 của design doc dùng không?"
    expected: "Đạt khi đủ 8 khối, mỗi khối đủ bốn phần, _Avoid_ chứa đúng chữ cũ ở bảng §4, định nghĩa không mâu thuẫn bảng §4"
    evidence_required: [run_id, verifier, verified_at, output]
  - id: E10
    criterion: AC-10
    executor: test
    cmd: config:executors.test.app_ui
    paths: [app/src/components/ops/quality-tables.tsx, app/src/components/ops/quality/dq-checks-table.tsx, app/src/components/ops/overview/objectives-grid.tsx, app/tests/ops-nhan-theo-context.test.tsx]
    expected: "exit 0; ca 'ON12-AC-10 ô tên thị trường và chi tiết kiểm xuống dòng' — render thật 4 bảng, mọi phần tử trong cây con của ô 4 cột (kể cả td) không mang truncate, whitespace-nowrap, text-ellipsis; đối chứng 'ON12-AC-10 cột khác vẫn truncate' ở đúng vị trí đó ok"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
