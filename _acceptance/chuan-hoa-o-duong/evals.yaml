schema_version: 1
feature_slug: chuan-hoa-o-duong
# Ca test mang tiền tố «CD-AC-n» trong agent/tests/judge-entity-duong.test.ts (tệp mới; không DB trừ probe AC-8).
# Chiều đỏ: bản đột biến của judge-entity.ts đổi đúng một chỗ trong khoaDuong, chép tạm cạnh tệp thật
# (src/agents/.cd-<pid>-<n>.ts, xoá cuối lượt). Probe AC-8 chỉ SELECT, bỏ qua có lý do dưới CI.
evals:
  - id: E1
    criterion: AC-1
    executor: test
    cmd: config:executors.test.judge_entity_duong
    paths: [agent/src/agents/judge-entity.ts, agent/tests/judge-entity-duong.test.ts]
    expected: "exit 0; ca 'CD-AC-1 tiền tố vị trí' xanh: ma trận viết trước 10 cặp × 2 chiều (đếm 20), gồm hai cặp có dấu phẩy sau cụm vị trí ('Ngõ 5, Kim Mã', 'Số 10, Ngõ 9, La Dương'), mỗi ô không có lý do khac_duong và same_house 'yes'; chiều đỏ: bản đột biến bỏ dòng cắt cụm vị trí (ngõ/ngách/hẻm/kiệt/số + số) → đỏ 'CD-AC-1 cùng đường có tiền tố vị trí bị loại: Ngõ 254 Minh Khai ↔ Minh Khai'; bản đột biến cắt dấu phẩy TRƯỚC khi bỏ cụm vị trí → đỏ 'CD-AC-1 cùng đường có tiền tố vị trí bị loại: Ngõ 5, Kim Mã ↔ Kim Mã'"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E2
    criterion: AC-2
    executor: test
    cmd: config:executors.test.judge_entity_duong
    paths: [agent/src/agents/judge-entity.ts, agent/tests/judge-entity-duong.test.ts]
    expected: "exit 0; ca 'CD-AC-2 số nhà và đuôi địa chỉ' xanh: 4 cặp × 2 chiều (đếm 8) không có khac_duong; chiều đỏ: bản đột biến bỏ dòng cắt từ dấu phẩy → đỏ 'CD-AC-2 số nhà hay đuôi địa chỉ bị loại: 235 Nguyễn Trãi, Khương Đình, Hà Nội, Vietnam ↔ Nguyễn Trãi'; bản đột biến chỉ giữ cách đọc đã bỏ số nhà → vẫn xanh ở AC-2 (đo ở E3)"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E3
    criterion: AC-3
    executor: test
    cmd: config:executors.test.judge_entity_duong
    paths: [agent/src/agents/judge-entity.ts, agent/tests/judge-entity-duong.test.ts]
    expected: "exit 0; ca 'CD-AC-3 tên đường bắt đầu bằng số' xanh: '3 Tháng 2' ↔ 'Đường 3 Tháng 2' và 'Đường số 7' ↔ 'Đường số 7' không khac_duong, 'Đường số 7' ↔ 'Đường số 9' và '30 Tháng 4' ↔ '2 Tháng 4' → 'no' + khac_duong, cả hai chiều (đếm 8); chiều đỏ: bản đột biến chỉ giữ cách đọc đã bỏ số nhà trần → đỏ 'CD-AC-3 tên đường bắt đầu bằng số bị loại: 3 Tháng 2 ↔ Đường 3 Tháng 2'; bản đột biến bỏ ngoại lệ «tháng <số>» → đỏ 'CD-AC-3 hai đường đánh số khác không loại: 30 Tháng 4 ↔ 2 Tháng 4'"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E4
    criterion: AC-4
    executor: test
    cmd: config:executors.test.judge_entity_duong
    paths: [agent/src/agents/judge-entity.ts, agent/tests/judge-entity-duong.test.ts]
    expected: "exit 0; ca 'CD-AC-4 ô đường không mang tên' xanh: 4 giá trị ('4', 'Số 8', 'Ngõ', 'Ngõ 12') ↔ 'Minh Khai' × 2 chiều (đếm 8): luật không khac_duong và soDuong của luật = 'thieu'; chiều đỏ: bản đột biến bỏ dòng coi từ vị trí trần là rỗng → đỏ 'CD-AC-4 ô không mang tên đường thành Lệch: Ngõ ↔ Minh Khai'"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E5
    criterion: AC-5
    executor: test
    cmd: config:executors.test.judge_entity_duong
    paths: [agent/src/agents/judge-entity.ts, agent/tests/judge-entity-duong.test.ts]
    expected: "exit 0; ca 'CD-AC-5 khác đường vẫn loại' xanh: 3 cặp × 2 chiều (đếm 6) → 'no' với đúng 1 lý do khac_duong; chiều đỏ: bản đột biến soDuong luôn Khớp → đỏ 'CD-AC-5 hai đường khác không loại: Ngõ 254 Minh Khai ↔ Bạch Mai'"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E6
    criterion: AC-6
    executor: test
    cmd: config:executors.test.judge_entity_duong
    paths: [agent/src/agents/judge-entity.ts, agent/tests/judge-entity-duong.test.ts]
    expected: "exit 0; ca 'CD-AC-6 chữ Eth' xanh: 'Hẻm 135 Trần Hưng Ðạo' (U+00D0, test assert codePointAt đúng 0xD0) ↔ 'Trần Hưng Đạo' không khac_duong, cả hai chiều; chiều đỏ: bản đột biến bỏ dòng đổi ð → đ → đỏ 'CD-AC-6 chữ Eth thành đường khác'"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E7
    criterion: AC-7
    executor: test
    cmd: config:executors.test.judge_entity_duong
    paths: [agent/src/agents/judge-entity.ts, app/src/lib/ops/review-can-cu.ts, agent/tests/judge-entity-duong.test.ts]
    expected: "exit 0; ca 'CD-AC-7 thẻ và luật cùng khoá đường' xanh: rút nguyên văn boDau, khoaDuong, soDuong từ app/src/lib/ops/review-can-cu.ts; mọi cặp của ma trận AC-1 – AC-6 (26 cặp) cùng 3 cặp HD2 ('Duong Lam' ↔ 'Dương Lâm', 'Đường Đinh Bộ Lĩnh' ↔ 'đinh bộ lĩnh', 'Duong Lang' ↔ 'Đường Láng' → khop) × 2 chiều = 58 ô, nhãn của thẻ = nhãn của luật = nhãn viết trước; chiều đỏ: bản đột biến luật bỏ dòng cắt cụm vị trí (thẻ giữ nguyên) → đỏ 'CD-AC-7 luật lệch thẻ duyệt ở: Ngõ 254 Minh Khai | Minh Khai'"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E8
    criterion: AC-8
    executor: test
    cmd: config:executors.test.judge_entity_duong
    paths: [agent/src/agents/judge-entity.ts, agent/tests/judge-entity-duong.test.ts]
    expected: "exit 0 trên máy thu; ca 'CD-AC-8 probe ô đường thật' xanh: SELECT DISTINCT street_raw khớp cụm vị trí đầu chuỗi + phần chữ; bộ tách độc lập trong test (regex riêng, không import khoaDuong) cho phần tên; soDuong(giá trị, phần tên) = 'khop' ở MỌI giá trị, số giá trị ≥ 100 (in số đếm); thẻ entity_match status approved (người nhận cùng căn, như LT-AC-6) mà ít nhất một ô đường có cụm vị trí, số nhà đầu chuỗi hay dấu phẩy → apNguong không có khac_duong (in số thẻ, có thể 0); chiều đỏ: bản đột biến bỏ dòng cắt cụm vị trí → đỏ 'CD-AC-8 ô đường thật có tiền tố vị trí ra Lệch'; dưới CI t.skip có lý do"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E9
    criterion: AC-9
    executor: test
    cmd: config:executors.test.judge_luat
    paths: [agent/src/agents/judge-entity.ts, app/src/lib/ops/review-can-cu.ts]
    expected: "exit 0; mọi ca của agent/tests/judge-luat.test.ts xanh (gồm LT-AC-4, LT-AC-9 26 ô thẻ = luật, LT-AC-10 đường không dấu), tệp test không đổi so với origin/main"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E10
    criterion: AC-9
    executor: test
