<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hỏi-3 · Hai số mỗi lượt quyết</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Lora:ital,wght@0,400;1,400&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper: #f5f5f5;
      --color-ink:   #2d3142;
      --font-sans:   'Geist', system-ui, sans-serif;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <svg viewBox="0 0 1000 508" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
        </marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
        </marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/>
        </marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Tiêu đề trong SVG để PNG tự đứng được -->
      <text x="40" y="36" fill="#4f5d75" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.18em">CỔNG PHẠM VI · HỎI-3 · AC-1, AC-4</text>
      <text x="40" y="68" fill="#2d3142" font-size="28" font-family="'Instrument Serif', 'Lora', serif">Hai số mỗi lượt quyết — một người duyệt, hai lượt liền nhau</text>

      <!-- Trục thời gian -->
      <line x1="80" y1="224" x2="924" y2="224" stroke="rgba(79,93,117,0.45)" stroke-width="1" marker-end="url(#arrow)"/>
      <line x1="80" y1="216" x2="80" y2="232" stroke="rgba(45,49,66,0.20)" stroke-width="1"/>

      <!-- Đường dóng xuống hai khoảng đo -->
      <line x1="120" y1="232" x2="120" y2="352" stroke="rgba(45,49,66,0.30)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="500" y1="232" x2="500" y2="288" stroke="rgba(45,49,66,0.30)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="880" y1="232" x2="880" y2="352" stroke="rgba(235,108,54,0.60)" stroke-width="1" stroke-dasharray="3,3"/>

      <!-- Mốc 1: Quyết thẻ #1 (cao) -->
      <line x1="120" y1="148" x2="120" y2="220" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <circle cx="120" cy="224" r="4" fill="#2d3142"/>
      <text x="120" y="140" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Quyết thẻ #1 (lượt trước)</text>

      <!-- Mốc 2: Chọn thẻ kế (thấp) — bước OD2 rút ngắn -->
      <line x1="310" y1="188" x2="310" y2="220" stroke="rgba(45,49,66,0.30)" stroke-width="1" stroke-dasharray="4,3"/>
      <circle cx="310" cy="224" r="4" fill="#f5f5f5" stroke="#4f5d75" stroke-width="1.2"/>
      <text x="310" y="180" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Chọn thẻ kế trong danh sách</text>

      <!-- Mốc 3: Thẻ #2 mở (cao) -->
      <line x1="500" y1="148" x2="500" y2="220" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <circle cx="500" cy="224" r="4" fill="#2d3142"/>
      <text x="500" y="140" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Thẻ #2 mở (sheet dựng)</text>

      <!-- Mốc 4: Đọc, gõ lý do (thấp) -->
      <line x1="690" y1="188" x2="690" y2="220" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <circle cx="690" cy="224" r="4" fill="#2d3142"/>
      <text x="690" y="180" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Đọc, gõ lý do</text>

      <!-- Mốc 5: Bấm đáp án — quyết thẻ #2 (cao, tiêu điểm) -->
      <line x1="880" y1="148" x2="880" y2="218" stroke="#eb6c36" stroke-width="1"/>
      <circle cx="880" cy="224" r="6" fill="#eb6c36"/>
      <text x="880" y="140" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Bấm đáp án — quyết thẻ #2</text>

      <!-- Khoảng A: Giây ở thẻ (seconds) — từ Thẻ #2 mở tới Bấm đáp án -->
      <line x1="500" y1="288" x2="880" y2="288" stroke="#4f5d75" stroke-width="1.2"/>
      <line x1="500" y1="282" x2="500" y2="294" stroke="#4f5d75" stroke-width="1.2"/>
      <line x1="880" y1="282" x2="880" y2="294" stroke="#4f5d75" stroke-width="1.2"/>
      <rect x="616" y="260" width="148" height="22" rx="2" fill="#f5f5f5"/>
      <text x="690" y="276" text-anchor="middle"><tspan fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Giây ở thẻ </tspan><tspan fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">(seconds)</tspan></text>

      <!-- Khoảng B: Giữa hai lượt (since_prev_seconds) — từ Quyết thẻ #1 tới Bấm đáp án -->
      <line x1="120" y1="352" x2="500" y2="352" stroke="#eb6c36" stroke-width="1.4"/>
      <line x1="500" y1="352" x2="880" y2="352" stroke="#4f5d75" stroke-width="1.2"/>
      <line x1="120" y1="346" x2="120" y2="358" stroke="#eb6c36" stroke-width="1.4"/>
      <line x1="880" y1="346" x2="880" y2="358" stroke="#4f5d75" stroke-width="1.2"/>
      <rect x="380" y="324" width="240" height="22" rx="2" fill="#f5f5f5"/>
      <text x="500" y="340" text-anchor="middle"><tspan fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Giữa hai lượt </tspan><tspan fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">(since_prev_seconds)</tspan></text>

      <!-- Chú thích 1: OD2 rút phần Chọn thẻ kế -->
      <line x1="310" y1="360" x2="310" y2="376" stroke="rgba(45,49,66,0.40)" stroke-width="1" stroke-dasharray="2,2"/>
      <text x="120" y="396" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', 'Lora', serif">OD2 (rail, tự sang thẻ kế) rút phần «Chọn thẻ kế» —</text>
      <text x="120" y="416" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', 'Lora', serif">chỉ số «Giữa hai lượt» thấy được phần đó.</text>

      <!-- Chú thích 2: trần 30 phút -->
      <text x="880" y="396" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', 'Lora', serif" text-anchor="end">Lượt quá 30 phút không vào trung vị.</text>

      <!-- Chú giải -->
      <line x1="40" y1="448" x2="960" y2="448" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <text x="40" y="476" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.18em">CHÚ GIẢI</text>

      <circle cx="128" cy="472" r="4" fill="#2d3142"/>
      <text x="140" y="476" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Mốc trong lượt</text>

      <circle cx="232" cy="472" r="4" fill="#f5f5f5" stroke="#4f5d75" stroke-width="1.2"/>
      <text x="244" y="476" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Bước OD2 rút ngắn</text>

      <circle cx="356" cy="472" r="6" fill="#eb6c36"/>
      <text x="368" y="476" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Lượt quyết (bấm đáp án)</text>

      <line x1="508" y1="472" x2="532" y2="472" stroke="#4f5d75" stroke-width="1.2"/>
      <line x1="508" y1="468" x2="508" y2="476" stroke="#4f5d75" stroke-width="1.2"/>
      <line x1="532" y1="468" x2="532" y2="476" stroke="#4f5d75" stroke-width="1.2"/>
      <text x="544" y="476" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Khoảng máy đo</text>

      <line x1="644" y1="472" x2="668" y2="472" stroke="#eb6c36" stroke-width="1.4"/>
      <text x="680" y="476" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Phần chỉ «Giữa hai lượt» thấy</text>

      <text x="40" y="496" fill="#4f5d75" font-size="9" font-style="italic" font-family="'Geist', sans-serif">Trục ngang theo thứ tự thời gian, khoảng cách giữa các mốc không theo tỉ lệ.</text>
    </svg>
  </div>
</body>
</html>
