schema_version: 1
feature_slug: thuoc-tinh-can-s16
# Lệnh eval gói trong _acceptance/thuoc-tinh-can-s16/probes/kiem.sh (GS phán P1-92: không thêm khoá vào _acceptance/config.yaml).
#   kiem.sh ham  = node --test pipeline/tests/thuoc-tinh-can-s16.test.mjs
#   kiem.sh db   = node --test --test-concurrency=1 pipeline/tests/thuoc-tinh-can-s16.itest.mjs
#                  (DB thử oneinvest_dbv_ttc_<pid> dựng từ db/migrations qua pipeline/scripts/db-thu-dbv.mjs; xoá khi xong)
#   kiem.sh that = node pipeline/tests/thuoc-tinh-can-s16-that.mjs (chỉ-đọc DB máy thu; chỉ in số; ngoài CI)
#   kiem.sh app  = cd app && bash ../db/db-thu.sh oneinvest_suite_ttc --chay node --import tsx --test --test-concurrency=1 tests/thuoc-tinh-can.test.tsx
evals:
  - id: E1
    criterion: AC-1
    executor: script
    cmd: bash _acceptance/thuoc-tinh-can-s16/probes/kiem.sh db
    expected: "Ca TTC-AC-1 trên DB của lượt (áp 001…113): áp 113 lần hai không lỗi, bản chụp information_schema.columns + pg_get_viewdef + pg_get_triggerdef + pg_get_constraintdef trước/sau lần hai bằng nhau; CHECK field_assertions_field_chk bằng đúng tập 096 + {living_area, building_area_total, direction_faces, lot_size_area} (so tập, không so chuỗi); git diff --name-only origin/main -- db/migrations chỉ có 113_* và 118_* (118 do GS cấp, P1-100). Chiều đỏ: bản sao 113 bỏ IF NOT EXISTS ở CREATE TABLE → lần hai lỗi, ca đỏ nêu «áp lại 113»"
    paths: ["db/migrations/113_*", "db/migrations/118_*", "pipeline/tests/thuoc-tinh-can-s16*"]
  - id: E2
    criterion: AC-2
    executor: script
    cmd: bash _acceptance/thuoc-tinh-can-s16/probes/kiem.sh db
    expected: "Ca TTC-AC-2: tập cột stg_s16_can_chi_tiet bằng đúng danh sách viết trước của thiết kế §4.1 (so tập); không cột nào khớp /purchase|invest|loan|juridical|delivery|furniture|house_status/i; FK snapshot_id → airbnb_snapshots ON DELETE CASCADE (đọc pg_constraint); ba dòng vi phạm (ma_can rỗng, area_using -1, sale_price -1) mỗi dòng 23514 nêu tên ràng buộc. Chiều đỏ: thêm cột purchase_price vào bản sao → ca đỏ nêu tên cột"
    paths: ["db/migrations/113_*", "db/migrations/118_*"]
  - id: E3
    criterion: AC-3
    executor: test
    cmd: bash _acceptance/thuoc-tinh-can-s16/probes/kiem.sh ham
    expected: "Ca TTC-AC-3: ma trận viết trước (11 loại hình + UNDEF + mã lạ; diện tích >0/0/thiếu; PN, WC >0/0; HIGH_RISE lấy balcony_direction, LOW_RISE lấy direction; NE, N_E, NORTH, NE_NW, NE_NE, OTHER, rỗng, mã lạ; khoá hai toà), số assert = số ô; mỗi ô so mảng {field,value} đầy đủ + lý do bỏ. Ô shophouse ghim đúng nhánh Hỏi-4 Mạnh chọn. Dòng mẫu theo khuôn cột của migration 113 (bộ ghi thật là bộ nạp làn thu, chưa có — giới hạn khai ở Notes; chỗ ánh xạ của bộ nạp do E13 bắt). Chiều đỏ: đột biến lấy direction cho HIGH_RISE → ô cao tầng đỏ nêu mã ô; đột biến coi 0 là PN hợp lệ → ô PN=0 đỏ"
    paths: ["pipeline/lib/thuoc-tinh-can-s16.mjs", "pipeline/tests/thuoc-tinh-can-s16.test.mjs"]
