    expected: "Ca TTC-AC-1 trên DB của lượt (áp 001…113): áp 113 lần hai không lỗi, bản chụp information_schema.columns + pg_get_viewdef + pg_get_triggerdef + pg_get_constraintdef trước/sau lần hai bằng nhau; CHECK field_assertions_field_chk bằng đúng tập 096 + {living_area, building_area_total, direction_faces} (so tập, không so chuỗi); git diff --name-only origin/main -- db/migrations chỉ có 113_*. Chiều đỏ: bản sao 113 bỏ IF NOT EXISTS ở CREATE TABLE → lần hai lỗi, ca đỏ nêu «áp lại 113»"
    paths: ["db/migrations/113_*", "pipeline/tests/thuoc-tinh-can-s16*"]
  - id: E2
    criterion: AC-2
