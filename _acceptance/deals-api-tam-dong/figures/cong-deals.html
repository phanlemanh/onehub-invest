<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cổng deals API</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Lora:ital,wght@0,400;1,400&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Lora', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1040px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.25;
      color: var(--color-ink);
      margin-bottom: 0.5rem;
    }
    .sub {
      font-size: 0.875rem;
      color: var(--color-muted);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 880px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Cổng Phạm vi · deals-api-tam-dong · cong-deals</p>
    <h1>Cổng GET /api/v1/deals: 401 trước khi chạm dữ liệu</h1>
    <p class="sub">Hai câu hỏi, xét theo thứ tự · AC-1 401 trước truy vấn · AC-2 bearer đúng, không đọc phiên · AC-3 bearer sai / token trống · AC-4 ma trận phiên</p>

    <svg viewBox="0 0 960 680" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- ============ Mũi tên (vẽ trước, nằm dưới nút) ============ -->
      <!-- Yêu cầu → hỏi bearer -->
      <line x1="320" y1="88" x2="320" y2="126" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Bearer đúng → 200 (vào cạnh trên nút 200) -->
      <path d="M460 192 H752 Q760 192 760 200 V250" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Bearer không đúng → hỏi phiên -->
      <line x1="320" y1="256" x2="320" y2="302" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Phiên ops → 200 (vào cạnh dưới nút 200) -->
      <path d="M480 376 H752 Q760 376 760 368 V318" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Không phiên ops → 401 (đường tiêu điểm) -->
      <line x1="320" y1="448" x2="320" y2="494" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

      <!-- ============ Nhãn mũi tên (có mặt nạ, cách đường ≥6px) ============ -->
      <rect x="588" y="168" width="24" height="16" rx="2" fill="#f5f5f5"/>
      <text x="600" y="180" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">CÓ</text>
      <text x="600" y="214" fill="#636b80" font-size="12" font-style="italic" font-family="'Instrument Serif', 'Lora', serif" text-anchor="middle">không đọc phiên · AC-2</text>

      <rect x="328" y="272" width="48" height="16" rx="2" fill="#f5f5f5"/>
      <text x="332" y="284" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.12em">KHÔNG</text>

      <rect x="604" y="352" width="24" height="16" rx="2" fill="#f5f5f5"/>
      <text x="616" y="364" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">CÓ</text>
      <text x="616" y="398" fill="#636b80" font-size="12" font-style="italic" font-family="'Instrument Serif', 'Lora', serif" text-anchor="middle">ops · admin · OPS_EMAILS · AC-4</text>

      <rect x="328" y="464" width="48" height="16" rx="2" fill="#f5f5f5"/>
      <text x="332" y="476" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.12em">KHÔNG</text>

      <!-- ============ Nút ============ -->
      <!-- Bắt đầu: yêu cầu đến -->
      <rect x="220" y="40" width="200" height="48" rx="24" fill="#f5f5f5"/>
      <rect x="220" y="40" width="200" height="48" rx="24" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="320" y="60" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Yêu cầu đến</text>
      <text x="320" y="76" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">GET /api/v1/deals</text>

      <!-- Hỏi 1: bearer -->
      <polygon points="320,128 460,192 320,256 180,192" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="320" y="188" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Bearer = OPS_API_TOKEN?</text>
      <text x="320" y="204" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">(token máy chủ không rỗng)</text>

      <!-- Hỏi 2: phiên ops -->
      <polygon points="320,304 480,376 320,448 160,376" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="320" y="364" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Phiên còn hạn và</text>
      <text x="320" y="380" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">role ops / admin hoặc</text>
      <text x="320" y="396" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">email trong OPS_EMAILS?</text>

      <!-- Kết thúc: 200 -->
      <rect x="640" y="252" width="240" height="64" rx="32" fill="#f5f5f5"/>
      <rect x="640" y="252" width="240" height="64" rx="32" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="760" y="280" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Truy vấn sale_offers</text>
      <text x="760" y="296" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">200 {data, meta}</text>

      <!-- Kết thúc: 401 (tiêu điểm) -->
      <rect x="160" y="496" width="320" height="64" rx="32" fill="#f5f5f5"/>
      <rect x="160" y="496" width="320" height="64" rx="32" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4"/>
      <text x="320" y="524" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Từ chối · không chạm sale_offers</text>
      <text x="320" y="540" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">401 {"error":"unauthorized"}</text>
      <text x="320" y="584" fill="#636b80" font-size="12" font-style="italic" font-family="'Instrument Serif', 'Lora', serif" text-anchor="middle">khách · bearer sai · token máy chủ trống · role user · phiên hết hạn — AC-1 · AC-3</text>

      <!-- ============ Chú giải ============ -->
      <line x1="40" y1="612" x2="920" y2="612" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <text x="40" y="628" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.18em">CHÚ GIẢI · HÌNH DẠNG MANG LOẠI NÚT</text>

      <rect x="40" y="644" width="24" height="12" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="72" y="654" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Bắt đầu / kết thúc (bầu dục)</text>

      <polygon points="260,650 272,644 284,650 272,656" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="296" y="654" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Câu hỏi rẽ nhánh (thoi)</text>

      <line x1="460" y1="652" x2="488" y2="652" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <text x="496" y="654" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Đường chặn — 401 trước truy vấn</text>

      <line x1="680" y1="652" x2="708" y2="652" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="716" y="654" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Nhánh</text>
    </svg>
  </div>
</body>
</html>
