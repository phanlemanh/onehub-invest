# Ca «GC-AC-n» ở app/tests/go-tai-khoan-kiem-cfg.test.tsx: HOME/PATH tạm, openclaw giả ghi argv vào spy.log, cấu hình chép
# trong thư mục tạm, DATABASE_URL cổng đóng, route DELETE thật (luật zalo-safety: phép đo không chạm openclaw thật).
evals:
