schema_version: 1
slug: suite-scripts-vao-luot-cham
evals:
  - id: E1
    criterion: AC-1
    executor: test
    cmd: config:executors.test.sstl_buoc_ci
    paths: ["scripts/suite-neu-doi.mjs", "scripts/suite-neu-doi.test.mjs", "_acceptance/config.yaml", ".github/workflows/ci-test.yml", "_acceptance/suite-scripts-vao-luot-cham/ma-tran.json"]
    expected: "Ca SSL-AC-1 xanh: ma trận viết trước (ma-tran.json#ci) phủ MỌI bước run, khoá env và services.*.image của job scripts rút từ ci-test.yml, mỗi phần tử một assert «tương đương» hay «miễn: lý do»; ảnh DB của job = ảnh của server nơi lệnh suite dựng DB trống, bản chính Node trùng. Đầu ra thật: lệnh suite chạy một tệp cố định thì DB test nối tới là DB vừa dựng (không phải oneinvest) và danh sách ca bị bỏ = danh sách ci-bo-qua.json của module scripts. Chiều đỏ cùng fixture: bản sao workflow thêm một bước run chưa có dòng → đỏ gọi tên bước; bản sao đổi ảnh services → đỏ gọi tên ảnh."
  - id: E2
    criterion: AC-2
    executor: test
    cmd: config:executors.test.sstl_chon
    paths: ["scripts/suite-neu-doi.mjs", "scripts/suite-neu-doi.test.mjs"]
    expected: "Ca SSL-AC-2 xanh trên tệp khai fixture (a: pipeline/x.mjs · b: app/** · c: luon): diff pipeline/x.mjs → chọn a, c (không b); diff app/y.ts → b, c; diff scripts/b.test.mjs → có b; diff tệp không vùng nào phủ → chỉ c; dòng in nêu lý do từng tệp («vùng: <tệp diff>», «luôn», «tệp test trong diff»)."
  - id: E3
    criterion: AC-3
    executor: test
    cmd: config:executors.test.sstl_khai
    paths: ["scripts/suite-scripts-vung.json", "scripts/suite-neu-doi.test.mjs", "scripts/*.test.mjs"]
    expected: "Ca SSL-AC-3 xanh trên kho thật: mọi scripts/*.test.mjs có đúng một dòng trong suite-scripts-vung.json, mỗi giá trị là \"luon\" hoặc mảng glob không rỗng, không dòng nào trỏ tệp đã mất. Chiều đỏ trên bản sao: bỏ một dòng → đỏ gọi tên tệp thiếu và bộ chọn coi tệp ấy là luon; thêm dòng cho tệp không tồn tại → đỏ gọi tên; mảng rỗng → đỏ gọi tên."
  - id: E4
    criterion: AC-4
    executor: test
    cmd: config:executors.test.sstl_rao
    paths: ["scripts/suite-neu-doi.mjs", "scripts/suite-neu-doi.test.mjs"]
    expected: "Ca SSL-AC-4 xanh: ma trận viết trước một assert cho mỗi tệp hạ tầng — scripts/lib/x.mjs, db/migrations/999_x.sql, scripts/ci-db-init.mjs, scripts/ci-bo-qua.json, .github/workflows/ci-test.yml, scripts/suite-scripts-vung.json, package.json và package-lock.json của app, pipeline, agent — mỗi tệp đơn lẻ trong diff → trọn bộ kèm lý do gọi tên tệp; diff không chọn tệp nào → kết quả vẫn mang bước node --check. Đối chứng: một tệp scripts/ thường và scripts/lib-khac/x.mjs → không trọn bộ."
  - id: E5
    criterion: AC-5
    executor: test
    cmd: config:executors.test.sstl_khop
    paths: ["scripts/suite-scripts-vung.json", "_acceptance/suite-scripts-vao-luot-cham/ma-tran.json", "scripts/suite-neu-doi.test.mjs"]
    expected: "Ca SSL-AC-5 xanh: tệp ma-tran.json đánh dấu liệt-kê-không-khoanh ⇔ suite-scripts-vung.json là luon (một assert mỗi tệp, 43 assert); 15/15 tệp có chủ thể cùng thân tên có chủ thể khớp một glob trong vùng khai (gọi tên từng tệp); vùng của db-thu.test.mjs khớp app/tests/x.test.tsx, app/probes/x.test.tsx, pipeline/a/b.test.mjs, agent/tests/x.test.ts và không phải \"**\" hay luon. Chiều đỏ: bản sao bỏ chủ thể khỏi vùng của dung-worktree-cham → đỏ gọi tên dung-worktree-cham."
  - id: E6
    criterion: AC-6
    executor: script
    cmd: config:executors.test.sstl_tai_hien
    long_running: 60
    paths: ["scripts/suite-neu-doi.mjs", "scripts/suite-scripts-vung.json", "_acceptance/suite-scripts-vao-luot-cham/probes/tai-hien.sh"]
    expected: "Probe tai-hien.sh chạy bộ chọn và lệnh suite của HEAD (đọc tệp khai của HEAD) với --root trỏ worktree tạm của từng đỉnh cũ, in sha bộ chọn và lý do chọn từng tệp; thoát 0 khi: ở 5b02c3de bộ chọn có scripts/s05-khoa-nap.test.mjs và lệnh suite thoát khác 0 với ca (5) của tệp ấy trong danh sách đỏ; ở f3fecd5f bộ chọn có scripts/db-thu.test.mjs và lệnh thoát khác 0 với ca DT-AC-7 trong danh sách đỏ. Worktree tạm xoá khi xong. Thoát 1 gọi tên đỉnh nếu ca đỏ kỳ vọng không xuất hiện, tệp không được chọn, hay sha bộ chọn khác HEAD."
  - id: E7
    criterion: AC-7
    executor: script
    cmd: config:executors.test.sstl_app_src
    long_running: 45
    paths: ["scripts/suite-neu-doi.mjs", "scripts/suite-scripts-vung.json", "_acceptance/suite-scripts-vao-luot-cham/probes/do-app-src.sh"]
    expected: "Probe do-app-src.sh trên nhánh tạm chỉ đổi đúng app/src/lib/ops/registry/doc.ts: phần node --test của tập chọn ≤ 120 giây; in số tệp chọn, giây của lượt và giây trọn bộ đo cùng máy cùng lúc; thoát 1 nếu vượt 120 giây."
  - id: E8
    criterion: AC-8
    executor: test
    cmd: config:executors.test.sstl_bao_thu
    paths: ["scripts/suite-neu-doi.mjs", "scripts/suite-neu-doi.test.mjs"]
    expected: "Ca SSL-AC-8 xanh: ref gốc vắng → trọn bộ, dòng in «không giải được gốc»; thư mục không phải kho git → trọn bộ; diff rỗng → trọn bộ; tệp khai hỏng JSON → trọn bộ, dòng in «không đọc được tệp khai»; SUITE_NEU_DOI=chay → trọn bộ, dòng in «ép chạy». Đối chứng: cùng kho, diff chạm một vùng → không trọn bộ."
  - id: E9
    criterion: AC-9
    executor: test
    cmd: config:executors.test.sstl_cau_hinh
    paths: ["_acceptance/config.yaml", "scripts/suite-neu-doi.test.mjs", "_acceptance/s4-suite-theo-vung/probes/cau-hinh-khong-doi.sh"]
    expected: "Ca S4V-AC-6 xanh với tám key (bảy key cũ + executors.suite.scripts) và probe cau-hinh-khong-doi.sh xanh: dòng cũ bị xoá/sửa chỉ là suite_keys, executors.test.scripts cùng mọi lệnh gốc nguyên byte so với merge-base. Chiều đỏ của S4V-AC-6 giữ nguyên (lệnh bọc app lệch một ký tự → đỏ gọi tên «app»)."
  - id: E10
    criterion: AC-10
    executor: test
    cmd: config:executors.test.scripts
    expected: "node --test scripts/*.test.mjs thoát 0."
