schema_version: 1
feature_slug: do1-giu-dau-doi-thang
evals:
  - id: E1
    criterion: AC-1
    executor: test
    cmd: config:executors.test.do1_dd
    long_running: 30
    paths: [pipeline/do-hang-ngay.mjs, pipeline/scripts/do-hang-ngay-doi-thang.itest.mjs]
    expected: "exit 0; ca «DD-AC-1 đổi thang hai lượt» trong BEGIN … ROLLBACK trên DB của riêng lượt (087 nạp khi thiếu): fixture viết trước ba đơn vị thang-2310 + ảnh chụp thang-0811 ngày D + một tin S03 đủ trường có tiền tố riêng; doHangNgay THẬT ngày D write; đổi giá tin về NULL (B1 → B0); doHangNgay THẬT ngày D lần hai; dòng do1-chuyen-bac của D đọc từ dq_check_results (không từ giá trị trả về) so trọn {status: skip, ly_do: doi-thang, thang: {ma: thang-0811, tu_ngay: D}, don_vi: số đơn vị lần hai}; count data_level_change ngày D = 0; bậc tin trong data_level_unit = B0. Chiều đỏ cùng fixture: dotBien «bo-giu-moc» (bỏ nhận ngày lập mốc theo dấu và ngày áp) → lần hai ghi pass và một dòng chuyển; ca phụ ghim «DD-AC-1 lượt hai mất dấu doi-thang»."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E2
    criterion: AC-2
    executor: test
    cmd: config:executors.test.do1_dd
    long_running: 30
    paths: [pipeline/do-hang-ngay.mjs, pipeline/scripts/do-hang-ngay-doi-thang.itest.mjs]
    expected: "exit 0; ca «DD-AC-2 ngày sau»: tiếp fixture của DD-AC-1 sau hai lượt ngày D; đặt lại giá tin (B0 → B1); doHangNgay THẬT ngày D+1; dòng data_level_change D+1 của tiền tố fixture so trọn [[tin:<id>, B0, B1, len]] (so với trạng thái cuối ngày D, không phải đầu ngày D); dòng DO1 D+1 status pass mang thang {ma: thang-0811, tu_ngay: D}. Chiều đỏ: cùng fixture, ngày D chỉ chạy một lượt (trạng thái cuối D là B1) → D+1 không có dòng của tin; ca phụ ghim «DD-AC-2 ngày sau so sai mốc»."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E3
    criterion: AC-3
    executor: test
    cmd: config:executors.test.do1_dd
    long_running: 30
    paths: [pipeline/do-hang-ngay.mjs, pipeline/scripts/do-hang-ngay-doi-thang.itest.mjs]
    expected: "exit 0; ca «DD-AC-3 lập mốc đầu hai lượt» chạy hai biến thể trên cùng fixture: (a) ảnh chụp thang-0811 nhỏ nhất ở ngày khác D, (b) ảnh chụp thang-0811 nhỏ nhất CHÍNH là D (ô «bảng rỗng × ngày áp = D» của bảng 1 design §2); mỗi biến thể: xoá data_level_unit, data_level_change trong giao dịch; doHangNgay THẬT ngày D hai lượt có tin đổi bậc ở giữa; dòng DO1 D đọc từ dq_check_results sau CẢ HAI lượt so trọn {status: skip, ly_do: lap-moc}; count data_level_change D = 0. Ca «DD bảng 1»: ma trận viết trước năm hàng của bảng 1 (bảng đơn vị × ngày áp × dấu → nhãn), mỗi ô một lượt doHangNgay THẬT trên fixture dựng riêng, nhãn ly_do (hoặc pass) so trọn với cột Nhãn; đếm số ô đã kiểm bằng đúng số ô viết trước. Chiều đỏ: dotBien «ngay-ap-truoc-rong» (luật ngày áp đứng trước bảng rỗng) → biến thể (b) ra doi-thang; ca phụ ghim «DD-AC-3 bảng rỗng ngày áp thành doi-thang»; dotBien «bo-giu-moc» → lượt hai pass; ca phụ ghim «DD-AC-3 lượt hai mất dấu lap-moc»."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E4
    criterion: AC-4
    executor: test
    cmd: config:executors.test.do1_dd
    long_running: 30
    paths: [pipeline/do-hang-ngay.mjs, pipeline/scripts/do-hang-ngay-doi-thang.itest.mjs]
    expected: "exit 0; ca «DD-AC-4 dấu đã mất»: data_level_unit toàn thang-0811, ảnh chụp thang-0811 nhỏ nhất ngày D, chèn sẵn một dòng do1-chuyen-bac pass ngày D không dấu; một tin đổi bậc; doHangNgay THẬT ngày D → dòng DO1 D so trọn {status: skip, ly_do: doi-thang, thang.tu_ngay: D}; data_level_change D không có dòng của tin vừa đổi (không ghi thêm). Cùng ca, đối chứng dương: ngày E ≠ D (ảnh chụp vẫn nhỏ nhất ngày D), cùng bảng đơn vị, tin đổi bậc → DO1 E pass và có đúng một dòng chuyển của tin. Chiều đỏ: dotBien «bo-ngay-ap» (chỉ nhận theo dấu) → ngày D ra pass và có dòng của tin; ca phụ ghim «DD-AC-4 ngày áp mất dấu thì so như thường»."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E5
    criterion: AC-5
    executor: test
    cmd: config:executors.test.do1_dd
    long_running: 30
    paths: [pipeline/do-hang-ngay.mjs, pipeline/scripts/do-hang-ngay-doi-thang.itest.mjs]
    expected: "exit 0; ca «DD-AC-5 dòng có sẵn của ngày lập mốc», hai nhánh của Hỏi-1 trên cùng fixture (đổi thang ngày D như DD-AC-1, chèn trước ba dòng data_level_change ngày D tiền tố riêng và hai dòng ngày D-1; chụp tập (snap_date, unit_key, from_level, to_level) toàn bảng trước khi chạy): nhánh «xoa» (mặc định, hằng HOI1 của do-hang-ngay.mjs) — doHangNgay THẬT ngày D → count ngày D = 0; nhánh «giu» (tham số hoi1: giu) → ngày D còn đúng ba dòng chèn sẵn, không thêm dòng; cả hai nhánh: mọi ngày khác D so trọn trước = sau. Ca phụ đọc hằng HOI1 và in giá trị đang ship (khớp câu trả lời Hỏi-1 ghi ở sổ quyết định gate1). Chiều đỏ: dotBien «bo-don-ngay» ở nhánh xoa → ba dòng ngày D còn; ca phụ ghim «DD-AC-5 ngày lập mốc còn dòng chuyển»."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E6
    criterion: AC-6
    executor: test
    cmd: config:executors.test.tb_app_db
    layer: backend-effect
    paths: [pipeline/do-hang-ngay.mjs, app/src/lib/do-hang-ngay.ts, app/src/components/ops/quality/do-hang-ngay.tsx, app/tests/thang-bac-db.itest.tsx]
    expected: "exit 0; ca «DD-AC-6 hai lượt cùng ngày lên khối DO1» trong giao dịch có 087: data_level_unit thang-2310 + ảnh chụp thang-0811 ngày D; doHangNgay THẬT (pipeline) ngày D write; đổi giá một tin S03 chèn trong giao dịch; doHangNgay THẬT lần hai cùng ngày; loadDo1 THẬT của app đọc; khối DoHangNgay dựng bằng renderToStaticMarkup có data-do1-thang, «Thang bậc 08/11», «lần hạ một lần», «áp từ D —». Chiều đỏ cùng ca: chạy lại với dotBien «bo-giu-moc» → HTML không còn «lần hạ một lần» (dòng pass vẫn mang thang nên data-do1-thang vẫn hiện; câu lập mốc là thứ mất); ca phụ ghim «DD-AC-6 lượt hai mất dòng thang trên khối DO1»."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E7
    criterion: AC-7
    executor: test
    cmd: config:executors.test.tb_app_db
    layer: backend-effect
    paths: [app/src/lib/data-flow-queries.ts, app/src/lib/do-hang-ngay.ts, app/tests/thang-bac-db.itest.tsx]
    expected: "exit 0; ca «TB-AC-11 lược đồ chưa có 087» trên DB của riêng lượt (bản chép máy thu — nay đã có 087): in tiền đề (lược đồ gốc có/không 087; bản chép có/không dòng DO1 mang thang); tập đối tượng suy từ tệp: hàm có CREATE … FUNCTION trong db/migrations/087_thang_bac_moi.sql mà không tệp migration số nhỏ hơn nào tạo, cộng cột ADD COLUMN của 087 — so trọn với tập viết trước {fn offer_located, fn offer_unit_key, fn unit_data_level, fn data_level_units, col data_level_snapshot.scale, col data_level_unit.scale}; trong giao dịch DROP tập ấy khi có; chèn tường minh một dòng do1-chuyen-bac MANG thang (đối chứng dương: HTML khối DO1 có data-do1-thang), rồi một dòng đời trước không thang mới hơn; hàm đọc bản ghi THẬT và loadDo1 THẬT không ném lỗi; mọi bậc ⊆ {B0, B1}; chuyenBac.thang undefined; HTML không có data-do1-thang; ROLLBACK. Chiều đỏ: getDataFlow THẬT với hàm query bọc đột biến đổi lần đầu `o.offer_id` trong câu SQL thành `offer_located(o.offer_id)` (câu không có `o.offer_id` thì ca đỏ báo «đột biến không áp được») → lỗi 42883, ghim «TB-AC-11 app gọi hàm của 087»; chiều đỏ thứ hai: bỏ bước chèn dòng đời trước → ca phụ ghim «TB-AC-11 dòng DO1 đời trước mà có thang»."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E8
    criterion: AC-8
    executor: test
    cmd: config:executors.test.do1_dd
    long_running: 30
    paths: [pipeline/do-hang-ngay.mjs, pipeline/scripts/do-hang-ngay-doi-thang.itest.mjs]
    expected: "exit 0; ca «DD-AC-8 lệnh sửa ngày đổi thang» gọi hàm suaNgayDoiThang THẬT (cùng hàm của cờ --sua-ngay-doi-thang; main in ngày và số dòng): fixture ngày áp D (ảnh chụp thang-0811 nhỏ nhất), ba dòng data_level_change ngày D + hai dòng ngày D+1, dòng DO1 ngày D pass không dấu, băm data_level_unit trước; write false → trả {ngay: D, xoa: 3} và DB không đổi (đếm, băm lại bằng nhau); write true nhánh «xoa» (hằng HOI2 mặc định) → count D = 0, D+1 giữ hai dòng, dòng DO1 D so trọn {status: skip, ly_do: doi-thang, thang: {ma: thang-0811, tu_ngay: D}}, băm data_level_unit trước = sau; write true nhánh «giu» → dòng DO1 D như trên, count D = 3. Từ chối: thêm dòng do1-chuyen-bac skip doi-thang ở ngày D-2 → ném lỗi ghim «DD-AC-8 ngày áp D lệch ngày có dấu D-2», DB không đổi. Trong giao dịch bỏ data_level_units() → {bo_qua: chua-ap-087} không ghi; không ảnh chụp thang-0811 → {bo_qua: chua-co-thang-moi}. Chiều đỏ: dotBien «sua-moi-ngay» (xoá không lọc ngày) → D+1 mất dòng; ca phụ ghim «DD-AC-8 lệnh sửa đụng ngày khác»."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
