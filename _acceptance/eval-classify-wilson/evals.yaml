schema_version: 1
feature_slug: eval-classify-wilson
evals:
  - id: E1
    criterion: AC-1
    executor: test
    cmd: config:executors.test.ecw_pipeline
    paths: [pipeline/lib/eval-classify.mjs, pipeline/lib/eval-classify.test.mjs]
    expected: "exit 0; ma trận viết trước 10 mốc (k/n → đạt/không đạt ngưỡng): 100/100, 148/150, 197/200 đạt 0,95; 99/100, 147/150, 196/200 không đạt 0,95; 96/100, 143/150 đạt 0,90; 95/100, 142/150 không đạt 0,90 — số assert = 10, cộng giá trị cận dưới làm tròn 4 chữ số khớp 0,9630 · 0,9455 · 0,9527 · 0,9429 · 0,9568 · 0,9497 · 0,9016 · 0,8882 · 0,9068 · 0,8983; wilsonDuoi(0, 0) === null; đối chứng đỏ: bản chép lib dùng z = 1,645 → phép đo bắt ('WILSON LECH MOC 99/100')"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
