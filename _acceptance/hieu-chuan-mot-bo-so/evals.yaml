schema_version: 1
feature_slug: hieu-chuan-mot-bo-so
# Ca test «HC-AC-n» ở app/tests/hieu-chuan.test.tsx: hàm thuần bằng ma trận viết trước; truy vấn trong
# app/src/lib/calibration.ts chạy trên fixture trong BEGIN…ROLLBACK (khoá 33033); thẻ/bảng vẽ trong jsdom.
evals:
  - id: E1
    criterion: AC-1
    executor: test
    cmd: config:executors.test.app_ui
    paths: [app/src/lib/calibration.ts, app/tests/hieu-chuan.test.tsx]
    expected: "exit 0; ca 'HC-AC-1 market đại diện' ma trận viết trước pickRepresentative 4 dòng (hai market 10/3 → market 10; hoà 5/5 → mã nhỏ hơn; một market 0 cạnh market 7 → market 7; danh sách rỗng → null) và trả kèm số market; ca fixture: khu vực có 2 market S02 (một rỗng) gọi hai lần → cùng airdna_id, là market có listing; chiều đỏ: câu cũ LIMIT 1 không ORDER BY trả market rỗng ít nhất một lần khi xếp bảng nghịch"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E2
    criterion: AC-2
    executor: test
    cmd: config:executors.test.app_ui
    paths: [app/src/lib/calibration.ts, app/src/lib/queries.ts, app/tests/hieu-chuan.test.tsx]
    expected: "exit 0; ca 'HC-AC-2 một số tự thu' trên fixture (khu vực cha + phường con có listing): số listing tự thu của khu vực trả từ nguồn thẻ, nguồn Độ phủ và nguồn bảng toàn quốc bằng nhau và bằng số listing fixture trong cây; chiều đỏ: định nghĩa cũ của thẻ (max listing_count market_metrics) cho số khác trên cùng fixture"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E3
    criterion: AC-3
    executor: test
    cmd: config:executors.test.app_ui
    paths: [app/src/components/ops/quality-tables.tsx, app/tests/hieu-chuan.test.tsx]
    expected: "exit 0; ca 'HC-AC-3 định nghĩa tự thu' vẽ ba bảng (thẻ hiệu chuẩn, Độ phủ, toàn quốc) trong jsdom: mỗi bảng có dòng mô tả chứa đúng câu định nghĩa TU_THU_DINH_NGHIA export từ calibration.ts"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E4
    criterion: AC-4
    executor: test
    cmd: config:executors.test.app_ui
    paths: [app/src/lib/calibration.ts, app/src/components/ops/quality-tables.tsx, app/tests/hieu-chuan.test.tsx]
    expected: "exit 0; ca 'HC-AC-4 mẫu mỏng' ma trận viết trước isThin 5 dòng (0, 1, 4 → mỏng; 5, 6 → không) và vẽ thẻ với 1 listing → có chữ 'mẫu mỏng', thẻ với 5 listing → không có"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E5
    criterion: AC-5
    executor: test
    cmd: config:executors.test.app_ui
    paths: [app/src/lib/calibration.ts, app/src/app/ops/quality/page.tsx, app/tests/hieu-chuan.test.tsx]
    expected: "exit 0; ca 'HC-AC-5 gộp thị trường chưa có số' : splitCalibrated trên 4 thị trường viết trước (đủ số; chỉ điểm; chỉ số tự thu; trống hết) → calibrated 3, empty ['trống hết']; vẽ dòng EmptyCalibration → đúng một dòng 'Chưa có số: …' liệt tên; chiều đỏ: bộ lọc cũ data !== null giữ cả 4"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E6
    criterion: AC-6
    executor: test
    cmd: config:executors.test.app_ui
    paths: [app/src/lib/calibration.ts, app/src/app/ops/quality/page.tsx, app/tests/hieu-chuan.test.tsx]
    expected: "exit 0; ca 'HC-AC-6 đếm' : nhãn đầu trang từ splitCalibrated(fixture E5) là '3 thị trường hiệu chuẩn'; quét page.tsx (bỏ comment): số đầu trang và danh sách thẻ cùng lấy từ một biến kết quả splitCalibrated"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E7
    criterion: AC-7
    executor: script
    cmd: config:executors.script.hieu_chuan_do
    paths: [scripts/hieu-chuan-do.mjs, app/src/lib/calibration.ts, app/src/lib/queries.ts]
    expected: "exit 0; tsx của app, import hàm thật, DB local chỉ đọc: 'ok tự thu bằng nhau ở ba nguồn cho <n> khu vực'; 'ok chọn market đại diện hai lần cùng kết quả (<k> khu vực nhiều market)' với k ≥ 1 (k = 0 → FAIL); 'ok số thị trường hiệu chuẩn = số thị trường có số (<m>)'; dòng 'mẫu mỏng: …'; đối chứng: định nghĩa cũ ba nguồn cho ít nhất một khu vực lệch nhau → 'ok đối chứng: cũ lệch ở <j> khu vực'"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E8
    criterion: AC-8
    executor: judgment
    inputs: [CONTEXT.md]
    paths: [CONTEXT.md]
    question: "CONTEXT.md có mục thuật ngữ cho «Listing tự thu» và «Mẫu mỏng» — mỗi mục đủ nhãn, tên trong code, định nghĩa và từ tránh dùng — và định nghĩa «Listing tự thu» là số listing đang theo dõi trong cả cây khu vực, «Mẫu mỏng» là dưới 5 listing không?"
    expected: "Có đủ hai mục, mỗi mục bốn phần, nghĩa đúng như câu hỏi."
    evidence_required: [run_id, verdict, judges]
