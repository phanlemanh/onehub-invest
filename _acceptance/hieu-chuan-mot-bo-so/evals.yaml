schema_version: 1
feature_slug: hieu-chuan-mot-bo-so
# Ca test «HC-AC-n» ở app/tests/hieu-chuan.test.tsx: hàm thuần bằng ma trận viết trước; truy vấn trong
# app/src/lib/calibration.ts chạy trên fixture trong BEGIN…ROLLBACK (khoá 33033); thẻ/bảng vẽ trong jsdom.
evals:
  - id: E1
    criterion: AC-1
    executor: test
    cmd: config:executors.test.app_ui
    paths: [app/src/lib/calibration.ts, app/tests/hieu-chuan.test.tsx]
    expected: "exit 0; ca 'HC-AC-1 market đại diện' ma trận viết trước pickRepresentative 4 dòng (hai market 10/3 → market 10; hoà 5/5 → mã nhỏ hơn; một market 0 cạnh market 7 → market 7; danh sách rỗng → null) kèm số market; ca fixture: khu vực có 2 market S02 (một rỗng) gọi hai lần → cùng airdna_id, là market có listing; vẽ thẻ trong jsdom → có chữ nguyên văn 'đại diện cho 2 market S02'; chiều đỏ: câu cũ LIMIT 1 không ORDER BY trả market rỗng khi xếp bảng nghịch"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E2
    criterion: AC-2
    executor: test
    cmd: config:executors.test.app_ui
    paths: [app/src/lib/calibration.ts, app/src/lib/queries.ts, app/tests/hieu-chuan.test.tsx]
    expected: "exit 0; ca 'HC-AC-2 một số tự thu' trên fixture (khu vực cha + phường con có listing): gọi ĐÚNG ba hàm truy vấn nuôi ba bảng (getAirdnaComparison, getTruthfulCoverage, getAirdnaMarkets), vẽ ba bảng trong jsdom và so SỐ ĐÃ VẼ của dòng tự thu khu vực ấy — bằng nhau và bằng số listing fixture trong cây (theo Hỏi-3); chiều đỏ: định nghĩa cũ của thẻ (max listing_count market_metrics) vẽ ra số khác trên cùng fixture"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E3
    criterion: AC-3
    executor: test
    cmd: config:executors.test.app_ui
    paths: [app/src/components/ops/quality-tables.tsx, app/tests/hieu-chuan.test.tsx]
    expected: "exit 0; ca 'HC-AC-3 định nghĩa tự thu' vẽ ba bảng (thẻ hiệu chuẩn, Độ phủ, toàn quốc) trong jsdom: mỗi bảng có dòng mô tả chứa đúng câu định nghĩa TU_THU_DINH_NGHIA export từ calibration.ts, và hằng ấy bằng nguyên văn chữ người chốt ở Hỏi-4 (mặc định 'Listing tự thu: số listing đang theo dõi trong cả khu vực (gồm phường con)')"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E4
    criterion: AC-4
    executor: test
    cmd: config:executors.test.app_ui
    paths: [app/src/lib/calibration.ts, app/src/components/ops/quality-tables.tsx, app/tests/hieu-chuan.test.tsx]
    expected: "exit 0; ca 'HC-AC-4 mẫu mỏng' ma trận viết trước isThin trên cỡ mẫu metrics 5 dòng (0, 1, 4 → mỏng; 5, 6 → không — ngưỡng theo Hỏi-2); ca fixture: khu vực cây 6 listing nhưng metrics 1 listing → thẻ vẽ có Badge chữ nguyên văn 'mẫu mỏng'; khu vực metrics 5 → không có; chiều đỏ: cờ tính trên số listing trong cây bỏ sót ca cây 6 / metrics 1"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E5
    criterion: AC-5
    executor: test
    cmd: config:executors.test.app_ui
    paths: [app/src/lib/calibration.ts, app/src/app/ops/quality/page.tsx, app/tests/hieu-chuan.test.tsx]
    expected: "exit 0; ca 'HC-AC-5 gộp thị trường chưa có số' : splitCalibrated trên 5 thị trường viết trước (đủ số; chỉ điểm; chỉ số tự thu; trống hết = null; toàn 0 = score 0, ADR 0, công suất 0, listing 0) → calibrated 3, empty ['trống hết', 'toàn 0'] (0 tính là chưa có số); vẽ dòng → đúng một dòng 'Chưa có số: …' liệt hai tên; chiều đỏ: bộ lọc cũ data !== null giữ cả 5"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E6
    criterion: AC-6
    executor: test
    cmd: config:executors.test.app_ui
    paths: [app/src/lib/calibration.ts, app/src/app/ops/quality/page.tsx, app/tests/hieu-chuan.test.tsx]
    expected: "exit 0; ca 'HC-AC-6 đếm' : nhãn đầu trang từ splitCalibrated(fixture E5) là nguyên văn '3 thị trường hiệu chuẩn'; quét page.tsx (bỏ comment): số đầu trang và danh sách thẻ cùng lấy từ một biến kết quả splitCalibrated"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E7
    criterion: AC-7
    executor: script
    cmd: config:executors.script.hieu_chuan_do
    paths: [scripts/hieu-chuan-do.mjs, app/src/lib/calibration.ts, app/src/lib/queries.ts]
    expected: "exit 0; tsx của app, import hàm thật, DB local chỉ đọc: 'ok tự thu bằng nhau ở ba nguồn cho <n> khu vực' (so số ba hàm truy vấn trả, không qua hàm trợ giúp chung); 'ok chọn market đại diện hai lần cùng kết quả (<k> khu vực nhiều market)' k ≥ 1 (k = 0 → FAIL); số thị trường có số đếm bằng một câu SQL ĐỘC LẬP (không gọi splitCalibrated) rồi so với splitCalibrated → 'ok số thị trường hiệu chuẩn = <m>'; dòng 'mẫu mỏng: …' theo cỡ mẫu Hỏi-2; đối chứng: định nghĩa cũ cho ít nhất một khu vực lệch → 'ok đối chứng: cũ lệch ở <j> khu vực'"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E8
    criterion: AC-8
    executor: judgment
    inputs: [CONTEXT.md]
    paths: [CONTEXT.md]
    question: "CONTEXT.md có mục thuật ngữ cho «Listing tự thu», «Mẫu mỏng» và «Thị trường hiệu chuẩn» — mỗi mục đủ nhãn, tên trong code, định nghĩa và từ tránh dùng — với nghĩa khớp chữ trên trang theo Hỏi-2/3/4 («Listing tự thu» = listing đang theo dõi trong cả cây khu vực; «Mẫu mỏng» = cỡ mẫu sinh ADR/công suất dưới ngưỡng đã chốt; «Thị trường hiệu chuẩn» = thị trường có ít nhất một số, thị trường còn lại gộp ở dòng «Chưa có số»)?"
    expected: "Có đủ ba mục, mỗi mục bốn phần, nghĩa khớp chữ đã chốt."
    evidence_required: [run_id, verdict, judges]
