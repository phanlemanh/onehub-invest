<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ảnh chụp trang</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Lora:ital,wght@0,400;1,400&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Lora', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1000px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.25;
      color: var(--color-ink);
      margin-bottom: 0.5rem;
    }
    .sub {
      font-size: 0.875rem;
      color: var(--color-muted);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 760px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Cổng Phạm vi · hieu-chuan-mot-bo-so · Hỏi-1</p>
    <h1>Ảnh chụp vùng Hiệu chuẩn: tách thành việc phụ, hay dựng bước chụp có phiên ngay trong ON10</h1>
    <p class="sub">Bước chụp hiện không đăng nhập được /ops · nhánh A máy khuyên · AC-4, AC-5, AC-6 (phần nhìn)</p>

    <svg viewBox="0 56 1000 488" xmlns="http://www.w3.org/2000/svg">
      <rect x="0" y="56" width="1000" height="488" fill="#f5f5f5"/>

      <!-- ===================== CỘT NHÁNH MÁY KHUYÊN (focal 1) ===================== -->
      <rect x="328" y="80" width="316" height="376" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4"/>

      <!-- ===================== KẺ BẢNG ===================== -->
      <line x1="32" y1="80" x2="968" y2="80" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <line x1="32" y1="152" x2="968" y2="152" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <line x1="32" y1="232" x2="968" y2="232" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <line x1="32" y1="296" x2="968" y2="296" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <line x1="32" y1="376" x2="968" y2="376" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <line x1="32" y1="456" x2="968" y2="456" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <line x1="652" y1="80" x2="652" y2="456" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>

      <!-- ===================== ĐẦU CỘT ===================== -->
      <text x="48" y="124" fill="#4f5d75" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.18em">KHÍA CẠNH</text>
      <text x="48" y="140" fill="#636b80" font-size="9" font-family="'Geist', sans-serif">cái gì đổi giữa hai nhánh</text>

      <rect x="440" y="88" width="88" height="16" rx="2" fill="transparent" stroke="rgba(235,108,54,0.60)" stroke-width="0.8"/>
      <text x="484" y="100" fill="#ba4513" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">MÁY KHUYÊN</text>
      <text x="484" y="124" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">A · Bỏ ảnh ở vòng này, mở việc phụ</text>
      <text x="484" y="140" fill="#636b80" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">ON10 đo phần nhìn bằng vẽ trong jsdom</text>

      <text x="812" y="100" fill="#4f5d75" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.18em">NHÁNH KHÁC</text>
      <text x="812" y="124" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">B · Chụp có phiên ngay trong ON10</text>
      <text x="812" y="140" fill="#636b80" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">thêm bước đăng nhập tài khoản thử</text>

      <!-- ===================== HÀNG 1 · Phép đo phần nhìn ===================== -->
      <text x="48" y="188" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Phép đo phần nhìn</text>
      <text x="48" y="204" fill="#636b80" font-size="9" font-family="'Geist', sans-serif">phần nhìn của AC-4, AC-5, AC-6</text>

      <text x="484" y="188" fill="#2d3142" font-size="11" font-family="'Geist', sans-serif" text-anchor="middle">Vẽ trong jsdom,</text>
      <text x="484" y="204" fill="#2d3142" font-size="11" font-family="'Geist', sans-serif" text-anchor="middle">không ảnh trang thật</text>

      <text x="812" y="188" fill="#2d3142" font-size="11" font-family="'Geist', sans-serif" text-anchor="middle">Đăng nhập tài khoản thử,</text>
      <text x="812" y="204" fill="#2d3142" font-size="11" font-family="'Geist', sans-serif" text-anchor="middle">rồi chụp vùng Hiệu chuẩn</text>

      <!-- ===================== HÀNG 2 · Tiêu chí và eval ===================== -->
      <text x="48" y="260" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Tiêu chí và eval</text>
      <text x="48" y="276" fill="#636b80" font-size="9" font-family="'Geist', sans-serif">so với hồ sơ hiện tại</text>

      <text x="484" y="268" fill="#2d3142" font-size="11" font-family="'Geist', sans-serif" text-anchor="middle">Không thêm</text>

      <rect x="704" y="252" width="96" height="24" rx="4" fill="#ffffff" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <text x="752" y="268" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">+1 tiêu chí</text>
      <rect x="816" y="252" width="104" height="24" rx="4" fill="#ffffff" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <text x="868" y="268" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">+1 eval ảnh</text>

      <!-- ===================== HÀNG 3 · Hạ tầng chụp có phiên ===================== -->
      <text x="48" y="332" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Hạ tầng chụp /ops</text>
      <text x="48" y="348" fill="#636b80" font-size="9" font-family="'Geist', sans-serif">chụp trang cần phiên ops</text>

      <text x="484" y="324" fill="#2d3142" font-size="11" font-family="'Geist', sans-serif" text-anchor="middle">Việc phụ «chụp /ops có phiên ops»</text>
      <text x="484" y="340" fill="#2d3142" font-size="11" font-family="'Geist', sans-serif" text-anchor="middle">(tài khoản thử local),</text>
      <text x="484" y="356" fill="#2d3142" font-size="11" font-family="'Geist', sans-serif" text-anchor="middle">phục vụ các hàng Ops sau</text>

      <text x="812" y="332" fill="#2d3142" font-size="11" font-family="'Geist', sans-serif" text-anchor="middle">Dựng ngay trong ON10,</text>
      <text x="812" y="348" fill="#2d3142" font-size="11" font-family="'Geist', sans-serif" text-anchor="middle">một hàng sửa số</text>

      <!-- ===================== HÀNG 4 · Giá phải trả ===================== -->
      <text x="48" y="412" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Giá phải trả</text>
      <text x="48" y="428" fill="#636b80" font-size="9" font-family="'Geist', sans-serif">nếu chọn nhánh này</text>

      <text x="484" y="412" fill="#2d3142" font-size="11" font-family="'Geist', sans-serif" text-anchor="middle">Lần thứ ba trong mốc ký không ảnh;</text>
      <text x="484" y="428" fill="#2d3142" font-size="11" font-family="'Geist', sans-serif" text-anchor="middle">lưới trước-merge đã cảnh báo ngưỡng siết</text>

      <text x="812" y="412" fill="#2d3142" font-size="11" font-family="'Geist', sans-serif" text-anchor="middle">Vòng dài hơn; dựng hạ tầng chụp</text>
      <text x="812" y="428" fill="#2d3142" font-size="11" font-family="'Geist', sans-serif" text-anchor="middle">trong một hàng sửa số</text>

      <!-- ===================== CHÚ GIẢI ===================== -->
      <line x1="32" y1="484" x2="968" y2="484" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <text x="32" y="504" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.18em">CHÚ GIẢI</text>

      <rect x="32" y="516" width="16" height="16" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4"/>
      <text x="56" y="528" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">nhánh máy khuyên</text>

      <rect x="188" y="516" width="16" height="16" rx="2" fill="#ffffff" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <text x="212" y="528" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">phần thêm vào hồ sơ nghiệm thu</text>
    </svg>
  </div>
</body>
</html>
