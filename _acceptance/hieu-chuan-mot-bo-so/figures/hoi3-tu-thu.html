<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Định nghĩa tự thu</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Lora:ital,wght@0,400;1,400&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Lora', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1000px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.25;
      color: var(--color-ink);
      margin-bottom: 0.5rem;
    }
    .sub {
      font-size: 0.875rem;
      color: var(--color-muted);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 760px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Cổng Phạm vi · hieu-chuan-mot-bo-so · Hỏi-3</p>
    <h1>«Tự thu» là một số chung cho ba bảng, hay ba số mang ba nhãn</h1>
    <p class="sub">Số của Hà Nội ở ba bảng vùng Hiệu chuẩn · nhánh A máy khuyên · AC-2, AC-3</p>

    <svg viewBox="0 56 1000 560" xmlns="http://www.w3.org/2000/svg">

      <text x="48" y="160" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Hà Nội ra 257 · 267 · 39</text>
      <rect x="336" y="96" width="200" height="88" rx="4" fill="#f5f5f5" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <text x="436" y="116" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">THẺ HIỆU CHUẨN</text>
      <text x="436" y="148" fill="#4f5d75" font-size="24" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">257</text>
      <text x="436" y="168" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">«tự thu»</text>
      <rect x="548" y="96" width="200" height="88" rx="4" fill="#f5f5f5" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>

      <rect x="216" y="236" width="88" height="16" rx="2" fill="transparent" stroke="rgba(235,108,54,0.60)" stroke-width="0.8"/>

      <text x="260" y="276" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">A · Một số chung</text>
      <text x="260" y="292" fill="#636b80" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">ba bảng cùng đọc một số, cùng một nhãn</text>
      <rect x="48" y="308" width="136" height="96" rx="4" fill="#ffffff" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <text x="116" y="328" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">THẺ HIỆU CHUẨN</text>
      <text x="116" y="360" fill="#2d3142" font-size="24" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">267</text>
      <text x="116" y="380" fill="#2d3142" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">«Listing tự thu»</text>
      <rect x="192" y="308" width="136" height="96" rx="4" fill="#ffffff" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>

      <text x="260" y="380" fill="#2d3142" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">«Listing tự thu»</text>
      <rect x="336" y="308" width="136" height="96" rx="4" fill="#ffffff" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>

      <text x="404" y="360" fill="#2d3142" font-size="24" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">267</text>
      <text x="404" y="380" fill="#2d3142" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">«Listing tự thu»</text>
      <line x1="48" y1="420" x2="472" y2="420" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <text x="48" y="440" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.14em">MỘT CÂU ĐỊNH NGHĨA</text>
      <text x="48" y="460" fill="#2d3142" font-size="11" font-family="'Geist', sans-serif">«Listing tự thu: số listing đang theo dõi trong cả</text>

      <line x1="48" y1="492" x2="472" y2="492" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <text x="48" y="512" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.14em">GIÁ PHẢI TRẢ</text>
      <text x="48" y="528" fill="#2d3142" font-size="11" font-family="'Geist', sans-serif">Mất số tháng cuối (39) của bảng toàn quốc</text>

      <!-- ===================== NHÁNH B ===================== -->
      <rect x="512" y="220" width="456" height="320" rx="6" fill="transparent" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>

      <text x="740" y="276" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">B · Ba số, ba nhãn</text>
      <text x="740" y="292" fill="#636b80" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">mỗi bảng giữ số của mình, nhãn nói rõ số ấy đếm gì</text>

      <text x="596" y="380" fill="#2d3142" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">«listing trong cửa sổ</text>
      <text x="596" y="394" fill="#2d3142" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">metrics»</text>
      <rect x="672" y="308" width="136" height="96" rx="4" fill="#ffffff" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <text x="740" y="328" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ĐỘ PHỦ</text>
      <text x="740" y="360" fill="#2d3142" font-size="24" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">267</text>
      <text x="740" y="380" fill="#2d3142" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">«listing đang theo dõi»</text>

      <line x1="528" y1="420" x2="952" y2="420" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>

      <text x="528" y="460" fill="#2d3142" font-size="11" font-family="'Geist', sans-serif">Ba nhãn khác nhau, mỗi nhãn là định nghĩa</text>
      <text x="528" y="476" fill="#2d3142" font-size="11" font-family="'Geist', sans-serif">của số ở bảng ấy</text>
      <line x1="528" y1="492" x2="952" y2="492" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <text x="528" y="512" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.14em">GIÁ PHẢI TRẢ</text>
      <text x="528" y="528" fill="#2d3142" font-size="11" font-family="'Geist', sans-serif">Ba số cho cùng khu vực trên một trang</text>

      <!-- ===================== CHÚ GIẢI ===================== -->
      <line x1="32" y1="564" x2="968" y2="564" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <text x="32" y="584" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.18em">CHÚ GIẢI</text>

      <rect x="32" y="592" width="16" height="16" rx="2" fill="#ececec" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <text x="56" y="604" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">số đang hiện hôm nay</text>

      <rect x="188" y="592" width="16" height="16" rx="2" fill="#ffffff" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <text x="212" y="604" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">số và nhãn sau khi chọn nhánh</text>

      <rect x="388" y="592" width="16" height="16" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4"/>
      <text x="412" y="604" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">nhánh máy khuyên</text>

  </div>
</body>
</html>
