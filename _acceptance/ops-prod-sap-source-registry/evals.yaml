  - id: E2
    criterion: AC-2
    executor: test
    cmd: config:executors.test.app_ui
    paths: [app/src/lib/freshness.ts, app/src/app/ops/page.tsx, app/src/app/ops/collections/page.tsx, app/src/components/ops/collections/collections-view.tsx, app/src/components/ops/overview/overview-tiles.tsx, app/src/components/ops/local-only-alert.tsx, app/tests/ops-cloud-khong-bang-nap.test.tsx]
    expected: "exit 0; ca 'OP-AC-2 trang /ops và Thu thập render được, nói «Độ tươi chỉ đo ở máy local»' và đối chứng 'OP-AC-2 đối chứng: có source_registry (bảng rỗng) → không hiện câu chỉ-đo-ở-local' ok"
