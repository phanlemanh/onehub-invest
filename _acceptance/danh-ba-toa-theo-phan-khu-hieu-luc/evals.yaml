    expected: "exit 0; ca TTH-AC-1: lược đồ tạm tth_<pid> chép khuôn public của bảng danh bạ và dựng lại v_s09_du_an_moi, v_s09_toa, v_toa_nut_vung từ định nghĩa public theo thứ tự phụ thuộc. Fixture: dự án D (tên chứa tên nguồn thật thử), phân khu K dưới D (meta s09_sector_ids), cụm C dưới K (meta s09_cum + s09_sector_id), nút building B dưới D. Toà: T1 gốc D nối S09 vào K; T2 gốc D nối S09 vào C; T3 gốc D không nối S09; T4 gốc B; T5 gốc D có HAI bí danh S09 (một có sector, một không) → K; T6 gốc D đã gộp (merged) có bí danh S09 vào K. Căn: T1 2, T2 1, T3 0, T4 1, T5 1. Bảng kỳ vọng viết trước (soToa, toaChuaCan, soCan): D (5,1,5), K (3,0,4), C (1,0,1), B (1,0,1); tổng soToa trên dự án gốc 5 = tổng toà dải số. Hai chiều đỏ CÙNG fixture, thông điệp ghim: bản chép doc.ts đọc lại b.region_node_id → «TTH-AC-1 nút K lệch bảng»; bản chép doc.ts bỏ lọc status trên đường đọc view → «TTH-AC-1 nút K lệch bảng» (T6 bị đếm)."
