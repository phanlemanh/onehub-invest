<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Luật chọn số</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Lora:ital,wght@0,400;1,400&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Lora', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1080px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.25;
      color: var(--color-ink);
      margin-bottom: 0.5rem;
    }
    .sub {
      font-size: 0.875rem;
      color: var(--color-muted);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Cổng Phạm vi · enrich-nguoi-s03 · luat-chon-so</p>
    <h1>Hỏi-3: chọn số nào khi Người có nhiều số</h1>
    <p class="sub">AC-3 · ba nhánh rẽ, nhánh cam là nhánh gán số cho tin không số</p>

    <svg viewBox="0 0 1040 520" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- ============ Mũi tên (vẽ trước nút) ============ -->
      <!-- Gốc → ba nhánh: ba điểm gắn 440 / 520 / 600 trên cạnh dưới gốc -->
      <path d="M 440,88 V 112 Q 440,120 432,120 H 192 Q 184,120 184,128 V 150" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="520" y1="88" x2="520" y2="150" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M 600,88 V 112 Q 600,120 608,120 H 848 Q 856,120 856,128 V 150" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Điều kiện → kết quả -->
      <line x1="184" y1="232" x2="184" y2="294" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="520" y1="232" x2="520" y2="294" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="856" y1="232" x2="856" y2="294" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

      <!-- ============ Gốc ============ -->
      <rect x="360" y="24" width="320" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="360" y="24" width="320" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="520" y="40" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">GỐC</text>
      <text x="520" y="60" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Liên lạc sdt sống của Người</text>
      <text x="520" y="76" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">(cuối chuỗi gộp)</text>

      <!-- ============ Điều kiện ============ -->
      <!-- Nhánh 1 -->
      <rect x="24" y="152" width="320" height="80" rx="6" fill="#f5f5f5"/>
      <rect x="24" y="152" width="320" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="184" y="172" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">NHÁNH 1</text>
      <text x="184" y="200" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Đúng một số trên tin của chính họ</text>

      <!-- Nhánh 2 -->
      <rect x="360" y="152" width="320" height="80" rx="6" fill="#f5f5f5"/>
      <rect x="360" y="152" width="320" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="520" y="172" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">NHÁNH 2</text>
      <text x="520" y="196" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Không số nào trên tin,</text>
      <text x="520" y="212" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">đúng một số trong bài</text>

      <!-- Nhánh 3 -->
      <rect x="696" y="152" width="320" height="80" rx="6" fill="#f5f5f5"/>
      <rect x="696" y="152" width="320" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="856" y="172" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">NHÁNH 3</text>
      <text x="856" y="192" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Còn lại</text>
      <text x="856" y="208" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">(≥ 2 số trên tin; 0 trên tin + ≥ 2 trong bài;</text>
      <text x="856" y="222" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">0 số)</text>

      <!-- ============ Kết quả ============ -->
      <!-- Nhánh 1 → Dùng số ấy (focal) -->
      <rect x="64" y="296" width="240" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="64" y="296" width="240" height="64" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4"/>
      <text x="184" y="322" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Dùng số ấy</text>
      <text x="184" y="342" fill="#ba4513" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle">662 tin</text>

      <!-- Nhánh 2 → Dùng số ấy (focal) -->
      <rect x="400" y="296" width="240" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="400" y="296" width="240" height="64" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4"/>
      <text x="520" y="322" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Dùng số ấy</text>
      <text x="520" y="342" fill="#ba4513" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle">80 tin</text>

      <!-- Nhánh 3 → Không gán -->
      <rect x="736" y="296" width="240" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="736" y="296" width="240" height="64" rx="6" fill="rgba(45,49,66,0.05)" stroke="rgba(45,49,66,0.40)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="856" y="322" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Không gán</text>
      <text x="856" y="342" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle">đếm nhieu_so</text>

      <!-- ============ Chú thích dưới ============ -->
      <text x="24" y="400" fill="#4f5d75" font-size="14" font-style="italic" font-family="'Instrument Serif', 'Lora', serif">Số xuất hiện ở bài của ≥ 2 người gửi bị loại trước khi vào cây (Hỏi-2).</text>
      <text x="24" y="424" fill="#4f5d75" font-size="14" font-style="italic" font-family="'Instrument Serif', 'Lora', serif">Lối khác Hỏi-3: chọn số nhiều bài nhất — 824 tin.</text>

      <!-- ============ Chú giải ============ -->
      <line x1="24" y1="456" x2="1016" y2="456" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <text x="24" y="476" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.18em">CHÚ GIẢI</text>

      <rect x="24" y="488" width="24" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="56" y="498" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Gốc và điều kiện</text>

      <rect x="200" y="488" width="24" height="12" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4"/>
      <text x="232" y="498" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Gán số cho tin không số</text>

      <rect x="400" y="488" width="24" height="12" rx="2" fill="rgba(45,49,66,0.05)" stroke="rgba(45,49,66,0.40)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="432" y="498" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Không gán, chỉ đếm</text>
    </svg>
  </div>
</body>
</html>
