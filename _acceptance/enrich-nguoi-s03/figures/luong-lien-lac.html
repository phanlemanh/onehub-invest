<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Luồng liên lạc S03</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Lora:ital,wght@0,400;1,400&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Lora', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1440px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.25;
      color: var(--color-ink);
      margin-bottom: 0.5rem;
    }
    .sub {
      font-size: 0.875rem;
      color: var(--color-muted);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 1200px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Cổng Phạm vi · enrich-nguoi-s03 · luong-lien-lac</p>
    <h1>Hỏi-1: số của Người lưu ở đâu, đi tới Xem số thế nào</h1>
    <p class="sub">AC-1 · AC-2 · AC-4 · AC-5 · AC-6 · AC-7 · nút cam là nơi lưu số máy khuyên; khung đứt nét là lối khác Hỏi-1</p>

    <svg viewBox="0 0 1408 528" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- ============ Vùng lối khác Hỏi-1 (vẽ trước) ============ -->
      <rect x="208" y="312" width="192" height="120" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="0.8" stroke-dasharray="4,3"/>
      <rect x="216" y="304" width="112" height="16" rx="2" fill="#f5f5f5"/>
      <text x="272" y="316" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">LỐI KHÁC HỎI-1</text>

      <!-- ============ Mũi tên (vẽ trước nút) ============ -->
      <!-- Luồng chính -->
      <line x1="184" y1="192" x2="222" y2="192" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="384" y1="192" x2="422" y2="192" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="584" y1="192" x2="622" y2="192" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="784" y1="192" x2="822" y2="192" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="984" y1="192" x2="1022" y2="192" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="1184" y1="192" x2="1222" y2="192" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Ô chờ ZCode → Liên lạc -->
      <line x1="504" y1="88" x2="504" y2="134" stroke="#636b80" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <rect x="512" y="104" width="128" height="16" rx="2" fill="#f5f5f5"/>
      <text x="516" y="116" fill="#636b80" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.04em">kind chat_profile · chưa ghi</text>

      <!-- Lối khác: Bí danh → Người, gộp HD13 -->
      <line x1="344" y1="336" x2="344" y2="250" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <rect x="220" y="264" width="116" height="32" rx="2" fill="#f5f5f5"/>
      <text x="336" y="276" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.04em">gộp HD13</text>
      <text x="336" y="290" fill="#636b80" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.04em">công tắc đang TẮT</text>

      <!-- Vòng cấm A: Tin mang dấu ↛ Liên lạc -->
      <path d="M 872,248 V 272 Q 872,280 864,280 H 528 Q 520,280 520,272 V 250" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <!-- Vòng cấm B: Tin mang dấu ↛ Bí danh -->
      <path d="M 904,248 V 288 Q 904,296 896,296 H 424 Q 416,296 416,304 V 368 Q 416,376 408,376 H 386" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

      <!-- Nhãn vòng cấm -->
      <rect x="608" y="256" width="176" height="16" rx="2" fill="#f5f5f5"/>
      <text x="696" y="268" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">CẤM · AC-6 không tự nuôi</text>

      <!-- Dấu gạch chéo trên hai đường cấm -->
      <circle cx="800" cy="280" r="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1.2"/>
      <line x1="797" y1="277" x2="803" y2="283" stroke="#2d3142" stroke-width="1.2"/>
      <line x1="803" y1="277" x2="797" y2="283" stroke="#2d3142" stroke-width="1.2"/>
      <circle cx="800" cy="296" r="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1.2"/>
      <line x1="797" y1="293" x2="803" y2="299" stroke="#2d3142" stroke-width="1.2"/>
      <line x1="803" y1="293" x2="797" y2="299" stroke="#2d3142" stroke-width="1.2"/>

      <!-- ============ Nút ============ -->
      <!-- Ô chờ ZCode -->
      <rect x="424" y="24" width="160" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="424" y="24" width="160" height="64" rx="6" fill="rgba(45,49,66,0.07)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="504" y="40" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">CHỜ LÀN ZCODE</text>
      <text x="504" y="60" fill="#4f5d75" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Liên lạc hồ sơ kênh S03</text>
      <text x="504" y="76" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">theo sender_id</text>

      <!-- N1 Bài nhóm S03 -->
      <rect x="24" y="136" width="160" height="112" rx="6" fill="#f5f5f5"/>
      <rect x="24" y="136" width="160" height="112" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="104" y="156" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">NGUỒN S03</text>
      <text x="104" y="184" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Bài nhóm S03</text>
      <text x="104" y="200" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">của người gửi</text>
      <text x="104" y="224" fill="#636b80" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">sender_id</text>

      <!-- N2 Người theo tài khoản -->
      <rect x="224" y="136" width="160" height="112" rx="6" fill="#f5f5f5"/>
      <rect x="224" y="136" width="160" height="112" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="304" y="156" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">NGƯỜI</text>
      <text x="304" y="184" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Người theo</text>
      <text x="304" y="200" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">tài khoản</text>
      <text x="304" y="224" fill="#636b80" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">tai_khoan_nguon</text>

      <!-- N3 Liên lạc của Người (focal) -->
      <rect x="424" y="136" width="160" height="112" rx="6" fill="#f5f5f5"/>
      <rect x="424" y="136" width="160" height="112" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4"/>
      <text x="504" y="156" fill="#ba4513" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">LƯU SỐ · 079</text>
      <text x="504" y="180" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Liên lạc của Người</text>
      <text x="504" y="198" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle">party_contacts</text>
      <text x="504" y="218" fill="#636b80" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">rule so_tren_tin</text>
      <text x="504" y="232" fill="#636b80" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">rule so_trong_bai</text>

      <!-- N4 Luật chọn số -->
      <rect x="624" y="136" width="160" height="112" rx="6" fill="#f5f5f5"/>
      <rect x="624" y="136" width="160" height="112" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="704" y="156" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">CHỌN</text>
      <text x="704" y="184" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Luật chọn số</text>
      <text x="704" y="208" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">3 nhánh — xem hình</text>
      <text x="704" y="222" fill="#636b80" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">luat-chon-so</text>

      <!-- N5 Tin không số -->
      <rect x="824" y="136" width="160" height="112" rx="6" fill="#f5f5f5"/>
      <rect x="824" y="136" width="160" height="112" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="904" y="156" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">TIN S03</text>
      <text x="904" y="180" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Tin không số</text>
      <text x="904" y="202" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">seller_phone + dấu</text>
      <text x="904" y="216" fill="#636b80" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">s03-qua-nguoi-dang</text>

      <!-- N6 View sale_offers -->
      <rect x="1024" y="136" width="160" height="112" rx="6" fill="#f5f5f5"/>
      <rect x="1024" y="136" width="160" height="112" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="1104" y="156" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">VIEW</text>
      <text x="1104" y="184" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">View sale_offers</text>
      <text x="1104" y="208" fill="#636b80" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">seller_phone_inferred</text>

      <!-- N7 Invest -->
      <rect x="1224" y="136" width="160" height="112" rx="6" fill="#f5f5f5"/>
      <rect x="1224" y="136" width="160" height="112" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="1304" y="156" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">INVEST</text>
      <text x="1304" y="184" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Invest: Xem số</text>
      <text x="1304" y="204" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">+ Badge Chưa xác minh</text>

      <!-- Bí danh sdt (lối khác) -->
      <rect x="224" y="336" width="160" height="80" rx="6" fill="#f5f5f5"/>
      <rect x="224" y="336" width="160" height="80" rx="6" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.40)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="304" y="364" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Bí danh sdt của Người</text>
      <text x="304" y="380" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">theo SĐT</text>
      <text x="304" y="400" fill="#636b80" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">khoá định danh</text>

      <!-- ============ Chú giải ============ -->
      <line x1="24" y1="464" x2="1384" y2="464" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <text x="24" y="484" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.18em">CHÚ GIẢI</text>

      <rect x="24" y="496" width="24" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="56" y="506" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Bước của luồng</text>

      <rect x="184" y="496" width="24" height="12" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4"/>
      <text x="216" y="506" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Nơi lưu số máy khuyên</text>

      <rect x="376" y="496" width="24" height="12" rx="2" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.40)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="408" y="506" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Lối khác Hỏi-1</text>

      <rect x="536" y="496" width="24" height="12" rx="2" fill="rgba(45,49,66,0.07)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="568" y="506" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Chờ làn ZCode</text>

      <line x1="696" y1="502" x2="736" y2="502" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3"/>
      <circle cx="716" cy="502" r="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1.2"/>
      <line x1="713" y1="499" x2="719" y2="505" stroke="#2d3142" stroke-width="1.2"/>
      <line x1="719" y1="499" x2="713" y2="505" stroke="#2d3142" stroke-width="1.2"/>
      <text x="744" y="506" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Vòng cấm: số đã suy không quay lại làm bằng chứng</text>
    </svg>
  </div>
</body>
</html>
