    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E9
    criterion: AC-9
    executor: judgment
    inputs: [_acceptance/enrich-nguoi-s03/evidence/doc-mu-30.md]
    question: "Tệp ghi kết quả đọc mù 30 Người (mỗi dòng: mã mẫu, nhãn dung/sai/khong_ro, lý do một câu không chứa số hay tên). Đếm có đủ 30 dòng không, số dung có ≥ 27 không, số sai mà lý do nói rõ là số của người khác có ≤ 1 không, và tệp có chứa chuỗi dạng SĐT hay chữ bài gốc không?"
    expected: "30 dòng; dung ≥ 27; sai-rõ-người-khác ≤ 1; không có SĐT hay chữ bài"
    evidence_required: [verdict, rationale]
  - id: E10
    criterion: AC-10
    executor: judgment
    inputs: [docs/adr/0011-reso-first-data-law.md, docs/adr/0016-danh-ba-vat-the-va-nguoi.md, CONTEXT.md, pipeline/mappings.yaml, docs/ROADMAP.md]
    question: "Các tệp này có đủ: mappings.yaml khai contact_kind, contact_rule và luật s03-qua-nguoi-dang đủ sáu điều kiện ADR-0011 Qđ 3; CONTEXT.md có thuật ngữ «Liên lạc của Người» theo khuôn (nhãn, code, định nghĩa, _Avoid_) và mục «Chưa xác minh» cạnh Xem số nói tin hoặc bài khác; ADR-0016 §8 có dòng sửa đổi tách liên lạc khỏi bí danh định danh; ROADMAP ghi as-built và việc chờ áp 079, liên lạc hồ sơ kênh S03 của ZCode?"
    expected: "bốn vế đều có trong tệp"
    evidence_required: [verdict, rationale]
