schema_version: 1
feature_slug: enrich-nguoi-s03
# Ca «EN-AC-n»: thuần ở pipeline/scripts/enrich-nguoi-s03.test.mjs; DB ở enrich-nguoi-s03.itest.mjs trên DB thử oneinvest_en (transform S03 thật, BEGIN…ROLLBACK), số bịa.
# Mỗi phép đo có ca đỏ trên bản đột biến cùng fixture, ghim thông điệp. Thước dữ liệu thật E8 chạy trên DB thử từ db/db-thu.sh.
evals:
