    criterion: AC-1
    executor: test
    layer: backend-effect
    cmd: config:executors.test.en_test
    paths: [pipeline/lib/lien-lac-nguoi.mjs, pipeline/transform-zalo.mjs, pipeline/scripts/enrich-nguoi-s03.test.mjs, pipeline/scripts/enrich-nguoi-s03.itest.mjs]
    expected: "exit 0; ca EN-AC-1: bảng 7 ô viết trước (so-tren-tin, so-trong-bai, so-chung-hai-nguoi, so-da-suy, chua-co-nguoi, sai-dang, hai-rule-cung-so), số ô assert bằng 7; bài nạp vào stg_zalo_posts và tin ghi bằng writeOffers thật; mỗi ô assert phát biểu (rule, evidence_tier=observed, method=parser, evidence chỉ có post_ids/offer_ids/số đếm) hoặc đếm so_chung/khong_nguoi đúng. Chiều đỏ cùng fixture: tắt luật số chung thì ca đỏ nêu ô so-chung-hai-nguoi"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E2
    criterion: AC-2
    executor: test
    layer: backend-effect
    cmd: config:executors.test.en_test
