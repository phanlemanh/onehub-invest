    expected: "exit 0; ca EN-AC-2: 079 nạp hai lần không lỗi; INSERT sdt E.164 và chat_profile nhận, sdt sai dạng và chat_profile rỗng bị CHECK từ chối; DELETE, TRUNCATE, UPDATE đổi value bị trigger chặn với thông điệp ghim; rút không lý do bị chặn; lượt 2 trả lien_lac_moi=0 lien_lac_rut=0; thêm bài của người gửi thứ hai mang số ấy thì lượt kế rút đúng một dòng lý do so-chung; xoá bài bằng chứng khỏi stg thì liên lạc còn sống"
