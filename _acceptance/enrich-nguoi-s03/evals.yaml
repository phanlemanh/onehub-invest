  - id: E7u
    criterion: AC-7
    executor: ui-check
    layer: ui-observed
    route: /vn/hanoi/listings/rent
    steps:
      - "Dev server từ gốc worktree đang kiểm, cổng riêng: npm --prefix app run dev -- -p 3463, DATABASE_URL=postgres://oneinvest:oneinvest@localhost:5433/oneinvest_en_ui (DB thử đã áp 079 và đã ghi thật bước đêm: Người, liên lạc, gán số — dựng sẵn trước lượt chấm); không ghi DB dùng chung"
      - "Trước khi chụp, chèn style che số: a[href^=\"tel:\"] span{color:transparent!important;background:var(--muted)}"
      - "Truy vấn chỉ đọc DB thử: một tin thuê S03 hiện công khai mang dấu s03-qua-nguoi-dang; ghi mã tin, không ghi số"
      - "Mở trang tin đó (/vn/listing/<id> hoặc thẻ trên trang Cho thuê): Badge «Chưa xác minh» cạnh Xem số, chụp evidence/E7u-truoc.png; bấm Xem số, số hiện thành link gọi, Badge còn, chụp evidence/E7u-sau.png"
      - "Chụp nguyên thẻ S03 có cả nhãn cấp tin và nhãn cạnh số, evidence/E7u-hai-nhan.png"
      - "Rê chuột lên Badge số, popover «Số chưa xác minh» nói «tin hoặc bài khác», chụp evidence/E7u-giai-thich.png; rê lên nhãn cấp tin, popover «Tin chưa xác minh» nói về tin nhóm cộng đồng, chụp evidence/E7u-giai-thich-tin.png"
    paths: [app/src/components/listing/offer-contact.tsx, app/src/components/listing/offer-label-help.tsx]
    expected: "năm ảnh đúng mô tả; hai popover mang hai tên khác nhau; ảnh không lộ số"
