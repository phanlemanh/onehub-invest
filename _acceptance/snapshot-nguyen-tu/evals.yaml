evals:
  - id: E1
    criterion: AC-1
    executor: script
    cmd: config:executors.script.snt_dang_ghi
    expected: "exit 0; 'DANG-GHI PASS'; should-NOT-fire: lúc đang ghi KHÔNG có thư mục tên thật, chỉ một '.<id>.partial', chưa manifest"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
