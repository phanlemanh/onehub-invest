  - id: E6
    criterion: AC-6
    executor: ui-check
    layer: ui-observed
    route: /vn/hanoi/listings/sale
    steps:
      - "Dev server từ gốc worktree ở cổng 3460, DB máy thu"
      - "Truy vấn chỉ đọc DB máy thu hoặc gọi /api/v1/listings: một tin Hà Nội có unverified, một tin có phoneInferred; ghi mã tin, không ghi số. Không có tin phoneInferred thì ghi KHONG-DO cho nút số, không báo đạt"
      - "Mở /vn/hanoi/listings/sale, bấm nút Về nhãn Chưa xác minh trên thẻ tin và ô liên hệ, chữ đúng nghĩa từng nút, chụp evidence/E6-the.png, evidence/E6-so.png"
      - "Tab tới nút, Enter mở, Esc đóng; ở khổ 375 chạm mở được (touch emulation)"
      - "Ma trận ba trang /vn/hanoi/listings/sale, /vn/hanoi, /methodology nhân sáng, tối, 375: scrollWidth bằng clientWidth, trang tin đo lúc popover mở; chụp evidence/E6-<trang>-<chế độ>.png"
      - "Mở /vn/hanoi: nhãn MÔ PHỎNG nằm ở đầu bảng Lợi suất, chú thích nói giá rao; /methodology mục Nguồn dữ liệu đọc được"
      - "Mở một /listing/<mã thật>: nút ghi Mở trang gốc, href còn nguyên; mở /yield?area=vn-hanoi: đầu trang nhãn MÔ PHỎNG, chú thích nói giá rao; chụp evidence/E6-listing.png, evidence/E6-yield.png"
    paths: [app/src/components/listing/offer-card.tsx, app/src/components/listing/offer-contact.tsx, app/src/components/insight/insight-tables.tsx, app/src/components/marketing/methodology-definitions.tsx, app/src/components/listing/listing-hero.tsx, app/src/app/(app)/yield/page.tsx]
    expected: "ảnh đủ ma trận chín ô cộng bốn ảnh riêng, đúng mô tả; scrollWidth bằng clientWidth mọi ô; hai popover mở được bằng bấm, bàn phím, chạm; KHONG-DO ghi rõ nếu có."
