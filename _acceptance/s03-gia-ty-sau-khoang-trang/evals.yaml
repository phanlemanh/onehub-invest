schema_version: 1
feature_slug: s03-gia-ty-sau-khoang-trang
# Ca test mang tiền tố «GS-AC-n» ở pipeline/scripts/gia-ty-sau-khoang-trang.test.mjs (trong npm test của pipeline).
# Mỗi ma trận có ca đỏ: bản sao đột biến của transform-zalo.mjs (chép cạnh tệp thật, xoá ngay) với thông điệp ghim.
evals:
  - id: E1
    criterion: AC-1
    executor: test
    cmd: config:executors.test.pipeline
    paths: [pipeline/transform-zalo.mjs, pipeline/scripts/gia-ty-sau-khoang-trang.test.mjs]
    expected: "exit 0; ca 'GS-AC-1' xanh: 8 dòng viết trước (5 giá có khoảng trắng/xuống dòng + 1–2 chữ số ngay sau, 3 dạng đã đúng) — số assert giá bằng số dòng, mỗi dòng đúng số đồng; 4 dòng có diện tích/số phòng sau giá ra đúng 50, 2, 60, 50; ca đỏ trên bản sao bỏ nhánh đuôi khoảng trắng + 1–2 chữ số trong laDuoiNhomNghin ghim «3.000.000.000\\n50m2»"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E2
    criterion: AC-2
    executor: test
    cmd: config:executors.test.pipeline
    paths: [pipeline/transform-zalo.mjs, pipeline/scripts/gia-ty-sau-khoang-trang.test.mjs]
    expected: "exit 0; ca 'GS-AC-2' xanh: 10 dòng viết trước (7 dòng SĐT của s03-gia-ty-chan-dong, 3 dòng SĐT sau «chữ số + dấu chấm» có đuôi khoảng trắng + chữ số) ra giá 9 triệu; hai ca đỏ, mỗi điều kiện của nhánh một ca: bản sao bỏ điều kiện nhóm cuối «000» ghim «2.098.765.432 1», bản sao bỏ điều kiện thân số tiền không dính chữ ghim «50m2.098.765.000 1»"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E3
    criterion: AC-3
    executor: test
    cmd: config:executors.test.pipeline
    paths: [pipeline/transform-zalo.mjs, pipeline/scripts/gia-ty-sau-khoang-trang.test.mjs]
    expected: "exit 0; ca 'GS-AC-3' xanh: extractPhones của bản cây bằng extractPhones của bản nền ghim ec899d03 (git show, chép cạnh tệp thật rồi xoá) ở 15 dòng (5 dòng giá AC-1, 10 dòng SĐT AC-2) — số assert bằng số dòng; từ SD2 (boc-sdt-du-va-chon-ro, giám sát duyệt P1-78, P1-79) hai dòng bản nền nhận số 11 chữ số («1.050.000.000⏎60m2», «0912.345.678 9») chờ rỗng, 13 dòng còn lại so bản nền; ca đỏ trên bản sao theo lối (a) — bộ bóc SĐT (SDT_RE, tách khỏi PHONE_RE dùng chung từ SD2) thôi nhận khoảng trắng làm ký tự cách — ghim «liên hệ.0901 234 567»"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E4
    criterion: AC-4
    executor: test
    cmd: config:executors.test.pipeline
    paths: [pipeline/transform-zalo.mjs, pipeline/scripts/gia-ty-sau-khoang-trang.test.mjs]
    expected: "exit 0; ca 'GS-AC-4' xanh: lyDoGiaPhiLy(parsePost(chữ)) ra ban-tren-100-ty cho «150.000.000.000 2PN» và thue-tu-1-ty cho «1.000.000.000 1 tháng»; đối chứng: hai dòng ấy trên bản sao bỏ nhánh đuôi ra null (giá bị nuốt nên lọt chốt)"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E5
    criterion: AC-5
    executor: test
    cmd: config:executors.test.pipeline
    paths: [pipeline/**]
    expected: "exit 0; toàn bộ test pipeline xanh, gồm cam-mau-s03.test.mjs (ma trận N1), gia-ty-chan-dong.test.mjs và gia-ty-sau-khoang-trang.test.mjs"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E5b
    criterion: AC-5
    executor: script
    layer: backend-effect
    cmd: config:executors.script.cam_mau_s03_that
    paths: [pipeline/transform-zalo.mjs]
    expected: "exit 0; ca DB của N1 xanh và do-cam-mau-s03 in bảy thước 'ĐẠT' ở lượt cây trên bản chép dữ liệu thật (DB thử), lượt đối chứng tái lập mốc gốc từng thước"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E6
    criterion: AC-6
    executor: script
    layer: backend-effect
    cmd: config:executors.script.gia_ty_sau_khoang_trang_so
    paths: [pipeline/transform-zalo.mjs, pipeline/scripts/so-gia-ty-sau-khoang-trang.mjs]
    expected: "exit 0; so-gia-ty-sau-khoang-trang in số bài S03 thật đã so (> 0, không thì TRƯỢT), số bài đổi đầu ra parsePost (so mọi trường), số bài đổi danh sách SĐT (= 0), và mỗi bài đổi kèm mã bài + nhãn; mọi bài đổi mang nhãn 'gia-sau-khoang-trang' (chữ có số tiền nhóm nghìn + khoảng trắng + 1–2 chữ số VÀ giá mới bằng giá trị số tiền ấy VÀ mọi trường khác bị đổi chỉ đổi từ null sang đúng số đuôi), bài đổi ngoài quan hệ ấy = 0; đối chứng dương của nhãn ở cả hai lượt: bài tổng hợp «Bán nhà 3.000.000.000\\n50m2» phải đổi và mang nhãn, không thì TRƯỢT; lượt đối chứng (luôn chạy trong cùng lệnh): bản sao bỏ điều kiện nhóm cuối «000», trên cùng bộ bài thật cộng một bài tổng hợp «Cho thuê 9tr LH 2.098.765.432 1 T.Lan», phải TRƯỢT và gọi tên bài tổng hợp — không bắt được thì lệnh exit 1"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
