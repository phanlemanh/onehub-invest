<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hỏi-2 cửa sổ</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Lora:ital,wght@0,400;1,400&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Lora', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1040px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.25;
      color: var(--color-ink);
      margin-bottom: 0.5rem;
    }
    .sub {
      font-size: 0.875rem;
      color: var(--color-muted);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Cổng Phạm vi · thoi-gian-va-hieu-luc · hoi-2-cua-so</p>
    <h1>Hỏi-2: độ dài cửa sổ độ tươi cho bậc B5</h1>
    <p class="sub">AC-7 · hai nhánh, nhánh tô cam là nhánh máy khuyên</p>

    <svg viewBox="0 0 1000 520" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- ============ Khung nhánh (nền, vẽ trước) ============ -->
      <!-- Nhánh A: nhánh máy khuyên, khung nhấn duy nhất -->
      <rect x="232" y="24" width="752" height="160" rx="8" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.6"/>
      <text x="248" y="44" fill="#ba4513" font-size="9" font-weight="600" font-family="'Geist Mono', monospace" letter-spacing="0.14em">NHÁNH A · MÁY KHUYÊN</text>
      <!-- Nhánh B -->
      <rect x="232" y="216" width="752" height="160" rx="8" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="248" y="236" fill="#4f5d75" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.14em">NHÁNH B</text>

      <!-- ============ Mũi tên (vẽ trước nút) ============ -->
      <line x1="200" y1="112" x2="248" y2="112" stroke="#eb6c36" stroke-width="1.6" marker-end="url(#arrow-accent)"/>
      <line x1="200" y1="304" x2="248" y2="304" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="472" y1="112" x2="496" y2="112" stroke="#eb6c36" stroke-width="1.6" marker-end="url(#arrow-accent)"/>
      <line x1="720" y1="112" x2="744" y2="112" stroke="#eb6c36" stroke-width="1.6" marker-end="url(#arrow-accent)"/>
      <line x1="472" y1="304" x2="496" y2="304" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="720" y1="304" x2="744" y2="304" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- ============ Gốc ============ -->
      <rect x="24" y="80" width="176" height="256" rx="6" fill="#f5f5f5"/>
      <rect x="24" y="80" width="176" height="256" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="112" y="104" fill="#4f5d75" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">GỐC</text>
      <text x="112" y="188" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Cửa sổ độ tươi</text>
      <text x="112" y="208" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">của bậc B5</text>
      <text x="112" y="228" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">dài bao lâu?</text>

      <!-- ============ Nhánh A ============ -->
      <rect x="248" y="56" width="224" height="112" rx="6" fill="#f5f5f5"/>
      <rect x="248" y="56" width="224" height="112" rx="6" fill="#ffffff" stroke="#eb6c36" stroke-width="1.4"/>
      <text x="264" y="76" fill="#4f5d75" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LỰA CHỌN</text>
      <text x="264" y="122" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Một hằng 7 ngày</text>
      <text x="264" y="142" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">cho mọi nguồn</text>
      <rect x="496" y="56" width="224" height="112" rx="6" fill="#f5f5f5"/>
      <rect x="496" y="56" width="224" height="112" rx="6" fill="#ffffff" stroke="#eb6c36" stroke-width="1.4"/>
      <text x="512" y="76" fill="#4f5d75" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.14em">ĐƯỢC</text>
      <text x="512" y="122" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif">dễ giải thích,</text>
      <text x="512" y="142" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif">một chỗ sửa</text>
      <rect x="744" y="56" width="224" height="112" rx="6" fill="#f5f5f5"/>
      <rect x="744" y="56" width="224" height="112" rx="6" fill="#ffffff" stroke="#eb6c36" stroke-width="1.4"/>
      <text x="760" y="76" fill="#4f5d75" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.14em">VỀ SAU</text>
      <text x="760" y="122" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif">tinh chỉnh theo nguồn</text>
      <text x="760" y="142" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif">khi có số đo</text>

      <!-- ============ Nhánh B ============ -->
      <rect x="248" y="248" width="224" height="112" rx="6" fill="#f5f5f5"/>
      <rect x="248" y="248" width="224" height="112" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.40)" stroke-width="1"/>
      <text x="264" y="268" fill="#4f5d75" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LỰA CHỌN</text>
      <text x="264" y="314" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Theo SLO độ tươi</text>
      <text x="264" y="334" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">từng nguồn</text>
      <rect x="496" y="248" width="224" height="112" rx="6" fill="#f5f5f5"/>
      <rect x="496" y="248" width="224" height="112" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.40)" stroke-width="1"/>
      <text x="512" y="268" fill="#4f5d75" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.14em">CÁCH CHẠY</text>
      <text x="512" y="324" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif">mỗi nguồn một ngưỡng</text>
      <rect x="744" y="248" width="224" height="112" rx="6" fill="#f5f5f5"/>
      <rect x="744" y="248" width="224" height="112" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.40)" stroke-width="1"/>
      <text x="760" y="268" fill="#4f5d75" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.14em">ĐỔI LẠI</text>
      <text x="760" y="314" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif">thêm nguồn cấu hình,</text>
      <text x="760" y="334" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif">khó giải thích trên thẻ</text>

      <!-- ============ Ghi chú dưới ============ -->
      <text x="500" y="412" fill="#4f5d75" font-size="12" font-family="'Geist', sans-serif" text-anchor="middle">Hôm nay chưa căn nào ở B4 nên B5 = 0 — cửa sổ chỉ có tác dụng khi B4 mở (DB1, PL21) · AC-7</text>

      <!-- ============ Chú giải ============ -->
      <line x1="24" y1="440" x2="984" y2="440" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <text x="24" y="464" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.18em">CHÚ GIẢI</text>

      <rect x="24" y="476" width="24" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="56" y="486" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Câu hỏi (gốc)</text>

      <rect x="216" y="476" width="24" height="12" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.6"/>
      <text x="248" y="486" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Nhánh máy khuyên</text>

      <rect x="396" y="476" width="24" height="12" rx="2" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="428" y="486" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Nhánh còn lại</text>
    </svg>
  </div>
</body>
</html>
