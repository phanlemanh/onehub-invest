<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lỗi rơi về đâu</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Lora:ital,wght@0,400;1,400&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Lora', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1360px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.25;
      color: var(--color-ink);
      margin-bottom: 0.5rem;
    }
    .sub {
      font-size: 0.875rem;
      color: var(--color-muted);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 960px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Cổng Phạm vi · trang-chu-methodology · d-…-6 + d-…-7</p>
    <h1>Lỗi rơi về đâu: hai ranh giới bắt lỗi, hai nút Thử lại</h1>
    <p class="sub">Một gốc, rẽ hai nhánh · lỗi → ranh giới → khách thấy gì · AC-7 · AC-8</p>

      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
      </defs>

      <rect x="0" y="88" width="1360" height="448" fill="#f5f5f5"/>

      <!-- ===================== CỘT ===================== -->
      <text x="48" y="112" fill="#4f5d75" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.18em">GỐC</text>
      <text x="320" y="112" fill="#4f5d75" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LỖI</text>
      <text x="680" y="112" fill="#4f5d75" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.18em">RANH GIỚI BẮT LỖI</text>
      <text x="960" y="112" fill="#4f5d75" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.18em">KHÁCH THẤY GÌ</text>

      <line x1="40" y1="124" x2="1320" y2="124" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>

      <!-- ===================== ARROWS (trước hộp) ===================== -->
      <!-- gốc → hai nhánh (hai điểm bám riêng trên cạnh phải) -->
      <path d="M248 252 H272 Q280 252 280 244 V184 Q280 176 288 176 H316" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M248 276 H272 Q280 276 280 284 V344 Q280 352 288 352 H316" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <line x1="920" y1="176" x2="956" y2="176" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="920" y1="352" x2="956" y2="352" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <rect x="48" y="228" width="200" height="72" rx="20" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="148" y="260" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Khách mở</text>
      <text x="148" y="276" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">/ hoặc /methodology</text>

      <!-- ===================== NHÁNH A ===================== -->
      <rect x="320" y="132" width="320" height="88" rx="6" fill="#f5f5f5"/>
      <rect x="320" y="132" width="320" height="88" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="328" y="138" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="342" y="147" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">A</text>
      <text x="480" y="172" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Trang ném lỗi</text>
      <text x="480" y="188" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">layout marketing còn sống</text>

      <rect x="680" y="132" width="240" height="88" rx="6" fill="#f5f5f5"/>
      <rect x="680" y="132" width="240" height="88" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4"/>
      <text x="800" y="172" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">(marketing)/error.tsx</text>
      <text x="800" y="188" fill="#ba4513" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">nằm trong layout marketing</text>

      <rect x="960" y="132" width="360" height="88" rx="6" fill="#f5f5f5"/>
      <rect x="960" y="132" width="360" height="88" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>

      <text x="984" y="147" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">AC-7</text>
      <text x="1140" y="168" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Navbar + chân trang vẫn hiện</text>
      <text x="1140" y="184" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">Alert “Không tải được dữ liệu” + Thử lại</text>
      <text x="1140" y="200" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">retry: tải lại từ server</text>

      <!-- ===================== NHÁNH B ===================== -->
      <rect x="320" y="308" width="320" height="88" rx="6" fill="#f5f5f5"/>
      <rect x="320" y="308" width="320" height="88" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="328" y="314" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="342" y="323" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">B</text>
      <text x="480" y="348" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Layout ném lỗi</text>
      <text x="480" y="364" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">DB sập: layout đọc phiên + chỉ mục tìm kiếm</text>

      <rect x="680" y="308" width="240" height="88" rx="6" fill="#f5f5f5"/>
      <rect x="680" y="308" width="240" height="88" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4"/>
      <text x="800" y="348" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">app/global-error.tsx</text>
      <text x="800" y="364" fill="#ba4513" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">thay cả layout gốc</text>

      <rect x="960" y="308" width="360" height="88" rx="6" fill="#f5f5f5"/>
      <rect x="960" y="308" width="360" height="88" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="968" y="314" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="984" y="323" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">AC-8</text>
      <text x="1140" y="344" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Trang riêng &lt;html lang=vi&gt;</text>
      <text x="1140" y="360" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">Alert “One Invest không mở được”</text>
      <text x="1140" y="376" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">+ Thử lại + Về trang chủ</text>

      <!-- ===================== GHI CHÚ DƯỚI NHÁNH B ===================== -->
      <rect x="320" y="420" width="600" height="36" rx="6" fill="#f5f5f5"/>
      <rect x="320" y="420" width="600" height="36" rx="6" fill="transparent" stroke="rgba(79,93,117,0.6)" stroke-width="1" stroke-dasharray="5,4"/>
      <rect x="328" y="432" width="48" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="352" y="441" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">HỎI-2</text>
      <text x="388" y="443" fill="#4f5d75" font-size="13" font-style="italic" font-family="'Instrument Serif', 'Lora', serif">Hỏi-2 · lối khác: layout nuốt lỗi DB → navbar giả như chưa đăng nhập</text>

      <!-- ===================== LEGEND ===================== -->
      <line x1="40" y1="476" x2="1320" y2="476" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="496" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.18em">CHÚ GIẢI</text>

      <rect x="40" y="508" width="24" height="12" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="72" y="518" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Gốc</text>

      <rect x="120" y="508" width="16" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="144" y="518" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Bước</text>

      <rect x="196" y="508" width="16" height="12" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4"/>
      <text x="220" y="518" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Ranh giới bắt lỗi</text>

      <rect x="320" y="508" width="16" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.6)" stroke-width="1" stroke-dasharray="3,2"/>
      <text x="344" y="518" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Lối khác (câu hỏi)</text>

      <rect x="452" y="508" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="468" y="517" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">AC-n</text>
      <text x="492" y="518" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Tiêu chí liên quan</text>
    </svg>
  </div>
</body>
</html>
