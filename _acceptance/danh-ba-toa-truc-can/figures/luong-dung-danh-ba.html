<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Luồng dựng danh bạ toà · trục · căn</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Lora:ital,wght@0,400;1,400&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-soft:    #636b80;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Lora', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1240px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.25;
      color: var(--color-ink);
      margin-bottom: 0.5rem;
    }
    .sub { font-size: 0.875rem; color: var(--color-muted); margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 960px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Sơ đồ luồng · danh-ba-toa-truc-can · Cổng Phạm vi</p>
    <h1>Luồng dựng danh bạ toà · trục · căn</h1>
    <p class="sub">Năm ô Hỏi (tô cam) là chỗ người quyết. AC liên quan: AC-2, AC-3, AC-4, AC-5, AC-8, AC-9, AC-10, AC-12.</p>

    <svg viewBox="0 0 1160 840" xmlns="http://www.w3.org/2000/svg" font-family="'Geist', sans-serif">
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- ============ CONNECTORS (vẽ trước, nằm dưới nút) ============ -->
      <g fill="none" stroke="#4f5d75" stroke-width="1.2">
        <!-- Danh mục S08 → Bộ tách mã -->
        <path d="M184,264 L240,264" marker-end="url(#arrow)"/>
        <!-- Bộ tách mã → Tra bí danh -->
        <path d="M400,264 L480,264" marker-end="url(#arrow)"/>
        <!-- Bộ tách mã → Sổ lý do (mã không tách) -->
        <path d="M320,296 L320,416" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <!-- Tra bí danh: có → khoá cũ -->
        <path d="M560,216 L560,208 Q560,200 568,200 L800,200" marker-end="url(#arrow)"/>
        <!-- Tra bí danh: chưa → đúc khoá mới -->
        <path d="M640,264 L800,264" marker-end="url(#arrow)"/>
        <!-- Hỏi-1 → cha vùng của toà -->
        <path d="M876,104 L876,176" marker-end="url(#arrow)"/>
        <!-- Hỏi-2 → phát biểu builder_name -->
        <path d="M1044,104 L1044,176" marker-end="url(#arrow)"/>
        <!-- Toà → Hỏi-5 -->
        <path d="M1000,352 L1000,392" marker-end="url(#arrow)"/>
        <!-- Hỏi-5 có → Phát biểu phường suy ra -->
        <path d="M1000,504 L1000,552" marker-end="url(#arrow)"/>
        <!-- Hỏi-5 nhiều phường → Sổ lý do (nhảy cầu qua đường đúng 1 toà tại x=840) -->
        <path d="M896,448 L846,448 A6,6 0 0 0 834,448 L400,448" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <!-- Phát biểu toà trên tin → Hỏi-3 -->
        <path d="M184,584 L224,584" marker-end="url(#arrow)"/>
        <!-- Hỏi-3 có khu → Khớp tên toà -->
        <path d="M416,584 L480,584" marker-end="url(#arrow)"/>
        <!-- Hỏi-3 không khu → Không dùng -->
        <path d="M320,640 L320,676" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <!-- Khớp đúng một toà → bí danh tên lên Toà -->
        <path d="M640,584 L832,584 Q840,584 840,576 L840,352" marker-end="url(#arrow)"/>
        <!-- Khớp 0 / ≥2 → Hỏi-4 ứng viên -->
        <path d="M560,616 L560,664" marker-end="url(#arrow)"/>
      </g>

      <!-- ============ NHÃN CONNECTOR (có mask, cách đường ≥6px) ============ -->
      <g font-family="'Geist Mono', monospace" font-size="9" letter-spacing="0.06em" fill="#4f5d75">
        <rect x="408" y="240" width="64" height="16" rx="2" fill="#f5f5f5"/>
        <text x="440" y="252" text-anchor="middle">MÃ ĐÃ TÁCH</text>

        <rect x="328" y="344" width="88" height="16" rx="2" fill="#f5f5f5"/>
        <text x="332" y="356">MÃ KHÔNG TÁCH</text>

        <rect x="620" y="176" width="140" height="16" rx="2" fill="#f5f5f5"/>
        <text x="690" y="188" text-anchor="middle">CÓ · DÙNG KHOÁ CŨ</text>

        <rect x="652" y="240" width="136" height="16" rx="2" fill="#f5f5f5"/>
        <text x="720" y="252" text-anchor="middle">CHƯA · ĐÚC KHOÁ MỚI</text>

        <rect x="884" y="128" width="108" height="16" rx="2" fill="#f5f5f5"/>
        <text x="888" y="140">CHA VÙNG CỦA TOÀ</text>

        <rect x="1052" y="120" width="88" height="32" rx="2" fill="#f5f5f5"/>
        <text x="1056" y="132">PHÁT BIỂU</text>
        <text x="1056" y="146">builder_name</text>

        <rect x="1008" y="364" width="32" height="16" rx="2" fill="#f5f5f5"/>
        <text x="1012" y="376">TOÀ</text>

        <rect x="1008" y="520" width="24" height="16" rx="2" fill="#f5f5f5"/>
        <text x="1012" y="532">CÓ</text>

        <rect x="564" y="424" width="112" height="16" rx="2" fill="#f5f5f5"/>
        <text x="620" y="436" text-anchor="middle">NHIỀU PHƯỜNG</text>

        <rect x="420" y="560" width="56" height="16" rx="2" fill="#f5f5f5"/>
        <text x="448" y="572" text-anchor="middle">CÓ KHU</text>

        <rect x="328" y="648" width="48" height="16" rx="2" fill="#f5f5f5"/>
        <text x="332" y="660">KHÔNG</text>

        <rect x="652" y="560" width="168" height="16" rx="2" fill="#f5f5f5"/>
        <text x="736" y="572" text-anchor="middle">ĐÚNG 1 TOÀ → BÍ DANH ten</text>

        <rect x="568" y="632" width="72" height="16" rx="2" fill="#f5f5f5"/>
        <text x="572" y="644">0 · ≥2 TOÀ</text>
      </g>

      <!-- ============ NÚT ============ -->

      <!-- Danh mục S08 đã nối khu (bắt đầu) -->
      <rect x="32" y="236" width="152" height="56" rx="28" fill="#f5f5f5"/>
      <rect x="32" y="236" width="152" height="56" rx="28" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="108" y="262" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">Danh mục S08</text>
      <text x="108" y="278" fill="#636b80" font-size="9" text-anchor="middle">đã nối khu · bậc xác minh</text>

      <!-- Bộ tách mã -->
      <rect x="240" y="232" width="160" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="320" y="260" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">Bộ tách mã</text>
      <text x="320" y="278" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">khuôn có tên · khuon_id</text>

      <!-- Tra bí danh (quyết định) -->
      <polygon points="560,216 640,264 560,312 480,264" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="560" y="262" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">Tra bí danh</text>
      <text x="560" y="278" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">ma_nguon</text>

      <!-- Sổ lý do -->
      <rect x="240" y="416" width="160" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="240" y="416" width="160" height="64" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="320" y="444" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">Sổ lý do</text>
      <text x="320" y="462" fill="#636b80" font-size="9" text-anchor="middle">mã không tách · nhiều phường</text>

      <!-- Danh bạ vật thể -->
      <rect x="800" y="176" width="320" height="176" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/>
      <text x="816" y="200" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.18em">DANH BẠ VẬT THỂ</text>
      <line x1="816" y1="212" x2="1104" y2="212" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <text x="816" y="240" fill="#2d3142" font-size="12" font-weight="600">Toà</text>
      <text x="1104" y="240" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">bld_ + UPI</text>
      <line x1="816" y1="256" x2="1104" y2="256" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <text x="816" y="284" fill="#2d3142" font-size="12" font-weight="600">Trục</text>
      <text x="1104" y="284" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">stk_</text>
      <line x1="816" y1="300" x2="1104" y2="300" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <text x="816" y="328" fill="#2d3142" font-size="12" font-weight="600">Căn</text>
      <text x="1104" y="328" fill="#4f5d75" font-size="9" text-anchor="end"><tspan font-family="'Geist Mono', monospace">unt_</tspan> · chỉ khi có mã</text>

      <!-- Hỏi-1: ba dòng asset_nodes phân khu -->
      <rect x="800" y="24" width="152" height="80" rx="6" fill="#f5f5f5"/>
      <rect x="800" y="24" width="152" height="80" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4"/>
      <rect x="808" y="32" width="44" height="16" rx="2" fill="transparent" stroke="rgba(235,108,54,0.60)" stroke-width="0.8"/>
      <text x="830" y="44" fill="#ba4513" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">HỎI-1</text>
      <text x="876" y="66" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">Ba dòng phân khu</text>
      <text x="876" y="82" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">asset_nodes · building</text>
      <text x="876" y="96" fill="#636b80" font-size="9" text-anchor="middle">phân khu hay toà?</text>

      <!-- Hỏi-2: từ điển chủ đầu tư -->
      <rect x="968" y="24" width="152" height="80" rx="6" fill="#f5f5f5"/>
      <rect x="968" y="24" width="152" height="80" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4"/>
      <rect x="976" y="32" width="44" height="16" rx="2" fill="transparent" stroke="rgba(235,108,54,0.60)" stroke-width="0.8"/>
      <text x="998" y="44" fill="#ba4513" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">HỎI-2</text>
      <text x="1044" y="66" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">Từ điển chủ đầu tư</text>
      <text x="1044" y="82" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">tệp local</text>
      <text x="1044" y="96" fill="#636b80" font-size="9" text-anchor="middle">từ điển duyệt hay suy từ khu?</text>

      <!-- Hỏi-5: nút vùng có đúng một phường? -->
      <polygon points="1000,392 1104,448 1000,504 896,448" fill="#f5f5f5"/>
      <polygon points="1000,392 1104,448 1000,504 896,448" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4"/>
      <text x="1000" y="430" fill="#ba4513" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">HỎI-5</text>
      <text x="1000" y="448" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">Nút vùng có đúng</text>
      <text x="1000" y="464" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">một phường?</text>

      <!-- Phát biểu phường suy ra -->
      <rect x="920" y="552" width="160" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="1000" y="580" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">Phát biểu phường</text>
      <text x="1000" y="598" fill="#636b80" font-size="9" text-anchor="middle">suy ra từ nút vùng</text>

      <!-- Phát biểu toà trên tin (bắt đầu nhánh) -->
      <rect x="32" y="556" width="152" height="56" rx="28" fill="#f5f5f5"/>
      <rect x="32" y="556" width="152" height="56" rx="28" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="108" y="582" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">Phát biểu toà</text>
      <text x="108" y="598" fill="#636b80" font-size="9" text-anchor="middle">trên tin S0x</text>

      <!-- Hỏi-3: tin có khu? -->
      <polygon points="320,528 416,584 320,640 224,584" fill="#f5f5f5"/>
      <polygon points="320,528 416,584 320,640 224,584" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4"/>
      <text x="320" y="566" fill="#ba4513" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">HỎI-3</text>
      <text x="320" y="584" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">Tin có khu?</text>
      <text x="320" y="600" fill="#636b80" font-size="9" text-anchor="middle">sổ nhóm hay tên toà?</text>

      <!-- Khớp tên toà trong khu -->
      <rect x="480" y="552" width="160" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="560" y="580" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">Khớp tên toà</text>
      <text x="560" y="598" fill="#636b80" font-size="9" text-anchor="middle">trong khu · Pr6 = PR6</text>

      <!-- Hỏi-4: ứng viên -->
      <rect x="464" y="664" width="192" height="80" rx="6" fill="#f5f5f5"/>
      <rect x="464" y="664" width="192" height="80" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4"/>
      <rect x="472" y="672" width="44" height="16" rx="2" fill="transparent" stroke="rgba(235,108,54,0.60)" stroke-width="0.8"/>
      <text x="494" y="684" fill="#ba4513" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">HỎI-4</text>
      <text x="560" y="708" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">Ứng viên toà</text>
      <text x="560" y="724" fill="#4f5d75" font-size="9" text-anchor="middle">không đúc toà từ tin</text>
      <text x="560" y="738" fill="#636b80" font-size="9" text-anchor="middle">lối khác: đúc toà tạm</text>

      <!-- Không dùng (kết thúc) -->
      <rect x="256" y="676" width="128" height="40" rx="20" fill="#f5f5f5"/>
      <rect x="256" y="676" width="128" height="40" rx="20" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="320" y="700" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">Không dùng</text>

      <!-- ============ CHÚ GIẢI ============ -->
      <line x1="32" y1="776" x2="1128" y2="776" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <text x="32" y="796" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.18em">CHÚ GIẢI · HÌNH DẠNG CHỈ LOẠI NÚT</text>

      <rect x="32" y="812" width="24" height="12" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="64" y="822" fill="#4f5d75" font-size="9">Đầu vào / kết thúc</text>

      <rect x="176" y="812" width="24" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="208" y="822" fill="#4f5d75" font-size="9">Bước</text>

      <polygon points="268,818 280,812 292,818 280,824" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="300" y="822" fill="#4f5d75" font-size="9">Quyết định</text>

      <rect x="380" y="812" width="24" height="12" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="412" y="822" fill="#4f5d75" font-size="9">Sổ ghi lại</text>

      <rect x="500" y="812" width="24" height="12" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4"/>
      <text x="532" y="822" fill="#4f5d75" font-size="9">Hỏi chờ người quyết (Cổng Phạm vi)</text>

      <line x1="724" y1="820" x2="752" y2="820" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="760" y="822" fill="#4f5d75" font-size="9">Luồng chính</text>

      <line x1="848" y1="820" x2="876" y2="820" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <text x="884" y="822" fill="#4f5d75" font-size="9">Rẽ ra sổ / bỏ</text>
    </svg>
  </div>
</body>
</html>
