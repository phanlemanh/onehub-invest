schema_version: 1
feature_slug: ruler-p2-views-migration
evals:
  - id: E1
    criterion: AC-1
    executor: script
    cmd: config:executors.script.ruler_views_fresh
    expected: "exit 0; PASS 034 áp được; PASS v_ruler_p2_area cột area_id,m,n; PASS v_ruler_p2 cột area_id,property_type,m,n"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E2
    criterion: AC-2
    executor: script
    cmd: config:executors.script.ruler_views_idem
    expected: "exit 0; 034 lần 1 và lần 2 exit 0; md5 kết quả hai view không đổi"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E3
    criterion: AC-3
    executor: script
    cmd: config:executors.script.ruler_views_idem
    expected: "dòng 'PASS v_ruler_p2_area có N phường' với N > 0; should-NOT (vế chặn): không phường nào n<5 và không phường 1–4 căn nào lọt vào ruler"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E4
    criterion: AC-4
    executor: script
    cmd: config:executors.script.ruler_views_static
    expected: "should-NOT: seller_name không được gửi — PASS sync-cloud PII_EXCLUDE có properties.seller_name"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E5
    criterion: AC-5
    executor: script
    cmd: config:executors.script.ruler_views_static
    expected: "should-NOT: PASS SQL catch-up không tạo cột seller_name; PASS SQL catch-up chỉ DDL; PASS 034 không chạm cột người bán"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E6
    criterion: AC-6
    executor: script
    cmd: config:executors.script.ruler_views_cloudsim
    expected: "exit 0; catch-up 2 lần exit 0; chỉ thiếu properties.seller_name; không cột thừa; parent_id NULL được; v_ruler_p2 có"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E7
    criterion: AC-7
    executor: test
    cmd: config:executors.test.pipeline
    expected: "exit 0; 17/17 test pipeline xanh"
    evidence_required: [run_id, exit_code, verifier, verified_at]

  - id: E8
    criterion: AC-8
    executor: judgment
    question: "Hướng dẫn có cho Mạnh đủ để tự áp lên cloud an toàn không: nêu lý do, thứ tự bắt buộc (merge bản vá PII sync-cloud vào main TRƯỚC khi chạy SQL), lệnh chạy cụ thể, cách kiểm sau khi chạy (gồm kiểm cột seller_name vắng trên cloud) — và không có bước nào giao cho agent tự áp lên production? SQL được trỏ tới có khớp lời hướng dẫn không (chỉ DDL, không seller_name, gồm 034)?"
    inputs: [docs/ops/cloud-schema-catchup-2026-10-22.md, docs/ops/cloud-catchup-2026-10-22.sql, db/migrations/034_ruler_p2_views.sql, _acceptance/ruler-p2-views-migration/contract.md]
    evidence_required: [judged_by, verdict, rationale]
