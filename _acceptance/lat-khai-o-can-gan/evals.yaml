    question: "Tệp có ghi hạt giống, và với đủ 5 bài có mã bài, số ký tự, số ảnh, số giây không? Trung bình số giây có từ 45 trở xuống không?"
    expected: "Đủ hạt giống và đủ bốn trường của 5 bài, trung bình không quá 45 giây; thiếu trường nào thì không đạt."
