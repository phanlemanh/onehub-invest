schema_version: 1
slug: lat-khai-o-can-gan
evals:
  - id: E1
    criterion: AC-1
    executor: script
    cmd: bash _acceptance/lat-khai-o-can-gan/probes/doc.sh AC-1
    paths: [app/src/components/ops/labels/**, app/src/lib/labels-normalize.ts, app/tests/labels-lat-khai-o*]
    expected: "Biểu mẫu dựng thật của lát có khai: đúng hai ô, nhãn «Phân khu hoặc cụm», có «Không suy ra được», không có ô căn cứ, không có ô Lý do, bộ đếm 0/2. Đối chứng cùng tệp: lát theo nhóm không khai vẫn đủ 24 ô."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E2
    criterion: AC-2
    executor: script
    layer: backend-effect
    cmd: bash _acceptance/lat-khai-o-can-gan/probes/doc.sh AC-2
    paths: [app/src/lib/labels-normalize.ts, app/src/lib/labels-queries.ts, app/tests/labels-lat-khai-o*]
    expected: "Route thật trên lược đồ tạm, ma trận bốn tổ hợp viết trước, mỗi ô một assert trên dòng eval_labels: đúng hai dòng, not_stated, value chuẩn hoá, basis NULL, không dòng của ô khác. Đột biến bỏ bước lọc ô đỏ, thông điệp nêu ô thừa."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E3
    criterion: AC-3
    executor: script
    layer: backend-effect
    cmd: bash _acceptance/lat-khai-o-can-gan/probes/doc.sh AC-3
    paths: [app/src/lib/labels-normalize.ts, app/src/lib/labels-queries.ts, app/tests/labels-lat-khai-o*]
    expected: "Route thật: thiếu building, thiếu subzone, để trống từng ô → 400 nêu đúng ô, số dòng eval_labels không đổi. Đối chứng: đủ hai ô → 200."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E4
    criterion: AC-4
    executor: script
    layer: backend-effect
    cmd: bash _acceptance/lat-khai-o-can-gan/probes/doc.sh AC-4
    paths: [app/src/lib/labels-normalize.ts, app/src/lib/labels-queries.ts, app/tests/labels-lat-khai-o*]
    expected: "Hằng tạm không nằm trong BASIS; sau mọi ca lưu, SELECT trên eval_labels không có dòng mang hằng. Ma trận viết trước trên bốn lát không khai: lượt hợp lệ đủ ô với căn cứ thật → 200 (đối chứng dương); cùng lượt thay hằng ở một ô và ở mọi ô → 400, thông điệp nêu hằng, số dòng không đổi. Hai đột biến đỏ, thông điệp ghim: bỏ bước đặt basis rỗng (nêu giá trị lọt xuống DB); gỡ bước chặn lát không khai (nêu tên lát)."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E5
    criterion: AC-5
    executor: script
    layer: backend-effect
    cmd: bash _acceptance/lat-khai-o-can-gan/probes/doc.sh AC-5
    paths: [app/src/components/ops/labels/**, app/tests/labels-lat-khai-o*]
    expected: "Lát có khai có draft và đầu ra máy cấy chuỗi đánh dấu: biểu mẫu không điền nháp, không badge nháp; lưu xong đi tới đường dẫn bài kế, không có xem=. Ma trận ?xem= viết trước (bài đã lưu, bài chưa lưu, bài không tồn tại), mỗi ô một assert: trang là màn gắn của bài kế, HTML và props gửi xuống trình duyệt không chứa chuỗi đánh dấu. Đối chứng cùng fixture: lát không khai vẫn mở lượt hai và có chuỗi đánh dấu."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E6
    criterion: AC-6
    executor: script
    cmd: bash _acceptance/lat-khai-o-can-gan/probes/doc.sh AC-6
    paths: [app/src/components/ops/labels/**, app/tests/labels-lat-khai-o*]
    expected: "Bộ chọn của lát có khai ghi Phần 1, Phần 2, Phần 3, không chứa tên nhóm cấy trong fixture; khung bài vẫn có chữ bài và tên nhóm của bài. Đối chứng: lát không khai vẫn ghi tên nhóm."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
