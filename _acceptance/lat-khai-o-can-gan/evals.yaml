  - id: E10
    criterion: AC-9
    executor: ui-check
    layer: ui-observed
    paths: [app/src/components/ops/labels/**]
    steps:
      - "Bản chạy: dev server do phiên N1b giữ, DB thử có lát giả hai-khu-ghep-b; KHÔNG ghi DB máy thu. Che email đăng nhập, tên người đăng và ảnh tin trước khi chụp."
      - "Mở /ops/labels?lat=hai-khu-ghep-b ở 1280 px sáng → evidence/E10-step1.png (đúng hai ô, đếm 0/2)"
      - "Bấm Lưu khi còn trống → evidence/E10-step2.png (lỗi ngay dưới từng ô)"
      - "Điền hai ô rồi lưu → evidence/E10-step3.png (sang bài kế, không có màn xem máy đọc)"
      - "Cùng màn ở chế độ tối → evidence/E10-step4.png; khổ 390 px → evidence/E10-step5.png (không cuộn ngang trang)"
      - "Làm chậm mạng rồi bấm Lưu → evidence/E10-step6.png (nút «Đang lưu…»)"
      - "Ngắt mạng rồi bấm Lưu → evidence/E10-step7.png (cảnh báo kèm «Thử lại», chữ đã gõ còn nguyên); nối lại, bấm «Thử lại» → sang bài kế"
      - "Gắn hết bài của phần → evidence/E10-step8.png (trạng thái đã gắn hết)"
    expected: "Tám khung trên bản chạy đúng các trạng thái, đọc được ở sáng, tối, 390 px."
