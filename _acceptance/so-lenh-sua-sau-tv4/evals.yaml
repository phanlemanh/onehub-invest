schema_version: 1
feature_slug: so-lenh-sua-sau-tv4
# Ca «SS-AC-n». Bốn executor:
# - so_lenh_db (pipeline, DB thử của riêng lượt): scripts/lenh.test.mjs (thuần) + scripts/so-lenh.itest.mjs (lược đồ tạm chạy 091).
# - so_lenh_app (app, DB thử của riêng lượt): tests/so-lenh.test.tsx — handler route thật trên lược đồ tạm.
# - ops_apply_plist (pipeline, không DB): scripts/ops-apply-plist.test.mjs.
# - cap_token_may (gốc kho, không DB, không mạng): scripts/cap-token-may.test.mjs — mgmtExec giả, cloud.env tạm.
evals:
  - id: E1
    criterion: AC-1
    executor: test
    cmd: config:executors.test.so_lenh_db
    paths: [pipeline/lib/lenh.mjs, pipeline/scripts/lenh.test.mjs]
    expected: "exit 0; ca 'SS-AC-1' ma trận viết trước 9 ô (assert đúng 9 phần tử trước khi lặp): resume_when 5, true, {}, [] → deepEqual {ok:false, ly_do:'resume-when-sai-khuon'}; vắng, null, '', '  ', 'khi hết hạn mức' → deepEqual {ok:true}; đối chứng đỏ: bản sao lenh.mjs gỡ nhánh resume_when thì đúng 4 ô sai kiểu lệch, ca nêu 'resume-when-sai-khuon'"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E2
    criterion: AC-2
    executor: test
    cmd: config:executors.test.so_lenh_db
    paths: [pipeline/lib/lenh.mjs, app/src/lib/lenh.ts, pipeline/scripts/lenh.test.mjs]
    expected: "exit 0; ca 'SS-AC-2' chạy bản TS và bản .mjs trên hợp của ma trận 9 ô SS-AC-1 và 35 ô SL-AC-5 (assert đúng 44 ô), deepEqual từng ô; đối chứng đỏ: bản sao lenh.ts gỡ nhánh resume_when thì đúng 4 ô lệch, ca nêu tên ô"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E3
    criterion: AC-3
    executor: test
    cmd: config:executors.test.so_lenh_db
    layer: backend-effect
    paths: [pipeline/lib/lenh.mjs, pipeline/scripts/so-lenh.itest.mjs]
    expected: "exit 0; ca 'SS-AC-3' trên lược đồ tạm kiểu máy thu (091 + source_registry có S05 active, S06 active): apLenh(L1 source.pause S05 reason 'x' resume_when 5) không ném, deepEqual {outcome:'failed', ly_do:'resume-when-sai-khuon', before:null, after:null}; source_registry S05 deepEqual trước; change_request_applies đúng 1 dòng cho L1; apLenh(L2 source.pause S06 hợp lệ) → outcome 'applied', S06 paused; đối chứng đỏ: bản sao lenh.mjs gỡ nhánh resume_when thì apLenh(L1) ném TypeError — ca nêu 'kẹt hàng'"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E4
    criterion: AC-4
    executor: test
    cmd: config:executors.test.so_lenh_db
    layer: backend-effect
    paths: [pipeline/lib/lenh.mjs, pipeline/ops-apply.mjs, pipeline/scripts/so-lenh.itest.mjs]
    expected: "exit 0; ca 'SS-AC-4' cloud giả http trên cổng ngẫu nhiên trả [L1 resume_when 5, L2 hợp lệ] cho mọi lượt kéo: chạy ops-apply.mjs hai lượt với OPS_MACHINE_TOKEN thử, OPS_APPLY_CLOUD trỏ cloud giả, DATABASE_URL trỏ DB thử với search_path lược đồ tạm: lượt một thoát 0, kết quả báo lên deepEqual [L1 failed resume-when-sai-khuon, L2 applied]; lượt hai thoát 0, change_request_applies vẫn đúng 2 dòng, ops_audit không thêm dòng; đối chứng đỏ: chạy bằng bản sao lenh.mjs gỡ nhánh resume_when thì lượt một thoát khác 0 và L2 không có dòng sổ áp"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E5
    criterion: AC-5
    executor: test
    cmd: config:executors.test.so_lenh_app
    layer: backend-effect
    paths: [app/src/lib/lenh.ts, app/src/app/api/v1/ops/change-requests/route.ts, app/tests/so-lenh.test.tsx]
    expected: "exit 0; ca 'SS-AC-5' trên lược đồ tạm kiểu cloud: vai ops POST source.pause S05 reason 'x' resume_when 5 → 400, body.error 'lenh-sai-khuon', body.ly_do 'resume-when-sai-khuon'; số dòng change_requests và ops_audit deepEqual trước; cùng lời gọi với resume_when 'khi hết hạn mức' → 201 (đối chứng dương cùng fixture)"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E6
    criterion: AC-6
    executor: test
    cmd: config:executors.test.ops_apply_plist
    paths: [pipeline/cron/com.oneinvest.ops-apply.plist, pipeline/scripts/ops-apply-plist.test.mjs]
    expected: "exit 0; ca 'SS-AC-6' đọc plist bằng plutil -convert json: ProgramArguments deepEqual ['__NODE__', '__ROOT__/pipeline/ops-apply.mjs']; chuỗi tệp không chứa '/usr/bin/env'; đối chứng đỏ: bản sao plist đời TV4 (/usr/bin/env node) thì ca đỏ, nêu '/usr/bin/env'"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E7
    criterion: AC-7
    executor: test
    cmd: config:executors.test.ops_apply_plist
    paths: [docs/ops/runtime-map.md, pipeline/cron/com.oneinvest.ops-apply.plist, pipeline/scripts/ops-apply-plist.test.mjs]
    expected: "exit 0; ca 'SS-AC-7' rút từ docs/ops/runtime-map.md đúng một dòng chứa 'com.oneinvest.ops-apply.plist' và '__NODE__' (assert đúng 1 dòng), assert dòng chứa '~/Library/LaunchAgents' đúng 1 lần và không chứa 'launchctl', thay nó bằng thư mục tạm, assert sau thay không còn 'Library/LaunchAgents', rồi chạy bằng bash với HOME trỏ thư mục tạm; danh sách tên + mtime của ~/Library/LaunchAgents thật trước và sau ca deepEqual; plutil -lint plist sinh ra thoát 0; ProgramArguments[0] là đường tuyệt đối, tồn tại, thực thi được; env -i PATH=/usr/bin:/bin:/usr/sbin:/sbin <ProgramArguments[0]> -v thoát 0; tệp không chứa '__NODE__' hay '__ROOT__'; ProgramArguments[1] trỏ tệp ops-apply.mjs có thật; đối chứng đỏ: dòng cài bỏ vế thay __NODE__ thì ca đỏ, nêu '__NODE__'; dòng cài thêm 'launchctl load' thì ca đỏ trước khi chạy, nêu 'launchctl'"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E8
    criterion: AC-8
    executor: test
    cmd: config:executors.test.cap_token_may
    paths: [scripts/cap-token-may.mjs, scripts/cap-token-may.test.mjs]
    expected: "exit 0; ca 'SS-AC-8' gọi hàm chính của cap-token-may với argv --name may-thu-x --scope ops:pull --qua-mgmt --ghi-cloud-env, exec giả ghi lại câu SQL và trả [{name:'may-thu-x'}], cloud.env tạm 'A=1\\nB=2' (không xuống dòng cuối): thoát 0; stdout không khớp /om_[0-9a-f]{64}/; đúng 1 câu SQL, chứa sha256 hex của token trong tệp, không chứa token; tệp sau = 'A=1\\nB=2\\nOPS_MACHINE_TOKEN=om_<64 hex>\\n' (deepEqual theo dòng, hai dòng đầu nguyên byte); đối chứng đỏ: bản sao bỏ vế thêm xuống dòng thì dòng B bị nối, ca nêu 'dính dòng'"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E9
    criterion: AC-9
    executor: test
    cmd: config:executors.test.cap_token_may
    paths: [scripts/cap-token-may.mjs, scripts/cap-token-may.test.mjs]
    expected: "exit 0; ca 'SS-AC-9' ba nhánh: (a) cloud.env tạm đã có OPS_MACHINE_TOKEN → thoát 2, exec giả được gọi 0 lần, băm tệp trước = sau; (b) exec giả trả [] → thoát 2, băm tệp trước = sau; (c) --thu-hoi may-thu-x --qua-mgmt với exec giả trả [{name:'may-thu-x'}] → thoát 0, đúng 1 câu SQL khớp /UPDATE machine_tokens SET revoked_at = now\\(\\)/ và chứa 'may-thu-x'; đối chứng đỏ: bản sao bỏ kiểm tệp có sẵn thì nhánh (a) gọi exec 1 lần, ca nêu 'đã có token'"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E10
    criterion: AC-8
    executor: test
    cmd: config:executors.test.cap_token_may
    layer: backend-effect
    paths: [scripts/cap-token-may.mjs, scripts/cap-token-may.test.mjs, pipeline/sync-cloud.mjs]
    expected: "exit 0; ca 'SS-AC-8b' gọi chay() của cap-token-may với argv --name may-thu-x --scope ops:pull --qua-mgmt --ghi-cloud-env, home = thư mục tạm có .oneinvest/cloud.env 'SUPABASE_MGMT_TOKEN=t-thu\\n', mgmtExec THẬT của pipeline/sync-cloud.mjs với fetchImpl giả ghi lại request: đúng 1 request, URL kết thúc '/database/query', header Authorization deepEqual 'Bearer t-thu', JSON body.query chứa sha256 hex của token ghi trong tệp và không chứa token; fetchImpl trả Response 201 body '[{\"name\":\"may-thu-x\",\"scopes\":[\"ops:pull\"]}]' → thoát 0; lần chạy khác với tệp mới trả '[]' → thoát 2, băm tệp trước = sau; tiến trình con chỉ import module cap-token-may với globalThis.fetch bị thay bằng hàm ném → thoát 0, không lời gọi nào; đối chứng đỏ: bản sao chay() không đọc SUPABASE_MGMT_TOKEN từ tệp thì header là 'Bearer undefined', ca nêu 'mgmt-token'"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
