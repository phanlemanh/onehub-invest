<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ảnh tin theo vai</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Lora:ital,wght@0,400;1,400&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Lora', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1120px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.25;
      color: var(--color-ink);
      margin-bottom: 0.5rem;
    }
    .sub {
      font-size: 0.875rem;
      color: var(--color-muted);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 960px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Hỏi-1 · the-duyet-du-can-cu</p>
    <h1>Ảnh của một tin tới vai nào</h1>
    <p class="sub">Hai loại ảnh rẽ theo ba vai · AC-4 · AC-9</p>

    <svg viewBox="0 104 1040 424" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
      </defs>

      <rect x="0" y="104" width="1040" height="424" fill="#f5f5f5"/>


      <!-- ============ CONNECTORS (vẽ trước hộp) ============ -->
      <!-- Tin → ảnh đã tải -->
      <path d="M220,268 H244 Q252,268 252,260 V208 Q252,200 260,200 H300" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Tin → chỉ URL gốc -->
      <path d="M220,292 H264 Q272,292 272,300 V352 Q272,360 280,360 H300" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Ảnh đã tải → Quản trị viên -->
      <path d="M520,188 H556 Q564,188 564,180 V152 Q564,144 572,144 H640" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Chỉ URL gốc → Quản trị viên -->
      <path d="M520,348 H588 Q596,348 596,340 V176 Q596,168 604,168 H640" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Ảnh đã tải → Vận hành (khuyến nghị Hỏi-1) — nhảy cầu qua trục x=596 -->
      <path d="M520,212 H540 Q548,212 548,220 V260 Q548,268 556,268 H590 A6,6 0 0 1 602,268 H640" fill="none" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <!-- Chỉ URL gốc → Vận hành: không tới dạng ảnh, chỉ thành câu -->
      <path d="M520,372 H608 Q616,372 616,364 V300 Q616,292 624,292 H640" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>

      <!-- ============ NÚT ============ -->
      <!-- Ảnh của một tin -->
      <rect x="40" y="244" width="180" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/>
      <text x="130" y="276" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Ảnh của một tin</text>
      <text x="130" y="296" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">bảng media · máy thu</text>

      <!-- Ảnh đã tải về máy thu -->
      <rect x="300" y="168" width="220" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="410" y="196" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Ảnh đã tải về máy thu</text>
      <text x="410" y="214" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">local_file</text>

      <!-- Chỉ có URL gốc -->
      <rect x="300" y="328" width="220" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="410" y="356" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Chỉ có URL gốc</text>
      <text x="410" y="374" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">mang tên miền nguồn — tầng A</text>

      <!-- Quản trị viên -->
      <rect x="640" y="128" width="160" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="720" y="160" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Quản trị viên</text>

      <!-- Dấu khuyến nghị trên nhánh Vận hành -->
      <rect x="640" y="228" width="128" height="16" rx="2" fill="#f5f5f5" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>
      <text x="704" y="240" fill="#ba4513" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">khuyến nghị (Hỏi-1)</text>

      <!-- Vận hành (focal) -->
      <rect x="640" y="252" width="160" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="640" y="252" width="160" height="56" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4"/>
      <text x="720" y="284" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Vận hành</text>

      <!-- Viewer: không đường vào -->
      <rect x="640" y="376" width="160" height="56" rx="6" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.40)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="720" y="408" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Viewer</text>

      <!-- ============ NHÃN KẾT QUẢ ============ -->
      <text x="816" y="160" fill="#2d3142" font-size="11" font-family="'Geist', sans-serif">thấy cả hai</text>

      <text x="816" y="264" fill="#2d3142" font-size="11" font-family="'Geist', sans-serif">thấy ảnh đã tải;</text>
      <text x="816" y="280" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif">ảnh chỉ có URL gốc thành câu</text>
      <text x="816" y="294" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif">«N ảnh chỉ có ở nguồn —</text>
      <text x="816" y="308" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif">quản trị viên xem được»</text>

      <text x="816" y="404" fill="#2d3142" font-size="11" font-family="'Geist', sans-serif">không thấy ảnh</text>
      <text x="816" y="420" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif">(chỉ số thẻ chờ)</text>

      <!-- Ghi chú nhỏ -->
      <text x="40" y="420" fill="#4f5d75" font-size="14" font-style="italic" font-family="'Instrument Serif', 'Lora', serif">Hôm nay chỉ quản trị viên thấy ảnh.</text>

      <!-- ============ CHÚ GIẢI ============ -->
      <line x1="40" y1="456" x2="1000" y2="456" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <text x="40" y="476" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.18em">CHÚ GIẢI</text>

      <line x1="40" y1="496" x2="68" y2="496" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="76" y="500" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Ảnh tới vai</text>

      <line x1="176" y1="496" x2="204" y2="496" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <text x="212" y="500" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Ảnh tới vai — nhánh khuyến nghị</text>

      <line x1="400" y1="496" x2="428" y2="496" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <text x="436" y="500" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Ảnh không tới — chỉ còn câu chữ</text>

      <rect x="628" y="490" width="16" height="12" rx="2" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.40)" stroke-width="1" stroke-dasharray="3,2"/>
      <text x="652" y="500" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Vai không nhận ảnh nào</text>
    </svg>
  </div>
</body>
</html>
