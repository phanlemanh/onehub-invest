<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quyết kèm lý do</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Lora:ital,wght@0,400;1,400&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Lora', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 960px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.25;
      color: var(--color-ink);
      margin-bottom: 0.5rem;
    }
    .sub {
      font-size: 0.875rem;
      color: var(--color-muted);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 800px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Hỏi-2 · the-duyet-du-can-cu</p>
    <h1>Quyết kèm lý do, ghi trong một giao dịch</h1>
    <p class="sub">Năm bước nối tiếp, một nhánh lỗi · AC-7 · AC-8</p>

    <svg viewBox="0 0 880 504" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
      </defs>

      <rect x="0" y="0" width="880" height="504" fill="#f5f5f5"/>

      <!-- ============ CONNECTORS (vẽ trước hộp) ============ -->
      <line x1="300" y1="64" x2="300" y2="88" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="300" y1="136" x2="300" y2="160" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="300" y1="216" x2="300" y2="240" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="300" y1="356" x2="300" y2="380" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Nhánh lỗi -->
      <line x1="500" y1="296" x2="560" y2="296" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <line x1="672" y1="320" x2="672" y2="368" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>

      <!-- Leader của ghi chú Hỏi-2 -->
      <path d="M576,40 Q500,40 428,44" fill="none" stroke="rgba(45,49,66,0.40)" stroke-width="1" stroke-dasharray="4,3"/>
      <circle cx="428" cy="44" r="2" fill="#2d3142"/>

      <!-- ============ NÚT ============ -->
      <!-- 1 · Người duyệt gõ Lý do (bắt đầu) -->
      <rect x="180" y="24" width="240" height="40" rx="20" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="300" y="48" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Người duyệt gõ Lý do</text>

      <!-- 2 · Bấm quyết -->
      <rect x="160" y="88" width="280" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="300" y="108" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Bấm quyết</text>
      <text x="300" y="124" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">nút tắt khi trống</text>

      <!-- 3 · Route kiểm lý do -->
      <rect x="120" y="160" width="360" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="300" y="184" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Route kiểm lý do</text>
      <text x="300" y="202" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">thiếu / trắng / &gt; 1.000 ký tự → 400, không đổi gì</text>

      <!-- 4 · MỘT transaction (focal) -->
      <rect x="100" y="240" width="400" height="116" rx="6" fill="#f5f5f5"/>
      <rect x="100" y="240" width="400" height="116" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4"/>
      <text x="300" y="264" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">MỘT transaction</text>
      <circle cx="124" cy="288" r="3" fill="#4f5d75"/>
      <text x="136" y="292" fill="#2d3142" font-size="10" font-family="'Geist Mono', monospace">review_queue.status + decision_note</text>
      <circle cx="124" cy="312" r="3" fill="#4f5d75"/>
      <text x="136" y="316" fill="#2d3142" font-size="10" font-family="'Geist', sans-serif">bảng đích <tspan font-family="'Geist Mono', monospace">(property_candidates / enrichment_proposals)</tspan></text>
      <circle cx="124" cy="336" r="3" fill="#4f5d75"/>
      <text x="136" y="340" fill="#2d3142" font-size="10" font-family="'Geist Mono', monospace">ops_audit review.decide <tspan font-family="'Geist', sans-serif">có</tspan> ly_do</text>

      <!-- 5 · COMMIT (kết thúc) -->
      <rect x="228" y="380" width="144" height="40" rx="20" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/>
      <text x="300" y="404" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">COMMIT</text>

      <!-- Lỗi · INSERT ops_audit hỏng -->
      <rect x="560" y="272" width="224" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="672" y="300" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">INSERT ops_audit hỏng</text>

      <!-- Lỗi · ROLLBACK (kết thúc) -->
      <rect x="544" y="368" width="256" height="56" rx="20" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/>
      <text x="672" y="392" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">ROLLBACK</text>
      <text x="672" y="410" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">thẻ vẫn chờ, decision_note trống, 500</text>

      <!-- Ghi chú bên · Hỏi-2 -->
      <text x="584" y="44" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', 'Lora', serif">Hỏi-2 — bắt buộc cho MỌI quyết định</text>
      <text x="584" y="64" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', 'Lora', serif">(khuyến nghị) hay chỉ khi bác/hoãn</text>

      <!-- ============ CHÚ GIẢI ============ -->
      <line x1="40" y1="448" x2="840" y2="448" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <text x="40" y="468" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.18em">CHÚ GIẢI</text>

      <rect x="40" y="480" width="24" height="12" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="72" y="490" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Đầu / cuối</text>

      <rect x="152" y="480" width="16" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="176" y="490" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Bước</text>

      <rect x="232" y="480" width="16" height="12" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4"/>
      <text x="256" y="490" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Mọi ghi chép nằm trong một transaction</text>

      <line x1="472" y1="486" x2="500" y2="486" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <text x="508" y="490" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Nhánh lỗi</text>
    </svg>
  </div>
</body>
</html>
