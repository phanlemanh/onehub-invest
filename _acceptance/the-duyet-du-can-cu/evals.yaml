schema_version: 1
feature_slug: the-duyet-du-can-cu
# Ca «TD-AC-n» ở app/tests/the-duyet-du-can-cu.test.tsx (node --test + tsx; jsdom cho sheet; ca DB dựng lược đồ tạm
# `td_<pid>` bằng schemaUrl như viewer-the-duyet.test.tsx, dữ liệu viết trước, xoá cuối lượt). Ca agent «TD-AC-6» ở
# agent/tests/enrich-goi-y.test.ts (DB local trong ROLLBACK như enrich-db.test.ts). Gốc kho suy từ import.meta.url.
# Mỗi phép đo mới có cặp hai chiều trên cùng fixture: vật lành → xanh; bản chép tạm của tệp nguồn (tests/.td-cu-*) đổi
# đúng một chỗ → đỏ với thông điệp ghim.
evals:
  - id: E1
    criterion: AC-1
    executor: test
    cmd: config:executors.test.the_duyet
    paths: [app/src/components/ops/review-card.tsx, app/src/components/ops/review/**, app/src/lib/ops/review-can-cu.ts, app/src/lib/ops/review-queue.ts, app/tests/the-duyet-du-can-cu.test.tsx]
    expected: "exit 0; ca 'TD-AC-1' xanh: fixture thẻ bổ sung tin 3 trường (1 xung đột hai bên có basis, 1 không xung đột có basis «LLM m · tự tin 92% · trace t», 1 không basis) dựng bằng ReviewCard thật → mỗi trường đúng một hàng [data-review-field] có tên · giá trị · phương pháp · căn cứ; hàng không basis có đúng «Chưa ghi căn cứ»; không hàng nào chứa '92' hay 'tự tin'. Chiều đỏ: bản chép review-card bỏ ô căn cứ của trường không xung đột → 'TD-AC-1: trường bathrooms thiếu ô căn cứ'"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E2
    criterion: AC-2
    executor: test
    cmd: config:executors.test.the_duyet
    paths: [app/src/lib/ops/review-can-cu.ts, app/src/components/ops/review-card.tsx, app/src/components/ops/review/**, app/tests/the-duyet-du-can-cu.test.tsx]
    expected: "exit 0; ca 'TD-AC-2' xanh: ma trận viết trước 10 trường × {khớp, lệch, thiếu một bên} = 30 ca cho hàm thuần soTruongGhepCan (30 assert); bảng dựng bằng ReviewCard thật có đúng 10 hàng [data-review-compare]; ma trận viết trước TOÀN BỘ VOCAB.evidence_tier × VOCAB.assertion_method của vocab.generated.ts (3 × 6 = 18 phần tử, 18 assert) qua nhanCanCu ra chuỗi khác rỗng chứa nhãn LABELS_VI tương ứng (legacy ra «Giá trị có trước — chưa có căn cứ»), không chép nhãn tay trong test; probe chỉ đọc trên DB local thật: SELECT DISTINCT evidence_tier, method của field_assertions còn hiệu lực → mọi cặp có nhãn (0 cặp rơi về chuỗi rỗng hay mã thô); trường giá/diện tích/phường mang «Chưa ghi căn cứ — đọc từ tin». Chiều đỏ: bản chép soTruongGhepCan coi null = null là khớp → 'TD-AC-2: tầng thiếu cả hai bên phải là Thiếu'"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E3
    criterion: AC-2
    executor: test
    cmd: config:executors.test.the_duyet
    layer: backend-effect
    paths: [app/src/lib/ops/review-context.ts, app/src/components/ops/review-content.tsx, app/tests/the-duyet-du-can-cu.test.tsx]
    expected: "exit 0; ca 'TD-AC-2 DB' xanh: lược đồ tạm có sale_offers với field_provenance ghi bởi resolve_offer_fields thật của 045 (không viết tay jsonb) cho hai tin của một thẻ ghép căn → loadReviewContext trả căn cứ khớp từng ô của field_provenance (round-trip từ bên ghi). Chiều đỏ: tin không có field_provenance → mọi trường trục ra 'Chưa ghi căn cứ — đọc từ tin', không ném"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E4
    criterion: AC-3
    executor: test
    cmd: config:executors.test.the_duyet
    layer: backend-effect
    paths: [app/src/lib/ops/review-context.ts, app/src/components/ops/review-card.tsx, app/src/components/ops/review/**, app/tests/the-duyet-du-can-cu.test.tsx]
    expected: "exit 0; ca 'TD-AC-3' xanh: lược đồ tạm có bài S03 1.200 ký tự (hai bản, bản mới nhất khác bản cũ, có xuống dòng) theo post_ids, tin S06 có payload.body 800 ký tự theo originating_system_key, tin S05 không bài → khối [data-review-fulltext] của S03 bằng đúng bản mới nhất từng ký tự, S06 bằng body, S05 là 'Không có toàn văn ở máy thu'; không phần tử nào trong khối mang line-clamp; tên nhóm nằm ở [data-review-group], không đứng đầu khối toàn văn. Chiều đỏ: bản chép loader cắt left(text, 300) → 'TD-AC-3: toàn văn S03 dài 300, kỳ vọng 1200'. Probe khoá nối trên DB local thật (chỉ đọc, dữ liệu do importer + transform thật ghi): mọi thẻ chờ có tin S03/S06 mà stg_zalo_posts (theo post_ids) hay stg_chotot_ads (theo list_id = originating_system_key) có bài → loadReviewContext trả toàn văn khác null, tỉ lệ 100%; ghim 'TD-AC-3 probe: thẻ #<id> có bài gốc ở stg mà loader trả null'"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E5
    criterion: AC-4
    executor: test
    cmd: config:executors.test.the_duyet
    layer: backend-effect
    paths: [app/src/lib/ops/review-media.ts, app/src/lib/ops/zalo-media.ts, app/src/app/api/zalo-media/**, app/src/components/ops/review-photos.tsx, app/tests/the-duyet-du-can-cu.test.tsx]
    expected: "exit 0; ca 'TD-AC-4' xanh: ma trận viết trước 5 vai (user, viewer, ops, admin, owner) × {ảnh đã tải, ảnh chỉ URL gốc} = 10 ca: loadReviewMedia trên lược đồ tạm có bảng media trả ảnh local cho ops/admin/owner, URL gốc chỉ cho admin/owner, {} cho user/viewer; serveZaloMedia chế độ snapshot trên tệp thật trong thư mục tạm: ops/admin/owner 200, user/viewer 404; sheet vai ops với tin chỉ có URL gốc không có <img> nào mang src ngoài /api/zalo-media và hiện câu ảnh chỉ có ở nguồn. Chiều đỏ: bản chép loader trả URL gốc cho ops → 'TD-AC-4: vai ops nhận URL gốc'. Probe trên DB local thật (bảng media do transform-media thật dựng, chỉ đọc): mọi dòng media có local_file của offer trên thẻ chờ → loadReviewMedia vai ops trả đúng số ảnh local đó (so đếm từng tin)"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
