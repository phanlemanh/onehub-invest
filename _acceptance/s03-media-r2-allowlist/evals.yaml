schema_version: 1
feature_slug: s03-media-r2-allowlist
evals:
  - id: E1
    criterion: AC-1
    executor: test
    cmd: config:executors.script.zc15_media_test
    paths: [collector/src/core/media-fetch.ts, collector/src/test/media-fetch.test.ts]
    expected: "exit 0; 0 fail; ca «ZC9: r2.dev nằm trong danh sách mặc định» và «ZC9 hành vi: pub-x.r2.dev qua được mặc định» xanh (file + sha256 có trong meta.mediaFiles qua server thật); ca zdn.vn cũ xanh. Chiều đỏ (ZCode đo 22/11, ghim lại ở S4 bằng bản sao): bỏ hằng r2.dev khỏi DEFAULTS → 2 ca đỏ."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E2
    criterion: AC-2
    executor: test
    cmd: config:executors.script.zc15_media_test
    paths: [collector/src/core/media-fetch.ts, collector/src/test/media-fetch.test.ts]
    expected: "exit 0; ca ranh giới xanh: evilr2.dev → false, r2.dev.evil.com → false, zdn.vn ở giữa host khác → false, f20-zpc.zdn.vn → true; parseHostSuffixes không nhận hậu tố một nhãn nên không mở được cả một đuôi quốc gia."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E3
    criterion: AC-3
    executor: test
    cmd: config:executors.script.zc15_media_test
    paths: [collector/src/core/media-fetch.ts, collector/src/api/server.ts, collector/src/test/media-fetch.test.ts]
    expected: "exit 0; ca «ZC15: tệp hậu tố trong stateDir mở host đích chuyển hướng» xanh trên CÙNG fixture hai chiều: nguồn là localhost (được phép sẵn), host đích là 127.0.0.1; stateDir có media-host-suffixes.txt ghi hậu tố hai nhãn '0.0.1' → ảnh localhost/redir-ip.jpg (chuyển sang 127.0.0.1) có file + sha256 khớp byte, URL gốc 127.0.0.1/a.jpg tải được; stateDir không có tệp → cùng ảnh mang error 'redirect-host' và URL gốc → 'host-not-allowed' (thông điệp ghim). Đột biến đo 25/11: bỏ phần hậu tố thêm trong server.ts → ca này và ca biến môi trường đỏ."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E4
    criterion: AC-4
    executor: test
    cmd: config:executors.script.zc15_media_test
    paths: [collector/src/core/media-fetch.ts, collector/src/api/server.ts, collector/src/test/media-fetch.test.ts]
    expected: "exit 0; ca «ZC15: parseHostSuffixes lọc dòng hỏng» xanh: đầu vào có 'vn', 'localhost', '.x.com', 'x.com.', 'a_b.com', '# chú thích', dòng trống, 'Pub.Example.COM ' → đúng ['pub.example.com'] (chữ thường, cắt trắng; một nhãn như 'vn', 'localhost' bị bỏ — không ngoại lệ); ca biến môi trường ONEINVEST_MEDIA_HOST_SUFFIXES='0.0.1,bad' (không tệp) mở được localhost/redir-ip.jpg; ca log: dòng log khởi động có '+ 1 hậu tố thêm' và KHÔNG chứa chuỗi hậu tố thêm. Chiều đỏ trong cùng ca: biến môi trường rỗng → redirect-host."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E5
    criterion: AC-5
    executor: test
    cmd: config:executors.script.zc15_media_test
    paths: [collector/src/core/media-fetch.ts, collector/src/test/media-fetch.test.ts]
    expected: "exit 0; ca «ZC15: Accept chỉ xin jpeg, png, webp, gif» xanh: CDN giả ghi header accept của yêu cầu /a.jpg; assert có 'image/jpeg', không có 'image/jxl', không có '*/*'. Chiều đỏ: bản main (không đặt accept) để fetch gửi '*/*' → ca đỏ với thông điệp ghim 'accept'."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E6
    criterion: AC-6
    executor: test
    cmd: config:executors.script.zc15_media_test
    paths: [collector/src/core/media-fetch.ts, collector/src/test/media-fetch.test.ts]
    expected: "exit 0; ca «ZC15: JPEG XL lưu nguyên byte với đuôi .jxl» xanh: CDN giả trả /jxl-cs.jpg (byte mở FF 0A) và /jxl-box.jpg (hộp 00 00 00 0C 'JXL ') → file 'media/<16 hex>.jxl', sha256 = sha256 byte gốc, không error; /a.jpg vẫn '.jpg'. Chiều đỏ: bản main đặt đuôi theo URL → '.jpg' cho byte JPEG XL (ca đỏ ghim 'đuôi .jxl')."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E7
    criterion: AC-7
    executor: test
    cmd: config:executors.script.collector_test_clean
    paths: [collector/src/**]
    expected: "exit 0; toàn bộ test collector trên dist vừa xoá (rm -rf dist) 0 fail — gồm các ca cũ của media-fetch: 404, quá dung lượng, timeout, chạy chồng flush, redirect trong/ngoài danh sách, trần URL mỗi flush, giao thức lạ, huỷ theo hạn tắt (graceful-shutdown-integration)."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E8
    criterion: AC-7
    executor: script
    cmd: config:executors.script.collector_check
    paths: [collector/src/**]
    expected: "exit 0; tsc --noEmit không lỗi (TypeScript strict, luật 12)."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E9
    criterion: AC-7
    executor: script
    cmd: config:executors.script.zc15_khuon_media_files
    paths: [collector/src/core/media-fetch.ts]
    expected: "exit 0; stdout 'KHUON-MEDIA-FILES PASS': type MediaFileEntry trong media-fetch.ts có đúng năm khoá url, file, sha256, bytes, error (so ghim với main); chiều đỏ --tu-thu: thêm khoá 'finalHost' vào bản chép → FAIL 'khuôn meta.mediaFiles đổi'."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E10
    criterion: AC-8
    executor: script
    cmd: config:executors.script.zc15_khong_ten_that
    paths: ["**"]
    expected: "exit 0; stdout 'KHONG-TEN-THAT PASS — <n> host soát, 0 chỗ trong cây, 0 commit': đọc tên host từ tệp local trên máy thu (collector/state/media-host-suffixes.txt của checkout chính, rồi tệp nghiên cứu local của LL), git grep -F cây nhánh và git log -p origin/main..HEAD → 0; không in tên. Không có tệp nguồn nào → exit 2 'không đo được ở đây' (không xanh giả). Chiều đỏ --tu-thu: chép tên thứ nhất vào một tệp của bản sao cây → FAIL 'tên host đích có trong cây' với đường tệp."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E11
    criterion: AC-9
    executor: script
    cmd: config:executors.script.zc15_ap_may_thu
    paths: [_acceptance/s03-media-r2-allowlist/ap-may-thu/**, collector/src/core/media-fetch.ts]
    expected: "exit 0; stdout 'AP-MAY-THU PASS': README có năm mục, mỗi mục có lệnh hay con số (mục 2 có số trước 27,5% và 20,9%; mục 1 có 'npm run build', 'media-host-suffixes.txt', 'kickstart' kèm 'lời riêng của Mạnh'; mục 3 có sao lưu dist; mục 4 có lùi; mục 5 có 'kiem-sau.mjs'); kiem-sau chấm đúng các bộ dòng mẫu (1 ĐẠT; còn r2.dev host-not-allowed → KHÔNG ĐẠT 'r2.dev'; còn redirect-host → KHÔNG ĐẠT 'redirect-host'; chưa có ảnh r2.dev nào tải được → KHÔNG ĐẠT 'chưa có ảnh r2.dev'; không bài mới → KHÔNG ĐẠT 'chưa có bài mới'); round-trip writer thật: meta.mediaFiles sinh bằng fetchMessageMedia của nhánh (CDN giả) → ĐẠT, bằng media-fetch của main → KHÔNG ĐẠT đúng lý do. Phá mục 2 thành 'sẽ đo' → FAIL 'README mục 2'. Rò tên: kiem-sau chạy trên mẫu canh-gac.json (URL mang host canh gác 'canh-gac-zc15.example') → stdout+stderr không chứa 'canh-gac'; --ty-le in tỉ lệ đích tính trên chính ngày đo (bỏ bài chỉ hỏng vì r2.dev chặn hay redirect-host)."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E12
    criterion: AC-7
    executor: test
    cmd: config:executors.suite.pipeline_a
    long_running: 90
    paths: [collector/src/core/media-fetch.ts, collector/src/api/server.ts]
    expected: "exit 0; nửa A bộ test pipeline, 0 fail — suite chạy vì collector/src nằm trong vùng suite pipeline (suite-neu-doi); khai ở đây để có long_running 90 (Mac mini nửa A ~41′ vượt trần 30′; luật GS 24/11), paths hẹp theo R4."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E13
    criterion: AC-7
    executor: test
    cmd: config:executors.suite.pipeline_b
    long_running: 90
    paths: [collector/src/core/media-fetch.ts, collector/src/api/server.ts]
    expected: "exit 0; nửa B bộ test pipeline, 0 fail — cùng lý do với E12 (~24′)."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
