schema_version: 1
feature_slug: khu-trung-anh-tin
# Ca thuần «KTA-AC-n» ở pipeline/scripts/khu-trung-anh.test.mjs và app/tests/khu-trung-anh.test.tsx; ca DB ở pipeline/scripts/khu-trung-anh.itest.mjs (DB thử).
# Ma trận viết trước, số assert bằng số dòng. Mỗi ma trận có ca đỏ trên bản sao đột biến, ghim thông điệp.
evals:
  - id: E1
    criterion: AC-1
    executor: test
    cmd: config:executors.test.kta_pipeline
    paths: [pipeline/media-rows.mjs, pipeline/scripts/khu-trung-anh.test.mjs]
    expected: "exit 0; ca 'KTA-AC-1' xanh trên 6 dòng ma trận (trong bài, giữa hai bài, băm viết hoa, ba lần trùng, hai băm xen kẽ, cùng băm ở hai tin vẫn là hai dòng của hai tin), so `media_key` với mediaKey(offer, tệp đầu); ca đỏ trên bản sao bỏ bước khử băm báo 'KTA-AC-1' và tên dòng ma trận."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E2
    criterion: AC-2
    executor: test
    cmd: config:executors.test.kta_pipeline
    paths: [pipeline/media-rows.mjs, pipeline/scripts/khu-trung-anh.test.mjs]
    expected: "exit 0; ca 'KTA-AC-2' xanh trên 6 dòng ma trận (thiếu băm, băm 63 ký tự, băm không phải hex, tải lỗi, chỉ URL lặp, URL của tệp đã khử nằm ở cột media); kiểm tĩnh: media-rows.mjs chỉ import node:crypto; ca đỏ trên bản sao để URL của tệp đã khử quay lại báo tên dòng."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E3
    criterion: AC-3
    executor: script
    layer: backend-effect
    cmd: config:executors.script.kta_db
    paths: [pipeline/transform-media.mjs, pipeline/media-rows.mjs, pipeline/scripts/khu-trung-anh.itest.mjs]
    expected: "exit 0; ca 'KTA-AC-3' xanh trên DB thử: rows ghi từ runTransformMedia thật, ảnh trùng băm của bài chỉ-ảnh không có dòng, ảnh khác băm có media_order lớn hơn mọi ảnh bài chữ; ca đỏ trên bản sao noiSau không xét băm báo 'KTA-AC-3'."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E4
    criterion: AC-3
    executor: script
    layer: backend-effect
    cmd: config:executors.script.gop_anh_that
    paths: [pipeline/transform-media.mjs, pipeline/scripts/do-gop-anh.mjs, pipeline/scripts/gop-anh.itest.mjs, pipeline/scripts/media-canonical.itest.mjs]
    expected: "exit 0; toàn bộ ca PL28 và NH1 trên DB thử còn xanh; do-gop-anh trên bản chép dữ liệu thật in hiệu tập cặp giữa cách tính cũ và mới, mọi cặp chênh giải thích được bằng trùng băm; số offer S03 có ảnh không giảm. Đối chứng luôn chạy: bài chỉ-ảnh có một băm chưa vào tin và URL không có ở bảng thì thước báo 'do-gop-anh: lệch'."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E5
    criterion: AC-4
    executor: script
    layer: backend-effect
    cmd: config:executors.script.kta_db
    paths: [pipeline/transform-media.mjs, pipeline/media-rows.mjs, pipeline/scripts/khu-trung-anh.itest.mjs]
    expected: "exit 0; ca 'KTA-AC-4' xanh: tin S06 thử có hai URL trùng nhau, dòng sau transform trùng từng cột với mediaRowsFromAd; ca đỏ trên bản sao mediaRowsFromAd đổi thứ tự báo 'KTA-AC-4'."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E6
    criterion: AC-5
    also_covers: [AC-4, AC-9]
    executor: script
    layer: backend-effect
    cmd: config:executors.script.kta_do
    paths: [pipeline/scripts/do-khu-trung-anh.mjs, pipeline/transform-media.mjs, pipeline/media-rows.mjs]
    expected: "exit 0; giao dịch READ ONLY trên DB máy thu; in mẫu số (tin so được, băm so được, băm bị loại vì lệch thời gian), bảng trước và sau theo nguồn (dòng, ảnh khác nội dung, tin còn trùng, ảnh khác nội dung trong trần 12), số dòng sẽ xoá, số dòng đổi thứ tự, riêng các tin vượt 12 ảnh khác nhau. So được dưới 1.700 tin có tệp thì exit 1 báo 'mẫu số'. Mất băm 0, tin còn trùng 0, dòng S06 lệch 0, dòng chỉ URL lệch 0. Bốn đối chứng luôn chạy, mỗi cái ghim thông điệp: 'mất băm', 'còn trùng', 'S06 lệch', 'URL lệch'."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E7
    criterion: AC-6
    executor: script
    layer: backend-effect
    cmd: config:executors.script.kta_db
    paths: [pipeline/transform-media.mjs, pipeline/scripts/khu-trung-anh.itest.mjs]
    expected: "exit 0; ca 'KTA-AC-6' xanh trên ma trận dòng trùng ở đầu, giữa, cuối tin, có dòng khác băm đứng sau: sau lượt đầu media_order liền nhau trong bảng thật, media_key không đổi, dòng dời chỗ có dấu thời gian mới, dòng không dời giữ dấu 2000-01-01; lượt hai thêm 0 đổi 0 xoá 0; ca đỏ trên bản sao khoá dòng theo băm thay vì tệp báo đổi khoá."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E8
    criterion: AC-7
    executor: script
    layer: backend-effect
    cmd: config:executors.script.kta_app_db
    paths: [app/src/lib/ops/review-media.ts, app/src/lib/data-flow-queries.ts, app/src/lib/deals.ts, pipeline/media-rows.mjs, pipeline/transform-media.mjs, app/tests/khu-trung-anh-db.test.tsx]
    expected: "exit 0; ca 'KTA-AC-7' xanh trên DB thử: 20 entry 13 băm ghi qua runTransformMedia thật, loadReviewMedia, loadFlowMedia và loader Căn giá tốt mỗi nơi trả đúng 12 ảnh khác băm theo media_order; ma trận NH-AC-3 cộng ca trùng băm xanh; ca đỏ: bản sao buildOfferImages không khử băm lệch với bên ghi."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E9
    criterion: AC-8
    executor: test
    cmd: config:executors.test.kta_app
    paths: [app/src/lib/labels-anh.ts, app/src/lib/ops/zalo-media.ts, app/tests/khu-trung-anh.test.tsx]
    expected: "exit 0; ca 'KTA-AC-8' xanh trên 5 dòng ma trận của danhSachAnh; serveZaloMedia thật với tệp giả trả đúng byte theo từng số anh, ngoài khoảng 404; dữ liệu thẻ không có khoá sha256 hay giá trị băm; ca đỏ trên bản sao bỏ bước khử báo tên dòng."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E10
    criterion: AC-9
    executor: test
    cmd: config:executors.test.kta_pipeline
    paths: [pipeline/media-rows.mjs, pipeline/scripts/khu-trung-anh.test.mjs]
    expected: "exit 0; ca 'KTA-AC-9' xanh trên 4 dòng ma trận: dựng hai lần deepEqual; bản giữ lại là lần đầu theo post_ids khi tệp, URL, băm của lần sau sắp nhỏ hơn; ca đỏ trên bản sao chọn bản giữ theo băm hay tên tệp nhỏ nhất báo 'KTA-AC-9' và tên dòng."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
