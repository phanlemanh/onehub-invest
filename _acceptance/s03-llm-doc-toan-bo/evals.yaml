  - id: E12
    criterion: AC-7
    executor: ui-check
    layer: ui-observed
    paths: [app/src/components/ops/review-card.tsx]
    target: "http://localhost:3462/ops/review"
    steps: "đăng nhập tài khoản ops thử (scripts/dev-ops-account.mjs --vai ops), mở /ops/review trên DB thử có thẻ fixture E1 trái model + ý định + giá, mở thẻ enrich:<offer_id>"
