    expected: "Ca LS1-AC-1 xanh trên ma trận bảy loại tin viết trước; đỏ khi thêm lại lọc kind (thông điệp ghim mã tin thuê thiếu) trên cùng fixture."
  - id: E2
    criterion: AC-2
    executor: test
    cmd: config:executors.test.ls1_thuan
    paths: ["agent/src/enrich/doc-toan-bo.ts", "agent/tests/doc-toan-bo.test.ts"]
    expected: "Ca LS1-AC-2 dùng bài 1.500 ký tự: chữ gửi đi dài hơn 500, không SĐT, email, link, tên nhóm, tên miền nguồn trong thân bài, kiểm trên chữ đến model giả; đỏ khi gửi chữ chưa gạt, ghim chuỗi lộ, kèm đối chứng dương."
  - id: E3
    criterion: AC-3
