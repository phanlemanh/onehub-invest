  - id: E8
    criterion: AC-8
    executor: test
    cmd: config:executors.test.ls1_db
    paths: ["agent/scripts/doc-toan-bo-s03.ts", "agent/src/enrich/doc-toan-bo.ts", "agent/tests/doc-toan-bo-db.itest.ts"]
    expected: "Dừng trước bài vượt trần, lượt sau đọc đúng phần còn lại; --thu 0 dòng trên mọi bảng; thiếu khoá thoát khác 0 trước lời gọi đầu; không cờ thì trần 3 USD, model Haiku, ghim bằng ca đọc cờ; vượt --tran-the dừng tạo thẻ."
  - id: E9
