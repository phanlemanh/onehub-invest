    expected: "--dem bằng truy vấn đếm độc lập trong test, fixture phân biệt skipped với corroborated; cờ đỏ quá 5 USD/ngày có ca hai phía; revert_enrichment thật lùi cả lượt; đỏ khi --dem đếm cả S05."
  - id: E10
    criterion: AC-9
