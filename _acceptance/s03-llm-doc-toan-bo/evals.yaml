    cmd: config:executors.test.ls1_db
    paths: ["agent/src/enrich/doc-toan-bo.ts", "agent/tests/doc-toan-bo-db.itest.ts"]
    expected: "Thẻ có câu trích, retired_at vẫn NULL, băm dòng tin không đổi; offer và trích giả 0 thẻ; đối chứng dương cùng fixture."
  - id: E6
