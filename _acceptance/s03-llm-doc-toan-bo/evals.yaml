    evidence_required: [screenshot, observed, verifier, verified_at]
  - id: E13
    criterion: AC-10
    executor: test
    cmd: config:executors.test.ls1_db
    paths: ["agent/scripts/doc-toan-bo-s03.ts", "agent/src/enrich/doc-toan-bo.ts", "agent/tests/doc-toan-bo-db.itest.ts"]
    expected: "Model giả cho nhãn biết trước: Wilson khớp số tính tay; dưới ngưỡng thoát khác 0, 0 dòng canonical; chạy thật khi thiếu dòng mẫu đạt thì từ chối, ghim thông điệp; có dòng đạt thì chạy."
