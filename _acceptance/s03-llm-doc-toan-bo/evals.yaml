    expected: "Ca LS1-AC-3 xanh: ô property_type đổi, đề xuất corroborated mang trich-dan:<mã>, 0 thẻ; đọc qua sale_offers sau phân xử, không đọc đề xuất viết tay."
  - id: E4
    criterion: AC-4
    executor: test
    cmd: config:executors.test.ls1_db
    paths: ["agent/src/enrich/doc-toan-bo.ts", "agent/src/enrich/luat-trich-dan.ts", "agent/tests/doc-toan-bo-db.itest.ts"]
    expected: "Ma trận viết trước gồm năm ca và các bẫy gần X, cạnh X, cần mua X, hai loại trong một câu, model trả nhà phố kèm trích dẫn đúng thì lên thẻ không tự điền, mỗi ca có đối chứng dương cùng tin với trích dẫn đúng; thông điệp ghim lý do skipped."
  - id: E5
    criterion: AC-5
