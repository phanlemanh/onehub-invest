schema_version: 1
feature_slug: ghep-anh-tren-the-gan-nhan
# DB thử oneinvest_ghep_nhan, ảnh giả ở thư mục tạm, tên miền example.test. Không ghi DB oneinvest, không ghi snapshot thật.
evals:
  - id: E1
    criterion: AC-1
    executor: test
    cmd: config:executors.script.ghep_lenh
    layer: unit
    paths: [pipeline/label-ghep.mjs, pipeline/lib/gop-anh.mjs, pipeline/tests/label-ghep.test.mjs]
    expected: "exit 0; ca 'GHEP-AC-1' ma trận viết trước đủ sáu loại bài và ca cụm lệch số tin chữ gần: mỗi dòng `ghep` bằng kết quả gọi trực tiếp ganBaiAnh trên cùng dữ liệu, có chữ không cụm là null, số phần tử ma trận khớp số assert. Chiều đỏ: bản sao hàm đổi cửa sổ 120 thành 60 thì ca 'cach 119 giay' đỏ. Quét mã: label-ghep.mjs và app/src không có hằng 120 của luật ghép, 'ok khong co luat thu hai', đối chứng chèn hằng thì phép quét đỏ."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E2
    criterion: AC-2
    executor: script
    cmd: config:executors.script.ghep_nap
    layer: backend-effect
    paths: [pipeline/label-ghep.mjs, pipeline/label-sample.mjs, db/migrations/*_labels_ghep.sql, _acceptance/ghep-anh-tren-the-gan-nhan/probes/nap.mjs]
    expected: "exit 0; trên DB thử: 'ok ghep hai lan khong doi', 'ok lat moi co ghep', 'ok bon cot mau khong doi', 'ok nhan cu khong doi', 'ok thu khong ghi'. Chiều đỏ: 'ok doi chung: tro vao oneinvest bi tu choi' và 'ok doi chung: doi mot dong thi phep bam do'."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E3
    criterion: AC-3
    executor: test
    cmd: config:executors.script.ghep_thuan
    layer: unit
    paths: [app/src/lib/labels-anh.ts, app/src/lib/labels-queries.ts, app/tests/labels-ghep.test.ts]
    expected: "exit 0; ca 'GHEP-AC-3' ma trận sáu loại bài: chữ, đường ảnh đúng thứ tự, cờ ghép, số tin chữ gần; `ghep` null thì kết quả bằng hàm không ghép từng trường. Chiều đỏ: bản ghi có URL gốc hay mã bài trong kết quả thì phép quét đỏ."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E4
    criterion: AC-3
    executor: script
    cmd: config:executors.script.ghep_nap
    layer: backend-effect
    paths: [app/src/lib/labels-queries.ts, _acceptance/ghep-anh-tren-the-gan-nhan/probes/nap.mjs]
    expected: "exit 0; trên DB thử, `ghep` sinh bằng cách chạy label-ghep.mjs thật, 'ok ghep tu ben ghi' (đối chứng: đổi tên một khoá của bên ghi thì phép đọc đỏ); gọi tinKe thật: 'ok the ghep co chu tin chu', 'ok the ghep du anh', 'ok ghep rong giong ban truoc' (so từng trường với hàm tinKe ở commit mốc), 'ok the khong co ma bai'."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E5
    criterion: AC-4
    executor: ui-check
    layer: ui-observed
    cmd: config:executors.design.ui_check
    target: "http://localhost:3463/ops/labels"
    paths: [app/src/components/ops/labels/anh-bai.tsx, app/src/components/ops/labels/label-form-nhom.tsx, _acceptance/ghep-anh-tren-the-gan-nhan/probes/seed.mjs]
    steps:
      - "Bản chạy: node _acceptance/ghep-anh-tren-the-gan-nhan/probes/seed.mjs, rồi chạy đúng lệnh `ban chay` nó in (cổng 3463, DB thử oneinvest_ghep_nhan, ảnh giả). Đăng nhập: dùng ego-browser, đặt cookie đọc từ tệp `cookie o` nó in bằng page.cdp Network.setCookie; không in giá trị cookie. Mở nhóm seed in"
      - "Bài một tin chữ, khổ 1280: chụp evidence/E5-ghep-1280.png; đọc trên ảnh chụp nhãn 'Ghép suy ra', số ảnh, chữ tin chữ, dải ảnh"
      - "Cùng bài, khổ 375: chụp evidence/E5-ghep-375.png; ghi bề rộng trang không tràn ngang"
      - "Bài cụm 21 ảnh, khổ 1280: chụp evidence/E5-cum-lon.png; ghi dải một hàng cuộn ngang, nút Lưu trong màn"
      - "Bấm một ảnh: chụp evidence/E5-lon.png, ghi 'Ảnh n/N'; bấm Sau, phím mũi tên trái phải, ghi số đổi đúng; Esc đóng"
      - "Bài nhiều tin chữ: chụp evidence/E5-nhieu-chu.png, đọc cờ trên ảnh chụp. Bài không tin chữ: chụp evidence/E5-khong-chu.png, đọc câu trên ảnh chụp. Bài có chữ không cụm: ghi không có nhãn ghép"
      - "Bài có một ảnh thiếu tệp giữa cụm: chụp evidence/E5-anh-loi.png, đọc trọn 'Ảnh không tải được' và Thử lại; xem lớn vẫn chuyển sang ảnh khác"
      - "Đọc căn cứ mặc định: bài có chữ ghép là Chữ, bài không tin chữ là Ảnh, ghi vào observed"
      - "Gắn hết nhóm có dòng trùng cụm: chụp evidence/E5-het-nhom.png; tiến độ trên màn đủ, không kẹt ở dòng trùng"
    expected: "Mọi câu đọc trọn trên ảnh chụp, không bị cắt, không có http hay example.test trên màn, không tràn ngang ở khổ 375. Seed sinh `ghep` bằng lệnh ghép thật."
    evidence_required: [run_id, screenshot, observed]
  - id: E6
    criterion: AC-5
    executor: test
    cmd: config:executors.script.ghep_thuan
    layer: backend-effect
    paths: [app/src/lib/ops/zalo-media.ts, app/src/lib/labels-anh.ts, app/tests/labels-ghep.test.ts]
    expected: "exit 0; ca 'GHEP-AC-5' gọi serveZaloMedia thật với tệp giả: i chạy khắp cụm trả đúng nội dung từng tệp, không tệp thì layAnh giả được gọi đúng URL, ngoài khoảng 404; ma trận đường dẫn xấu đặt ở bài thứ hai của cụm trả 403 với mồi nằm đúng đích; băm cây trước toàn bộ ca khớp sau toàn bộ ca, đối chứng ghi thêm tệp thì đỏ."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E7
    criterion: AC-6
    executor: script
    cmd: config:executors.script.ghep_nap
    layer: backend-effect
    paths: [app/src/lib/labels-queries.ts, app/src/lib/labels-luot-hai.ts, _acceptance/ghep-anh-tren-the-gan-nhan/probes/nap.mjs]
    expected: "exit 0; mồi ở mọi bài của cụm: 'ok tinKe khong co gia tri may', 'ok doiChieu doc theo tin chu ghep', 'ok doiChieu khong ghep giong moc' (so từng trường với hàm doiChieu ở commit mốc). Chiều đỏ: 'ok doi chung: chen gia tri may thi bat', 'ok doi chung: moi nam trong bang'."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E8
    criterion: AC-6
    executor: ui-check
    layer: ui-observed
    cmd: config:executors.design.ui_check
    target: "http://localhost:3463/ops/labels"
    paths: [app/src/lib/labels-queries.ts, app/src/lib/labels-luot-hai.ts, _acceptance/ghep-anh-tren-the-gan-nhan/probes/seed.mjs]
    steps:
      - "Cùng bản chạy với E5. Trước khi lưu bài có mồi seed in: lấy phản hồi HTTP thật của trang và mọi route thẻ gọi bằng curl kèm cookie, ghi vào observed status 200, số lần có chữ tin chữ seed (phải lớn hơn 0), số đếm từng mồi, từng mã bài của cụm và example.test (phải bằng 0); đọc DB thử, ghi vào observed số dòng có các giá trị đó (phải lớn hơn 0)"
      - "Chọn trường hợp 'Ghép sai' trên màn sau khi lưu một bài, đọc DB thử, ghi vào observed dòng case_kind"
      - "Điền đủ biểu mẫu, Lưu; chụp evidence/E8-luot-hai.png: bảng So với máy hiện giá trị của tin chữ ghép, vẫn thấy cả dải ảnh"
    expected: "Observed có đủ status, số đếm mồi, số đếm mã bài và số dòng đối chứng. Sau lưu bảng So với máy có giá trị bộ đọc. Ghép sai lưu được từ màn."
    evidence_required: [run_id, screenshot, observed]
  - id: E9
    criterion: AC-7
    executor: script
    cmd: config:executors.script.ghep_nap
    layer: backend-effect
    paths: [app/src/lib/labels-queries.ts, app/src/lib/labels-normalize.ts, app/src/app/api/v1/ops/labels/route.ts, db/migrations/*_labels_ghep.sql, _acceptance/ghep-anh-tren-the-gan-nhan/probes/nap.mjs]
    expected: "exit 0; qua route thật: 'ok can cu chu so voi chu tin ghep' (đối chứng: giá trị không có trong chữ tin ghép bị từ chối), 'ok ghi ghep sai', 'ok loai la bi tu choi', 'ok ap migration hai lan', 'ok nhan cu khong doi'."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E10
    criterion: AC-8
    executor: script
    cmd: config:executors.script.ghep_nap
    layer: backend-effect
    paths: [app/src/lib/labels-queries.ts, _acceptance/ghep-anh-tren-the-gan-nhan/probes/nap.mjs]
    expected: "exit 0; 'ok dong trung khong hien', 'ok tien do tru dong trung', 'ok so dong lat khong doi', 'ok lat ghep rong tinh nhu cu'. Chiều đỏ: bỏ cột trung_voi của một dòng thì số thẻ tăng đúng 1."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E11
    criterion: AC-9
    executor: script
    cmd: config:executors.script.ghep_that
    layer: backend-effect
    paths: [pipeline/label-ghep.mjs, _acceptance/ghep-anh-tren-the-gan-nhan/probes/that.mjs, _acceptance/ghep-anh-tren-the-gan-nhan/probes/doc-tay.json]
    expected: "exit 0; kết nối chỉ đọc, chỉ báo số: 'ok 133 bai ghep', 'ok 22 nhieu tin chu', 'ok 47 khong tin chu', 'ok 11 bai co chu co cum', 'ok 176 null', 'ok 144 co nhan ghep', 'ok 356 don vi', 'ok cum lon nhat 21', 'ok cum lech co co', dòng 'the co co N', 'ok doc tay khop bam', 'ok doc tay cong du 30', dòng 'doc tay dung N sai M khong phan K khong tep L'. Số bài có thể đổi khi `stg` thu thêm thì thước ghim lần đo: lệch thì đỏ và in số mới."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E12
    criterion: AC-10
    executor: script
    cmd: config:executors.script.ghep_kin
    layer: backend-effect
    paths: [_acceptance/ghep-anh-tren-the-gan-nhan/probes/kin.mjs]
    expected: "exit 0; 'ok dong them khong co ten nguon' (tập gồm tên miền từ media, tên miền và từ của tên thật từ source_registry, buộc cả hai khác rỗng, bắt tên miền con), 'ok ho so khong co ten nguon', 'ok doc tay khong co chu', 'ok fixture chi example.test', 'ok collector hook khong doi'. Chiều đỏ: 'ok doi chung: moi dang ten bi bat' gồm dạng tên miền con và tên thật trần. Tệp ảnh không đọc được bằng máy: in 'anh chung khong quet duoc N tep', xem bằng mắt ở E5, E8."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
