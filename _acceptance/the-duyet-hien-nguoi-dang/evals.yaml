schema_version: 1
feature_slug: the-duyet-hien-nguoi-dang
# Ca test mang tiền tố «ND-AC-n», tệp app/tests/the-duyet-hien-nguoi-dang.test.tsx (khuôn the-so-gia-tri-song.test.tsx):
# - lược đồ tạm `nd_<pid>` (bảng LIKE public.*, dữ liệu viết trước), search_path = nd_<pid>, public; xoá cuối lượt;
# - loadReviewContext THẬT đọc lược đồ tạm, ReviewCard THẬT dựng trong jsdom;
# - chiều đỏ: bản chép tạm tests/.nd-cu-* của tệp nguồn đổi đúng một chỗ, thông điệp ghim;
# - probe DB máy thu chỉ SELECT, bỏ qua có lý do dưới CI.
evals:
