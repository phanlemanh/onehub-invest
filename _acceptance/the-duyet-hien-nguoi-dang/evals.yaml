    criterion: AC-1
    executor: test
    cmd: config:executors.test.the_duyet_hien
    paths: [app/src/lib/ops/review-context.ts, app/src/lib/ops/review-can-cu.ts, app/src/components/ops/review/review-compare.tsx, app/src/components/ops/review-card.tsx, app/tests/the-duyet-hien-nguoi-dang.test.tsx]
    layer: backend-effect
    expected: "exit 0; ca 'ND-AC-1 hàng Người đăng đứng đầu' xanh: lát tạm hai tin có vai, loadReviewContext thật, ReviewCard jsdom: hàng [data-review-compare] đầu tiên là nguoi_dang, ô A có tên, SĐT E.164 và căn cứ vai, ô B nguồn giấu SĐT hiện 'Chưa có SĐT'; mười hàng còn lại đúng thứ tự TRUONG_GHEP_CAN và nhãn So bằng khi dựng không có người (so từng hàng, 10 phần tử); chiều đỏ: bản chép bỏ tên → đỏ 'ND-AC-1 THIEU TEN NGUOI DANG'"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
