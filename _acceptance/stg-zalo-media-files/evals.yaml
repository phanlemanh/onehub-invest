schema_version: 1
feature_slug: stg-zalo-media-files
evals:
  - id: E1
    criterion: AC-1
    executor: script
    cmd: config:executors.script.migration_035
    expected: "exit 0; stdout có 'IDEMPOTENT PASS', schema lần1 = lần2, dòng trùng: 0"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E2
    criterion: AC-1
    executor: script
    cmd: config:executors.script.idempotent_selftest
    expected: "should-NOT-fire: migration CREATE TABLE không IF NOT EXISTS bị bắt — stdout có 'SELFTEST PASS'; exit 0"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E3
    criterion: AC-2
    executor: script
    cmd: config:executors.script.zalo_media_roundtrip
    expected: "exit 0; stdout có 'ROUNDTRIP PASS' và 'dọn: còn 0 dòng giả'; các dòng ok: v2 ghi media_files đúng, nạp lại không nhân đôi, v1 NULL + bài lặp giữ media_files; đồng thời backfill --check đỏ trước khi nạp (phủ nửa âm của AC-4)"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E4
    criterion: AC-3
    executor: test
    cmd: config:executors.test.pipeline
    expected: "exit 0; 0 fail; ca 'không bảng nào trong FILL có cột ảnh' CHẠY (không skip); ca mediaFilesOf xanh"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E5
    criterion: AC-3
    executor: script
    cmd: config:executors.script.sync_pii_mutation
    expected: "should-NOT-fire: M0 xanh, M1 (FILL += stg_zalo_posts) đỏ, M2 (chỉ ca schema DB) đỏ, không skip — stdout có 'MUTATION PASS'; exit 0"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E6
    criterion: AC-4
    executor: script
    cmd: config:executors.script.zalo_media_backfill
    expected: "exit 0; stdout in 'snapshot zalo-agent: N (v2: M) · bài có ảnh trong raw v2: K · chưa nạp: 0 · stg_zalo_posts có media_files: R'"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
