    criterion: AC-1
    executor: test
    cmd: config:executors.test.judge_luat
    paths: [agent/src/agents/judge-entity.ts, agent/tests/judge-luat.test.ts]
    expected: "exit 0; ca 'LT-AC-1 ma trận đặc trưng' xanh: ma trận viết trước 5 đặc trưng × 3 trạng thái = 15 ô, mỗi ô chạy xuôi và ngược (30 assert, đếm đúng 30); khác → 'no', giống → 'yes', thiếu một bên → không 'no'; chiều đỏ: apNguong bản pl25-1 (fixture) → ô 'khác' ra khác 'no', đỏ 'LT-AC-1 đặc trưng khác không loại: <đặc trưng>'; bản đột biến coi thiếu một bên là khác → đỏ 'LT-AC-1 thiếu một bên thành lý do loại: <đặc trưng>'"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
