schema_version: 1
feature_slug: judge-luat-loai-tru-dac-trung
# Ca test mang tiền tố «LT-AC-n» trong agent/tests/judge-luat.test.ts (tệp mới, không DB trừ probe AC-6), và ma trận PL25
# đã sửa trong agent/tests/judge-nguong.test.ts (AC-5). Chiều đỏ: apNguong của bản chép tạm judge-entity.ts đổi đúng một
# chỗ (tests/.lt-cu-<pid>-<n>.ts, xoá cuối lượt), hoặc apNguong bản cũ (pl25-1) chép nguyên từ origin/main 4307a0b8 làm
# fixture tests/fixtures/judge-entity-pl25-1.ts.txt. Probe AC-6 chỉ SELECT, bỏ qua có lý do dưới CI.
evals:
