schema_version: 1
feature_slug: test-khong-prune-worktree
evals:
  - id: E1
    criterion: AC-1
    executor: script
    cmd: config:executors.script.tkp_soat
    paths: ["scripts/**", "pipeline/**", "app/tests/**", "agent/**", "data-api/**", "collector/**", "_acceptance/test-khong-prune-worktree/probes/soat-prune.sh"]
    expected: "exit 0; dòng 'root <gốc> sha <sha>'; 'doi chung: bat 2/2 dang mau'; 'da soat <n> tep ma' với n ≥ 100; 'khong con worktree prune'; cuối 'SOAT OK'; should-NOT-fire: không 'CON PRUNE', 'DOI CHUNG KHONG BAT'"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E2
    criterion: AC-2
    executor: script
    cmd: config:executors.script.tkp_bo_worktree
    paths: [scripts/lib/bo-worktree.mjs, scripts/bo-worktree.test.mjs, _acceptance/test-khong-prune-worktree/probes/bo-worktree.sh]
    expected: "exit 0; dòng 'root <gốc> sha <sha>'; 'ban sua: <k>/<k> ca xanh' với k ≥ 2; 'ban prune: ca do, thong diep ghim co' — cùng bản sao hàm, nhánh dự phòng đổi thành worktree prune; cuối 'BO WORKTREE OK'; should-NOT-fire: không 'CA KHONG DO', 'DOT BIEN KHONG AP DUOC'"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E3
    criterion: AC-3
    executor: script
    cmd: config:executors.script.tkp_lan
    paths: [scripts/zalo-import-job-lan.test.mjs, scripts/lib/bo-worktree.mjs, _acceptance/test-khong-prune-worktree/probes/lan.sh]
    expected: "exit 0; dòng 'root <gốc> sha <sha>'; 'zalo-import-job-lan: tests 4 pass 4 fail 0'; 'worktree tam zalo-lan con lai: 0 (truoc <n>)'; cuối 'LAN OK'; should-NOT-fire: không 'CON WORKTREE TAM', 'TEST DO'"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E4
    criterion: AC-4
    executor: script
    cmd: config:executors.script.tkp_pham_vi
    paths: [scripts/lib/bo-worktree.mjs, scripts/bo-worktree.test.mjs, scripts/zalo-import-job-lan.test.mjs, .claude/hooks/tests/typecheck-changed.selftest.sh, .claude/hooks/typecheck-changed.sh, _acceptance/test-khong-prune-worktree/probes/pham-vi.sh]
    expected: "exit 0; dòng 'root <gốc> sha <sha>'; bốn tệp mã có trong diff so với merge-base của origin/main; mọi tệp đổi 'ok'; cuối 'PHAM-VI OK'; should-NOT-fire: không 'NGOAI PHAM VI', 'THIEU TEP', 'HOOK BI DOI'"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E5
    criterion: AC-5
    executor: script
    cmd: config:executors.script.tkp_selftest_cleanup
    paths: [.claude/hooks/tests/typecheck-changed.selftest.sh, _acceptance/test-khong-prune-worktree/probes/selftest-cleanup.sh]
    expected: "exit 0; dòng 'root <gốc> sha <sha>'; 'cleanup ban sua: remove loi → giu worktree khac, remove ok → giu worktree khac'; 'cleanup ban prune: do, thong diep ghim co' — cùng hàm rút nguyên văn, chỉ thay dòng gỡ metadata bằng worktree prune; cuối 'SELFTEST CLEANUP OK'; should-NOT-fire: không 'KHONG RUT DUOC CLEANUP', 'CLEANUP SAI', 'DOT BIEN KHONG AP DUOC'"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E6
    criterion: AC-5
    executor: script
    cmd: config:executors.script.ui_hook_selftest
    paths: [.claude/hooks/tests/typecheck-changed.selftest.sh, .claude/hooks/typecheck-changed.sh]
    expected: "exit 0; hai dòng OK cho hai bước hook (vi phạm → exit 2 + onehub-ui/no-raw-table; chú thích vô hại → exit 0); không dòng FAIL"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
