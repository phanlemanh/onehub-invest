<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đường lên cloud</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink);
      min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em;
      text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400;
      letter-spacing: -0.02em; line-height: 1.15; margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flowchart · gia-tot-cap-du-an · Hỏi-5</p>
    <h1>Hạng cấp dự án đi lên cloud thế nào</h1>

    <svg viewBox="0 0 1000 616" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#3b6ea5"/></marker>
      </defs>
      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Arrows (drawn first) -->
      <line x1="500" y1="96" x2="500" y2="136" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M620 68 H792 Q800 68 800 76 V136" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="500" y1="192" x2="500" y2="232" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="800" y1="192" x2="800" y2="232" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <line x1="500" y1="288" x2="500" y2="328" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Hỏi-5 → Đi cùng (accent) -->
      <path d="M380 376 H208 Q200 376 200 384 V464" fill="none" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <!-- Hỏi-5 → Đi sau -->
      <path d="M620 376 H792 Q800 376 800 384 V464" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Arrow labels -->
      <rect x="508" y="110" width="36" height="12" rx="2" fill="#f5f5f5"/>
      <text x="512" y="119" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.12em">GHI</text>

      <rect x="688" y="46" width="36" height="12" rx="2" fill="#f5f5f5"/>
      <text x="706" y="55" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">GHI</text>

      <rect x="508" y="302" width="36" height="12" rx="2" fill="#f5f5f5"/>
      <text x="512" y="311" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.12em">HỎI-5</text>

      <rect x="236" y="352" width="88" height="14" rx="2" fill="#f5f5f5"/>
      <text x="280" y="363" fill="#ba4513" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">KHUYẾN NGHỊ</text>

      <rect x="672" y="352" width="72" height="14" rx="2" fill="#f5f5f5"/>
      <text x="708" y="363" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">LỐI KHÁC</text>

      <!-- N1 xep-hang-gia -->
      <rect x="380" y="40" width="240" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="500" y="66" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">xep-hang-gia</text>
      <text x="500" y="82" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">máy thu · 420 bản CG10</text>

      <!-- N2 offer_price_rank -->
      <rect x="380" y="136" width="240" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="500" y="162" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">offer_price_rank</text>
      <text x="500" y="178" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">có dòng cap du_an</text>

      <!-- N7 project_area_band -->
      <rect x="680" y="136" width="240" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="800" y="162" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">project_area_band</text>
      <text x="800" y="178" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">migration 106</text>

      <!-- N3 sync-cloud đêm -->
      <rect x="380" y="232" width="240" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="500" y="258" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">sync-cloud đêm</text>
      <text x="500" y="274" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">không sửa · đã chép bảng từ CG9</text>

      <!-- N8 chỉ máy thu -->
      <rect x="680" y="232" width="240" height="56" rx="28" fill="#f5f5f5"/>
      <rect x="680" y="232" width="240" height="56" rx="28" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="800" y="258" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Chỉ máy thu, không sync</text>
      <text x="800" y="274" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">cloud đi sau</text>

      <!-- N4 Hỏi-5 -->
      <polygon points="500,328 620,376 500,424 380,376" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="500" y="372" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Hạng cấp dự án</text>
      <text x="500" y="386" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">lên cloud?</text>

      <!-- N5 Đi cùng (focal) -->
      <rect x="40" y="464" width="320" height="56" rx="28" fill="#f5f5f5"/>
      <rect x="40" y="464" width="320" height="56" rx="28" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="200" y="490" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Đi cùng (khuyến nghị)</text>
      <text x="200" y="506" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Ops cloud + /v1/deals thấy Giá tốt</text>

      <!-- N6 Đi sau -->
      <rect x="640" y="464" width="320" height="56" rx="28" fill="#f5f5f5"/>
      <rect x="640" y="464" width="320" height="56" rx="28" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="800" y="490" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Đi sau</text>
      <text x="800" y="506" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">sửa sync lọc cap = phuong tới nhịp 3</text>

      <!-- Legend -->
      <line x1="40" y1="548" x2="960" y2="548" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="564" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.18em">CHÚ GIẢI · HÌNH MANG LOẠI</text>
      <text x="960" y="564" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.12em">AC-8 · AC-5</text>

      <rect x="40" y="580" width="24" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="72" y="590" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Bước / bảng</text>

      <rect x="180" y="580" width="24" height="12" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="212" y="590" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Kết cục</text>

      <polygon points="300,586 312,580 324,586 312,592" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="332" y="590" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Câu hỏi (thoi)</text>

      <line x1="452" y1="586" x2="480" y2="586" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <text x="488" y="590" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Lối khuyến nghị</text>

      <line x1="608" y1="586" x2="636" y2="586" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <text x="644" y="590" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Dừng ở máy thu</text>
    </svg>
  </div>
</body>
</html>
