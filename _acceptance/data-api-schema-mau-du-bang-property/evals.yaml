    expected: "exit 0; «moi-route: <n> lời gọi trên <k> đường openapi; route trả 500: 0; sai mã: 0» — trong đó bốn đường Property: ?project=<dự án mẫu> 200 ≥ 1 toà, activeListingCount ≥ 1; dự án không có 200 với đúng 0 phần tử; /lookup 200 với đúng 1 căn (đẳng thức, không phải ngưỡng dưới); toà 200, toà không có 404; căn 200; áp schema.sql rồi seed.sql không lỗi"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E2
    criterion: AC-2
