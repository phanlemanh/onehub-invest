    expected: "exit 0; mọi đường trong /openapi.json có mẫu gọi, số đường trả 500 = 0 (S1 đo 4); chiều đỏ cùng lượt: «chieu-do: bo-khuc-pb8 → <m ≥ 1> route trả 500 (đúng); duong-khong-mau → đúng; lookup-2-can → đúng; du-an-khong-co-1-toa → đúng»; «seed-chay-lai: khúc PB8 áp hai lần, 6 bảng giữ nguyên số dòng»; «chieu-do: seed-bo-chot-trung → đúng (bí danh, phát biểu nhân đôi)»; dòng cuối «moi-route: đạt». Ô không đỏ → «moi-route: thước không đỏ ở <ô>», thoát 1"
