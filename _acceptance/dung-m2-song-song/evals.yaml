schema_version: 1
feature_slug: dung-m2-song-song
evals:
  - id: E1
    criterion: AC-1
    executor: test
    cmd: config:executors.test.design_floor_gen
    paths: [scripts/design-floor/gen-tokens.mjs, scripts/design-floor/gen-tokens.test.mjs, app/src/app/globals.css, design/tokens.json]
    expected: "exit 0; mọi ca 'M2-AC-1' pass: đếm 41 lá :root + 40 mode.dark + 9 @theme riêng + 40 cầu nối = 130 trên globals.css thật; ma trận đủ 41 biến: tên → (giá trị :root, giá trị .dark) rút độc lập theo dòng từ globals.css, so $value và mode.dark.$value của đúng lá cùng tên; cặp đỏ: tráo giá trị tối của hai lá → ma trận đỏ nêu tên biến; không khoá gốc ngoài nhóm; số đếm so với đếm độc lập bằng regex dòng '--' trong từng khối; cặp trên cùng fixture: thêm một khai báo :root → có lá mới và tổng 131, xoá lá đó khỏi đầu ra (đột biến) → kiểm đếm đỏ «khai báo bị bỏ: --x»; should-NOT-fire: không 'not ok'"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E2
    criterion: AC-2
    executor: test
    cmd: config:executors.test.design_floor_gen
    paths: [scripts/design-floor/gen-tokens.mjs, scripts/design-floor/gen-tokens.test.mjs, app/src/app/globals.css]
    expected: "exit 0; mọi ca 'M2-AC-2' pass: radius.lg = '{radius.base}', var(--color-red-800) và var(--font-geist-sans) giữ chuỗi; color.chart-1, color.sidebar-primary-foreground, radius.base có lá ở đường hai đoạn; cặp đỏ trên cùng fixture: var trỏ biến ngoài tệp không thành alias; should-NOT-fire: không 'not ok'"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E3
