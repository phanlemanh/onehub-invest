    expected: "exit 0; mọi ca 'M2-AC-5' pass: mọi mã @reui/@mapcn ở ô đầu bảng block của catalog thật (rút độc lập bằng regex trên từng dòng bảng) có đúng một bản ghi hoặc trùng component đã cài; số bản ghi block theo từng bảng bằng số viết trước (36 dòng «ReUI Blocks», 10 «Cổng Ops» trừ mã trùng component đã cài; 15 tên app từ 12 dòng); @reui/hero-8 và @reui/c-chart-16 là template; description của @reui/hero-8 và @mapcn/store-locator bằng đúng ô File viết tay trước; cặp đỏ: đột biến description rỗng → đỏ; PageHeader và StatTiles là app; không có bản ghi @reui/frame, @reui/filters, @reui/number-field, @mapcn/map; tên duy nhất, đã sắp; should-NOT-fire: không 'not ok'"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
