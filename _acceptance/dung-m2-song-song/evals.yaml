    paths: [scripts/design-floor/gen-tokens.mjs, scripts/design-floor/gen-registry.mjs, scripts/design-floor/fresh.test.mjs]
    expected: "exit 0; mọi ca 'M2-AC-8' pass: trên bản chép kho, --check của hai lệnh thoát 0 khi khớp; sửa một giá trị globals.css → tokens --check thoát 1 nêu design/tokens.json và lệnh sinh lại; xoá một tệp ui/*.tsx → registry --check thoát 1; xoá tệp sinh → thoát 1 «chưa có»; ghi hai lần giống từng byte; should-NOT-fire: không 'not ok'"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E9
    criterion: AC-8
    executor: script
    cmd: config:executors.script.design_floor_fresh
    paths: [scripts/design-floor/gen-tokens.mjs, scripts/design-floor/gen-registry.mjs, app/src/app/globals.css, "app/src/components/ui/**", "app/src/components/reui/**", .claude/skills/onehub-ui/catalog.md, design/tokens.json, design/component-registry.json]
    expected: "exit 0; hai dòng '--check: design/tokens.json khớp nguồn' và '--check: design/component-registry.json khớp nguồn' trên cây đã commit; should-NOT-fire: không 'lệch nguồn', không 'chưa có'"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E10
    criterion: AC-9
    executor: judgment
    inputs: [.claude/skills/onehub-ui/SKILL.md, .claude/skills/onehub-ui/loop.md, _acceptance/dung-m2-song-song/contract.md]
    question: "Đọc hai tệp skill và hợp đồng. (1) Có luật nói rõ hồ sơ chạm giao diện PHẢI viết _acceptance/<slug>/reuse-plan.md ở S1, trước khi chọn block hay viết mã, không phải gợi ý? (2) Khuôn nêu đủ: mỗi màn một mục '## Screen: <tên>', một dòng 'Pattern:' (hoặc 'Pattern: none — <lý do>'), bảng bốn cột Slot | Rung | Use | Reason, mỗi ô chọn bậc đầu tiên đứng được? (3) Có bảng ánh thang của kho (ReUI block → shadcn/ui → tự viết) lên bảy bậc của kit, khớp contract.md AC-5: bậc 2 là block @reui/@mapcn của catalog kể cả ví dụ c-*, bậc 3 là ui/, reui/, ui/svgs/ hay component của app, bậc 7 là ds-new kèm lý do và thêm dòng catalog? (4) Nêu cách gọi tên theo registry (ui/<x>, reui/<x>, @reui/<b> nguyên văn, tên component app) và lệnh kiểm tay có --file design/component-registry.json --tokens design/tokens.json? (5) loop.md bước đầu trỏ tới luật đó? (6) Có nói ở M1 kit chưa kiểm nhưng kế hoạch vẫn bắt buộc? Trả PASS khi cả sáu đúng; nêu câu nào sai."
    expected: "PASS — sáu câu đều đúng trên hai tệp"
    evidence_required: [run_id, verdict, judges, verified_at]
  - id: E11
    criterion: AC-9
    executor: test
    cmd: config:executors.test.design_floor_gen
    paths: [.claude/skills/onehub-ui/SKILL.md, scripts/design-floor/reuse-plan.test.mjs, design/tokens.json, design/component-registry.json]
    expected: "exit 0; mọi ca 'M2-AC-9' pass: rút đúng một khối giữa hai marker REUSE-PLAN-MAU của SKILL.md, có ≥1 '## Screen:', reuse-plan check thoát 0 với 0 finding; cặp đỏ: cùng khối đổi một tên thành tên bịa → thoát 2 UNKNOWN_COMPONENT; should-NOT-fire: không 'not ok'"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E12
    criterion: AC-10
    executor: test
    cmd: config:executors.test.design_floor_gen
    paths: [_acceptance/config.yaml, scripts/design-floor/fresh.test.mjs]
    expected: "exit 0; mọi ca 'M2-AC-10' pass: config không có khoá design_floor ở cấp nào (đọc bằng regex dòng, cả khoá lồng); design-floor-bac.mjs 2.35.0 in 'bậc M1'; diff config.yaml so merge-base origin/main chỉ thêm hai dòng design_floor_gen, design_floor_fresh; cặp đỏ: bản chép config thêm 'design_floor:' + tokens/registry → bộ đọc của test báo có khoá và design-floor-bac in 'bậc M2'; should-NOT-fire: không 'not ok'"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
