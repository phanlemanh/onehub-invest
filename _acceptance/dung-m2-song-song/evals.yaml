    paths: [scripts/design-floor/gen-registry.mjs, scripts/design-floor/gen-registry.test.mjs, "app/src/components/ui/**", "app/src/components/reui/**", design/component-registry.json]
    expected: "exit 0; mọi ca 'M2-AC-4' pass: tập tên ui/, ui/svgs/, reui/ bằng đúng tập tệp/thư mục liệt kê độc lập bằng readdir; mọi bản ghi chỉ khoá thuộc khuôn kit, markup '', tokensUsed []; ma trận viết trước: reui/badge đủ 30 cặp (gồm variant=success-light), ui/button 14 cặp, ui/item 8 cặp, reui/filters (thư mục, cva ở một tệp) size=default+size=sm — so bằng nhau, không thừa trục giả từ defaultVariants/compoundVariants; mỗi cặp của ma trận round-trip qua reuse-plan check bậc 4 → 0 finding; tệp không cva không có khoá variants; cặp đỏ: fixture thư mục reui/x có hai tệp cva → hợp cả hai, bỏ một tệp → mất cặp của nó, bỏ hết → mất bản ghi; should-NOT-fire: không 'not ok'"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E5
