    expected: "exit 0; mọi ca 'M2-AC-7' pass: ui.mjs 2.35.0 tìm thấy (DESIGN_FLOOR_UI hoặc cache plugin), kế hoạch bảy bậc → thoát 0, errorCount 0; bốn biến thể phá một ô → thoát 2 với đúng mã UNKNOWN_COMPONENT, BAD_VARIANT_VALUE, UNRESOLVED_TOKEN, RUNG2_NOT_TEMPLATE; should-NOT-fire: không 'not ok', không 'không thấy ui.mjs'"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E8
