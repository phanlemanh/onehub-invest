    expected: "exit 0; mọi ca 'M2-AC-6' pass: bản chép thật thoát 0; bốn bản phá (không catalog, catalog không bảng block, catalog không bảng Custom Components, không thư mục reui) mỗi bản thoát 1, không tạo design/component-registry.json, stderr chứa đúng thông điệp ghim của AC-6; should-NOT-fire: không 'not ok'"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E7
