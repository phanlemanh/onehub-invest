    expected: "exit 0; ca TDB-AC-1: VERCEL=1 → HTML hai trang có «Chỉ ở máy thu» và số truy vấn chạm bảng danh bạ = 0 (đếm qua pool giả bọc pool thật); lược đồ không có buildings → cùng kết quả; đối chứng dương: lược đồ có bảng → HTML có tên dự án của ma trận, không có «Chỉ ở máy thu»; chiều đỏ: bản đột biến bỏ nhánh cloud ở registry-content → ca đỏ ghim «TDB-AC-1 cloud vẫn truy vấn»"
