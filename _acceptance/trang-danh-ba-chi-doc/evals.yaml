feature_slug: trang-danh-ba-chi-doc
# Ca «TDB-AC-n» ở app/tests/registry-chi-doc.test.tsx (node --test + tsx; lược đồ tạm tdb_<pid> trên DB của riêng lượt
# — db/db-thu.sh — dựng các bảng danh bạ bằng LIKE public … INCLUDING ALL, page thật dựng bằng renderToStaticMarkup với
# getSessionUser giả). Ca «TDB-DC» ở app/tests/registry-doi-chieu.test.tsx: chỉ đọc DB máy thu :5433 trong giao dịch
# READ ONLY, chỉ in số. Mỗi phép đo mới có cặp hai chiều trên cùng fixture (bản đột biến chép sang thư mục tạm, đổi đúng
# một chỗ), thông điệp ghim. Hai khoá executor tdb_app, tdb_doi_chieu xin thêm vào _acceptance/config.yaml qua U2-67.
evals:
