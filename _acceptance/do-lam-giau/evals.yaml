  - id: E10
    criterion: AC-9
    executor: test
    cmd: config:executors.test.job_exit
    layer: backend-effect
    paths: [scripts/cloud-sync.sh, scripts/job-exit.test.mjs, scripts/lib/job-step.sh]
    expected: "exit 0; ca 'DO3 cloud-sync' của scripts/job-exit.test.mjs: dãy bước của cloud-sync.sh khớp danh sách trong test với do-lam-giau đứng ngay sau do-hang-ngay; FAIL_STEPS=do-lam-giau → job ≠ 0, đúng một dòng 'JOB FAIL [cloud-sync] bước do-lam-giau mã <n>', mọi bước khác vẫn chạy; không có FAIL_STEPS → 0. Chiều đỏ: đặt do-lam-giau trước do-hang-ngay → test dãy bước đỏ; bỏ bước khỏi danh sách test → test đỏ."
