    criterion: AC-8
    executor: test
    cmd: config:executors.test.pipeline
    layer: backend-effect
    paths: [pipeline/do-lam-giau.mjs, pipeline/lib/do-lam-giau.mjs, pipeline/lib/do-hang-ngay.mjs, pipeline/sync-cloud.mjs, pipeline/scripts/do-lam-giau.test.mjs]
    expected: "exit 0; ca 'DO3-AC-8' trên DB thử: tin mang số suy +84912345678 (băm h1), người đăng tên 'Nguyễn Văn Hiếu', source_registry real_name đặt một tên thật giả, bài chứa tên đó → detail mọi dòng do3-* không chứa '912345678', 'h1', 'Hiếu', tên thật giả, labeler_id của nhãn; FILL của sync-cloud.mjs không có enrichment_value_state, enrichment_value_change; bộ chặn rò là hàm dùng chung của DO1 (import). Đối chứng dương: bản phá đưa băm số vào ô lát → lệnh dừng, không ghi dòng nào, log 'LO DO3'; source_registry rỗng → dừng, không ghi. Chiều đỏ: thêm bảng ảnh chụp vào FILL → 'ANH CHUP LEN CLOUD'; bỏ chặn rò → 'LO DO3'."
