    expected: "exit 0; ca 'CD-AC-9 lớp đầu vào bẩn' — L1: «Hẻm 5 ,,1/ Đường chùa Pháp thạnh» ↔ «Chùa Pháp Thạnh» và «Ngõ 5 , Kim Mã» ↔ «Kim Mã»: soDuong 'khop' hai chiều, apNguong không có khac_duong; chiều đỏ: bản đột biến bỏ bước dồn dấu phẩy → đỏ 'CD-AC-9 L1 dấu phẩy lặp: Hẻm 5 ,,1/ Đường chùa Pháp thạnh ↔ Chùa Pháp Thạnh'"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
