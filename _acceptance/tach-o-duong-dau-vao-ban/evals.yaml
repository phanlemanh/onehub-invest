    executor: test
    cmd: config:executors.test.judge_entity_duong
    layer: backend-effect
    paths: [agent/probes/o-duong-that.test.ts, scripts/o-duong-that.sh, scripts/audit-all.sh, agent/src/agents/judge-entity.ts]
    expected: "exit 0 trên máy thu; (a) ca 'CD-AC-8 probe ô đường thật' xanh như lúc ký (≥ 100 giá trị cụm đầu, 0 lệch, đột biến bỏ cắt cụm đỏ 'CD-AC-8 ô đường thật có tiền tố vị trí ra Lệch'); (b) ca 'CD-AC-12 probe lớp ô đường thật': mỗi lớp L1–L5 chọn bằng regex riêng trên SELECT DISTINCT street_raw (cụm ở bất kỳ vị trí), bộ tách độc lập theo lớp (không import khoaDuong), soDuong(giá trị, phần tên) = 'khop' ở mọi giá trị đã chọn; diagnostic 'CD-AC-12 lớp: L1=… L2=… L3=… L4=… L5=…'; mẫu số chọn độc lập với luật (phần tên còn chữ); sàn mọi lớp L1 ≥ 1, L2 ≥ 1, L3 ≥ 30, L4 ≥ 1, L5 ≥ 1 (đo 15/11: 66 · 13 · 89 · 1 · 2); chiều đỏ từng lớp: bản luật bỏ đúng dòng của lớp Ln → ném 'CD-AC-12 Ln ra Lệch' kèm ít nhất một giá trị, cho cả năm lớp; lượt chạy trong scripts/o-duong-that.sh (O_DUONG_TRONG_SCRIPT=1) không tạo tệp đột biến và không chạy chiều đỏ; (c) ca 'CD-AC-11 mục Ô đường thật chạy hai nhánh': chạy bash scripts/o-duong-that.sh → exit 0, stdout có '✅ Ô đường thật' và 'lớp:'; chạy với O_DUONG_DOT_BIEN=1 → exit 1, stdout có '❌ Ô đường thật' và một giá trị lệch; scripts/audit-all.sh có dòng gọi scripts/o-duong-that.sh nằm trong nhánh pass/fail (khớp regex o-duong-that\\.sh.*&&.*pass.*\\|\\|.*fail hoặc if/else tương đương); chiều đỏ của phép khớp: hàm kiểm chạy trên bản audit-all bỏ dòng gọi → ném 'CD-AC-11 audit-all thiếu mục Ô đường thật'"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
