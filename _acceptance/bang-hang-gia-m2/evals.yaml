      - "Mở /ops/deals/offer_002fc1c0073d52cd (căn cần xác minh, dưới trung vị 37,5%) 1280 tối → evidence/E10-step3.png (nhãn «Cần xác minh»)"
      - "Mở /ops/deals/offer_0054ade373ca8bba (nhóm 8 căn) 1280 tối → evidence/E10-step4.png (lý do «Nhóm so sánh chỉ có 5–9 căn — có số, chưa gắn nhãn»)"
    expected: "Chụp /ops/deals và /ops/deals/[offerId] (căn có nhãn, căn cần xác minh, tin nhóm 5–9) ở sáng và tối trên bản chạy trỏ DB thử của AC-9: nhãn «Rẻ trong phường», chữ «Cần xác minh» chỉ ở căn có cờ, dòng «so với N căn …», lý do nhom-5-9 hiện đúng chữ AC-6; con số trên màn khớp dòng offer_price_rank của tin"
