<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gán khu vực một tin theo tên xã</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Lora:ital,wght@0,400;1,400&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-soft:    #636b80;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Lora', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1240px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.25;
      color: var(--color-ink);
      margin-bottom: 0.5rem;
    }
    .sub { font-size: 0.875rem; color: var(--color-muted); margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 960px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Sơ đồ luồng · danh-ba-phuong-xa-toan-quoc · Cổng Phạm vi</p>
    <h1>Gán khu vực một tin theo tên xã</h1>
    <p class="sub">Hai ô Hỏi (viền cam) là chỗ người quyết; dấu ● cam là lựa chọn khuyến nghị. AC liên quan: AC-7, AC-8, AC-9.</p>

    <svg viewBox="0 0 1200 608" xmlns="http://www.w3.org/2000/svg" font-family="'Geist', sans-serif">
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- ============ CONNECTORS (vẽ trước, nằm dưới nút) ============ -->
      <g fill="none" stroke="#4f5d75" stroke-width="1.2">
        <!-- Tin S06 → Chọn tập thị trường -->
        <path d="M208,132 L248,132" marker-end="url(#arrow)"/>
        <!-- Bài S03 → Chọn tập thị trường -->
        <path d="M208,216 L248,216" marker-end="url(#arrow)"/>
        <!-- Chọn tập → Hỏi-2 (S03 chưa khai) -->
        <path d="M360,256 L360,320" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <!-- Chọn tập → Khớp tên xã hiện hành -->
        <path d="M472,176 L520,176" marker-end="url(#arrow)"/>
        <!-- Khớp → Gắn xã -->
        <path d="M712,176 L1092,176 Q1100,176 1100,184 L1100,228" marker-end="url(#arrow)"/>
        <!-- Không khớp → Bí danh an toàn -->
        <path d="M616,240 L616,304" marker-end="url(#arrow)"/>
        <!-- Bí danh: S06 ward_name → Gắn xã -->
        <path d="M704,328 L732,328 Q740,328 740,320 L740,264 Q740,256 748,256 L1032,256" marker-end="url(#arrow)"/>
        <!-- Bí danh: S03 → Hỏi-3 -->
        <path d="M704,368 L768,368" marker-end="url(#arrow)"/>
        <!-- Bí danh: không khớp / tên bị tách → Giữ cấp tỉnh -->
        <path d="M616,392 L616,456" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      </g>
      <!-- Hỏi-3 lối khuyến nghị → Gắn xã -->
      <path d="M992,400 L1092,400 Q1100,400 1100,392 L1100,284" fill="none" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

      <!-- ============ NHÃN CONNECTOR (có mask, cách đường ≥6px) ============ -->
      <g font-family="'Geist Mono', monospace" font-size="9" letter-spacing="0.06em" fill="#4f5d75">
        <rect x="368" y="280" width="88" height="16" rx="2" fill="#f5f5f5"/>
        <text x="372" y="292">S03 CHƯA KHAI</text>

        <rect x="880" y="152" width="48" height="16" rx="2" fill="#f5f5f5"/>
        <text x="904" y="164" text-anchor="middle">KHỚP</text>

        <rect x="624" y="264" width="76" height="16" rx="2" fill="#f5f5f5"/>
        <text x="628" y="276">KHÔNG KHỚP</text>

        <rect x="824" y="232" width="128" height="16" rx="2" fill="#f5f5f5"/>
        <text x="888" y="244" text-anchor="middle">S06 · ward_name</text>

        <rect x="720" y="344" width="32" height="16" rx="2" fill="#f5f5f5"/>
        <text x="736" y="356" text-anchor="middle">S03</text>

        <rect x="624" y="412" width="112" height="16" rx="2" fill="#f5f5f5"/>
        <text x="628" y="424">KHÔNG KHỚP · TÁCH</text>

        <rect x="1000" y="376" width="88" height="16" rx="2" fill="#f5f5f5"/>
        <text x="1044" y="388" text-anchor="middle" fill="#ba4513">GỌI ĐÍCH DANH</text>
      </g>

      <!-- ============ NÚT ============ -->

      <!-- Tin S06 (đầu vào) -->
      <rect x="32" y="104" width="176" height="56" rx="28" fill="#f5f5f5"/>
      <rect x="32" y="104" width="176" height="56" rx="28" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="120" y="128" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">Tin S06</text>
      <text x="120" y="146" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">ward_name_v3, ward_name</text>

      <!-- Bài S03 (đầu vào) -->
      <rect x="32" y="184" width="176" height="64" rx="32" fill="#f5f5f5"/>
      <rect x="32" y="184" width="176" height="64" rx="32" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="120" y="206" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">Bài S03</text>
      <text x="120" y="222" fill="#636b80" font-size="9" text-anchor="middle">chữ tự do</text>
      <text x="120" y="236" fill="#636b80" font-size="9" text-anchor="middle">nhóm có/không khai thị trường</text>

      <!-- Chọn tập thị trường -->
      <rect x="248" y="96" width="224" height="160" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="264" y="120" fill="#2d3142" font-size="12" font-weight="600">Chọn tập thị trường</text>
      <line x1="264" y1="136" x2="456" y2="136" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <text x="264" y="160" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">S06</text>
      <text x="456" y="160" fill="#4f5d75" font-size="9" text-anchor="end">thị trường theo mã tin</text>
      <line x1="264" y1="176" x2="456" y2="176" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <text x="264" y="196" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">S03 khai</text>
      <text x="456" y="196" fill="#4f5d75" font-size="9" text-anchor="end">thị trường đã khai</text>
      <line x1="264" y1="212" x2="456" y2="212" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <text x="264" y="232" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">S03 chưa khai</text>
      <text x="456" y="232" fill="#ba4513" font-size="9" font-weight="600" text-anchor="end">Hỏi-2</text>

      <!-- Hỏi-2 -->
      <rect x="248" y="320" width="224" height="128" rx="6" fill="#f5f5f5"/>
      <rect x="248" y="320" width="224" height="128" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4"/>
      <rect x="256" y="328" width="44" height="16" rx="2" fill="transparent" stroke="rgba(235,108,54,0.60)" stroke-width="0.8"/>
      <text x="278" y="340" fill="#ba4513" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">HỎI-2</text>
      <text x="264" y="372" fill="#2d3142" font-size="12" font-weight="600">S03 chưa khai: đối chiếu?</text>
      <text x="264" y="396" fill="#ba4513" font-size="10" font-weight="600">● 4 thành phố có phường OSM</text>
      <text x="276" y="410" fill="#ba4513" font-size="9">khuyến nghị</text>
      <text x="264" y="432" fill="#4f5d75" font-size="10">○ hay 34 tỉnh</text>

      <!-- Khớp tên xã hiện hành (quyết định) -->
      <polygon points="616,112 712,176 616,240 520,176" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="616" y="164" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">Khớp tên xã</text>
      <text x="616" y="180" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">hiện hành</text>
      <text x="616" y="198" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">danh bạ 3.321</text>

      <!-- Gắn xã (kết thúc) -->
      <rect x="1032" y="228" width="136" height="56" rx="28" fill="#f5f5f5"/>
      <rect x="1032" y="228" width="136" height="56" rx="28" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="1100" y="260" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">Gắn xã</text>

      <!-- Bí danh an toàn -->
      <rect x="528" y="304" width="176" height="88" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="616" y="332" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">Bí danh an toàn</text>
      <text x="616" y="352" fill="#636b80" font-size="9" text-anchor="middle">xã cũ vào trọn một xã</text>
      <text x="616" y="366" fill="#636b80" font-size="9" text-anchor="middle">không trùng tên hiện hành</text>

      <!-- Hỏi-3 -->
      <rect x="768" y="336" width="224" height="128" rx="6" fill="#f5f5f5"/>
      <rect x="768" y="336" width="224" height="128" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4"/>
      <rect x="776" y="344" width="44" height="16" rx="2" fill="transparent" stroke="rgba(235,108,54,0.60)" stroke-width="0.8"/>
      <text x="798" y="356" fill="#ba4513" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">HỎI-3</text>
      <text x="784" y="384" fill="#2d3142" font-size="12" font-weight="600">S03 nhận tên xã cũ khi nào?</text>
      <text x="784" y="408" fill="#ba4513" font-size="10" font-weight="600">● chỉ khi «phường/xã/P. &lt;tên cũ&gt;»</text>
      <text x="796" y="422" fill="#ba4513" font-size="9">khuyến nghị</text>
      <text x="784" y="444" fill="#4f5d75" font-size="10">○ hay mọi chỗ xuất hiện</text>

      <!-- Giữ cấp tỉnh (kết thúc) -->
      <rect x="528" y="456" width="176" height="56" rx="28" fill="#f5f5f5"/>
      <rect x="528" y="456" width="176" height="56" rx="28" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="616" y="480" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">Giữ cấp tỉnh</text>
      <text x="616" y="496" fill="#636b80" font-size="9" text-anchor="middle">cần chọn xã</text>

      <!-- ============ CHÚ GIẢI ============ -->
      <line x1="32" y1="544" x2="1168" y2="544" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <text x="32" y="564" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.18em">CHÚ GIẢI · HÌNH DẠNG CHỈ LOẠI NÚT</text>

      <rect x="32" y="580" width="24" height="12" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="64" y="590" fill="#4f5d75" font-size="9">Đầu vào / kết thúc</text>

      <rect x="176" y="580" width="24" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="208" y="590" fill="#4f5d75" font-size="9">Bước</text>

      <polygon points="268,586 280,580 292,586 280,592" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="300" y="590" fill="#4f5d75" font-size="9">Quyết định</text>

      <rect x="384" y="580" width="24" height="12" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4"/>
      <text x="416" y="590" fill="#4f5d75" font-size="9">Hỏi chờ người quyết (Cổng Phạm vi)</text>

      <text x="600" y="590" fill="#ba4513" font-size="10" font-weight="600">●</text>
      <text x="612" y="590" fill="#4f5d75" font-size="9">Lựa chọn khuyến nghị</text>

      <line x1="728" y1="588" x2="756" y2="588" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <text x="764" y="590" fill="#4f5d75" font-size="9">Lối khuyến nghị</text>

      <line x1="860" y1="588" x2="888" y2="588" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="896" y="590" fill="#4f5d75" font-size="9">Luồng chính</text>

      <line x1="976" y1="588" x2="1004" y2="588" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <text x="1012" y="590" fill="#4f5d75" font-size="9">Rẽ nhánh / dừng ở tỉnh</text>
    </svg>
  </div>
</body>
</html>
