<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ba câu hỏi đăng ký</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Lora:ital,wght@0,400;1,400&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Lora', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.25;
      color: var(--color-ink);
      margin-bottom: 0.5rem;
    }
    .sub {
      font-size: 0.875rem;
      color: var(--color-muted);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 960px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Cổng Phạm vi · auth-hop-chuan · ba-cau-hoi</p>
    <h1>Ba câu hỏi chờ ký cho trang đăng ký</h1>
    <p class="sub">AC-1 · AC-2 · AC-3 · AC-5 · mỗi câu hai nhánh, nhánh tô cam là nhánh máy khuyên</p>

    <svg viewBox="0 0 1200 336" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- ============ Mũi tên (vẽ trước, nằm dưới nút) ============ -->
      <!-- Hỏi-1: gốc x 24..392 · A tâm 112 · B tâm 304 -->
      <line x1="112" y1="80" x2="112" y2="126" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <line x1="304" y1="80" x2="304" y2="126" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Hỏi-2: gốc x 416..784 · A tâm 504 · B tâm 696 -->
      <line x1="504" y1="80" x2="504" y2="126" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <line x1="696" y1="80" x2="696" y2="126" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Hỏi-3: gốc x 808..1176 · A tâm 896 · B tâm 1088 -->
      <line x1="896" y1="80" x2="896" y2="126" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <line x1="1088" y1="80" x2="1088" y2="126" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- ============ Nút gốc: câu hỏi ============ -->
      <!-- Hỏi-1 -->
      <rect x="24" y="24" width="368" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="24" y="24" width="368" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="208" y="42" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">HỎI-1</text>
      <text x="208" y="62" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Nền trang đăng ký sau khi gỡ dải màu trôi</text>

      <!-- Hỏi-2 -->
      <rect x="416" y="24" width="368" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="416" y="24" width="368" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="600" y="42" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">HỎI-2</text>
      <text x="600" y="62" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Cỡ tiêu đề đăng ký (bản cũ 56 px)</text>

      <!-- Hỏi-3 -->
      <rect x="808" y="24" width="368" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="808" y="24" width="368" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="992" y="42" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">HỎI-3</text>
      <text x="992" y="62" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Đo form đăng ký đầu-cuối</text>

      <!-- ============ Nhánh ============ -->
      <!-- Hỏi-1 · A (máy khuyên) -->
      <rect x="24" y="128" width="176" height="112" rx="6" fill="#f5f5f5"/>
      <rect x="24" y="128" width="176" height="112" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4"/>
      <text x="112" y="148" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">A · MÁY KHUYÊN</text>
      <text x="112" y="176" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Nền trơn + noise sẵn có</text>
      <text x="112" y="200" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">tiêu đề một màu —</text>
      <text x="112" y="214" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">giống trang đăng nhập</text>

      <!-- Hỏi-1 · B -->
      <rect x="216" y="128" width="176" height="112" rx="6" fill="#f5f5f5"/>
      <rect x="216" y="128" width="176" height="112" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.40)" stroke-width="1"/>
      <text x="304" y="148" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">B</text>
      <text x="304" y="176" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Dải màu tĩnh bằng token</text>
      <text x="304" y="200" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">thêm một quyết định</text>
      <text x="304" y="214" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">màu sáng/tối</text>

      <!-- Hỏi-2 · A (máy khuyên) -->
      <rect x="416" y="128" width="176" height="112" rx="6" fill="#f5f5f5"/>
      <rect x="416" y="128" width="176" height="112" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4"/>
      <text x="504" y="148" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">A · MÁY KHUYÊN</text>
      <text x="504" y="176" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">text-4xl / sm:text-5xl</text>
      <text x="504" y="200" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">48 px màn rộng</text>

      <!-- Hỏi-2 · B -->
      <rect x="608" y="128" width="176" height="112" rx="6" fill="#f5f5f5"/>
      <rect x="608" y="128" width="176" height="112" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.40)" stroke-width="1"/>
      <text x="696" y="148" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">B</text>
      <text x="696" y="176" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">thêm <tspan font-family="'Geist Mono', monospace">lg:text-6xl</tspan></text>
      <text x="696" y="200" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">60 px màn rộng</text>

      <!-- Hỏi-3 · A (máy khuyên) -->
      <rect x="808" y="128" width="176" height="112" rx="6" fill="#f5f5f5"/>
      <rect x="808" y="128" width="176" height="112" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4"/>
      <text x="896" y="148" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">A · MÁY KHUYÊN</text>
      <text x="896" y="172" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Smoke đăng ký bằng</text>
      <text x="896" y="188" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">email dùng một lần</text>
      <text x="896" y="208" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">xoá tài khoản sau lượt</text>
      <text x="896" y="222" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">(DB local)</text>

      <!-- Hỏi-3 · B -->
      <rect x="1000" y="128" width="176" height="112" rx="6" fill="#f5f5f5"/>
      <rect x="1000" y="128" width="176" height="112" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.40)" stroke-width="1"/>
      <text x="1088" y="148" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">B</text>
      <text x="1088" y="176" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Chỉ đo bằng giả lập</text>
      <text x="1088" y="200" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">(action + cảnh báo lỗi) —</text>
      <text x="1088" y="214" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">rẻ hơn, không chứng luồng thật</text>

      <!-- ============ Chú giải ============ -->
      <line x1="24" y1="272" x2="1176" y2="272" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <text x="24" y="292" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.18em">CHÚ GIẢI</text>

      <rect x="24" y="304" width="24" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="56" y="314" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Câu hỏi chờ ký</text>

      <rect x="184" y="304" width="24" height="12" rx="2" fill="#ffffff" stroke="rgba(45,49,66,0.40)" stroke-width="1"/>
      <text x="216" y="314" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Nhánh còn lại</text>

      <rect x="336" y="304" width="24" height="12" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4"/>
      <text x="368" y="314" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Nhánh máy khuyên</text>
    </svg>
  </div>
</body>
</html>
