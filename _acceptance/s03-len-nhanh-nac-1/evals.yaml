schema_version: 1
feature_slug: s03-len-nhanh-nac-1
evals:
  - id: E1
    criterion: AC-1
    executor: test
    cmd: config:executors.test.zalo_import_nhe
    paths: [scripts/zalo-import-daily.sh, scripts/zalo-import-job-nhe.test.mjs]
    expected: "exit 0; cây tạm chép NGUYÊN tệp bọc thật + job-step.sh, node giả đầu PATH ghi nhãn bước và PGOPTIONS mỗi lần gọi; ma trận viết trước bốn ô so trọn: (1) --luot-nhanh → nhãn [import-airbnb, transform-zalo, transform-media, refresh-bait-gap], PGOPTIONS của ba bước transform chứa đúng '-c lock_timeout=10s', của import-airbnb không chứa lock_timeout; (2) --luot-nhanh với S03_NHANH_LOCK_TIMEOUT=3s → ba bước có '-c lock_timeout=3s'; (3) không cờ → sáu nhãn [import-airbnb, transform-zalo, transform-media, refresh-bait-gap, doc-gop-hang-ngay, enrich-run], không lần gọi nào có lock_timeout; (4) --luot-nhanh với PGOPTIONS='-c search_path=public' đặt sẵn → ba bước giữ cả search_path lẫn lock_timeout=10s. Chiều đỏ cùng fixture: bản sao tệp bọc đột biến đặt PGOPTIONS trước phần nạp → ô (1) đỏ ghim «SN-AC-1 bước nạp nhận lock_timeout»; bản sao bỏ khối PGOPTIONS → ô (1) đỏ ghim «SN-AC-1 lượt nhanh không có lock_timeout»."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E2
    criterion: AC-2
    executor: test
    cmd: config:executors.test.zalo_import_nhe
    paths: [scripts/zalo-import-daily.sh, scripts/zalo-import-job-nhe.test.mjs]
    expected: "exit 0; ma trận viết trước 2 lượt (nhanh · 00:00) × 3 kết cục của transform-zalo (node giả in 'canceling statement due to lock timeout' rồi thoát 1 · in 'boom' thoát 4 · xanh), sáu ô so trọn: nhanh+khoá → stderr có 'BỎ LƯỢT [zalo-import-daily] bước transform-zalo: đụng khoá', không 'JOB FAIL', transform-media và refresh-bait-gap vẫn chạy, exit 0; nhanh+boom → 'JOB FAIL [zalo-import-daily] bước transform-zalo mã 4', exit 4; nhanh+xanh → exit 0, không BỎ LƯỢT; 00:00+khoá → 'JOB FAIL … transform-zalo mã 1', không BỎ LƯỢT, exit 1; 00:00+boom → mã 4; 00:00+xanh → exit 0. Ô thêm: nhanh, khoá ở transform-zalo và boom ở refresh-bait-gap → exit 4; nhanh, '55P03' ở transform-media → BỎ LƯỢT bước transform-media. Ma trận đếm liền viết trước, số trong zalo-import-bo-luot.state trước lượt nhanh+khoá: 0 → sau = 1, exit 0 · 6 → 7, exit 0 · 7 → 8, stderr 'JOB FAIL [zalo-import-daily] đụng khoá 8 lượt liền', exit 75; đặt lại: 5 rồi lượt nhanh+xanh → 0; 5 rồi lượt 00:00+xanh → 0. Chiều đỏ: bản sao coi mọi lỗi lượt nhanh là bỏ lượt → ô nhanh+boom đỏ ghim «SN-AC-2 lỗi thật bị nuốt thành bỏ lượt»; bản sao không đếm liền → ô 7→8 đỏ ghim «SN-AC-2 khoá kẹt không báo»."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E3
    criterion: AC-3
    executor: test
    cmd: config:executors.test.zalo_import_khoa
    layer: backend-effect
    long_running: 15
    paths: [scripts/zalo-import-daily.sh, scripts/zalo-import-job-khoa.itest.mjs]
    expected: "exit 0; chạy trên DB của riêng lượt (db-thu --chay; từ chối DB tên oneinvest). Cây tạm: tệp bọc thật + job-step.sh, pipeline/ là liên kết tới từng mục của pipeline thật TRỪ logs/ (thư mục thật trong cây tạm), collector/snapshots rỗng. Ca khoá: một kết nối pg giữ BEGIN; LOCK TABLE stg_zalo_posts IN ACCESS EXCLUSIVE MODE; đếm sale_offers S03 trước; chạy tệp bọc --luot-nhanh với node thật, S03_NHANH_LOCK_TIMEOUT=2s → exit 0, stderr có 'BỎ LƯỢT [zalo-import-daily] bước transform-zalo: đụng khoá', thời gian từ lúc chạy tới lúc dòng ấy xuất hiện < 30 s, đếm sale_offers S03 sau (sau khi nhả khoá) bằng trước. Đối chứng dương cùng DB, nhả khoá: lượt nhanh chạy lại → exit 0, không 'BỎ LƯỢT', không 'JOB FAIL'. Chiều đỏ: cùng khoá, S03_NHANH_LOCK_TIMEOUT=0 (tắt) và trần chờ của test 20 s → tiến trình chưa xong khi hết trần (bị giết), ca ghim «SK-AC-3 không lock_timeout thì treo sau khoá»."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E4
    criterion: AC-4
    executor: test
    cmd: config:executors.test.cloud_sync_do
    paths: [scripts/cloud-sync-do.sh, scripts/cloud-sync-do.test.mjs]
    expected: "exit 0; cây tạm chép NGUYÊN scripts/cloud-sync-do.sh + job-step.sh, node giả ghi nhãn (tên tệp .mjs đầu tiên + cờ) và việc tệp dấu có hay không lúc gọi: ca thứ tự so trọn [trang-thai-chao, bac-du-lieu --write, do-danh-ba-sdt --write, do-the-duyet --write, mau-soat-cuon-chieu, do-hang-ngay --write, do-lam-giau --write]; không lần gọi nào thấy tệp dấu (dấu vắng trước lượt); sau lượt dấu là số nằm trong [giây bắt đầu, giây kết thúc]. FAIL_STEPS=bac-du-lieu,do-lam-giau → cả bảy vẫn gọi, stderr 'JOB FAIL [cloud-sync-do] bước bac-du-lieu mã', exit = mã của bac-du-lieu, và KHÔNG có tệp dấu sau lượt. Ca khoá: thư mục khoá có pid = PID của một tiến trình sleep còn sống → stdout 'bỏ lượt: lượt đo trước còn chạy', 0 lần gọi node, exit 0, dấu không đổi; pid = số của tiến trình đã chết → bảy bước chạy, khoá được gỡ sau lượt. Chiều đỏ: bản sao đột biến ghi dấu ĐẦU lượt → ca đỏ ghim «CD-AC-4 dấu ghi trước khi chạy trọn»; bản sao ghi dấu cả khi có bước lỗi → ca đỏ ghim «CD-AC-4 dấu ghi khi job lỗi»."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E5
    criterion: AC-5
    executor: test
    cmd: config:executors.test.cloud_sync_do
    paths: [scripts/cloud-sync.sh, scripts/cloud-sync-do.test.mjs]
    expected: "exit 0; cây tạm chép NGUYÊN scripts/cloud-sync.sh + job-step.sh, node giả ghi nhãn: ma trận viết trước năm ô — dấu vắng · tươi (now−60) · cũ (now−7200) · rác ('abc') · dấu vắng mà khoá cloud-sync-do.lock giữ bởi PID sống — so trọn danh sách nhãn: tươi → [ha-bung-het-han, sync-cloud, refresh-data-flow, push-ops-facts] và stdout có 'bước đo: job giờ chạy lúc'; khoá sống → bốn nhãn đầu và stdout có 'bước đo: lượt đo khác đang chạy'; ba ô còn lại → đủ mười một nhãn theo thứ tự trước vòng (rút từ bản cloud-sync.sh ở merge-base chạy trên cùng node giả, không viết tay), khoá có trong lúc gọi bảy bước đo và đã gỡ sau lượt. Chiều đỏ: bản sao đột biến ngưỡng tươi thành '-le' trên dấu cũ đúng 7200 → ô cũ đỏ ghim «CD-AC-5 dấu cũ vẫn bỏ bước đo»; bản sao bỏ khoá → ô khoá sống đỏ ghim «CD-AC-5 chạy chồng job giờ»."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E6
    criterion: AC-6
    executor: test
    cmd: config:executors.test.job_exit
    paths: [scripts/cloud-sync.sh, scripts/cloud-sync-do.sh, scripts/job-exit.test.mjs]
    expected: "exit 0; job-exit.test.mjs (AU13) xanh trên cây làm việc, kèm ca mới cho cloud-sync-do.sh: bước hỏng đầu tiên quyết mã thoát, mỗi bước hỏng một dòng JOB FAIL."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E6b
    criterion: AC-6
    executor: test
    cmd: config:executors.test.zalo_import_job
    paths: [scripts/zalo-import-daily.sh, scripts/zalo-import-job.test.mjs]
    expected: "exit 0; zalo-import-job.test.mjs xanh không sửa lời hứa sáu bước (cây tạm không có sổ ngày → lượt đủ), gồm ZJ-AC-5 «phần nạp không đổi so với merge-base»."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
