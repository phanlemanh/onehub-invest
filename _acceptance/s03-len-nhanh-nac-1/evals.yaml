    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E6d
    criterion: AC-6
    executor: test
    cmd: config:executors.test.zalo_import_job_lan
    paths: [scripts/zalo-import-daily.sh, scripts/zalo-import-job-lan.test.mjs]
    expected: "exit 0; zalo-import-job-lan.test.mjs xanh — ZJ-AC-5 vẫn phân biệt sửa phần nạp của làn ZCode với sửa nửa dưới."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E6e
    criterion: AC-6
    executor: script
