    expected: "exit 0; ca «PB2-AC-3 listings kind, lọc, trang, chi tiết» xanh: không kind → có cả ba kind, sắp theo listingKey; kind lạ → 400 với error.code và error.message là chuỗi; market, area, bedroomsTotal mỗi lọc chỉ giữ tin thoả (có tin không thoả bị loại — đối chứng); limit=2 offset=0 và offset=2 không trùng, hợp lại = trang limit=4; chi tiết theo listingKey của tin bán, tin thuê dài hạn, tin ngắn hạn trả đúng tin và cùng tập khoá; khoá không có → 404 error.code NOT_FOUND."
