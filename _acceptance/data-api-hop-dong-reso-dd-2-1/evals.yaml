    expected: "exit 0; «hop-dong: <n> khoá (<k> field DD 2.1, <e> extension), <v> giá trị lookup — đều khớp DD 2.1 <generatedOn> và mappings.yaml». Chiều đỏ cùng lượt, bốn ô cấy trên bản chép tạm: khoa-khong-khai → «PB2 khoá không có trong hợp đồng: <khoá>»; ten-dd-sai (listPricePerArea) → «PB2 không có field DD 2.1: Property.ListPricePerArea»; lookup-sai (SingleFamilyResidence) → «PB2 không phải StandardName của PropertySubType: SingleFamilyResidence»; extension-thieu → «PB2 extension chưa khai ở mappings.yaml: <khoá>». Ô không đỏ → thoát 1 «hop-dong: thước không đỏ ở <ô>»; không tìm thấy dd-2.1.json (env DD21_JSON hoặc research-local/reso/dd-2.1.json của checkout chính) → thoát 2."
