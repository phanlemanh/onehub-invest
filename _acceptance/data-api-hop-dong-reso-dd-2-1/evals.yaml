    cmd: config:executors.script.dapi_reso_pha
    paths: [data-api/src/routes/**, data-api/test/**, _acceptance/data-api-hop-dong-reso-dd-2-1/probes/pha.mjs]
    expected: "exit 0; probe in 3 dòng JSON viết trước (ô goc, listings-cu, deals-cu, asset-stats-cu) rồi «pha: đủ 4 ô». Ô goc: rc 0, fail 0. listings-cu: rc ≠ 0, đầu ra có «PB2 listings sai tập khoá» VÀ «PB2 listings sai giá trị» hoặc lỗi chặn trước giá trị được probe ghi rõ, ca PB2-AC-5 xanh. deals-cu: rc ≠ 0, có «PB2 deals còn sống» (đường cũ không 410) hoặc «PB2 listings sai tập khoá» ở ca AC-5, ca PB2-AC-1..AC-4 xanh. asset-stats-cu: rc ≠ 0, có «PB2 price-stats», ca PB2-AC-1..AC-5 xanh. Thiếu thông điệp hay ca đường kia đỏ → thoát 1 «pha: N ô sai»; không dựng được bản cũ → thoát 2."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
