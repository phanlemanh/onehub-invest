schema_version: 1
feature_slug: data-api-hop-dong-reso-dd-2-1
evals:
  - id: E1
    criterion: AC-1
    executor: test
    cmd: config:executors.test.dapi_reso
    paths: [data-api/src/routes/listings.ts, data-api/src/contract/**, data-api/test/**]
    expected: "exit 0; «ℹ fail 0», «ℹ skipped 0»; ca «PB2-AC-1 listings sale, rent_lt theo RESO» xanh: tập khoá mỗi phần tử = tập khoá của tệp hợp đồng (so bằng tập); từng giá trị so với dòng cấy theo bảng design §2 (listPrice/leaseAmount theo kind, leaseAmountFrequency Monthly, salePricePerArea/leasePricePerArea theo kind, livingAreaUnits và pricePerAreaUnit «Square Meters», city = tên phường, mlsAreaMinor = mã phường, mlsAreaMajor = mã thị trường, originatingSystemName = mã S0x của dòng; một tin cấy source mang chữ không phải mã phải ra originatingSystemName null — sai → «PB2 originatingSystemName không phải mã S0x»); quét không gặp khoá nào của danh sách khoá cũ. Thiếu/thừa khoá → «PB2 listings sai tập khoá: <khoá>»; sai giá trị → «PB2 listings sai giá trị <khoá>». Đối chứng: số phần tử so được = 0 → đỏ «PB2 không so được phần tử nào» (không xanh rỗng)."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E2
    criterion: AC-2
    executor: test
    cmd: config:executors.test.dapi_reso
    paths: [data-api/src/routes/listings.ts, data-api/src/contract/**, data-api/test/**]
    expected: "exit 0; ca «PB2-AC-2 listings rent_st theo RESO» xanh: cùng tập khoá; kind rent_st, leaseAmount = giá niêm yết một đêm (price_listed) cấy, leaseAmountFrequency Daily, propertyType «Residential Lease», propertySubType null, originatingSystemName S01, media null ở cả tin có ảnh cấy lẫn tin không ảnh, JSON.stringify(thân) không chứa URL ảnh cấy nào → «PB2 rent_st lộ ảnh», listingTitle/spaceType/accommodates/minimumNights/reviewCount/occupancyRate/averageDailyRevenue khớp; listingKey = 16 hex đầu của HMAC-SHA256(khoá thử của test, 'S01|<id>') tính lại trong test — khác → «PB2 rent_st listingKey không phải HMAC»; JSON.stringify(thân) và bản giải base64, hex của mọi chuỗi trong thân không chứa id gốc hay phần số → «PB2 rent_st lộ id gốc»; đối chứng đột biến trong cùng ca: hàm dựng khoá thay bằng base64('S01|'+id) phải bị bộ dò bắt với đúng thông điệp ấy; khởi động với NODE_ENV=production không có biến khoá → lỗi «PB2 thiếu khoá bí mật của listingKey»."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
