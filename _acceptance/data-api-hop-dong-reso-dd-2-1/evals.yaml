    expected: "exit 0; «pham-vi: <n> tệp đổi, đều trong ranh giới; mappings.yaml chỉ đổi meta, ba mục canonical, thêm listings, api_extensions; soát <k> tên nguồn thật trên toàn cây data-api (<m> tệp), 0 khớp ngoài dạng định danh» (không in tên). Chiều đỏ cùng lượt: pha-tep (cấy db/migrations/x.sql vào danh sách tệp) → «AC-10 NGOÀI PHẠM VI: db/migrations/x.sql»; pha-mappings (cấy đổi mục enums.kind) → «AC-10 mappings.yaml đổi ngoài phần được giao: enums.kind»; pha-ten (tên trần vào bản chép tạm một tệp data-api) → «AC-10 tên nguồn thật: S0x»; pha-config (khoá ngoài dapi_reso*) → «AC-10 NGOÀI PHẠM VI: _acceptance/config.yaml khoá <khoá>»; pha-ext (nền đã có api_extensions: cấy đổi một khoá con không phải listing) → «AC-10 mappings.yaml đổi ngoài phần được giao: api_extensions.<khoá con>», sửa api_extensions.listing không đỏ. Ô không đỏ → thoát 1."
