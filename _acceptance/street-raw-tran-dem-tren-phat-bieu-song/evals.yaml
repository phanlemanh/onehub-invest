schema_version: 1
slug: street-raw-tran-dem-tren-phat-bieu-song
# E1, E2 cùng một lệnh trên DB của riêng lượt (db/db-thu.sh --chay), chép từ DB máy thu. Không in giá trị ô.
evals:
  - id: E1
    criterion: AC-1
    executor: script
    long_running: 40
    cmd: bash _acceptance/street-raw-tran-dem-tren-phat-bieu-song/probes/tran.sh
    paths: ["pipeline/transform-chotot.mjs"]
    expected: >
      exit 0; «KẾT QUẢ: xanh»; ✔ «ca 1, bản PL39 (đếm trên stg) dừng», ✔ «ca 1, bản PL39: dừng trước mọi lần ghi», ✔ «ca 1, bản
      PL41 chạy trọn», ✔ «ca 1: log bỏ ghi street_raw N ≥ 51».
  - id: E2
    criterion: AC-2
    executor: script
    long_running: 40
    cmd: bash _acceptance/street-raw-tran-dem-tren-phat-bieu-song/probes/tran.sh
    paths: ["pipeline/transform-chotot.mjs"]
    expected: >
      exit 0; ✔ «ca 2, bản PL41 dừng: PL39: … vượt trần 50 …» và ✔ «ca 2: không thêm tin, không thêm hay rút phát biểu nào».
  - id: E3
    criterion: AC-3
    executor: test
    cmd: cd pipeline && node --test tests/street-raw-ten-nguon.test.mjs
    paths: ["pipeline/transform-chotot.mjs", "pipeline/tests/street-raw-ten-nguon.test.mjs"]
    expected: "exit 0; ℹ fail 0; ca SR-AC-4, SR-AC-5 xanh."
  - id: E4
    criterion: AC-4
    executor: test
    cmd: cd pipeline && node --test scripts/street-raw-tran-dem.test.mjs scripts/chia-nua.test.mjs
    paths: ["pipeline/transform-chotot.mjs", "pipeline/scripts/street-raw-tran-dem.test.mjs", "pipeline/test-nua.json"]
    expected: "exit 0; ℹ fail 0; bốn ca TD-AC-1..4 xanh; chia-nua xanh (tệp đã xếp vào nửa b nên CI chạy)."
  - id: E5
    criterion: AC-4
    executor: script
    cmd: config:executors.suite.pipeline_a
    long_running: 90
    paths: ["pipeline/transform-chotot.mjs", "pipeline/scripts/street-raw-tran-dem.test.mjs", "pipeline/test-nua.json"]
    expected: >
      exit 0; nửa A bộ test pipeline (suite của lượt chấm, khai ở đây chỉ để có long_running 90 — cùng lệ PL39 E6, PL36 E11:
      nửa A vượt trần chờ 30′ mặc định khi máy tải), 0 fail.
  - id: E6
    criterion: AC-4
    executor: script
    cmd: config:executors.suite.pipeline_b
    long_running: 90
    paths: ["pipeline/transform-chotot.mjs", "pipeline/scripts/street-raw-tran-dem.test.mjs", "pipeline/test-nua.json"]
    expected: >
      exit 0; nửa B bộ test pipeline (khai để có long_running 90, cùng lệ PL39 E7), 0 fail; gồm bốn ca TD-AC-1..4 của
      scripts/street-raw-tran-dem.test.mjs (tệp xếp vào nửa b).
  - id: E7
    criterion: AC-4
    executor: test
    cmd: config:executors.suite.pipeline_that
    long_running: 90
    paths: ["pipeline/transform-chotot.mjs"]
    expected: >
      exit 0; nhánh đổi pipeline/transform-chotot.mjs (vùng hẹp VUNG_THAT) nên suite pipeline_that (ca dữ liệu thật trên bản
      chép) chạy; `ℹ fail 0`. Khai ở đây để có long_running 90 theo khuôn HT9 E3a, do1-ac9 E5 (luật GS 26/11).
