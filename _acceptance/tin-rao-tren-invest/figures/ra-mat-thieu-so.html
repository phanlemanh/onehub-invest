<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ra mắt khi thiếu số</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Lora:ital,wght@0,400;1,400&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Lora', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.3;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Điểm quyết định · Tin rao trên Invest</p>
    <h1>Ra mắt khi thiếu số</h1>
    <svg viewBox="0 0 1056 352" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0, 10 4, 0 8" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto"><polygon points="0 0, 12 5, 0 10" fill="#eb6c36"/></marker>
      </defs>
      <rect width="100%" height="100%" fill="#f5f5f5"/>
      <path d="M516 80 V104 Q516 112 508 112 H280 Q272 112 272 120 V144" fill="none" stroke="#eb6c36" stroke-width="2" marker-end="url(#arrow-accent)"/>
      <path d="M540 80 V104 Q540 112 548 112 H776 Q784 112 784 120 V144" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="368" y="24" width="320" height="56" rx="6" fill="#f5f5f5"/><rect x="368" y="24" width="320" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="528" y="58" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">05/11, S06 chưa có số</text>
      <rect x="32" y="144" width="480" height="184" rx="6" fill="#f5f5f5"/><rect x="32" y="144" width="480" height="184" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="2"/>
      <text x="48" y="172" fill="#ba4513" font-size="16" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="start" letter-spacing="0.08em">A · KHUYÊN</text>
      <text x="48" y="200" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="start">Vẫn ra</text>
      <text x="48" y="232" fill="#2d3142" font-size="16" font-weight="400" font-family="'Geist', sans-serif" text-anchor="start">39.823 tin S06 hiện «Chưa có số»</text>
      <text x="48" y="256" fill="#2d3142" font-size="16" font-weight="400" font-family="'Geist', sans-serif" text-anchor="start">3 tin có số</text>
      <text x="48" y="280" fill="#2d3142" font-size="16" font-weight="400" font-family="'Geist', sans-serif" text-anchor="start">bộ lọc «Chỉ tin có số»</text>
      <text x="48" y="304" fill="#2d3142" font-size="16" font-weight="400" font-family="'Geist', sans-serif" text-anchor="start">số về tới đâu cổng tự hiện</text>
      <rect x="544" y="144" width="480" height="184" rx="6" fill="#f5f5f5"/><rect x="544" y="144" width="480" height="184" rx="6" fill="#ffffff" stroke="#4f5d75" stroke-width="1"/>
      <text x="560" y="172" fill="#4f5d75" font-size="16" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="start" letter-spacing="0.08em">B</text>
      <text x="560" y="200" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="start">Chờ rồi mới áp</text>
      <text x="560" y="232" fill="#2d3142" font-size="16" font-weight="400" font-family="'Geist', sans-serif" text-anchor="start">trải nghiệm đầu tốt hơn</text>
      <text x="560" y="256" fill="#2d3142" font-size="16" font-weight="400" font-family="'Geist', sans-serif" text-anchor="start">mốc 05/11 phụ thuộc làn thu</text>
      </svg>
  </div>
</body>
</html>
