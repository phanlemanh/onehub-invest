<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hỏi-1: cách lấy số</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Lora:ital,wght@0,400;1,400&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Lora', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.3;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Điểm quyết định · Tin rao trên Invest</p>
    <h1>Hỏi-1: cách lấy số</h1>
    <svg viewBox="0 0 1072 348" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0, 10 4, 0 8" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto"><polygon points="0 0, 12 5, 0 10" fill="#eb6c36"/></marker>
      </defs>
      <rect width="100%" height="100%" fill="#f5f5f5"/>
      <path d="M512 80 V104 Q512 112 504 112 H200 Q192 112 192 120 V144" fill="none" stroke="#eb6c36" stroke-width="2" marker-end="url(#arrow-accent)"/>
      <path d="M536 80 V144" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M560 80 V104 Q560 112 568 112 H872 Q880 112 880 120 V144" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="376" y="24" width="320" height="56" rx="6" fill="#f5f5f5"/><rect x="376" y="24" width="320" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="536" y="58" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Người mua muốn lấy số</text>
      <rect x="32" y="144" width="320" height="160" rx="6" fill="#f5f5f5"/><rect x="32" y="144" width="320" height="160" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="2"/>
      <text x="48" y="172" fill="#ba4513" font-size="16" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="start" letter-spacing="0.08em">A · KHUYÊN</text>
      <text x="48" y="200" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="start">Một lần bấm, không đăng nhập</text>
      <text x="48" y="232" fill="#2d3142" font-size="16" font-weight="400" font-family="'Geist', sans-serif" text-anchor="start">nhanh nhất có bước chặn</text>
      <text x="48" y="256" fill="#2d3142" font-size="16" font-weight="400" font-family="'Geist', sans-serif" text-anchor="start">danh sách không mang số</text>
      <text x="48" y="280" fill="#2d3142" font-size="16" font-weight="400" font-family="'Geist', sans-serif" text-anchor="start">dựa vào tường lửa</text>
      <rect x="376" y="144" width="320" height="160" rx="6" fill="#f5f5f5"/><rect x="376" y="144" width="320" height="160" rx="6" fill="#ffffff" stroke="#4f5d75" stroke-width="1"/>
      <text x="392" y="172" fill="#4f5d75" font-size="16" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="start" letter-spacing="0.08em">B</text>
      <text x="392" y="200" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="start">Hiện sẵn trên thẻ</text>
      <text x="392" y="232" fill="#2d3142" font-size="16" font-weight="400" font-family="'Geist', sans-serif" text-anchor="start">nhanh hơn một chạm</text>
      <text x="392" y="256" fill="#2d3142" font-size="16" font-weight="400" font-family="'Geist', sans-serif" text-anchor="start">một lần tải trang lấy hết số</text>
      <rect x="720" y="144" width="320" height="160" rx="6" fill="#f5f5f5"/><rect x="720" y="144" width="320" height="160" rx="6" fill="#ffffff" stroke="#4f5d75" stroke-width="1"/>
      <text x="736" y="172" fill="#4f5d75" font-size="16" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="start" letter-spacing="0.08em">C</text>
      <text x="736" y="200" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="start">Đòi đăng nhập hay xác minh SMS</text>
      <text x="736" y="232" fill="#2d3142" font-size="16" font-weight="400" font-family="'Geist', sans-serif" text-anchor="start">khó cào nhất</text>
      <text x="736" y="256" fill="#2d3142" font-size="16" font-weight="400" font-family="'Geist', sans-serif" text-anchor="start">mất khách vãng lai</text>
      <text x="1040" y="332" fill="#636b80" font-size="12" font-weight="400" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.04em">AC-5, AC-9</text>
      </svg>
  </div>
</body>
</html>
