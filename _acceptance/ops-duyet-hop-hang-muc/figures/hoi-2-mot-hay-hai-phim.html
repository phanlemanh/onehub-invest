<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hỏi-2 một hay hai phím</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Lora:ital,wght@0,400;1,400&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Lora', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1040px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.25;
      color: var(--color-ink);
      margin-bottom: 0.5rem;
    }
    .sub {
      font-size: 0.875rem;
      color: var(--color-muted);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Cổng Phạm vi · ops-duyet-hop-hang-muc · hoi-2-mot-hay-hai-phim</p>
    <h1>Hỏi-2: một phím hay hai phím</h1>
    <p class="sub">AC-4 · AC-5 · hai cách quyết một thẻ ở chế độ duyệt; làn tô cam là làn máy khuyên</p>

    <svg viewBox="0 0 1000 624" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- ============ Đầu hình ============ -->
      <text x="32" y="24" fill="#4f5d75" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.14em">HỎI-2 · MỘT PHÍM HAY HAI PHÍM · AC-4, AC-5</text>

      <!-- Trục bước chung -->
      <text x="104" y="56" fill="#4f5d75" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">BƯỚC 1</text>
      <text x="268" y="56" fill="#4f5d75" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">BƯỚC 2</text>
      <text x="432" y="56" fill="#4f5d75" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">BƯỚC 3</text>
      <text x="624" y="56" fill="#4f5d75" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">BƯỚC 4</text>
      <text x="856" y="56" fill="#4f5d75" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">SAU ĐÓ</text>
      <line x1="32" y1="68" x2="968" y2="68" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>

      <!-- ============ Nền làn (vẽ trước) ============ -->
      <!-- Làn A: khung nhấn -->
      <rect x="32" y="80" width="936" height="188" rx="8" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4"/>
      <text x="48" y="104" fill="#ba4513" font-size="12" font-weight="600" font-family="'Geist', sans-serif">A · Một phím (máy khuyên)</text>
      <!-- Làn B -->
      <rect x="32" y="288" width="936" height="188" rx="8" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="48" y="312" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">B · Chọn rồi <tspan font-family="'Geist Mono', monospace">⌘↵</tspan></text>

      <!-- ============ Mũi tên (vẽ trước nút) ============ -->
      <!-- Làn A -->
      <line x1="164" y1="180" x2="196" y2="180" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="340" y1="180" x2="524" y2="180" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M 724 172 L 728 172 Q 736 172 736 164 L 736 152 Q 736 144 744 144 L 756 144" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <path d="M 724 188 L 728 188 Q 736 188 736 196 L 736 208 Q 736 216 744 216 L 756 216" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Làn B -->
      <line x1="164" y1="388" x2="196" y2="388" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="340" y1="388" x2="372" y2="388" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="492" y1="388" x2="524" y2="388" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M 724 380 L 728 380 Q 736 380 736 372 L 736 360 Q 736 352 744 352 L 756 352" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <path d="M 724 396 L 728 396 Q 736 396 736 404 L 736 416 Q 736 424 744 424 L 756 424" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- ============ Làn A · nút ============ -->
      <!-- A1 Đọc thẻ -->
      <rect x="44" y="148" width="120" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="44" y="148" width="120" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="104" y="184" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Đọc thẻ</text>
      <!-- A2 Bấm 2 (nút nhấn) -->
      <rect x="196" y="148" width="144" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="196" y="148" width="144" height="64" rx="6" fill="#ffffff" stroke="#eb6c36" stroke-width="1.4"/>
      <text x="268" y="184" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Bấm <tspan font-family="'Geist Mono', monospace">2</tspan></text>
      <!-- A4 Hàng chờ -->
      <rect x="524" y="148" width="200" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="524" y="148" width="200" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="624" y="176" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Lệnh vào hàng chờ 5 giây</text>
      <text x="624" y="194" fill="#4f5d75" font-size="12" font-family="'Geist', sans-serif" text-anchor="middle">thẻ kế hiện ngay</text>
      <!-- A nhánh: hoàn tác -->
      <rect x="756" y="120" width="200" height="48" rx="6" fill="#f5f5f5"/>
      <rect x="756" y="120" width="200" height="48" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.40)" stroke-width="1"/>
      <text x="856" y="140" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Hoàn tác trong 5 giây</text>
      <text x="856" y="158" fill="#4f5d75" font-size="12" font-family="'Geist', sans-serif" text-anchor="middle">→ về thẻ cũ</text>
      <!-- A nhánh: ghi -->
      <rect x="756" y="192" width="200" height="48" rx="6" fill="#f5f5f5"/>
      <rect x="756" y="192" width="200" height="48" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.40)" stroke-width="1"/>
      <text x="856" y="221" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Hết 5 giây → ghi</text>

      <!-- ============ Làn B · nút ============ -->
      <!-- B1 Đọc thẻ -->
      <rect x="44" y="356" width="120" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="44" y="356" width="120" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="104" y="392" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Đọc thẻ</text>
      <!-- B2 Bấm 2 (chọn) -->
      <rect x="196" y="356" width="144" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="196" y="356" width="144" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="268" y="384" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Bấm <tspan font-family="'Geist Mono', monospace">2</tspan></text>
      <text x="268" y="402" fill="#4f5d75" font-size="12" font-family="'Geist', sans-serif" text-anchor="middle">(chọn, nút sáng lên)</text>
      <!-- B3 Bấm ⌘↵ -->
      <rect x="372" y="356" width="120" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="372" y="356" width="120" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="432" y="392" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Bấm <tspan font-family="'Geist Mono', monospace">⌘↵</tspan></text>
      <!-- B4 Hàng chờ -->
      <rect x="524" y="356" width="200" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="524" y="356" width="200" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="624" y="384" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Lệnh vào hàng chờ 5 giây</text>
      <text x="624" y="402" fill="#4f5d75" font-size="12" font-family="'Geist', sans-serif" text-anchor="middle">thẻ kế hiện ngay</text>
      <!-- B nhánh: hoàn tác -->
      <rect x="756" y="328" width="200" height="48" rx="6" fill="#f5f5f5"/>
      <rect x="756" y="328" width="200" height="48" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.40)" stroke-width="1"/>
      <text x="856" y="348" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Hoàn tác trong 5 giây</text>
      <text x="856" y="366" fill="#4f5d75" font-size="12" font-family="'Geist', sans-serif" text-anchor="middle">→ về thẻ cũ</text>
      <!-- B nhánh: ghi -->
      <rect x="756" y="400" width="200" height="48" rx="6" fill="#f5f5f5"/>
      <rect x="756" y="400" width="200" height="48" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.40)" stroke-width="1"/>
      <text x="856" y="429" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Hết 5 giây → ghi</text>

      <!-- ============ Chú thích dưới hình ============ -->
      <text x="32" y="508" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif">A ít hơn một phím mỗi thẻ; bấm nhầm ở A thì sửa bằng Hoàn tác.</text>
      <text x="32" y="528" fill="#4f5d75" font-size="12" font-family="'Geist', sans-serif">Nguồn: báo cáo soát Ops §e9 (B) và §f1 Q7, Gói G (A).</text>

      <!-- ============ Chú giải ============ -->
      <line x1="32" y1="552" x2="968" y2="552" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <text x="32" y="576" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.18em">CHÚ GIẢI</text>

      <rect x="32" y="588" width="24" height="12" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4"/>
      <text x="64" y="598" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Làn máy khuyên · viền cam: phím quyết</text>

      <rect x="272" y="588" width="24" height="12" rx="2" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="304" y="598" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Làn còn lại</text>

      <line x1="416" y1="594" x2="448" y2="594" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="456" y="598" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Đi tiếp</text>

      <line x1="532" y1="594" x2="564" y2="594" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <text x="572" y="598" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Đường lùi (Hoàn tác)</text>
    </svg>
  </div>
</body>
</html>
