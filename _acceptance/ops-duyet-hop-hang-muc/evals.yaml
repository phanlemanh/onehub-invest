    expected: "exit 0; ca 'OD2-AC-3-UI' ReviewQueue thật trong jsdom với hạng mục fill 3 thẻ chờ tạo ở ngày 1, 3, 2 (id 31, 33, 32) + 1 thẻ unit_match chờ: chọn 'Bổ sung tin', bấm 'Duyệt liền' → sheet mở thẻ 31 (cũ nhất trước), đầu sheet '1/3 · Bổ sung tin'; bấm đáp án (đồng hồ giả chạy hết 5 giây, fetch giả ok) → CÙNG phần tử sheet (so tham chiếu nút đóng và nút Trước) hiện thẻ 32 '1/2'; đếm sự kiện onOpenChange(false) giữa hai thẻ = 0; Sau/Trước đổi thẻ không gọi fetch; quyết thẻ cuối → Empty 'Hết thẻ chờ ở hạng mục này' + nút 'Sang Ghép căn'; hạng mục cuối hết thẻ → nút 'Đóng'. Ca 'OD2-AC-3-DB' lược đồ tạm 3 thẻ fill: quyết liền ba thẻ qua route decide thật (fetch nối thẳng handler POST) → 3 dòng review_queue đổi trạng thái, 3 dòng ops_audit review.decide có detail.category 'fill'. Chiều đỏ: đóng sheet khi quyết → 'SHEET DONG GIUA HAI THE'; thứ tự mới nhất trước → 'THU TU MOI TRUOC'; thẻ kế lấy cả hạng mục khác → 'THE KE LECH HANG MUC'."
