schema_version: 1
feature_slug: ops-duyet-hop-hang-muc
# Mọi ca máy ở app/tests/ops-duyet-hop-hang-muc.test.tsx (tên ca mở đầu «OD2-AC-n»): component thật trong jsdom, route
# decide thật trên lược đồ tạm od2_<pid> (bảng LIKE public.*, dữ liệu viết trước, xoá cuối lượt), hàm thuần với ma trận
# viết trước, đồng hồ giả (setTimeout, performance.now) cho hoàn tác. Mỗi phép đo có chiều đỏ trên CÙNG fixture: bản chép
# tạm của tệp nguồn (tests/.od2-cu-*) đổi đúng một chỗ, thông điệp ghim.
evals:
  - id: E1
    criterion: AC-1
    executor: test
    cmd: config:executors.test.app_ui
    layer: backend-effect
    paths: [app/src/lib/ops/review-dau-trang.ts, app/src/components/ops/review-content.tsx, app/tests/ops-duyet-hop-hang-muc.test.tsx]
    expected: "exit 0; ca 'OD2-AC-1' lược đồ tạm: 5 thẻ pending (2 tạo 80 giờ trước, 1 tạo 70 giờ trước, 2 mới), 3 thẻ quyết hôm nay giờ Việt Nam (một lúc 00:05 VN), 1 thẻ quyết 23:30 hôm qua giờ VN, 1 thẻ quyết 25 giờ trước → ba số = Chờ duyệt 5, Quá 3 ngày 2, Đã quyết hôm nay 3; ReviewContent thật render tĩnh vai ops → PageHeader có đúng ba chuỗi đó; vai viewer → không PageHeader ba số (như OD1); lược đồ không review_queue → nhánh cloud như OD1. Chiều đỏ: ngày theo UTC thay giờ Việt Nam → 'NGAY THEO UTC'; mốc 3 ngày tính từ decided_at → 'QUA HAN SAI COT'; đếm cả thẻ đã quyết vào Chờ → 'CHO DEM CA DA QUYET'."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E2
    criterion: AC-2
    executor: test
    cmd: config:executors.test.app_ui
    paths: [app/src/lib/ops/review-hop-hang-muc.ts, app/src/components/ops/review/review-hop-hang-muc.tsx, app/src/components/ops/review/review-queue.tsx, app/src/components/ops/review-content.tsx, app/tests/ops-duyet-hop-hang-muc.test.tsx]
    expected: "exit 0; ca 'OD2-AC-2' ma trận viết trước: 9 thẻ pending ở 4 hạng mục (fill 4 thẻ cũ nhất 6 ngày, unit_match 2, party_merge 2, intent_check 1) + 3 thẻ đã quyết, pace OD1 có unit_match trung vị 50 → hopHangMuc trả đúng 4 mục theo thứ tự REVIEW_CATEGORIES (unit_match, party_merge, fill, intent_check), số chờ 2/2/4/1, cũ nhất fill = 6, trung vị unit_match 50 và '—' ở mục chưa đo; ReviewQueue thật trong jsdom: mục đầu 'Tất cả 9'; bấm 'Bổ sung tin' → bảng còn 4 hàng, history.replaceState có '?category=fill'; dựng với category 'party_merge' → mục đó chọn sẵn, bảng 2 hàng; category 'xyz' → 'Tất cả', 9 hàng, không ném; không phần tử nào có nhãn 'Loại thẻ', ô 'Trạng thái' còn. Chiều đỏ: xếp theo số chờ thay thứ tự hạng mục → 'THU TU HOP SAI'; đếm cả thẻ đã quyết → 'HOP DEM DA QUYET'; category lạ ném → 'CATEGORY LA NEM'."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
