<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hàng chờ gắn nhãn</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Lora:ital,wght@0,400;1,400&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Lora', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.25;
      color: var(--color-ink);
      margin-bottom: 0.5rem;
    }
    .sub {
      font-size: 0.875rem;
      color: var(--color-muted);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Hình tại điểm quyết định · man-gan-nhan-mu · Hỏi-2</p>
    <h1>Hàng chờ: trạng thái của một tin</h1>
    <p class="sub">Luật phân tin cho người gắn · tin đơn và tin gắn trùng · AC-5 · AC-6</p>

    <svg viewBox="0 0 1120 560" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
      </defs>

      <rect width="1120" height="560" fill="#f5f5f5"/>

      <!-- ===================== LÀN ===================== -->
      <line x1="24" y1="80" x2="1096" y2="80" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <line x1="24" y1="256" x2="1096" y2="256" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
      <line x1="24" y1="476" x2="1096" y2="476" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <line x1="168" y1="80" x2="168" y2="476" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>

      <text x="32" y="188" fill="#4f5d75" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.18em">TIN ĐƠN</text>

      <text x="32" y="364" fill="#4f5d75" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.18em">TIN GẮN TRÙNG</text>
      <text x="32" y="380" fill="#636b80" font-size="10" font-family="'Geist', sans-serif">20% của lát</text>

      <!-- ===================== CHUYỂN TRẠNG THÁI (vẽ trước) ===================== -->
      <!-- Làn 1: tin đơn, y = 184 -->
      <line x1="206" y1="184" x2="240" y2="184" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="440" y1="184" x2="880" y2="184" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Vòng tự thân trên «Xong»: người khác ghi → 409 -->
      <path d="M 920 144 V 128 Q 920 120 928 120 H 1032 Q 1040 120 1040 128 V 144" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>

      <!-- Làn 2: tin gắn trùng, y = 368 -->
      <line x1="206" y1="368" x2="240" y2="368" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="440" y1="368" x2="560" y2="368" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="760" y1="368" x2="880" y2="368" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Vòng tự thân trên «Đủ cặp»: người thứ ba ghi → 409 -->
      <path d="M 920 320 V 304 Q 920 296 928 296 H 1032 Q 1040 296 1040 304 V 320" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>

      <!-- ===================== NHÃN CHUYỂN ===================== -->
      <rect x="612" y="158" width="96" height="16" rx="2" fill="#f5f5f5"/>
      <text x="660" y="170" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">MỘT NGƯỜI LƯU</text>

      <rect x="916" y="94" width="128" height="16" rx="2" fill="#f5f5f5"/>
      <text x="980" y="106" fill="#2d3142" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">NGƯỜI KHÁC GHI → 409</text>

      <rect x="460" y="342" width="80" height="16" rx="2" fill="#f5f5f5"/>
      <text x="500" y="354" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">NGƯỜI A LƯU</text>

      <rect x="768" y="342" width="104" height="16" rx="2" fill="#f5f5f5"/>
      <text x="820" y="354" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">NGƯỜI B ≠ A LƯU</text>

      <rect x="908" y="270" width="144" height="16" rx="2" fill="#f5f5f5"/>
      <text x="980" y="282" fill="#2d3142" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">NGƯỜI THỨ BA GHI → 409</text>

      <!-- ===================== TRẠNG THÁI ===================== -->
      <!-- Điểm bắt đầu -->
      <circle cx="200" cy="184" r="6" fill="#2d3142"/>
      <circle cx="200" cy="368" r="6" fill="#2d3142"/>

      <!-- Làn 1 · Chưa ai gắn -->
      <rect x="240" y="144" width="200" height="80" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="340" y="190" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Chưa ai gắn</text>

      <!-- Làn 1 · Xong -->
      <rect x="880" y="144" width="200" height="80" rx="8" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="980" y="190" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Xong</text>

      <!-- Làn 2 · Chưa ai -->
      <rect x="240" y="328" width="200" height="80" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="340" y="374" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Chưa ai</text>

      <!-- Làn 2 · Đã một người (trọng tâm) -->
      <rect x="560" y="320" width="200" height="96" rx="8" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4"/>
      <text x="660" y="356" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Đã một người</text>
      <text x="660" y="376" fill="#4f5d75" font-size="11" font-family="'Geist', sans-serif" text-anchor="middle">chờ người khác A</text>
      <text x="660" y="394" fill="#ba4513" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">được ưu tiên</text>

      <!-- Làn 2 · Đủ cặp -->
      <rect x="880" y="320" width="200" height="96" rx="8" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="980" y="364" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Đủ cặp</text>
      <text x="980" y="384" fill="#4f5d75" font-size="11" font-family="'Geist', sans-serif" text-anchor="middle">tính đồng thuận</text>

      <!-- Chú thích: A không bao giờ nhận lại tin -->
      <path d="M 660 416 V 440" fill="none" stroke="rgba(45,49,66,0.40)" stroke-width="1" stroke-dasharray="4,3"/>
      <circle cx="660" cy="416" r="2" fill="#2d3142"/>
      <text x="660" y="460" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', 'Lora', serif" text-anchor="middle">A không bao giờ nhận lại tin</text>

      <!-- ===================== CHÚ GIẢI ===================== -->
      <text x="24" y="524" fill="#4f5d75" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.18em">CHÚ GIẢI</text>

      <circle cx="132" cy="520" r="6" fill="#2d3142"/>
      <text x="144" y="524" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif">tin vào hàng chờ</text>

      <line x1="256" y1="520" x2="292" y2="520" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="300" y="524" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif">lượt lưu được ghi</text>

      <path d="M 416 528 V 516 Q 416 512 420 512 H 444 Q 448 512 448 516 V 528" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <text x="460" y="524" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif">bị từ chối 409 — không ghi, trạng thái giữ nguyên</text>

      <rect x="736" y="512" width="24" height="16" rx="3" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4"/>
      <text x="768" y="524" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif">tin được đưa trước tin mới</text>

      <rect x="920" y="512" width="24" height="16" rx="3" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="952" y="524" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif">không đưa cho ai nữa</text>
    </svg>
  </div>
</body>
</html>
