    criterion: AC-3
    executor: ui-check
    layer: ui-observed
    cmd: config:executors.design.ui_check
    target: "http://localhost:3464/ops/labels"
    paths: [app/src/app/ops/labels/**, app/src/components/ops/labels/**, app/src/lib/labels-queries.ts, app/src/app/api/v1/ops/labels/**]
    steps:
      - "Bản chạy: dev server của worktree ở http://localhost:3464, chạy với DATABASE_URL của DB thử oneinvest_p4_mgn (không phải oneinvest), đã mồi bằng probes/seed.mjs (lát ocp1, 10 tin, 2 tin gắn trùng). KHÔNG tạo hay sửa tệp nào trong cây; không có bản chạy thì FAIL với 'bản chạy không lên'"
      - "Chụp bằng bước chụp của kho KÈM CÙNG DATABASE_URL của DB thử: DATABASE_URL=<DB thử> bash scripts/ui-capture.sh http://localhost:3464/ops/labels _acceptance/man-gan-nhan-mu/evidence/E3-step1.png — 1280 sáng; KHÔNG đọc hay in mật khẩu"
      - "Cùng lệnh với UI_CAPTURE_SIZE=390x844 UI_CAPTURE_SCHEME=dark → evidence/E3-step2.png; ghi dòng «bề rộng: …» lệnh in"
      - "Điền chín ô của tin đang hiện bằng dữ liệu của probes/seed.mjs (GIA_TRI_MAU) qua trình duyệt của kho (ego-browser) rồi bấm «Lưu và sang tin kế»; chụp evidence/E3-step3.png; rồi chạy DATABASE_URL=<DB thử> node _acceptance/man-gan-nhan-mu/probes/doc-nhan.mjs để in các dòng eval_labels của tin vừa lưu"
    expected: "Trang hiện ô số, chữ gốc của tin, nhóm, giờ đăng và biểu mẫu chín ô; ba ô chọn mang đúng các nhãn của sổ từ vựng; sau Lưu trang chuyển sang tin khác và doc-nhan in 9 dòng mang labeler_id của tài khoản ops thử; ảnh desktop sáng + điện thoại tối không cuộn ngang cấp trang"
    evidence_required: [run_id, screenshot, observed, verifier, verified_at]
