schema_version: 1
feature_slug: man-gan-nhan-mu
# DB: mọi phép đo chạy trên DB thử tạo bằng `bash db/db-thu.sh oneinvest_p4_mgn` (bản sao oneinvest), không ghi oneinvest :5433.
# Migration 054 (liên làn cấp 30/10): db/migrations/054_labels.sql.
evals:
  - id: E1
    criterion: AC-1
    executor: script
    cmd: config:executors.script.mgn_migration
    layer: backend-effect
    paths: [db/migrations/054_labels.sql, pipeline/sync-cloud.mjs, pipeline/push-ops-facts.mjs, _acceptance/man-gan-nhan-mu/probes/migration.mjs]
    expected: "exit 0; trên DB thử áp migration hai lần: 'ok bang eval_label_items', 'ok bang eval_labels', 'ok view eval_label_agreement' kèm đủ cột của design doc; 'ok ap lan hai: khong loi, so dong khong doi'; ba ca chèn vi phạm (trùng (lat,text_hash), trùng (item_id,labeler_id,field), split='x') đều bị DB từ chối, mỗi ca in 'ok chan <ca>'; 'ok khong len cloud' khi sync-cloud.mjs và push-ops-facts.mjs không nhắc eval_label; chiều đỏ: bản chép migration bỏ khoá duy nhất (item_id,labeler_id,field) → 'KHONG CHAN TRUNG NHAN'; cuối 'MIGRATION OK'"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E2
    criterion: AC-2
    executor: script
    cmd: config:executors.script.mgn_mau
    layer: backend-effect
    paths: [pipeline/label-sample.mjs, pipeline/lib/eval-labels.mjs, pipeline/lib/test-posts.mjs, _acceptance/man-gan-nhan-mu/probes/mau.mjs]
    expected: "exit 0; probe COMMIT vào DB thử một lát thử riêng (lat mgn-thu, nhóm tên 'MGN-THU …'), chạy lệnh thật bằng TIẾN TRÌNH CON (node pipeline/label-sample.mjs --lat mgn-thu --nhom-khop '^MGN-THU'), không gọi hàm, rồi DELETE dữ liệu thử sau khi đo; ma trận viết trước: 30 nội dung khác nhau ở nhóm khớp lát, 5 bản trùng nội dung, 6 post thử (mỗi dấu của lib/test-posts.mjs một ca), 8 tin nhóm khác; chạy label-sample --n 20 --seed mgn: đúng 20 dòng, 0 post thử, 0 nhóm khác, 0 hai dòng cùng text_hash, double_label = 4, dev/test 10/10 (lệch ≤ 1); chạy lại: 0 thêm 0 đổi; --thu: 0 dòng ghi (đếm qua kết nối thứ hai); --n 100: lấy 30, in 'thieu 70', exit 0; chiều đỏ: bản bộ lọc không gạt post thử → 'POST THU LOT VAO MAU'; cuối 'MAU OK'"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
