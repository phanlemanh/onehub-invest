schema_version: 1
feature_slug: truong-nhan-s03-081
# Mỗi phép đo mới có cặp hai chiều trên cùng fixture: vật lành xanh, bản đột biến đỏ với thông điệp ghim (MEASURE-BIRTH).
# DB: DB thử riêng oneinvest_tn081 (db/db-thu.sh), hoặc lược đồ tạm của test app; không ghi DB máy thu.
evals:
  - id: E1
    criterion: AC-1
    executor: script
    cmd: config:executors.script.tn081_migration
    layer: backend-effect
    paths: [db/migrations/081_*.sql, app/src/lib/labels-normalize.ts, _acceptance/truong-nhan-s03-081/probes/migration.mjs]
    expected: "exit 0; probe dựng DB rỗng oneinvest_tn081_mig bằng các tệp migration nhãn (bảng ref của 043, 054, 072, 073, 075, 076), chèn 17 trường cũ cho hai người, chụp view đồng thuận, áp 081 hai lần; danh sách trường và căn cứ để INSERT nạp từ hằng xuất LABEL_FIELDS_NHOM và BASIS của app/src/lib/labels-normalize.ts (không gõ trong probe); in 'ok ap hai lan', 'ok nhan 24 truong cua app', 'ok nhan 5 can cu cua app', 'ok tu choi truong la', 'ok tu choi can cu la' (CHECK violation), 'ok dong thuan 17 truong khong doi' (so từng cột với ảnh chụp trước), 'ok dong thuan co 7 truong moi', 'ok dong cu nguyen ven' (băm trước == sau); cuối 'MIGRATION OK', rồi xoá DB thử. Chiều đỏ trên cùng fixture: bản 081 đổi tên một trường ('TRUONG APP KHONG QUA CHECK 081'); bản 081 bỏ danh_muc_cdt ('CAN CU DANH MUC BI TU CHOI'); bản 081 thiếu một trường trong view ('VIEW THIEU TRUONG MOI')."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
