    paths: [app/src/components/ops/labels/nhom-fields.ts, app/src/components/ops/labels/nhom-row.tsx, app/src/components/ops/labels/label-form-nhom.tsx, app/tests/labels-nhom.test.tsx]
    expected: "exit 0; ca 'TN081-AC-2' trên biểu mẫu thật trong jsdom: thứ tự hàng của từng khối khớp bảng viết trước (Mô tả căn = [furnished, direction_faces, view, availability_date]; Vị trí bắt đầu [project, subzone, unit_number, building]; Giá = [price_min_vnd, price_max_vnd, price_basis, rent_includes]); mỗi hàng mới có nhóm căn cứ năm nút [Chữ, Ảnh, Nhóm, Nghề, CĐT] và ô «Không suy ra được»; lựa chọn của năm trục bằng đúng VOCAB của sổ (so cả số lượng); bấm hai nút View thì cả hai sáng, bấm hai nút Phí đã gồm thì cả hai sáng. Chiều đỏ: bản thiếu khối Mô tả căn ('THIEU KHOI MO TA CAN'); bản View một lựa chọn ('VIEW KHONG CHON NHIEU'); bản thiếu nút CĐT ('THIEU CAN CU CDT')."
