schema_version: 1
feature_slug: nap-s09-can-cao-tang-vao-danh-ba
evals:
  - id: E1
    criterion: AC-1
    executor: script
    cmd: config:executors.script.s09_can_db
    expected: "Fixture nhiều bản thu can-cao-tang nạp qua bộ nạp của DA56 cùng danh sách tầng gói 1: ma trận năm ô (lỗi rồi tốt, tốt rồi lỗi, tốt rồi rỗng, tầng chưa gọi, tầng chỉ có bản rỗng) assert trạng thái trọn của toà và số căn không trùng từng ô. Chiều đỏ: đột biến coi tầng chưa gọi là trọn thì ô «tầng chưa gọi» đỏ nêu tên ô"
    paths: ["pipeline/lib/s09-danh-ba-can.mjs", "pipeline/lib/s09-can-cao-tang.mjs", "pipeline/scripts/danh-ba-s09-can*"]
  - id: E2
    criterion: AC-2
    executor: script
    cmd: config:executors.script.s09_can_that
    expected: "Trên DB thử chép máy thu đã nạp bản thu gói 2 qua DA56, bộ đếm độc lập không import pipeline/lib/s09* in bảng hai cột (bước căn · đếm thẳng snapshot) cho mười ô: dự án, toà, tầng có bản tốt, tầng rỗng, tầng chưa gọi, căn, căn tách được, mã hỏng, khoá duy nhất, căn trùng khoá; hai cột bằng nhau từng ô (bốn bản thu 24–25/11: 196 · 902 · 23.541 · 2 · 165 · 358.032 · 353.386 · 4.646 · 349.493 · 3.893). Chiều đỏ: bớt một căn trong bản chép snapshot thì thoát 1 nêu đúng ô «căn». Chỉ in số"
    paths: ["pipeline/lib/s09-can-cao-tang.mjs", "pipeline/scripts/danh-ba-s09-can*"]
  - id: E3
    criterion: AC-3
    executor: test
    cmd: config:executors.test.s09_can_ham
    expected: "Ma trận mười bốn ô viết trước theo khuôn thật của gói 2, mỗi ô một assert giá trị trả về (toà của item, tầng, số căn hoặc lý do hỏng). Chiều đỏ: đột biến tách theo dấu chấm đầu tiên thì ô «toà có dấu chấm» đỏ; đột biến lấy toà từ mã thì ô «toà viết tắt» đỏ; mỗi thông điệp nêu tên ô"
    paths: ["pipeline/lib/s09-can-cao-tang.mjs", "pipeline/lib/s09-can-cao-tang.test.mjs"]
  - id: E4
    criterion: AC-4
    executor: script
    cmd: config:executors.script.s09_can_db
    expected: "Ba toà fixture: toà đủ điều kiện có căn; toà không bí danh và toà có tầng lỗi 0 toà, 0 trục, 0 căn và hai bộ đếm lý do mỗi bộ bằng số căn của toà đó. Chiều đỏ: đột biến bỏ kiểm tầng lỗi thì ca đỏ nêu «toà chưa trọn»"
    paths: ["pipeline/lib/s09-danh-ba-can.mjs", "pipeline/danh-ba-vat-the.mjs"]
  - id: E5
    criterion: AC-5
    executor: script
    cmd: config:executors.script.s09_can_db
    expected: "Căn S16, S08, căn không trục mỗi căn nhận đúng một bí danh S09; SELECT số căn trong toà trước và sau bằng nhau; căn hai bí danh S09 bằng 0; mã S09 trỏ hai căn bằng 0. Thêm ô trùng khoá: hai căn S09 cùng toà cùng khoá, một ở toà chỉ S09 và một khớp căn S16 có sẵn — căn đi tiếp có uuid nhỏ nhất, căn S16 chỉ một bí danh S09, bộ đếm «trùng khoá» bằng 1 mỗi ô. Chiều đỏ: đột biến bỏ bước tìm căn có sẵn thì ca đỏ nêu «căn trùng»; đột biến chọn theo thứ tự đọc thì ô trùng khoá đỏ"
    paths: ["pipeline/lib/s09-danh-ba-can.mjs", "pipeline/danh-ba-vat-the.mjs", "pipeline/lib/danh-ba-vat-the.mjs"]
  - id: E6
    criterion: AC-6
    executor: script
    cmd: config:executors.script.s09_can_db
    expected: "Theo lời Hỏi-2 đã ghi trong sổ: với khuyến nghị thì 0 căn mới, mỗi toà đúng một thẻ entity_match có số lệch theo loại, evidence không chứa mã căn hay tên toà của fixture (đối chứng dương: hàm soát bắt được khi cấy), chạy lại 0 thẻ mới. Chiều đỏ: đột biến đúc căn khi không khớp thì ca đỏ nêu «căn lệch»"
    paths: ["pipeline/lib/s09-danh-ba-can.mjs", "pipeline/danh-ba-vat-the.mjs"]
  - id: E7
    criterion: AC-7
    executor: script
    cmd: config:executors.script.s09_can_db
    expected: "Căn chuẩn có stack_key, floor đúng giá trị viết trước, catalog_tier mot_loi_khai; căn tầng ngoài khuôn có stack_key NULL và sub_id bằng unit_key; mỗi căn một bí danh S09. Chiều đỏ: đột biến ép tầng ngoài khuôn vào cột floor thì ca đỏ nêu «tầng ngoài khuôn»"
    paths: ["pipeline/lib/s09-danh-ba-can.mjs", "pipeline/danh-ba-vat-the.mjs"]
  - id: E8
    criterion: AC-8
    executor: script
    cmd: config:executors.script.s09_can_db
    expected: "Hai DB riêng cùng fixture, hai thứ tự nạp: tập (mã nguồn, số căn, bí danh, số thẻ) bằng nhau; dựng thêm hai lần 0 khoá, 0 bí danh, 0 thẻ mới và băm tập căn bằng nhau; bước đêm không có bản thu mới không gửi câu đọc bảng căn S09. Chiều đỏ: đột biến bỏ tra căn S09 trong bước S16 thì DB hai có mã hai căn, ca đỏ nêu «thứ tự»"
    paths: ["pipeline/lib/s09-danh-ba-can.mjs", "pipeline/lib/s16-dung.mjs", "pipeline/lib/danh-ba-vat-the.mjs", "pipeline/danh-ba-vat-the.mjs"]
  - id: E9
    criterion: AC-9
    executor: script
    cmd: config:executors.script.s09_can_db
    expected: "Danh sách đẩy của sync-cloud không có bảng stg căn S09, buildings, stacks, units; soát thẻ, log và tệp của hàng ra 0 tên thật. Chiều đỏ: cấy một chuỗi tên thật giả lập vào thẻ fixture thì bộ soát thoát khác 0, nêu bảng và cột, không in giá trị"
    paths: ["pipeline/sync-cloud.mjs", "pipeline/lib/s09-danh-ba-can.mjs"]
  - id: E10
    criterion: AC-10
    executor: script
    layer: backend-effect
    cmd: config:executors.script.s09_can_that
    expected: "Trên DB thử chép máy thu: tổng căn của bản thu bằng tổng bảy phần (thêm «trùng khoá»), mỗi căn đúng một phần theo thứ tự khai trong AC-10; số căn S09 trong danh bạ nằm trong dải 250.000–349.493; toà chưa nối + toà chưa trọn ≤5%, mỗi phần một SELECT riêng; số căn cao tầng S09 trong danh bạ bằng số lệnh --dem in; căn hai khoá bằng 0; mã S09 trỏ hai căn bằng 0; chạy lại cùng số và 0 khoá mới; năm ngưỡng của AC-10 (mã hỏng ≤1,5%, trùng khoá ≤1,5%, ≥90% căn vào ở toà đã nối và trọn, ≥90% căn S09 khớp ở toà trùng S16 S08, sai khớp ≤1%) in cạnh số đo; mẫu chia năm khuôn mã, mỗi khuôn ≤40 cặp hạt giống cố định, đối chiếu mã gốc S16 chuẩn hoá với mã S09 và tầng item S09 với tầng gốc S16, sai ≤1% mỗi khuôn có ≥20 cặp; tỉ lệ tầng mã ≠ tầng item ≤8%. Chiều đỏ, mỗi đột biến thoát 1 nêu đúng tên: bỏ một phần khỏi phép cộng → phần thiếu; bộ tách loại mọi mã → «mã hỏng»; lệch tầng thêm 1 khi khớp → «sai khớp». Chỉ in số"
    paths: ["pipeline/lib/s09-danh-ba-can.mjs", "pipeline/danh-ba-vat-the.mjs", "pipeline/scripts/danh-ba-s09-can*"]
