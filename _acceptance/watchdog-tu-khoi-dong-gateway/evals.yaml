schema_version: 1
feature_slug: watchdog-tu-khoi-dong-gateway
# Mọi eval chạy watchdog TRỌN VẸN trên bản chép trong thư mục tạm (chỉ đổi đường log /tmp theo ngày và cổng :5433), HOME giả,
# launchctl/pkill/pgrep/osascript/curl/date là stub đứng đầu PATH ghi sổ từng lời gọi (luật 8). Harness thoát 2 KHÔNG spawn
# khi một stub không thắng PATH hay HOME lượt là HOME thật. Mỗi ca in «PASS <mã> …» / «FAIL <mã> …»; dòng cuối
# «NGHIEM THU PASS <n>/<n>». Ca mang hậu tố -DO phá BẢN CHÉP hay hộp cát và đòi chốt đỏ với thông điệp ghim.
evals:
  - id: E1
    criterion: AC-1
    executor: script
    cmd: config:executors.script.vhz2_nghiem_thu
    paths: [scripts/zalo-watchdog.sh, scripts/lib/s03-song.sh, scripts/watchdog-tu-khoi-dong-gateway/acceptance.mjs]
    expected: "exit 0; 'PASS KICK-0911': sổ stub có đúng 1 dòng 'launchctl kickstart -k gui/<uid>/ai.openclaw.gateway', alerts log 1 dòng 'VHZ2: kickstart gateway', zalo-watchdog-p1.log 1 dòng, 0 dòng 'launchctl bootout' và 0 dòng 'pkill'; 'PASS BIEN-599': đỏ 599 s → 0 lời kickstart; 'PASS BIEN-599-DO': bản chép đổi ngưỡng '-ge 600' thành '-ge 599' → chốt biên đỏ với thông điệp 'kickstart trước 600 s đỏ'"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E2
    criterion: AC-2
    executor: script
    cmd: config:executors.script.vhz2_nghiem_thu
    paths: [scripts/zalo-watchdog.sh, scripts/watchdog-tu-khoi-dong-gateway/acceptance.mjs]
    expected: "exit 0; 'PASS TRAN-6H': +21599 s → 0 lời kickstart thêm và alerts log có 'quá trần 1 lần/6 giờ'; +21600 s → tổng 2 lời; 'PASS MUOI-LUOT': 10 lượt trong 6 giờ → đúng 1 lời; 'PASS TRAN-6H-DO': bản chép đổi 21600 thành 0 → chốt trần đỏ với thông điệp 'kickstart quá 1 lần trong 6 giờ'"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E3
    criterion: AC-3
    executor: script
    cmd: config:executors.script.vhz2_nghiem_thu
    paths: [scripts/zalo-watchdog.sh, collector/scripts/zalo-heartbeat.sh, scripts/lib/s03-song.sh, scripts/watchdog-tu-khoi-dong-gateway/acceptance.mjs]
    expected: "exit 0; 'PASS PHIEN-CHET-1311': tệp trạng thái heartbeat do zalo-heartbeat.sh sinh có '^reason=session$'; lượt 1 → 1 lời kickstart, p1-state có 'session=1'; lượt 2 và lượt sau 6 giờ → 0 lời thêm, alerts log đúng 1 dòng 'CẦN QUÉT QR'; heartbeat UP → 'session=1' bị gỡ; 'PASS PHIEN-CHET-UNKNOWN': tệp heartbeat do zalo-heartbeat.sh sinh có '^reason=unknown$' (status treo sau session), ba mốc 6 giờ liên tiếp → tổng 3 lời kickstart, 0 dòng 'CẦN QUÉT QR'; 'PASS PHIEN-CHET-DO': bản chép bỏ nhánh session=1 → chốt đỏ với thông điệp 'phiên chết vẫn kickstart lặp'"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E4
    criterion: AC-4
    executor: script
    cmd: config:executors.script.vhz2_nghiem_thu
    paths: [scripts/zalo-watchdog.sh, scripts/watchdog-tu-khoi-dong-gateway/acceptance.mjs]
    expected: "exit 0; 'PASS LOCKDOWN-L2', 'PASS LOCKDOWN-L3B', 'PASS LOCKDOWN-L1', 'PASS L4D-DO-DANG': mỗi ca 0 lời kickstart, alerts log có dòng 'KILL:', lời bootout/pkill chỉ trong sổ stub; 'PASS LOCKDOWN-DO': bản chép chuyển khối P1 lên trước L2 → ca L2 đỏ với thông điệp 'kickstart khi lockdown đỏ'"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E5
    criterion: AC-5
    executor: script
    cmd: config:executors.script.vhz2_nghiem_thu
    paths: [scripts/zalo-watchdog.sh, scripts/watchdog-tu-khoi-dong-gateway/acceptance.mjs]
    expected: "exit 0; 'PASS GATEWAY-CHET': stub pgrep thoát 1 → watchdog thoát 0, 0 lời kickstart, 0 dòng alerts mới, 0 dòng zalo-watchdog.log mới; 'PASS GATEWAY-CHET-DO': bản chép bỏ dòng 'pgrep -f openclaw … || exit 0' → chốt đỏ với thông điệp 'watchdog chạy tiếp khi gateway không chạy'"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E6
    criterion: AC-6
    executor: script
    cmd: config:executors.script.vhz2_nghiem_thu
    paths: [scripts/zalo-watchdog.sh, scripts/watchdog-tu-khoi-dong-gateway/acceptance.mjs]
    expected: "exit 0; 'PASS CAU-HINH-BAM': openclaw.json của HOME giả cùng băm sau mọi lượt; 'PASS SO-STUB': mọi lượt tới được L6 có ít nhất 1 lời 'status' trong sổ CLI giả (đối chứng dương) và lời CLI OpenClaw chỉ 'status', lời launchctl chỉ hai dạng kickstart -k / bootout gui/<uid>/ai.openclaw.gateway; 'PASS P1-CHI-DOC': mốc khối P1 đúng 1 lần, vùng quét chứa 'launchctl kickstart', vùng gồm thân hàm P1 gọi; không lời CLI OpenClaw, ghi openclaw.json, đăng nhập/QR, eval hay bash -c ngoài lời chạy KICK_CMD; 'PASS P1-CHI-DOC-DO': ma trận sáu bản chép — lời CLI qua biến, ghi openclaw.json, login, helper đặt trên mốc ghi openclaw.json rồi gọi từ P1, eval chuỗi gọi CLI, đổi chữ mốc — mỗi bản chốt đỏ đúng loại với thông điệp 'khối P1 có lời CLI, ghi cấu hình hay đăng nhập' (bản đổi mốc: 'không thấy mốc khối P1')"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E7
    criterion: AC-7
    executor: script
    cmd: config:executors.script.vhz2_nghiem_thu
    paths: [scripts/watchdog-tu-khoi-dong-gateway/acceptance.mjs]
    expected: "exit 0; 'PASS CO-LAP': mọi lượt env dựng từ đầu (0 biến ZALO_* thừa hưởng), PATH đúng khuôn, command -v của bảy lệnh (gồm openclaw) trong thư mục tạm hoặc vắng, bản chép 0 đường tuyệt đối tới checkout thật/~/dev/.openclaw ngoài HOME; log thật của checkout chính: phần có trước giữ băm, phần nối thêm 0 dòng của lượt; p1-state, p1-tat và tệp heartbeat thật cùng có/vắng và cùng băm trước/sau bộ; 'PASS STUB-VANG-DO': gỡ stub launchctl → từ chối với thông điệp 'stub launchctl không thắng PATH', 0 spawn; 'PASS CLI-VANG-DO': gỡ CLI giả trong HOME lượt → từ chối với thông điệp 'CLI OpenClaw giả vắng', 0 spawn; 'PASS HOME-THAT-DO': HOME lượt = HOME thật → từ chối với thông điệp 'từ chối chạy trên HOME thật', 0 spawn"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E8
    criterion: AC-8
    executor: script
    cmd: config:executors.script.vhz2_nghiem_thu
    paths: [scripts/zalo-watchdog.sh, scripts/watchdog-tu-khoi-dong-gateway/acceptance.mjs]
    expected: "exit 0; 'PASS TAT-ENV' và 'PASS TAT-TEP': 0 lời kickstart; gỡ công tắc → lượt kế 1 lời (đối chứng dương)"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E9
    criterion: AC-9
    executor: script
    cmd: config:executors.script.vhz2_nghiem_thu
    paths: [scripts/zalo-watchdog.sh, scripts/watchdog-tu-khoi-dong-gateway/acceptance.mjs]
    expected: "exit 0; 'PASS SO-P1': tail -1 zalo-watchdog-p1.log khớp ^\\S+ VHZ2 kickstart — lý do: L6\\(b\\) đỏ [0-9]+s; heartbeat reason=(session|stopped|unknown|na)$ ở ca 09/11 (reason=stopped), ca 13/11 (reason=session) và ca không có tệp heartbeat (reason=na)"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E10
    criterion: AC-10
    executor: test
    cmd: config:executors.script.vhz2_chan
    paths: [scripts/zalo-watchdog.sh, scripts/lib/s03-song.sh, pipeline/scripts/zalo-watchdog-vhz2.test.mjs]
    expected: "exit 0; 8 ca pass, 0 fail, 0 skip trên máy thu"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E11
    criterion: AC-10
    executor: test
    cmd: config:executors.script.s03_song_lib
    paths: [scripts/lib/s03-song.sh, scripts/zalo-watchdog.sh]
    expected: "exit 0; 7 ca L6 pass"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E12
    criterion: AC-10
    executor: script
    cmd: config:executors.script.s03_song_tron
    paths: [scripts/lib/s03-song.sh, scripts/zalo-watchdog.sh, scripts/canh-bao-s03-ngung-thu/acceptance.mjs]
    expected: "exit 0; 'TRON PASS'"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E13
    criterion: AC-10
    executor: script
    cmd: config:executors.script.s03_song_bien
    paths: [scripts/lib/s03-song.sh, scripts/canh-bao-s03-ngung-thu/acceptance.mjs]
    expected: "exit 0; 'BIEN PASS'"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E14
    criterion: AC-10
    executor: script
    cmd: config:executors.script.s03_hb_nghiem_thu
    paths: [collector/scripts/zalo-heartbeat.sh, scripts/lib/s03-song.sh, scripts/l6d-down-keo-dai-ly-do/acceptance.mjs]
    expected: "exit 0; 'NGHIEM THU PASS 26/26'"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E15
    criterion: AC-10
    executor: script
    cmd: config:executors.script.s03_hb_syntax
