schema_version: 1
feature_slug: dac-trung-nha-s06-len-canonical
# Ca thuần «DT-AC-n» ở pipeline/scripts/dac-trung-s06.test.mjs (npm test); ca DB ở pipeline/scripts/dac-trung-s06.itest.mjs (DB thử
# oneinvest_p1_n3, nạp 061 trong giao dịch, khoá 33033); thước dữ liệu thật pipeline/scripts/do-dac-trung-s06.mjs. Mỗi phép đo có
# ca đỏ trên bản sao đột biến chép cạnh tệp thật rồi xoá.
evals:
  - id: E1
    criterion: AC-1
    executor: script
    layer: backend-effect
    cmd: config:executors.script.dac_trung_s06_that
    paths: [db/migrations/061_*.sql, pipeline/lib/nap-061.mjs, pipeline/scripts/dac-trung-s06.itest.mjs]
    expected: "exit 0; ca 'DT-AC-1' xanh: sau khi áp 061 hai lần, information_schema có 7 cột với kiểu viết trước ở sale_offer_records và view sale_offers; INSERT frontage_length=0, stories=0, latitude=91, longitude=181 bị CHECK chặn với tên ràng buộc; field_assertions nhận phát biểu cho 7 mã mới và cho offer_status; số dòng sale_offer_records và field_assertions không đổi sau lần áp; ca đỏ: bản sao 061 bỏ CHECK vĩ độ ghim «latitude»"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E2
    criterion: AC-2
    executor: script
    cmd: config:executors.script.dac_trung_s06_vocab
    paths: [pipeline/mappings.yaml, pipeline/lib/vocab.generated.mjs, db/migrations/061_*.sql]
    expected: "exit 0; vocab --check, --lint xanh; --check-db trên DB thử đã áp 061 (trong giao dịch) 0 lệch; đối chứng cùng lệnh: chưa áp 061 thì checkDb lệch và gọi tên field_assertions.field"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E3
    criterion: AC-3
    executor: test
    cmd: config:executors.test.pipeline
    paths: [pipeline/lib/dac-trung-s06.mjs, pipeline/scripts/dac-trung-s06.test.mjs]
    expected: "exit 0; ca 'DT-AC-3' xanh: ma trận viết trước (mỗi trường × hợp lệ/vắng/rác, mỗi dạng giá trị thật đếm ở stg — số JSON, chuỗi số, dấu phẩy thập phân, chuỗi kèm đơn vị —, dòng chỉ streetnumber_display, dòng width không length) — số assert bằng số dòng, mỗi dòng đúng tập {field, value, rule_id}; ca đỏ: bản sao bỏ khung toạ độ VN ghim dòng «toạ độ ngoài khung»"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E4
    criterion: AC-4
    executor: script
    layer: backend-effect
    cmd: config:executors.script.dac_trung_s06_that
    paths: [pipeline/transform-chotot.mjs, pipeline/lib/dac-trung-s06.mjs, db/migrations/061_*.sql, pipeline/scripts/dac-trung-s06.itest.mjs]
    expected: "exit 0; ca 'DT-AC-4' xanh: tin S06 tổng hợp → mỗi giá trị hợp lệ đúng một phát biểu sống (fact, source_field, rule_id = khoá nguồn, observed_at = list_time), giá trị rác không có phát biểu; ma trận trigger 4 trường số × (chữ, ngoài miền) × phương pháp source_field và hitl đều bị chặn kèm tên trường, mỗi trường một ca dương đúng miền vào được; ca đỏ: bản sao transform bỏ bước đặc trưng ghim «street_number»"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E5
    criterion: AC-5
    executor: script
    layer: backend-effect
    cmd: config:executors.script.dac_trung_s06_that
    paths: [db/migrations/061_*.sql, pipeline/scripts/dac-trung-s06.itest.mjs]
    expected: "exit 0; ca 'DT-AC-5' xanh: sau phân xử 7 cột mới và bathrooms của tin tổng hợp bằng giá trị viết trước, field_provenance có khoá cho từng trường; phát biểu hitl khác giá trị cho stories thắng source_field; ca đỏ: bản sao 061 bỏ stories khỏi resolve_offer_fields ghim «stories»"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E6
    criterion: AC-6
    executor: script
    layer: backend-effect
    cmd: config:executors.script.dac_trung_s06_that
    paths: [pipeline/transform-chotot.mjs, pipeline/scripts/dac-trung-s06.itest.mjs]
    expected: "exit 0; ca 'DT-AC-6' xanh: lượt hai thêm 0 phát biểu, đổi 0 ô; lượt ba đổi width ở stg → rút đúng phát biểu frontage_length và lot_size_dimensions cũ, thêm đúng một phát biểu mới mỗi trường, ô mang giá trị mới; ca đỏ: bản sao bỏ replaceOwn ghim «rút»"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E7
    criterion: AC-7
    executor: script
    layer: backend-effect
    cmd: config:executors.script.dac_trung_s06_that
    paths: [pipeline/transform-chotot.mjs, pipeline/lib/dac-trung-s06.mjs, db/migrations/061_*.sql, pipeline/scripts/do-dac-trung-s06.mjs]
    expected: "exit 0; dòng 'DT-AC-7' xanh trên bản mới: mỗi đặc trưng in ba số bằng SQL độc lập với bộ đọc (có khoá khác rỗng · bị loại là rác kèm ba giá trị rác phổ biến · có ô khác rỗng), tỉ lệ trên mẫu số Hỏi-1 ≥ 95%; 0 ô mới khác rỗng thiếu phát biểu sống cùng giá trị; ca đỏ: cùng thước với code transform merge-base trên DB đã áp 061 kết thúc bình thường (không lỗi SQL) và ra dòng đỏ «<trường>: X/Y < 95%»"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E8
    criterion: AC-8
    executor: script
    layer: backend-effect
    cmd: config:executors.script.dac_trung_s06_that
    paths: [pipeline/transform-chotot.mjs, db/migrations/061_*.sql, pipeline/sync-cloud.mjs, pipeline/scripts/do-dac-trung-s06.mjs]
    expected: "exit 0; dòng 'DT-AC-8' xanh: tập tin sống và năm cột cũ + offer_status của mọi tin sống S03/S05/S06 và bathrooms của tin S03/S05 sau bản trước bằng sau bản mới (0 tin miễn; bản trước chạy trên DB đã áp 061), CLOUD_ALLOW.sale_offers không chứa cột nào trong 7 cột mới; đối chứng dương: so trên bản chép đổi property_type một tin ra lệch và gọi tên tin"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E9
    criterion: AC-9
    executor: test
    cmd: config:executors.test.pipeline
    paths: [pipeline/**]
    expected: "exit 0; toàn bộ bộ test pipeline xanh"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E9b
    criterion: AC-9
    executor: script
    cmd: config:executors.script.dac_trung_s06_that
    paths: [pipeline/scripts/trang-thai-chao.itest.mjs, pipeline/scripts/dac-trung-s06.itest.mjs, db/migrations/061_*.sql]
    expected: "exit 0; ca DB của HD5 và ca DB trạng thái chào của 059 (trang-thai-chao.itest) trên DB thử đều xanh; phat-bieu-db.itest không chạy ở đây vì PD-AC-1 (view thiếu field_provenance) và PD-AC-8 đã đỏ trên main 25ce701b — giám sát duyệt P1-87, hàng riêng sửa"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
