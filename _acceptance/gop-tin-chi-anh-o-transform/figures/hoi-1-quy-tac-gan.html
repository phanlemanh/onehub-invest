<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hỏi-1 quy tắc gán</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Lora:ital,wght@0,400;1,400&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Lora', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1040px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.25;
      color: var(--color-ink);
      margin-bottom: 0.5rem;
    }
    .sub { font-size: 0.875rem; color: var(--color-muted); margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Cổng Phạm vi · gop-tin-chi-anh-o-transform · hoi-1-quy-tac-gan</p>
    <h1>Hỏi-1: bài chỉ-ảnh gắn vào bài chữ nào</h1>
    <p class="sub">AC-2 · AC-4 · AC-6 · hai nhánh, nhánh tô cam là nhánh khuyến nghị</p>

    <svg viewBox="0 0 1000 700" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- ============ Khung (nền, vẽ trước) ============ -->
      <rect x="48" y="100" width="904" height="216" rx="8" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.20)" stroke-width="1"/>
      <text x="64" y="124" fill="#4f5d75" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.14em">TÌNH HUỐNG · MỘT NGƯỜI GỬI TRONG MỘT NHÓM S03 · TRỤC NGANG = GIÂY</text>

      <rect x="48" y="352" width="440" height="256" rx="8" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4"/>
      <text x="64" y="376" fill="#ba4513" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.14em">NHÁNH A · GẦN NHẤT (KHUYẾN NGHỊ)</text>

      <rect x="512" y="352" width="440" height="256" rx="8" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="528" y="376" fill="#4f5d75" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.14em">NHÁNH B · CHỈ XÉT TIN OFFER</text>

      <!-- ============ Mũi tên (vẽ trước nút) ============ -->
      <path d="M 440 316 L 440 324 Q 440 332 432 332 L 276 332 Q 268 332 268 340 L 268 352" fill="none" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <path d="M 560 316 L 560 324 Q 560 332 568 332 L 724 332 Q 732 332 732 340 L 732 352" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- ============ Nút gốc: câu hỏi ============ -->
      <rect x="160" y="24" width="680" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="160" y="24" width="680" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="500" y="44" fill="#4f5d75" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">HỎI-1 · AC-2 · AC-4 · AC-6</text>
      <text x="500" y="66" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Bài chỉ-ảnh X gắn vào bài chữ nào của cùng người gửi?</text>

      <!-- ============ Tình huống chung: dòng thời gian (10 px = 1 giây) ============ -->
      <!-- nhãn trên trục -->
      <text x="120" y="156" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Bài chữ A</text>
      <text x="120" y="172" fill="#4f5d75" font-size="12" font-family="'Geist', sans-serif" text-anchor="middle">thuộc offer</text>
      <text x="820" y="156" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Bài chữ B</text>
      <text x="820" y="172" fill="#4f5d75" font-size="12" font-family="'Geist', sans-serif" text-anchor="middle">KHÔNG thuộc offer · tin hỏi / không giá</text>

      <!-- thước khoảng cách -->
      <line x1="124" y1="204" x2="716" y2="204" stroke="#636b80" stroke-width="0.8"/>
      <line x1="124" y1="198" x2="124" y2="210" stroke="#636b80" stroke-width="0.8"/>
      <line x1="716" y1="198" x2="716" y2="210" stroke="#636b80" stroke-width="0.8"/>
      <line x1="724" y1="204" x2="816" y2="204" stroke="#636b80" stroke-width="0.8"/>
      <line x1="724" y1="198" x2="724" y2="210" stroke="#636b80" stroke-width="0.8"/>
      <line x1="816" y1="198" x2="816" y2="210" stroke="#636b80" stroke-width="0.8"/>
      <rect x="392" y="184" width="56" height="12" rx="2" fill="#f5f5f5"/>
      <text x="420" y="193" fill="#636b80" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">60 GIÂY</text>
      <rect x="742" y="184" width="56" height="12" rx="2" fill="#f5f5f5"/>
      <text x="770" y="193" fill="#636b80" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">10 GIÂY</text>

      <!-- trục -->
      <line x1="80" y1="228" x2="876" y2="228" stroke="#bfc0c0" stroke-width="1"/>
      <text x="888" y="232" fill="#636b80" font-size="9" font-family="'Geist Mono', monospace">giây</text>
      <circle cx="120" cy="228" r="5" fill="#2d3142"/>
      <rect x="716" y="224" width="8" height="8" fill="#4f5d75"/>
      <circle cx="820" cy="228" r="5" fill="#2d3142"/>

      <!-- nhãn dưới trục -->
      <text x="120" y="256" fill="#636b80" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">t = 0</text>
      <text x="720" y="256" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Bài chỉ-ảnh X</text>
      <text x="720" y="272" fill="#636b80" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">t = +60 giây</text>
      <text x="820" y="256" fill="#636b80" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">t = +70 giây</text>

      <text x="64" y="300" fill="#4f5d75" font-size="12" font-family="'Geist', sans-serif">Cả A và B đều trong cửa sổ 120 giây — quy tắc phải chọn một.</text>

      <!-- ============ Nhánh A: gần nhất (5 px = 1 giây) ============ -->
      <line x1="72" y1="448" x2="464" y2="448" stroke="#bfc0c0" stroke-width="1"/>
      <path d="M 396 444 L 396 420 Q 396 412 404 412 L 438 412 Q 446 412 446 420 L 446 438" fill="none" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <rect x="392" y="392" width="56" height="12" rx="2" fill="#f5f5f5"/>
      <rect x="392" y="392" width="56" height="12" rx="2" fill="rgba(235,108,54,0.08)"/>
      <text x="420" y="401" fill="#ba4513" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">10 GIÂY</text>
      <circle cx="96" cy="448" r="5" fill="#2d3142"/>
      <rect x="392" y="444" width="8" height="8" fill="#4f5d75"/>
      <circle cx="446" cy="448" r="5" fill="#2d3142"/>
      <text x="96" y="472" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">A</text>
      <text x="396" y="472" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">X</text>
      <text x="446" y="472" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">B</text>
      <text x="96" y="488" fill="#636b80" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">offer</text>
      <text x="446" y="488" fill="#636b80" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">không offer</text>

      <rect x="64" y="508" width="408" height="84" rx="6" fill="#f5f5f5"/>
      <rect x="64" y="508" width="408" height="84" rx="6" fill="#ffffff" stroke="#eb6c36" stroke-width="1"/>
      <text x="268" y="532" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">X gần B hơn → X theo B → không vào offer nào</text>
      <text x="268" y="558" fill="#ba4513" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">47,7% offer có ảnh</text>
      <text x="268" y="580" fill="#4f5d75" font-size="12" font-family="'Geist', sans-serif" text-anchor="middle">ảnh không lạc sang căn khác</text>

      <!-- ============ Nhánh B: chỉ xét tin offer (5 px = 1 giây) ============ -->
      <line x1="536" y1="448" x2="928" y2="448" stroke="#bfc0c0" stroke-width="1"/>
      <path d="M 860 444 L 860 420 Q 860 412 852 412 L 568 412 Q 560 412 560 420 L 560 438" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="682" y="392" width="56" height="12" rx="2" fill="#f5f5f5"/>
      <rect x="682" y="392" width="56" height="12" rx="2" fill="rgba(45,49,66,0.03)"/>
      <text x="710" y="401" fill="#636b80" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">60 GIÂY</text>
      <circle cx="560" cy="448" r="5" fill="#2d3142"/>
      <rect x="856" y="444" width="8" height="8" fill="#4f5d75"/>
      <circle cx="910" cy="448" r="5" fill="#2d3142"/>
      <text x="560" y="472" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">A</text>
      <text x="860" y="472" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">X</text>
      <text x="910" y="472" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">B</text>
      <text x="560" y="488" fill="#636b80" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">offer</text>
      <text x="910" y="488" fill="#636b80" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">không offer</text>

      <rect x="528" y="508" width="408" height="84" rx="6" fill="#f5f5f5"/>
      <rect x="528" y="508" width="408" height="84" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.40)" stroke-width="1"/>
      <text x="732" y="532" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">B bị bỏ qua → X vào offer A</text>
      <text x="732" y="558" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">50,3% offer có ảnh</text>
      <text x="732" y="580" fill="#4f5d75" font-size="12" font-family="'Geist', sans-serif" text-anchor="middle">~218 ảnh / 1.890 có thể gắn sai căn</text>

      <!-- ============ Chú giải ============ -->
      <line x1="48" y1="632" x2="952" y2="632" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <text x="48" y="656" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.18em">CHÚ GIẢI</text>

      <circle cx="56" cy="674" r="5" fill="#2d3142"/>
      <text x="72" y="678" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Bài chữ</text>

      <rect x="180" y="670" width="8" height="8" fill="#4f5d75"/>
      <text x="200" y="678" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Bài chỉ-ảnh</text>

      <rect x="320" y="668" width="24" height="12" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4"/>
      <text x="352" y="678" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Nhánh khuyến nghị</text>

      <rect x="500" y="668" width="24" height="12" rx="2" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="532" y="678" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Nhánh còn lại</text>

      <line x1="652" y1="674" x2="684" y2="674" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <text x="696" y="678" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">X được gắn vào bài chữ này</text>
    </svg>
  </div>
</body>
</html>
