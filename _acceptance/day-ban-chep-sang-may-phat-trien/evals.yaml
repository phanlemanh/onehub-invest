    cmd: config:executors.script.bcm_mot_chieu
    expected: "exit 0: authorized_keys của Mac mini không chứa khoá công khai nào sinh trên M5 (so vân tay với ~/.ssh/*.pub của M5); lệnh đẩy chỉ gọi ssh/scp với đích là M5"
    paths: [scripts/day-ban-chep.mjs, scripts/day-ban-chep-kiem-m5.mjs]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
