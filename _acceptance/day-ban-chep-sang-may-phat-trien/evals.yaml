    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E11
    criterion: AC-11
    executor: script
    cmd: config:executors.script.bcm_tai_lieu
    expected: "exit 0: ADR-0019 tồn tại và nêu năm rào + lối đã bỏ; AGENTS.md có mục «Hai máy» trỏ docs/ops/hai-may.md; runtime-map trỏ hai-may.md; ROADMAP §3 mục 64 nêu lệnh đẩy; git grep toàn kho không có tên máy M5, địa chỉ 169.254 của hai máy, đường khoá id_ed25519_m5 (đọc giá trị so từ cấu hình riêng máy, không viết cứng vào ca). Chiều đỏ: cấy tên máy vào một tệp tạm đã git add → ca nêu tệp"
    paths: [docs/adr/0019*, AGENTS.md, docs/ops/hai-may.md, docs/ops/runtime-map.md, docs/ROADMAP.md]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
