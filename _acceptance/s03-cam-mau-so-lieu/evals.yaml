    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E5b
    criterion: AC-5
    executor: script
    layer: backend-effect
    cmd: config:executors.script.cam_mau_s03_that
    paths: [pipeline/transform-zalo.mjs, pipeline/scripts/cam-mau-s03.itest.mjs]
    expected: "exit 0; ca 'CM-AC-5 DB' xanh trên DB thử oneinvest_p1_n1 trong BEGIN…ROLLBACK: bốn bài mồi (thuê 1 tỷ, bán 120 tỷ, thuê 9 triệu, bán 3 tỷ) → đúng hai offer mới; kết quả runTransformZalo đếm loại theo lý do ≥ 1 mỗi lý do"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E6
    criterion: AC-6
