schema_version: 1
feature_slug: s03-cam-mau-so-lieu
# Ca test mang tiền tố «CM-AC-n»: thuần ở pipeline/scripts/cam-mau-s03.test.mjs; DB thử oneinvest_p1_n1 (BEGIN…ROLLBACK) ở
# pipeline/scripts/cam-mau-s03.itest.mjs; phép đo dữ liệu thật ở pipeline/scripts/do-cam-mau-s03.mjs.
# Mỗi phép đo có cặp đỏ: bản sao đột biến của transform-zalo.mjs (thư mục tạm) làm ca đỏ với thông điệp ghim mã ca.
evals:
  - id: E1
    criterion: AC-1
    executor: test
    cmd: config:executors.test.cam_mau_s03
    paths: [pipeline/transform-zalo.mjs, pipeline/scripts/cam-mau-s03.test.mjs]
    expected: "exit 0; ca 'CM-AC-1' xanh: ma trận viết trước (URL ảnh mang dãy số hoặc «6tY», SĐT dạng thường/chấm/cách) — số assert bằng số dòng, giá/DT/PN đúng đáp án, phones đúng SĐT chữ gốc; ca đỏ 'CM-AC-1 đột biến' trên bản sao bỏ bước gạt URL ra thông điệp ghim dòng sai"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E2
    criterion: AC-2
    executor: test
    cmd: config:executors.test.cam_mau_s03
    paths: [pipeline/transform-zalo.mjs, pipeline/scripts/cam-mau-s03.test.mjs]
    expected: "exit 0; ca 'CM-AC-2' xanh: 12 dòng giá tỷ viết trước và 6 dòng số đếm sau chữ tỷ (tầng, lầu, ô tô, mặt tiền, căn), mỗi dòng đúng số đồng; ca đỏ trên bản sao bỏ danh sách chặn số đếm ghim «8 tỷ 4 tầng»; ca đỏ trên bản sao giữ parseVnNumber cũ cho «2.650 tỷ» ghim «2.650 tỷ»"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E3
    criterion: AC-3
    executor: test
    cmd: config:executors.test.cam_mau_s03
    paths: [pipeline/transform-zalo.mjs, pipeline/scripts/cam-mau-s03.test.mjs]
    expected: "exit 0; ca 'CM-AC-3' xanh: 9 dòng giá triệu/không đơn vị và 3 dòng đơn giá viết bằng đồng («…/m2» ra pricePerm2Vnd, priceVnd null) viết trước đúng đáp án; ca đỏ trên bản sao bỏ chặn «/m» của luật giá đồng ghim «45.000.000/m2»; ca đỏ trên bản sao bỏ luật «tr chen phần lẻ» ghim «5tr5»"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E4
    criterion: AC-4
    executor: test
    cmd: config:executors.test.cam_mau_s03
    paths: [pipeline/transform-zalo.mjs, pipeline/scripts/cam-mau-s03.test.mjs]
    expected: "exit 0; ca 'CM-AC-4' xanh: 5 dòng diện tích ra đúng số, 4 dòng bề ngang ra null, biên «15m» → 15 còn «14m», «501m» → null (should-NOT-fire); ca đỏ trên bản sao bỏ danh sách chặn bề ngang ghim «mặt tiền 20m» (bề ngang từ 15 m — dưới 15 m khoảng 15–500 đã tự loại)"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
