    cmd: config:executors.test.cam_mau_s03
    paths: [pipeline/transform-zalo.mjs, pipeline/scripts/cam-mau-s03.test.mjs]
    expected: "exit 0; ca 'CM-AC-6' xanh: bảng bốn ô viết trước (khác mã → hai khoá; cùng mã → một khoá; không mã → khoá theo khuôn cũ có «|?|» và người đăng; đủ phường + DT → khoá bằng 'sale|<phường>|<giá>|<DT>|<PN>'); ca đỏ trên bản sao bỏ mã khỏi khoá ghim «khác mã»"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E7
    criterion: AC-7
    executor: script
    layer: backend-effect
    cmd: config:executors.script.cam_mau_s03_that
    paths: [pipeline/transform-zalo.mjs, pipeline/scripts/cam-mau-s03.itest.mjs]
    expected: "exit 0; ca 'CM-AC-7' xanh trên DB thử: nhóm ba bài (cũ có tên «A», mới nhất có tên « B », một bài tên rỗng mới hơn) → sale_offer_records.seller_name = 'B'; nhóm không tên → null; ca đỏ với transform đột biến lấy bài sớm nhất ghim «seller_name»"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E8
    criterion: AC-8
    executor: script
    layer: backend-effect
    cmd: config:executors.script.cam_mau_s03_that
    paths: [pipeline/transform-zalo.mjs, pipeline/lib/osm.mjs, pipeline/scripts/cam-mau-s03.itest.mjs]
    expected: "exit 0; ca 'CM-AC-8' xanh trên DB thử: ba nhóm mồi chèn vào collection_units qua trigger kiểm tham chiếu của 048 (market_codes {vn-hcmc}, {vn-hanoi}, {}), nối bằng conversation_id = group_key; bảng năm ô viết trước: tên phường HCM ở nhóm HCM → 'vn-hcmc-…'; tên phường HN ở nhóm HN → 'vn-hanoi-…'; tên phường HCM ở nhóm HN → null; nhóm chưa khai, tên chỉ thuộc HCM → 'vn-hcmc-…'; nhóm chưa khai, tên trùng HN–HCM → null; ca đỏ với transform đột biến chỉ nạp vn-hanoi ghim «vn-hcmc»"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E9
    criterion: AC-9
    executor: script
    layer: backend-effect
    cmd: config:executors.script.cam_mau_s03_that
    paths: [pipeline/transform-zalo.mjs, pipeline/lib/**, pipeline/scripts/do-cam-mau-s03.mjs]
    expected: "exit 0; do-cam-mau-s03 chạy hai lượt trên bản chép dữ liệu thật (DB thử, mỗi lượt BEGIN…ROLLBACK). Lượt một, transform của cây: bảy dòng thước đều 'ĐẠT' — thue_tu_1_ty=0, ban_tren_100_ty=0, gia_tu_url=0 (offer mang giá X mà đọc chữ gốc ra X còn đọc chữ đã gạt URL không ra X), gom_qua_10_nhieu_nguoi=0 (offer quá 10 nội dung khác nhau — đếm chữ đã gạt URL, SĐT — mà bài của hơn một người đăng; Hỏi-3), seller_name_pct>=95, noi_nhom_pct>=95, hcm_sai_thi_truong=0; dòng max_noi_dung_moi_offer chỉ in số, không chặn. Lượt đối chứng, transform-zalo.mjs của commit nền ghim c333a342 (chép tạm cạnh tệp thật rồi xoá): mỗi thước phụ thuộc transform phải ra dòng 'TRƯỢT' ghim tên, tái lập mốc gốc tính theo tin (thue_tu_1_ty>=1, ban_tren_100_ty>=1, gia_tu_url>=1, seller_name_pct=0, hcm_sai_thi_truong>0); gom_qua_10_nhieu_nguoi đối chứng bằng bản sao transform của cây bỏ người đăng khỏi khoá gom ra >0; noi_nhom_pct đối chứng bằng phép nối sai khoá (group_name thay conversation_id) ra 'TRƯỢT'. Một thước không tái lập được mốc gốc → exit 1 gọi tên thước"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E10
