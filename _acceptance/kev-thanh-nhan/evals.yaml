schema_version: 1
feature_slug: kev-thanh-nhan
evals:
  - id: E1
    criterion: AC-1
    executor: script
    cmd: config:executors.script.kev_handler_label
    expected: "exit 0; stdout có 'HANDLER-LABEL PASS'; 4 tin có chữ zalouser đều POST (kể cả p=0.2); log không có 'skip p='; should-NOT-fire: tin rỗng không ảnh vẫn bỏ, kênh khác không đẩy"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E2
    criterion: AC-2
    executor: script
    cmd: config:executors.script.kev_handler_label
    expected: "exit 0; Kev 500 / thiếu noul → p null; Kev không nghe → 1 POST với p null + log gate-down"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E3
    criterion: AC-3
    executor: script
    cmd: config:executors.script.kev_handler_label
    expected: "exit 0; mọi POST có kev {p, model kev-latest, threshold 0.9, at ISO}; POST đúng /agent-report với khoá trong HOME giả; should-NOT-fire: tin dưới ngưỡng (p=0.2) KHÔNG bị bỏ, làm tròn hay thay điểm — kev.p giữ đúng 0.2 cạnh threshold 0.9"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E4
    criterion: AC-4
    executor: script
    cmd: config:executors.script.kev_manifest_v3
    expected: "exit 0; stdout có 'MANIFEST-V3 PASS'; meta.kev nguyên vẹn; should-NOT-fire: tin không kev không có meta.kev"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E5
    criterion: AC-4
    executor: test
    cmd: config:executors.script.collector_test_clean
    expected: "exit 0; 0 fail, 0 skip; có ca kev-nhãn (p thấp, p null, manifest v3) và ZC1"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E6
    criterion: AC-5
    executor: script
    cmd: config:executors.script.kev_contract_doc
    expected: "exit 0; stdout 'CONTRACT-DOC OK' (manifest-v3 ở E4 chứng phần schemaVersion 3 của snapshot)"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E7
    criterion: AC-6
    executor: script
    cmd: config:executors.script.kev_import_versions
    expected: "exit 0; stdout có 'IMPORT-VERSIONS PASS'; v1, v2, v3 qua kiểm phiên bản + sha256 (dừng ở bước nối DB cổng chết, không ghi gì); should-NOT-fire: v4 bị từ chối"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E8
    criterion: AC-7
    executor: script
    cmd: config:executors.script.kev_watchdog_l1
    expected: "exit 0; stdout có 'WATCHDOG-L1 PASS'; handler.js thật không khớp mẫu L1; ba bản cấy đều khớp"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
