schema_version: 1
feature_slug: don-vi-gia-theo-loai-tin
# Biểu mẫu thật dựng trong jsdom (dungDom của labels-nhom.test.tsx), fetch giả ghi lại thân gửi. Mỗi ca có bản đột biến đỏ.
evals:
  - id: E1
    criterion: AC-1
    executor: test
    cmd: config:executors.test.dvg_app
    layer: ui-structure
    paths: [app/src/components/ops/labels/label-form-nhom.tsx, app/src/components/ops/labels/gia-la.ts, app/tests/labels-nhom.test.tsx]
    expected: "exit 0 và đúng ba ca DVG chạy ('pass 3'); ca 'DVG-AC-1': lượt A đơn vị sau mỗi bước [tỷ, triệu, triệu, tỷ, triệu, triệu, triệu] (khởi đầu, Cho thuê, bỏ chọn, Bán, bấm tay triệu, Bán lại, Cho thuê); lượt B bấm lại «tỷ» đang sáng rồi Cho thuê → [tỷ, tỷ] — bảng viết trước. Chiều đỏ: bản không theo Loại tin ('DON VI KHONG THEO LOAI TIN'); bản để Loại tin ghi đè lựa chọn tay ('LOAI TIN DE LUA CHON TAY'); bản không tính bấm lại nút sáng là tay ('BAM LAI NUT SANG KHONG TINH LA TAY')."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E2
    criterion: AC-2
    executor: test
    cmd: config:executors.test.dvg_app
    layer: ui-structure
    paths: [app/src/components/ops/labels/label-form-nhom.tsx, app/src/components/ops/labels/gia-la.ts, app/tests/labels-nhom.test.tsx]
    expected: "exit 0; ca 'DVG-AC-2': bảng biên viết trước của cauGiaLa (thuê 999/1000 triệu, 0,999/1 tỷ; thuê thấp 15 cao 15000 triệu; bán 99/100 triệu, 5 tỷ, 0, cao 50 triệu; chưa chọn loại; '11.000' ngăn nghìn không hỏi), câu hỏi nêu '11000 tỷ một tháng', '50 triệu'; năm đột biến ngưỡng, so sánh, chỉ xét giá thấp, tên đơn vị đều đỏ. Trên biểu mẫu thật, sau mỗi bước [hộp mở, chữ hộp, số lần gửi] khớp bảng 11 bước (hỏi, Sửa lại, hỏi lại, Vẫn lưu gửi {11000, ty}, đã xác nhận không hỏi, đổi 12000 hỏi lại, tick không suy ra được gửi not_stated không hỏi, thuê 15 triệu, bán 5 tỷ không hỏi, bán 50 triệu hỏi). Chiều đỏ: 'GIA LA KHONG HOI LAI', 'HOI LAI SAU KHI DA XAC NHAN', 'KHOA XAC NHAN THO', 'HOI GIA DA TICK KHONG SUY RA'."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E3
    criterion: AC-3
    executor: test
    cmd: config:executors.test.dvg_app
    layer: ui-structure
    paths: [app/src/components/ops/labels/ma-the.tsx, app/src/components/ops/labels/labels-view.tsx, app/src/components/ops/labels/label-form-nhom.tsx, app/src/components/ops/labels/luot-hai.tsx, app/tests/labels-nhom.test.tsx]
    expected: "exit 0; ca 'DVG-AC-3': ở LabelsView lát chín trường, LabelFormNhom và LuotHai, nút data-labels-ma-the «#4321» là con đầu của khối mô tả có lớp text-xs, đứng ngay trước « · S03 · »; ba bản đột biến bỏ mã đều đỏ ('THIEU MA THE DAU DONG'). Bấm mã: chép được thì writeText một lần với «4321», nhãn đổi «Đã chép mã thẻ 4321» ('CHEP SAI MA THE'); bảng tạm từ chối hay không có thì báo «Không chép được mã thẻ», nhãn giữ nguyên ('BANG TAM BI CHAN KHONG BAO')."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E4
    criterion: AC-4
    executor: test
    cmd: config:executors.test.gcn_app
    layer: ui-structure
    paths: [app/src/components/ops/labels/**, app/tests/labels-nhom.test.tsx]
    expected: "exit 0; test của lát theo nhóm còn xanh, gồm TND-AC-6 lỗi theo ô và THN-AC-1."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E5
    criterion: AC-4
    executor: test
    cmd: config:executors.test.ops_nhan
    layer: ui-structure
    paths: [app/src/components/ops/labels/**, app/tests/ops-nhan/visible-strings.ts]
    expected: "exit 0; thước nhãn Ops còn xanh: tệp mới kê vào danh sách quét, 0 từ _Avoid_, 0 từ tiếng Anh ngoài danh sách giữ."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E6
    criterion: AC-4
    executor: script
    cmd: config:executors.script.dvg_pham_vi
    layer: backend-effect
    paths: [_acceptance/don-vi-gia-theo-loai-tin/probes/pham-vi.sh]
    expected: "exit 0; mỗi tệp đổi in 'ok <tệp>', không 'NGOAI PHAM VI'; 'ok luat kiem khong doi'; 'ok doi chung: tep ngoai danh sach bi bat'; cuối 'PHAM-VI OK'."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
