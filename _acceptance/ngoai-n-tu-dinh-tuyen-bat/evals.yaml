schema_version: 1
feature_slug: ngoai-n-tu-dinh-tuyen-bat
# Một executor: nntd_do — _acceptance/ngoai-n-tu-dinh-tuyen-bat/do-mo-phong.mjs. Dựng lại chín hồ sơ đã ký từ git (mốc
# d2b4beaf) về trạng thái trước Cổng 2, chạy dinh-tuyen-may.cjs của kit với config THẬT của cây, in mỗi ca một dòng
# «NNTD-<mã>: ĐẠT|ĐỎ». Đối chứng hai chiều cùng fixture: config không khoá → NNTD-KHOA/T2/T3/DOI/LANV đỏ (đo 15/11 trên
# d2b4beaf: 13 ca ĐỎ), có khoá → mọi ca ĐẠT; NNTD-TAT chạy bản bỏ khoá ngay trong lượt.
evals:
  - id: E1
    criterion: AC-1
    executor: script
    cmd: config:executors.script.nntd_do
    paths: [_acceptance/config.yaml, lib/evidence-core.cjs]
    expected: "exit 0; dòng 'NNTD-KHOA: ĐẠT — feature_loop.ngoai_n_tu_dinh_tuyen = \"true\"'; chiều đỏ: config không khoá → 'NNTD-KHOA: ĐỎ — … = null (đòi true)' và exit 1"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E2
    criterion: AC-2
    executor: script
    cmd: config:executors.script.nntd_do
    paths: [lib/out-of-contract.cjs, lib/evidence-core.cjs, scripts/khong-can-nguoi.mjs, scripts/pre-merge-check.sh]
    expected: "exit 0; dòng 'NNTD-BAN: ĐẠT — kit …/acceptance-gate/2.37.0' và 'NNTD-CHEP: ĐẠT — bản chép của kho so kit 2.37.0: khớp byte cả 4 tệp'; chiều đỏ bản: kit khác 2.37.0 → 'NNTD-BAN: ĐỎ — sai bản kit', exit 1; chiều đỏ: một tệp lệch → 'NNTD-CHEP: ĐỎ — … LỆCH <tệp>'"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E3
    criterion: AC-3
    executor: script
    cmd: config:executors.script.nntd_do
    paths: [_acceptance/config.yaml, _acceptance/ngoai-n-tu-dinh-tuyen-bat/do-mo-phong.mjs]
    expected: "exit 0; sáu dòng 'NNTD-T2: ĐẠT' với máy xếp 4/7, 1/1, 7/9, 3/3, 11/12, 2/6 và 'khuôn dòng máy đúng'; dòng 'NNTD-T2: ĐẠT — tổng T2: máy xếp 28/38 (đòi 28/38) — Mạnh còn 10 (đòi 10)'; dòng 'chia theo loại: ghi Known limits 23 (đòi 23) · chấp nhận, không sửa 5 (đòi 5)'; dòng '10 mục còn về Mạnh, đề xuất của máy: cả 10 là new-contract'; dòng lệnh đảo nap-s09 nguyên văn '/acceptance-gate:signoff nap-s09 Ngoài-1: mở hợp đồng mới; Ký'; chiều đỏ: config không khoá → 'máy xếp 0/…' từng hồ sơ, tổng 0/38, exit 1"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E4
    criterion: AC-4
    executor: script
    cmd: config:executors.script.nntd_do
    paths: [_acceptance/config.yaml, _acceptance/ngoai-n-tu-dinh-tuyen-bat/do-mo-phong.mjs]
    expected: "exit 0; ba dòng 'NNTD-T3: ĐẠT — <slug>: «không định tuyến: hạng T3 (chỉ T2)», sổ không đổi' cho khoa-gop-can-khong-gia, phuong-tu-du-an, ma-du-an-s06-thanh-nut; chiều đỏ: config không khoá → 'NNTD-T3: ĐỎ' vì in «tắt» thay cho «hạng T3»"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E5
    criterion: AC-5
    executor: script
    cmd: config:executors.script.nntd_do
    paths: [_acceptance/config.yaml, _acceptance/ngoai-n-tu-dinh-tuyen-bat/do-mo-phong.mjs]
    expected: "exit 0; dòng 'NNTD-DOI: ĐẠT — khớp 24 (đòi 24) · đổi qua lại KL↔chấp nhận 3 (đòi 3) · đảo thật 1: nap-s09 Ngoài-1'; chiều đỏ: config không khoá → 'khớp 0 (đòi 24)', exit 1"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E6
    criterion: AC-6
    executor: script
    cmd: config:executors.script.nntd_do
    paths: [_acceptance/config.yaml, scripts/khong-can-nguoi.mjs, _acceptance/ngoai-n-tu-dinh-tuyen-bat/do-mo-phong.mjs]
    expected: "exit 0; dòng 'NNTD-LANV: ĐẠT — hồ sơ đủ xanh-sạch sau khi máy xếp: nap-s09, sua-xa-bo-nut-ung-vien'; chiều đỏ: config không khoá → 'hồ sơ đủ xanh-sạch sau khi máy xếp: không', exit 1"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E7
    criterion: AC-7
    executor: script
    cmd: config:executors.script.nntd_do
    paths: [_acceptance/ngoai-n-tu-dinh-tuyen-bat/do-mo-phong.mjs]
    expected: "exit 0; dòng 'NNTD-TAT: ĐẠT — config bỏ khoá: 9/9 hồ sơ «tắt», 0 dòng máy (đòi 9/9, 0)'"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E8
    criterion: AC-8
    executor: script
    cmd: config:executors.script.product_map
    paths: [PRODUCT-MAP.md, LO-TRINH.html, _acceptance/**]
    expected: "exit 0; hai dòng 'PRODUCT-MAP.md khớp hồ sơ xưởng.' và 'LO-TRINH.html khớp tệp ý định và hồ sơ.'"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E9
    criterion: AC-8
    executor: script
    cmd: config:executors.script.nntd_luoi
    paths: [_acceptance/**]
    expected: "exit 0; lưới trước-merge không còn dòng VIOLATION nào ngoài các dòng chờ của chính ngoai-n-tu-dinh-tuyen-bat (chưa ký)"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
