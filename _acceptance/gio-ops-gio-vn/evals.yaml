    executor: test
    cmd: config:executors.test.app_ui
    paths: [app/src/lib/collections-queries.ts, app/src/lib/format.ts, app/tests/gio-ops-gio-vn.test.tsx]
    expected: "exit 0; ca 'GV-AC-4 getFlowDays gom ngày theo giờ VN trên lược đồ tạm' — kết quả deepEqual bản đồ 7 khoá × 6 cột viết trước (kể cả ô 0), search_path chỉ lược đồ tạm; chiều đỏ 'GV-AC-4 thiếu bảng tạm thì đỏ nêu tên bảng' ok; DB local :5433 không tới được → ca đỏ có tên (không bỏ qua lặng)"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
