schema_version: 1
feature_slug: gio-ops-gio-vn
# Eval máy đọc ca mang tiền tố «GV-AC-n» trong TAP: app/tests/gio-ops-gio-vn.test.tsx (AC-1…AC-5, AC-7…AC-9) và
# pipeline/scripts/vn-day.test.mjs (AC-6).
evals:
  - id: E1
    criterion: AC-1
    executor: test
    cmd: config:executors.test.app_ui
    paths: [app/src/lib/format.ts, app/tests/gio-ops-gio-vn.test.tsx]
    expected: "exit 0; ca 'GV-AC-1 fmtVnDateTime/fmtVnDate ma trận viết trước dưới TZ=UTC và TZ=America/New_York' — 11 đầu vào × 2 hàm × 2 múi máy = 44 assert giá trị viết trước (chuỗi +07:00 đọc đúng; chuỗi không ghi múi, null, rác → «—») ok"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E2
    criterion: AC-2
    executor: test
    cmd: config:executors.test.app_ui
    paths: [app/src/lib/format.ts, app/src/components/ops/**/*.tsx, app/src/app/ops/**/*.tsx, app/tests/gio-ops-gio-vn.test.tsx]
    expected: "exit 0; ca 'GV-AC-2 <tên chỗ> render mốc theo giờ VN' cho đủ 11 chỗ của danh sách viết trước, mỗi chỗ 2 assert (có chuỗi VN mong đợi, không có 12:13 hay 2026-10-23T) ok; số ca bằng đúng danh sách"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E3
    criterion: AC-3
    executor: test
    cmd: config:executors.test.app_ui
    paths: [app/src/components/ops/**/*.tsx, app/src/app/ops/**/*.tsx, app/src/lib/ops-queries.ts, app/src/lib/collections-queries.ts, app/src/lib/freshness.ts, app/src/lib/deals.ts, app/tests/gio-ops-gio-vn.test.tsx]
    expected: "exit 0; ca 'GV-AC-3 không còn mốc cắt chuỗi hay ngày theo múi máy ngoài danh sách miễn' (quét src/components/ops, src/app/ops, 4 tệp src/lib; danh sách miễn viết trước kèm lý do) và ba chiều đỏ 'GV-AC-3 bản sao jobs-grid cắt lại lastLogAt', 'GV-AC-3 bản sao thêm toLocaleString không múi', 'GV-AC-3 bản sao collections-queries dùng ::date' — mỗi bản thước báo đúng tệp ok"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E4
