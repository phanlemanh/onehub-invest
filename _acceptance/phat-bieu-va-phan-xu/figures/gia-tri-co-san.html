<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Giá trị có sẵn</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Lora:ital,wght@0,400;1,400&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Lora', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1144px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.25;
      color: var(--color-ink);
      margin-bottom: 0.5rem;
    }
    .sub {
      font-size: 0.875rem;
      color: var(--color-muted);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 960px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Cổng Phạm vi · phat-bieu-va-phan-xu · Hỏi-2 · khó đảo</p>
    <h1>Giá trị có sẵn không có phát biểu đỡ: giữ ở lớp quan sát hay hạ xuống suy luận</h1>
    <p class="sub">Hai nhánh của lượt cắt chuyển · nhánh (a) là khuyến nghị · AC-8</p>

    <svg viewBox="0 64 1064 448" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
      </defs>

      <rect x="0" y="64" width="1064" height="448" fill="#f5f5f5"/>

      <!-- ===================== NHÃN NHÁNH ===================== -->
      <text x="344" y="88" fill="#ba4513" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.18em">(A) KHUYẾN NGHỊ · GIỮ Ở LỚP QUAN SÁT</text>
      <text x="344" y="288" fill="#4f5d75" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.18em">(B) HẠ XUỐNG LỚP SUY LUẬN</text>
      <line x1="344" y1="248" x2="1024" y2="248" stroke="rgba(45,49,66,0.14)" stroke-width="1" stroke-dasharray="3,3"/>

      <!-- ===================== ARROWS (trước hộp) ===================== -->
      <!-- đầu vào → (a) -->
      <path d="M280 220 H312 Q320 220 320 212 V156 Q320 148 328 148 H342" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <!-- đầu vào → (b) -->
      <path d="M280 276 H312 Q320 276 320 284 V340 Q320 348 328 348 H342" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- (a) chuỗi -->
      <line x1="544" y1="148" x2="582" y2="148" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="784" y1="148" x2="822" y2="148" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- (b) chuỗi -->
      <line x1="544" y1="348" x2="582" y2="348" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="784" y1="348" x2="822" y2="348" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- ===================== ĐẦU VÀO ===================== -->
      <rect x="40" y="192" width="240" height="112" rx="6" fill="#f5f5f5"/>
      <rect x="40" y="192" width="240" height="112" rx="6" fill="rgba(79,93,117,0.10)" stroke="#636b80" stroke-width="1"/>
      <rect x="48" y="198" width="36" height="16" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="66" y="209" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">AC-8</text>
      <text x="160" y="236" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">~13,9 nghìn ô hôm nay</text>
      <text x="160" y="252" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">không có phát biểu đỡ</text>
      <text x="160" y="272" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">đường 8,2k · WC 4,7k · toà 0,5k của S06</text>
      <text x="160" y="286" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">+ lẻ S03 / S05</text>

      <!-- ===================== NHÁNH (A) ===================== -->
      <!-- a1 (focal) -->
      <rect x="344" y="104" width="200" height="88" rx="6" fill="#f5f5f5"/>
      <rect x="344" y="104" width="200" height="88" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4"/>
      <text x="444" y="140" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Ghi thành phát biểu «cũ»</text>
      <text x="444" y="158" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">lớp quan sát</text>
      <text x="444" y="172" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">thứ tự thấp nhất trong lớp</text>

      <!-- a2 -->
      <rect x="584" y="104" width="200" height="88" rx="6" fill="#f5f5f5"/>
      <rect x="584" y="104" width="200" height="88" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="684" y="140" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Cột y nguyên</text>
      <text x="684" y="158" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">nguồn gốc gọi đúng tên:</text>
      <text x="684" y="172" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">«có trước, không căn cứ»</text>

      <!-- a3 -->
      <rect x="824" y="104" width="200" height="88" rx="6" fill="#f5f5f5"/>
      <rect x="824" y="104" width="200" height="88" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="924" y="140" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">PL16 / PL17 thay dần</text>
      <text x="924" y="158" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">phát biểu đúng thắng «cũ»</text>
      <text x="924" y="172" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">không cần ai rút</text>

      <!-- ===================== NHÁNH (B) ===================== -->
      <!-- b1 -->
      <rect x="344" y="304" width="200" height="88" rx="6" fill="#f5f5f5"/>
      <rect x="344" y="304" width="200" height="88" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="444" y="340" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Ghi ở lớp suy luận</text>
      <text x="444" y="358" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">đúng chữ «gỡ giá trị</text>
      <text x="444" y="372" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">không có phát biểu đỡ»</text>

      <!-- b2 -->
      <rect x="584" y="304" width="200" height="88" rx="6" fill="#f5f5f5"/>
      <rect x="584" y="304" width="200" height="88" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="684" y="340" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Cột về trống</text>
      <text x="684" y="358" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">giá trị chỉ còn</text>
      <text x="684" y="372" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">trong bảng phát biểu</text>

      <!-- b3 (rủi ro) -->
      <rect x="824" y="304" width="200" height="88" rx="6" fill="#f5f5f5"/>
      <rect x="824" y="304" width="200" height="88" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4" stroke-dasharray="5,4"/>
      <text x="924" y="340" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Lượt sync kế</text>
      <text x="924" y="358" fill="#ba4513" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">cổng Invest mất ngay</text>
      <text x="924" y="372" fill="#ba4513" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">~8,2k tên đường · ~4,7k số WC</text>

      <!-- ghi chú -->
      <text x="40" y="428" fill="#636b80" font-size="9" font-family="'Geist Mono', monospace">khó đảo: chọn một lần ở lượt cắt chuyển · chạy thử trong giao dịch rồi hoàn tác, đếm ô trước/sau theo nguồn × trường</text>

      <!-- ===================== LEGEND ===================== -->
      <line x1="40" y1="452" x2="1024" y2="452" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="472" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.18em">CHÚ GIẢI</text>

      <rect x="40" y="484" width="16" height="12" rx="2" fill="rgba(79,93,117,0.10)" stroke="#636b80" stroke-width="1"/>
      <text x="64" y="494" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Hiện trạng</text>

      <rect x="144" y="484" width="16" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="168" y="494" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Hệ quả</text>

      <rect x="232" y="484" width="16" height="12" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4"/>
      <text x="256" y="494" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Lựa chọn khuyến nghị</text>

      <rect x="384" y="484" width="16" height="12" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4" stroke-dasharray="3,2"/>
      <text x="408" y="494" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Mất dữ liệu trên cổng</text>

      <rect x="544" y="482" width="36" height="16" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="562" y="493" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">AC-n</text>
      <text x="588" y="494" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Tiêu chí liên quan</text>
    </svg>
  </div>
</body>
</html>
