schema_version: 1
feature_slug: phat-bieu-va-phan-xu
# Ca «PB-AC-n» ở pipeline/scripts/phat-bieu.test.mjs (không DB), «PD-AC-n» ở pipeline/scripts/phat-bieu-db.itest.mjs
# (DB local :5433, mỗi ca BEGIN … ROLLBACK, nạp 045 trong giao dịch khi DB chưa áp, giữ pg_advisory_xact_lock(33033)).
# Fixture tin dựng bằng chính transform thật (parsePost / writeOffers / runTransformChotot) trên dòng stg giả và bằng
# hàm ghi phát biểu thật (pipeline/lib/assert.mjs) — không viết tay khuôn field_provenance. Đường tính từ vị trí tệp.
# LUẬT ĐO (giám sát đợt dot0-cam-mau, 27/10, sau sự cố khoá DB dùng chung khi đo PL15): test và phép đo nạp migration CHƯA
# merge (045, resolve_offer_fields, cắt chuyển) KHÔNG chạy trên DB `oneinvest` :5433 dùng chung. Chúng chạy trên DB thử
# riêng cùng server `oneinvest_p2_pl15` — dựng bằng `bash db/db-thu.sh oneinvest_p2_pl15` (pg_dump từ oneinvest, chỉ khoá
# đọc), worktree đặt DATABASE_URL trỏ vào nó (.claude/settings.local.json `env`, cả lượt chấm), xoá sau khi xong
# (`--xoa`). E1 kiểm idempotent trên DB tạm riêng (`db/check-idempotent-tam.sh`). Cắt chuyển thật trên DB local chỉ SAU
# merge, ngoài giờ job đêm, báo giám sát trước (runtime-map «Phát biểu + phân xử»).
