schema_version: 1
feature_slug: giu-captured-at
evals:
  - id: E1
    criterion: AC-1
    executor: script
    cmd: config:executors.script.capt_zalo
    expected: "exit 0; stdout có 'ZALO PASS'; INSERT mới captured_at = giờ thu snapshot; 0 dòng mang giờ nạp trong 1 giờ qua; DB tạm (không phải oneinvest)"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E2
    criterion: AC-2
    executor: script
    cmd: config:executors.script.capt_zalo
    expected: "exit 0; should-NOT-fire: nạp lại cùng snapshot 0 dòng đổi; snapshot cũ hơn → mốc sớm nhất; should-NOT-fire: nạp lại mới hơn không đẩy mốc lên"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E3
    criterion: AC-3
    executor: script
    cmd: config:executors.script.capt_chotot
    expected: "exit 0; stdout có 'CHOTOT PASS'; snapshot mới: snapshot_id + captured_at cùng tiến; should-NOT-fire: nạp lại cũ không lùi; 0 dòng lệch bất biến"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E4
    criterion: AC-4
    executor: script
    cmd: config:executors.script.capt_restore
    expected: "exit 0; stdout có 'RESTORE PASS'; should-NOT-fire: --dry không đổi gì; --apply có CSV sao lưu; --undo trả đúng; --apply lại ra cùng kết quả"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E5
    criterion: AC-5
    executor: test
    cmd: config:executors.test.pipeline
    expected: "toàn bộ test pipeline: không test nào đỏ do bản sửa; test nào đỏ thì phải đỏ y hệt trên origin/main (ghi tên test và bằng chứng đối chiếu)"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
