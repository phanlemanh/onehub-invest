    paths: ["app/src/lib/labels-normalize.ts", "app/tests/labels-lat-hai-khu-truc.test.tsx"]
    expected: >
      Ca HT21-AC-1 xanh: oCuaLat("hai-khu-truc") = [building, stack], nhãn Trục đúng, hai-khu-ghep-b không đổi. Ca HT21-AC-3 chứng
      chiều đỏ trên cùng tệp: bản bỏ dòng khai trả null và phép so đỏ với thông điệp gọi tên lát.
  - id: E2
    criterion: AC-2
    executor: test
    layer: ui-observed
    cmd: bash _acceptance/lat-hai-khu-truc-khai-o/probes/test.sh
    paths: ["app/src/lib/labels-normalize.ts", "app/tests/labels-lat-hai-khu-truc.test.tsx"]
    expected: >
      Ca HT21-AC-2 dựng biểu mẫu thật (LabelFormNhom) cho lát: data-o đúng [building, stack], nhãn Trục, có «Không suy ra được»,
      0 ô căn cứ, không ô Lý do, 0/2; đối chứng lát s03-theo-nhom vẫn đủ ô.
  - id: E3
    criterion: AC-3
