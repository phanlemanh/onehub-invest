schema_version: 1
slug: lat-hai-khu-truc-khai-o

evals:
  - id: E1
    criterion: AC-1
    executor: test
    cmd: bash _acceptance/lat-hai-khu-truc-khai-o/probes/test.sh
    paths: ["app/src/lib/labels-normalize.ts", "app/tests/labels-lat-hai-khu-truc.test.tsx"]
    expected: >
      Ca HT21-AC-1 xanh: oCuaLat("hai-khu-truc") = [building, stack], nhãn Trục đúng, hai-khu-ghep-b không đổi. Ca HT21-AC-3 chứng
      chiều đỏ trên cùng tệp: bản bỏ dòng khai trả null và phép so đỏ với thông điệp gọi tên lát.
  - id: E2
    criterion: AC-2
    executor: test
    layer: ui-observed
    cmd: bash _acceptance/lat-hai-khu-truc-khai-o/probes/test.sh
    paths: ["app/src/lib/labels-normalize.ts", "app/tests/labels-lat-hai-khu-truc.test.tsx"]
    expected: >
      Ca HT21-AC-2 dựng biểu mẫu thật (LabelFormNhom) cho lát: data-o đúng [building, stack], nhãn Trục, có «Không suy ra được»,
      0 ô căn cứ, không ô Lý do, 0/2; đối chứng lát s03-theo-nhom vẫn đủ ô.
  - id: E3
    criterion: AC-3
    executor: script
    cmd: bash _acceptance/lat-hai-khu-truc-khai-o/probes/chi-them-mot-dong.sh
    paths: ["app/src/lib/labels-normalize.ts"]
    expected: >
      Diff của labels-normalize.ts so với nhánh chính chỉ THÊM dòng của hai-khu-truc (và tách bảng thành nhiều dòng), dòng
      hai-khu-ghep-b giữ nguyên giá trị; mọi lát khác oCuaLat như cũ. Lệnh in danh sách lát khai trước và sau.
  - id: E4
    criterion: AC-4
    executor: test
    layer: backend-effect
    cmd: bash _acceptance/lat-hai-khu-truc-khai-o/probes/test.sh
    paths: ["app/src/lib/labels-normalize.ts", "app/src/lib/labels-queries.ts", "app/src/components/ops/labels/label-form-nhom.tsx", "app/tests/labels-lat-hai-khu-truc.test.tsx"]
    expected: >
      Ca HT21-AC-4: nhapChoLat (máy chủ) trả nháp của hai-khu-truc lọc về building, stack; null cho hai-khu-ghep-b; giữ nguyên cho
      lát không khai; null khi nháp không còn ô của lát. Biểu mẫu dựng thật điền sẵn hai ô và hiện «Nháp máy» cho hai-khu-truc, không
      cho hai-khu-ghep-b. Chiều đỏ trên cùng tệp: bản đưa hai-khu-ghep-b vào danh sách có nháp thì phép so gắn mù đỏ, gọi tên lát.
