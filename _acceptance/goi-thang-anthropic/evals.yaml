    expected: "exit 0; ca 'GTA-AC-4 …' ok: hang-ngay/chay/cham thoát 5 với 'THIEU KHOA ANTHROPIC_API_KEY' (bảng Haiku anthropic) và 'THIEU KHOA AI_GATEWAY_API_KEY' (bảng có nhóm gateway), không ECONNREFUSED; client đường anthropic nhận khoá tường minh. Chiều đỏ: main thoát 2 và chỉ biết AI_GATEWAY_API_KEY"
