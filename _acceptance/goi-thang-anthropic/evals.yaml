schema_version: 1
feature_slug: goi-thang-anthropic
# Hai executor riêng của hồ sơ:
#   gta_agent    — agent/tests/goi-thang-anthropic.test.ts (máy chủ Anthropic giả qua ANTHROPIC_BASE_URL + Gateway giả, ca DB trên DB của
#                  riêng lượt qua db/db-thu.sh, BEGIN…ROLLBACK)
#   gta_pipeline — pipeline/scripts/goi-thang-anthropic.test.mjs (label-nhap-ghep, doc-gop-hang-ngay.sh, mau-soat — tiến trình con giả)
# Mỗi ca mang tiền tố GTA-AC-<n>; chiều đỏ ghi ở expected là bản trước vòng (main f78e7382).
evals:
  - id: E1
    criterion: AC-1
    executor: test
    cmd: config:executors.test.gta_agent
    paths: [agent/config/doc-gop-s03.json, agent/src/enrich/doc-gop-s03/cau-hinh.ts, pipeline/label-nhap-ghep.mjs]
    expected: "exit 0; các ca 'GTA-AC-1 …' ok: Haiku duong anthropic mã gọi claude-haiku-5-5, GLM/DeepSeek gateway, MODEL_DUYET ba mã, bảng chọn anthropic cho GLM/DeepSeek hay duong lạ bị từ chối gọi tên model, bản chép pipeline khớp. Chiều đỏ: main không có trường duong → ca đỏ"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E2
    criterion: AC-2
    executor: test
    cmd: config:executors.test.gta_agent
    paths: [agent/src/enrich/doc-gop-s03/doc.ts, agent/src/enrich/doc-gop-s03/prompt.ts, agent/config/doc-gop-s03.json]
    expected: "exit 0; ca 'GTA-AC-2 …' ok: máy chủ giả nhận đúng 1 POST /v1/messages, model claude-haiku-5-5, max_tokens 8000, Authorization Bearer khoá giả, không temperature, không thinking, nội dung chữ · Ảnh 1 · image base64 · Ảnh 2 · image base64; Gateway giả nhận 0 lời gọi Haiku và lời gọi GLM mang zeroDataRetention. Chiều đỏ: main gọi Gateway"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E3
    criterion: AC-3
    executor: test
    cmd: config:executors.test.gta_agent
    paths: [agent/src/enrich/doc-gop-s03/doc.ts, agent/src/enrich/doc-gop-s03/chay.ts]
    expected: "exit 0; ca 'GTA-AC-3 …' ok: silver_labels.model gateway:anthropic/claude-haiku-5.5, probabilities.duong anthropic, cost_usd 0.00095, ai_calls.model không đổi ok true, chạy lại 0 lời gọi"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
