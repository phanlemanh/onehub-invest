<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ảnh chết trong gallery</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Lora:ital,wght@0,400;1,400&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Lora', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.25;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Luồng trạng thái · listing-detail-product-detail-5 · AC-2 · AC-3 · AC-8</p>
    <h1>Một ảnh chết rời gallery thế nào</h1>

    <svg viewBox="0 0 1000 700" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Connectors (drawn first) -->
      <!-- A -> B -->
      <line x1="280" y1="76" x2="380" y2="76" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- B -> C (lỗi trước hydrate) -->
      <path d="M460 104 V132 Q460 140 452 140 H428 Q420 140 420 148 V176" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- B -> D (lỗi sau hydrate) -->
      <path d="M540 104 V132 Q540 140 548 140 H692 Q700 140 700 148 V176" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- C -> E -->
      <path d="M420 240 V264 Q420 272 428 272 H492 Q500 272 500 280 V292" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- D -> E -->
      <path d="M700 240 V264 Q700 272 692 272 H628 Q620 272 620 280 V292" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- E -> F -->
      <line x1="560" y1="348" x2="560" y2="392" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- F -> G (có) -->
      <path d="M460 440 H248 Q240 440 240 448 V516" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- F -> H (không) -->
      <path d="M660 440 H822 Q830 440 830 448 V516" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Arrow labels -->
      <rect x="340" y="410" width="32" height="16" rx="2" fill="#f5f5f5"/>
      <text x="356" y="422" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">CÓ</text>
      <rect x="716" y="410" width="48" height="16" rx="2" fill="#f5f5f5"/>
      <text x="740" y="422" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">KHÔNG</text>

      <!-- Callout for node A -->
      <path d="M160 108 V128" fill="none" stroke="rgba(45,49,66,0.40)" stroke-width="1" stroke-dasharray="4,3"/>
      <circle cx="160" cy="108" r="2" fill="#2d3142"/>
      <text x="40" y="148" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', 'Lora', serif">giữ ảnh trong HTML server để thước</text>
      <text x="40" y="168" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', 'Lora', serif">luật 5 (smoke-listing-no-airdna)</text>
      <text x="40" y="188" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', 'Lora', serif">đọc được</text>

      <!-- A: start oval -->
      <rect x="40" y="48" width="240" height="56" rx="28" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="160" y="74" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">HTML server có &lt;img&gt;</text>
      <text x="160" y="90" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">ảnh tự thu</text>

      <!-- B: step -->
      <rect x="380" y="48" width="240" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="500" y="74" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Trình duyệt tải ảnh</text>
      <text x="500" y="90" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">CDN trả lỗi hoặc ảnh hỏng</text>

      <!-- C: focal, lỗi trước hydrate -->
      <rect x="300" y="176" width="240" height="64" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4"/>
      <text x="420" y="202" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Lỗi trước hydrate</text>
      <text x="420" y="218" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">ref: complete, naturalWidth = 0</text>

      <!-- D: lỗi sau hydrate -->
      <rect x="580" y="176" width="240" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="700" y="202" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Lỗi sau hydrate</text>
      <text x="700" y="218" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">onError</text>

      <!-- E: ảnh rời gallery -->
      <rect x="440" y="292" width="240" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="560" y="318" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Ảnh rời gallery</text>
      <text x="560" y="334" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">bỏ khỏi danh sách ảnh sống</text>

      <!-- F: decision -->
      <polygon points="560,392 660,440 560,488 460,440" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="560" y="444" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Còn ảnh sống?</text>

      <!-- G: có -->
      <rect x="100" y="516" width="280" height="64" rx="32" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="240" y="544" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Ảnh chính = ảnh sống đầu tiên</text>
      <text x="240" y="562" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">dải thumbnail còn N − 1 ảnh</text>

      <!-- H: không, focal -->
      <rect x="700" y="516" width="260" height="64" rx="32" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4"/>
      <text x="830" y="544" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Gallery báo onEmpty</text>
      <text x="830" y="562" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">đầu trang một cột, Đặc điểm trải ngang</text>

      <!-- Legend -->
      <line x1="40" y1="616" x2="960" y2="616" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="636" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.18em">CHÚ GIẢI · HÌNH DẠNG MANG LOẠI NÚT</text>

      <rect x="40" y="652" width="24" height="12" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="72" y="662" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Điểm đầu / điểm cuối</text>

      <rect x="236" y="652" width="24" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="268" y="662" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Bước</text>

      <polygon points="352,658 364,652 376,658 364,664" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="388" y="662" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Câu hỏi rẽ nhánh</text>

      <rect x="528" y="652" width="24" height="12" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4"/>
      <text x="560" y="662" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Chỗ dễ sót (bắt lỗi trước hydrate · hết ảnh)</text>
    </svg>
  </div>
</body>
</html>
