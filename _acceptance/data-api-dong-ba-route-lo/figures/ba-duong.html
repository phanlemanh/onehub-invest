<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ba đường data-api</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Lora:ital,wght@0,400;1,400&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Lora', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.3;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">So sánh trước / sau · Cổng Phạm vi</p>
    <h1>Ba đường của data-api: trên main hôm nay và sau hàng</h1>

    <svg viewBox="0 0 1000 600" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-ink" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2d3142"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Đầu cột -->
      <text x="32" y="32" fill="#4f5d75" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.18em">TRÊN MAIN HÔM NAY</text>
      <text x="532" y="32" fill="#4f5d75" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.18em">SAU HÀNG · KHUYẾN NGHỊ</text>
      <line x1="32" y1="44" x2="968" y2="44" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>

      <!-- ===== Mũi tên (vẽ trước hộp) ===== -->
      <!-- deals -->
      <line x1="452" y1="124" x2="530" y2="124" stroke="#2d3142" stroke-width="1.2" marker-end="url(#arrow-ink)"/>
      <path d="M452,144 H484 Q492,144 492,152 V186 Q492,194 500,194 H530" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <!-- coverage -->
      <line x1="452" y1="314" x2="530" y2="314" stroke="#2d3142" stroke-width="1.2" marker-end="url(#arrow-ink)"/>
      <path d="M452,334 H484 Q492,334 492,342 V386 Q492,394 500,394 H530" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <!-- listings/:id -->
      <line x1="452" y1="494" x2="530" y2="494" stroke="#2d3142" stroke-width="1.2" marker-end="url(#arrow-ink)"/>

      <!-- ===== Hàng 1: deals ===== -->
      <text x="32" y="72" font-family="'Geist Mono', monospace" font-size="11" font-weight="600" fill="#2d3142">GET /v1/deals</text>
      <text x="192" y="72" font-family="'Geist', sans-serif" font-size="11" fill="#4f5d75">chữ bài, tên nhóm, ảnh S03 chỉ được ở /ops (luật 6)</text>

      <rect x="32" y="84" width="420" height="80" rx="6" fill="#f5f5f5"/>
      <rect x="32" y="84" width="420" height="80" rx="6" fill="#ffffff" stroke="#4f5d75" stroke-width="1"/>
      <text x="48" y="108" fill="#4f5d75" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.08em">ĐỌC</text>
      <text x="120" y="108" font-family="'Geist', sans-serif" font-size="11" fill="#2d3142"><tspan font-family="'Geist Mono', monospace" font-size="10">sale_offers</tspan> · bảng hạng · <tspan fill="#ba4513" font-weight="600">bảng bài S03 thô</tspan></text>
      <text x="48" y="128" fill="#4f5d75" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.08em">TRẢ</text>
      <text x="120" y="128" font-family="'Geist', sans-serif" font-size="11" fill="#2d3142">giá, hạng, <tspan font-family="'Geist Mono', monospace" font-size="10">postText,</tspan></text>
      <text x="120" y="148" font-family="'Geist Mono', monospace" font-size="10" fill="#2d3142">contact{senderName, groupName, mediaPath}</text>

      <rect x="532" y="84" width="436" height="80" rx="6" fill="#f5f5f5"/>
      <rect x="532" y="84" width="436" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/>
      <text x="548" y="108" fill="#4f5d75" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.08em">ĐỌC</text>
      <text x="620" y="108" font-family="'Geist', sans-serif" font-size="11" fill="#2d3142"><tspan font-family="'Geist Mono', monospace" font-size="10">sale_offers</tspan> · bảng hạng</text>
      <text x="548" y="128" fill="#4f5d75" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.08em">TRẢ</text>
      <text x="620" y="128" font-family="'Geist', sans-serif" font-size="11" fill="#2d3142">giá, hạng, <tspan font-family="'Geist Mono', monospace" font-size="10">meta</tspan> (giữ tên, kiểu)</text>
      <text x="548" y="148" fill="#4f5d75" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.08em">BỎ</text>
      <text x="620" y="148" font-family="'Geist Mono', monospace" font-size="10" fill="#4f5d75">contact, postText</text>

      <rect x="532" y="176" width="436" height="36" rx="6" fill="#f5f5f5"/>
      <rect x="532" y="176" width="436" height="36" rx="6" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.30)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="548" y="198" fill="#4f5d75" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.08em">LỐI KHÁC · HỎI-2</text>
      <text x="668" y="198" font-family="'Geist', sans-serif" font-size="11" fill="#2d3142">giữ tên người bán từ <tspan font-family="'Geist Mono', monospace" font-size="10">sale_offers</tspan> đã làm sạch</text>

      <!-- ===== Hàng 2: coverage ===== -->
      <text x="32" y="252" font-family="'Geist Mono', monospace" font-size="11" font-weight="600" fill="#2d3142">GET /v1/coverage</text>
      <text x="192" y="252" font-family="'Geist', sans-serif" font-size="11" fill="#4f5d75">số S02 chỉ để hiệu chuẩn, không lên API (luật 5)</text>

      <rect x="32" y="264" width="420" height="100" rx="6" fill="#f5f5f5"/>
      <rect x="32" y="264" width="420" height="100" rx="6" fill="#ffffff" stroke="#4f5d75" stroke-width="1"/>
      <text x="48" y="288" fill="#4f5d75" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.08em">ĐỌC</text>
      <text x="120" y="288" font-family="'Geist', sans-serif" font-size="11" fill="#2d3142"><tspan font-family="'Geist Mono', monospace" font-size="10">listings</tspan> · <tspan fill="#ba4513" font-weight="600">3 bảng S02</tspan></text>
      <text x="48" y="308" fill="#4f5d75" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.08em">TRẢ</text>
      <text x="120" y="308" font-family="'Geist Mono', monospace" font-size="10" fill="#2d3142">ourListings, calibration*,</text>
      <text x="120" y="328" font-family="'Geist Mono', monospace" font-size="10" fill="#2d3142">historyMonths, coverageRatio</text>
      <text x="48" y="348" fill="#4f5d75" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.08em">PHẠM VI</text>
      <text x="120" y="348" font-family="'Geist', sans-serif" font-size="11" fill="#2d3142">chỉ thị trường có dữ liệu S02</text>

      <rect x="532" y="264" width="436" height="100" rx="6" fill="#f5f5f5"/>
      <rect x="532" y="264" width="436" height="100" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/>
      <text x="548" y="288" fill="#4f5d75" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.08em">ĐỌC</text>
      <text x="620" y="288" font-family="'Geist Mono', monospace" font-size="10" fill="#2d3142">listings</text>
      <text x="548" y="308" fill="#4f5d75" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.08em">TRẢ</text>
      <text x="620" y="308" font-family="'Geist Mono', monospace" font-size="10" fill="#2d3142">areaId, name, ourListings</text>
      <text x="548" y="328" fill="#4f5d75" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.08em">BỎ</text>
      <text x="620" y="328" font-family="'Geist Mono', monospace" font-size="10" fill="#4f5d75">calibration*, historyMonths, coverageRatio</text>
      <text x="548" y="348" fill="#4f5d75" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.08em">PHẠM VI</text>
      <text x="620" y="348" font-family="'Geist', sans-serif" font-size="11" fill="#2d3142">mọi thị trường VN</text>

      <rect x="532" y="376" width="436" height="36" rx="6" fill="#f5f5f5"/>
      <rect x="532" y="376" width="436" height="36" rx="6" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.30)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="548" y="398" fill="#4f5d75" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.08em">LỐI KHÁC · HỎI-1</text>
      <text x="668" y="398" font-family="'Geist', sans-serif" font-size="11" fill="#2d3142">gỡ hẳn đường, trả <tspan font-family="'Geist Mono', monospace" font-size="10">410 Gone</tspan> kèm lời giải thích</text>

      <!-- ===== Hàng 3: listings/:id ===== -->
      <text x="32" y="452" font-family="'Geist Mono', monospace" font-size="11" font-weight="600" fill="#2d3142">GET /v1/listings/:id</text>
      <text x="192" y="452" font-family="'Geist', sans-serif" font-size="11" fill="#4f5d75">ảnh và đường dẫn của S02 không lên API (luật 5)</text>

      <rect x="32" y="464" width="420" height="60" rx="6" fill="#f5f5f5"/>
      <rect x="32" y="464" width="420" height="60" rx="6" fill="#ffffff" stroke="#4f5d75" stroke-width="1"/>
      <text x="48" y="488" fill="#4f5d75" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.08em">ĐỌC</text>
      <text x="120" y="488" font-family="'Geist', sans-serif" font-size="11" fill="#2d3142"><tspan font-family="'Geist Mono', monospace" font-size="10">listings</tspan> · <tspan fill="#ba4513" font-weight="600">bảng S02</tspan></text>
      <text x="48" y="508" fill="#4f5d75" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.08em">TRẢ</text>
      <text x="120" y="508" font-family="'Geist', sans-serif" font-size="11" fill="#2d3142">ảnh dự phòng «calibration», <tspan font-family="'Geist Mono', monospace" font-size="10">listingUrl</tspan></text>

      <rect x="532" y="464" width="436" height="60" rx="6" fill="#f5f5f5"/>
      <rect x="532" y="464" width="436" height="60" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/>
      <text x="548" y="488" fill="#4f5d75" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.08em">ĐỌC</text>
      <text x="620" y="488" font-family="'Geist Mono', monospace" font-size="10" fill="#2d3142">listings</text>
      <text x="548" y="508" fill="#4f5d75" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.08em">TRẢ</text>
      <text x="620" y="508" font-family="'Geist', sans-serif" font-size="11" fill="#2d3142">ảnh tự thu hoặc null · không còn <tspan font-family="'Geist Mono', monospace" font-size="10">listingUrl</tspan></text>

      <!-- ===== Chú giải ===== -->
      <line x1="32" y1="552" x2="968" y2="552" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <text x="32" y="576" fill="#4f5d75" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.14em">CHÚ GIẢI</text>

      <rect x="124" y="566" width="24" height="14" rx="3" fill="#ffffff" stroke="#4f5d75" stroke-width="1"/>
      <text x="156" y="576" font-family="'Geist', sans-serif" font-size="11" fill="#2d3142">bản trên main</text>

      <rect x="264" y="566" width="24" height="14" rx="3" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/>
      <text x="296" y="576" font-family="'Geist', sans-serif" font-size="11" fill="#2d3142">sau hàng (khuyến nghị)</text>

      <rect x="456" y="566" width="24" height="14" rx="3" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.30)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="488" y="576" font-family="'Geist', sans-serif" font-size="11" fill="#2d3142">lối khác, chọn ở Cổng Phạm vi</text>

      <text x="704" y="576" font-family="'Geist', sans-serif" font-size="11" font-weight="600" fill="#ba4513">bảng S0x</text>
      <text x="760" y="576" font-family="'Geist', sans-serif" font-size="11" fill="#2d3142">bảng cấm đọc ở API công khai</text>
    </svg>
  </div>
</body>
</html>
