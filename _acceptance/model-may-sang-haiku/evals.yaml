    executor: test
    cmd: config:executors.suite.pipeline_b
    long_running: 60
    paths: ["pipeline/**"]
    expected: "Nửa B của pipeline thoát 0."
  - id: E9d
    criterion: AC-9
    executor: test
    cmd: config:executors.test.scripts
    long_running: 120
    paths: ["scripts/**", "agent/scripts/enrich-run.ts"]
    expected: "node --test scripts/*.test.mjs thoát 0."
