schema_version: 1
slug: model-may-sang-haiku
evals:
  - id: E1
    criterion: AC-1
    executor: script
    cmd: bash db/db-thu.sh oneinvest_suite_mh1 --chay node _acceptance/model-may-sang-haiku/probes/khong-goi-8000.mjs
    long_running: 20
    paths: ["agent/src/**", "agent/scripts/**", "agent/config/**", "pipeline/lib/vlm-anh.mjs", "scripts/bao-cao-ngay.mjs", "_acceptance/model-may-sang-haiku/probes/**"]
    expected: "Probe dựng máy giả ở cổng MTPLX_URL (đếm yêu cầu) và Gateway giả, chạy năm lệnh enrich-run --offers, judge-run, nhan-bac-run --model haiku --thu, vlm-anh-run --model haiku --thu, npm run smoke trên DB thử; in một dòng mỗi lệnh «<lệnh>: mtplx 0 · gateway <n>» với n ≥ 1, và quét mã sản xuất không còn MTPLX_URL, qwen27b, 127.0.0.1:8000 trừ danh sách loại trừ đóng (tệp *.test.*, *.itest.*, scripts/smoke-review-queue.mjs), in «loại <k> tệp». Chiều đỏ: cấy qwen27b vào một tệp tạm khác dưới scripts/ thì đỏ gọi tên tệp; --cay-qwen trỏ một lệnh về getModel cũ trong bản sao thì probe đỏ «AC-1 <lệnh> gọi MTPLX <n> lần»; --cay-chuoi cấy chuỗi qwen27b vào một tệp tạm dưới agent/src thì đỏ gọi tên tệp."
  - id: E2
    criterion: AC-2
    executor: test
    cmd: cd agent && node --import tsx --test tests/model-agent.test.ts
    paths: ["agent/src/runtime/**", "agent/config/model-agent.json", "agent/tests/model-agent.test.ts"]
    expected: "Ma trận viết trước: tệp mẫu gán enrich-text cho haiku → lời gọi Gateway giả mang anthropic/claude-haiku-5.5; đổi sang glm → zai/glm-5.3-flash, mã agent không đổi; năm ca lỗi (tệp thiếu, JSON hỏng, mã ngoài MODEL_DUYET, agent không có khoá, giá âm) mỗi ca dừng trước lời gọi đầu với thông điệp gọi tên ca, Gateway giả nhận 0 yêu cầu. Chiều đỏ: ca bỏ kiểm MODEL_DUYET trong bản sao thì ca «mã ngoài danh sách» đỏ."
  - id: E3
    criterion: AC-3
    executor: test
    cmd: cd agent && node --import tsx --test tests/model-agent.test.ts
    paths: ["agent/src/runtime/**", "agent/src/agents/enrich-text.ts", "agent/src/agents/judge-entity.ts", "agent/tests/model-agent.test.ts"]
    expected: "Thân yêu cầu Gateway giả của enrich-text và judge-entity có providerOptions.gateway.zeroDataRetention = true và disallowPromptTraining = true, so bằng chính kết quả tuyChonGui(mã model). Chiều đỏ: gọi runAgent không truyền tuỳ chọn thì ca đỏ «AC-3 thiếu cờ không giữ dữ liệu»."
  - id: E4
    criterion: AC-4
    executor: script
    cmd: bash db/db-thu.sh oneinvest_suite_mh1g --chay node --import tsx --test --test-concurrency=1 agent/tests/du-lieu-gui-agent.itest.ts
    long_running: 10
    paths: ["agent/src/agents/enrich-text.ts", "agent/src/agents/judge-entity.ts", "agent/src/tools/native.ts", "agent/src/enrich/run.ts", "agent/scripts/enrich-run.ts", "agent/scripts/judge-run.ts", "agent/tests/du-lieu-gui-agent.itest.ts"]
    expected: "Trên DB thử: hai tin S03 cấy tên người bán, SĐT người bán, tên nhóm vào cột ngoài chữ bài, một cặp property_candidates của chúng; chạy enrich-run --offers và judge-run thật (OFFER_SELECT, queryPair) với Gateway giả ghi thân yêu cầu. Thân enrich chỉ có chữ bài ≤ 500 ký tự và khối bối cảnh; thân judge chỉ có các dòng thuộc danh sách nhãn dòng viết trước của design doc; tên, SĐT người bán và tên nhóm không xuất hiện; đối chứng dương: chữ bài cấy xuất hiện nguyên văn. Chiều đỏ: bản sao buildJudgeInput thêm dòng người bán thì ca đỏ gọi tên trường lộ."
  - id: E5
    criterion: AC-5
    executor: script
    cmd: bash db/db-thu.sh oneinvest_suite_mh1t --chay node --import tsx --test --test-concurrency=1 agent/tests/tran-tien-agent.itest.ts
    long_running: 10
    paths: ["agent/scripts/enrich-run.ts", "agent/scripts/judge-run.ts", "agent/src/runtime/**", "agent/config/model-agent.json", "agent/tests/tran-tien-agent.itest.ts"]
    expected: "Gateway giả trả số token cố định; enrich-run và judge-run với --tran-usd đủ cho đúng k lời gọi: chạy đúng k lời gọi, thoát 4, dòng tổng kết nêu đã chi và trần; ai_calls có k dòng mang anthropic/claude-haiku-5.5 và token vào, ra; trần đủ lớn thì thoát 0 và chạy hết tập. Chiều đỏ: bỏ kiểm trần trong bản sao thì ca đỏ «AC-5 chạy k+1 lời gọi khi trần chỉ đủ k»."
  - id: E6
    criterion: AC-6
    executor: test
    cmd: cd agent && node --import tsx --test tests/model-agent.test.ts
    paths: ["agent/src/agents/nhan-bac-s03.ts", "agent/src/agents/vlm-anh-s03.ts", "agent/scripts/nhan-bac-run.ts", "agent/scripts/vlm-anh-run.ts", "agent/tests/model-agent.test.ts"]
    expected: "Chạy CLI thật nhan-bac-run và vlm-anh-run với --model qwen (máy giả ở cả hai cổng): thoát 2, stderr có «model không được duyệt», hai máy giả nhận 0 yêu cầu; --model haiku --thu thoát 0 và Gateway giả nhận yêu cầu. Chiều đỏ: thêm lại qwen vào danh sách backend trong bản sao thì ca đỏ «AC-6 qwen còn chạy»."
  - id: E7
    criterion: AC-7
    executor: test
    cmd: node --test pipeline/tests/vlm-anh.test.mjs
    paths: ["pipeline/lib/vlm-anh.mjs", "pipeline/tests/vlm-anh.test.mjs"]
    expected: "kiemLoThat trên tập chỉ có dòng Haiku tốt trả mảng không chứa lý do model; tập không dòng tốt nào trả «chưa có dòng model tốt»; tập rỗng giữ lý do cũ. Chiều đỏ: giữ điều kiện tiền tố mtplx: thì ca Haiku đỏ."
  - id: E8
    criterion: AC-8
    executor: script
    cmd: node _acceptance/model-may-sang-haiku/probes/do-truoc-sau.mjs --kiem
    long_running: 5
    paths: ["agent/src/agents/enrich-text.ts", "agent/src/agents/judge-entity.ts", "agent/src/runtime/**", "agent/config/model-agent.json", "_acceptance/model-may-sang-haiku/mau-enrich.json", "_acceptance/model-may-sang-haiku/mau-judge.json", "_acceptance/model-may-sang-haiku/probes/do-truoc-sau.mjs"]
    expected: "Lượt đo thật chạy MỘT lần ở S3 sau khi Cổng Phạm vi duyệt (`--chay --tran-usd 1`: DB máy thu phiên READ ONLY, Haiku thật qua Gateway trên 100 tin và 30 cặp của hai tệp mẫu, ghi từng đầu ra thô vào so-truoc-sau.json kèm băm hai tệp mẫu, và bảng vào so-truoc-sau.md). Eval chạy `--kiem`, không gọi model: kiểm băm mẫu khớp, đủ 100 + 30 đầu ra, tính lại các tỉ lệ từ đầu ra thô và so với bảng; thoát 0 khi JSON ≥ 95 %, giải thích ≥ 95 %, kết luận đổi 0, chi ≤ 1 USD, cổng MTPLX giả 0 yêu cầu trong lượt đo. Chiều đỏ: --mau-thieu bỏ một đầu ra thì đỏ «AC-8 cỡ mẫu 99 khác 100»; sửa một tỉ lệ trong bảng thì đỏ «AC-8 bảng lệch đầu ra thô»."
  - id: E10
    criterion: AC-10
    executor: script
    cmd: bash db/db-thu.sh oneinvest_suite_mh1t --chay node --import tsx --test --test-concurrency=1 agent/tests/tran-tien-agent.itest.ts
    long_running: 10
    paths: ["agent/scripts/enrich-run.ts", "agent/src/enrich/run.ts", "agent/src/agents/enrich-text.ts", "agent/src/runtime/**", "agent/tests/tran-tien-agent.itest.ts"]
    expected: "Năm tin cấy thiếu trường, Gateway giả trả năm đầu ra thô viết trước (hai JSON trần, hai JSON trong khối mã, một chuỗi không phải JSON); sau enrich-run --offers: số dòng enrichment_proposals e2_llm và số đề xuất được áp bằng đúng bảng kỳ vọng viết trước trong test, cột model là anthropic/claude-haiku-5.5, tin đầu ra hỏng có lỗi ghi như trước và 0 đề xuất. Chiều đỏ: bản sao parseEnrichOutput chỉ nhận JSON trần thì ca đỏ «AC-10 thiếu đề xuất của đầu ra khối mã»."
