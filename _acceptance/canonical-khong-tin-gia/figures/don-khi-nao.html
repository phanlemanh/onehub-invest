<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Khi nào dọn thật</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Lora:ital,wght@0,400;1,400&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Lora', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1360px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.25;
      color: var(--color-ink);
      margin-bottom: 0.5rem;
    }
    .sub {
      font-size: 0.875rem;
      color: var(--color-muted);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 960px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Cổng Phạm vi · canonical-khong-tin-gia · Hỏi-1</p>
    <h1>Khi nào dọn thật: lượt đêm đầu tiên sau merge</h1>
    <p class="sub">Hai nhánh theo thời gian · nhánh khuyên chỉ đo trong vòng · AC-4 · AC-7 · AC-8</p>

    <svg viewBox="0 88 1360 412" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
      </defs>

      <rect x="0" y="88" width="1360" height="412" fill="#f5f5f5"/>

      <!-- ===================== CỘT THỜI GIAN ===================== -->
      <text x="192" y="112" fill="#4f5d75" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.18em">TRONG VÒNG · TRƯỚC KÝ</text>
      <text x="616" y="112" fill="#4f5d75" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.18em">CỔNG KÝ</text>
      <text x="792" y="112" fill="#4f5d75" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.18em">ĐÊM ĐẦU SAU MERGE · 00:00</text>
      <text x="1176" y="112" fill="#4f5d75" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.18em">≤ 15′ SAU</text>

      <!-- lane rules -->
      <line x1="40" y1="128" x2="1320" y2="128" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <line x1="40" y1="256" x2="1320" y2="256" stroke="rgba(45,49,66,0.10)" stroke-width="1"/>
      <line x1="40" y1="384" x2="1320" y2="384" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <line x1="160" y1="128" x2="160" y2="384" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <!-- column dividers -->
      <line x1="600" y1="100" x2="600" y2="384" stroke="rgba(45,49,66,0.14)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="776" y1="100" x2="776" y2="384" stroke="rgba(45,49,66,0.14)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="1160" y1="100" x2="1160" y2="384" stroke="rgba(45,49,66,0.14)" stroke-width="1" stroke-dasharray="3,3"/>

      <!-- lane labels -->
      <text x="48" y="180" fill="#4f5d75" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.18em">NHÁNH KHUYÊN</text>
      <text x="48" y="196" fill="#636b80" font-size="9" font-family="'Geist', sans-serif">dọn bằng lượt đêm</text>
      <text x="48" y="208" fill="#636b80" font-size="9" font-family="'Geist', sans-serif">sau merge</text>
      <text x="48" y="308" fill="#4f5d75" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.18em">NHÁNH KHÁC</text>
      <text x="48" y="324" fill="#636b80" font-size="9" font-family="'Geist', sans-serif">dọn thật trong vòng</text>

      <!-- ===================== ARROWS (trước hộp) ===================== -->
      <!-- nhánh khuyên -->
      <line x1="400" y1="188" x2="612" y2="188" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="760" y1="188" x2="788" y2="188" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="960" y1="188" x2="980" y2="188" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="1144" y1="188" x2="1172" y2="188" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- nhánh khác -->
      <line x1="360" y1="316" x2="380" y2="316" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="544" y1="316" x2="612" y2="316" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- lặp → vẫn chờ merge -->
      <line x1="688" y1="280" x2="688" y2="228" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>

      <!-- arrow labels -->
      <rect x="468" y="168" width="80" height="12" rx="2" fill="#f5f5f5"/>
      <text x="508" y="177" fill="#636b80" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">DB GIỮ NGUYÊN</text>
      <rect x="696" y="244" width="56" height="12" rx="2" fill="#f5f5f5"/>
      <text x="724" y="253" fill="#636b80" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CHỜ MERGE</text>

      <!-- ===================== NHÁNH KHUYÊN ===================== -->
      <!-- N1 đo mô phỏng -->
      <rect x="200" y="152" width="200" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="200" y="152" width="200" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="208" y="158" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="224" y="167" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">AC-8</text>
      <text x="300" y="188" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Đo mô phỏng</text>
      <text x="300" y="204" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">--simulate · ROLLBACK</text>
      <text x="300" y="216" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">DB local thật, không ghi</text>

      <!-- N2 ký, merge -->
      <rect x="616" y="152" width="144" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="616" y="152" width="144" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="688" y="188" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Mạnh ký, merge</text>
      <text x="688" y="204" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">Cổng Nghiệm thu</text>

      <!-- N3 lượt 00:00 code mới (focal) -->
      <rect x="792" y="152" width="168" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="792" y="152" width="168" height="72" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4"/>
      <rect x="800" y="158" width="32" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>
      <text x="816" y="167" fill="#ba4513" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">AC-4</text>
      <text x="876" y="188" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Lượt 00:00 · code mới</text>
      <text x="876" y="204" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">transform rút 1.020 tin giả</text>
      <text x="876" y="216" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">đối soát + ops_audit</text>

      <!-- N4 tính lại bait gap -->
      <rect x="984" y="152" width="160" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="984" y="152" width="160" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="992" y="158" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="1008" y="167" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">AC-7</text>
      <text x="1064" y="188" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Tính lại bait gap</text>
      <text x="1064" y="204" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">refresh-bait-gap</text>
      <text x="1064" y="216" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">xoá 989 người bán mồ côi</text>

      <!-- N5 sync 15′ -->
      <rect x="1176" y="152" width="136" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="1176" y="152" width="136" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="1244" y="188" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Sync 15′</text>
      <text x="1244" y="204" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">cloud thay toàn bảng</text>
      <text x="1244" y="216" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">không sửa tay prod</text>

      <!-- ===================== NHÁNH KHÁC ===================== -->
      <!-- N6 dọn thật ở S3 -->
      <rect x="200" y="280" width="160" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="200" y="280" width="160" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="280" y="316" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Dọn thật ở S3</text>
      <text x="280" y="332" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">trước khi ký</text>

      <!-- N7 lượt 00:00 code cũ (rủi ro) -->
      <rect x="384" y="280" width="160" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="384" y="280" width="160" height="72" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4" stroke-dasharray="5,4"/>
      <text x="464" y="316" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Lượt 00:00 · code CŨ</text>
      <text x="464" y="332" fill="#ba4513" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">nạp lại 1.020 tin giả</text>

      <!-- N8 lặp tới khi merge -->
      <rect x="616" y="280" width="144" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="616" y="280" width="144" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="688" y="316" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Lặp tới khi merge</text>
      <text x="688" y="332" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">tin giả trở lại mỗi đêm</text>

      <!-- ghi chú -->
      <text x="176" y="412" fill="#636b80" font-size="9" font-family="'Geist Mono', monospace">trong vòng chỉ đo · số sau dọn thật đọc bằng test-data-residue.mjs (không cờ) sau lượt 00:00 đầu tiên</text>

      <!-- ===================== LEGEND ===================== -->
      <line x1="40" y1="436" x2="1320" y2="436" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="456" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.18em">CHÚ GIẢI</text>

      <rect x="40" y="468" width="16" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="64" y="478" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Bước</text>

      <rect x="128" y="468" width="16" height="12" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4"/>
      <text x="152" y="478" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Dọn thật xảy ra ở đây</text>

      <rect x="296" y="468" width="16" height="12" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4" stroke-dasharray="3,2"/>
      <text x="320" y="478" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Tin giả quay lại</text>

      <line x1="436" y1="474" x2="464" y2="474" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4"/>
      <text x="472" y="478" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Vẫn phải chờ merge</text>

      <rect x="600" y="468" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="616" y="477" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">AC-n</text>
      <text x="640" y="478" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Tiêu chí liên quan</text>
    </svg>
  </div>
</body>
</html>
