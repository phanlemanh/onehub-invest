<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chặn tụt sync cloud</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Lora:ital,wght@0,400;1,400&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Lora', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1360px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.25;
      color: var(--color-ink);
      margin-bottom: 0.5rem;
    }
    .sub {
      font-size: 0.875rem;
      color: var(--color-muted);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 960px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Cổng Phạm vi · canonical-khong-tin-gia · Hỏi-4</p>

      <text x="1000" y="112" fill="#4f5d75" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.18em">CLOUD SAU ĐÓ</text>

      <rect x="1000" y="136" width="320" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="1000" y="136" width="320" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>

      <!-- ===================== LỐI 2 ===================== -->
      <rect x="640" y="228" width="320" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="640" y="228" width="320" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="800" y="264" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Cờ một lần</text>
      <text x="800" y="280" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">làn merge chạy tay sau lượt 00:00</text>

      <rect x="1000" y="228" width="320" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>

      <text x="800" y="372" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">vòng này không xoá người bán mồ côi</text>

      <rect x="512" y="480" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
