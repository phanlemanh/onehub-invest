<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bài đăng lại</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Lora:ital,wght@0,400;1,400&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Lora', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1000px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.3;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Hỏi-2 · bang-yeu-cau · AC-5 · AC-9</p>
    <h1>Cùng người đăng lại cùng chữ: gom hay mỗi bài một?</h1>

    <svg viewBox="0 0 1000 560" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Arrows (drawn first, behind nodes) -->
      <!-- Tình huống → A (trái, khuyến nghị) -->
      <path d="M476 160 L476 180 A8 8 0 0 1 468 188 L268 188 A8 8 0 0 0 260 196 L260 220" fill="none" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <!-- Tình huống → B (phải) -->
      <path d="M524 160 L524 180 A8 8 0 0 0 532 188 L732 188 A8 8 0 0 1 740 196 L740 220" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- A → hàng đo cầu, B → hàng đo cầu -->
      <line x1="260" y1="316" x2="260" y2="352" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="740" y1="316" x2="740" y2="352" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Tình huống chung -->
      <rect x="260" y="32" width="480" height="128" rx="20" fill="#f5f5f5"/>
      <rect x="260" y="32" width="480" height="128" rx="20" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <rect x="452" y="42" width="96" height="16" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="500" y="54" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">TÌNH HUỐNG</text>
      <text x="500" y="82" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">«Khách tìm thuê 2pn gần trung tâm»</text>
      <text x="500" y="104" fill="#4f5d75" font-size="12" font-family="'Geist', sans-serif" text-anchor="middle">Cùng một người đăng ba ngày liền, chữ giống nhau</text>
      <!-- ba bài -->
      <rect x="340" y="120" width="96" height="24" rx="4" fill="#ffffff" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/>
      <text x="388" y="136" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle">bài · ngày 1</text>
      <rect x="452" y="120" width="96" height="24" rx="4" fill="#ffffff" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/>
      <text x="500" y="136" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle">bài · ngày 2</text>
      <rect x="564" y="120" width="96" height="24" rx="4" fill="#ffffff" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/>
      <text x="612" y="136" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle">bài · ngày 3</text>

      <!-- A · Gom (khuyến nghị) -->
      <rect x="80" y="220" width="360" height="96" rx="6" fill="#f5f5f5"/>
      <rect x="80" y="220" width="360" height="96" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4"/>
      <rect x="196" y="230" width="128" height="16" rx="2" fill="transparent" stroke="rgba(235,108,54,0.60)" stroke-width="0.8"/>
      <text x="260" y="242" fill="#ba4513" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">A · KHUYẾN NGHỊ</text>
      <text x="260" y="272" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Gom thành một Yêu cầu</text>
      <text x="260" y="296" fill="#4f5d75" font-size="12" font-family="'Geist', sans-serif" text-anchor="middle">3 bài trong danh sách bài · ngày đầu – ngày cuối</text>

      <!-- A → hàng đo cầu -->
      <rect x="80" y="352" width="360" height="96" rx="6" fill="#f5f5f5"/>
      <rect x="80" y="352" width="360" height="96" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="208" y="362" width="104" height="16" rx="2" fill="transparent" stroke="rgba(79,93,117,0.40)" stroke-width="0.8"/>
      <text x="260" y="374" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">HÀNG ĐO CẦU</text>
      <text x="260" y="412" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Đếm 1 nhu cầu</text>

      <!-- B · Mỗi bài một -->
      <rect x="560" y="220" width="360" height="96" rx="6" fill="#f5f5f5"/>
      <rect x="560" y="220" width="360" height="96" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="728" y="230" width="24" height="16" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="740" y="242" fill="#4f5d75" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">B</text>
      <text x="740" y="272" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Mỗi bài một Yêu cầu</text>
      <text x="740" y="296" fill="#4f5d75" font-size="12" font-family="'Geist', sans-serif" text-anchor="middle">3 Yêu cầu, mỗi cái một bài</text>

      <!-- B → hàng đo cầu -->
      <rect x="560" y="352" width="360" height="96" rx="6" fill="#f5f5f5"/>
      <rect x="560" y="352" width="360" height="96" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="688" y="362" width="104" height="16" rx="2" fill="transparent" stroke="rgba(79,93,117,0.40)" stroke-width="0.8"/>
      <text x="740" y="374" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">HÀNG ĐO CẦU</text>
      <text x="740" y="404" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Đếm 3 nhu cầu</text>
      <text x="740" y="428" fill="#4f5d75" font-size="12" font-family="'Geist', sans-serif" text-anchor="middle">phải tự gom lại, hoặc đếm phồng</text>

      <!-- Legend -->
      <line x1="40" y1="504" x2="960" y2="504" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <text x="40" y="524" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.14em">CHÚ GIẢI</text>

      <rect x="140" y="532" width="24" height="12" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="172" y="542" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif">Tình huống chung</text>

      <rect x="320" y="532" width="24" height="12" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4"/>
      <text x="352" y="542" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif">Cách làm khuyến nghị</text>

      <rect x="520" y="532" width="24" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="552" y="542" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif">Cách làm còn lại</text>

      <rect x="700" y="532" width="24" height="12" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="732" y="542" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif">Hệ quả về sau</text>
    </svg>
  </div>
</body>
</html>
