    expected: "exit 0; ca 'PB-AC-1' xanh trên ma trận {máy e2_llm, người hitl} × {B sống, B đã nghỉ}: sau apply_enrichment năm cột + field_provenance của A và B bằng kết quả resolve_offer_fields chạy lại, tin C không chung post giữ băm; chiều đỏ: bản apply_enrichment của 059 (chỉ phân xử tin của đề xuất) nạp trong cùng giao dịch → ca đỏ ghim 'PB-AC-1: tin chung post không được phân xử lại'"
