schema_version: 1
slug: ghep-tin-vao-danh-muc

# Lệnh đo nằm ở probes/*.sh của hồ sơ: _acceptance/config.yaml là tệp bảo vệ, giám sát không mở (P4-209).

evals:
  - id: E1
    criterion: AC-1
    executor: test
    cmd: bash _acceptance/ghep-tin-vao-danh-muc/probes/ham-gan.sh
    paths: ["pipeline/lib/ghep-tin-danh-muc*.mjs"]
    expected: >
      Ma trận một assert mỗi ô: khớp đúng, khớp sau chuẩn hoá, nhiều toà, vùng, ngoài danh bạ, ô khớp nhưng chữ bài nêu hai toà, ô khớp nhưng model báo bài rao nhiều căn; giá trị mỗi ô rút từ dữ liệu thật trên bản
      chép DB máy thu, kèm đối chứng dương. Hai ca mo-ho và ngoai-danh-ba không rơi xuống đọc chữ bài. Chiều đỏ trên cùng fixture: bản đột biến chọn toà đầu tiên ở ô mơ hồ thì ca đỏ, thông điệp ghim tên ô.

  - id: E2
    criterion: AC-2
    executor: test
    cmd: bash _acceptance/ghep-tin-vao-danh-muc/probes/ham-gan.sh
    paths: ["pipeline/lib/ghep-tin-danh-muc*.mjs"]
    expected: >
      Mã S1 của OP1 và GP ra hai toà khác nhau theo dự án của tin; tin khu khác, chưa có dự án, không phải căn hộ sinh 0 phát biểu. Chiều đỏ:
      bỏ lọc theo dự án thì ca mã trùng đỏ, thông điệp ghim mã và hai dự án.

  - id: E3
    criterion: AC-3
    executor: test
    cmd: bash _acceptance/ghep-tin-vao-danh-muc/probes/ham-gan.sh
    paths: ["pipeline/lib/ghep-tin-danh-muc*.mjs"]
    expected: >
      Bảy ô luật đọc chữ × bản đọc, một assert mỗi ô, ra đúng nguồn C, D, F, G hoặc đúng lý do không gắn; chữ bài và bản đọc rút từ bài thật. Bản đọc có căn cứ khác chu_bai hoặc đoạn trích chưa kiểm
      thì coi như model chưa đọc. Chiều đỏ: bản đột biến nhận căn cứ kiến thức nghề, và bản đột biến bỏ phép kiểm tên trong đoạn trích, mỗi bản làm đúng ca của nó đỏ, thông điệp ghim mã bài.

  - id: E4
    criterion: AC-4
    executor: script
    cmd: bash _acceptance/ghep-tin-vao-danh-muc/probes/migration.sh
    layer: backend-effect
    paths: ["db/migrations/117_*.sql", "pipeline/lib/ghep-tin-danh-muc*.mjs", "pipeline/scripts/ghep-tin-danh-muc*.mjs"]
    expected: >
      Trên DB thử áp tới 113 rồi 117: ghi được hai mức phát biểu của cả bốn rule_id đúng khuôn, dòng dùng bản đọc của model mang label_id và đoạn trích, bốn trường của 113 vẫn ghi được. Chiều đỏ: DB từ chối giá trị không phải
      UPI của toà đang hoạt động và trường này trên resource khác Property, thông điệp ghim tên trường.

  - id: E5
    criterion: AC-5
    executor: script
    cmd: bash _acceptance/ghep-tin-vao-danh-muc/probes/xung-dot.sh
    layer: backend-effect
    paths: ["db/migrations/117_*.sql", "pipeline/scripts/ghep-tin-danh-muc*.mjs"]
    expected: >
      Năm ô, một assert mỗi ô: hai toà khác nhau, toà với vùng không chứa nó, hai vùng không lồng nhau đều ra xung_dot và không tính đã gắn; toà với vùng chứa nó và hai nguồn cùng một toà ra mức toà (đối chứng dương).
      Dòng của rule_id khác không vào view. Trên bản chép DB máy thu in số xung_dot, không vượt 1% số tin đã gắn. Chiều đỏ: cấy hai toà vào một tin ở bản sao thì lệnh báo đúng offer_id.

  - id: E6
    criterion: AC-6
    executor: script
    cmd: bash _acceptance/ghep-tin-vao-danh-muc/probes/chay-lai.sh
    paths: ["pipeline/lib/ghep-tin-danh-muc*.mjs", "pipeline/scripts/ghep-tin-danh-muc*.mjs"]
    expected: >
      Lượt hai 0 chèn 0 rút. Sáu ca đổi dữ liệu, một assert mỗi ca: ô sang toà khác, ô về rỗng, tin đổi dự án, toà bị gộp, toà ngừng hoạt động, bản đọc mới của model tới; dòng cũ bị rút, bài có nhiều nhất một dòng sống mỗi
      trường. Tắt một nguồn: lượt kế rút đúng dòng của nguồn đó, dòng của nguồn khác giữ nguyên. Chiều đỏ: bỏ bước rút thì bài mang hai dòng sống và lệnh thoát 1, thông điệp ghim subject_key.

  - id: E7
    criterion: AC-7
    executor: script
    cmd: bash _acceptance/ghep-tin-vao-danh-muc/probes/khong-pha.sh
    paths: ["pipeline/transform-zalo.mjs", "pipeline/scripts/ghep-tin-danh-muc*.mjs"]
    expected: >
      Trên bản chép: offer_project trước và sau lượt nạp giống nhau từng tin; băm snapshot không đổi, gốc snapshot lấy từ cấu hình và số tệp lớn hơn
      0; bài thử sinh 0 dòng; bước gắn xong trong 60 giây. DB thiếu 117, hoặc cấy lỗi khi ghi: in đúng một dòng JOB WARN [ghep-toa], số bài nạp bằng đối chứng không có
      bước gắn, thoát 0. Chiều đỏ: cấy bài thử mà nó được gắn thì lệnh thoát 1.

  - id: E8
    criterion: AC-8
    executor: script
    cmd: bash _acceptance/ghep-tin-vao-danh-muc/probes/do-phu.sh
    paths: ["pipeline/scripts/ghep-tin-danh-muc*.mjs", "db/migrations/117_*.sql", "_acceptance/ghep-tin-vao-danh-muc/probes/dem-doc-lap.mjs"]
    expected: >
      Trên bản chép DB máy thu sau lượt đọc bù, với các nguồn đã qua AC-9: in tử số, mẫu số, tách theo khu, mức gắn, nguồn, số trước và sau đọc bù; tỉ lệ từ 50%; lệch không quá 0,5% tử số so với probes/dem-doc-lap.mjs, bản viết lại luật từ
      design doc §3 do tác tử khác viết, lệnh kiểm tệp này không nhập pipeline/lib/ghep-tin-danh-muc; cấy dòng của rule_id khác thì tử số không đổi. Chiều đỏ: gỡ phát biểu của một khu ở bản sao thì lệnh thoát 1 và nêu lệch bao nhiêu tin.

  - id: E9
    criterion: AC-9
    executor: script
    cmd: bash _acceptance/ghep-tin-vao-danh-muc/probes/cham-tap-test.sh
    paths: ["pipeline/lib/ghep-tin-danh-muc*.mjs", "pipeline/scripts/ghep-tin-danh-muc*.mjs"]
    expected: >
      Tính lại cận dưới Wilson của từng nhóm N1, N2, N3 từ đầu ra đóng băng có băm và nhãn thô, ghi evidence/cham-tap-test.md; thoát 0 khi N1, N2 từ 0,95 và đủ 110 bài; N3 chưa chấm hoặc hụt thì báo D, G phải tắt. Đỏ, thông điệp ghim lý do và tên nhóm, khi số lệch báo cáo, khi đầu ra của mã cuối
      khác bản đóng băng trên một bài trong mẫu, hoặc khi thiếu cỡ mẫu. Đối chứng hai chiều trên cùng fixture: tập đúng hết đủ cỡ thì xanh, đổi nhãn cho một nhóm hụt ngưỡng thì đỏ đúng nhóm đó, đổi một nút trong đầu ra đóng băng thì đỏ vì băm.

  - id: E10
    criterion: AC-9
    executor: judgment
    inputs:
      - _acceptance/ghep-tin-vao-danh-muc/contract.md
      - _acceptance/ghep-tin-vao-danh-muc/evidence/cham-tap-test.md
    question: >
      Đối chiếu báo cáo chấm với AC-9 của hợp đồng: báo cáo có nêu cỡ mẫu đúng mức đã chốt của từng nhóm, cận dưới Wilson của từng nhóm, và số tách riêng từng nguồn, mức toà với mức vùng và theo từng khu không? Nếu một phần
      có độ đúng thấp rõ rệt, báo cáo có nói ra không?

  - id: E11
    criterion: AC-10
    executor: script
    cmd: bash _acceptance/ghep-tin-vao-danh-muc/probes/doc-bu.sh
    layer: backend-effect
    paths: ["pipeline/scripts/ghep-tin-danh-muc*.mjs"]
    expected: >
      Trước lượt đọc: danh sách đóng băng có băm khớp phép đếm độc lập, mỗi tin một bài, không bài thử, không tin đã gắn, không tin đã có bản đọc dg3-s03-v3. Sau lượt đọc trên DB máy thu: tiền cộng từ silver_labels theo run_id không vượt 5 USD, mọi dòng mang run_id đó
      thuộc danh sách đóng băng, và chạy lại không sinh dòng mới. Chiều đỏ: cấy một bài thử hoặc một tin đã gắn vào danh sách thì lệnh thoát 1, thông điệp ghim mã bài.
