schema_version: 1
feature_slug: du-an-cua-tin-len-dinh-vi
# Ca «DV7-AC-n». Ba executor (khai ở _acceptance/config.yaml khi vào S3):
# - dv7_db (pipeline, DB thử của riêng lượt): pipeline/tests/offer-project.itest.mjs — mỗi ca tự áp 105 lên DB thử rồi dựng
#   fixture theo chín lớp của bảng phủ ca (khuôn cột và dạng subject_key lấy từ DB máy thu, không giá trị tầng A).
# - dv7_that (pipeline, DB máy thu, chỉ đọc hoặc giao dịch lùi): pipeline/scripts/offer-project-that.mjs — AC-6, AC-7, AC-9.
# - dv7_lui (pipeline, DB thử của riêng lượt): pipeline/tests/offer-project-lui.itest.mjs — tệp lùi của ap-may-thu/.
# - dv7_app (app, DB thử của riêng lượt): app/tests/offer-project-app.itest.tsx + tb_app_db — bên đọc bản ghi và bậc của app.
evals:
  - id: E1
    criterion: AC-1
    executor: test
    cmd: config:executors.test.dv7_db
    paths: [db/migrations/105_offer_project.sql, pipeline/tests/offer-project.itest.mjs]
    expected: "exit 0; ca 'DV7-AC-1': áp 105 hai lần, lần hai không lỗi; dấu lược đồ (information_schema.columns của offer_project theo thứ tự + pg_get_viewdef + pg_get_functiondef('offer_located(text)'::regprocedure)) deepEqual giữa lần một và lần hai; tên cột deepEqual ['offer_id','source','project_node_id','status','evidence','catalog_tier','n_posts','n_posts_with_project']; pg_get_function_arguments và kiểu trả của offer_located deepEqual bản trước khi áp 105 ('p_offer_id text', boolean); số bảng trong information_schema.tables (BASE TABLE) trước và sau áp bằng nhau; git diff origin/main -- pipeline/sync-cloud.mjs rỗng; đối chứng đỏ: bản sao 105 đổi tên một cột thì ca nêu 'ten-cot'"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E2
    criterion: AC-2
    executor: test
    cmd: config:executors.test.dv7_db
    paths: [db/migrations/105_offer_project.sql, pipeline/tests/offer-project.itest.mjs]
    expected: "exit 0; ca 'DV7-AC-2' ma trận viết trước 15 ô (assert đúng 15 phần tử, kết cục so deepEqual {status, project_node_id, evidence, n_posts, n_posts_with_project} hoặc 'khong-dong'): 1 bài 0 dự án → khong-dong; 1 bài 1 dự án → mot_du_an nút đó, 1/1; nhiều bài 0 dự án → khong-dong; 3 bài, 1 bài có dự án → mot_du_an, 3/1; 3 bài cùng dự án → mot_du_an 3/3; 2 bài hai dự án gốc khác → xung_dot NULL; 1 bài hai phát biểu hai dự án → xung_dot NULL; 1 bài hai luật cùng nút → mot_du_an 1/1; phát biểu duy nhất đã rút → khong-dong; bài trỏ phân khu con → mot_du_an id dự án cha; bài trỏ phân khu cháu (phân khu → phân khu → dự án) → mot_du_an id dự án gốc; bài trỏ toà con của dự án → mot_du_an id dự án; hai bài trỏ hai phân khu cùng cha → mot_du_an cha; tin post_ids rỗng → khong-dong; tin S05 subject 'S05:<id>' → mot_du_an; mỗi offer_id tối đa một dòng (count = count distinct); đối chứng đỏ: bản sao view bỏ retracted_at IS NULL thì ô 'đã rút' ra mot_du_an, ca nêu 'da-rut'; bản sao chọn min(root) thay xung_dot thì ô 'hai dự án' ra mot_du_an, ca nêu 'xung-dot'; bản sao quy nút một bước (coalesce(parent_id, id)) thì ô 'phân khu cháu' ra id phân khu, ca nêu 'nut-chau'"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
