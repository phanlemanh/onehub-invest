schema_version: 1
feature_slug: bai-nhan-tru-bai-chi-anh
# Ca máy ở app/tests/data-flow-bai-chi-anh.test.tsx (tên ca mở đầu «DF6-AC-n»): lược đồ tạm dựng bằng
# ops-dong-chay-fixture (051 + 600 THẬT, mốc ngày ghim), bước làm tươi gọi bộ chạy thật của refresh-data-flow.mjs (hàm
# xuất, cùng đường CLI), số nhánh tính bằng pipeline/lib/nhanh-bai-s03.mjs → baiAnhCuaTin/parsePost/laYeuCau thật.
# Mỗi phép đo có chiều đỏ trên CÙNG fixture: bản chép tạm của tệp nguồn đổi đúng một chỗ, thông điệp ghim.
# Phép đo trên dữ liệu thật (E10) chạy trên DB của riêng lượt (db-thu --chay), không ghi DB dùng chung.
evals:
  - id: E1
    criterion: AC-1
    executor: test
    layer: backend-effect
    cmd: config:executors.test.df4_app
    paths: [pipeline/lib/nhanh-bai-s03.mjs, pipeline/refresh-data-flow.mjs, pipeline/sql/600_data_flow.sql, app/tests/data-flow-bai-chi-anh.test.tsx]
    expected: "exit 0; ca 'DF6-AC-1' ma trận viết trước 6 loại bài S03 (thành tin · ảnh cách bài chữ của tin 60 giây cùng người cùng nhóm · ảnh cách 60 giây nhưng KHÁC người · ảnh cách 10 phút · ảnh gần bài chữ không thành tin · Yêu cầu 'cần thuê căn 2pn' · chat) × 3 cửa sổ (số assert = loại × cửa sổ): imageMerged, inquiry, imageUnmerged của dòng S03 bằng số fixture dựng, VÀ bằng số đếm lại bằng chính baiAnhCuaTin + laChiAnh + parsePost/laYeuCau gọi thẳng trên cùng lược đồ (hai nguồn độc lập cùng khớp). Bài 'cần bán gấp căn 2pn 3 tỷ' (parsePost ra loại) KHÔNG vào inquiry. Chiều đỏ: nhánh ảnh ghép theo bài chữ gần nhất bất kể có thành tin → 'ANH GHEP SAI TIN'; Yêu cầu bỏ điều kiện parsePost không ra loại → 'YEU CAU NUOT TIN RAO'; bộ chạy bỏ bước nạp nhánh → 'NHANH VANG KHI QUA BO CHAY'."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E2
    criterion: AC-2
    executor: test
    cmd: config:executors.test.df4_app
    paths: [pipeline/lib/nhanh-bai-s03.mjs, pipeline/sql/600_data_flow.sql, app/tests/data-flow-bai-chi-anh.test.tsx]
    expected: "exit 0; ca 'DF6-AC-2': trên mọi cửa sổ × nguồn received − readable − imageMerged − inquiry − imageUnmerged ≥ 0; fixture có bài nằm trong post_ids của tin mà chữ nay là Yêu cầu, và bài chỉ-ảnh nằm trong post_ids của tin → cả hai đếm ở readable, không ở nhánh mới; tổng days[] S03 trong 30 ngày = dòng 30d cho từng khoá (received, readable, imageMerged, inquiry, imageUnmerged); tổng groups S03 = dòng nguồn cho cùng năm khoá. Chiều đỏ: bỏ ưu tiên readable → 'NHANH CHONG TIN'; nhánh ngày đếm theo first_seen của tin thay vì ngày đăng bài → 'NGAY LECH CUA SO'."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E3
    criterion: AC-3
    executor: test
    cmd: config:executors.test.df4_app
    paths: [pipeline/sql/600_data_flow.sql, app/tests/data-flow-bai-chi-anh.test.tsx]
    expected: "exit 0; ca 'DF6-AC-3': cùng lược đồ fixture, chạy 600 của merge-base với origin/main (git show) rồi 600 mới qua bộ chạy; so từng khoá của facts ở ba cửa sổ: sources S05, S06 (mọi khoá), S03 mọi khoá cũ, days, groups (khoá cũ), shortStay, mix, enrichPending giống hệt; khoá khác duy nhất là imageMerged, inquiry, imageUnmerged; S05, S06 có ba khoá = 0. Đối chứng dương: fixture có bài S05 chỉ-ảnh và bài S05 'cần mua' — vẫn 0. Chiều đỏ: tính nhánh cả cho S05 → 'S05 DOI SO'; đổi readable của S03 sang mẫu số mới → 'KHOA CU DOI NGHIA'. Không có merge-base (cây không có origin/main) → ca báo rõ 'KHONG CO BAN NEN' và đỏ, không tự bỏ qua."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E4
    criterion: AC-4
    executor: test
    cmd: config:executors.test.df4_app
    paths: [pipeline/sql/600_data_flow.sql, app/src/lib/data-flow-queries.ts, app/src/components/ops/data-flow/**, app/tests/data-flow-bai-chi-anh.test.tsx]
    expected: "exit 0; ca 'DF6-AC-4': chạy 600 trần (không bộ chạy) trên hai trạng thái — bảng tạm vắng; bảng tạm có dòng nhưng cờ oneinvest.flow_branch tắt → 600 không lỗi, imageMerged/inquiry/imageUnmerged = null ở mọi sources/days/groups (cả hai trạng thái), mọi khoá khác bằng lượt chạy qua bộ chạy. normalizeFacts giữ null; buildFlow trên khối ấy: không nút 'Bài cần đọc', 'Ảnh đã ghép vào tin', 'Đọc thành Yêu cầu', 'Ảnh chưa ghép'; nút 'Không đọc được' = received − readable; chú thích 'Đọc được' = readable/received; FlowSankey dựng (jsdom) có dòng 'Chưa tách bài chỉ-ảnh và Yêu cầu — có ở lượt làm tươi kế'. Lối gọi: mọi tệp .sh/.mjs/.plist trong scripts/, pipeline/ nhắc '600_data_flow.sql' đều chạy nó qua refresh-data-flow.mjs (danh sách miễn viết trước: chính bộ chạy, thước pipeline/scripts/do-nhanh-bai-s03.mjs). Chiều đỏ: null đọc thành 0 → 'KHOI CU THANH SO 0'; cờ tắt mà vẫn đếm bảng → 'BANG TAM KHONG CO'; thêm một lối gọi trần giả (bản chép tạm cloud-sync gọi psql -f 600) → 'LOI GOI 600 TRAN'."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E5
    criterion: AC-5
    executor: test
    layer: backend-effect
    cmd: config:executors.test.df4_app
    paths: [app/src/components/ops/data-flow/**, app/src/lib/data-flow-queries.ts, app/tests/data-flow-bai-chi-anh.test.tsx]
    expected: "exit 0; ca 'DF6-AC-5': khối facts sinh từ fixture qua bộ chạy (không viết tay) → buildFlow với S03: nút 'Ảnh đã ghép vào tin', 'Bài cần đọc', 'Đọc thành tin rao', 'Đọc thành Yêu cầu', 'Ảnh chưa ghép', 'Không đọc được' mang đúng số khối; cạnh received→{imageMerged, toRead}, toRead→{readable, inquiry, imageUnmerged, unreadable}; ở MỌI nút giữa tổng giá trị cạnh vào = tổng cạnh ra (ma trận nút giữa viết trước); header 'Đọc được'.value = fmtInt(readable+inquiry), .note = fmtPct((readable+inquiry)/(received−imageMerged)); FlowReadout rê 'Đọc thành tin rao' ra 'Tỉ lệ bước' = fmtPct(readable/(received−imageMerged)), rê 'Đọc thành Yêu cầu' ra fmtPct(inquiry/(received−imageMerged)); FlowJourney dựng (jsdom) có nhãn chữ 'Đọc thành tin rao' và 'Đọc thành Yêu cầu' cạnh thanh; hint 'Không đọc được' không chứa 'hỏi mua'. Ma trận viết trước nút → loại (số assert = 6): imageMerged → merged, toRead → journey, readable → journey, inquiry → inquiry, imageUnmerged → dropped, unreadable → dropped; màu của merged, inquiry, dropped, linked là bốn biến màu khác nhau (STAGE_COLOR). Chọn chỉ S06 → không nút nhánh S03. Chiều đỏ: header chia cho received → 'MAU SO CU'; header bỏ inquiry khỏi tử số → 'YEU CAU KHONG TINH DOC DUOC'; cạnh imageMerged xuất phát từ toRead → 'DONG CHAY KHONG BAO TOAN'; inquiry gắn loại dropped → 'YEU CAU TO MAU ROI'."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E6
    criterion: AC-6
    executor: test
    cmd: config:executors.test.df4_app
    paths: [app/src/components/ops/data-flow/quality-rows.ts, app/src/components/ops/data-flow/quality-grid.tsx, app/src/components/ops/data-flow/flow-branches.ts, app/tests/data-flow-bai-chi-anh.test.tsx]
    expected: "exit 0; ca 'DF6-AC-6' ma trận viết trước bốn ô ((tin rao + Yêu cầu) trên bài cần đọc / tin rao trên bài nhận): 25%/20% → 'Kẹt · đọc'; 45%/25% → 'Theo dõi · đọc' (trên bài nhận là Kẹt); 65%/40% → không nhãn đọc; null nhánh → xét tin rao trên bài nhận như trước. sourceRows và groupRows (nhóm thu S03) cùng luật; QualityGrid dựng (jsdom) ô 'Đọc được' của S03 ghi số readable+inquiry và % trên bài cần đọc. S05, S06, S01 giữ số và nhãn như trước (so với khối null nhánh). Ca thứ hai trên khối facts do bộ chạy sinh từ fixture của E1 (không viết tay): % 'Đọc được' của dòng S03 và của từng nhóm thu S03 bằng (readable+inquiry)/(received − imageMerged) tính độc lập từ chính phần tử nguồn/nhóm của khối. Chiều đỏ: kiểm 'đọc' còn chia received → 'NHAN SUC KHOE MAU SO CU'; kiểm 'đọc' bỏ inquiry → 'YEU CAU KHONG TINH DOC DUOC'; nhóm thu bỏ sót → 'NHOM THU MAU SO CU'; nhóm đọc nhánh của dòng nguồn → 'NHOM DOC NHANH NGUON'."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E7
    criterion: AC-7
    executor: test
    cmd: config:executors.test.df4_app
    paths: [app/src/components/ops/data-flow/stage-trend-chart.tsx, app/src/components/ops/data-flow/stage-trend-data.ts, app/src/components/ops/data-flow/flow-branches.ts, app/tests/data-flow-bai-chi-anh.test.tsx]
    expected: "exit 0; ca 'DF6-AC-7': StageTrendChart dựng (jsdom) với khối facts do bộ chạy sinh từ fixture của E1 (không viết tay) → ô 'Đọc được' ghi fmtInt(Σ(readable+inquiry)) và fmtPct(Σ(readable+inquiry) / Σ(received − imageMerged)) kèm 'bài cần đọc'; ô 'Tin rao mới' ghi % trên Σ readable kèm 'bài thành tin rao'; điểm 'Đọc được' của từng ngày = readable+inquiry của ngày ấy; 'Bài nhận', 'Tin rao mới', 'Gắn căn' theo ngày như trước; khối null nhánh → ô 'Đọc được' ghi % trên 'bài nhận' như trước. Chiều đỏ: ô chia received → 'O TI LE MAU SO CU'; đường ngày bỏ inquiry → 'DUONG NGAY THIEU YEU CAU'."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E8
    criterion: AC-8
    executor: test
    layer: backend-effect
    cmd: config:executors.test.df4_app
    paths: [app/src/lib/data-flow-queries.ts, pipeline/sql/600_data_flow.sql, app/tests/data-flow-bai-chi-anh.test.tsx]
    expected: "exit 0; ca 'DF6-AC-8': lược đồ máy thu làm tươi qua bộ chạy, push-ops-facts thật dựng khối dataFlow sang lược đồ cloud (cùng cách dong-chay-cloud.test.tsx), getDataFlow ở chế độ cloud trả ba khoá nhánh bằng số máy thu ở mọi sources/days/groups; buildFlow, sourceRows trên hai bản cho cùng nút và nhãn. Khối cloud đời trước (xoá ba khoá khỏi facts) → null, đi đường AC-4. Chiều đỏ: normalizeFacts bỏ khoá nhánh → 'CLOUD MAT NHANH'."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E9
    criterion: AC-9
    executor: test
    cmd: config:executors.test.df4_cu
    paths: [pipeline/sql/600_data_flow.sql, app/src/lib/data-flow-queries.ts, app/src/components/ops/data-flow/**]
    expected: "exit 0; mọi ca của app/tests/ops-dong-chay.test.tsx, dong-chay-cloud.test.tsx, df0-chang-theo-ngay.test.tsx, df0-dem-de-xuat.test.tsx, dong-chay-so-cu.test.tsx xanh trên mã đã sửa. Chiều đỏ: ca của chính các bộ ấy (đột biến đoạn ghim IS_TEST, COMPLETE, ENRICH)."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E10
    criterion: AC-1
    executor: script
    layer: backend-effect
    cmd: config:executors.script.df4_that
    paths: [pipeline/lib/nhanh-bai-s03.mjs, pipeline/refresh-data-flow.mjs, pipeline/sql/600_data_flow.sql, pipeline/scripts/do-nhanh-bai-s03.mjs]
    expected: "exit 0; trên DB của riêng lượt (chép từ bản mẫu của DB máy thu, db-thu --chay): làm tươi bằng 600 của merge-base rồi bằng bộ chạy mới; in một dòng mỗi cửa sổ cho S03: received, readable, imageMerged, inquiry, imageUnmerged, bài cần đọc, % đọc được. Đỏ (exit 1, thông điệp ghim) khi: imageMerged + imageUnmerged ≠ số bài S03 thật CHƯA thành tin mà chữ chỉ còn khoảng trắng sau khi gạt URL, đếm bằng SQL độc lập ('ANH LECH DEM SQL'); imageMerged ≠ đếm SQL độc lập của ảnh đã ghép (bài chỉ-ảnh chưa thành tin có bài chữ cùng người, cùng nhóm, cách dưới 120 giây mà bài chữ GẦN NHẤT — hoà thì bài đứng sau ảnh, rồi post_id nhỏ — nằm trong post_ids của một tin S03; viết bằng SQL, không gọi lib/gop-anh.mjs) ('ANH GHEP LECH DEM SQL'); tổng nhánh vượt received ('TONG NHANH VUOT'); S05/S06 hay khoá cũ khác bản merge-base ('SO CU DOI'); inquiry ≠ số bài suyLoai → yeu-cau không thành tin đếm lại bằng hàm transform ('YEU CAU LECH'). Đối chứng: '--doi-chung-hong=anh|ghep|yeu-cau' ép đúng một nhánh lệch → phải exit 1 với đúng thông điệp của nhánh ấy. Không ghi DB dùng chung (DB đích là oneinvest thì thoát 2)."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E11
    criterion: AC-5
    executor: ui-check
    layer: ui-observed
    target: "http://localhost:3465/ops/data-flow"
    paths: [app/src/components/ops/data-flow/**]
    steps:
      - "Bản chạy: dev server :3465 của worktree nối DB thử oneinvest_p4_df4 đã làm tươi bằng bộ chạy mới (đã chạy sẵn). Phiên Ops đăng nhập sẵn trong ego lite — mở bằng ego-browser, không đăng nhập lại. KHÔNG tạo hay sửa tệp nào ngoài _acceptance/bai-nhan-tru-bai-chi-anh/evidence/. Chụp THEO PHẦN TỬ được nêu, không chụp thanh bên có email."
      - "Mở /ops/data-flow?window=all ở 1280 px sáng; chọn chỉ nguồn S03; chụp khung 'Đường ống' → evidence/E11-step1.png; ghi tên và số mọi nút của Sankey"
      - "Rê chuột nút 'Đọc thành tin rao' rồi 'Đọc thành Yêu cầu' → chụp bảng đọc → evidence/E11-step2.png; ghi 'Tỉ lệ bước' của mỗi nút. Ghi chú thích cột 'Đọc được'"
      - "Cuộn tới lưới 'Chất lượng từng chặng', chụp hàng S03 → evidence/E11-step3.png; ghi ô 'Đọc được' và nhãn sức khoẻ"
      - "Chuyển 375 px tối, chụp khung 'Đường ống' → evidence/E11-step4.png"
    expected: "Sankey S03 có 'Ảnh đã ghép vào tin', 'Bài cần đọc', 'Đọc thành tin rao', 'Đọc thành Yêu cầu', 'Ảnh chưa ghép', 'Không đọc được' với số khớp data_flow_snapshot của DB thử; chú thích cột 'Đọc được' ghi (readable+inquiry) và % trên (received − imageMerged); ô 'Đọc được' của lưới cùng số và tỉ lệ; ba loại nút gộp ('Ảnh đã ghép vào tin'), Yêu cầu ('Đọc thành Yêu cầu') và rơi ('Ảnh chưa ghép', 'Không đọc được') phân biệt được bằng mắt ở 1280 px sáng và 375 px tối; khổ hẹp tối không vỡ chữ, không cuộn ngang trang. Ảnh theo phần tử ở evidence/."
    evidence_required: [screenshot, observed, verified_at]
