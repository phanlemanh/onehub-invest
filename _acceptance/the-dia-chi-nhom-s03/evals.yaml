      - "1280 px sáng: /ops/sources, khu Sổ đơn vị thu, tab Nhóm S03 → evidence/E5-step1.png; ghi dòng đầu lưới «Thẻ địa chỉ: x/27 nhóm có thẻ · n chờ duyệt» so với số lệnh dựng nháp in, badge từng hàng, hai nhóm «Chưa có trong sổ» ở cuối"
      - "Mở «Duyệt thẻ» ở nhóm lớn nhất chưa ghi dự án → evidence/E5-step2.png; ghi bốn ô và dòng căn cứ từng ô"
      - "Bấm Nhận → evidence/E5-step3.png: badge Đã duyệt, bộ đếm chờ duyệt giảm một; mở nhóm khác, sửa ô bán/thuê rồi Lưu sửa → evidence/E5-step4.png; mở nhóm thứ ba, Bác không lý do (thấy lỗi), rồi có lý do → evidence/E5-step5.png"
      - "Mở «Duyệt thẻ» ở một nhóm dưới 5 bài đọc → evidence/E5-step-o-trong.png; ghi ô trống và dòng vì sao"
      - "Tab thứ hai: sửa thẻ một nhóm rồi lưu; tab đầu (đã mở cùng thẻ trước đó) Lưu sửa → evidence/E5-step-409.png: Alert nêu thẻ đã đổi, chữ đã nhập còn, có «Tải lại thẻ»"
      - "Đăng nhập vai viewer (dev-ops-account --vai viewer), mở một thẻ → evidence/E5-step-viewer.png: ô chỉ đọc, không nút Nhận/Lưu sửa/Bác"
      - "Khổ 375 → evidence/E5-step6.png, ghi không tràn ngang; che email thanh bên trên mọi ảnh"
    expected: "Đầu lưới hiện bộ đếm thẻ khớp số lệnh in; mỗi hàng badge thẻ; nhóm chưa có trong sổ ở cuối; hộp hiện bốn ô kèm căn cứ; nhận, sửa, bác đổi badge và bộ đếm; bác không lý do bị chặn; ô trống nói vì sao; lưu khi thẻ đã đổi hiện lỗi giữ chữ và có Tải lại thẻ; viewer không có nút ghi; ảnh từng bước; email che"
    evidence_required: [run_id, screenshot, observed, verifier, verified_at]
  - id: E6
    criterion: AC-6
    executor: test
    cmd: config:executors.test.tg1_app
    paths: [app/src/lib/the-dia-chi-nhom.ts, app/src/app/api/v1/ops/source-groups/route.ts, app/src/components/ops/sources, app/tests/the-dia-chi-nhom-app.itest.tsx]
    expected: "exit 0; ca 'TG1-AC-6': dựng trang /ops/sources (render server) và gọi mọi action đọc/ghi của route source-groups trên fixture có khoá nhóm mồi; đếm khoá mồi trong HTML và thân phản hồi = 0; đối chứng dương: chèn một khoá mồi vào chuỗi đếm thì ra ≥ 1; lược đồ tạm không có bảng thẻ: hàm đọc thẻ trả null, trang dựng không lỗi và không có khu thẻ"
