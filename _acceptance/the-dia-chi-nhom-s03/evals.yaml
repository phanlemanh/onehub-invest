schema_version: 1
feature_slug: the-dia-chi-nhom-s03
# Ca «TG1-AC-n». Executor khai ở _acceptance/config.yaml khi vào S3:
# - tg1_unit (pipeline, không DB): pipeline/tests/the-dia-chi-nhom.test.mjs — hàm thuần dựng nháp, ma trận viết trước.
# - tg1_db (pipeline, DB thử của riêng lượt): pipeline/tests/the-dia-chi-nhom.itest.mjs — áp 108, lệnh dựng nháp trên năm lớp.
# - tg1_lui (pipeline, DB thử của riêng lượt): pipeline/tests/the-dia-chi-nhom-lui.itest.mjs — hồ sơ ap-may-thu/ + tệp lùi.
# - tg1_app (app, DB thử của riêng lượt): app/tests/the-dia-chi-nhom-app.itest.tsx — route card-decide, đọc thẻ, khoá nhóm.
# - tg1_that (pipeline, bản chép DB máy thu oneinvest_u1_tg1 qua db/db-thu.sh, không chạm oneinvest): pipeline/scripts/the-dia-chi-nhom-that.mjs.
evals:
  - id: E1
    criterion: AC-1
    executor: test
    cmd: config:executors.test.tg1_db
    paths: [db/migrations/108_the_dia_chi_nhom.sql, pipeline/tests/the-dia-chi-nhom.itest.mjs]
    expected: "exit 0; ca 'TG1-AC-1': áp 108 hai lần, lần hai không lỗi; dấu lược đồ (information_schema.columns của hai bảng theo thứ tự + định nghĩa trigger) deepEqual giữa hai lần; chèn dự án là nút subzone, phân khu là nút project, phường là areas cấp market, 4 dự án — mỗi chèn bị từ chối với thông điệp nêu ô; chèn hợp lệ được; git diff origin/main -- pipeline/sync-cloud.mjs rỗng; đối chứng đỏ: bản sao 108 bỏ kiểm loại nút dự án thì ca nêu 'kiem-du-an'"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E2
    criterion: AC-2
    executor: test
    cmd: config:executors.test.tg1_unit
    paths: [pipeline/lib/the-dia-chi-nhom.mjs, pipeline/tests/the-dia-chi-nhom.test.mjs]
    expected: "exit 0; ca 'TG1-AC-2' ma trận viết trước 16 ô (assert số phần tử = 16), mỗi ô so deepEqual {du_an, phuong, tinh, phan_khu, muc_dich} cùng căn cứ {nguon, so_bai}: sổ một dự án → dự án sổ, căn cứ 'so'; nhãn một tên 40 bài → nút đó; hai tên 30 và 12 trên 50 bài nêu tên → hai nút xếp theo số bài; bốn tên 20, 15, 10, 8 trên 53 bài → ba nút đầu; tên 2 bài → trống; tên 4/50 bài (≥ 3 bài nhưng 8%) → trống; tên không khớp nút → trống; một dự án có phường → phường dự án, tỉnh theo phường; hai dự án cùng phường → phường đó; tin 7/10 cùng phường → phường đó; tin 5/10 → trống; phân khu 6/10 bài → nút đó; phân khu 2 bài → trống; bán 18/20 → ban; thuê 17/20 → thue và 10/10 → ca_hai (hai ô); 4 bài đọc → trống kèm so_bai_doc 4; đối chứng đỏ: bản sao bỏ luật 10% thì ô 'tên 4/50' ra nút, ca nêu 'nguong-10'; bản sao bỏ trần 3 nút thì ô 'bốn tên' ra bốn nút, ca nêu 'tran-3'"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E3
    criterion: AC-3
    executor: test
    cmd: config:executors.test.tg1_db
    paths: [pipeline/scripts/the-dia-chi-nhom.mjs, pipeline/lib/the-dia-chi-nhom.mjs, pipeline/tests/the-dia-chi-nhom.itest.mjs]
    expected: "exit 0; ca 'TG1-AC-3' trên DB thử: fixture năm lớp nhóm (collection_units + stg_zalo_posts + silver_labels đúng ràng buộc bảng thật, khoá nhóm có và không tiền tố group:); sau lệnh dựng nháp: mỗi nhóm thật có bài đúng một thẻ status nhap, nhóm chưa có trong sổ có thẻ unit_code NULL, nhóm hai dòng sổ cùng khoá thật một thẻ, nhóm không bài không thẻ; mỗi thẻ một dòng lịch sử action dung_nhap; chạy lần hai: băm mọi dòng hai bảng deepEqual, không thêm lịch sử; thẻ da_duyet và bac đặt trước giữ nguyên byte; băm collection_units, field_assertions, sale_offer_records trước và sau bằng nhau; đối chứng đỏ: bản sao lệnh bỏ điều kiện status thì thẻ da_duyet bị đổi, ca nêu 'giu-da-duyet'"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E4
    criterion: AC-4
    executor: test
    cmd: config:executors.test.tg1_app
    paths: [app/src/lib/the-dia-chi-nhom.ts, app/src/app/api/v1/ops/source-groups/route.ts, app/src/lib/ops-access.ts, app/tests/the-dia-chi-nhom-app.itest.tsx]
    expected: "exit 0; ca 'TG1-AC-4' trên DB thử: người vai ops nhận → status da_duyet, version +1, một dòng lịch sử {action nhan, actor, at, before, after} và một dòng ops_audit action unit.card_decide cùng giao dịch; sửa (đổi dự án, mục đích) → version +1, before/after đúng hai ô; bác có lý do → bac, decision_note lưu; bác không lý do → 400 không ghi; version cũ → 409 không ghi dòng nào (đếm ba bảng); viewer → 403; dự án là nút subzone → 400 nêu ô du_an; đối chứng đỏ: bản sao bỏ kiểm version thì ca nêu 'version-409'"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E5
    criterion: AC-5
    executor: ui-check
    cmd: config:dev_server.start
    target: "http://localhost:3460/ops/sources"
    paths: [app/src/components/ops/sources, app/src/lib/the-dia-chi-nhom.ts]
    steps:
