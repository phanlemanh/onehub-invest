    question: "Trên hai ảnh hộp duyệt thẻ (một thẻ đủ ô, một thẻ có ô trống), người duyệt không đọc mã có biết mỗi ô (dự án, phường và tỉnh, phân khu, bán/thuê) lấy từ đâu và bao nhiêu bài làm căn cứ không, và CONTEXT.md có mục «Thẻ địa chỉ nhóm» đủ nhãn, mã, định nghĩa không?"
