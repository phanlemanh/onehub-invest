schema_version: 1
feature_slug: so-tu-vung-mot-nguon
# Ca «VB-AC-n» ở pipeline/scripts/vocab.test.mjs (bộ đọc, bộ sinh, kiểm lệch, G3), «VL-AC-n» ở vocab-lint.test.mjs (lint),
# «VD-AC-n» ở vocab-db.itest.mjs (DB local, mọi ghi trong BEGIN…ROLLBACK). Fixture sổ dựng bằng cách nạp mappings.yaml THẬT
# rồi đột biến một chỗ (round-trip từ sổ thật, không viết tay khuôn của bộ đọc). Cây giả của lint dựng trong thư mục tạm,
# đường tính từ vị trí tệp test (import.meta.url), không hardcode gốc kho.
evals:
  - id: E1
    criterion: AC-1
    executor: test
    cmd: config:executors.test.vocab
    paths: [pipeline/mappings.yaml, pipeline/lib/vocab-core.mjs, pipeline/scripts/vocab.test.mjs]
    expected: "exit 0; ca 'VB-AC-1 sổ thật': nạp pipeline/mappings.yaml → đúng 9 trục theo thứ tự [kind, property_type, confidence, price_tier, enrich_field, listing_intent, offer_status, data_level, capability_level]; assert từng trục đủ term_vi, dd_field, columns và đúng danh sách code (ma trận 9 dòng viết trước khớp bảng §3 design doc); mỗi giá trị có label_vi và (dd_lookup xor local+rationale+checked_on); ma trận nhãn viết trước 39 dòng (trục·code·label_vi) assert từng byte: 6 property_type, 2 kind, 3 confidence, 3 price_tier lấy nguyên văn ops-labels.ts trước vòng; 5 enrich_field nguyên văn FIELD_LABEL của review-card.tsx; 6 data_level + 5 capability_level nguyên văn tên bậc FRAMING §3.4 (Có lời khai … Sống; Thu được … Tự duy trì); 4 listing_intent + 5 offer_status theo Hỏi-1 đã chốt ở Cổng Phạm vi. Ca 'VB-AC-1 sai khuôn' 6 dòng, mỗi dòng đột biến MỘT chỗ của sổ thật đã nạp: (a) xoá label_vi, (b) nhân đôi một code, (c) code 'Căn_hộ', (d) local thiếu rationale, (e) vừa dd_lookup vừa local, (f) một cột khai ở hai trục → mỗi dòng validate ném lỗi, thông điệp chứa tên trục VÀ code (ghim chuỗi), CLI thoát 1; đối chứng dương: sổ thật không đột biến → validate không ném"
  - id: E2
    criterion: AC-2
    executor: test
    cmd: config:executors.test.vocab
    paths: [pipeline/lib/vocab-core.mjs, pipeline/vocab.mjs, pipeline/scripts/vocab.test.mjs]
    expected: "exit 0; ca 'VB-AC-2': chép kho tối thiểu (mappings.yaml + CONTEXT.md thật) vào thư mục tạm, chạy vocab.mjs --write --root <tạm> hai lần → sha256 của 4 đích bằng nhau giữa hai lần; mỗi tệp dòng 1 chứa 'MÁY SINH từ pipeline/mappings.yaml'; import động pipeline/lib/vocab.generated.mjs của thư mục tạm → VOCAB deepEqual sổ đã nạp (trục, code đúng thứ tự, nhãn); CONTEXT.md tạm: phần ngoài hai mốc VOCAB:BEGIN/END bằng byte bản gốc, trong mốc có dòng mỗi trục chứa term_vi và mọi label_vi; đối chứng: đổi một label_vi trong sổ tạm rồi --write → tệp app tạm đổi đúng chuỗi đó"
  - id: E3
    criterion: AC-3
    executor: test
    cmd: config:executors.test.vocab
    paths: [pipeline/lib/vocab-core.mjs, pipeline/vocab.mjs, pipeline/scripts/vocab.test.mjs]
    expected: "exit 0; ca 'VB-AC-3' ma trận 5 dòng trên thư mục tạm đã --write: (0) không đổi gì → --check thoát 0; (1)–(4) sửa một byte ở lần lượt từng đích (3 tệp sinh + khối CONTEXT.md) → --check thoát 1, stderr chứa đúng đường tệp bị sửa; thêm (5): thêm một code vào trục data_level của sổ tạm mà không --write → thoát 1, stderr nêu đủ 4 đích (3 tệp sinh + CONTEXT.md)"
  - id: E3b
    criterion: AC-3
    executor: script
    cmd: config:executors.script.vocab_check
    paths: [pipeline/mappings.yaml, pipeline/lib/vocab.generated.mjs, agent/src/vocab.generated.ts, app/src/lib/vocab.generated.ts, CONTEXT.md]
    expected: "exit 0 trên cây thật (tệp sinh đã commit khớp sổ); dòng cuối 'vocab --check: 4/4 đích khớp sổ'"
  - id: E4
    criterion: AC-4
    executor: test
    cmd: config:executors.test.vocab
    paths: [pipeline/lib/vocab-core.mjs, pipeline/scripts/vocab-lint.test.mjs]
    expected: "exit 0; ca 'VL-AC-4 sáu dạng': cây giả trong thư mục tạm, mỗi dạng một tệp ở vùng quét (agent/src, app/src, pipeline/sql) — mảng ['sale','rent_lt'], new Set(['high','low']), object nhãn {apartment:..., land:...}, union TS 'P1' | 'P2', SQL IN ('house','room'), chuỗi prompt 'offer|wanted' → mỗi dạng ĐÚNG một dòng đỏ dạng '<đường>:<dòng> · <trục> · <code,code>' (ghim cả ba phần); ca 'VL-AC-4 một code': cùng sáu tệp sửa còn một code mỗi chỗ → 0 dòng đỏ; ca 'VL-AC-4 vùng không quét': chép sáu chỗ vào *.generated.*, db/migrations/, collector/, tests/ → 0 dòng đỏ, và dòng đếm 'collector: n chỗ (không quét đỏ)' có n = 1; ca 'VL-AC-4 ngoại lệ': mục allow thiếu reason → đỏ 'enums_lint_allow' + đường; mục allow trỏ tệp không còn chỗ khớp → đỏ 'ngoại lệ không còn khớp' + đường; ca 'VL-AC-4 trùng chữ' (đối chứng dương, cùng cây giả): object {bedrooms: 2, bathrooms: 1}, const t = 'P1' đứng lẻ, chuỗi SQL 'SELECT bedrooms, bathrooms FROM sale_offers', và bản sao một danh sách viết tay đặt ở scripts/product-map.mjs, scripts/pre-merge-check.sh, scripts/check-lo-trinh.sh → 0 dòng đỏ"
  - id: E5
    criterion: AC-5
    executor: script
    cmd: config:executors.script.vocab_lint
    paths: [pipeline/**, agent/src/**, app/src/**, data-api/src/**, scripts/**]
    expected: "exit 0 trên cây thật; stdout có dòng 'vocab --lint: 0 chỗ viết tay ngoài sổ · ngoại lệ <k>'; mỗi mục ngoại lệ in kèm reason không rỗng"
  - id: E5b
    criterion: AC-5
    executor: test
    cmd: config:executors.test.vocab
    paths: [pipeline/dq-enum-vocab.mjs, pipeline/transform-chotot.mjs, agent/src/enrich/route.ts, agent/src/agents/enrich-text.ts, app/src/lib/ops-labels.ts, pipeline/scripts/vocab-lint.test.mjs]
    expected: "exit 0; ca 'VL-AC-5 ma trận kiểm kê' viết trước, mỗi dòng một chỗ của bảng §1 design doc với kết cục ghim: (A) 6 tệp đọc hằng sinh — pipeline/dq-enum-vocab.mjs, pipeline/transform-chotot.mjs, agent/src/enrich/route.ts, agent/src/agents/enrich-text.ts, agent/src/agents/context-resolver.ts, app/src/lib/ops-labels.ts → mỗi tệp khớp regex import từ vocab.generated VÀ scanText trả 0 chỗ; (B) tập ngoại lệ của mappings.yaml bằng ĐÚNG tập đường ghim trong contract AC-5 (so tập, không thừa không thiếu); đối chứng: scanText trên bản trước vòng của dq-enum-vocab.mjs (git show <diffBase>:pipeline/dq-enum-vocab.mjs) → ≥1 chỗ trục kind. Ca 'VL-AC-5 hành vi giữ nguyên' (agent, chạy trong suite agent): hàm phân loại đề xuất của route.ts với value 'unknown' cho field property_type → không nhận (như trước vòng, ghim trong agent/tests); chuỗi prompt sinh của enrich-text bằng byte chuỗi 'apartment|house|land|room|commercial|unknown'"
  - id: E6
    criterion: AC-6
    executor: test
    cmd: config:executors.test.app_ui
    paths: [app/src/lib/ops-labels.ts, app/src/lib/vocab.generated.ts, app/tests/vocab-labels.test.tsx]
    expected: "exit 0; ca 'VB-AC-6 nhãn giữ byte' (app/tests/vocab-labels.test.tsx): bảng nhãn trước vòng ghim nguyên văn trong test (6 property_type, 2 kind, 3 confidence, 3 price_tier = 14 dòng) → mỗi dòng propertyTypeLabel/offerKindLabel/confidenceLabel/priceTierLabel(code).label === nhãn ghim và known === true; đối chứng: code 'khong_co' → known false, label 'Giá trị khác'"
  - id: E6b
    criterion: AC-6
    executor: test
    cmd: config:executors.test.pipeline
    paths: [pipeline/**]
    expected: "exit 0 (cả bộ pipeline npm test, gồm vocab.test.mjs và vocab-lint.test.mjs)"
  - id: E6c
    criterion: AC-6
    executor: test
    cmd: config:executors.test.agent
    paths: [agent/**]
    expected: "exit 0"
  - id: E6d
    criterion: AC-6
    executor: test
    cmd: config:executors.test.app
    paths: [app/**]
    expected: "exit 0 (tsc --noEmit + lint 0 lỗi)"
  - id: E6e
    criterion: AC-6
    executor: test
    cmd: config:executors.test.ui_lint_rules
    paths: [app/**]
    expected: "exit 0"
  - id: E7
    criterion: AC-7
    executor: test
    cmd: config:executors.test.vocab_db
    paths: [db/migrations/043_ref_vocabulary.sql, pipeline/lib/vocab-core.mjs, pipeline/scripts/vocab-db.itest.mjs]
    expected: "exit 0; ca 'VD-AC-7' (một client pg, BEGIN … ROLLBACK, DB local :5433): dựng lại tiền đề lần áp đầu trong giao dịch — DROP TABLE IF EXISTS ref_field_lookup, ref_lookup; DROP CONSTRAINT IF EXISTS properties_property_type_chk; DROP rồi ADD lại bốn CHECK 025 ở NOT VALID — assert tiền đề (0 bảng ref_*, 4 ràng buộc convalidated=false) rồi áp 043 → SELECT ref_lookup bằng tập dòng của emitSeed(sổ thật) (so từng (lookup_name, lookup_value, standard_lookup_value, label_vi, is_local, sort_order)), ref_field_lookup bằng tập columns của sổ; pg_constraint.convalidated = true cho sale_offers_kind_chk, sale_offers_confidence_chk, sale_offers_price_tier_chk, sale_offers_property_type_chk, properties_property_type_chk (ma trận 5 tên); áp 043 lần hai trong cùng giao dịch → không lỗi, số dòng ref_lookup không đổi. Ca đối chứng (giao dịch riêng, ROLLBACK): chèn một sale_offers property_type='khong_co' (ràng buộc còn NOT VALID nên chèn được sau khi tạm DROP CONSTRAINT rồi ADD lại NOT VALID trong giao dịch) rồi áp 043 → lỗi, message chứa 'sale_offers_property_type_chk'. Sau test: pg_constraint ngoài giao dịch không đổi so với trước test (convalidated đọc lại trước/sau)"
  - id: E8
    criterion: AC-8
    executor: test
    cmd: config:executors.test.vocab_db
    paths: [pipeline/lib/vocab-core.mjs, pipeline/vocab.mjs, pipeline/scripts/vocab-db.itest.mjs]
    expected: "exit 0; ca 'VD-AC-8' trong BEGIN…ROLLBACK sau khi áp 043: (0) checkDb(sổ thật) → 0 lệch; (1) sổ đột biến thêm code 'shophouse' vào property_type → lệch nêu 'property_type', 'shophouse', 'cần migration mới'; (2) DELETE một dòng ref_lookup (kind/rent_lt) → lệch nêu 'kind', 'rent_lt'; (3) DROP CONSTRAINT properties_property_type_chk → lệch nêu 'properties.property_type' và 'thiếu CHECK'; CLI --check-db thoát 1 cho (1) (chạy CLI với --mappings <sổ tạm>)"
  - id: E8b
    criterion: AC-8
    executor: script
    cmd: config:executors.script.vocab_db
    paths: [db/migrations/043_ref_vocabulary.sql, pipeline/mappings.yaml]
    expected: "exit 0 trên DB local đã áp 043; dòng cuối 'vocab --check-db: <n> cột · <m> lookup khớp sổ'"
  - id: E9
    criterion: AC-9
    executor: test
    cmd: config:executors.test.vocab
    paths: [pipeline/lib/vocab-core.mjs, pipeline/vocab.mjs, pipeline/scripts/vocab.test.mjs]
    expected: "exit 0; ca 'VB-AC-9' năm dòng, tệp FIELD_TARGET viết trong thư mục tạm theo khuôn nguồn × trường × canonical (khuôn design §2): (a) mọi canonical lấy từ khoá canonical.fields của sổ thật → --check-field-targets thoát 0; (b) thêm trường canonical 'gia_khoang' cho S03 → thoát 1, stderr chứa 'S03' và 'gia_khoang'; (c) đường tệp không tồn tại → thoát 0, stdout 'chưa có tệp'; (e) tệp có mặt nhưng khuôn khác (khoá cấp nguồn lạ, hoặc 0 mục canonical đọc được) → thoát 1, stderr 'không nhận khuôn'; (d) băm cây collector/ thật trước và sau ba lần chạy bằng nhau (lệnh không ghi gì vào collector/)"
