schema_version: 1
feature_slug: do-the-duyet-du-du-lieu
evals:
  - id: E1
    criterion: AC-1
    executor: test
    cmd: config:executors.test.dtd_pipeline
    paths: [pipeline/do-the-duyet.mjs, pipeline/do-the-duyet.test.mjs]
    expected: "exit 0; hàm thuần trên tập thẻ viết trước (chờ, đã quyết, agent_output; bên còn sống/rời kho; media local/URL/không có; trường đủ/thiếu theo nguồn): ma trận (kiểm, đối tượng, khoá) → số viết trước, số assert = số phần tử; thẻ đã quyết và agent_output không đếm; bên rời kho không vào mẫu số độ đầy (Hỏi-2); loại hình 'unknown' tính là thiếu; đối chứng đỏ: bản chép đếm cả thẻ đã quyết → bắt ('DEM CA THE DA QUYET'); bản chép coi dòng media chỉ URL là ảnh vai ops thấy → bắt ('ANH OPS NHAN URL GOC'); bản chép tính 'unknown' là có loại hình → bắt ('UNKNOWN TINH LA CO')"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E2
    criterion: AC-2
    executor: script
    cmd: config:executors.script.dtd_db
    paths: [pipeline/do-the-duyet.mjs, _acceptance/do-the-duyet-du-du-lieu/probes/db.mjs]
    expected: "exit 0; DB thử oneinvest_p4_dtd dựng mới, xoá khi xong; lệnh (tiến trình con) và câu đo độc lập viết lại trong probe (SQL trên review_queue, sale_offers, media — không nạp do-the-duyet.mjs) trùng mọi số; ma trận Δ viết trước: fixture thẻ chờ có bên rời kho · có bên chỉ ảnh URL · có bên 0 dòng media · bên thiếu PN, và một thẻ đã quyết — mỗi fixture đổi đúng vectơ Δ viết trước ở mọi ô, sau mỗi fixture vẫn trùng câu độc lập; đối chứng đỏ: hàm so trên số lệch một ô → bắt ('LECH <ô>'); in 'DOI CHUNG OK'"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E3
    criterion: AC-3
    executor: script
    cmd: config:executors.script.dtd_db
    paths: [pipeline/do-the-duyet.mjs, _acceptance/do-the-duyet-du-du-lieu/probes/db.mjs]
    expected: "exit 0; trên DB thử, phiên đặt TimeZone=UTC qua PGOPTIONS (chứng bằng SHOW TimeZone), có sẵn dòng cũ 06:30 giờ máy thu: --write hai lần → số dòng the-duyet:* hôm nay bằng số (kiểm, đối tượng) lệnh in sau mỗi lượt, dòng cũ bị thay; status: ba kiểm đầu theo so=0, do-day pass; detail chỉ khoá=số; quét entity + detail: 0 offer_id fixture, 0 URL, 0 chữ tin (đối chứng dương: cùng hàm quét bắt một detail chèn offer_id fixture → 'DINH DANH TIN LOT'); câu ghi trong mã chỉ DELETE/INSERT dq_check_results; fixture có so>0 ở cả ba kiểm đầu, --write → thoát 0 và DB có dòng status fail (đối chứng đỏ: bản chép thoát 1 khi có fail → bắt 'FAIL DOI MA THOAT'); DB đóng → thoát ≠ 0; đối chứng đỏ: bản chép bỏ bước xoá → bắt ('NHAN DONG TRONG NGAY'); in 'GHI DQ OK'"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E4
    criterion: AC-4
    executor: script
    cmd: config:executors.script.dtd_job
    paths: [scripts/cloud-sync.sh, _acceptance/do-the-duyet-du-du-lieu/probes/job.sh]
    expected: "exit 0; dòng job_run cloud-sync do-the-duyet … --write là job_run cuối, sau do-danh-ba-sdt; bash -n sạch; hộp thử node giả: bước thoát 0 → job 0; bước thoát 1 → job ≠ 0 kèm 'JOB FAIL [cloud-sync] bước do-the-duyet'; đối chứng: bản chép đặt bước trước do-danh-ba-sdt → bắt ('SAI THU TU BUOC'); in 'JOB OK'"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E4b
    criterion: AC-8
    executor: script
    cmd: config:executors.script.dtd_db
    paths: [pipeline/sync-cloud.mjs, pipeline/do-the-duyet.mjs, _acceptance/do-the-duyet-du-du-lieu/probes/db.mjs]
    expected: "exit 0; FILL của sync-cloud.mjs (nạp mã thật) có dq_check_results; trên DB thử sau một lượt --write, câu đọc của bước sync cho bảng đó (selectList + localReadSql của sync-cloud.mjs, không gửi gì ra mạng) trả đủ mọi dòng the-duyet:* của hôm nay; đối chứng đỏ: bản FILL bỏ dq_check_results → bắt 'KHONG LEN CLOUD'; in 'CLOUD OK'"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E5
    criterion: AC-5
    executor: test
    cmd: config:executors.test.dtd_app_nhan
    paths: [app/src/lib/dq-labels.ts, app/tests/dq-the-duyet-label.test.tsx]
    expected: "exit 0; dòng sinh bằng veDong của lệnh thật trên hai kết quả viết trước (đạt / không đạt, ba nguồn) → dqCheckName, dqEntityLabel, dqDetail known: true cho mọi dòng, số assert = số dòng; đối chứng đỏ: detail thiếu khoá → known: false"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E5b
    criterion: AC-5
    executor: script
    cmd: config:executors.script.dtd_on12
    paths: [app/src/lib/dq-labels.ts, pipeline/do-the-duyet.mjs, _acceptance/do-the-duyet-du-du-lieu/probes/on12.sh]
    expected: "exit 0; DB thử riêng sau một lượt --write: ca ON12-AC-5 pass; CONTEXT.md có thuật ngữ chứa 'the-duyet'; in 'ON12 OK'"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E6
    criterion: AC-6
    executor: script
    cmd: config:executors.script.dtd_hom_nay
    paths: [pipeline/do-the-duyet.mjs, _acceptance/do-the-duyet-du-du-lieu/probes/hom-nay.sh]
    expected: "exit 0; lệnh (không --write) trên DB máy thu oneinvest đọc chỉ đọc: tong của ba kiểm đầu = số thẻ entity_match pending đếm bằng câu SQL riêng, có dòng do-day cho mọi nguồn có bên trong thẻ chờ, số dòng dq_check_results trước/sau bằng nhau; số bên anh-ops/anh-admin = số bên mà bộ đọc thật của app (review-media.ts, nạp bằng tsx, vai ops và admin) trả 0 ảnh trên cùng thẻ chờ; in bảng số"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E7
    criterion: AC-7
    executor: script
    cmd: config:executors.script.dtd_pham_vi
    paths: [_acceptance/do-the-duyet-du-du-lieu/probes/pham-vi.sh]
    expected: "exit 0; mọi tệp đổi so merge-base trong danh sách AC-7; in 'PHAM VI OK'; đối chứng: db/migrations/057_x.sql và app/src/lib/ops/review-media.ts → NGOAI PHAM VI"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
