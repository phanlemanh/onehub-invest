<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thước AC-9</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Lora:ital,wght@0,400;1,400&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Lora', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1000px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.25;
      color: var(--color-ink);
      margin-bottom: 0.5rem;
    }
    .sub {
      font-size: 0.875rem;
      color: var(--color-muted);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 760px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Cổng Phạm vi · ops-review-khung-hang-cho · Hỏi-1</p>
    <h1>Thước AC-9 của hồ sơ đã ký: sửa theo Q9, hay giữ độ tin cậy trên thẻ</h1>
    <p class="sub">Hồ sơ đã ký enrich-qua-de-xuat chạm tệp review mà UI1 đổi · nhánh A máy khuyên · AC-6</p>

    <svg viewBox="0 24 1000 528" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
        </marker>
        <marker id="arrow-both" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse">
          <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
        </marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
        </marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/>
        </marker>
      </defs>
      <rect x="0" y="24" width="1000" height="528" fill="#f5f5f5"/>

      <!-- ===================== NỐI (vẽ trước hộp) ===================== -->
      <line x1="500" y1="128" x2="500" y2="160" stroke="#4f5d75" stroke-width="1"/>
      <path d="M268,200 V168 Q268,160 276,160 H724 Q732,160 732,168 V200" fill="none" stroke="#4f5d75" stroke-width="1" marker-start="url(#arrow-both)" marker-end="url(#arrow-both)"/>

      <line x1="268" y1="280" x2="268" y2="312" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <line x1="268" y1="360" x2="268" y2="392" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <line x1="732" y1="280" x2="732" y2="312" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <line x1="732" y1="360" x2="732" y2="392" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>

      <!-- ===================== GỐC ===================== -->
      <rect x="280" y="48" width="440" height="80" rx="6" fill="#f5f5f5"/>
      <rect x="280" y="48" width="440" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="288" y="56" width="40" height="16" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="308" y="68" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">AC-6</text>
      <text x="500" y="92" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Ca test AC-9 của hồ sơ đã ký</text>
      <text x="500" y="112" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle"><tspan font-family="'Geist Mono', monospace" font-weight="500">enrich-qua-de-xuat</tspan> kiểm thẻ hiện "85%"</text>

      <!-- ===================== NHÁNH A · máy khuyên ===================== -->
      <rect x="108" y="200" width="320" height="80" rx="6" fill="#f5f5f5"/>
      <rect x="108" y="200" width="320" height="80" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4"/>
      <rect x="116" y="208" width="104" height="16" rx="2" fill="transparent" stroke="rgba(235,108,54,0.60)" stroke-width="0.8"/>
      <text x="168" y="220" fill="#ba4513" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">A · MÁY KHUYÊN</text>
      <text x="268" y="248" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Sửa theo Q9: ca kiểm VẮNG "%"</text>
      <text x="268" y="268" fill="#636b80" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">Q9 — Mạnh duyệt 26/10, áp ngay cho UI1</text>

      <rect x="108" y="312" width="320" height="48" rx="6" fill="#f5f5f5"/>
      <rect x="108" y="312" width="320" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="268" y="340" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">UI1 qua suite</text>

      <rect x="108" y="392" width="320" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="108" y="392" width="320" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="268" y="424" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Ghim lại <tspan font-family="'Geist Mono', monospace" font-weight="500">enrich-qua-de-xuat</tspan> sau UI1</text>

      <!-- ===================== NHÁNH B ===================== -->
      <rect x="572" y="200" width="320" height="80" rx="6" fill="#f5f5f5"/>
      <rect x="572" y="200" width="320" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="580" y="208" width="24" height="16" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="592" y="220" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">B</text>
      <text x="732" y="248" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Giữ độ tin cậy trên thẻ bổ sung tin</text>
      <text x="732" y="268" fill="#636b80" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">như AC-9 cũ: bảng field · giá trị · độ tin cậy</text>

      <rect x="572" y="312" width="320" height="48" rx="6" fill="#f5f5f5"/>
      <rect x="572" y="312" width="320" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="732" y="340" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Trái Q9 (Mạnh 26/10)</text>

      <rect x="572" y="392" width="320" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="572" y="392" width="320" height="56" rx="6" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.30)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="732" y="424" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Phải hỏi lại Mạnh, UI1 đứng</text>

      <!-- ===================== CHÚ GIẢI ===================== -->
      <line x1="32" y1="480" x2="968" y2="480" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <text x="32" y="500" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.18em">CHÚ GIẢI</text>

      <rect x="32" y="516" width="16" height="16" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4"/>
      <text x="56" y="528" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">nhánh máy khuyên</text>

      <rect x="176" y="516" width="16" height="16" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="200" y="528" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">bước đi tiếp được</text>

      <rect x="324" y="516" width="16" height="16" rx="2" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.30)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="348" y="528" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">dừng — chờ người quyết</text>

      <rect x="504" y="516" width="40" height="16" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="524" y="528" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">AC-n</text>
      <text x="552" y="528" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">tiêu chí của contract UI1 mà câu hỏi chạm</text>
    </svg>
  </div>
</body>
</html>
