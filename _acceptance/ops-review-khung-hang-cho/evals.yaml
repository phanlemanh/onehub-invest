schema_version: 1
feature_slug: ops-review-khung-hang-cho
# Ca test mang tiền tố «RQ-AC-n» trong app/tests/review-queue.test.tsx (jsdom, không DB, fetch/router giả).
# Smoke trình duyệt thật: scripts/smoke-review-queue.mjs — cần app chạy TỪ worktree này (BASE_URL, mặc định :3460 của
# dãy U1) + DB local; đăng nhập bằng tài khoản thử của scripts/dev-ops-account.mjs (role admin) và một tài khoản ops thử
# tạo/xoá trong lượt; số kỳ vọng tính từ DB (cùng truy vấn với trang). Nút quyết định chỉ bấm khi route
# /api/v1/ops/review/*/decide đã bị chặn bằng page.route (phản hồi giả) — đếm review_queue/sale_offers trước và sau.
# Mỗi lượt thêm một thẻ Bổ sung tin thử (tiền tố riêng) để luôn có cả hai loại thẻ chờ; N ở E2 tính SAU khi thêm.
# Mỗi kiểm in «ok …»/«FAIL …», exit 0 = đạt.
evals:
