    criterion: AC-1
    executor: test
    cmd: config:executors.test.app_ui
    paths: [app/src/components/ops/review/**, app/tests/review-queue.test.tsx]
    expected: "exit 0; ca 'RQ-AC-1 bảng' xanh: render ReviewQueue với 6 thẻ mẫu viết trước (ghép căn chờ ×2, bổ sung tin chờ ×1, loại lạ 'source_decision' chờ ×1, ghép căn rejected ×1, bổ sung tin approved ×1; created_at khác nhau) → tiêu đề cột theo thứ tự ['Thẻ','Loại','Trạng thái','Tạo lúc']; mặc định đúng 4 dòng (chỉ chờ), thứ tự id theo created_at giảm dần so TRỌN với danh sách viết trước; đầu Frame đọc '4 thẻ'; ô Loại đọc 'Ghép căn' / 'Bổ sung tin' / 'source_decision'; ô Tạo lúc đọc đúng fmtVnDateTime của created_at mẫu (vd '2026-10-23 06:25 (GMT+7)'). Chiều đỏ (phá-thử S3): bỏ lọc mặc định 'pending' → ca đỏ 'mặc định phải chỉ thẻ chờ (4 dòng)'"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
