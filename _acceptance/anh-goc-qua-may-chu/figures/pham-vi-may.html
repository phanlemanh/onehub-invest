<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Phạm vi máy</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Lora:ital,wght@0,400;1,400&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Lora', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1280px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.25;
      color: var(--color-ink);
      margin-bottom: 0.5rem;
    }
    .sub { font-size: 0.875rem; color: var(--color-muted); margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 1000px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Cổng Phạm vi · anh-goc-qua-may-chu · pham-vi-may</p>
    <h1>Hỏi-1: ảnh S06 qua máy chủ — chỉ máy thu hay cả cloud</h1>
    <p class="sub">AC-1 · AC-3 · AC-7 · hai nhánh, nhánh tô cam là nhánh khuyến nghị</p>

    <svg viewBox="0 0 1248 528" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- ============ Khung nhánh (nền) ============ -->
      <rect x="456" y="40" width="768" height="176" rx="8" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4"/>
      <text x="472" y="62" fill="#ba4513" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.14em">NHÁNH A</text>
      <text x="536" y="62" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Chỉ máy thu (khuyến nghị)</text>

      <rect x="456" y="264" width="768" height="164" rx="8" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="472" y="286" fill="#4f5d75" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.14em">NHÁNH B</text>
      <text x="536" y="286" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Cả cloud ngay</text>

      <!-- ============ Mũi tên (vẽ trước nút) ============ -->
      <line x1="200" y1="232" x2="232" y2="232" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- N2 → A (attach y=216) -->
      <path d="M 408 216 L 424 216 Q 432 216 432 208 L 432 132 Q 432 124 440 124 L 472 124" fill="none" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <!-- N2 → B (attach y=248) -->
      <path d="M 408 248 L 424 248 Q 432 248 432 256 L 432 352 Q 432 360 440 360 L 472 360" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Trong nhánh A -->
      <line x1="696" y1="124" x2="728" y2="124" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <line x1="952" y1="124" x2="984" y2="124" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <!-- Trong nhánh B -->
      <line x1="696" y1="360" x2="728" y2="360" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="952" y1="360" x2="984" y2="360" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- ============ Nút chung ============ -->
      <rect x="24" y="184" width="176" height="96" rx="6" fill="#f5f5f5"/>
      <rect x="24" y="184" width="176" height="96" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="112" y="224" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Người duyệt vai Vận hành</text>
      <text x="112" y="244" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">mở thẻ có tin S06</text>

      <rect x="232" y="184" width="176" height="96" rx="6" fill="#f5f5f5"/>
      <rect x="232" y="184" width="176" height="96" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="320" y="216" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Trình duyệt xin</text>
      <text x="320" y="240" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle">/api/zalo-media</text>
      <text x="320" y="256" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle">?media=&lt;khoá&gt;</text>

      <!-- ============ Nhánh A ============ -->
      <rect x="472" y="76" width="224" height="96" rx="6" fill="#f5f5f5"/>
      <rect x="472" y="76" width="224" height="96" rx="6" fill="#ffffff" stroke="#eb6c36" stroke-width="1"/>
      <text x="584" y="120" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Máy chủ máy thu tra</text>
      <text x="584" y="140" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">dòng media theo khoá</text>

      <rect x="728" y="76" width="224" height="96" rx="6" fill="#f5f5f5"/>
      <rect x="728" y="76" width="224" height="96" rx="6" fill="#ffffff" stroke="#eb6c36" stroke-width="1"/>
      <text x="840" y="108" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Máy chủ tự lấy ảnh từ nguồn</text>
      <text x="840" y="132" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle">(https, chặn địa chỉ riêng,</text>
      <text x="840" y="148" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle">≤ 8 MB, ≤ 8 giây)</text>

      <rect x="984" y="76" width="224" height="96" rx="6" fill="#f5f5f5"/>
      <rect x="984" y="76" width="224" height="96" rx="6" fill="#ffffff" stroke="#eb6c36" stroke-width="1"/>
      <text x="1096" y="120" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Trả byte ảnh —</text>
      <text x="1096" y="140" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">trình duyệt không thấy URL gốc</text>

      <text x="472" y="200" fill="#4f5d75" font-size="16" font-style="italic" font-family="'Instrument Serif', 'Lora', serif">Cloud: chưa có ảnh S06 tới khi TV9</text>

      <!-- ============ Nhánh B ============ -->
      <rect x="472" y="312" width="224" height="96" rx="6" fill="#f5f5f5"/>
      <rect x="472" y="312" width="224" height="96" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.40)" stroke-width="1"/>
      <text x="584" y="356" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Đưa bảng media lên cloud</text>
      <text x="584" y="376" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle">(sync + leak gate)</text>

      <rect x="728" y="312" width="224" height="96" rx="6" fill="#f5f5f5"/>
      <rect x="728" y="312" width="224" height="96" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.40)" stroke-width="1"/>
      <text x="840" y="356" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Máy chủ cloud lấy ảnh</text>
      <text x="840" y="376" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">như nhánh A</text>

      <rect x="984" y="312" width="224" height="96" rx="6" fill="#f5f5f5"/>
      <rect x="984" y="312" width="224" height="96" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.40)" stroke-width="1"/>
      <text x="1096" y="364" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Vòng lớn gấp đôi</text>

      <!-- ============ Chú giải ============ -->
      <line x1="24" y1="460" x2="1224" y2="460" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <text x="24" y="484" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.18em">CHÚ GIẢI</text>
      <rect x="24" y="496" width="24" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="56" y="506" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Bước chung</text>
      <rect x="184" y="496" width="24" height="12" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4"/>
      <text x="216" y="506" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Nhánh khuyến nghị</text>
      <rect x="364" y="496" width="24" height="12" rx="2" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="396" y="506" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Nhánh còn lại</text>
    </svg>
  </div>
</body>
</html>
