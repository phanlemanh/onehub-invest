schema_version: 1
feature_slug: anh-goc-qua-may-chu
# Ca «AGM-AC-n» ở app/tests/anh-goc-qua-may-chu.test.tsx: lõi serveZaloMedia thật với bộ lấy ảnh và bộ tra DNS tiêm giả
# (không gọi mạng thật), lược đồ tạm có bảng media chép khuôn public. Mỗi phép đo mới có cặp hai chiều, thông điệp ghim.
evals:
  - id: E1
    criterion: AC-1
    executor: test
    layer: backend-effect
    cmd: config:executors.test.anh_goc
    paths: [app/src/lib/ops/zalo-media.ts, app/src/lib/ops/lay-anh-goc.ts, app/tests/anh-goc-qua-may-chu.test.tsx]
    expected: "exit 0; ca AGM-AC-1: vai ops, khoá chỉ URL gốc (https://anh.nguon-gia.test/a.jpg), fetch giả trả 3 byte image/jpeg → 200, đúng 3 byte, content-type image/jpeg; thân và mọi header không chứa 'nguon-gia' hay 'anh.nguon-gia.test'; chiều đỏ: bản đột biến chép media_url vào header x-goc → ca đỏ ghim «AGM-AC-1 lộ URL gốc»"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E2
    criterion: AC-2
    executor: test
    cmd: config:executors.test.anh_goc
    paths: [app/src/lib/ops/zalo-media.ts, app/tests/anh-goc-qua-may-chu.test.tsx]
    expected: "exit 0; ca AGM-AC-2: ma trận 5 vai × 3 khoá = 15 ô viết trước, mỗi ô so mã kỳ vọng; ops, admin × hai khoá có thật → 200, mọi ô khác 404; khách, user, viewer: số lần gọi DB giả và fetch giả = 0; chiều đỏ: bản đột biến đổi xemNoiDungTin thành canAccessOps ở nhánh media → ô viewer đỏ ghim «AGM-AC-2 viewer nhận ảnh»"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E3
    criterion: AC-3
    executor: test
    cmd: config:executors.test.anh_goc
    paths: [app/src/lib/ops/zalo-media.ts, app/tests/anh-goc-qua-may-chu.test.tsx]
    expected: "exit 0; ca AGM-AC-3: khoá '../x', khoá rỗng, khoá có ký tự ngoài khuôn, khoá không có dòng, và truy vấn DB ném 42P01 → mỗi ca 404, fetch giả gọi 0 lần; đối chứng dương: khoá có thật → 200"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E4
    criterion: AC-4
    executor: test
    layer: backend-effect
    cmd: config:executors.test.anh_goc
    paths: [app/src/lib/ops/lay-anh-goc.ts, app/tests/anh-goc-qua-may-chu.test.tsx]
    expected: "exit 0; ca AGM-AC-4: ma trận 15 ô viết trước một-một từ bảng chặn — http→403; DNS ra 10.0.0.5, 127.0.0.1, 169.254.1.1, ::1, fd00::1, fe80::1, ::ffff:10.0.0.5 → mỗi ô 403; chuyển hướng tới https://noi-bo.test phân giải 192.168.1.2→403; 4 chuyển hướng→502; nguồn trả 404→502; nguồn trả 500→502; text/html→502; content-length 9 MB→502; không khai độ dài mà stream 9 MB→502; chờ quá 8 giây (đồng hồ giả)→504 — mỗi ô so mã và thân không chứa tên máy; số assert = 15; đối chứng dương: ảnh hợp lệ qua một chuyển hướng hợp lệ → 200; chiều đỏ: bản đột biến bỏ kiểm địa chỉ riêng → ô 10.0.0.5 đỏ ghim «AGM-AC-4 SSRF địa chỉ riêng»; bản đột biến bỏ đếm khi đọc → ô stream đỏ ghim «AGM-AC-4 stream quá cỡ»"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E5
    criterion: AC-5
    executor: test
    layer: backend-effect
    cmd: config:executors.test.anh_goc
    paths: [app/src/lib/ops/review-media.ts, app/tests/anh-goc-qua-may-chu.test.tsx]
    expected: "exit 0; ca AGM-AC-5: thẻ entity_match, bên B có 3 dòng media chỉ URL gốc (khoá k1..k3, tên máy anh.nguon-gia.test), bên A 1 dòng local_file — vai ops và admin: bên B 3 ảnh origin proxy, src đúng /api/zalo-media?media=k1..k3 theo thứ tự, chiGoc không có offer_b; JSON.stringify kết quả không chứa 'nguon-gia'; viewer → {}; chiều đỏ: bản đột biến giữ src = media_url cho admin → ca đỏ ghim «AGM-AC-5 lộ tên máy gốc»"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E6
    criterion: AC-6
    executor: test
    cmd: config:executors.test.anh_goc
    paths: [app/src/lib/ops/zalo-media.ts, app/tests/anh-goc-qua-may-chu.test.tsx]
    expected: "exit 0; ca AGM-AC-6: dòng có local_file trỏ ảnh thật trong SNAPSHOTS_DIR tạm → 200 đúng byte, fetch giả 0 lần; local_file thoát khỏi gốc (../) hay symlink ra ngoài → 403 như chế độ ?snapshot="
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E7
    criterion: AC-7
    executor: test
    layer: backend-effect
    cmd: config:executors.test.anh_goc_doi_chieu
    paths: [app/src/lib/ops/review-media.ts, app/src/components/ops/review-photos.tsx, app/tests/anh-goc-doi-chieu.test.tsx]
    expected: "exit 0; ca AGM-DC trên DB máy thu (READ ONLY, không gọi mạng): chọn một tin S06 có dòng media; loader cho vai ops trả ≥ 1 ảnh proxy; HTML ReviewPhotos dựng từ kết quả không chứa tên máy nào của các media_url của tin (tập tên máy lấy trong ca test, chỉ in số đếm); đối chứng dương: chuỗi media_url thô ghép lại thì bộ quét bắt được ≥ 1 tên máy; trên toàn bảng media: số media_key S03/S05/S06 ngoài khuôn 32 hex = 0 và số media_url không phải https = 0 (chỉ in số)"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E8
    criterion: AC-8
    executor: script
    cmd: config:executors.script.api_surface_static
    paths: [app/src/lib/api-surface.ts, app/src/app/api/zalo-media/route.ts]
    expected: "exit 0; sổ bề mặt API khớp mã sau khi thêm chế độ ?media="
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E9
    criterion: AC-8
    executor: script
    cmd: config:executors.script.portal_static
    paths: [scripts/check-portal-compliance.mjs, app/src/lib/ops/zalo-media.ts, app/src/app/api/zalo-media/route.ts]
    expected: "exit 0; mục 6 xanh và có chiều đỏ mới «chiều đỏ zalo-media: nhánh media gọi lấy ảnh trước xemNoiDungTin → báo»"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E10
    criterion: AC-9
    executor: ui-check
    layer: ui-observed
    paths: [app/src/lib/ops/review-media.ts, app/src/components/ops/review-photos.tsx, app/src/app/api/zalo-media/**]
    steps:
      - "Bản chạy: dev server của worktree dãy U1 ở http://localhost:3460, DB máy thu :5433, đăng nhập tài khoản thử vai Vận hành (node scripts/dev-ops-account.mjs --vai ops; loginState của scripts/ui-capture-login.mjs, không in mật khẩu); không lên thì FAIL «bản chạy :3460 không lên»"
      - "1280 px sáng: /ops/review, lọc trạng thái «Tất cả», mở một thẻ ghép căn có bên S06 → evidence/E10-step1.png (dải ảnh bên S06)"
      - "Lấy tập tên máy của mọi media_url và evidence.image_url của hai tin trên thẻ đang mở từ DB máy thu (chỉ đọc, không in tên); đếm số chỗ khớp trong toàn bộ document.documentElement.outerHTML (kể cả script dữ liệu nhúng của trang) và trong thân các phản hồi mạng của trang; ghi số đếm; đối chứng dương: chèn một media_url thô vào chuỗi đếm thì ra ≥ 1"
    expected: "Phiên vai Vận hành: dải ảnh bên S06 hiện ít nhất một ảnh thật (không phải khung hỏng); mọi src ảnh trong dải bắt đầu bằng /api/zalo-media?media=; số chỗ khớp tên máy gốc trong mã trang và phản hồi mạng = 0; đối chứng dương ra ≥ 1."
    evidence_required: [run_id, screenshot, observed, verifier, verified_at]
