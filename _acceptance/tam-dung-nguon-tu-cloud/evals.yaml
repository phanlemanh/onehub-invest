  - id: E11
    criterion: AC-8
    executor: ui-check
    layer: ui-observed
    paths: [app/src/components/ops/collections/**, app/src/lib/lenh-hien.ts, app/src/app/api/v1/ops/change-requests/route.ts]
    steps: "Từ gốc worktree đang kiểm: dựng DB thử 'bash db/db-thu.sh oneinvest_p4_tv4b' (chép DB local, đủ bảng 091 và tài khoản thử); ghim S05 đang chạy trên DB thử bằng psql trong container one-invest-db (UPDATE source_registry SET status = 'active' WHERE code = 'S05' trên oneinvest_p4_tv4b, không chạm DB chung) rồi kiểm SELECT status trả active; chạy 'DATABASE_URL=postgres://oneinvest:oneinvest@localhost:5433/oneinvest_p4_tv4b node scripts/dev-ops-account.mjs' và cùng DATABASE_URL với '--vai viewer' để có hai tài khoản thử (mật khẩu ở .claude/ops-test-account.json, .claude/viewer-test-account.json, không in ra); chạy app dev ở cổng riêng :3464 với cùng DATABASE_URL ('npm --prefix app run dev -- -p 3464'); mọi URL là http://localhost:3464. Đăng nhập /login bằng tài khoản ops; mở /ops/collections; chụp lưới Sức khoẻ nguồn; bấm 'Tạm dừng' ở hàng S05; chụp hộp thoại khi ô Lý do trống; gõ 'thử TV4b — hết credit'; chụp; bấm 'Gửi lệnh'; chụp vùng 'Lệnh gần đây' và hàng S05. Đăng xuất, đăng nhập tài khoản viewer, mở /ops/collections, chụp lưới. Xong xoá DB thử: 'bash db/db-thu.sh oneinvest_p4_tv4b --xoa'."
    expected: "vai ops: lưới có cột 'Thao tác', hàng S05 có nút 'Tạm dừng'; hộp thoại có tiêu đề nêu S05 và dòng 'Đang chạy → Tạm dừng'; nút 'Gửi lệnh' mờ/tắt khi Lý do trống, bật sau khi gõ; sau gửi có toast 'Đã gửi lệnh tạm dừng S05', vùng 'Lệnh gần đây' có dòng S05 với nhãn 'Chờ máy thu nhận' (và có thể dòng 'Máy thu chưa…'), hàng S05 hiện 'Đang có lệnh chờ' thay cho nút; vai viewer: không có cột 'Thao tác', vùng 'Lệnh gần đây' vẫn đọc được. Giới hạn đã khai: màn chạy trên đường dữ liệu máy thu (trang Thu thập dựng FeedsGrid và vùng lệnh bằng cùng thành phần ở cả hai đường); đường cloud của cùng thành phần do E10 dựng với dữ liệu kiểu bản tin"
    evidence_required: [screenshot, observed, verifier, verified_at]
