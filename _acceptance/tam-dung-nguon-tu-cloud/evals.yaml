schema_version: 1
feature_slug: tam-dung-nguon-tu-cloud
# Ca «TD-AC-n». Bốn executor:
# - tdn_route (app, DB thử của riêng lượt): tests/tam-dung-nguon.test.tsx — handler route thật trên lược đồ tạm chạy 091.
# - tdn_hien (app, không DB): tests/lenh-hien.test.ts — hàm thuần trangThaiLenh, coTheGui, nutNguon.
# - tdn_dau_cuoi (app, DB thử của riêng lượt): tests/tam-dung-dau-cuoi.test.tsx — route → kéo → apLenh → ingest → isRunnable.
# - tdn_ui (app, jsdom, không DB): tests/tam-dung-nguon-ui.test.tsx — hộp thoại và cột Thao tác dựng thật.
evals:
