    criterion: AC-1
    executor: test
    cmd: config:executors.test.tdn_route
    paths: [app/src/app/api/v1/ops/change-requests/route.ts, app/tests/tam-dung-nguon.test.tsx]
    expected: "exit 0; ca 'TD-AC-1' trên lược đồ tạm chạy 091: vai ops POST source.pause S05 reason 'hết credit' tu_duyet true → 201, SELECT status, approved_by, requested_by, decided_at deepEqual {status:'approved', approved_by: actor, requested_by: actor, decided_at khác null}; ops_audit tăng đúng 2 dòng với action ['change_request.create','change_request.decide']; cùng lời gọi không tu_duyet → status 'submitted', audit tăng 1; viewer → 403; ops gửi source.resume tu_duyet → 403 và đếm change_requests không đổi; admin gửi source.resume S05 tu_duyet → 'approved'; cùng giao dịch: bản sao route làm lần ghi audit 'change_request.decide' ném lỗi → POST trả 5xx, đếm change_requests và ops_audit deepEqual trước (không còn lệnh treo ở 'submitted'); đối chứng đỏ: bản sao route bỏ nhánh tu_duyet thì ô ops pause tu_duyet ra 'submitted', ca nêu 'tu-duyet'"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
