evals:
  - id: E1
    criterion: AC-1
    executor: script
    layer: backend-effect
    cmd: bash _acceptance/cham-bong-cau-tra-loi-khong-bi-cat/probes/cham.sh AC-1
    paths: [agent/src/enrich/cham-bong/**, agent/tests/cham-bong-cau-tra-loi-khong-bi-cat.test.ts]
    expected: "Ma trận viết tay n = 1..5 ô: tranTokenRa(n) bằng 1000, 1600, 2200, 2800, 3400 (5 assert). docMot với model giả lập bắt tham số: thẻ n ô truyền đúng trần 400 + 600 × n tới lớp gọi (5 assert). goiModelThat với lớp Anthropic giả và lớp Gateway giả (không gọi mạng) truyền trần vào max_tokens và maxOutputTokens (2 assert). Đột biến trong bản sao (trả hằng 1000; quên truyền trần sang đường Gateway) đỏ, thông điệp nêu n và trần nhận được."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E2
    criterion: AC-2
    executor: script
    layer: backend-effect
    cmd: bash _acceptance/cham-bong-cau-tra-loi-khong-bi-cat/probes/cham.sh AC-2
    paths: [agent/src/enrich/cham-bong/**, agent/tests/cham-bong-cau-tra-loi-khong-bi-cat.test.ts]
    expected: "Model giả lập trả cat=true với hai dạng chữ: JSON cụt không tách được, và JSON đầy đủ tách được. Cả hai: lần đọc ok=false, loi=bi-cat; sổ gọi đúng một dòng loi=bi-cat với token ra thật (1600); kho không nhận lần đọc. Lớp Anthropic giả stop_reason=max_tokens và lớp Gateway giả finishReason=length cho cat=true; stop_reason=end_turn / finishReason=stop cho cat=false. Đối chứng dương: cùng chữ JSON đầy đủ với cat=false là lần đọc thành công. Lượt trên Truy giả: thẻ có lần đọc Haiku bị cắt (JSON tách được) và lần đọc DeepSeek ok → kho đúng 1 dòng (DeepSeek), tệp kết quả có kết cục null cho ô của thẻ (không kết cục giả từ câu cụt). Đột biến bỏ kiểm cat (dùng JSON đã tách khi bị cắt) đỏ, thông điệp nêu «bi-cat» và lỗi nhận được."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E3
    criterion: AC-3
    executor: script
    layer: backend-effect
    cmd: bash _acceptance/cham-bong-cau-tra-loi-khong-bi-cat/probes/cham.sh AC-3
    paths: [agent/src/enrich/cham-bong/**, agent/tests/cham-bong-cau-tra-loi-khong-bi-cat.test.ts]
    expected: "Ma trận viết tay 2 × 2 (cat true/false × JSON tách được/không): false+tách được → ok; false+không → json-hong; true+tách được → bi-cat; true+không → bi-cat (4 assert, mỗi ô thông điệp nêu ô). Đột biến xếp cat=true thành json-hong khi JSON hỏng đỏ, thông điệp nêu ô «cắt + JSON hỏng»."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E4
    criterion: AC-4
    executor: script
    layer: backend-effect
    cmd: bash _acceptance/cham-bong-cau-tra-loi-khong-bi-cat/probes/cham.sh AC-4
    paths: [agent/src/enrich/cham-bong/**, agent/tests/cham-bong-cau-tra-loi-khong-bi-cat.test.ts]
    expected: "Lượt chạy trên Truy giả (không DB) gồm 3 thẻ × 2 model, model giả lập trả lần lượt: ok, bi-cat, json-hong, ném lỗi 500, ok, bi-cat. tong-ket.json có loi_goi 4 và loi_theo_ly_do viết tay {bi-cat: 2, json-hong: 1, <lớp lỗi 500>: 1}, tổng bằng loi_goi; dòng báo cáo in «bi-cat 2» và «json-hong 1». Đột biến đếm mọi lỗi vào json-hong đỏ, thông điệp nêu lý do và số lệch."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E5
    criterion: AC-5
    executor: script
    layer: backend-effect
    cmd: bash _acceptance/cham-bong-cau-tra-loi-khong-bi-cat/probes/cham.sh AC-5
