<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Soi gateway S03</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Lora:ital,wght@0,400;1,400&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Lora', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1360px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.25;
      color: var(--color-ink);
      margin-bottom: 0.5rem;
    }
    .sub {
      font-size: 0.875rem;
      color: var(--color-muted);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 960px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Cổng Phạm vi · so-nhom-mot-noi · T3 · Hỏi-4</p>
    <h1>Soi gateway: một đơn vị S03 qua các lượt đồng bộ</h1>
    <p class="sub">Trạng thái S03 trong sổ là bản soi cấu hình gateway · sync-don-vi chỉ đọc · AC-3 · AC-5</p>

    <svg viewBox="0 0 1360 736" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect x="0" y="0" width="1360" height="736" fill="#f5f5f5"/>

      <!-- ===================== VÙNG DO SYNC GIỮ (nền) ===================== -->
      <rect x="304" y="32" width="744" height="440" rx="6" fill="none" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="320" y="56" fill="#4f5d75" font-size="8" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.18em">DO SYNC-DON-VI GIỮ</text>
      <rect x="996" y="44" width="44" height="16" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="1018" y="56" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">AC-5</text>

      <!-- ===================== ARROWS (trước hộp) ===================== -->
      <!-- khởi đầu → chưa có dòng -->
      <line x1="54" y1="272" x2="68" y2="272" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- T1 chưa có dòng → active: bật -->
      <path d="M216 256 H248 Q256 256 256 248 V152 Q256 144 264 144 H396" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- T2 chưa có dòng → paused tắt: tắt -->
      <path d="M216 288 H248 Q256 288 256 296 V392 Q256 400 264 400 H396" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- T3 active → paused tắt -->
      <line x1="468" y1="184" x2="468" y2="356" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- T4 paused tắt → active -->
      <line x1="532" y1="360" x2="532" y2="188" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- T5 active → không còn -->
      <path d="M600 128 H792 Q800 128 800 136 V220" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- T6 paused tắt → không còn -->
      <path d="M600 416 H792 Q800 416 800 408 V324" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- T7 không còn → active: quay lại, cùng dòng cùng mã (trọng tâm) -->
      <path d="M960 224 V88 Q960 80 952 80 H508 Q500 80 500 88 V100" fill="none" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <!-- admin đổi tay → retired (ngoài sync) -->
      <line x1="1048" y1="400" x2="1140" y2="400" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>

      <!-- arrow labels -->
      <rect x="336" y="120" width="40" height="16" rx="2" fill="#f5f5f5"/>
      <text x="356" y="132" fill="#636b80" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">BẬT</text>
      <rect x="336" y="376" width="40" height="16" rx="2" fill="#f5f5f5"/>
      <text x="356" y="388" fill="#636b80" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">TẮT</text>
      <rect x="420" y="264" width="40" height="16" rx="2" fill="#f5f5f5"/>
      <text x="440" y="276" fill="#636b80" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">TẮT</text>
      <rect x="540" y="264" width="40" height="16" rx="2" fill="#f5f5f5"/>
      <text x="560" y="276" fill="#636b80" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">BẬT</text>
      <rect x="652" y="104" width="96" height="16" rx="2" fill="#f5f5f5"/>
      <text x="700" y="116" fill="#636b80" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">BIẾN MẤT</text>
      <rect x="652" y="392" width="96" height="16" rx="2" fill="#f5f5f5"/>
      <text x="700" y="404" fill="#636b80" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">BIẾN MẤT</text>
      <rect x="616" y="56" width="224" height="16" rx="2" fill="#f5f5f5"/>
      <text x="728" y="68" fill="#ba4513" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">QUAY LẠI · CÙNG DÒNG, CÙNG MÃ</text>
      <rect x="1052" y="376" width="84" height="16" rx="2" fill="#f5f5f5"/>
      <text x="1094" y="388" fill="#636b80" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ADMIN ĐỔI TAY</text>

      <!-- ===================== TRẠNG THÁI ===================== -->
      <!-- khởi đầu -->
      <circle cx="48" cy="272" r="6" fill="#2d3142"/>

      <!-- chưa có dòng -->
      <rect x="72" y="232" width="144" height="80" rx="8" fill="#f5f5f5"/>
      <rect x="72" y="232" width="144" height="80" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="164" y="240" width="44" height="16" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="186" y="252" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">AC-3</text>
      <text x="144" y="280" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">chưa có dòng</text>
      <text x="144" y="296" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">chèn → cấp mã mới</text>

      <!-- active -->
      <rect x="400" y="104" width="200" height="80" rx="8" fill="#f5f5f5"/>
      <rect x="400" y="104" width="200" height="80" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="500" y="140" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">active</text>
      <text x="500" y="156" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">bật ở gateway</text>

      <!-- paused — tắt ở gateway -->
      <rect x="400" y="360" width="200" height="80" rx="8" fill="#f5f5f5"/>
      <rect x="400" y="360" width="200" height="80" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="500" y="396" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">paused</text>
      <text x="500" y="412" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">lý do «tắt ở gateway»</text>

      <!-- paused — không còn ở gateway (Hỏi-4, trọng tâm) -->
      <rect x="760" y="224" width="240" height="96" rx="8" fill="#f5f5f5"/>
      <rect x="760" y="224" width="240" height="96" rx="8" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4"/>
      <rect x="768" y="232" width="48" height="16" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="792" y="244" fill="#ba4513" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">HỎI-4</text>
      <rect x="908" y="232" width="84" height="16" rx="2" fill="transparent" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>
      <text x="950" y="244" fill="#ba4513" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">KHUYẾN NGHỊ</text>
      <text x="880" y="276" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">paused</text>
      <text x="880" y="292" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">lý do «không còn ở gateway»</text>
      <text x="880" y="306" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">không xoá dòng</text>

      <!-- retired (ngoài sync) -->
      <rect x="1144" y="360" width="180" height="80" rx="8" fill="#f5f5f5"/>
      <rect x="1144" y="360" width="180" height="80" rx="8" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="1234" y="392" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">retired</text>
      <text x="1234" y="408" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">chỉ admin đổi tay</text>
      <text x="1234" y="422" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">không do sync</text>

      <!-- ===================== NHÁNH LỖI ===================== -->
      <rect x="304" y="504" width="744" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="304" y="504" width="744" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="312" y="512" width="36" height="16" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="330" y="524" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">LỖI</text>
      <rect x="996" y="512" width="44" height="16" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="1018" y="524" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">AC-5</text>
      <text x="676" y="536" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">mọi trạng thái · tệp cấu hình thiếu hay hỏng → thoát ≠ 0</text>
      <text x="676" y="552" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">sổ không đổi · không đốt mã nhóm nào</text>

      <!-- ghi chú -->
      <text x="36" y="608" fill="#636b80" font-size="9" font-family="'Geist Mono', monospace">sync không ghi một byte vào cấu hình gateway (băm trước/sau bằng nhau)</text>
      <text x="36" y="628" fill="#636b80" font-size="9" font-family="'Geist Mono', monospace">lối khác của Hỏi-4: biến mất → retired (mất mã, không quay lại)</text>

      <!-- ===================== LEGEND ===================== -->
      <line x1="36" y1="656" x2="1324" y2="656" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <text x="36" y="676" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.18em">CHÚ GIẢI</text>

      <circle cx="44" cy="700" r="6" fill="#2d3142"/>
      <text x="60" y="704" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Khởi đầu</text>

      <rect x="124" y="694" width="16" height="12" rx="3" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="148" y="704" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Trạng thái do sync đặt</text>

      <rect x="272" y="694" width="16" height="12" rx="3" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4"/>
      <text x="296" y="704" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Trọng tâm: Hỏi-4 · quay lại cùng mã</text>

      <rect x="480" y="694" width="16" height="12" rx="3" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="504" y="704" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">retired: ngoài sync</text>

      <line x1="664" y1="700" x2="696" y2="700" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="708" y="704" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Lượt sync thấy ở gateway</text>

      <line x1="852" y1="700" x2="884" y2="700" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <text x="896" y="704" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Người đổi tay</text>

      <rect x="984" y="692" width="40" height="16" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="1004" y="704" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">AC-n</text>
      <text x="1032" y="704" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Tiêu chí liên quan</text>
    </svg>
  </div>
</body>
</html>
