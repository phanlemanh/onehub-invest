    expected: "exit 0; ca 'SN-AC-1': lược đồ sau 047 có 4 nhóm (S05 active, S05 paused lý do 'x', S06 active, S06 retired); chạy migration hai lần: pg_class có bảng collection_units (relkind r) và source_groups (relkind v); số dòng, id, status, enabled, params deepEqual trước; trigger source_groups_dong_bo_enabled nằm trên collection_units; năm CHECK của 047 còn đủ tên; view chỉ trả dòng S05, S06; ảnh chụp sau lần 2 deepEqual sau lần 1; đối chứng: trên bản sao bỏ điều kiện WHERE của view thì một đơn vị S03 chèn thêm hiện trong view — ca đỏ nêu 'view lộ đơn vị ngoài S05/S06'"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
