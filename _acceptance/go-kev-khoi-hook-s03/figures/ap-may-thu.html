<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Áp KEV1 lên máy thu</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Lora:ital,wght@0,400;1,400&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Lora', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Áp lên máy thu · KEV1 · AC-9 · AC-5</p>
    <h1>Áp KEV1 lên máy thu: sáu bước, hai nhánh lùi</h1>

    <svg viewBox="0 0 1200 920" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Làn -->
      <line x1="40" y1="40" x2="1160" y2="40" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <line x1="40" y1="88" x2="1160" y2="88" stroke="rgba(45,49,66,0.10)" stroke-width="1"/>
      <line x1="40" y1="840" x2="1160" y2="840" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <line x1="560" y1="40" x2="560" y2="840" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>

      <text x="56" y="60" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.14em">CÓ HIỆU LỰC KHI PULL</text>
      <text x="56" y="76" fill="#636b80" font-size="9" font-family="'Geist', sans-serif">watchdog chạy thẳng từ checkout chính</text>
      <text x="576" y="60" fill="#ba4513" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.14em">CẦN LỜI RIÊNG CỦA MẠNH</text>
      <text x="576" y="76" fill="#636b80" font-size="9" font-family="'Geist', sans-serif">hook chạy từ bản cài — chữ ký Cổng Bằng chứng phủ việc khởi động lại gateway</text>

      <!-- Mũi tên (vẽ trước) -->
      <line x1="300" y1="168" x2="300" y2="198" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="300" y1="264" x2="300" y2="294" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- thấy nhịp → sang làn phải -->
      <line x1="388" y1="344" x2="718" y2="344" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- không thấy → lùi watchdog -->
      <line x1="300" y1="392" x2="300" y2="446" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>

      <line x1="800" y1="376" x2="800" y2="406" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="800" y1="472" x2="800" y2="502" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="800" y1="576" x2="800" y2="614" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="800" y1="712" x2="800" y2="758" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- không đạt → lùi hook -->
      <line x1="888" y1="664" x2="958" y2="664" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>

      <!-- Nhãn mũi tên -->
      <rect x="448" y="320" width="64" height="12" rx="2" fill="#f5f5f5"/>
      <text x="480" y="329" fill="#636b80" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">THẤY NHỊP</text>
      <rect x="312" y="408" width="72" height="12" rx="2" fill="#f5f5f5"/>
      <text x="312" y="417" fill="#636b80" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">KHÔNG THẤY</text>
      <rect x="812" y="728" width="40" height="12" rx="2" fill="#f5f5f5"/>
      <text x="812" y="737" fill="#636b80" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">ĐẠT</text>
      <rect x="892" y="640" width="64" height="12" rx="2" fill="#f5f5f5"/>
      <text x="924" y="649" fill="#636b80" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">KHÔNG ĐẠT</text>

      <!-- Chú thích: không chữ ký thì dừng -->
      <text x="408" y="372" fill="#4f5d75" font-size="12" font-style="italic" font-family="'Instrument Serif', 'Lora', serif">chưa có chữ ký →</text>
      <text x="408" y="388" fill="#4f5d75" font-size="12" font-style="italic" font-family="'Instrument Serif', 'Lora', serif">dừng sau bước pull</text>

      <!-- Làn trái -->
      <rect x="220" y="104" width="160" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="220" y="104" width="160" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="300" y="132" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Gộp PR</text>
      <text x="300" y="150" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">GS · gh pr merge</text>

      <rect x="220" y="200" width="160" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="220" y="200" width="160" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="300" y="228" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Pull checkout chính</text>
      <text x="300" y="246" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">watchdog K1 chạy ngay</text>

      <polygon points="300,296 388,344 300,392 212,344" fill="#f5f5f5"/>
      <polygon points="300,296 388,344 300,392 212,344" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="300" y="336" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Nhịp watchdog</text>
      <text x="300" y="352" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">kev:off (K1)</text>
      <text x="300" y="366" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">≤10′ · AC-5</text>

      <rect x="220" y="448" width="160" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="220" y="448" width="160" height="64" rx="6" fill="#ffffff" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4"/>
      <text x="300" y="472" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Lùi watchdog</text>
      <text x="300" y="488" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">git revert + pull</text>
      <text x="300" y="502" fill="#636b80" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">báo GS</text>

      <!-- Làn phải -->
      <rect x="720" y="312" width="160" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="720" y="312" width="160" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="800" y="340" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Sao lưu hook</text>
      <text x="800" y="358" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">bản .bak + mốc độ dài log</text>

      <rect x="720" y="408" width="160" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="720" y="408" width="160" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="800" y="436" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Chép hook</text>
      <text x="800" y="454" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">HOOK.md + handler.js</text>

      <rect x="720" y="504" width="160" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="720" y="504" width="160" height="72" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4"/>
      <text x="800" y="528" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Khởi động lại gateway</text>
      <text x="800" y="546" fill="#ba4513" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">lời riêng của Mạnh</text>
      <text x="800" y="562" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">ngoài 05:30–06:30 · 14:00–14:45</text>

      <polygon points="800,616 888,664 800,712 712,664" fill="#f5f5f5"/>
      <polygon points="800,616 888,664 800,712 712,664" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="800" y="660" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Kiểm sau</text>
      <text x="800" y="674" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">kiem-sau.sh</text>
      <text x="800" y="688" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">≤30′ · AC-9</text>

      <rect x="720" y="760" width="160" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="720" y="760" width="160" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1.4"/>
      <text x="800" y="784" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">ĐẠT</text>
      <text x="800" y="802" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">ghi cạnh số chạy thử</text>

      <rect x="960" y="632" width="160" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="960" y="632" width="160" height="64" rx="6" fill="#ffffff" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4"/>
      <text x="1040" y="656" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Lùi hook</text>
      <text x="1040" y="672" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">chép .bak + khởi động lại</text>
      <text x="1040" y="686" fill="#636b80" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">báo GS</text>

      <!-- Chú giải -->
      <line x1="40" y1="860" x2="1160" y2="860" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="880" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">CHÚ GIẢI</text>

      <rect x="40" y="892" width="16" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="64" y="902" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Bước</text>

      <polygon points="152,892 160,898 152,904 144,898" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="168" y="902" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Điểm kiểm</text>

      <rect x="256" y="892" width="16" height="12" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4"/>
      <text x="280" y="902" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Bước cần lời riêng của Mạnh</text>

      <rect x="440" y="892" width="16" height="12" rx="2" fill="#ffffff" stroke="#4f5d75" stroke-width="1" stroke-dasharray="3,2"/>
      <text x="464" y="902" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Nhánh lùi (≈1′, không đụng dữ liệu)</text>

      <line x1="664" y1="898" x2="692" y2="898" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="700" y="902" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Nối tiếp</text>
    </svg>
  </div>
</body>
</html>
