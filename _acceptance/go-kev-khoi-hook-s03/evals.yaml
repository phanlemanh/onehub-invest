schema_version: 1
feature_slug: go-kev-khoi-hook-s03
evals:
  - id: E1
    criterion: AC-1
    executor: test
    cmd: config:executors.script.kev1_handler_test
    paths: [collector/openclaw/handler.js, collector/openclaw/handler.test.mjs]
    expected: "exit 0; 5/5 pass, 0 fail; ca «tin-giả: đúng 1 lần đẩy tới cổng thu, KHÔNG gọi cổng chấm nào» xanh; hai ca tự phá trong bộ (P1 bỏ trường kev → ca khuôn-kev đỏ; P2 chèn lại lời gọi cổng chấm → fetch giả thấy URL) chạy và đạt — chiều đỏ ghim trong chính bộ test. Đột biến LL 24/11: chèn lại lời gọi :8009 vào handler.js → 4/5."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E2
    criterion: AC-1
    executor: script
    cmd: config:executors.script.kev_handler_label
    paths: [collector/openclaw/handler.js, scripts/kev-nhan/acceptance.mjs]
    expected: "exit 0; stdout có 'HANDLER-LABEL PASS'; dòng 'khuôn kev-off: … POST tới collector 4 … gọi cổng chấm 0 lần' (cổng chấm giả SỐNG); 'cổng đóng hẳn: POST 1 · p = null · gọi cổng chấm 0 lần'; mục 'KHÔNG lời gọi nào tới cổng chấm nhãn kể cả khi cổng sống (K1)' ok. Chiều đỏ (đo 24/11): acceptance.mjs của nhánh chạy trên handler.js của main be765e6a5 (hook cũ gọi Kev) → 'HANDLER-LABEL FAIL (4 mục)', gồm mục KHÔNG lời gọi … (K1)."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E3
    criterion: AC-2
    executor: script
    cmd: config:executors.script.kev_handler_label
    paths: [collector/openclaw/handler.js, scripts/kev-nhan/acceptance.mjs]
    expected: "exit 0; mục 'mọi tin kev.p = null', 'mọi tin có meta.kev đủ {p, model, threshold, at} với model kev-off', 'POST đúng /agent-report với khoá trong HOME giả', '4 tin có chữ của zalouser đều được đẩy — kể cả p=0.2' đều ok; should-NOT-fire: tin rỗng không ảnh vẫn không đẩy, kênh khác không đẩy (các mục cuối của mode)."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E4
    criterion: AC-3
    executor: script
    cmd: config:executors.script.hsn_zc6_regress
    paths: [collector/openclaw/handler.js, scripts/hook-zalo-spool/acceptance.mjs]
    expected: "exit 0; sáu dòng PASS: SPOOL-REPLAY (dòng log tin mới đúng khuôn ' post 202 {\"accepted\":1…} group=…' và tin kèm kev khuôn tắt p=null model kev-off), REJECT-4XX, HANG-STOP, CAP-50, KEV-HANG (hook không treo, '< 12' giây, log dòng post mang kev=off), SELF-CONTAINED."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E5
    criterion: AC-3
    executor: script
    cmd: config:executors.script.kev_handler_label
    paths: [collector/openclaw/handler.js, scripts/kev-nhan/acceptance.mjs]
    expected: "exit 0; mục 'log hook không còn dòng skip p=' và 'log dòng post mang kev=off' ok; log hộp cát không có chuỗi 'kev null'."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E6
    criterion: AC-4
    executor: script
    cmd: config:executors.script.kev1_hsn_regress
    paths: [collector/openclaw/handler.js, scripts/hook-spool-nghiem-ngat/acceptance.mjs]
    expected: "exit 0; sáu dòng PASS: AUTH-HELD, HELD-THEN-HANG, REJECT-PERM, TAM-THOI, BUDGET (~40 giây), BUDGET-ENV — các ca bảo vệ hook ZC6 nối tiếp không đổi khi bỏ cổng chấm."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E7
    criterion: AC-4
    executor: script
    cmd: config:executors.script.hsn_l1_syntax
    paths: [collector/openclaw/handler.js, scripts/hook-zalo-spool/acceptance.mjs]
    expected: "exit 0; 'L1-GREP PASS' (handler không có API gửi tin, L1 của watchdog bắt bản cấy) và 'SYNTAX OK' (node --check handler.js)."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E8
    criterion: AC-5
    executor: script
    cmd: config:executors.script.kev1_khong_con_kev
    paths: [scripts/zalo-watchdog.sh, pipeline/cron/**, collector/openclaw/**, docs/ops/runtime-map.md, _acceptance/go-kev-khoi-hook-s03/probes/**]
    expected: "exit 0; 'KHONG-CON-KEV PASS' trên cây; rồi tự phá trên bản chép: đối chứng lành xanh, và tám ca đỏ đúng mốc ghim — chen-probe-8009 → FAIL watchdog-con-canh-kev, bo-kev-note → FAIL watchdog-thieu-nhip-kev-off, nhip-mat-note → FAIL watchdog-nhip-ok-mat-kev-note, vo-cu-phap → FAIL watchdog-cu-phap, tra-plist → FAIL plist-kev-gate-con, plist-khac-tro → FAIL plist-tro-kev, hook-goi-lai → FAIL hook-con-goi-kev, doc-tra-kev → FAIL tai-lieu-con-kev; 'KHONG-CON-KEV TU-THU PASS'. Trên main be765e6a5 cây đỏ ở đủ bốn nhóm mốc (đo 24/11)."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E9
    criterion: AC-5
    executor: script
    cmd: config:executors.script.kev_watchdog_l1
    paths: [scripts/zalo-watchdog.sh, scripts/kev-nhan/acceptance.mjs]
    expected: "exit 0; 'WATCHDOG-L1 PASS'; đối chứng: bản cấy «send-message» vào handler → L1 khớp (lớp L1 vẫn sống sau khi gỡ khối canh Kev)."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E10
    criterion: AC-6
    executor: test
    cmd: config:executors.test.job_exit
    paths: [scripts/job-exit.test.mjs, pipeline/cron/**]
    expected: "exit 0; 0 fail (LL đo 24/11: 81/81); plist kev-gate vắng không làm ca nào đỏ. Phần 'không plist kev-gate, không plist trỏ cổng chấm' đo ở E8 (mốc plist-kev-gate-con, plist-tro-kev)."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E11
    criterion: AC-7
    executor: test
    cmd: config:executors.script.collector_test_clean
    paths: [collector/**]
    expected: "exit 0; 0 fail, 0 skip (LL đo 24/11: 78/78) — gồm ca kev-nhãn manifest v3 và ZC1."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E12
    criterion: AC-7
    executor: script
    cmd: config:executors.script.kev_manifest_v3
    paths: [collector/**, scripts/kev-nhan/acceptance.mjs]
    expected: "exit 0; 'MANIFEST-V3 PASS'; meta.kev giữ nguyên; should-NOT-fire: tin không kev không có meta.kev."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E13
    criterion: AC-7
    executor: test
    cmd: config:executors.suite.pipeline_a
    long_running: 90
    paths: [pipeline/**, scripts/**]
    expected: "exit 0; nửa A bộ test pipeline, 0 fail (khai ở đây để có long_running 90 — trên Mac mini nửa A ~41′ vượt trần chờ 30′ mặc định; luật GS 24/11)."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E14
    criterion: AC-7
    executor: test
    cmd: config:executors.suite.pipeline_b
    long_running: 90
    paths: [pipeline/**, scripts/**]
    expected: "exit 0; nửa B bộ test pipeline, 0 fail (long_running 90)."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E15
    criterion: AC-8
    executor: script
    cmd: config:executors.script.kev1_khong_con_kev
    paths: [collector/openclaw/HOOK.md, collector/openclaw/README.md, docs/ops/runtime-map.md, _acceptance/go-kev-khoi-hook-s03/probes/**]
    expected: "exit 0; trên cây không có dòng 'FAIL tai-lieu-con-kev'; ca tự phá doc-tra-kev (chèn '→ Kev → :9210' vào runtime-map bản chép) → 'FAIL tai-lieu-con-kev' — chiều đỏ ghim."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E16
    criterion: AC-9
    executor: script
    cmd: config:executors.script.kev1_ap_may_thu
    paths: [_acceptance/go-kev-khoi-hook-s03/ap-may-thu/**]
    expected: "exit 0; README có năm mục 1–5, dòng 'lời riêng của Mạnh', lệnh 'launchctl kickstart -k gui/$(id -u)/ai.openclaw.gateway', khung '05:30–06:30 … 14:00–14:45'; bảy ca kiem-sau.sh: dat → 'ĐẠT — 3 dòng post 202 kev=off'; con-kev-null, hook-cu, khong-tin, watchdog-cu, watchdog-khong-ok, canh-bao-kev → 'KHÔNG ĐẠT — <lý do đúng>' mã 1; 'AP-MAY-THU PASS'. Phá đo 24/11 trên bản chép: tắt kiểm kev null → ca con-kev-null đỏ; xoá dòng lời riêng → 'FAIL README thiếu dòng lời riêng'."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
