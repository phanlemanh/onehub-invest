schema_version: 1
feature_slug: install-cron-chi
evals:
  - id: E1
    criterion: AC-1
    executor: test
    cmd: config:executors.test.icc_test
    expected: "exit 0; ca «vắng cờ: đủ 3 job như hành vi cũ» xanh"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E2
    criterion: AC-2
    executor: test
    cmd: config:executors.test.icc_test
    expected: "exit 0; ca «--chi backup: CHỈ backup được cài» và «BACKUP_DIR vào plist backup» xanh; should-NOT-fire: không plist collector/smoke, launchctl không đụng chúng"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E3
    criterion: AC-3
    executor: script
    cmd: config:executors.script.icc_keychain
    expected: "exit 0; 'KEYCHAIN OK'; should-NOT-fire: mật khẩu không có trong plist, đối số security, output, lời gọi launchctl"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E4
    criterion: AC-4
    executor: test
    cmd: config:executors.test.icc_test
    expected: "exit 0; ca «tên job lạ → thoát 2, KHÔNG ghi plist nào» và «--chi trơn → thoát 2, không plist nào» xanh; should-NOT-fire: không plist nào được ghi"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E5
    criterion: AC-5
    executor: script
    cmd: config:executors.script.icc_scope
    expected: "exit 0; 'SCOPE OK'; should-NOT-fire không dòng 'NGOÀI PHẠM VI'"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
