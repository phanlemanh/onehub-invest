schema_version: 1
feature_slug: trang-chi-tiet-tin
# Ca mang tiền tố «TCT-AC-n». jsdom: app/tests/trang-chi-tiet-tin.test.tsx. Route và truy vấn thật trên DB thử: app/tests/trang-chi-tiet-tin-db.test.tsx.
evals:
  - id: E1
    criterion: AC-1
    executor: test
    cmd: config:executors.test.tct_ui
    paths: [app/src/components/listing/offer-card.tsx, app/tests/trang-chi-tiet-tin.test.tsx]
    expected: "exit 0; ca 'TCT-AC-1' xanh: thẻ có một liên kết chính tới /listing/<offer_id>, ba phần tử có việc riêng không nằm trong liên kết chính; bản sao bỏ liên kết chính đỏ, thông điệp ghim TCT-AC-1"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E1u
    criterion: AC-1
    executor: ui-check
    layer: ui-observed
    route: /vn/hanoi/listings/sale
    paths: [app/src/components/listing/offer-card.tsx, app/src/components/listing/listing-card.tsx]
    steps:
      - "Dev server từ gốc worktree đang kiểm, cổng riêng: npm --prefix app run dev -- -p 3462, DATABASE_URL trỏ DB thử oneinvest_tct"
      - "Ghi trước ma trận: ba lối vào (thẻ Bán, thẻ Cho thuê dài hạn, khối tin cùng tiêu chí) × bảy điểm bấm (thân, giá, tên người đăng, địa chỉ, liên kết phường, nhãn, Xem số)"
      - "Bấm bằng toạ độ thật từng ô; ghi URL sau khi bấm; chụp evidence/E1u-<lối>-<điểm>.png"
    expected: "Thân, giá, tên, địa chỉ: URL thành /listing/<offer_id>. Liên kết phường: tới trang phường. Nhãn: mở lời giải thích, URL không đổi. Xem số: URL không đổi. Đủ mọi ô của ma trận"
    evidence_required: [screenshot, observed, verifier, verified_at]
