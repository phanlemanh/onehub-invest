schema_version: 1
feature_slug: job-bao-loi-that
# Mọi eval máy chạy cùng một lệnh (node --test scripts/*.test.mjs) — mỗi eval đọc các ca mang tiền tố AC
# của nó trong đầu ra TAP. Ca hỏng in tên ca + thông điệp ghim (tên job/bước).
evals:
  - id: E1
    criterion: AC-1
    executor: test
    cmd: config:executors.test.scripts
    paths: [scripts/chotot-daily.sh, scripts/lib/job-step.sh, scripts/job-exit.test.mjs]
    expected: "exit 0; mọi ca 'AC-1 chotot-daily …' ok: 'mọi bước lành → 0, nhật ký lời gọi khớp dãy viết trước'; ba ca '<bước> hỏng → ≠0, dòng ghim, bước sau vẫn chạy' (transform-chotot, refresh-bait-gap, resolve-properties); 'hai bước hỏng → thoát mã bước hỏng đầu (3), hai dòng ghim'; và 'bản đột biến bỏ ghi mã sau <bước> → bị bắt' — chiều đỏ: ca đột biến chạy chính hàm kiểm trên bản sao bỏ ghi mã và đòi hàm kiểm trả lỗi nêu tên bước"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E2
    criterion: AC-2
    executor: test
    cmd: config:executors.test.scripts
    paths: [scripts/apify-facebook-daily.sh, scripts/lib/job-step.sh, scripts/job-exit.test.mjs]
    expected: "exit 0; mọi ca 'AC-2 apify-facebook-daily …' ok: mọi bước lành → 0 + nhật ký khớp dãy; transform-fb / refresh-bait-gap hỏng → ≠0, dòng 'JOB FAIL [apify-facebook-daily] bước <bước> mã 1', bước sau vẫn chạy; ca đột biến bỏ ghi mã → bị bắt, thông điệp nêu tên bước"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E3
    criterion: AC-3
    executor: test
    cmd: config:executors.test.scripts
    paths: [scripts/chotot-daily.sh, scripts/apify-facebook-daily.sh, scripts/airdna-daily.sh, scripts/cloud-sync.sh, pipeline/finalize-hanoi.sh, scripts/lib/job-step.sh, scripts/job-exit.test.mjs]
    expected: "exit 0; ma trận 'AC-3 <job> · <lành|DB tắt hẳn>' đủ 10 ca ok (5 job × 2 trạng thái), ca 'AC-3 ma trận đủ 10 ca' ok, và ca 'AC-3 cloud-sync · chập chờn' hiện là # TODO mang mã đáp án Hỏi-1 (hoặc ok nếu Hỏi-1 chọn vá ở vòng này)"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E4
    criterion: AC-4
    executor: test
    cmd: config:executors.test.scripts
    paths: [scripts/airdna-daily.sh, pipeline/finalize-hanoi.sh, scripts/job-exit.test.mjs]
    expected: "exit 0; ca 'AC-4 airdna-daily: <bước> hỏng …' (transform-airdna, dq-truthful-coverage) và 'AC-4 finalize-hanoi: <bước> hỏng …' (reassign-areas, transform-airbnb, transform-zalo, psql 300_metrics) ok — ≠0 và bước sau không được gọi; hai ca 'AC-4 <job>: mọi bước lành → nhật ký khớp dãy viết trước' ok"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E5
    criterion: AC-5
    executor: test
    cmd: config:executors.test.scripts
    layer: backend-effect
    paths: [pipeline/transform-chotot.mjs, pipeline/refresh-bait-gap.mjs, pipeline/resolve-properties.mjs, pipeline/transform-fb.mjs, pipeline/transform-airdna.mjs, pipeline/dq-truthful-coverage.mjs, pipeline/reassign-areas.mjs, pipeline/transform-airbnb.mjs, pipeline/transform-zalo.mjs, pipeline/sync-cloud.mjs, pipeline/push-ops-facts.mjs, scripts/job-exit.test.mjs]
    expected: "exit 0; mười ca 'AC-5 bước thật <bước> → ≠0, cổng canh thấy lần nối, hộp cát không chặn gì' ok; ca 'AC-5 đủ 10 bước + 1 todo' ok; ca 'AC-5 push-ops-facts' là # TODO P3-3 (không chạy); hai ca chiều đỏ ok: 'bản sao nuốt lỗi → bị bắt' và 'bản sao viết cứng localhost:5433 → hộp cát chặn, cổng canh không thấy, bị bắt'"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E6
    criterion: AC-6
    executor: test
    cmd: config:executors.test.scripts
    paths: [scripts/lib/job-step.sh, scripts/job-exit.test.mjs]
    expected: "exit 0; ca 'AC-6 job_step …' ok: mã 0/1/3 đi qua nguyên vẹn; lành không in thêm; hỏng in đúng một dòng 'JOB FAIL [<job>] bước <nhãn> mã <n>' ở stderr, không ở stdout; đầu ra của lệnh đi qua nguyên vẹn"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E7
    criterion: AC-7
    executor: judgment
    inputs: [docs/ops/runtime-map.md, _acceptance/job-bao-loi-that/contract.md]
    question: "Đọc mục job đêm trong docs/ops/runtime-map.md: người vận hành có biết (1) job nào nay thoát ≠ 0 khi bước DB hỏng và dòng 'JOB FAIL' để tìm trong log, (2) bước nào còn nuốt lỗi và chờ ai (P3-1 ZCode đoạn nạp; P3-3 T3 cloud-sync khi DB chập chờn + push-ops-facts), (3) cảnh báo DB sập đến từ L5b watchdog (ZC3) chứ không từ job — và các câu đó khớp phạm vi trong contract.md không?"
    evidence_required: [judged_by, verdict, rationale]
