schema_version: 1
feature_slug: do-hieu-qua-hang-ngay
# Ca DB chạy trên DB thử của suite (npm test tự dựng qua db/db-thu.sh --chay), số bịa; không gọi model thật (đọc gộp giả).
# Mỗi ca mới có cặp hai chiều trên cùng fixture: vật lành xanh, bản đột biến đỏ với thông điệp ghim.
evals:
  - id: E1
    criterion: AC-1
    executor: test
    cmd: config:executors.test.pipeline
    layer: backend-effect
    paths: [pipeline/mau-soat-cuon-chieu.mjs, pipeline/lib/do-hang-ngay.mjs, pipeline/lib/eval-labels.mjs, pipeline/lib/test-posts.mjs, pipeline/scripts/do-hang-ngay.test.mjs, db/migrations/083_*]
    expected: "exit 0; ca 'DO1-AC-1' trên DB thử: 26 bài stg_zalo_posts ngày D (3 bài thử, 2 cặp trùng chữ, 6 bài không thành tin), 4 bài ngày D-1; chạy --ngay D → đúng 20 thẻ lát s03-cuon-chieu stratum D, 0 bài thử, 0 cặp trùng, ≥1 bài không có tin, 0 bài ngày D-1; draft.cach_doc có khoá 'bo-doc-luat' cho mọi thẻ (bài không thành tin mang trang_thai 'khong-tin', không phải 'co' toàn null) và khoá 'doc-gop:gateway:anthropic/claude-haiku-5.5:dg3-s03-v3' cho các bài có silver_labels; bài không có đọc gộp có draft.hien = 'bo-doc-luat'; chạy lại → thêm 0 dòng, danh sách post_id y hệt; đổi prompt_version của silver_labels giả → khoá cách đọc mới. Ca 'DO1-AC-1-GOI' (đọc gộp giả có đếm lời gọi và giá giả): mẫu 20 bài, 12 bài đã có silver_labels → đúng 8 lời gọi cho đúng 8 post_id ấy, sau lệnh draft của 8 bài có khoá doc-gop trang_thai 'co'; chạy lại cùng ngày → 0 lời gọi; giá giả để lời thứ 4 chạm trần 0,05 USD → dừng ở lời đó, thẻ vẫn ghi đủ 20, nháp đọc gộp của bài chưa gọi là 'vang', log có 'CHAM TRAN DOC GOP'. Chiều đỏ: bỏ lọc bài thử → 'MAU CO BAI THU'; chọn theo thứ tự chèn thay hạt giống ngày → 'MAU KHONG TAT DINH'; bỏ bài không thành tin → 'MAU BO BAI KHONG NHAN'; chụp trước khi gọi → 'NHAP THIEU DOC GOP'; gọi lại khi chạy lại → 'GOI DOC GOP LAP'; bỏ trần → 'VUOT TRAN TIEN'; bài không tin ghi 'co' toàn null → 'NULL KHONG TIN THANH GIU'."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E2
    criterion: AC-2
    executor: test
    cmd: config:executors.test.app_ui
    layer: backend-effect
    paths: [app/src/components/ops/labels/**, app/src/app/ops/labels/**, app/src/lib/labels*.ts, app/src/app/api/v1/ops/labels/**, app/tests/do-hang-ngay-labels.test.tsx, pipeline/mau-soat-cuon-chieu.mjs, pipeline/do-hang-ngay.mjs, pipeline/lib/do-hang-ngay.mjs]
    expected: "exit 0; ca 'DO1-AC-2' (biểu mẫu thật trong jsdom + route lưu thật trên lược đồ tạm; draft KHÔNG dựng tay mà rút bằng hàm ghi của mau-soat-cuon-chieu trên bài bịa có silver_labels đọc gộp kind 'sale', bedrooms 2, bathrooms 2): ô kind = 'sale', bedrooms = '2', ô bathrooms (giao người) trống, có chữ 'Nháp máy · doc-gop:'; thẻ chỉ có bộ đọc luật hiện 'Nháp máy · bo-doc-luat' và ô điền từ bộ đọc luật; người sửa bedrooms thành '3' rồi lưu → eval_labels có bedrooms '3', kind 'sale'; eval_label_items.draft trước = sau. Ca 'DO1-RT' (round-trip): cùng thẻ, lưu không sửa ô nào qua route thật rồi chạy hàm tính của do-hang-ngay → giữ nháp của cách đọc hien = 100% trên mọi ô có nháp; sửa đúng bedrooms → chỉ ô bedrooms thành 0. Chiều đỏ: bỏ điền sẵn → 'KHONG DIEN NHAP'; điền cả ô giao người → 'DIEN O GIAO NGUOI'; lưu ghi đè draft → 'DRAFT BI DOI'; tra nháp theo tiền tố thay khoá đầy đủ → 'KHOA CACH DOC LECH KHUON'; so giá trị chưa chuẩn hoá → 'CHUAN HOA LECH'."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E3
    criterion: AC-3
    executor: test
    cmd: config:executors.test.pipeline
    layer: backend-effect
    paths: [pipeline/do-hang-ngay.mjs, pipeline/lib/do-hang-ngay.mjs, pipeline/scripts/do-hang-ngay.test.mjs]
    expected: "exit 0; ca 'DO1-AC-3' ma trận viết trước: 2 cách đọc × 3 ô (listing_intent nhóm A, price_min_vnd nhóm B, area_m2 nhóm B) × 2 tuần với số giữ đặt trước (vd bo-doc-luat/price tuần này 8/10, tuần trước 6/10) → detail do1-giu-nhap có đúng 12 ô, mỗi ô nhom, n, giu, ty_le khớp bảng, wilson khớp hàm tham chiếu đến 4 chữ số, chenh = 0,2, co_y_nghia = false khi hai khoảng chồng và true ở ca đặt trước 19/20 so 5/20, nguong_phat_hien có mặt; dung sai: giá nháp 3.400.000.000 người lưu 3.420.000.000 (lệch 0,59%) → giữ, 3.450.000.000 (1,47%) → không giữ; diện tích 62 so 62,8 → giữ, 64 → không; detail có co_cau {tuan_nay, tuan_truoc} theo bán/thuê × loại nhà, ty_le_soat = đã soát/đã rút với canh_bao khi < 0,7 (ca 12/20), phien_ban_thuoc chuỗi khác rỗng; ô người sửa = 1 − giữ của cách đọc hien; thêm khoá prompt mới → dòng riêng. Chiều đỏ: so với giá trị sale_offers hiện tại thay draft → 'GIU NHAP SO SAI NHAP'; gộp hai khoá prompt → 'GOP CACH DOC'; bỏ dung sai → 'DUNG SAI O SO'; co_y_nghia true khi khoảng chồng → 'CHENH NHIEU THANH Y NGHIA'; bỏ cảnh báo tỉ lệ soát → 'THIEU CANH BAO SOAT'."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
