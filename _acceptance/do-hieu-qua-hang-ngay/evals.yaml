    expected: "exit 0; ca 'DO1-AC-3' ma trận viết trước: 2 cách đọc × 3 ô × 2 tuần với số giữ đặt trước (vd bo-doc-luat/price tuần này 8/10, tuần trước 6/10) → detail do1-giu-nhap có đúng 12 ô, mỗi ô n, giu, ty_le khớp bảng, wilson_thap khớp hàm tham chiếu đến 4 chữ số, chenh = 0,2; ô người sửa = 1 − giữ của cách đọc hien; thêm khoá prompt mới → thêm dòng riêng, dòng cũ không đổi. Chiều đỏ: so với giá trị sale_offers hiện tại thay draft đã chụp → 'GIU NHAP SO SAI NHAP'; gộp hai khoá prompt → 'GOP CACH DOC'."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
