    cmd: config:executors.test.agent
    expected: "exit 0; toàn bộ agent npm test xanh, gồm mọi ca đã ký của judge-nguong-la-code, judge-giu-quyet-dinh-nguoi và judge-evidence-du-truong trong agent/tests/judge-run.test.ts, agent/tests/judge-nguong.test.ts và agent/tests/judge-pair.test.ts. Ca 'RK-AC-10 ca đã ký còn đủ' trong agent/tests/judge-run.test.ts đọc danh sách viết trước _acceptance/the-ghep-can-tin-roi-kho/ca-da-ky.txt (31 tên, rút từ ba tệp trên tại đỉnh nhánh HD1 trước khi code vòng này) và tên ca test(\"…\") trong ba tệp: mọi tên của danh sách có mặt; số assert = số dòng danh sách = 31. Đối chứng đỏ cùng fixture: danh sách cộng thêm một tên không có trong tệp nào → 'RK-AC-10 ca đã ký mất: <tên>'."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
    paths: [agent/scripts/judge-run.ts, agent/tests/judge-run.test.ts, agent/tests/judge-nguong.test.ts, agent/tests/judge-pair.test.ts, agent/tests/judge-chung.ts, _acceptance/the-ghep-can-tin-roi-kho/ca-da-ky.txt]

  - id: E11
    criterion: AC-11
    executor: test
    cmd: config:executors.test.agent
    expected: "exit 0; ca 'RK-AC-11 tin quay lại — thẻ máy rút được trả lại' trong agent/tests/judge-run.test.ts xanh: cặp có Tin A rời kho, thẻ pending, chạy lượt 1 → thẻ deferred bởi machine:judge-run; chèn lại Tin A vào sale_offers; lượt 2 → thẻ status 'pending', decided_by/decided_at/decision_note NULL, evidence.cham có mặt và luc của cham sau lượt 1; ops_audit có đúng một dòng action 'review-queue:tra-lai-tin-ve-kho' với detail.review_id = id thẻ; dem.traLai = 1, dem.capNhat = 1. Thẻ deferred bởi người ('user:test') trên cặp hai bên sống thì KHÔNG được trả lại (cùng lượt 2, ô đối chiếu). Đối chứng đỏ cùng fixture: (1) hàm kiểm trên bản ghi thẻ còn 'deferred' → 'RK-AC-11 thẻ chưa trả lại: <item_id>'; (2) hàm kiểm trên bản ghi mà thẻ người 'deferred' bị đổi về 'pending' → 'RK-AC-11 trả lại thẻ người quyết: <item_id>'."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
    paths: [agent/scripts/judge-run.ts, agent/tests/judge-run.test.ts]
