<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Luồng một cặp</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Lora:ital,wght@0,400;1,400&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Lora', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1000px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Sơ đồ luồng · the-ghep-can-tin-roi-kho · judge-run</p>
    <h1>Một cặp đi qua chamMotLuot</h1>

    <svg viewBox="0 0 960 680" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2a6f97"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Mũi tên (vẽ trước, nằm dưới nút) -->
      <!-- Bắt đầu → D1 -->
      <line x1="400" y1="88" x2="400" y2="112" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- D1 CÓ → Bỏ qua -->
      <line x1="520" y1="160" x2="640" y2="160" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- D1 KHÔNG → D2 -->
      <line x1="400" y1="208" x2="400" y2="248" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- D2 KHÔNG → Rút (đường mới, coral) -->
      <line x1="520" y1="296" x2="640" y2="296" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <!-- D2 CÓ → D3 -->
      <line x1="400" y1="344" x2="400" y2="384" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- D3 CÓ → Trả lại -->
      <line x1="520" y1="432" x2="640" y2="432" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- D3 KHÔNG → Chấm -->
      <line x1="400" y1="480" x2="400" y2="536" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Trả lại → Chấm (khuỷu bo r=8) -->
      <path d="M 760 468 L 760 556 Q 760 564 752 564 L 500 564" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Nhãn mũi tên (có nền che, cách đường 8px) -->
      <rect x="564" y="136" width="32" height="12" rx="2" fill="#f5f5f5"/>
      <text x="580" y="146" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">CÓ</text>

      <rect x="408" y="220" width="48" height="12" rx="2" fill="#f5f5f5"/>
      <text x="412" y="230" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.12em">KHÔNG</text>

      <rect x="556" y="272" width="48" height="12" rx="2" fill="#f5f5f5"/>
      <text x="580" y="282" fill="#ba4513" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">KHÔNG</text>

      <rect x="408" y="356" width="32" height="12" rx="2" fill="#f5f5f5"/>
      <text x="412" y="366" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.12em">CÓ</text>

      <rect x="564" y="408" width="32" height="12" rx="2" fill="#f5f5f5"/>
      <text x="580" y="418" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">CÓ</text>

      <rect x="408" y="496" width="48" height="12" rx="2" fill="#f5f5f5"/>
      <text x="412" y="506" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.12em">KHÔNG</text>

      <!-- Bắt đầu -->
      <rect x="280" y="40" width="240" height="48" rx="24" fill="#f5f5f5"/>
      <rect x="280" y="40" width="240" height="48" rx="24" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="400" y="62" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Một cặp trong tập chấm</text>
      <text x="400" y="77" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">needs_llm ∪ thẻ đang chờ</text>

      <!-- D1 -->
      <polygon points="400,112 520,160 400,208 280,160" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="400" y="157" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Cặp có thẻ người</text>
      <text x="400" y="171" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">đã quyết?</text>

      <!-- Bỏ qua -->
      <rect x="640" y="136" width="240" height="48" rx="24" fill="#f5f5f5"/>
      <rect x="640" y="136" width="240" height="48" rx="24" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="760" y="158" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Bỏ qua</text>
      <text x="760" y="173" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">boQua · AC-4</text>

      <!-- D2 -->
      <polygon points="400,248 520,296 400,344 280,296" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="400" y="293" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Cả hai tin còn</text>
      <text x="400" y="307" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">trong sale_offers?</text>

      <!-- Rút thẻ (đích mới, coral) -->
      <rect x="640" y="256" width="240" height="80" rx="6" fill="#f5f5f5"/>
      <rect x="640" y="256" width="240" height="80" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="760" y="278" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Rút thẻ chờ → deferred</text>
      <text x="760" y="294" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">decided_by machine:judge-run</text>
      <text x="760" y="308" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">ops_audit review-queue:rut-roi-kho</text>
      <text x="760" y="324" fill="#ba4513" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">AC-1 · AC-2</text>

      <!-- D3 -->
      <polygon points="400,384 520,432 400,480 280,432" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="400" y="429" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Có thẻ máy</text>
      <text x="400" y="443" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">đã rút?</text>

      <!-- Trả lại -->
      <rect x="640" y="396" width="240" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="640" y="396" width="240" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="760" y="420" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Trả lại → pending</text>
      <text x="760" y="436" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">ops_audit review-queue:tra-lai-tin-ve-kho</text>
      <text x="760" y="452" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">AC-11</text>

      <!-- Chấm như cũ -->
      <rect x="300" y="536" width="200" height="56" rx="28" fill="#f5f5f5"/>
      <rect x="300" y="536" width="200" height="56" rx="28" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="400" y="561" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Chấm như cũ</text>
      <text x="400" y="577" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">queryPair · AC-3</text>

      <!-- Chú giải -->
      <line x1="40" y1="616" x2="920" y2="616" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="632" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.18em">CHÚ GIẢI · HÌNH DẠNG MANG LOẠI NÚT</text>

      <rect x="40" y="648" width="24" height="12" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="72" y="658" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Đầu / cuối (oval)</text>

      <rect x="220" y="648" width="24" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="252" y="658" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Bước (chữ nhật)</text>

      <polygon points="392,654 404,648 416,654 404,660" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="428" y="658" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Câu hỏi (thoi)</text>

      <line x1="564" y1="656" x2="592" y2="656" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <text x="600" y="658" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Nhánh mới: tin rời kho</text>

      <line x1="764" y1="656" x2="792" y2="656" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="800" y="658" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Nhánh</text>
    </svg>
  </div>
</body>
</html>
