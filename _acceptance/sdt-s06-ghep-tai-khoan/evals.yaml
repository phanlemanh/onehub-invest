    expected: "exit 0; ca GS-AC-6 xanh: runTransformChotot khi hàm có phần giữ ra tin có số; khi hàm chưa có, kể cả sau khi áp lại bản hàm không có phần giữ, ra 0 số, log chứa CHUA-AP-068, không ném. Cùng fixture, hai nhánh chỉ khác nhau ở một lần áp 068."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E7
    criterion: AC-7
    executor: test
    layer: backend-effect
    cmd: config:executors.test.gs_test
    paths: [pipeline/gan-sdt-s06.mjs, pipeline/scripts/gan-sdt-s06.test.mjs]
    expected: "exit 0; ca GS-AC-7 xanh: tin S03 cùng khoá gốc giữ nguyên, tin S06 đã nghỉ có số, doSdtS06 tách sống và nghỉ. Chiều đỏ: đột biến bỏ lọc nguồn, ghim DUNG-NGUON-KHAC."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E8
    criterion: AC-8
    executor: script
