    expected: "exit 0 trên DB local; in da_ap_068=true, hai dòng bán, thuê kèm truoc, sau, truc_tiep, ghep; tai_khoan_hai_so; ghep > 0 và bằng câu đếm độc lập trên stg ngay trong lượt; an_so_bi_ghep=0; sai_e164=0; ghep_lech_tu_tin=0; md5 cột trước và sau ROLLBACK bằng nhau; đầu ra không khớp mẫu +84 hay 0 mười chữ số. Chiều đỏ ở ca GS-AC-8 cùng hàm: tin ẩn số mang số ghép thì kiemBatBien báo AN-SO-BI-GHEP, thoát 1; câu đếm lệch báo DEM-LECH; chuỗi có SĐT đi qua bộ in thì báo RO-SO; COMMIT thay ROLLBACK làm md5 lệch, báo DB-DOI."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E9
