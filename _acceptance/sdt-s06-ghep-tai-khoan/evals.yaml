schema_version: 1
feature_slug: sdt-s06-ghep-tai-khoan
# Ca DB «GS-AC-n» ở pipeline/scripts/gan-sdt-s06.test.mjs: BEGIN…ROLLBACK trên lược đồ riêng (lib/luoc-do-rieng.mjs), số bịa. Mỗi kiểm có ca đỏ trên bản đột biến
# cùng fixture, ghim thông điệp. Thước dữ liệu thật: `node pipeline/gan-sdt-s06.mjs --thu`.
evals:
  - id: E1
    criterion: AC-1
    executor: test
    layer: backend-effect
    cmd: config:executors.test.gs_test
    paths: [db/migrations/068_*.sql, pipeline/lib/nap-068.mjs, pipeline/gan-sdt-s06.mjs, pipeline/scripts/gan-sdt-s06.test.mjs]
    expected: "exit 0; ca GS-AC-1 xanh trên fixture ghi bằng ganSdtS06 thật: áp 068 hai lần, 0 dòng tin đổi, sau phân xử khoá seller_phone, offer_status còn, mọi khoá và cột khác giống hệt bản trước 068 trên cùng tin, lượt hai offers_changed = 0, tin không khoá không sinh khoá. Chiều đỏ cùng fixture: hàm trước 068 làm mất khoá, ghim MAT-NGUON-GOC-SDT; định nghĩa không có mốc thì 068 RAISE, ghim MOC-068."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E2
    criterion: AC-2
    executor: test
    layer: backend-effect
    cmd: config:executors.test.gs_test
    paths: [pipeline/gan-sdt-s06.mjs, pipeline/scripts/gan-sdt-s06.test.mjs]
    expected: "exit 0; ca GS-AC-2 xanh: sinh ô bằng tích Đề-các bốn trục, assert số ô = 88 và 8 ô gạch đúng danh sách, kỳ vọng từng ô đọc từ bảng L1-L9 viết tay trong test; mỗi ô assert số, băm, tier, method, rule_id; tu_tin của mọi số ghép là dòng stg cùng tài khoản mang đúng số. Chiều đỏ cùng fixture: bỏ điều kiện ẩn số, ghim AN-SO-BI-GHEP; n >= 1 thay n = 1, ghim HAI-SO-BI-GHEP; tu_tin đổi sang max của tin khác tài khoản, ghim TU-TIN-LECH."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E3
    criterion: AC-3
    executor: test
    layer: backend-effect
    cmd: config:executors.test.gs_test
    paths: [pipeline/gan-sdt-s06.mjs, pipeline/scripts/gan-sdt-s06.test.mjs]
    expected: "exit 0; hai ca riêng GS-AC-3a (chuyển ẩn số) và GS-AC-3b (thêm số thứ hai) đều xanh: lượt một số ghép có mặt, lượt hai rút số, băm, khoá xuất xứ; tin trực tiếp và không rõ gốc giữ nguyên trong cả hai ca. Chiều đỏ riêng từng ca: đột biến bỏ bước rút ẩn số, ghim CON-SO-GHEP-SAU-AN; bỏ bước rút hai số, ghim CON-SO-GHEP-HAI-SO."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E4
    criterion: AC-4
    executor: test
    layer: backend-effect
    cmd: config:executors.test.gs_test
    paths: [pipeline/transform-chotot.mjs, pipeline/gan-sdt-s06.mjs, pipeline/scripts/gan-sdt-s06.test.mjs]
    expected: "exit 0; ca GS-AC-4 xanh, chuỗi qua runTransformChotot thật: lượt một có số, lượt hai không đổi stg thì gan trả doi = 0, xoá seller.phone rồi lượt ba thì số, băm, xuất xứ từng tin không đổi. Dòng stg dạng hợp đồng v5. Chiều đỏ: đột biến gán null khi stg trống, ghim MAT-SO-KHI-STG-TRONG."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E5
    criterion: AC-5
    executor: test
    layer: backend-effect
    cmd: config:executors.test.gs_test
    paths: [pipeline/gan-sdt-s06.mjs, pipeline/scripts/gan-sdt-s06.test.mjs]
    expected: "exit 0; ca GS-AC-5 xanh: số sai dạng không vào tin, tài khoản một số đúng cộng một số sai vẫn đếm một số, kết quả sai_e164 đúng số dòng; băm so với node:crypto trên số E.164. Chiều đỏ: đột biến bỏ lọc dạng, ghim SAI-E164-VAO-TIN."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
