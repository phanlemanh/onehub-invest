  - id: E7
    criterion: AC-6
    executor: test
    cmd: config:executors.test.the_duyet_phuong
    layer: backend-effect
    paths: [app/src/lib/ops/review-can-cu.ts, app/tests/the-duyet-phuong-lech-gia.test.tsx]
    expected: "exit 0 trên máy thu; ca 'TPL-AC-6 probe' xanh, chỉ SELECT trên DB máy thu thật. Mốc là đuôi area.id sau parent_id + '-' (dữ liệu bên ghi OSM đã lưu), không qua khoaPhuong hay slugifyName. Nhánh cùng phường: với mỗi area submarket, soTruongGhepCan(đuôi, 'Phường ' + name) và (đuôi, name) → 'khop' (đếm ≥ 1 mỗi dạng, ghim 'TPL-AC-6 probe: <đuôi> ↔ Phường <name> cùng phường mà báo <nhãn>'). Nhánh khác phường: mọi cặp hai area khác nhau cùng parent_id, (đuôi_a, 'Phường ' + name_b) → 'lech' (đếm ≥ 1, ghim 'TPL-AC-6 probe: <đuôi_a> ↔ Phường <name_b> khác phường mà báo Khớp'). Thẻ thật: mọi review_queue entity_match mà hai bên giải về cùng một đuôi mã (bên slug = đuôi; bên tên = area có 'Phường ' + name hoặc name bằng nguyên chuỗi, so NFC chữ thường) → hàng Phường 'khop', số thẻ giải được ≥ 1 (ghim 'TPL-AC-6 probe: không thẻ nào giải được phường — phép đo xanh suông'). Ở CI (process.env.CI) ca bỏ qua có lời: DB CI chỉ có lược đồ. Chiều đỏ: bản chép bỏ tiền tố sau khi bỏ dấu → nhánh cùng phường đỏ đúng ở phuong-liet ↔ Phường Phương Liệt"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
