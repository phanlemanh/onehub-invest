schema_version: 1
feature_slug: s03-jpg-path-fallback
evals:
  - id: E1
    criterion: AC-1
    executor: test
    cmd: config:executors.script.zc16_media_test
    paths: [collector/src/core/media-fetch.ts, collector/src/test/media-fetch.test.ts]
    expected: "exit 0; 0 fail; ca «media (2511-3): URL /jpg/ bị CDN 400 → fallback bỏ /jpg/ tải được…» xanh: CDN giả trả 400 cho /jpg/broken.jpg và 200 cho /broken.jpg → manifest có tệp media, sha256/độ dài khớp byte, error undefined. Chiều đỏ (đo 25/11 trên bản chép): đổi điều kiện thử lại thành false → đúng ca này đỏ."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E2
    criterion: AC-2
    executor: test
    cmd: config:executors.script.zc16_media_test
    paths: [collector/src/core/media-fetch.ts, collector/src/test/media-fetch.test.ts]
    expected: "exit 0; cùng ca 2511-3: payload.media và meta.url giữ URL gốc /jpg/broken.jpg; mf.urlFetched === undefined; khoá của entry đúng [bytes, file, sha256, url]; tên tệp mở đầu media/<băm 16 hex của URL ĐÃ TẢI /broken.jpg> và KHÔNG mở đầu bằng băm của URL gốc. Byte trên đĩa bằng đúng byte CDN trả và sha256 khớp. Chiều đỏ (đo 25/11): băm theo url gốc thay vì URL đã tải → ca này đỏ với thông điệp 'tên tệp phải băm theo URL đã tải'."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E3
    criterion: AC-3
    executor: test
    cmd: config:executors.script.zc16_media_test
    paths: [collector/src/core/media-fetch.ts, collector/src/test/media-fetch.test.ts]
    expected: "exit 0; ca «ZC16: không thử lại sai chỗ…» xanh: /plain400.jpg (400, không /jpg/) → http-400, CDN nhận đúng 1 yêu cầu; /jpg/gone.jpg (404) → http-404, /gone.jpg nhận 0 yêu cầu; /jpg/both-bad.jpg (400) thử /both-bad.jpg (404) đúng 1 lần → entry giữ http-400 của URL gốc; ca thứ hai: /jpg/hang.jpg treo → 'timeout', /hang.jpg nhận 0 yêu cầu. Chiều đỏ chạy lại mỗi lượt (probes/tu-thu.sh, đuôi lệnh): thử lại với mọi lỗi → đỏ với 'không thử lại'; bỏ thử lại → đỏ 'fallback phải tải được ảnh khi bỏ /jpg/'; băm url gốc → đỏ 'tên tệp phải băm theo URL đã tải'; dòng cuối 'TU-THU PASS'."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E4
    criterion: AC-4
    executor: test
    cmd: config:executors.script.zc16_media_test
    paths: [collector/src/core/media-fetch.ts, collector/src/test/media-fetch.test.ts]
    expected: "exit 0; ca ZC15 «JPEG XL lưu nguyên byte với đuôi .jxl; JPEG giữ .jpg» xanh sau khi gộp (byte FF 0A và hộp JXL → .jxl; byte JPEG → .jpg); ca 2511-3: CDN giả trả header image/jxl với byte JPEG_A → assert tên tệp kết thúc '.jpg' (thông điệp ghim 'đuôi phải theo byte'; đoán theo byte, không theo header); ca «ZC16: ảnh tải qua đường thử lại mà byte là JPEG XL → đuôi .jxl dù URL đuôi .jpg» xanh (/jpg/jx.jpg 400, /jx.jpg byte FF 0A → file .jxl, byte giữ nguyên)."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E5
    criterion: AC-5
    executor: test
    cmd: config:executors.script.zc16_media_test
    paths: [collector/src/**]
    expected: "exit 0; toàn bộ test collector trên dist vừa xoá 0 fail (89 ca, gồm 5 ca ZC15, 2 ca ZC9, ca 2511-3, ba ca ZC16)."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E6
    criterion: AC-5
    executor: script
    cmd: config:executors.script.collector_check
    paths: [collector/src/**]
    expected: "exit 0; tsc --noEmit không lỗi."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E7
    criterion: AC-5
    executor: script
    cmd: config:executors.script.zc15_khuon_media_files
    paths: [collector/src/core/media-fetch.ts]
    expected: "exit 0; 'KHUON-MEDIA-FILES PASS — MediaFileEntry giữ đúng 5 khoá (bytes, error, file, sha256, url)' (không urlFetched); 'TU-THU PASS' khi thêm khoá vào bản chép. (DATA-CONTRACT.md và storage.ts không đổi so origin/main: chốt ở đuôi lệnh zc16_media_test của E1–E4)."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E8
    criterion: AC-6
    executor: script
    cmd: config:executors.script.zc16_ap_may_thu
    paths: [_acceptance/s03-jpg-path-fallback/ap-may-thu/**, collector/src/core/media-fetch.ts]
    expected: "exit 0; 'AP-MAY-THU PASS': README năm mục có nội dung (mục 1 có build, kickstart kèm 'lời riêng của Mạnh', khung giờ, nói áp chung ZC15; mục 2 có 27,5% và 8,1%); tự phá mục 2 → đỏ đúng mục; kiem-sau trên mẫu (ngưỡng 5%): dat → 'ĐẠT — 3 bài có ảnh', duoi-tran → ĐẠT 'lỗi 400 1 (4.0%)', con-jpg-400 → 'ảnh link /jpg/ lỗi http-400 50.0% > 5%', chua-co-jpg → 'chưa có ảnh link /jpg/ nào', khong-bai-moi → 'chưa có bài mới có ảnh'; --ty-le trên mẫu ty-le → 20,0%; canh-gac → đầu ra không chứa 'canh-gac'; round-trip collector API trên bản chép riêng trong thư mục tạm (không đụng collector/dist của cây), CDN giả trả header image/jxl với byte JPEG: nhánh → 'ĐẠT — 2 bài có ảnh · 0 mất hết ảnh', đầu nhánh ZC15 (sha cố định edb66bd8c) → 'KHÔNG ĐẠT — ảnh link /jpg/ lỗi http-400 100.0% > 5%'."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E9
    criterion: AC-7
    executor: test
    cmd: config:executors.script.zc16_media_test
    paths: [collector/src/core/media-fetch.ts, collector/src/test/media-fetch.test.ts]
    expected: "exit 0; ca «ZC16: timeout trên link /jpg/ không thử lại; URL thay thế chuyển hướng ra ngoài danh sách thì không lưu» xanh: /jpg/r.jpg 400, /r.jpg nhận đúng 1 yêu cầu và 302 sang localhost (ngoài danh sách) → entry file undefined, error 'http-400', snapshot không có thư mục media. Đối chứng dương cùng tệp: ca 2511-3 (thay thế trong danh sách) tải được."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E10
    criterion: AC-5
    executor: test
    cmd: config:executors.suite.pipeline_a
    long_running: 90
    paths: [collector/src/core/media-fetch.ts]
    expected: "exit 0; nửa A bộ test pipeline, 0 fail — suite chạy vì collector/src nằm trong vùng suite pipeline (suite-neu-doi); khai ở đây để có long_running 90 (Mac mini nửa A ~41′ vượt trần 30′; luật GS 24/11), paths hẹp theo R4."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E11
    criterion: AC-5
    executor: test
    cmd: config:executors.suite.pipeline_b
    long_running: 90
    paths: [collector/src/core/media-fetch.ts]
    expected: "exit 0; nửa B bộ test pipeline, 0 fail — cùng lý do với E10 (~24′)."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
