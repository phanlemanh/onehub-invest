schema_version: 1
feature_slug: vong-doi-nguon
# Ca «VD-AC-4» ở pipeline/scripts/vong-doi.test.mjs (thuần, chạy cả trong CI). Ca DB «VD-AC-n» ở
# pipeline/scripts/vong-doi.itest.mjs (cần DB local :5433, ngoài `npm test`): mỗi ca dựng một lược đồ tạm `vd_<pid>_<ca>` trên DB local :5433,
# tạo hai bảng ở KHUÔN TRƯỚC migration (cột của 012 + 013 + 024; ca VD-KHUON đối chiếu danh sách cột ấy với
# public.source_registry/source_groups trừ các cột migration thêm — fixture không được lệch khuôn thật), rồi chạy NGUYÊN
# tệp db/migrations/047_vong_doi_nguon.sql bằng một lời gọi query của pg (giao thức simple: dừng ở lỗi đầu) với
# search_path = lược đồ tạm (máy không có psql; docker exec chỉ dùng khi áp lên public). Ca VD-AC-6 ở
# app/tests/vong-doi-nguon.test.tsx gọi POST thật của route trên lược đồ tạm đã migration.
evals:
