    expected: "exit 0; ca 'VD-AC-1' ma trận viết trước 2 bảng × 4 giá trị sai ('deprecated', '', 'Active', NULL) × 2 lệnh (INSERT, UPDATE) = 16 lệnh: mỗi lệnh ném lỗi, message chứa đúng tên ràng buộc ('source_registry_status_chk' / 'source_groups_status_chk'), riêng NULL chứa 'null value'; 2 bảng × 5 giá trị hợp lệ = 10 lệnh nhận (paused kèm reason); đối chứng: trên bản sao lược đồ gỡ hai *_status_chk thì INSERT 'deprecated' được nhận — ca báo rõ 'gỡ CHECK thì nhận' để chứng thước từng đỏ"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
