<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đối soát offer cũ</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Lora:ital,wght@0,400;1,400&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Lora', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1120px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.25;
      color: var(--color-ink);
      margin-bottom: 0.5rem;
    }
    .sub {
      font-size: 0.875rem;
      color: var(--color-muted);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 960px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Cổng Phạm vi · enrich-hau-ky · AC-1 … AC-5 · Hỏi-1</p>
    <h1>Nạp lại không xoá: đối soát offer cũ</h1>
    <p class="sub">writeOffers + reconcile_stale_offers (037), một transaction. Đề xuất và công duyệt đi theo offer kế thay vì bị CASCADE xoá (spec §2.1)</p>

    <svg viewBox="0 0 1120 872" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect x="0" y="0" width="1120" height="872" fill="#f5f5f5"/>

      <!-- ===== Mũi tên (vẽ trước hộp) ===== -->
      <line x1="560" y1="72" x2="560" y2="104" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="560" y1="168" x2="560" y2="200" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Rẽ (a) còn trong lượt -->
      <path d="M440 264 H216 Q208 264 208 272 V376" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Rẽ (b) có offer kế -->
      <line x1="560" y1="328" x2="560" y2="376" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Rẽ (c) không offer kế -->
      <path d="M680 264 H904 Q912 264 912 272 V376" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Chuỗi (b) -->
      <line x1="560" y1="456" x2="560" y2="488" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="560" y1="552" x2="560" y2="584" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Nhập nhánh (b)(c) -->
      <line x1="560" y1="648" x2="560" y2="684" stroke="#4f5d75" stroke-width="1.2"/>
      <path d="M912 456 V680 Q912 688 904 688 H564" fill="none" stroke="#4f5d75" stroke-width="1.2"/>
      <line x1="560" y1="692" x2="560" y2="720" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Cạnh bên: đường xoá khác -->
      <line x1="720" y1="748" x2="800" y2="748" stroke="#eb6c36" stroke-width="1.2" stroke-dasharray="5,4"/>

      <!-- ===== Nhãn mũi tên ===== -->
      <rect x="280" y="244" width="96" height="12" rx="2" fill="#f5f5f5"/>
      <text x="328" y="253" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CÒN TRONG LƯỢT</text>

      <rect x="568" y="346" width="72" height="12" rx="2" fill="#f5f5f5"/>
      <text x="604" y="355" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CÓ OFFER KẾ</text>

      <rect x="744" y="244" width="96" height="12" rx="2" fill="#f5f5f5"/>
      <text x="792" y="253" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">KHÔNG OFFER KẾ</text>

      <rect x="724" y="728" width="72" height="12" rx="2" fill="#f5f5f5"/>
      <text x="760" y="737" fill="#ba4513" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ĐƯỜNG KHÁC</text>

      <!-- ===== Nút ===== -->
      <!-- Bắt đầu -->
      <rect x="440" y="24" width="240" height="48" rx="24" fill="#f5f5f5"/>
      <rect x="440" y="24" width="240" height="48" rx="24" fill="rgba(79,93,117,0.10)" stroke="#636b80" stroke-width="1"/>
      <text x="560" y="52" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Transform nạp lại S03/S05</text>

      <!-- Upsert -->
      <rect x="440" y="104" width="240" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="440" y="104" width="240" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="672" y="119" fill="#636b80" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">AC-1</text>
      <text x="560" y="136" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Upsert offer</text>
      <text x="560" y="152" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">giữ cột đã enrich · làm mới cột nguồn</text>

      <!-- Quyết định -->
      <polygon points="560,200 680,264 560,328 440,264" fill="#f5f5f5"/>
      <polygon points="560,200 680,264 560,328 440,264" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="560" y="260" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Offer không còn</text>
      <text x="560" y="276" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">trong lượt?</text>

      <!-- (a) giữ nguyên -->
      <rect x="72" y="376" width="272" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="72" y="376" width="272" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="336" y="391" fill="#636b80" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">AC-1</text>
      <text x="208" y="408" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Đề xuất · thẻ · giá trị giữ nguyên</text>
      <text x="208" y="424" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">không chuyển · không xoá</text>

      <!-- (b1) chuyển đề xuất -->
      <rect x="440" y="376" width="240" height="80" rx="6" fill="#f5f5f5"/>
      <rect x="440" y="376" width="240" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="672" y="391" fill="#636b80" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">AC-2 · AC-3</text>
      <text x="560" y="408" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Chuyển đề xuất</text>
      <text x="560" y="424" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">X → Y chung post_id · giữ status</text>
      <text x="560" y="440" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">trùng khoá: dòng đã quyết thắng</text>

      <!-- (b2) áp lại -->
      <rect x="440" y="488" width="240" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="440" y="488" width="240" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="672" y="503" fill="#636b80" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">AC-2</text>
      <text x="560" y="520" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Áp lại giá trị đã applied</text>
      <text x="560" y="536" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">fill-gap · Y có sẵn → skipped</text>

      <!-- (b3) thẻ chờ -->
      <rect x="440" y="584" width="240" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="440" y="584" width="240" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="672" y="599" fill="#636b80" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">AC-2</text>
      <text x="560" y="616" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Thẻ chờ trỏ offer kế</text>
      <text x="560" y="632" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">enrich:X → enrich:Y</text>

      <!-- (c) Hỏi-1 — người chốt -->
      <rect x="776" y="376" width="272" height="80" rx="6" fill="#f5f5f5"/>
      <rect x="776" y="376" width="272" height="80" rx="6" fill="rgba(235,108,54,0.06)" stroke="#eb6c36" stroke-width="1.4"/>
      <rect x="784" y="382" width="64" height="12" rx="2" fill="transparent" stroke="rgba(186,69,19,0.50)" stroke-width="0.8"/>
      <text x="816" y="391" fill="#ba4513" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">NGƯỜI CHỐT</text>
      <text x="1040" y="391" fill="#636b80" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">AC-4</text>
      <text x="912" y="412" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Hỏi-1: xoá tường minh</text>
      <text x="912" y="428" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">+ ảnh chụp ops_audit enrich:retire</text>
      <text x="912" y="444" fill="#ba4513" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">khuyến nghị · chốt ở Cổng Phạm vi</text>

      <!-- Điểm nhập -->
      <circle cx="560" cy="688" r="4" fill="#2d3142"/>

      <!-- Kết -->
      <rect x="400" y="720" width="320" height="56" rx="28" fill="#f5f5f5"/>
      <rect x="400" y="720" width="320" height="56" rx="28" fill="rgba(79,93,117,0.10)" stroke="#636b80" stroke-width="1"/>
      <text x="560" y="744" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Xoá offer cũ</text>
      <text x="560" y="762" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">ops_audit enrich:reconcile</text>

      <!-- Cạnh bên: DELETE thẳng bị chặn -->
      <rect x="800" y="720" width="272" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="800" y="720" width="272" height="56" rx="6" fill="rgba(235,108,54,0.05)" stroke="#eb6c36" stroke-width="1.4" stroke-dasharray="4,4"/>
      <text x="1064" y="735" fill="#636b80" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">AC-5</text>
      <text x="936" y="748" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">DELETE thẳng</text>
      <text x="936" y="764" fill="#ba4513" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">lỗi khoá ngoại RESTRICT</text>

      <!-- ===== Chú giải ===== -->
      <line x1="40" y1="808" x2="1080" y2="808" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <text x="40" y="828" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.18em">CHÚ GIẢI</text>

      <rect x="40" y="844" width="24" height="12" rx="6" fill="rgba(79,93,117,0.10)" stroke="#636b80" stroke-width="1"/>
      <text x="72" y="854" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Bắt đầu / kết</text>

      <rect x="168" y="844" width="24" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="200" y="854" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Bước máy</text>

      <polygon points="292,842 304,850 292,858 280,850" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="312" y="854" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Rẽ nhánh</text>

      <circle cx="396" cy="850" r="4" fill="#2d3142"/>
      <text x="408" y="854" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Nhập nhánh</text>

      <rect x="496" y="844" width="24" height="12" rx="2" fill="rgba(235,108,54,0.06)" stroke="#eb6c36" stroke-width="1.4"/>
      <text x="528" y="854" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Người chốt cách xử lý (Hỏi-1)</text>

      <rect x="704" y="844" width="24" height="12" rx="2" fill="rgba(235,108,54,0.05)" stroke="#eb6c36" stroke-width="1.4" stroke-dasharray="4,4"/>
      <text x="736" y="854" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Đường xoá không qua đối soát — bị chặn</text>
    </svg>
  </div>
</body>
</html>
