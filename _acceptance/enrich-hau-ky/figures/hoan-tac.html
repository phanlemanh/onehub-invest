<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hoàn tác lượt áp</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Lora:ital,wght@0,400;1,400&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Lora', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1040px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.25;
      color: var(--color-ink);
      margin-bottom: 0.5rem;
    }
    .sub {
      font-size: 0.875rem;
      color: var(--color-muted);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 896px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Cổng Phạm vi · enrich-hau-ky · AC-6 · AC-7 · Hỏi-2</p>
    <h1>Hoàn tác một lượt áp, có người ký và có audit</h1>
    <p class="sub">revert_enrichment (036) qua CLI enrich-revert. Mỗi hiệu ứng ghi của apply_enrichment có một hiệu ứng ngược (spec §2.2)</p>

    <svg viewBox="0 0 1040 880" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect x="0" y="0" width="1040" height="880" fill="#f5f5f5"/>

      <!-- ===== Mũi tên (vẽ trước hộp) ===== -->
      <line x1="520" y1="80" x2="520" y2="112" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Cổng người: không → lỗi -->
      <line x1="640" y1="176" x2="744" y2="176" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Cổng người: có → kiểm giá trị -->
      <line x1="520" y1="240" x2="520" y2="288" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Giá trị còn đúng → hoàn tác -->
      <path d="M384 352 H248 Q240 352 240 360 V448" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Giá trị đã đổi → bỏ qua -->
      <path d="M656 352 H792 Q800 352 800 360 V448" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Nhập nhánh -->
      <path d="M240 560 V600 Q240 608 248 608 H516" fill="none" stroke="#4f5d75" stroke-width="1.2"/>
      <path d="M800 512 V600 Q800 608 792 608 H524" fill="none" stroke="#4f5d75" stroke-width="1.2"/>
      <line x1="520" y1="612" x2="520" y2="640" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="520" y1="696" x2="520" y2="728" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- ===== Nhãn mũi tên ===== -->
      <rect x="668" y="156" width="48" height="12" rx="2" fill="#f5f5f5"/>
      <text x="692" y="165" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">KHÔNG</text>

      <rect x="528" y="258" width="24" height="12" rx="2" fill="#f5f5f5"/>
      <text x="540" y="267" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CÓ</text>

      <rect x="300" y="332" width="32" height="12" rx="2" fill="#f5f5f5"/>
      <text x="316" y="341" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CÓ</text>

      <rect x="700" y="332" width="48" height="12" rx="2" fill="#f5f5f5"/>
      <text x="724" y="341" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">KHÔNG</text>

      <!-- ===== Nút ===== -->
      <!-- Bắt đầu: lệnh -->
      <rect x="360" y="24" width="320" height="56" rx="28" fill="#f5f5f5"/>
      <rect x="360" y="24" width="320" height="56" rx="28" fill="rgba(79,93,117,0.10)" stroke="#636b80" stroke-width="1"/>
      <text x="520" y="48" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">enrich-revert</text>
      <text x="520" y="66" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">--ids --actor hitl:… --reason</text>
      <text x="692" y="56" fill="#636b80" font-size="9" font-family="'Geist Mono', monospace">AC-7</text>

      <!-- Cổng người — tiêu điểm -->
      <polygon points="520,112 640,176 520,240 400,176" fill="#f5f5f5"/>
      <polygon points="520,112 640,176 520,240 400,176" fill="rgba(235,108,54,0.06)" stroke="#eb6c36" stroke-width="1.4"/>
      <text x="520" y="172" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">actor là người</text>
      <text x="520" y="188" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">&amp; có lý do?</text>

      <!-- Lỗi -->
      <rect x="744" y="144" width="224" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="744" y="144" width="224" height="64" rx="6" fill="#ffffff" stroke="#636b80" stroke-width="1" stroke-dasharray="4,4"/>
      <text x="960" y="159" fill="#636b80" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">AC-6 · AC-7</text>
      <text x="856" y="176" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Lỗi · không ghi</text>
      <text x="856" y="192" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">RAISE · mã thoát ≠ 0</text>

      <!-- Kiểm giá trị -->
      <polygon points="520,288 656,352 520,416 384,352" fill="#f5f5f5"/>
      <polygon points="520,288 656,352 520,416 384,352" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="520" y="348" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Giá trị trên tin còn</text>
      <text x="520" y="364" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">đúng giá trị đã áp?</text>

      <!-- Hoàn tác -->
      <rect x="96" y="448" width="288" height="112" rx="6" fill="#f5f5f5"/>
      <rect x="96" y="448" width="288" height="112" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="376" y="463" fill="#636b80" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">AC-6</text>
      <text x="240" y="480" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Trả field về trống</text>
      <text x="240" y="500" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">property_type → unknown · khác → NULL</text>
      <text x="240" y="516" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">đề xuất → reverted</text>
      <text x="240" y="532" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">mở lại superseded → thẻ duyệt</text>
      <text x="240" y="548" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">căn liên kết · enrichment_log</text>

      <!-- Bỏ qua -->
      <rect x="672" y="448" width="256" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="672" y="448" width="256" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="920" y="463" fill="#636b80" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">AC-6</text>
      <text x="800" y="480" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Bỏ qua</text>
      <text x="800" y="496" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">value-changed / not-applied</text>

      <!-- Điểm nhập -->
      <circle cx="520" cy="608" r="4" fill="#2d3142"/>

      <!-- Audit -->
      <rect x="400" y="640" width="240" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="400" y="640" width="240" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="632" y="655" fill="#636b80" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">AC-6</text>
      <text x="520" y="672" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Ghi ops_audit</text>
      <text x="520" y="688" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">enrich:revert · mỗi lần gọi</text>

      <!-- Kết -->
      <rect x="344" y="728" width="352" height="56" rx="28" fill="#f5f5f5"/>
      <rect x="344" y="728" width="352" height="56" rx="28" fill="rgba(79,93,117,0.10)" stroke="#636b80" stroke-width="1"/>
      <text x="520" y="752" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Lượt enrich sau</text>
      <text x="520" y="770" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">giá trị LLM lên thẻ · luật không đẩy lại</text>
      <text x="708" y="760" fill="#636b80" font-size="9" font-family="'Geist Mono', monospace">AC-7</text>

      <!-- ===== Chú giải ===== -->
      <line x1="40" y1="816" x2="1000" y2="816" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <text x="40" y="836" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.18em">CHÚ GIẢI</text>

      <rect x="40" y="852" width="24" height="12" rx="6" fill="rgba(79,93,117,0.10)" stroke="#636b80" stroke-width="1"/>
      <text x="72" y="862" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Bắt đầu / kết</text>

      <rect x="168" y="852" width="24" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="200" y="862" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Bước máy</text>

      <polygon points="292,850 304,858 292,866 280,858" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="312" y="862" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Rẽ nhánh</text>

      <circle cx="396" cy="858" r="4" fill="#2d3142"/>
      <text x="408" y="862" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Nhập nhánh</text>

      <polygon points="508,850 520,858 508,866 496,858" fill="rgba(235,108,54,0.06)" stroke="#eb6c36" stroke-width="1.4"/>
      <text x="528" y="862" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Cổng người (luật 7: chỉ hitl:… mới ghi)</text>

      <rect x="760" y="852" width="24" height="12" rx="2" fill="#ffffff" stroke="#636b80" stroke-width="1" stroke-dasharray="4,4"/>
      <text x="792" y="862" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Dừng, không bảng nào đổi</text>
    </svg>
  </div>
</body>
</html>
