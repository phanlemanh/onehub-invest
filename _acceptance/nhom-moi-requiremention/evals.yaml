    expected: "exit 0; ca 'NM-AC-1 nhóm mới ở 4 bố cục → {enabled:true, requireMention:true} đúng chỗ' (default có groups riêng, default kế thừa channel, layout cũ, acc2), mỗi bố cục so deepEqual mục nhóm trong tệp giả VÀ so enabledGroups của mọi tài khoản trước/sau: KHÔNG tài khoản nào mất nhóm, KHÔNG tài khoản khác nhận group:moi; chiều đỏ 'NM-AC-1 bản sao dựng nhóm mới requireMention false, gỡ kiểm → tệp nhận false' ok (bản sao khác bản gốc, rào chạy trên bản sao)"
