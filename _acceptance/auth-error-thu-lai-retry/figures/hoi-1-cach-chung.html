<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hỏi-1 cách chứng</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Lora:ital,wght@0,400;1,400&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Lora', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1040px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.25;
      color: var(--color-ink);
      margin-bottom: 0.5rem;
    }
    .sub {
      font-size: 0.875rem;
      color: var(--color-muted);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Cổng Phạm vi · auth-error-thu-lai-retry · hoi-1-cach-chung</p>
    <h1>Hỏi-1: chứng “Thử lại” tải lại từ server bằng gì</h1>
    <p class="sub">AC-1 · hai nhánh, nhánh tô cam là nhánh máy khuyên</p>

    <svg viewBox="0 0 1000 620" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- ============ Khung nhánh (nền, vẽ trước) ============ -->
      <!-- Nhánh A: khung nhấn duy nhất -->
      <rect x="48" y="136" width="440" height="352" rx="8" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4"/>
      <text x="64" y="160" fill="#ba4513" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.14em">NHÁNH A · MÁY KHUYÊN</text>
      <!-- Nhánh B -->
      <rect x="512" y="136" width="440" height="352" rx="8" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="528" y="160" fill="#4f5d75" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.14em">NHÁNH B</text>

      <!-- ============ Mũi tên (vẽ trước nút) ============ -->
      <!-- Gốc → A (attach x=440) -->
      <path d="M 440 96 L 440 112 Q 440 120 432 120 L 276 120 Q 268 120 268 128 L 268 136" fill="none" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <!-- Gốc → B (attach x=560) -->
      <path d="M 560 96 L 560 112 Q 560 120 568 120 L 724 120 Q 732 120 732 128 L 732 136" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Trong nhánh A -->
      <line x1="268" y1="228" x2="268" y2="252" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <line x1="268" y1="348" x2="268" y2="372" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <!-- Trong nhánh B -->
      <line x1="732" y1="228" x2="732" y2="252" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="732" y1="348" x2="732" y2="372" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- ============ Nút gốc: câu hỏi ============ -->
      <rect x="160" y="24" width="680" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="160" y="24" width="680" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="500" y="44" fill="#4f5d75" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">HỎI-1 · AC-1</text>
      <text x="500" y="66" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Bấm “Thử lại” trên trang lỗi đăng nhập/đăng ký —</text>
      <text x="500" y="84" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">chứng rằng nó tải lại từ server bằng gì?</text>

      <!-- ============ Nhánh A ============ -->
      <!-- A1 · cách làm -->
      <rect x="64" y="172" width="408" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="64" y="172" width="408" height="56" rx="6" fill="#ffffff" stroke="#eb6c36" stroke-width="1"/>
      <text x="268" y="205" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">jsdom + ranh giới lỗi THẬT của Next</text>

      <!-- A2 · cách chứng -->
      <rect x="64" y="252" width="408" height="96" rx="6" fill="#f5f5f5"/>
      <rect x="64" y="252" width="408" height="96" rx="6" fill="#ffffff" stroke="#eb6c36" stroke-width="1"/>
      <text x="80" y="272" fill="#4f5d75" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.14em">CÁCH CHỨNG</text>
      <text x="80" y="300" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif">Bấm → Next gọi <tspan font-family="'Geist Mono', monospace">router.refresh()</tspan></text>
      <text x="80" y="320" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif">đúng 1 lần (đếm)</text>

      <!-- A3 · đánh đổi -->
      <rect x="64" y="372" width="408" height="100" rx="6" fill="#f5f5f5"/>
      <rect x="64" y="372" width="408" height="100" rx="6" fill="#ffffff" stroke="#eb6c36" stroke-width="1"/>
      <text x="80" y="392" fill="#4f5d75" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.14em">ĐÁNH ĐỔI</text>
      <text x="80" y="420" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif">không đụng code sản phẩm</text>
      <text x="80" y="440" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif">không frame cho người ký</text>
      <text x="80" y="460" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif">giao diện không đổi</text>

      <!-- ============ Nhánh B ============ -->
      <!-- B1 · cách làm -->
      <rect x="528" y="172" width="408" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="528" y="172" width="408" height="56" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.40)" stroke-width="1"/>
      <text x="732" y="205" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Smoke trên bản chạy <tspan font-family="'Geist Mono', monospace">:3460</tspan></text>

      <!-- B2 · cách chứng -->
      <rect x="528" y="252" width="408" height="96" rx="6" fill="#f5f5f5"/>
      <rect x="528" y="252" width="408" height="96" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.40)" stroke-width="1"/>
      <text x="544" y="272" fill="#4f5d75" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.14em">CÁCH CHỨNG</text>
      <text x="544" y="300" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif">Chỉnh tạm <tspan font-family="'Geist Mono', monospace">/login</tspan> ném lỗi → bấm →</text>
      <text x="544" y="320" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif">thấy request RSC mới + ảnh trước/sau</text>
      <text x="544" y="340" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif">→ khôi phục</text>

      <!-- B3 · đánh đổi -->
      <rect x="528" y="372" width="408" height="100" rx="6" fill="#f5f5f5"/>
      <rect x="528" y="372" width="408" height="100" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.40)" stroke-width="1"/>
      <text x="544" y="392" fill="#4f5d75" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.14em">ĐÁNH ĐỔI</text>
      <text x="544" y="420" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif">có frame · thêm ~1 eval</text>
      <text x="544" y="440" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif">rủi ro HMR</text>
      <text x="544" y="460" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif">chỉnh tạm tệp (auth) lúc chấm</text>

      <!-- ============ Chân hình ============ -->
      <text x="500" y="524" fill="#4f5d75" font-size="12" font-family="'Geist', sans-serif" text-anchor="middle">Dòng lệnh duyệt điền sẵn A; muốn B thì trả “<tspan fill="#2d3142" font-family="'Geist Mono', monospace">sửa: Hỏi-1 = B</tspan>”</text>

      <!-- ============ Chú giải ============ -->
      <line x1="48" y1="552" x2="952" y2="552" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <text x="48" y="576" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.18em">CHÚ GIẢI</text>

      <rect x="48" y="588" width="24" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="80" y="598" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Câu hỏi chờ ký</text>

      <rect x="208" y="588" width="24" height="12" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4"/>
      <text x="240" y="598" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Nhánh máy khuyên</text>

      <rect x="388" y="588" width="24" height="12" rx="2" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="420" y="598" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Nhánh còn lại</text>
    </svg>
  </div>
</body>
</html>
