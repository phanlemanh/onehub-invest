    criterion: AC-1
    executor: test
    cmd: config:executors.test.design_floor_vung
    paths: [_acceptance/config.yaml, app/eslint.config.mjs, scripts/design-floor-vung.test.mjs]
    expected: "exit 0; ca 'NDF-AC-1' xanh: surface_globs = [app/src/app/**, app/src/components/*.tsx] + 13 dòng <dir>/** theo thứ tự chữ, đúng tập thư mục con trừ VENDOR_DIRS; không có app/src/components/**"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
