    executor: test
    cmd: config:executors.test.design_floor_vung
    paths: [_acceptance/config.yaml, app/eslint.config.mjs, app/src/components/**, scripts/design-floor-vung.test.mjs]
    expected: "exit 0; ca 'NDF-AC-2' xanh trên cây thật (readdir); chiều đỏ trên bản sao mkdtemp có thư mục thật moi-khong-khai/x.tsx qua cùng hàm liệt kê → 'thư mục chưa khai: moi-khong-khai'; surface_globs bản sao thêm app/src/components/ui/** → 'vừa vùng giao diện vừa vendor: ui'"
