    paths: [pipeline/transform-zalo.mjs, pipeline/lib/assert.mjs, pipeline/scripts/do-va-doc-tin.mjs]
    expected: "exit 0; lượt cây in ĐẠT từng thước của AC-9 kèm mẫu số và số phần giữ lại; in đường tập, sha256 nhãn, cách chia, sha nền, trạng thái công tắc, số tin, giữ, nghỉ, tổng mọc, mọc do bộ đọc, mọc do bài mới, bài đổi loại, ô block_raw thêm và đổi, S05 đổi; đỏ khi sha256 lệch bản ghim, vượt trần nghỉ, mọc do bộ đọc, S05, dung_thanh_sai, có tin hai trục, công tắc không có tác dụng, hoặc có migration mới; lượt bản nền phải TRƯỢT pn, dt_phay, phuong_huong; thiếu tập nhãn thì exit 2 gọi tên tập; in nhãn «tác tử gắn, không phải nhãn vàng»; không in chữ bài"
