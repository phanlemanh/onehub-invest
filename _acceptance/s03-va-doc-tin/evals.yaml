    cmd: config:executors.script.va_doc_tin_db
    paths: [pipeline/transform-zalo.mjs, pipeline/lib/assert.mjs, pipeline/scripts/va-doc-tin.itest.mjs]
    expected: "exit 0; ca 'SV1-AC-8 DB' xanh trên DB thử trong ROLLBACK: mỗi Given của AC-8 so đúng cặp giá trị theo bài; bài «toà S902 và S101», «toà GH2 và toà GH3» không có block_raw; «S1.03.12.05», «S5.03-22.06», «S605.10.17» giữ nguyên mã và ra toà S1.03, S5.03, S605; hai mã bốn phần khác nhau không có unit_number; bài có mã và thiếu mã ra hai tin; tin seed sẵn offer_id dính hai trục sau nạp mỗi offer_id một unit_number; parser khác LLM thì parser thắng, LLM giữ khi parser không đọc ra; hai lượt không nhân dòng; ca đỏ thuần 'SV1-AC-8' trên bản sao bỏ luật bài nhiều mã ghim mã thứ hai"
