schema_version: 1
feature_slug: s03-va-doc-tin
# Ca test mang tiền tố «SV1-AC-n»: thuần ở pipeline/scripts/va-doc-tin.test.mjs; DB thử oneinvest_n1_sv1 (BEGIN…ROLLBACK) ở
# pipeline/scripts/va-doc-tin.itest.mjs; phép đo tập nhãn và bài thật (chỉ đọc) ở pipeline/scripts/do-va-doc-tin.mjs.
# Mỗi ma trận có ca đỏ: bản sao đột biến của transform-zalo.mjs làm ca đỏ với thông điệp ghim mã ca.
evals:
  - id: E1
    criterion: AC-1
    executor: test
    cmd: config:executors.test.va_doc_tin
    paths: [pipeline/transform-zalo.mjs, pipeline/scripts/va-doc-tin.test.mjs]
    expected: "exit 0; ca 'SV1-AC-1' xanh: ma trận viết trước, số assert bằng số dòng, «1.234m2» giữ 1,234; ca đỏ trên bản sao bỏ phẩy khỏi regex diện tích ghim «SV1-AC-1» và dòng «45,7m2»"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E2
    criterion: AC-2
    executor: test
    cmd: config:executors.test.va_doc_tin
    paths: [pipeline/transform-zalo.mjs, pipeline/scripts/va-doc-tin.test.mjs]
    expected: "exit 0; ca 'SV1-AC-2' xanh: dòng viết tắt và dạng cũ ra đúng số, các dòng không phải phòng ra null; ca đỏ trên bản sao bỏ chặn chữ sau «n» ghim «SV1-AC-2» và dòng «2 năm»"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E3
    criterion: AC-3
    executor: test
    cmd: config:executors.test.va_doc_tin
    paths: [pipeline/transform-zalo.mjs, pipeline/scripts/va-doc-tin.test.mjs]
    expected: "exit 0; ca 'SV1-AC-3' xanh: ba dòng hướng ra null, ba dòng đích danh ra phường Tây Nam, phường thường vẫn khớp; ca đỏ trên bản sao bỏ luật hướng ghim «SV1-AC-3» và dòng «hướng Tây Nam»"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E4
    criterion: AC-4
    executor: test
    cmd: config:executors.test.va_doc_tin
    paths: [pipeline/transform-zalo.mjs, pipeline/scripts/va-doc-tin.test.mjs]
    expected: "exit 0; ca 'SV1-AC-4' xanh: mỗi từ trong danh sách đóng có một dòng ra null, giá thật đúng khi có, nhãn giá thắng, «giá vốn», «giảm còn», «chỉ hơn», «cắt lỗ 2,9 tỷ» đúng đáp án, «ko vay 2ty1», «bán vay full 2.350ty» ra giá, «vay 1.400.000.000» ra null; ca đỏ trên bản sao bỏ luật ngữ cảnh ghim «SV1-AC-4» và dòng «vốn 1,4 tỷ»; bỏ chặn trước «vay» ghim dòng «bán vay full»; giá đồng không qua luật ghim dòng «cắt 450.000.000»"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E5
    criterion: AC-5
    executor: script
    layer: backend-effect
    cmd: config:executors.script.va_doc_tin_db
    paths: [pipeline/transform-zalo.mjs, pipeline/lib/assert.mjs, pipeline/scripts/va-doc-tin.itest.mjs]
    expected: "exit 0; ca 'SV1-AC-5 DB' xanh trên DB thử trong ROLLBACK: bài thuê 3 tỷ và đúng 1 tỷ thành tin bán đúng giá, bài «đang cho thuê 7tr/tháng. Giá bán: 2,7 tỷ» thành tin bán, «1 tỷ/tháng», «1 tỷ/th», «1,2 tỷ/năm» và bán 120 tỷ không thành tin, bộ đếm tăng đúng 3 thue-tu-1-ty và 1 ban-tren-100-ty; ca đỏ thuần 'SV1-AC-5' trên bản sao bỏ bước đổi loại ghim dòng thuê 3 tỷ; xét đơn vị trên toàn bài ghim dòng «7tr/tháng»"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E6
    criterion: AC-6
    executor: test
    cmd: config:executors.test.va_doc_tin
    paths: [pipeline/transform-zalo.mjs, pipeline/scripts/va-doc-tin.test.mjs]
