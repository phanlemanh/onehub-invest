    criterion: AC-1
    executor: script
    layer: backend-effect
    cmd: config:executors.script.luu_tang_huong_db
    paths: [db/migrations/067_tang_huong_tin.sql, pipeline/scripts/luu-tang-huong.itest.mjs]
    expected: "exit 0; ca 'SV2-AC-1' xanh: áp hai lần không lỗi, hai trường và cột có mặt, số phát biểu không đổi; fixture có một tin S06, lần một 1 phát biểu legacy, lần hai vẫn 1; bản sao bỏ NOT EXISTS của bước legacy thì đỏ ghim 'SV2-AC-1'"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E2
    criterion: AC-2
    executor: script
    layer: backend-effect
    cmd: config:executors.script.luu_tang_huong_db
