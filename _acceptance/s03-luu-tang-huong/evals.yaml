schema_version: 1
feature_slug: s03-luu-tang-huong
# Ca «SV2-AC-n»: thuần ở pipeline/scripts/luu-tang-huong.test.mjs; DB thử oneinvest_n1_sv2 ở pipeline/scripts/luu-tang-huong.itest.mjs; phép đo nhãn và toàn bộ
# bài (đọc, chạy trong bản sao DB) ở pipeline/scripts/do-luu-tang-huong.mjs. Mỗi ma trận có ca đỏ: bản sao đột biến ghim mã ca.
evals:
