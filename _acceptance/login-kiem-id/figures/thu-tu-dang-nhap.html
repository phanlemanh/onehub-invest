<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thứ tự đăng nhập</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Lora:ital,wght@0,400;1,400&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Lora', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1040px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.25;
      color: var(--color-ink);
      margin-bottom: 0.5rem;
    }
    .sub {
      font-size: 0.875rem;
      color: var(--color-muted);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 880px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Cổng Phạm vi · login-kiem-id · thu-tu-dang-nhap</p>
    <h1>Đăng nhập tài khoản thu: kiểm id trước, spawn sau</h1>
    <p class="sub">POST /api/v1/ops/zalo/login · AC-1 id rỗng · AC-2 khoảng trắng · AC-3 id lạ / dạng cờ · AC-4 id thật · AC-5 default · AC-6 phiên dở · AC-10 hồi quy ON14</p>

    <svg viewBox="0 0 960 960" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- ============ Đầu cột + vạch chia ============ -->
      <text x="60" y="44" fill="#4f5d75" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.18em">TRƯỚC · MÃ HIỆN TẠI</text>
      <text x="480" y="44" fill="#4f5d75" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.18em">SAU · THIẾT KẾ LOGIN-KIEM-ID</text>
      <line x1="440" y1="32" x2="440" y2="872" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>

      <!-- ============ Mũi tên (vẽ trước, nằm dưới nút) ============ -->
      <!-- Trước: nhận id → (không kiểm gì) → phiên đang chạy? -->
      <line x1="180" y1="120" x2="180" y2="470" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Trước: CÓ → trả QR cũ -->
      <line x1="276" y1="524" x2="318" y2="524" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Trước: KHÔNG → spawn → chờ QR → 200 -->
      <line x1="180" y1="576" x2="180" y2="606" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="180" y1="656" x2="180" y2="686" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="180" y1="736" x2="180" y2="766" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Sau: nhận id → đọc config → bước kiểm -->
      <line x1="620" y1="120" x2="620" y2="150" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="620" y1="200" x2="620" y2="230" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Bước kiểm SAI → 400 -->
      <path d="M768 336 H852 Q860 336 860 344 V390" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Bước kiểm ĐÚNG → phiên đang chạy? -->
      <line x1="620" y1="440" x2="620" y2="470" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Phiên: CÓ → trả QR cũ -->
      <line x1="716" y1="524" x2="798" y2="524" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Phiên: KHÔNG → spawn → chờ QR → 200 -->
      <line x1="620" y1="576" x2="620" y2="606" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="620" y1="656" x2="620" y2="686" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="620" y1="736" x2="620" y2="766" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- ============ Nhãn mũi tên (có mặt nạ, cách đường ≥6px) ============ -->
      <rect x="284" y="500" width="28" height="16" rx="2" fill="#f5f5f5"/>
      <text x="298" y="512" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">CÓ</text>

      <rect x="188" y="584" width="48" height="16" rx="2" fill="#f5f5f5"/>
      <text x="192" y="596" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.12em">KHÔNG</text>

      <rect x="792" y="312" width="32" height="16" rx="2" fill="#f5f5f5"/>
      <text x="808" y="324" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">SAI</text>

      <rect x="628" y="448" width="40" height="16" rx="2" fill="#f5f5f5"/>
      <text x="632" y="460" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.12em">ĐÚNG</text>

      <rect x="744" y="500" width="28" height="16" rx="2" fill="#f5f5f5"/>
      <text x="758" y="512" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">CÓ</text>

      <rect x="628" y="584" width="48" height="16" rx="2" fill="#f5f5f5"/>
      <text x="632" y="596" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.12em">KHÔNG</text>

      <!-- Chú thích: chỗ trống bên Trước -->
      <text x="196" y="328" fill="#636b80" font-size="12" font-style="italic" font-family="'Instrument Serif', 'Lora', serif">không đọc config,</text>
      <text x="196" y="344" fill="#636b80" font-size="12" font-style="italic" font-family="'Instrument Serif', 'Lora', serif">không kiểm id gì thêm</text>

      <!-- Chú thích: bước kiểm chen vào -->
      <text x="920" y="256" fill="#636b80" font-size="12" font-style="italic" font-family="'Instrument Serif', 'Lora', serif" text-anchor="end">chen vào TRƯỚC nhánh</text>
      <text x="920" y="272" fill="#636b80" font-size="12" font-style="italic" font-family="'Instrument Serif', 'Lora', serif" text-anchor="end">«phiên đang chạy»</text>

      <!-- ============ Cột TRƯỚC ============ -->
      <!-- Nhận accountId -->
      <rect x="60" y="72" width="240" height="48" rx="24" fill="#f5f5f5"/>
      <rect x="60" y="72" width="240" height="48" rx="24" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="180" y="92" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Nhận accountId</text>
      <text x="180" y="108" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">chỉ chặn rỗng / thiếu</text>

      <!-- Phiên đang chạy? -->
      <polygon points="180,472 276,524 180,576 84,524" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="180" y="520" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Có phiên</text>
      <text x="180" y="536" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">đang chạy?</text>

      <!-- Trả QR cũ -->
      <rect x="320" y="500" width="96" height="48" rx="24" fill="#f5f5f5"/>
      <rect x="320" y="500" width="96" height="48" rx="24" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="368" y="520" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Trả QR cũ</text>
      <text x="368" y="536" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">200</text>

      <!-- Spawn login -->
      <rect x="60" y="608" width="240" height="48" rx="6" fill="#f5f5f5"/>
      <rect x="60" y="608" width="240" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="180" y="628" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Spawn openclaw channels login</text>
      <text x="180" y="644" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">--account &lt;id&gt; · id chưa kiểm</text>

      <!-- Chờ QR -->
      <rect x="60" y="688" width="240" height="48" rx="6" fill="#f5f5f5"/>
      <rect x="60" y="688" width="240" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="180" y="708" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Chờ ảnh QR</text>
      <text x="180" y="724" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">/tmp/openclaw · tới 20 giây</text>

      <!-- Trả 200 -->
      <rect x="60" y="768" width="240" height="48" rx="24" fill="#f5f5f5"/>
      <rect x="60" y="768" width="240" height="48" rx="24" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="180" y="788" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Trả 200 kèm QR</text>
      <text x="180" y="804" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">mọi lỗi → 500</text>

      <text x="180" y="848" fill="#636b80" font-size="12" font-style="italic" font-family="'Instrument Serif', 'Lora', serif" text-anchor="middle">id có khoảng trắng, id lạ, dạng cờ</text>
      <text x="180" y="864" fill="#636b80" font-size="12" font-style="italic" font-family="'Instrument Serif', 'Lora', serif" text-anchor="middle">đều tới openclaw channels login</text>

      <!-- ============ Cột SAU ============ -->
      <!-- Nhận accountId nguyên văn -->
      <rect x="500" y="72" width="240" height="48" rx="24" fill="#f5f5f5"/>
      <rect x="500" y="72" width="240" height="48" rx="24" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="620" y="92" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Nhận accountId nguyên văn</text>
      <text x="620" y="108" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">không trim · không phải chuỗi → &quot;&quot;</text>

      <!-- Đọc openclaw.json -->
      <rect x="500" y="152" width="240" height="48" rx="6" fill="#f5f5f5"/>
      <rect x="500" y="152" width="240" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="620" y="172" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Đọc openclaw.json</text>
      <text x="620" y="188" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">channels.zalouser.accounts</text>

      <!-- Bước kiểm id dùng chung (tiêu điểm) -->
      <polygon points="620,232 768,336 620,440 472,336" fill="#f5f5f5"/>
      <polygon points="620,232 768,336 620,440 472,336" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4"/>
      <text x="620" y="292" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Bước kiểm id</text>
      <text x="620" y="312" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">không rỗng</text>
      <text x="620" y="328" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">không khoảng trắng</text>
      <text x="620" y="344" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">không mở đầu bằng «-»</text>
      <text x="620" y="360" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">«default» luôn cho qua</text>
      <text x="620" y="376" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">có trong danh sách</text>
      <text x="620" y="396" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">requireLoginAccount()</text>

      <!-- 400: openclaw không được gọi -->
      <rect x="800" y="392" width="120" height="56" rx="28" fill="#f5f5f5"/>
      <rect x="800" y="392" width="120" height="56" rx="28" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="860" y="416" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Trả 400</text>
      <text x="860" y="432" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">openclaw: 0 lệnh</text>
      <text x="860" y="472" fill="#636b80" font-size="12" font-style="italic" font-family="'Instrument Serif', 'Lora', serif" text-anchor="middle">AC-1 · 2 · 3 · 6</text>

      <!-- Phiên đang chạy? -->
      <polygon points="620,472 716,524 620,576 524,524" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="620" y="520" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Có phiên</text>
      <text x="620" y="536" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">đang chạy?</text>

      <!-- Trả QR cũ -->
      <rect x="800" y="500" width="120" height="48" rx="24" fill="#f5f5f5"/>
      <rect x="800" y="500" width="120" height="48" rx="24" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="860" y="520" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Trả QR cũ</text>
      <text x="860" y="536" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">200 · id đã kiểm</text>

      <!-- Spawn login -->
      <rect x="500" y="608" width="240" height="48" rx="6" fill="#f5f5f5"/>
      <rect x="500" y="608" width="240" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="620" y="628" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Spawn openclaw channels login</text>
      <text x="620" y="644" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">--channel zalouser --account &lt;id&gt;</text>

      <!-- Chờ QR ở thư mục QR -->
      <rect x="500" y="688" width="240" height="48" rx="6" fill="#f5f5f5"/>
      <rect x="500" y="688" width="240" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="620" y="708" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Chờ ảnh QR ở thư mục QR</text>
      <text x="620" y="724" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">OPENCLAW_QR_DIR · mặc định /tmp/openclaw</text>

      <!-- Trả 200 -->
      <rect x="500" y="768" width="240" height="48" rx="24" fill="#f5f5f5"/>
      <rect x="500" y="768" width="240" height="48" rx="24" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="620" y="788" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Trả 200 kèm QR</text>
      <text x="620" y="804" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">AC-4 · AC-5 · đúng một dòng login</text>

      <text x="620" y="848" fill="#636b80" font-size="12" font-style="italic" font-family="'Instrument Serif', 'Lora', serif" text-anchor="middle">bước kiểm dùng chung với việc gỡ tài khoản (ON14)</text>
      <text x="620" y="864" fill="#636b80" font-size="12" font-style="italic" font-family="'Instrument Serif', 'Lora', serif" text-anchor="middle">thông điệp giữ nguyên · AC-10</text>

      <!-- ============ Chú giải ============ -->
      <line x1="40" y1="892" x2="920" y2="892" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <text x="40" y="908" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.18em">CHÚ GIẢI · HÌNH DẠNG MANG LOẠI NÚT</text>

      <rect x="40" y="924" width="24" height="12" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="72" y="934" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Bắt đầu / kết thúc</text>

      <rect x="200" y="924" width="24" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="232" y="934" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Bước</text>

      <polygon points="300,930 312,924 324,930 312,936" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="336" y="934" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Rẽ nhánh</text>

      <polygon points="420,930 432,924 444,930 432,936" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4"/>
      <text x="456" y="934" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Bước kiểm id dùng chung — chỗ mới chen vào, trước mọi lệnh openclaw</text>
    </svg>
  </div>
</body>
</html>
