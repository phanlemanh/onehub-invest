    expected: "exit 0; «ℹ fail 0»; ca «PB6-AC-1 toà theo UPI» xanh: tập khoá = tập khoá cấp toà của tệp hợp đồng (so bằng tập); universalPropertyId, buildingName, complexName, subdivisionName, city, stateOrProvince, country VN, catalogTier, unitCount 2, activeListingCount khớp dòng cấy"
