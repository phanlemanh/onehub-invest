    cmd: config:executors.script.snn_test
    paths: [scripts/zalo-import-daily.sh, scripts/s03-nap-nhanh.test.mjs, pipeline/cron/com.oneinvest.s03-nap-15phut.plist]
    expected: "exit 0; '✔ NN-2 lượt 00:00 (không cờ) giữ nguyên'; should-NOT-fire '✔ NN-4 đối chứng: lượt 00:00 gặp khoá sống thì CHỜ (không bỏ lượt)'"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

