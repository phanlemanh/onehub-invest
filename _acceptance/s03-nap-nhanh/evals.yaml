schema_version: 1
feature_slug: s03-nap-nhanh
# Mọi eval chạy trên bản chép tệp bọc trong cây tạm: node/sleep giả, HOME tạm, DATABASE_URL cổng đóng — không DB,
# không launchctl, không snapshot thật.
evals:
  - id: E1
    criterion: AC-1
    executor: script
    cmd: config:executors.script.snn_test
    paths: [scripts/zalo-import-daily.sh, scripts/s03-nap-nhanh.test.mjs, pipeline/cron/com.oneinvest.s03-nap-15phut.plist]
    expected: "exit 0; '✔ NN-1 lượt nhanh lành'; 'ℹ pass 11', 'ℹ fail 0', 'ℹ skipped 0'"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

