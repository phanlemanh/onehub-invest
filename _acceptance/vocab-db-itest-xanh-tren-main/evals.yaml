schema_version: 1
feature_slug: vocab-db-itest-xanh-tren-main
evals:
  - id: E1
    criterion: AC-1
    executor: test
    cmd: config:executors.test.vocab_db
    paths: [pipeline/scripts/vocab-db.itest.mjs, db/migrations/**, pipeline/mappings.yaml]
    expected: "exit 0; bảy ca VD-AC-7, VD-AC-7 đối chứng, VD-AC-8, VD-AC-8 CLI, VD-AC-7 DB thật không đổi, VD-AC-7 emitSeed, VD-IQ-3 xanh trên DB :5433"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E2
    criterion: AC-2
    executor: script
    cmd: config:executors.script.vocab_db_rieng
    paths: [pipeline/scripts/vocab-db.itest.mjs, db/migrations/**]
    expected: "exit 0; dòng 'db riêng: dựng · áp N migration · test xanh', 'db riêng: đã xoá', 'không còn DB tạm · DB oneinvest không đổi'"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E3
    criterion: AC-3
    executor: script
    cmd: config:executors.script.vocab_db_doi_chung
    paths: [pipeline/scripts/vocab-db.itest.mjs]
    expected: "exit 0; dòng 'vocab-db đối chứng: bản cũ đỏ <n> ca, chứa đủ 4/4 ca đã biết' (VD-AC-7 áp 043…, VD-AC-8 --check-db…, VD-AC-7 emitSeed…, VD-IQ-3…), 'bản hiện tại xanh 3/3 lượt', 'tên ca giống hệt · lời gọi assert <a> → <a>', 'ràng buộc *_chk + số dòng ref_* trước = sau'; lệch bất kỳ vế nào → exit 1 nêu vế"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E4
    criterion: AC-4
    executor: test
    cmd: config:executors.test.pipeline
    paths: [pipeline/**]
    expected: "exit 0; cd pipeline && npm test toàn bộ xanh"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
