<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Suite keys S4</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Lora:ital,wght@0,400;1,400&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Geist', system-ui, sans-serif; background: #f5f5f5; color: #2d3142; padding: 2rem; display: flex; justify-content: center; }
    .frame { max-width: 1000px; width: 100%; }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <!-- Hỏi-2 ui-clean-b3-charts · nguồn: figures/index.md (đề bài suite-keys) -->
  <div class="frame">
<svg viewBox="0 0 1000 480" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="#f5f5f5"/>

  <!-- Header -->
  <text x="40" y="40" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" font-weight="500" letter-spacing="0.18em">HỎI-2 · CỔNG PHẠM VI · UI-CLEAN-B3-CHARTS</text>
  <text x="40" y="76" fill="#2d3142" font-size="28" font-family="'Instrument Serif', 'Lora', serif">suite_keys của S4 — mỗi lượt chạy bộ kiểm nào</text>
  <text x="40" y="100" fill="#4f5d75" font-size="12" font-family="'Geist', sans-serif">Hai nhánh rẽ. Nhánh khuyên giữ vòng kiểm gọn theo phạm vi đợt UI (AC-6).</text>

  <!-- Arrows first -->
  <!-- Nhánh khuyên: đỉnh trên của hình thoi → hộp A -->
  <path d="M160,200 L160,180 Q160,172 168,172 L318,172" fill="none" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
  <rect x="204" y="146" width="72" height="16" rx="2" fill="#f5f5f5"/>
  <text x="240" y="158" fill="#ba4513" font-size="9" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle" letter-spacing="0.06em">KHUYÊN</text>
  <line x1="560" y1="172" x2="638" y2="172" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

  <!-- Nhánh khác: đỉnh dưới → hộp B -->
  <path d="M160,328 L160,348 Q160,356 168,356 L318,356" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
  <rect x="204" y="330" width="72" height="16" rx="2" fill="#f5f5f5"/>
  <text x="240" y="342" fill="#636b80" font-size="9" font-family="'Geist Mono', monospace" font-weight="500" text-anchor="middle" letter-spacing="0.06em">MỞ RỘNG</text>
  <line x1="560" y1="356" x2="638" y2="356" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- Điểm hỏi -->
  <polygon points="60,264 160,200 260,264 160,328" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="160" y="244" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" font-weight="500" text-anchor="middle" letter-spacing="0.12em">HỎI-2</text>
  <text x="160" y="264" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif" font-weight="600" text-anchor="middle">Chạy bộ kiểm nào</text>
  <text x="160" y="280" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif" font-weight="600" text-anchor="middle">mỗi lượt S4?</text>

  <!-- Hộp A (khuyên, focal) -->
  <rect x="320" y="124" width="240" height="96" rx="6" fill="#f5f5f5"/>
  <rect x="320" y="124" width="240" height="96" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4"/>
  <text x="336" y="144" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" font-weight="500" letter-spacing="0.12em">SUITE_KEYS</text>
  <text x="336" y="168" fill="#2d3142" font-size="10" font-family="'Geist Mono', monospace" font-weight="600">[test.app, test.ui_lint_rules]</text>
  <text x="336" y="188" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif">tsc + lint app</text>
  <text x="336" y="204" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif">RuleTester plugin onehub-ui</text>

  <!-- Kết quả A -->
  <rect x="640" y="124" width="320" height="96" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="656" y="144" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" font-weight="500" letter-spacing="0.12em">KẾT QUẢ</text>
  <text x="656" y="168" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif" font-weight="600">Mỗi lượt S4 ~1–2 phút</text>
  <text x="656" y="188" fill="#4f5d75" font-size="12" font-family="'Geist', sans-serif">Phủ đúng phạm vi đợt UI: lint, kiểu, luật</text>
  <text x="656" y="208" fill="#636b80" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.08em">AC-6</text>

  <!-- Hộp B (nhánh khác) -->
  <rect x="320" y="308" width="240" height="96" rx="6" fill="#f5f5f5"/>
  <rect x="320" y="308" width="240" height="96" rx="6" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.40)" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="336" y="328" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" font-weight="500" letter-spacing="0.12em">SUITE_KEYS</text>
  <text x="336" y="352" fill="#2d3142" font-size="10" font-family="'Geist Mono', monospace" font-weight="600">[…, + collector, pipeline, agent]</text>
  <text x="336" y="372" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif">Thêm test 3 module ngoài UI</text>
  <text x="336" y="388" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif">chạy cả kho mỗi lượt</text>

  <!-- Kết quả B -->
  <rect x="640" y="308" width="320" height="96" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.40)" stroke-width="1"/>
  <text x="656" y="328" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" font-weight="500" letter-spacing="0.12em">KẾT QUẢ</text>
  <text x="656" y="352" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif" font-weight="600">Chắc hơn cho kho, chậm hơn</text>
  <text x="656" y="372" fill="#4f5d75" font-size="12" font-family="'Geist', sans-serif">Không liên quan đợt UI — thêm thời gian,</text>
  <text x="656" y="388" fill="#4f5d75" font-size="12" font-family="'Geist', sans-serif">không thêm tín hiệu cho AC-6</text>

  <!-- Legend -->
  <line x1="40" y1="432" x2="960" y2="432" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
  <text x="40" y="460" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" font-weight="500" letter-spacing="0.14em">CHÚ GIẢI</text>
  <rect x="128" y="448" width="24" height="16" rx="3" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4"/>
  <text x="160" y="460" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif">nhánh khuyên</text>
  <rect x="268" y="448" width="24" height="16" rx="3" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.40)" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="300" y="460" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif">nhánh khác</text>
  <polygon points="400,456 412,448 424,456 412,464" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="432" y="460" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif">điểm hỏi ở Cổng Phạm vi</text>
  <text x="960" y="460" fill="#636b80" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.08em">AC-6</text>
</svg>
  </div>
</body>
</html>
