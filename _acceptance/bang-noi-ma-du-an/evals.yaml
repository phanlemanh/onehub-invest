    paths: [pipeline/lib/ban-ghi-nguon.mjs, db/migrations/093_*.sql, pipeline/scripts/bang-noi-du-an.itest.mjs]
    expected: "exit 0; ca 'ND-AC-3c' trên stg_s08_project thật của DB thử (177 dự án): bộ chuyển S08 ra 177 bản ghi, mỗi bản ghi đúng 14 khoá; dự án có điểm nằm trong areas (submarket) có tinh và xa khác null (đo 13/11: 172), điểm ngoài vùng có tinh null với ly_do 'ngoai-vung', 3 dự án không điểm có ly_do 'khong-diem', tổng ba nhóm = 177; ma_so_dn null ở cả 177; ca 'ND-AC-3b': INSERT fixture một dự án S07 có phân khu cha vào stg_s07_project của DB thử (bảng thật của 093), bộ chuyển S07 đọc từ chính bảng đó ra đúng 14 khoá deepEqual bản kỳ vọng viết tay, và tập cột bộ chuyển đọc là tập con của information_schema.columns của stg_s07_project; đối chứng đỏ thứ hai: bản sao bộ chuyển đọc một cột không có trong bảng thì ca nêu tên cột; đối chứng đỏ: bản sao bộ chuyển bỏ suy xã từ điểm thì đếm xa khác null về 0, ca nêu 'xa-tu-diem'"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E6
