schema_version: 1
feature_slug: bang-noi-ma-du-an
# Ca «BN-AC-n». Lệnh đo nằm ở probes/*.sh của hồ sơ (cùng lệ PL20, PL36: _acceptance/config.yaml là tệp bảo vệ). Mọi probe chạy
# trên DB thử của riêng lượt (db/db-thu.sh) hoặc bản chép DB máy thu; không ghi vào oneinvest. Bản ghi cấp dự án của dữ liệu thật
# rút từ bản chép, không fixture viết tay; ma trận viết trước chỉ dùng cho hàm thuần (AC-1 rỗng giả, AC-2).

evals:
  - id: E1
    criterion: AC-1
    executor: script
    cmd: bash _acceptance/bang-noi-ma-du-an/probes/bo-chuyen.sh
    layer: backend-effect
    paths: ["pipeline/lib/ban-ghi-nguon*.mjs"]
    expected: >
      Trên bản chép DB máy thu: số bản ghi và số có tỉnh, xã, điểm của S07, S08, S09, S10, S16 bằng phép đếm SQL độc lập viết trong
      probe (mỗi nguồn × trường một assert); S10 mọi bản ghi tỉnh null, lý do khong-vi-tri; bảng 63 tỉnh cũ đủ 63 dòng, mỗi mã cũ có
      dòng area_aliases; một bản ghi S07 thật có tên tỉnh cũ ra tỉnh mới, bỏ các dòng alias của mã ấy ở DB thử thì tỉnh null (không ra
      tỉnh khác); ma trận rỗng giả 10 ô: 6 ô về null, «Khác», «Liên hệ», «Vinhomes», «0 m2» giữ; đếm bản ghi bị đổi bởi quy ước rỗng
      giả trên bản chép, in theo nguồn × trường. Chiều đỏ: bản đột biến bỏ «N/A» khỏi RONG_GIA thì ô ấy đỏ, thông điệp gọi tên giá trị.

  - id: E2
    criterion: AC-2
    executor: test
    cmd: bash _acceptance/bang-noi-ma-du-an/probes/xep-nga.sh
    paths: ["pipeline/lib/khop-du-an*.mjs"]
    expected: >
      Ma trận viết trước, một assert mỗi ô, kết cục so deepEqual: đã nối → giu; tên «Đang cập nhật» → chua_noi:khong-ten; không tỉnh →
      chua_noi:khong-tinh; S10 → chua_noi:khong-vi-tri; MST trùng + tên trùng → noi:K1; điểm 200 m + tên trùng → noi:K2; điểm 200 m
      tên khác → chua_noi:khong-khop; cùng xã + tên trùng → noi:K3; tên trùng một nút cùng tỉnh khác xã → noi:T; tên trùng hai nút cùng
      tỉnh → chua_noi:nhieu-nut; tên trùng một nút khác tỉnh → chua_noi:khong-khop; nút mot_loi_khai nguồn khác cùng tỉnh trùng tên →
      noi:T. Chiều đỏ: bản đột biến bỏ điều kiện cùng tỉnh thì ô khác tỉnh đỏ, thông điệp ghim «cung-tinh».

  - id: E3
    criterion: AC-3
    executor: script
    cmd: bash _acceptance/bang-noi-ma-du-an/probes/the.sh
    layer: backend-effect
    paths: ["pipeline/noi-du-an-nguon.mjs", "pipeline/lib/khop-du-an*.mjs", "pipeline/lib/ban-ghi-nguon*.mjs"]
    expected: >
      Trên bản chép: dựng thẻ S07 hai lần; tổng theo ngả trong tệp deepEqual phép đếm của probe; mỗi căn cứ nối có đúng min(20, số
      cặp) mẫu; danh sách «khác nối sẵn» có mặt; tệp không chứa mã dự án nguồn nào (quét mọi mã của bản ghi); hai băm bằng nhau và bằng
      sha256 của danh sách kết cục chuẩn hoá tính lại trong probe; đếm dòng bốn bảng project_links, project_link_rules, registry_aliases,
      asset_nodes không đổi. Chiều đỏ: đổi kết cục một bản ghi trong danh sách thì băm tính lại khác băm trong tệp.

  - id: E4
    criterion: AC-4
    executor: script
    cmd: bash _acceptance/bang-noi-ma-du-an/probes/ap.sh
    layer: backend-effect
    paths: ["pipeline/noi-du-an-nguon.mjs", "pipeline/lib/khop-du-an*.mjs"]
    expected: >
      Trên DB thử chép từ DB máy thu: áp với băm sai → thoát khác 0, đếm bốn bảng không đổi; áp với băm đúng (S07) → đúng một dòng
      project_link_rules cho S07-K3, S07-T, S07-noi-san (khi có), S07-trang-thai; mỗi bản ghi S07 đúng một dòng project_links mang
      rule_id của lượt, mỗi dòng noi đúng một bí danh
      node:<id> ma_nguon giá trị du_an/<mã> nguồn S07; băm có sắp xếp của asset_nodes, s08_project_links, s10_project_links và bí danh
      có sẵn bằng trước áp; áp lần hai thoát 0, đếm và băm không đổi. Chiều đỏ: cấy lỗi vào lần ghi bí danh thứ 10 thì không dòng nào
      của lượt còn lại (một giao dịch).

  - id: E5
    criterion: AC-5
    executor: script
    cmd: bash _acceptance/bang-noi-ma-du-an/probes/ap.sh
    layer: backend-effect
    paths: ["pipeline/noi-du-an-nguon.mjs"]
    expected: >
      Sau lượt áp của E4: đảo luật S07-T → mọi bí danh của luật có retired_at, số dòng registry_aliases không giảm, dòng về chua_noi
      dao-luat, dòng luật có dao_by và dao_at; dòng của luật S07-K3 không đổi; đảo lần hai báo «da-dao», không ghi. Đảo tiếp mọi luật
      còn lại của S07 (lùi trọn): 0 dòng noi nguồn S07, số dòng ba bảng không giảm, băm có sắp xếp của bí danh còn hiệu lực bằng trước áp.

  - id: E6
    criterion: AC-6
    executor: script
    cmd: bash _acceptance/bang-noi-ma-du-an/probes/noi-san.sh
    layer: backend-effect
    paths: ["pipeline/noi-du-an-nguon.mjs", "pipeline/lib/khop-du-an*.mjs", "pipeline/lib/ban-ghi-nguon*.mjs"]
    expected: >
      Trên bản chép: thẻ S09 có 2 dòng giu căn cứ S09-noi-san, thẻ S16 có 5 dòng giu căn cứ S16-noi-san, nút đích bằng NOI_KHU_S09,
      NOI_DU_AN_S16; cấy vào DB thử một nút trùng tên cùng xã với một dự án chép cứng thì bản ghi vẫn giu nút chép cứng và có mặt ở
      danh sách «khác nối sẵn»; lệnh --ap --nguon S08 thoát khác 0 với lời «S08 do thẻ luật DA55 nối», không ghi; thẻ bóng S08 liệt đủ
      6 ca khác nối tay, mỗi ca ghi «quy ước dự án con có cha (mục 39)».

  - id: E7
    criterion: AC-7
    executor: script
    cmd: bash _acceptance/bang-noi-ma-du-an/probes/ben-doc.sh
    layer: backend-effect
    paths: ["pipeline/noi-du-an-nguon.mjs", "pipeline/lib/ban-ghi-nguon*.mjs", "pipeline/lib/khop-du-an*.mjs"]
    expected: >
      Trên DB thử chép từ DB máy thu: băm có sắp xếp đầu ra của napS16TheoKhu (mọi khu), bản đồ bí danh mà s09-dung đọc, danh-ba-vat-the
      chạy khô, và năm view v_toa_nut_vung, offer_building, s06_offer_project, v_s16_toa, v_s09_toa bằng nhau ở ba mốc trước áp, sau
      áp bốn nguồn S07 S09 S10 S16, sau đảo; in số giây từng câu. Chiều đỏ: cấy một bí danh ma_nguon S09 giá trị dạng toà «<pid>/<id>»
      trỏ node:<id> thì phép so của s09-dung đỏ, gọi tên bên đọc.

  - id: E8
    criterion: AC-8
    executor: test
    cmd: bash _acceptance/bang-noi-ma-du-an/probes/o-man.sh
    layer: backend-effect
    paths: ["app/src/lib/ops/registry/doc.ts", "app/src/components/ops/registry/registry-view.tsx", "app/tests/registry-nguon-chua-noi*.test.ts*"]
    expected: >
      Trên DB thử fixture (bản ghi rút từ bản chép): docDanhBa trả dòng S07, S16 với chưa nối / đã nạp đúng; S09 đã nối bằng số dòng
      noi của project_links S09; S10 một dòng riêng lý do «không có vị trí» và không cộng vào ô; dự án nối ở hai nơi đếm một lần; danh
      sách chưa nối mang lý do của project_links; S06, S08 bằng số trước khi thêm nhánh. Màn: dựng registry-view thật trên jsdom với
      đầu ra docDanhBa ấy, con số ô hiện ra bằng tổng chưa nối của S06, S07, S08, S09, S16 và dòng S10 hiện riêng kèm lý do. Chiều đỏ:
      bản đột biến cộng S10 vào ô ở registry-view (hoặc ở doc.ts) thì ca đỏ, thông điệp ghim «S10».

  - id: E9
    criterion: AC-9
    executor: script
    cmd: bash _acceptance/bang-noi-ma-du-an/probes/dau-cuoi.sh
    long_running: 60
    layer: backend-effect
    paths: ["pipeline/noi-du-an-nguon.mjs", "pipeline/lib/ban-ghi-nguon*.mjs", "pipeline/lib/khop-du-an*.mjs", "app/src/lib/ops/registry/doc.ts"]
    expected: >
      Trên bản chép DB máy thu: chạy thẻ, áp, kiểm, đo, đảo cho S07, S09, S10, S16; mỗi ngả của từng thẻ so với đầu ra của bộ đo S1
      đóng băng probes/s1/do.mjs chạy trên cùng bản chép (đếm độc lập với mã của hàng), in hai cột kèm hiệu số; ô đọc bằng docDanhBa
      in ba cột trước / đổi phạm vi / sau nối cho từng nguồn và tổng; sau khi đảo đủ mọi luật, ô về cột đổi phạm vi; ghi
      evidence/dau-cuoi.md. Lệnh thoát 1 và gọi tên nguồn, ngả khi hiệu số khác 0.

  - id: E10
    criterion: AC-3
    executor: judgment
    question: >
      Đọc mẫu nối căn cứ T và K3 trong thẻ S07 (evidence/the-S07.md): có cặp nào là hai dự án khác nhau chỉ trùng tên chung chung
      không? Có kiểu sai lặp lại mà luật sửa được không?
    inputs: ["_acceptance/bang-noi-ma-du-an/evidence/the-S07.md"]
    expected: >
      Thẻ có 20 mẫu mỗi căn cứ; người chấm đánh từng mẫu đúng/sai/không chắc kèm một dòng lý do và kết luận căn cứ T có đủ tin để
      Mạnh duyệt mẫu hay cần siết (ví dụ đòi thêm xã).

  - id: E11
    criterion: AC-9
    executor: script
    cmd: config:executors.suite.pipeline_a
    long_running: 90
    paths: ["pipeline/noi-du-an-nguon.mjs", "pipeline/lib/ban-ghi-nguon*.mjs", "pipeline/lib/khop-du-an*.mjs", "pipeline/tests/noi-du-an-nguon*.mjs"]
    expected: "exit 0; nửa A bộ test pipeline, 0 fail (khai ở đây để có long_running 90 trên Mac mini)."

  - id: E12
    criterion: AC-9
    executor: script
    cmd: config:executors.suite.pipeline_b
    long_running: 90
    paths: ["pipeline/noi-du-an-nguon.mjs", "pipeline/lib/ban-ghi-nguon*.mjs", "pipeline/lib/khop-du-an*.mjs", "pipeline/tests/noi-du-an-nguon*.mjs"]
    expected: "exit 0; nửa B bộ test pipeline, 0 fail (khai ở đây để có long_running 90)."
