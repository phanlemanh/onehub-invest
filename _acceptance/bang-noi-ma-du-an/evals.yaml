    cmd: config:executors.test.noi_da_ui
    paths: [app/src/components/ops/review/**, app/src/lib/ops/review-hang-muc.ts, app/tests/noi-du-an-ui.test.tsx]
    expected: "exit 0; ca 'ND-AC-9' dựng hàng duyệt thật trong jsdom, fetch giả: hạng mục 'Nối dự án' có thẻ với hai cột (nguồn, nút) và dòng căn cứ chứa 'K3'; bấm 'Nối' → fetch decide chưa gọi sau 4 giây giả, 'Hoàn tác' huỷ → không gọi sau 6 giây giả; không hoàn tác → gọi đúng 1 lần sau 5 giây; bấm 'Để sau' → fetch decide không gọi, thẻ chuyển xuống cuối hàng; trả {items:[]} → chữ 'Không còn cặp nào chờ nối'; trả 500 → Alert và nút 'Thử lại'; phiên viewer 0 nút 'Nối', 'Không phải', 'Để sau', 'Duyệt cả loạt'; phiên ops 0 nút 'Duyệt cả loạt', phiên admin 1 nút; đối chứng đỏ: bản sao bỏ kiểm vai admin thì phiên ops thấy nút, ca nêu 'admin-luat'; bản sao bỏ kiểm vai viewer thì ca nêu 'viewer'"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E12
    criterion: AC-10
    executor: ui-check
    layer: ui-observed
    paths: [app/src/components/ops/review/**, app/src/lib/ops/noi-du-an.ts]
    steps: "Từ gốc worktree đang kiểm: dựng DB thử 'bash db/db-thu.sh oneinvest_p4_da3' (chép DB local), áp migration của hàng lên DB thử bằng psql trong container one-invest-db (không chạm DB chung), chạy 'DATABASE_URL=postgres://oneinvest:oneinvest@localhost:5433/oneinvest_p4_da3 node pipeline/de-xuat-noi-du-an.mjs --nguon S08'; nạp 12 đề xuất K3 mẫu bằng 'DATABASE_URL=… node pipeline/scripts/bang-noi-du-an-mau.mjs' (cùng fixture của ca ND-AC-7); 'DATABASE_URL=… node scripts/dev-ops-account.mjs' (vai admin, mật khẩu ở .claude/ops-test-account.json, không in ra); chạy app dev cổng riêng :3465 với cùng DATABASE_URL; đăng nhập /login; mở /ops/review, chọn hạng mục 'Nối dự án'; chụp thẻ cặp; bấm 'Nối'; chụp toast; mở thẻ luật K3; chụp; bấm 'Duyệt cả loạt'; chụp nhật ký luật. Xong xoá DB thử: 'bash db/db-thu.sh oneinvest_p4_da3 --xoa'."
    expected: "thẻ cặp có cột nguồn (tên S08, địa chỉ) và cột nút danh bạ, dòng căn cứ đọc được (K3 · cùng xã · tên trùng); toast 'Đã nối' có nút 'Hoàn tác'; thẻ luật nêu tổng số cặp và 5 cặp mẫu; sau duyệt, nhật ký luật có dòng mới với nút 'Đảo luật'. Giới hạn đã khai: chỉ S08 có dữ liệu thật và chỉ ra 1 đề xuất K3 mới, thẻ luật trên màn dựng từ 12 đề xuất mẫu; thẻ cấp lô/toà không có trên màn vì chưa có bản ghi S11"
    evidence_required: [screenshot, observed, verifier, verified_at]
