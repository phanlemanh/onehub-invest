    paths: ["app/src/app/api/v1/ops/review/[id]/decide/route.ts", app/src/lib/ops/noi-du-an.ts, app/tests/noi-du-an.test.tsx]
    expected: "exit 0; ca 'ND-AC-6' trên lược đồ tạm đã áp migration: vai ops quyết 'noi' thẻ K3 → 200; SELECT status, decided_by deepEqual {status:'noi', decided_by: actor}; registry_aliases WHERE object_key='node:<id>' AND kind='ma_nguon' AND value='S08/<project_id>' đếm 1; ops_audit tăng 1; 'khong-phai' không lý do → 400 body.ly_do 'thieu-ly-do'; kèm lý do → status 'tu_choi', bí danh đếm 0; viewer → 403, đếm project_links/registry_aliases/ops_audit deepEqual trước; bản sao route ném ở lần ghi bí danh → 5xx, ba đếm deepEqual trước; đối chứng đỏ: bản sao bỏ ghi bí danh thì đếm bí danh 0, ca nêu 'bi-danh'"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E9
