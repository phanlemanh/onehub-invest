    cmd: config:executors.test.noi_da_route
    paths: [app/src/app/api/v1/ops/noi-du-an/**, app/src/lib/ops/noi-du-an.ts, app/tests/noi-du-an.test.tsx]
    expected: "exit 0; ca 'ND-AC-7' với 12 đề xuất K3 nguồn S08 trên lược đồ tạm (1 cặp đã được ops quyết 'tu_choi' trước): admin duyệt thẻ luật → project_link_rules đếm 1, 11 cặp noi cùng rule_id, 11 bí danh mới, cặp tu_choi giữ nguyên; admin đảo luật → một dòng nhật ký hanh_dong 'dao', 11 cặp về de_xuat, 11 bí danh có retired_at khác null, đếm dòng registry_aliases không giảm, review_queue project_link đang mở trỏ 11 cặp ấy đếm đúng 11 (mỗi cặp một); ops nối lại một cặp đã đảo → 200, registry_aliases của cặp có 2 dòng: dòng mới retired_at null, dòng cũ retired_at giữ nguyên; đối chứng đỏ thứ hai: bản sao đảo luật không mở lại thẻ thì đếm thẻ mở 0, ca nêu 'mo-lai-the'; ops gọi duyệt hay đảo → 403 và không đếm nào đổi; đối chứng đỏ: bản sao đảo luật bằng DELETE bí danh thì rào chỉ-thêm ném lỗi, ca nêu 'chi-them'"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
