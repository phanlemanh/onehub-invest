schema_version: 1
feature_slug: bang-noi-ma-du-an
# Ca «ND-AC-n». Bốn executor mới (khai ở _acceptance/config.yaml executors.test):
# - noi_da_db (pipeline, DB thử chép từ DB máy thu của riêng lượt): scripts/bang-noi-du-an.itest.mjs — migration, view, bí danh, bộ chuyển S08 thật, bộ đề xuất trên DB.
# - noi_da_ham (pipeline, không DB): lib/ban-ghi-nguon.test.mjs, lib/de-xuat-noi-du-an.test.mjs — khuôn chung, rỗng giả, ma trận căn cứ.
# - noi_da_route (app, DB thử của riêng lượt): tests/noi-du-an.test.tsx — route duyệt cặp, thẻ luật, cấp lô/toà.
# - noi_da_ui (app, jsdom, không DB): tests/noi-du-an-ui.test.tsx — hạng mục «Nối dự án» dựng thật.
evals:
  - id: E1
    criterion: AC-1
    executor: test
    cmd: config:executors.test.noi_da_db
    paths: [db/migrations/100_*.sql, pipeline/noi-du-an-s08.mjs, pipeline/scripts/bang-noi-du-an.itest.mjs]
    expected: "exit 0; ca 'ND-AC-1': trước migration chụp 150 dòng s08_project_links (8 noi) từ DB thử; áp migration hai lần; SELECT * FROM s08_project_links ORDER BY project_id deepEqual bản chụp (150 dòng, count status='noi' = 8); project_links WHERE source='S08' có 150 dòng cùng trạng thái, nút, lý do; lần áp thứ hai số dòng hai bảng không đổi; INSERT một dòng chua_noi, UPDATE sang noi, DELETE qua tên s08_project_links đều phản ánh ở project_links; chạy pipeline/noi-du-an-s08.mjs với tệp nối fixture dựng lại từ 8 dòng noi đã chụp → project_links nguồn S08 vẫn đúng 8 noi cùng nút, không dòng nào đổi; đối chứng đỏ: bản sao migration bỏ trigger INSTEAD OF INSERT thì INSERT qua tên cũ ném lỗi, ca nêu 'instead-of'"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E2
    criterion: AC-2
    executor: test
    cmd: config:executors.test.noi_da_db
    paths: [db/migrations/100_*.sql, pipeline/scripts/bang-noi-du-an.itest.mjs]
    expected: "exit 0; ca 'ND-AC-2' ma trận viết trước 12 ô (assert đúng 12 phần tử): object_key node:12 nhận, bld_<ULID hợp lệ> nhận, node:abc từ chối, xyz_1 từ chối; source S08 nhận, S15 nhận, S16 từ chối, S00 từ chối; kind ma_nha_nuoc nhận, ma_nguon nhận, la từ chối; registry_events object_key node:12 nhận; mỗi ô từ chối ghim tên ràng buộc CHECK trong lỗi; đối chứng đỏ: bản sao migration giữ regex source cũ thì ô S15 bị từ chối, ca nêu 'S10-S15'"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
