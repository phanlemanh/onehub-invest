schema_version: 1
feature_slug: ui-clean-b1-ops
# Mọi eval script gọi một harness: scripts/ui-standards/b1-ops.mjs <lệnh>. Mỗi lệnh có cặp
# hai chiều trong `b1-ops.mjs selftest` (E11): bản sao sạch → xanh; bản sao bị phá đúng mẫu → đỏ
# với thông điệp ghim tên kiểm. Phạm vi file khai một chỗ trong harness (SCOPE).
evals:
  - id: E1
    criterion: AC-1
    executor: script
    cmd: config:executors.script.ui_b1_suppressions
    expected: "exit 0; app/eslint-suppressions.json: 0 khoá khớp phạm vi (src/app/ops/** trừ deals, src/components/ops/**); 0 dòng eslint-disable cho onehub-ui/* trong phạm vi. Chiều đỏ (selftest): thêm một khoá src/components/ops/x.tsx vào bản sao → exit 1, thông điệp 'suppressions: còn mục baseline trong phạm vi B1'"
    paths: ["app/eslint-suppressions.json", "app/src/app/ops/**", "app/src/components/ops/**"]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E2
    criterion: AC-1
    executor: test
    cmd: config:executors.test.app
    expected: "exit 0; npx tsc --noEmit + npm run lint (eslint không suppression thừa + check-bare-disables) xanh"
    evidence_required: [run_id, exit_code, verifier, verified_at]

  - id: E3
    criterion: AC-2
    executor: script
    cmd: config:executors.script.ui_b1_handdrawn
    expected: "exit 0; trong phạm vi: 0 chuỗi class của div/span/li/section/p có cả rounded-* và border; 0 ký tự ✓ ✗ ❌ ✅ ⏸ ↻ × ✕ trong JSX text/chuỗi hiển thị. Chiều đỏ (selftest): mỗi mẫu cấy vào bản sao → exit 1, thông điệp ghim 'handdrawn: <mẫu> @ <file>:<dòng>'"
    paths: ["app/src/app/ops/**", "app/src/components/ops/**"]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E4
    criterion: AC-4
    executor: script
    cmd: config:executors.script.ui_b1_frame
    expected: "exit 0; đọc AST (typescript) default export của 6 page.tsx: con JSX đầu tiên của gốc trả về là <PageHeader>, không có <h1>, import PageHeader từ @/components/page/page-header; collections/page.tsx không có <section> là con cháu của khối chứa PageHeader. Chiều đỏ (selftest): bản sao có <h1> hoặc PageHeader không đứng đầu → exit 1, thông điệp 'frame: <route> …'"
    paths: ["app/src/app/ops/**"]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E5
    criterion: AC-5
    executor: script
    cmd: config:executors.script.ui_b1_one_way
    expected: "exit 0; (1) ma trận viết tay scripts/ui-standards/b1-block-map.json (bảng 2b của design: trang → block → tệp chuyển thể → vùng bỏ) — mỗi trang import ít nhất một tệp chuyển thể của block đã chọn, mỗi tệp chuyển thể có dòng 'chuyển thể từ @reui/<block>' đúng tên, và không chứa định danh mẫu đã bỏ (vd RAW_SLOS/generateSeries burn-down, cột 20 lần chạy, cron editor); /ops/quality không import block Solutions nào; (2) phạm vi không có JSX <table>, không import @/components/ui/table, không gọi useTable ngoài tệp chuyển thể block và InsightGrid. Chiều đỏ (selftest): bản sao gỡ import tệp block của /ops, hoặc thêm <table>, hoặc giữ RAW_SLOS → exit 1, thông điệp 'one-way: …'"
    paths: ["app/src/app/ops/**", "app/src/components/ops/**", "scripts/ui-standards/b1-block-map.json"]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E6
    criterion: AC-6
    executor: script
    cmd: config:executors.script.ui_b1_dialogs
    expected: "exit 0; (a) source-groups-admin.tsx và zalo-accounts.tsx import AlertDialog từ @/components/ui/alert-dialog và không gọi confirm(; (b) QUAN HỆ, đọc AST: trong components/ops/*, không biến state kiểu chuỗi (useState<string…>/useState(\"\")/useState(null) được set bằng chuỗi) nào được render làm con chữ JSX ({x} trực tiếp hoặc trong template) — trừ danh sách cho phép ghi tại harness kèm lý do (groupsError: lỗi inline có Thử lại; state làm value của Input không tính); (c) mỗi hàm chứa fetch với method POST/DELETE gọi toast.* ở cả nhánh thành công lẫn nhánh lỗi. Chiều đỏ (selftest): bản sao gỡ import AlertDialog → exit 1 'dialogs: thiếu AlertDialog'; bản sao thêm const [notice,setNotice]=useState<string|null>(null) + <p>{notice}</p> → exit 1 'dialogs: thông báo ngoài toast @ <file>:<dòng>'"
    paths: ["app/src/components/ops/**"]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E7
    criterion: AC-7
    executor: script
    cmd: config:executors.script.ui_b1_api_contract
    expected: "exit 0; trích (AST) mọi lời gọi fetch trong components/ops/* → (khuôn URL, method, tập khoá body — gom theo endpoint, không theo tệp, vì code có thể dời sang tệp chuyển thể block; fetch nằm trong hàm phụ thì khoá body gom từ các nơi gọi hàm phụ) và kiểm HAI quan hệ: (1) snapshot ⊇ ma trận viết tay scripts/ui-standards/b1-api-expected.json (mã hoá bảng mục 4 của design, viết TRƯỚC code — bắt bộ trích sót kiểu gọi); (2) tập trích từ code sau sửa = scripts/ui-standards/b1-api-snapshot.json (snapshot do chính bộ trích sinh từ code trước sửa, commit riêng trước commit đổi UI). Chiều đỏ (selftest): bản sao đổi method hoặc bỏ một khoá body → exit 1 'api: <file> thiếu/thừa …'; bản sao chuyển một lời gọi vào hàm phụ call(method, body) → vẫn trích ra đúng phần tử (không lọt im lặng)"
    paths: ["app/src/components/ops/**", "scripts/ui-standards/b1-api-snapshot.json", "scripts/ui-standards/b1-api-expected.json"]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E8
    criterion: AC-8
    executor: test
    cmd: config:executors.test.ui_lint_rules
    expected: "exit 0; RuleTester: valid có <input type=\"hidden\" /> và confirm khai báo cục bộ (const/function/tham số); invalid có <input type=\"text\" /> (no-raw-controls) và window.confirm(...) + confirm(...) toàn cục (no-native-dialogs, messageId nativeDialog)"
    paths: ["app/eslint-plugin-onehub-ui/**"]
    evidence_required: [run_id, exit_code, verifier, verified_at]

  - id: E9
    criterion: AC-9
    executor: script
    cmd: config:executors.script.ui_b1_design_page
    expected: "exit 0; ops/design/page.tsx: không import @/components/examples/*; import PageHeader, StatTiles, InsightGrid, PageError, Empty, Skeleton, Badge; có bảng block Solutions đọc từ scripts/ui-standards/b1-block-map.json hoặc liệt đủ mọi block trong đó; chuỗi hiển thị không chứa 'skill', 'reui', '.claude', 'Gallery' (không phân biệt hoa thường). Chiều đỏ (selftest): bản sao thêm import examples/ hoặc chữ 'skill reui' → exit 1, thông điệp 'design-page: …'"
    paths: ["app/src/app/ops/design/**"]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E10
    criterion: AC-11
    executor: script
    cmd: config:executors.script.ui_b1_docs
    expected: "exit 0; chạy eslint -f json qua report.mjs: tổng sau B1 trong docs/research/ui-baseline-2026-10.md (mục 'Sau B1') bằng tổng máy đếm; số mục baseline còn lại trong PHẠM VI FILE của B1 (đếm từ eslint-suppressions.json, ops/deals thuộc B5 nên không tính) = 0 và bằng con số dòng 'Phạm vi B1 … N mục' của tài liệu; catalog.md có dòng app-shell-36 (shell Ops), mỗi block trong b1-block-map.json, c-alert-dialog-5, switch và câu ngoại lệ G4 'KPI và lưới theo block'; routes.md 6 dòng /ops* không còn '(chưa có, B1)' và archetype khớp bảng mục 3 của design. Chiều đỏ (selftest): bản sao tài liệu lệch tổng 1 → exit 1, thông điệp 'docs: tổng …'"
    paths: ["docs/research/ui-baseline-2026-10.md", ".claude/skills/onehub-ui/catalog.md", ".claude/skills/onehub-ui/routes.md", "app/src/**"]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E11
    criterion: AC-2
    executor: script
    cmd: config:executors.script.ui_b1_selftest
    expected: "exit 0; với mỗi lệnh E1, E3–E7, E9, E10, E15, E16: bản sao sạch của cây → exit 0 (đối chứng dương) và bản sao bị phá đúng mẫu → exit 1 kèm thông điệp ghim tên kiểm; in bảng N/N cặp đạt; cây làm việc không đổi"
    paths: ["scripts/ui-standards/**"]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E12
    criterion: AC-6
    executor: ui-check
    layer: ui-observed
    cmd: config:dev_server.start
    expected: "Trên /ops/sources (đã đăng nhập Ops), chạy scripts/ui-standards/mask-tier-a.js trong trang TRƯỚC mỗi lần chụp (vô điều kiện; ghi masked: true + số phần tử đã che): bấm nút xoá ở một dòng nhóm thu → AlertDialog hiện, có tiêu đề 'Xoá nhóm' và câu hậu quả (có số bài nếu nhóm có bài) — frame step1; bấm 'Huỷ' → hộp đóng, dòng nhóm vẫn còn, read_network_requests không có POST /api/v1/ops/source-groups trong khoảng thao tác — frame step2. Lặp cho nút 'Gỡ' tài khoản Zalo nếu có tài khoản khác 'default' (không có → ghi n-a). KHÔNG bấm nút Xoá/Gỡ."
    evidence_required: [run_id, exit_code, verifier, verified_at, screenshot]

  - id: E13
    criterion: AC-10
    executor: ui-check
    layer: ui-observed
    cmd: config:dev_server.start
    expected: "6 trang /ops, /ops/collections, /ops/quality, /ops/review, /ops/sources, /ops/design × 3 chế độ (sáng 1440, tối 1440, sáng 390): frame evidence/E13-<trang>-<chế độ>.png; mỗi trang nằm trong shell Ops có sidebar nhóm (frame thấy đủ 7 mục nav ở 1440); document.querySelectorAll('h1').length === 1 và h1 nằm trong khối đầu vùng nội dung; ở 390px sidebar thu thành nút menu và document.documentElement.scrollWidth <= window.innerWidth; mở thêm một trang Invest (/vn) ở 1440 sáng → vẫn là top nav cũ (frame evidence/E13-invest.png); nhìn frame: không chữ/khối đè nhau, không chữ mất tương phản ở tối; network_observed không có app-fail. Chạy scripts/ui-standards/mask-tier-a.js trong trang TRƯỚC mỗi lần chụp (vô điều kiện); script tự kiểm document.body.innerText không còn tên nào trong danh sách tên thật lấy từ DB local (source_registry.real_name + tên nhóm Zalo) và trả số phần tử đã che — ghi masked: true + số đó cho từng frame; script báo còn tên thật → eval FAIL, không chụp."
    evidence_required: [run_id, exit_code, verifier, verified_at, screenshot]

  - id: E14
    criterion: AC-9
    executor: ui-check
    layer: ui-observed
    cmd: config:dev_server.start
    expected: "/ops/design ở sáng và tối: PageHeader 'Thư viện thiết kế' đầu trang; có mục mẫu sống cho ô KPI, bảng, page header, đang tải, lỗi, trống và hàng Badge trạng thái, mỗi mục có tên component; không thấy chữ 'skill', 'reui', '.claude'. Frame evidence/E14-step1.png (sáng), step2 (tối). Chạy mask-tier-a.js trước khi chụp như E13."
    evidence_required: [run_id, exit_code, verifier, verified_at, screenshot]

  - id: E15
    criterion: AC-12
    executor: script
    cmd: config:executors.script.ui_b1_states
    expected: "exit 0; đọc AST: (1) tệp hàng chờ duyệt (chuyển thể agents-5): nút Duyệt/Từ chối/Hoãn có disabled gắn với cờ đang gửi; (2) bật/tắt nhóm thu và nhóm Zalo: nhánh !ok và catch khôi phục giá trị cũ VÀ gọi toast.error; (4) zalo-accounts: có Skeleton trong nhánh đang tải nhóm và Alert variant destructive chứa Button có onClick gọi hàm tải nhóm; (5) tạo nhóm thu: hàm gửi trả về sớm (kèm toast.error) khi groupKey hoặc name rỗng sau trim; (6) mọi <Switch> và mọi <Button> chỉ có con là icon (không chữ) có aria-label; (7) các ô tên thật (registry real_name), tên nhóm Zalo, tên/khoá nhóm thu, nội dung/địa chỉ tin nằm trong phần tử mang data-tier-a. Mỗi mục in OK/FAIL kèm file:dòng. Chiều đỏ (selftest): bản sao gỡ disabled, gỡ dòng hoàn giá trị, gỡ aria-label, gỡ data-tier-a → mỗi cái exit 1 với thông điệp 'states: <mục>'"
    paths: ["app/src/app/ops/**", "app/src/components/ops/**"]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E16
    criterion: AC-3
    executor: script
    cmd: config:executors.script.ui_b1_shell
    expected: "exit 0; (1) app/src/app/ops/layout.tsx bọc children bằng shell Ops (import từ @/components/shell/ops-shell) và hai dòng chặn quyền 'if (!user) redirect(\"/login?next=/ops\")' + 'if (!canAccessOps(user)) notFound()' có nguyên văn như ở commit gốc vòng b273de1; (2) app/src/app/(app)/layout.tsx vẫn dùng PortalShell, không import ops-shell; (3) nav.tsx mục ops có đúng 7 href /ops, /ops/collections, /ops/quality, /ops/review, /ops/deals, /ops/sources, /ops/design; (4) tệp ops-shell có dòng 'chuyển thể từ @reui/app-shell-36'. Chiều đỏ (selftest): bản sao bỏ /ops/review khỏi nav, hoặc đổi dòng canAccessOps, hoặc cho (app)/layout import ops-shell → exit 1, thông điệp 'shell: …'"
    paths: ["app/src/app/ops/layout.tsx", "app/src/app/(app)/layout.tsx", "app/src/components/shell/**"]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
