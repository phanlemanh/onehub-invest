schema_version: 1
feature_slug: ghi-nhan-chan-dong-trung-cum
# Lược đồ tạm gtc_<pid>, chữ bài giả, tên miền example.test. Mỗi ca có bản đột biến của labels-queries.ts đỏ trên cùng fixture.
evals:
  - id: E1
    criterion: AC-1
    executor: test
    cmd: config:executors.test.gtc_app
    layer: backend-effect
    paths: [app/src/lib/labels-queries.ts, app/src/lib/labels-normalize.ts, app/tests/labels-trung-cum.test.tsx]
    expected: "exit 0; ca 'GTC-AC-1': cột ghep sinh bằng ghepLat thật (pipeline/label-ghep.mjs) trên bài giả; ma trận viết trước: dòng trùng cụm chưa gắn → route thật trả 409 với câu TRUNG_CUM, eval_labels và eval_label_reasons giữ nguyên số dòng; tập item_id nhận TRUNG_CUM bằng đúng tập dòng tinKe, nhomCuaLat, tienDo loại khỏi hàng (so tập, buộc khác rỗng). Chiều đỏ: bản bỏ điều kiện trung_voi trả 200 và thêm dòng, ca đỏ với thông điệp 'GHI VAO DONG TRUNG CUM'."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E2
    criterion: AC-2
    executor: test
    cmd: config:executors.test.gtc_app
