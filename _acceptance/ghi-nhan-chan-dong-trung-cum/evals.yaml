    expected: "exit 0; ca 'GTC-AC-2': ghep sinh bằng ghepLat thật; ba loại dòng (ghep NULL, đại diện cụm, bài ảnh không tin chữ) × ba trạng thái (chưa ai gắn → 200 đủ dòng; người khác đủ → 409 câu cũ; chính mình → 409 DA_GAN_CUA_TOI), bảng kỳ vọng viết trước. Chiều đỏ: bản coi mọi ghep khác NULL là trùng cụm thì đại diện cụm trả 409, ca đỏ với 'CHAN NHAM DONG KHONG TRUNG'."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
