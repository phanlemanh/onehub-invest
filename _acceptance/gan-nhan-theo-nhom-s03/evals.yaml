schema_version: 1
feature_slug: gan-nhan-theo-nhom-s03
# DB: mọi phép đo chạy trên DB thử `oneinvest_gcn_nhan`, không chạy migration chưa gộp trên oneinvest :5433.
evals:
  - id: E1
    criterion: AC-1
    executor: script
    cmd: config:executors.script.gcn_migration
    layer: backend-effect
    paths: [db/migrations/072_*.sql, pipeline/sync-cloud.mjs, pipeline/push-ops-facts.mjs, _acceptance/gan-nhan-theo-nhom-s03/probes/migration.mjs]
    expected: "exit 0; DB thử có sẵn nhãn và mẫu đời trước, áp migration hai lần: 'ok truong moi 8', 'ok cot basis', 'ok stratum', 'ok bang ly do', 'ok bang truong hop', 'ok view 17 truong', 'ok dong thuan 8 truong moi 16 assert' (mỗi trường mới một cặp khớp và một cặp lệch, so kết quả view), 'ok bam dong cu khong doi', 'ok khong tren duong day'. Chiều đỏ cùng fixture: bản sao sync-cloud thêm eval_label_cases vào FILL thì thoát 1 với 'loi bang nhan tren duong day'; xoá một trường khỏi view thì thoát 1 với 'loi view thieu truong'"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E2
    criterion: AC-2
    executor: script
    cmd: config:executors.script.gcn_mau
    layer: backend-effect
    paths: [pipeline/label-sample.mjs, pipeline/lib/eval-labels.mjs, pipeline/lib/test-posts.mjs, _acceptance/gan-nhan-theo-nhom-s03/probes/mau.mjs]
    expected: "exit 0; lệnh thật bằng tiến trình con trên fixture 3 nhóm lớn, 2 nhóm nhỏ: 'ok nhom lon 30', 'ok nhom nho toi 5', 'ok ma nhom moi dong', 'ok trung 20 trong nhom', 'ok 0 post thu', 'ok noi dung trung thuoc nhom truoc', 'ok nhom sau bu du', 'ok in so bo vi trung', 'ok chay lai them 0', 'ok --thu khong ghi'. Chiều đỏ cùng fixture: đổi seed trên lát có sẵn thoát khác 0 với thông điệp 'không trộn hai mẫu'"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E3
    criterion: AC-2
    executor: test
    cmd: config:executors.test.gcn_pipeline
    layer: backend-effect
    paths: [pipeline/lib/eval-labels.mjs, pipeline/lib/eval-labels.test.mjs]
    expected: "exit 0; ca thuần 'chon theo nhom' xanh trên ma trận viết trước, fixture có nội dung trùng giữa hai nhóm; cùng đầu vào và seed cho cùng kết quả; đổi nhóm xếp sau không đổi mẫu của nhóm xếp trước"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E4
    criterion: AC-3
    executor: ui-check
    layer: ui-observed
    cmd: config:executors.design.ui_check
    target: "http://localhost:3460/ops/labels"
    paths: [app/src/app/ops/labels/**, app/src/components/ops/labels/**, app/src/lib/labels-queries.ts, app/src/lib/labels-normalize.ts]
    steps:
      - "Bản chạy: dev server của worktree ở cổng 3460 của dãy mượn, DATABASE_URL của DB thử oneinvest_gcn_nhan, seed bằng probes/seed.mjs. Đăng nhập tài khoản thử vai ops."
      - "Mở /ops/labels không tham số ở 1440x900, chụp evidence/E4-step1.png: bộ chọn nhóm, bài gốc, năm khối hai cột, ô căn cứ, ô Lý do, nút Lưu; ghi số hàng biểu mẫu nằm trọn trong màn và nút Lưu có nằm trong màn không"
      - "Mở bài có chữ dài trên ba dòng, chụp evidence/E4-step1b.png: bài gấp, bấm Xem hết bài thấy nguyên văn, cuộn biểu mẫu thì bài vẫn thấy"
      - "Chọn nhóm thứ hai, chụp evidence/E4-step2.png: chỉ bài của nhóm đó, tiến độ theo nhóm"
      - "Cùng màn khổ 390x844 tối, chụp evidence/E4-step3.png, ghi bề rộng trang"
      - "Điền đủ biểu mẫu, đặt Dự án căn cứ Ngữ cảnh nhóm và để trống Lý do, bấm Lưu, chụp evidence/E4-step4.png: lỗi dưới ô Lý do, chữ đã gõ còn nguyên"
    expected: "Đủ 17 hàng và nút Lưu trong màn 1440x900 không cuộn; trạng thái đã chọn nhìn rõ ở cả sáng lẫn tối; đủ trường, nhãn tiếng Việt theo CONTEXT.md, dòng hướng dẫn nói ghi điều người trong nhóm hiểu, không còn «Ghi theo đúng chữ của tin»; không tràn ngang ở khổ hẹp; lỗi đúng ô"
    evidence_required: [run_id, screenshot, observed, verifier, verified_at]
  - id: E5
    criterion: AC-3
    executor: test
    cmd: config:executors.test.gcn_app
    layer: backend-effect
    paths: [app/src/app/api/v1/ops/labels/**, app/src/lib/labels-queries.ts, app/src/lib/labels-normalize.ts, app/tests/labels-nhom.test.tsx]
    expected: "exit 0; ca 'luu 17 truong va ly do' xanh: handler thật, lược đồ tạm, một lượt ghi đúng 17 dòng và một dòng lý do; ca 'loi giua giao dich' làm cả lượt không ghi dòng nào; ca 'tin ke cung nhom' chỉ trả bài đúng nhóm"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
