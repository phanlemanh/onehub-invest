    paths: [app/src/app/ops/labels/**, app/src/components/ops/labels/**, app/src/lib/labels-queries.ts, app/src/lib/labels-luot-hai.ts, app/src/app/api/v1/ops/labels/**, _acceptance/gan-nhan-theo-nhom-s03/probes/mu.mjs]
