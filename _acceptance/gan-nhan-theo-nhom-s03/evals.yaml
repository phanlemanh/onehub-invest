    expected: "exit 0; ma trận viết trước (số ca assert bằng số phần tử) các ca: toàn chữ bài không lý do → 200; ngữ cảnh nhóm, kiến thức nghề mà lý do trống → 400 đúng ô, 0 dòng ghi, thông điệp 'Có trường không từ chữ bài — ghi lý do'; không suy ra được → basis rỗng; căn cứ lạ, SĐT sai khuôn, WC chữ → 400 đúng ô; '0912 345 678' → '+84912345678'; đối chứng dương: Phân khu Rainbow căn cứ ngữ cảnh nhóm kèm lý do → 200, đọc lại đúng giá trị và basis; dự án, phân khu, toà, trục, diện tích khai chữ bài mà không có trong chữ → 400 với thông điệp 'Chữ bài không có giá trị này', có trong chữ → 200"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
