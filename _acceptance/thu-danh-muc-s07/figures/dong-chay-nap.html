<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dòng chảy nạp raw S07 vào ba bảng stg</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Lora:ital,wght@0,400;1,400&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Lora', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1608px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.3;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Luồng dữ liệu · thu-danh-muc-s07 · Cổng Phạm vi</p>
    <h1>Dòng chảy nạp raw S07 vào ba bảng stg, kèm bốn điểm lọc</h1>

    <svg viewBox="0 0 1608 624" xmlns="http://www.w3.org/2000/svg" role="img"
         aria-label="Raw snapshot S07 đi qua kiểm snapshot, lọc item, bỏ tên miền nguồn rồi vào ba bảng stg; bốn điểm lọc không ghi, trong đó Hỏi-1 chờ quyết">
      <defs>
        <style>
          .name { font-family: 'Geist', system-ui, sans-serif; font-size: 16px; font-weight: 600; fill: #2d3142; }
          .body { font-family: 'Geist', system-ui, sans-serif; font-size: 14px; font-weight: 400; fill: #2d3142; }
          .sub  { font-family: 'Geist', system-ui, sans-serif; font-size: 14px; font-weight: 400; fill: #4f5d75; }
          .mono { font-family: 'Geist Mono', ui-monospace, monospace; font-size: 14px; }
          .tbl  { font-family: 'Geist Mono', ui-monospace, monospace; font-size: 14px; font-weight: 600; fill: #2d3142; }
          .eye  { font-family: 'Geist Mono', ui-monospace, monospace; font-size: 13px; font-weight: 500; letter-spacing: 0.08em; fill: #4f5d75; }
          .ask  { font-family: 'Geist', system-ui, sans-serif; font-size: 16px; font-weight: 600; fill: #ba4513; }
          .dim  { fill: #636b80; }
        </style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Dòng đầu hình (PNG chỉ chụp phần SVG) -->
      <text class="eye" x="40" y="44">DÒNG CHẢY NẠP · RAW S07 → BA BẢNG STG</text>
      <text class="eye" x="1568" y="44" text-anchor="end">AC LIÊN QUAN: AC-2 … AC-8</text>

      <!-- Khung nhóm ba bảng đích (vẽ trước mũi tên để mũi tên nằm trên viền) -->
      <rect x="1056" y="92" width="272" height="356" rx="8" fill="none" stroke="#bfc0c0" stroke-width="1"/>

      <!-- ===== Mũi tên (vẽ trước nút) ===== -->
      <!-- Trục chính -->
      <path d="M 216 272 L 256 272" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M 416 272 L 456 272" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M 656 272 L 696 272" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Ba nhánh theo loại item: bước 4 → ba bảng -->
      <path d="M 896 256 L 912 256 Q 920 256 920 248 L 920 188 Q 920 180 928 180 L 1072 180" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M 896 272 L 1072 272" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M 896 288 L 912 288 Q 920 288 920 296 L 920 344 Q 920 352 928 352 L 1072 352" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Nhánh lọc: không ghi -->
      <path d="M 336 344 L 336 392" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <path d="M 556 344 L 556 392" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <path d="M 796 344 L 796 392" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>

      <!-- Hỏi-1 (điểm nhấn duy nhất) -->
      <path d="M 556 200 L 556 136" fill="none" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

      <!-- Sang bước ngoài phạm vi -->
      <path d="M 1328 272 L 1368 272" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>

      <!-- Nhãn ba nhánh (có nền che, cách đường 8px) -->
      <rect x="932" y="148" width="120" height="24" rx="2" fill="#f5f5f5"/>
      <text class="sub" x="992" y="166" text-anchor="middle">trang danh sách</text>
      <rect x="932" y="240" width="120" height="24" rx="2" fill="#f5f5f5"/>
      <text class="sub" x="992" y="258" text-anchor="middle">trang dự án</text>
      <rect x="932" y="320" width="120" height="24" rx="2" fill="#f5f5f5"/>
      <text class="sub" x="992" y="338" text-anchor="middle">sitemap</text>

      <!-- ===== 1. Raw snapshot S07 ===== -->
      <rect x="40" y="180" width="176" height="184" rx="6" fill="#f5f5f5"/>
      <rect x="40" y="180" width="176" height="184" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text class="name" x="128" y="212" text-anchor="middle">Raw snapshot S07</text>
      <text class="sub" x="128" y="234" text-anchor="middle">bất biến · ở máy thu</text>
      <rect x="56" y="252" width="144" height="28" rx="4" fill="#ffffff" stroke="rgba(45,49,66,0.20)" stroke-width="1"/>
      <text class="body" x="128" y="271" text-anchor="middle">trang danh sách</text>
      <rect x="56" y="288" width="144" height="28" rx="4" fill="#ffffff" stroke="rgba(45,49,66,0.20)" stroke-width="1"/>
      <text class="body" x="128" y="307" text-anchor="middle">trang dự án</text>
      <rect x="56" y="324" width="144" height="28" rx="4" fill="#ffffff" stroke="rgba(45,49,66,0.20)" stroke-width="1"/>
      <text class="body" x="128" y="343" text-anchor="middle">sitemap</text>

      <!-- ===== 2. Kiểm snapshot ===== -->
      <rect x="256" y="200" width="160" height="144" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/>
      <text class="name" x="336" y="230" text-anchor="middle">Kiểm snapshot</text>
      <text class="sub" x="336" y="256" text-anchor="middle">khuôn tên</text>
      <text class="sub" x="336" y="278" text-anchor="middle">nguồn S07</text>
      <text class="sub" x="336" y="300" text-anchor="middle">phiên bản 1–9</text>
      <text class="sub mono" x="336" y="322" text-anchor="middle">sha256</text>

      <!-- ===== 3. Lọc item ===== -->
      <rect x="456" y="200" width="200" height="144" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/>
      <text class="name" x="556" y="230" text-anchor="middle">Lọc item</text>
      <text class="sub" x="556" y="258" text-anchor="middle">theo cờ đăng nhập</text>
      <text class="sub" x="556" y="284" text-anchor="middle">cờ <tspan class="mono">false</tspan> → nhận</text>
      <text class="sub" x="556" y="310" text-anchor="middle">sitemap thiếu cờ → nhận</text>

      <!-- ===== 4. Bỏ tên miền nguồn ===== -->
      <rect x="696" y="200" width="200" height="144" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/>
      <text class="name" x="796" y="230" text-anchor="middle">Bỏ tên miền nguồn</text>
      <text class="sub" x="796" y="256" text-anchor="middle">link trang → tương đối</text>
      <text class="sub" x="796" y="278" text-anchor="middle">link ảnh → <tspan class="mono">s07://…</tspan></text>
      <text class="sub" x="796" y="300" text-anchor="middle">chữ → «S07»</text>
      <text class="sub" x="796" y="322" text-anchor="middle">soát lại trước khi ghi</text>

      <!-- ===== Hỏi-1 ===== -->
      <rect x="396" y="64" width="320" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="396" y="64" width="320" height="72" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4"/>
      <text class="ask" x="556" y="94" text-anchor="middle">Hỏi-1: bỏ (khuyên) hay nhận?</text>
      <text class="body" x="556" y="118" text-anchor="middle">trang danh sách, trang dự án thiếu cờ</text>

      <!-- ===== Ba điểm lọc: không ghi ===== -->
      <rect x="256" y="392" width="160" height="64" rx="20" fill="#f5f5f5"/>
      <rect x="256" y="392" width="160" height="64" rx="20" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.40)" stroke-width="1"/>
      <text class="sub" x="336" y="418" text-anchor="middle">kiểm hỏng</text>
      <text class="name" x="336" y="440" text-anchor="middle">Từ chối, không ghi</text>

      <rect x="456" y="392" width="200" height="64" rx="20" fill="#f5f5f5"/>
      <rect x="456" y="392" width="200" height="64" rx="20" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.40)" stroke-width="1"/>
      <text class="sub" x="556" y="418" text-anchor="middle">cờ đăng nhập <tspan class="mono">true</tspan></text>
      <text class="name" x="556" y="440" text-anchor="middle">Bỏ, có đếm</text>

      <rect x="696" y="392" width="200" height="84" rx="20" fill="#f5f5f5"/>
      <rect x="696" y="392" width="200" height="84" rx="20" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.40)" stroke-width="1"/>
      <text class="sub" x="796" y="418" text-anchor="middle">còn sót tên miền</text>
      <text class="name" x="796" y="440" text-anchor="middle">Dừng, không ghi gì</text>
      <text class="name" x="796" y="460" text-anchor="middle">của snapshot</text>

      <!-- ===== 5. Ba bảng đích ===== -->
      <text class="eye" x="1072" y="120">BA BẢNG ĐÍCH</text>

      <rect x="1072" y="136" width="240" height="88" rx="6" fill="#f5f5f5"/>
      <rect x="1072" y="136" width="240" height="88" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text class="tbl" x="1192" y="164" text-anchor="middle">stg_s07_project_card</text>
      <text class="sub" x="1192" y="188" text-anchor="middle">10 thẻ chính mỗi trang</text>
      <text class="sub" x="1192" y="208" text-anchor="middle">khối «nổi bật» không vào</text>

      <rect x="1072" y="240" width="240" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="1072" y="240" width="240" height="64" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text class="tbl" x="1192" y="268" text-anchor="middle">stg_s07_project</text>
      <text class="sub" x="1192" y="290" text-anchor="middle">một dòng mỗi trang dự án</text>

      <rect x="1072" y="320" width="240" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="1072" y="320" width="240" height="64" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text class="tbl" x="1192" y="348" text-anchor="middle">stg_s07_sitemap_url</text>
      <text class="sub" x="1192" y="370" text-anchor="middle">một dòng mỗi đường dẫn dự án</text>

      <text class="sub" x="1192" y="410" text-anchor="middle">khoá <tspan class="mono">(snapshot_id, pj_id)</tspan></text>
      <text class="sub" x="1192" y="432" text-anchor="middle">nạp lại ghi 0 dòng</text>

      <!-- ===== 6. Ngoài phạm vi vòng (nút mờ) ===== -->
      <rect x="1368" y="200" width="200" height="144" rx="6" fill="#f5f5f5"/>
      <rect x="1368" y="200" width="200" height="144" rx="6" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.30)" stroke-width="1" stroke-dasharray="4,3"/>
      <text class="eye dim" x="1468" y="226" text-anchor="middle">NGOÀI PHẠM VI VÒNG</text>
      <text class="name dim" x="1468" y="252" text-anchor="middle">Bước đọc stg</text>
      <text class="sub mono dim" x="1468" y="276" text-anchor="middle">DA7 · DA3 · DA11</text>
      <text class="sub dim" x="1468" y="300" text-anchor="middle">chọn bản mới nhất,</text>
      <text class="sub dim" x="1468" y="322" text-anchor="middle">nối danh bạ, cha–con</text>

      <!-- ===== Nhãn phụ dưới hình ===== -->
      <line x1="40" y1="508" x2="1568" y2="508" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
      <circle cx="44" cy="532" r="3" fill="#4f5d75"/>
      <text class="body" x="56" y="537">DB chưa áp 093 → in <tspan class="mono">CHUA-AP-093</tspan>, thoát 0, không đánh dấu</text>
      <circle cx="604" cy="532" r="3" fill="#4f5d75"/>
      <text class="body" x="616" y="537">stg chỉ ở máy thu, không lên cloud</text>

      <!-- ===== Chú giải ===== -->
      <line x1="40" y1="564" x2="1568" y2="564" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
      <text class="eye" x="40" y="597">CHÚ GIẢI</text>

      <rect x="152" y="584" width="24" height="16" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/>
      <text class="sub" x="184" y="597">bước nạp</text>

      <rect x="280" y="584" width="24" height="16" rx="4" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text class="sub" x="312" y="597">dữ liệu lưu: raw, stg</text>

      <rect x="496" y="584" width="24" height="16" rx="8" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.40)" stroke-width="1"/>
      <text class="sub" x="528" y="597">điểm lọc: không ghi</text>

      <rect x="696" y="584" width="24" height="16" rx="4" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4"/>
      <text class="sub" x="728" y="597">chờ quyết ở Cổng Phạm vi</text>

      <rect x="936" y="584" width="24" height="16" rx="4" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.30)" stroke-width="1" stroke-dasharray="4,3"/>
      <text class="sub" x="968" y="597">ngoài phạm vi vòng</text>
    </svg>
  </div>
</body>
</html>
