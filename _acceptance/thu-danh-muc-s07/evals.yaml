  - id: E10
    criterion: AC-9
    executor: script
    cmd: config:executors.script.s07_nap_that
    layer: backend-effect
    paths: [pipeline/import-s07-danh-muc.mjs, pipeline/lib/s07-danh-muc.mjs, db/migrations/093_stg_s07.sql, pipeline/scripts/s07-nap-that.mjs, collector/docs/DATA-CONTRACT.md]
    expected: "exit 0 trên máy thu. Gốc snapshot nhận qua --goc, mặc định suy từ thư mục git chung của vị trí lệnh (checkout chính)/collector/snapshots/vn; dòng JSON kết quả in đường thật (realpath) của gốc và số snapshot S07 đã đọc (≥ 12). Lệnh dựng lược đồ tạm trên DB thử, áp tệp 093 thật, chạy bộ nạp thật trên cả gốc HAI lần. Số đếm ĐỘC LẬP trên raw tính bằng đường khác bộ bóc: thẻ chính = số chuỗi mở thẻ trong listHtml; trang dự án = số item kind project_catalog; sitemap = số <loc> kết thúc bằng -pj<số>. Phần bỏ cũng đếm bằng đường khác bộ bóc, theo lý do: item cờ đăng nhập true hoặc (trang danh sách, trang dự án) thiếu cờ; mã dự án lặp trong cùng snapshot; trang dự án mainHtml rỗng; thẻ có href không kết thúc bằng -pj<số>. Xanh khi: với từng bảng, số dòng = số đếm độc lập − tổng phần bỏ; từng con số bỏ bằng con số tương ứng trong dòng tổng kết của bộ nạp; số item kind lạ = 0 và số item lành mà bộ bóc trả rỗng = 0; 0 dòng stg có (snapshot_id, pj_id) thuộc item cờ true; lần nạp hai ghi 0 dòng ở cả ba bảng; số dòng dấu = số snapshot; 0 dòng stg chứa bất kỳ tên miền nào suy từ canonical của raw; 0 link còn lại trong stg có máy chủ chứa nhãn của nguồn (nhãn = nhãn đầu của tên miền suy từ raw, không phân biệt hoa thường); 0 tệp của vòng trong kho (093, bộ nạp, hàm bóc, hai tệp test, lệnh này, mục S07 của DATA-CONTRACT) chứa tên miền hoặc nhãn đó. Lệnh in thêm (không phải điều kiện): số máy chủ khác nhau còn lại trong stg và số dòng stg còn nhãn nguồn trong văn bản tự do. Lệnh không in tên miền hay nhãn. Lệnh xoá lược đồ tạm khi xong."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
