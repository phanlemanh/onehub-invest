<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hỏi-1 ngưỡng payload</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Lora:ital,wght@0,400;1,400&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Lora', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1080px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.25;
      color: var(--color-ink);
      margin-bottom: 0.5rem;
    }
    .sub {
      font-size: 0.875rem;
      color: var(--color-muted);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 880px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Cổng Phạm vi · ops-nhan-ma-nguon · hoi-1-payload</p>
    <h1>Hỏi-1: ngưỡng payload đo trên giá trị hay cả khoá JSON?</h1>
    <p class="sub">AC-4 · payload facts: 0 tên nguồn thật · nguồn chỉ gọi bằng mã S03</p>

    <svg viewBox="0 0 1040 420" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- ============ Mũi tên (vẽ trước, nằm dưới nút) ============ -->
      <!-- Dựng payload → thước quét -->
      <line x1="168" y1="200" x2="198" y2="200" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Nhánh A: chỉ giá trị (máy khuyên) -->
      <path d="M280 144 V108 Q280 100 288 100 H430" fill="none" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <!-- A1 → A2 -->
      <line x1="752" y1="100" x2="814" y2="100" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Nhánh B: cả khoá -->
      <path d="M280 256 V292 Q280 300 288 300 H430" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- B1 → B2 → B3 -->
      <line x1="592" y1="300" x2="622" y2="300" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="824" y1="300" x2="854" y2="300" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- ============ Nhãn mũi tên (có mặt nạ, cách đường 8px) ============ -->
      <rect x="316" y="76" width="88" height="16" rx="2" fill="#f5f5f5"/>
      <text x="360" y="88" fill="#eb6c36" font-size="12" font-style="italic" font-family="'Instrument Serif', 'Lora', serif" text-anchor="middle">máy khuyên</text>

      <rect x="296" y="276" width="128" height="16" rx="2" fill="#f5f5f5"/>
      <text x="360" y="288" fill="#636b80" font-size="12" font-style="italic" font-family="'Instrument Serif', 'Lora', serif" text-anchor="middle">thêm 1 ca giao thời</text>

      <!-- ============ Nút ============ -->
      <!-- Bắt đầu: dựng payload -->
      <rect x="24" y="176" width="144" height="48" rx="24" fill="#f5f5f5"/>
      <rect x="24" y="176" width="144" height="48" rx="24" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="96" y="196" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Dựng payload</text>
      <text x="96" y="212" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">push-ops-facts</text>

      <!-- Rẽ: thước AC-4 quét -->
      <polygon points="280,144 360,200 280,256 200,200" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="280" y="196" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Thước AC-4</text>
      <text x="280" y="212" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">quét gì?</text>

      <!-- A1: chỉ giá trị chuỗi (tiêu điểm) -->
      <rect x="432" y="68" width="320" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="432" y="68" width="320" height="64" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4"/>
      <text x="592" y="92" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Chỉ GIÁ TRỊ chuỗi</text>
      <text x="592" y="108" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">3 khoá JSON giữ nguyên</text>
      <text x="592" y="122" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">…Groups · …Flow · …Accounts</text>

      <!-- A2: kết thúc nhánh A -->
      <rect x="816" y="68" width="200" height="64" rx="32" fill="#f5f5f5"/>
      <rect x="816" y="68" width="200" height="64" rx="32" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="916" y="96" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Vòng ON7 xong</text>
      <text x="916" y="112" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">NT2 quyết khoá</text>

      <!-- B1: cả khoá JSON -->
      <rect x="432" y="268" width="160" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="432" y="268" width="160" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="512" y="304" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Cả KHOÁ JSON</text>

      <!-- B2: đổi khoá + bộ đọc -->
      <rect x="624" y="268" width="200" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="624" y="268" width="200" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="724" y="296" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Đổi khoá + bộ đọc</text>
      <text x="724" y="312" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">nhận cả khoá cũ lẫn mới</text>

      <!-- B3: kết thúc nhánh B -->
      <rect x="856" y="268" width="160" height="64" rx="32" fill="#f5f5f5"/>
      <rect x="856" y="268" width="160" height="64" rx="32" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="936" y="296" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Deploy cùng lúc</text>
      <text x="936" y="312" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">app Vercel + máy thu</text>

      <!-- ============ Chú giải ============ -->
      <line x1="24" y1="364" x2="1016" y2="364" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <text x="24" y="380" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.18em">CHÚ GIẢI</text>

      <rect x="24" y="392" width="24" height="12" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="56" y="402" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Bắt đầu / kết thúc</text>

      <rect x="196" y="392" width="24" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="228" y="402" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Bước</text>

      <polygon points="300,398 312,392 324,398 312,404" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="336" y="402" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Câu hỏi rẽ nhánh</text>

      <line x1="456" y1="400" x2="484" y2="400" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <text x="492" y="402" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Nhánh máy khuyên</text>
    </svg>
  </div>
</body>
</html>
