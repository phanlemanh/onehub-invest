  - id: E8
    criterion: AC-8
    executor: judgment
    inputs: ["CONTEXT.md", "app/src/lib/source-labels.ts"]
    question: "Trong CONTEXT.md có thuật ngữ «Nhãn nguồn» đủ năm phần (nhãn · code · slug · định nghĩa · _Avoid_) không; định nghĩa có khớp đúng khuôn mà hàm sourceLabel trong app/src/lib/source-labels.ts sinh ra («S0x · vai trò», vắng vai trò thì mã trần) không; và có nói tên nguồn thật chỉ hiện ở /ops/sources không? Thiếu một phần hoặc định nghĩa nói khác hàm thì FAIL."
    expected: "đủ năm phần, khớp hàm, nói rõ chỗ duy nhất hiện tên thật"
    paths: ["CONTEXT.md", "app/src/lib/source-labels.ts"]
    evidence_required: [run_id, verdict, judges, verified_at]
