    cmd: config:executors.test.pipeline
    expected: "exit 0; ca 'ON7-AC-7 bộ che: bảng ca dùng chung — bản pipeline và bản app đúng kết quả viết trước từng ca và giống hệt nhau' ok; ca 'ON7-AC-7 tên ba ký tự giữa một từ khác không bị thay' ok; ca 'ON7-AC-7 danh sách tên rỗng → cả hai bản trả null' ok"
    paths: [pipeline/lib/mask-source-names.mjs, app/src/lib/mask-source-names.ts, pipeline/scripts/mask-source-names.cases.json, pipeline/scripts/ops-nhan-ma-nguon.test.mjs]
