    paths: [app/src/app/api/v1/ops/source-groups/route.ts, db/migrations/047_vong_doi_nguon.sql, app/tests/cong-tac-nhom-go.test.tsx]
    expected: "exit 0; ca 'CT-AC-4': với mỗi ô của 10 ô, lược đồ A ghi bằng UPDATE source_groups SET enabled = <giá trị> (đường cũ), lược đồ B gọi route; status cuối của A bằng của B; ô A ném lỗi check_violation đúng ở các ô B trả 409 bật (retired, completed); ô A 'không đổi' ứng với B unchanged hoặc 409 tắt; riêng ô retired+tắt và completed+tắt: A không ném lỗi, status giữ nguyên, B trả 409"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
