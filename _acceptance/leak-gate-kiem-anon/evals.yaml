schema_version: 1
feature_slug: leak-gate-kiem-anon
evals:
  - id: E1
    criterion: AC-1
    executor: script
    cmd: config:executors.script.cloud_sync_anon
    expected: "exit 0; đối chứng dương: PASS cloud đã khoá 037 + ba quan hệ PostGIS cho anon SELECT → lượt sync xanh, gate 0 vi phạm; PASS tiền điều kiện: anon thật sự SELECT được spatial_ref_sys trong cloud mô phỏng (không phải xanh vì thiếu quyền)"
    paths: ["pipeline/sync-cloud.mjs", "pipeline/scripts/check-cloud-sync.mjs"]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E2
    criterion: AC-2
    executor: script
    cmd: config:executors.script.cloud_sync_anon
    expected: "exit 0; tiền điều kiện: PASS md5 local khác cloud trước lượt (ít nhất một bảng); phải-bắn: PASS ĐỎ-ĐÚNG bảng users: dừng pha gate, thông điệp chứa «(trước khi gửi)» và «anon đọc được public.users», md5 từng bảng sync không đổi, staging của lượt 0 dòng; đối chứng đỏ: PASS bản đột biến bỏ chỗ kiểm trước khi gửi làm ô FAIL ở vế md5 (thước phân biệt được); thiếu một vế → FAIL ghim tên vế"
    paths: ["pipeline/sync-cloud.mjs", "pipeline/scripts/check-cloud-sync.mjs"]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

