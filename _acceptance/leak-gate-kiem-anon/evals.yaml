  - id: E18
    criterion: AC-10
    executor: judgment
    inputs: ["docs/ops/supabase-lock-anon-rls.md", "pipeline/sync-cloud.mjs"]
    question: "Trong docs/ops/supabase-lock-anon-rls.md, mục «Leak gate kiểm anon» có đủ bốn điều không, đối chiếu với pipeline/sync-cloud.mjs: (1) thứ tự triển khai — áp 037 lên prod, chạy chế độ --kiem-anon trên prod và thấy sạch, rồi mới merge, và hệ quả nếu ngược lại (mọi lượt sync dừng đỏ); (2) cách đọc dòng báo đỏ — role, quan hệ, đường cấp, lệnh gỡ — khớp khuôn thông điệp mà sync-cloud.mjs thật sự sinh; (3) cách gỡ — chạy lệnh gỡ in trong thông điệp, không tắt hay nới gate; (4) ba quan hệ PostGIS được chừa và vì sao, khớp danh sách chừa trong sync-cloud.mjs? Và không câu nào bảo agent tự sửa quyền trên Supabase prod. Thiếu điều nào hoặc tài liệu nói khác code thì FAIL."
    expected: "đủ bốn điều; chuỗi thông điệp và danh sách chừa trong tài liệu khớp code; không giao agent sửa prod"
    paths: ["docs/ops/supabase-lock-anon-rls.md", "pipeline/sync-cloud.mjs"]
    evidence_required: [run_id, verdict, judges, verified_at]

  - id: E19
