    cmd: config:executors.script.cloud_sync_anon
    expected: "exit 0; ma trận loại quan hệ (3 ô, mỗi ô một lượt): PASS ĐỎ-ĐÚNG view v_ruler_p2_area; PASS ĐỎ-ĐÚNG materialized view; PASS ĐỎ-ĐÚNG bảng phân vùng — mỗi ô dừng pha gate, thông điệp gọi đúng tên quan hệ"
    paths: ["pipeline/sync-cloud.mjs", "pipeline/scripts/check-cloud-sync.mjs"]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

