schema_version: 1
feature_slug: airbnb-worklist
evals:
  - id: E1
    criterion: AC-1
    executor: script
    cmd: config:executors.script.zc5_installers
    expected: "exit 0; stdout có 'INSTALLERS PASS'; job cũ bootout + xoá; nightly + smoke cài và bootstrap; install-cron.sh cài smoke + backup; should-NOT-fire: không bootstrap lại / không hồi sinh collector.plist"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E2
    criterion: AC-1
    executor: script
    cmd: config:executors.script.zc5_static
    expected: "exit 0; stdout có 'STATIC PASS'; plutil airbnb-nightly.plist OK; collector.plist đã xoá khỏi repo; vòng lặp install-cron.sh chỉ smoke backup"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E3
    criterion: AC-2
    executor: script
    cmd: config:executors.script.zc5_nightly_flow
    expected: "exit 0; stdout có 'NIGHTLY-FLOW PASS'; thứ tự export → health → thu; gate dừng → 0 batch, không finalize; batch lỗi → exit 1; hết việc/skip → dừng sớm + finalize; should-NOT-fire vượt trần: đúng 24 batch; jitter mặc định < 1200s"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E4
    criterion: AC-3
    executor: script
    cmd: config:executors.script.zc5_static
    expected: "exit 0; dòng 'airdna-rotate: 12 market/đêm mặc định' và 'airdna-daily: xuất worklist sau transform AirDNA' đạt; should-NOT-fire: mặc định không còn 6"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E5
    criterion: AC-4
    executor: script
    cmd: config:executors.script.zc5_export_db
    expected: "exit 0; stdout có 'EXPORT-DB PASS'; tệp tạm có {generatedAt,total,ids}, total = số id; mọi id abnb_<số>, không trùng; hạng market không giảm dọc danh sách; collector parseWorklist ra id số"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E6
    criterion: AC-4
    executor: test
    cmd: config:executors.test.pipeline
    expected: "exit 0; 0 fail; ca prioritize (market → revenue DESC, dedupe, loại vrbo) và healthReport xanh"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E7
    criterion: AC-5
    executor: test
    cmd: config:executors.script.collector_test_clean
    expected: "exit 0; 0 fail, 0 skip; ca parseWorklist (strip abnb_, input rác) và isGone (title lỗi, redirect, trang có nguồn không GONE) xanh"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E8
    criterion: AC-6
    executor: script
    cmd: config:executors.script.zc5_health_gate
    expected: "exit 0; stdout có 'HEALTH-GATE PASS'; 50%, 41%, 40,6% → dừng; should-NOT-fire: đúng 40%, 40,4%, 0/0 → chưa dừng"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E9
    criterion: AC-7
    executor: script
    cmd: config:executors.script.zc5_finalize_cities
    expected: "exit 0; stdout có 'FINALIZE-CITIES PASS'; nạp 4 snapshot chưa có của 4 thị trường; should-NOT-fire: snapshot đã nạp không nạp lại; transform hanoi, hcmc, danang, vn; reassign 1 lượt; sql 300 → 400 → 410 → 450"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E10
    criterion: AC-8
    executor: script
    cmd: config:executors.script.zc5_scheduler
    expected: "exit 0; stdout có 'SCHEDULER PASS'; không env → chạy, jitter ≥ 2000ms; should-NOT-fire: CONDUCT_WINDOW khung không chứa giờ hiện tại → bỏ qua; cap 0 → bỏ qua"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E11
    criterion: AC-8
    executor: script
    cmd: config:executors.script.zc5_adr
    expected: "exit 0; stdout có 'ADR PASS'"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
