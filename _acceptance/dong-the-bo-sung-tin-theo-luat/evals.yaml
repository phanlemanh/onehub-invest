schema_version: 1
slug: dong-the-bo-sung-tin-theo-luat
# Mọi eval chạy trên DB của riêng lượt (db/db-thu.sh oneinvest_suite_* --chay), không chạm DB máy thu.
# Fixture viết tay trong pipeline/scripts/dong-the-bo-sung-tin.test.mjs, phủ đủ các ô của bảng Coverage.
evals:
  - id: E1
    criterion: AC-1
    executor: script
    layer: backend-effect
    cmd: bash _acceptance/dong-the-bo-sung-tin-theo-luat/probes/dong.sh AC-1
    paths: [pipeline/scripts/dong-the-bo-sung-tin*, pipeline/lib/dong-the-bo-sung-tin*]
    expected: "Fixture viết trước 17 thẻ, mỗi thẻ một assert nhóm viết tay (nhóm 1 chỉ đếm, KHÔNG nằm trong tập sẽ đóng): (a) chờ, 0 đề xuất → nhóm 1; (b) chờ, chỉ đề xuất applied → nhóm 1; (c) chờ, chỉ đề xuất skipped/rejected/superseded/reverted → nhóm 1; (d) chờ, một đề xuất loại hình trùng → nhóm 2; (e) chờ, PN trùng «2» với tin 2 → nhóm 2; (f) chờ, loại hình trùng + PN trùng → nhóm 2; (g) chờ, loại hình trùng + loại hình lệch → không nhóm; (h) chờ, loại hình trùng + WC → không nhóm; (i) chờ, toà → không nhóm; (j) chờ, đường → không nhóm; (k) chờ, PN đề xuất 2 mà ô tin trống → không nhóm; (l) chờ, tin đã nghỉ khỏi sale_offers → không nhóm; (m) «Để sau» 0 đề xuất → không nhóm; (n) đã bác → không nhóm; (o) data_quality chờ → không nhóm; (p) chờ, đề xuất queued trỏ thẻ khác cùng tin → nhóm 1; (q) chờ, thẻ đối chiếu (evidence.doi_chieu, 0 đề xuất) → nhóm 1. Tập sẽ đóng đúng bằng {d, e, f}; cấy thẻ đối chiếu q vào tập đóng thì đỏ, thông điệp «thẻ đối chiếu nằm trong lượt đóng». Đột biến trong bản sao (bỏ điều kiện «mọi» thành «có một»; bỏ kiểm ô tin trống) đỏ, thông điệp nêu mã thẻ."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E2
    criterion: AC-2
    executor: script
    layer: backend-effect
    cmd: bash _acceptance/dong-the-bo-sung-tin-theo-luat/probes/dong.sh AC-2
    paths: [pipeline/scripts/dong-the-bo-sung-tin*, pipeline/lib/dong-the-bo-sung-tin*]
    expected: "Trên fixture E1, --thu in đúng số nhóm 1 (không đóng) = 5 thẻ, nhóm 2 = 3 thẻ kèm số đề xuất 4, thẻ chờ còn lại 11, và hai câu SQL đếm độc lập; chạy hai câu SQL in kèm cho cùng số. Không bảng nào của lược đồ public bị ghi (pg_stat_xact_user_tables trước = sau, gồm giao dịch con). Đối chứng dương: một UPDATE review_queue chạy ngoài lệnh làm thước đỏ, thông điệp nêu bảng đổi."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E3
    criterion: AC-3
    executor: script
    layer: backend-effect
    cmd: bash _acceptance/dong-the-bo-sung-tin-theo-luat/probes/dong.sh AC-3
    paths: [pipeline/scripts/dong-the-bo-sung-tin*, pipeline/lib/dong-the-bo-sung-tin*]
    expected: "Chạy thật trên fixture E1: 3 thẻ nhóm 2 đổi rejected, 5 thẻ nhóm 1 (gồm thẻ đối chiếu) giữ pending, decided_by bắt đầu «may:dong-the-theo-luat», decision_note chứa mã nhóm; 4 đề xuất nhóm 2 đổi skipped với evidence.ly_do='trung-gia-tri-tin'; mọi dòng khác của review_queue và enrichment_proposals (so từng dòng theo id) không đổi; chỉ hai bảng review_queue và enrichment_proposals có lượt ghi (pg_stat_xact_user_tables) — sale_offers, sale_offer_records, field_assertions không bị ghi. Ném lỗi giả ở thẻ thứ 2 → cả hai bảng về nguyên trạng (một giao dịch). Đột biến áp đề xuất (apply_enrichment) thay vì skipped đỏ, thông điệp nêu bảng field_assertions đổi."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E4
    criterion: AC-4
    executor: script
    layer: backend-effect
    cmd: bash _acceptance/dong-the-bo-sung-tin-theo-luat/probes/dong.sh AC-4
    paths: [pipeline/scripts/dong-the-bo-sung-tin*, pipeline/lib/dong-the-bo-sung-tin*]
    expected: "Giữa bước phân nhóm và bước ghi: người quyết thẻ nhóm 2 «e» thành approved, và gắn một đề xuất bathrooms queued vào thẻ nhóm 2 «d». Lượt ghi đóng đúng 1 thẻ còn khớp, thẻ đã quyết giữ approved của người, thẻ có đề xuất mới giữ pending; số in ra = 1. Đột biến bỏ tính lại trong giao dịch đỏ, thông điệp nêu thẻ bị đè."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E5
    criterion: AC-5
    executor: script
    layer: backend-effect
    cmd: bash _acceptance/dong-the-bo-sung-tin-theo-luat/probes/dong.sh AC-5
    paths: [pipeline/scripts/dong-the-bo-sung-tin*, pipeline/lib/dong-the-bo-sung-tin*]
    expected: "Sau chạy thật trên fixture E1 có đúng một tệp lùi dưới .acceptance-runs/dong-the-bo-sung-tin-theo-luat/, ghi 3 thẻ và 4 đề xuất với giá trị cũ khớp ảnh chụp DB trước lượt (so từng trường). Lượt ném lỗi giữa chừng không để lại tệp lùi đánh dấu hoàn tất."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E6
    criterion: AC-6
    executor: script
    layer: backend-effect
    cmd: bash _acceptance/dong-the-bo-sung-tin-theo-luat/probes/dong.sh AC-6
    paths: [pipeline/scripts/dong-the-bo-sung-tin*, pipeline/lib/dong-the-bo-sung-tin*]
    expected: "Chạy thật rồi --lui <tệp>: băm review_queue và enrichment_proposals bằng băm trước lượt chạy thật, thoát 0. Ca xung đột: sau chạy thật, người đổi một thẻ đã đóng sang approved; --lui không ghi đè thẻ đó, các dòng khác về cũ, in mã thẻ xung đột, thoát khác 0."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E7
    criterion: AC-7
    executor: script
    layer: backend-effect
    cmd: bash _acceptance/dong-the-bo-sung-tin-theo-luat/probes/dong.sh AC-7
    paths: [pipeline/scripts/dong-the-bo-sung-tin*, pipeline/lib/dong-the-bo-sung-tin*]
    expected: "Chạy thật hai lần liên tiếp trên fixture E1: lần hai in 0 thẻ, 0 đề xuất; băm hai bảng sau lần hai = sau lần một."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E8
    criterion: AC-8
    executor: script
    layer: backend-effect
    cmd: bash _acceptance/dong-the-bo-sung-tin-theo-luat/probes/dong.sh AC-8
    paths: [pipeline/scripts/dong-the-bo-sung-tin*, pipeline/lib/dong-the-bo-sung-tin*, agent/src/enrich/doc-toan-bo.ts]
    expected: "Sau chạy thật, câu lọc đề xuất xử lại nguyên văn của agent/src/enrich/doc-toan-bo.ts (rút từ tệp nguồn, không chép tay) trả 0 dòng thuộc 4 đề xuất của lượt. Đối chứng dương: một đề xuất skipped e2_llm property_type cài sẵn với ly_do='khong-tu-khoa' và prompt_version hiện hành vẫn được câu lọc trả về."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E9
    criterion: AC-9
    executor: script
    layer: backend-effect
    cmd: bash _acceptance/dong-the-bo-sung-tin-theo-luat/probes/dong.sh AC-9
    paths: [app/src/lib/ops/review-dau-trang.ts, scripts/bao-cao-ngay.mjs, pipeline/scripts/dong-the-bo-sung-tin*]
    expected: "THE_NGUOI_QUYET_SQL rút từ app/src/lib/ops/review-dau-trang.ts bằng đúng bản export của scripts/bao-cao-ngay.mjs (so chuỗi). Trên DB của riêng lượt cấy 3 thẻ người quyết hôm nay (usr_*), 4 thẻ may:dong-the-theo-luat, 1 thẻ transform:S03, 1 thẻ data_quality dung-nguoi, 2 thẻ chờ. DAU_TRANG_SQL (rút từ nguồn, thay vị từ) và CONG_NGUOI_SQL: hom_nay = 3, quyet = 3, cho = 2. Đối chứng dương: thêm một thẻ người quyết thì hom_nay = quyet = 4. Gỡ vị từ khỏi câu thì đếm 9 — thông điệp nêu tên máy bị đếm."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
