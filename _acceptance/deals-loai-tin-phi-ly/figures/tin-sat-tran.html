<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tin giảm sát trần</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Lora:ital,wght@0,400;1,400&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Lora', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1000px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.25;
      color: var(--color-ink);
      margin-bottom: 0.5rem;
    }
    .sub {
      font-size: 0.875rem;
      color: var(--color-muted);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 760px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Cổng Phạm vi · deals-loai-tin-phi-ly · Hỏi-2</p>
    <h1>Tin rẻ hơn thước quá 35%: giữ và đẩy cuối, hay loại hẳn</h1>
    <p class="sub">Hai nhánh từ một điểm rẽ · nhánh A máy khuyên · AC-4 · AC-6 · AC-7</p>

    <svg viewBox="0 48 1000 408" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
      </defs>

      <rect x="0" y="48" width="1000" height="408" fill="#f5f5f5"/>

      <!-- ===================== ĐẦU CỘT ===================== -->
      <text x="140" y="72" fill="#4f5d75" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.18em">ĐIỂM RẼ</text>
      <text x="460" y="72" fill="#4f5d75" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.18em">CÁCH XỬ LÝ</text>
      <text x="812" y="72" fill="#4f5d75" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.18em">HỆ QUẢ</text>
      <line x1="32" y1="80" x2="968" y2="80" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>

      <!-- ===================== MŨI TÊN (trước hộp) ===================== -->
      <!-- điểm rẽ → nhánh A (máy khuyên, focal 2) -->
      <path d="M140 168 V148 Q140 140 148 140 H316" fill="none" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <!-- điểm rẽ → nhánh B -->
      <path d="M140 288 V308 Q140 316 148 316 H316" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- cách xử lý → hệ quả -->
      <line x1="600" y1="140" x2="660" y2="140" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="600" y1="316" x2="660" y2="316" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- nhãn mũi tên -->
      <rect x="176" y="116" width="112" height="16" rx="2" fill="#f5f5f5"/>
      <text x="232" y="128" fill="#ba4513" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">A · MÁY KHUYÊN</text>
      <rect x="184" y="292" width="96" height="16" rx="2" fill="#f5f5f5"/>
      <text x="232" y="304" fill="#636b80" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">B · LOẠI HẲN</text>

      <!-- ===================== ĐIỂM RẼ ===================== -->
      <polygon points="40,228 140,168 240,228 140,288" fill="#f5f5f5"/>
      <polygon points="40,228 140,168 240,228 140,288" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="140" y="226" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Tin giảm &gt; 35%</text>
      <text x="140" y="242" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">so với thước</text>

      <!-- ===================== NHÁNH A · CÁCH XỬ LÝ (focal 1) ===================== -->
      <rect x="320" y="96" width="280" height="88" rx="6" fill="#f5f5f5"/>
      <rect x="320" y="96" width="280" height="88" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4"/>
      <rect x="328" y="104" width="64" height="16" rx="2" fill="transparent" stroke="rgba(235,108,54,0.60)" stroke-width="0.8"/>
      <text x="360" y="116" fill="#ba4513" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">NHÁNH A</text>
      <rect x="512" y="104" width="80" height="16" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="552" y="116" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">AC-4 · AC-6</text>
      <text x="460" y="148" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Vẫn hiện, đứng cuối danh sách</text>
      <text x="460" y="166" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">thẻ mang nhãn «cần xác minh»</text>

      <!-- ===================== NHÁNH A · HỆ QUẢ ===================== -->
      <rect x="664" y="96" width="304" height="88" rx="6" fill="#f5f5f5"/>
      <rect x="664" y="96" width="304" height="88" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <rect x="672" y="104" width="40" height="16" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="692" y="116" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">AC-7</text>
      <text x="816" y="148" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Không mất tin nào</text>
      <text x="816" y="166" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">đầu danh sách là tin đáng gọi trước</text>

      <!-- ===================== NHÁNH B · CÁCH XỬ LÝ ===================== -->
      <rect x="320" y="272" width="280" height="88" rx="6" fill="#f5f5f5"/>
      <rect x="320" y="272" width="280" height="88" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="328" y="280" width="64" height="16" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="360" y="292" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">NHÁNH B</text>
      <text x="460" y="320" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Loại khỏi danh sách</text>
      <text x="460" y="338" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">ghi dòng audit <tspan font-family="'Geist Mono', monospace" font-size="9">giam-qua-sau</tspan></text>

      <!-- ===================== NHÁNH B · HỆ QUẢ ===================== -->
      <rect x="664" y="272" width="304" height="88" rx="6" fill="#f5f5f5"/>
      <rect x="664" y="272" width="304" height="88" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="816" y="308" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Danh sách gọn</text>
      <text x="816" y="326" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">căn rẻ thật &gt; 35% biến mất tới khi</text>
      <text x="816" y="342" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">có thước theo loại hình (PL26)</text>

      <!-- ===================== CHÚ GIẢI ===================== -->
      <line x1="32" y1="392" x2="968" y2="392" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <text x="32" y="412" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.18em">CHÚ GIẢI</text>

      <rect x="32" y="424" width="16" height="16" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4"/>
      <text x="56" y="436" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">nhánh máy khuyên</text>

      <rect x="168" y="424" width="16" height="16" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="192" y="436" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">cách xử lý khác</text>

      <rect x="296" y="424" width="16" height="16" rx="2" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="320" y="436" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">hệ quả cho người vận hành</text>

      <rect x="468" y="424" width="40" height="16" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="488" y="436" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">AC-n</text>
      <text x="516" y="436" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">tiêu chí nghiệm thu liên quan</text>
    </svg>
  </div>
</body>
</html>
