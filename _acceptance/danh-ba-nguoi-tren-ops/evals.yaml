    expected: "exit 0; ca DBN-AC-1: VERCEL=1 → HTML hai trang có «Chỉ ở máy thu» và số truy vấn tới bốn bảng = 0 (đếm qua client giả); lược đồ thiếu bảng parties → cùng kết quả; đối chứng dương: máy thu có bảng → HTML không có «Chỉ ở máy thu» và có hàng người; chiều đỏ: bản đột biến bỏ nhánh cloud → ca đỏ với thông điệp ghim «DBN-AC-1 cloud vẫn truy vấn»"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
