<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lần dựng đầu trên máy thu</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Lora:ital,wght@0,400;1,400&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --font-sans:     "Geist", system-ui, sans-serif;
      --font-serif:    "Instrument Serif", "Lora", serif;
      --font-mono:     "Geist Mono", ui-monospace, monospace;
    }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1280px; width: 100%; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; color: var(--color-ink); margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Quy trình · AC-1 · AC-8</p>
    <h1>Lần dựng đầu trên máy thu</h1>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <line x1="512" y1="124" x2="552" y2="124" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <line x1="768" y1="124" x2="808" y2="124" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="1024" y1="124" x2="1064" y2="124" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>

      <text x="660" y="132" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">danh-ba-vat-the.mjs</text>

      <text x="660" y="288" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">thiếu hoặc tệp rỗng</text>
      <text x="784" y="280" fill="#636b80" font-size="9" font-family="'Geist Mono', monospace" text-anchor="start" letter-spacing="0.06em">AC-1</text>
      <line x1="40" y1="336" x2="1192" y2="336" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <text x="40" y="356" fill="#4f5d75" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" text-anchor="start" letter-spacing="0.18em">CHÚ GIẢI</text>
      <rect x="40" y="370" width="24" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="72" y="380" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif" text-anchor="start">Bước tay</text>
      <rect x="168" y="370" width="24" height="12" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4"/>
      <text x="200" y="380" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif" text-anchor="start">Lần đầu ghi DB máy thu</text>
      <rect x="360" y="370" width="24" height="12" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="392" y="380" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif" text-anchor="start">Lệnh dừng</text>
      <line x1="480" y1="376" x2="508" y2="376" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <text x="516" y="380" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif" text-anchor="start">Sau đó, tự chạy mỗi đêm</text>
    </svg>
  </div>
</body>
</html>
