    cmd: config:executors.script.zc19_cach_ly
    paths: [collector/src/test/s08-danh-muc.test.ts, _acceptance/s08-test-cach-ly-token/probes/cach-ly.sh]
    expected: "exit 0; dòng 'PASS (c) phá «bỏ đặt S08_TOKEN_FILE» → ĐỎ, đầu ra nêu s08-token.json' — bản chép trong collector/dist/test (tên .zc19-pha-c-*) đỏ ≥1 ca với đầu ra nêu s08-token.json; mẫu phá lệch mã thì FAIL «không dựng được bản phá». Bản chép bị xoá ở trap EXIT."
