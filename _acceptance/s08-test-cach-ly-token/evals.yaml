    expected: "exit 0; không có dòng 'FAIL (b) chạy bằng quyền đọc được tệp 000'; dòng 'PASS (b) token ở HOME quyền 000 + JSON hỏng → vẫn 4/4, không chạm tệp' (đầu ra không có EACCES, chuỗi KHONG-DUOC-DOC hay lỗi JSON); đối chứng ghim cùng HOME: dòng \"PASS (b') bản phá (c) dưới HOME token 000 + JSON hỏng → ĐỎ\" (gap-probe P2)."
