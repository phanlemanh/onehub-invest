    cmd: bash _acceptance/s03-tran-thoi-gian-luot-nap/probes/tran-unit.sh
    paths: [scripts/zalo-import-daily.sh, scripts/zalo-import-tran.test.mjs]
    expected: "exit 0; ZALO_IMPORT_TRAN_TONG=3, ZALO_IMPORT_CANH_BAO=1, ZALO_IMPORT_NODE_BIN = node đang chạy test, bước transform-zalo treo. Lượt chạy detached (nhóm riêng): đúng một dòng khớp /WARN: lượt đã chạy 1s/, đúng một dòng /TIMEOUT: lượt vượt trần 3s/, dòng WARN đứng trước dòng TIMEOUT, mã 143. Một tiến trình canh (node ngủ) do test spawn detached ở NHÓM KHÁC trước lượt → sau ca `process.kill(pid, 0)` vẫn thành công, rồi test tự dọn nó. Chiều đỏ cùng fixture: bản sao bỏ dòng WARN → ca đỏ ghim «AC-3 thiếu dòng WARN nửa trần»."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E4
