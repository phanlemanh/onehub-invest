evals:
  - id: E1
    criterion: AC-1
    executor: test
    cmd: bash _acceptance/s03-tran-thoi-gian-luot-nap/probes/tran-unit.sh
    paths: [scripts/zalo-import-daily.sh, scripts/zalo-import-tran.test.mjs]
    expected: "exit 0; hai ca trên bản sao script (thư mục tạm, lượt detached nhóm riêng, DB cổng đóng), ZALO_IMPORT_TRAN_NAP=0. (a) vòng tin: một snapshot vn__zalo-agent__<ts> có manifest → stdout có dòng TIMEOUT phần nạp nêu đúng <ts>, mã thoát 124, apify-daily.state bằng 00000000T000000, bước nạp giả không được gọi, không dòng JOB STEP nào của bước transform-*. (b) vòng hồ sơ: không snapshot tin, một snapshot hồ sơ → dòng TIMEOUT phần nạp «tại hồ sơ <ts>», state hồ sơ giữ mốc cũ, dòng JOB FAIL bước nap-ho-so mã 124, chuỗi tin vẫn chạy (có dòng JOB STEP của bước transform-*), mã thoát cuối 124. Chiều đỏ cùng fixture: bản sao bỏ khối trần ở vòng tin → ca (a) đỏ ghim «AC-1 phần nạp không có trần»."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E2
    criterion: AC-2
    executor: test
    cmd: bash _acceptance/s03-tran-thoi-gian-luot-nap/probes/tran-unit.sh
    paths: [scripts/zalo-import-daily.sh, scripts/zalo-import-tran.test.mjs]
    expected: "exit 0; hai snapshot tin T1 < T2 có manifest, bước nạp giả (pipeline/import-airbnb.mjs trong thư mục tạm) nối tên snapshot vào một tệp sổ rồi ngủ theo NAP_NGU. (a) lượt 1 ZALO_IMPORT_TRAN_NAP=5, NAP_NGU=6 → mã 124, sổ = [T1], state = T1; lượt 2 trần mặc định → mã của lượt không phải 124, sổ = [T1, T2], state = T2. Bước nạp giả ghi thêm dòng «XONG <snapshot>» sau khi ngủ. (b) lượt 1 ZALO_IMPORT_TRAN_TONG=1, NAP_NGU=4 → mã 143, sổ KHÔNG có «XONG T1» (fixture ghim T1 đang nạp dở), state < T1; lượt 2 không có dòng «khoá còn sống», lấy khoá trong ≤ 7 giây, sổ kết thúc [T1, T2], có «XONG T1», state = T2. Chiều đỏ cùng fixture: bản sao đánh dấu snapshot bị cắt là đã nạp (MAXTS=$TS trước break) → ca (a) đỏ ghim «AC-2 lượt sau bỏ sót snapshot»; bản sao ghi state = $TS trước khi nạp → ca (b) đỏ ghim «AC-2 state vượt snapshot chưa nạp xong»."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E3
    criterion: AC-3
