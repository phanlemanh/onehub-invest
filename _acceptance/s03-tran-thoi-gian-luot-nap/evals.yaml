    paths: [scripts/zalo-import-daily.sh, scripts/zalo-import-tran.test.mjs]
    expected: "exit 0; ma trận ba kết cục viết trước, mỗi ô fixture thoát ngay, ZALO_IMPORT_NODE_BIN = node đang chạy test, trần tổng mặc định: (a) lượt 00:00 chạy tới enrich-run (doc-gop giả thoát 0, enrich hỏng vì thư mục agent rỗng); (b) lượt --luot-nhanh; (c) lượt 00:00 bước nạp giả thoát 1. Node đồng hồ chạy qua symlink <thư mục thử>/node-dong-ho (ZALO_IMPORT_NODE_BIN). Sau khi script thoát, test quét `ps -axo pid,command` TOÀN MÁY trong 10 giây: số dòng chứa đường symlink ấy về 0 ở cả ba ô — đếm theo dấu, không theo nhóm, nên đồng hồ đã setsid hay rời nhóm vẫn bị đếm. Mỗi ô còn ghim fixture tới đúng kết cục (dòng JOB STEP enrich-run · «lượt nhanh: bỏ đọc gộp» · «nạp fail tại»). Trên @99b2778e9 ô (a) đỏ ghim «AC-4 đồng hồ còn sống sau khi lượt thoát». Dọn: test SIGKILL cả nhóm của lượt sau ca dù xanh hay đỏ."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E5
    criterion: AC-5
    executor: test
    cmd: bash _acceptance/s03-tran-thoi-gian-luot-nap/probes/tran-unit.sh
    paths: [scripts/zalo-import-daily.sh, scripts/zalo-import-tran.test.mjs]
    expected: "exit 0; test spawn detached `bash -c '\"$0\"; echo NGUOI-GOI-SONG rc=$?' <bản sao script>` (script là con của bash ngoài, cùng nhóm, không phải trưởng nhóm), ZALO_IMPORT_TRAN_TONG=2, bước transform-zalo treo, ZALO_IMPORT_NODE_BIN = node đang chạy test. Ô viết trước: đầu ra có dòng TIMEOUT; có dòng /^NGUOI-GOI-SONG rc=[0-9]+$/ (thiếu → đỏ ghim «AC-5 trần TERM trúng người gọi»); bash ngoài thoát bằng mã, không bởi tín hiệu; dòng đúng là `NGUOI-GOI-SONG rc=143` (khác → đỏ ghim «AC-5 script không bị cắt bằng TERM»); trong 10 giây toàn máy không còn tiến trình mang đường fixture bước treo của thư mục thử (còn → đỏ ghim «AC-5 bước treo sống sau trần»). Trên @99b2778e9 đỏ ghim «AC-5 trần TERM trúng người gọi». Dọn: SIGKILL cả nhóm sau ca."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
