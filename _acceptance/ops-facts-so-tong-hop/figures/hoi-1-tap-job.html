<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hỏi-1 tập job</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Lora:ital,wght@0,400;1,400&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Lora', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1000px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.2;
      color: var(--color-ink);
      margin-bottom: 0.5rem;
    }
    .sub { font-size: 0.875rem; color: var(--color-muted); margin-bottom: 1.5rem; max-width: 48rem; line-height: 1.5; }
    svg { width: 100%; min-width: 860px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Hỏi-1 · ops-facts-so-tong-hop · AC-6</p>
    <h1>Máy local báo lên cloud những job nào?</h1>
    <p class="sub">Một câu chỉ người chọn được. Máy khuyên A.</p>

    <svg viewBox="0 0 960 500" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Mũi tên (vẽ trước) -->
      <path d="M340 104 H228 Q220 104 220 112 V216" fill="none" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <path d="M620 104 H732 Q740 104 740 112 V216" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="220" y1="296" x2="220" y2="344" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <line x1="740" y1="296" x2="740" y2="344" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Nhãn mũi tên -->
      <rect x="240" y="80" width="88" height="16" rx="2" fill="#f5f5f5"/>
      <text x="284" y="92" fill="#ba4513" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">A · MÁY KHUYÊN</text>
      <rect x="664" y="80" width="24" height="16" rx="2" fill="#f5f5f5"/>
      <text x="676" y="92" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">B</text>

      <!-- Câu hỏi -->
      <polygon points="480,48 620,104 480,160 340,104" fill="#f5f5f5"/>
      <polygon points="480,48 620,104 480,160 340,104" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="480" y="100" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Khối job gồm</text>
      <text x="480" y="116" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">những job nào?</text>

      <!-- Lựa chọn A (máy khuyên) -->
      <rect x="100" y="216" width="240" height="80" rx="6" fill="#f5f5f5"/>
      <rect x="100" y="216" width="240" height="80" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4"/>
      <text x="220" y="244" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Mọi job chạy nền của kho</text>
      <text x="220" y="262" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">12 job, kể cả job chạy liên tục</text>
      <text x="220" y="278" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">(nhãn khai trong pipeline/cron)</text>

      <!-- Lựa chọn B -->
      <rect x="620" y="216" width="240" height="80" rx="6" fill="#f5f5f5"/>
      <rect x="620" y="216" width="240" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="740" y="244" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Chỉ job chạy theo lịch</text>
      <text x="740" y="262" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">bỏ các job chạy liên tục</text>
      <text x="740" y="278" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">(sát chữ «job đêm» của ADR-0014)</text>

      <!-- Hệ quả A -->
      <rect x="100" y="344" width="240" height="64" rx="24" fill="#f5f5f5"/>
      <rect x="100" y="344" width="240" height="64" rx="24" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="220" y="372" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Trang cloud thấy cả job</text>
      <text x="220" y="388" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">chạy liên tục bị chết</text>

      <!-- Hệ quả B -->
      <rect x="620" y="344" width="240" height="64" rx="24" fill="#f5f5f5"/>
      <rect x="620" y="344" width="240" height="64" rx="24" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="740" y="372" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Trang cloud không thấy</text>
      <text x="740" y="388" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">job chạy liên tục bị chết</text>

      <!-- Chú thích -->
      <text x="480" y="240" fill="#4f5d75" font-size="14" font-style="italic" font-family="'Instrument Serif', 'Lora', serif" text-anchor="middle">Vì sao máy khuyên A: một tập,</text>
      <text x="480" y="258" fill="#4f5d75" font-size="14" font-style="italic" font-family="'Instrument Serif', 'Lora', serif" text-anchor="middle">khớp trang Thu thập hiện nay;</text>
      <text x="480" y="276" fill="#4f5d75" font-size="14" font-style="italic" font-family="'Instrument Serif', 'Lora', serif" text-anchor="middle">các trang Ops sau cần thấy job chết.</text>

      <!-- Chú giải -->
      <line x1="40" y1="440" x2="920" y2="440" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <text x="40" y="456" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.18em">CHÚ GIẢI</text>

      <polygon points="40,476 52,470 64,476 52,482" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="72" y="480" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Câu hỏi</text>

      <rect x="216" y="470" width="24" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="248" y="480" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Lựa chọn</text>

      <rect x="392" y="470" width="24" height="12" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4"/>
      <text x="424" y="480" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Lựa chọn máy khuyên</text>

      <rect x="568" y="470" width="24" height="12" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="600" y="480" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Hệ quả trên trang cloud</text>

      <line x1="744" y1="476" x2="772" y2="476" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <text x="780" y="480" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Đường máy khuyên</text>
    </svg>
  </div>
</body>
</html>
