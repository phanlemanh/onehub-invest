    cmd: config:executors.script.deals_phi_ly_do
    paths: [scripts/deals-phi-ly-do.mjs, pipeline/refresh-bait-gap.mjs, pipeline/lib/deal-plausibility.mjs, app/src/lib/deals.ts]
    expected: "exit 0 trên DB local :5433; stdout có 'ok   đối chứng: bản chưa loại còn', 'ok   luật loại bắt tin đối chứng', 'ok   DB không đổi' (băm offer_id:bait_gap_pct:area_m2 + số dòng audit bait-gap:loai-phi-ly trước/sau bằng nhau) và dòng cuối 'deals-phi-ly-do: ĐẠT'. Chiều đỏ của cùng lệnh trước sửa: thoát 1 với 'FAIL đối chứng: bản chưa loại còn 0 tin phi lý' (đo 19/11, design.md)"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E5
    criterion: AC-5
    executor: test
    cmd: config:executors.test.app_ui
    paths: [scripts/deals-phi-ly-do.mjs, app/tests/deals-phi-ly-do.test.tsx]
    expected: "exit 0; ca 'DPD-AC-5' cùng fixture E1: tập tên kiểm chứa đúng 'không tin thiếu diện tích trong danh sách', 'không tin phòng quá nhỏ trong danh sách', tiền tố 'không tin phi lý nào trong danh sách', tiền tố 'đầu danh sách ≤ 35%' và tiền tố 'đối chứng: bản chưa loại còn'; mọi kiểm ấy ok=true"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E6
    criterion: AC-6
    executor: test
    cmd: config:executors.test.app_ui
    paths: [scripts/deals-phi-ly-do.mjs, app/tests/deals-phi-ly-do.test.tsx]
    expected: "exit 0; ca 'DPD-AC-6' fixture hai tin hợp lý giảm 30% và 40%: kiểm 'đầu danh sách ≤ 35% (DB còn 1 tin ≤ 35%)' ok=true; không kiểm nào có tiền tố 'DB không còn tin đủ điều kiện'; kq.dau = tin 30%. Chiều đỏ ghi trong design.md: bản dựng đối chứng trên lượt đo chính đếm 0 tin ≤ 35% và rơi vào lối thoát"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
