schema_version: 1
feature_slug: job-step-ghi-thoi-luong
evals:
  - id: E1
    criterion: AC-1
    executor: test
    cmd: config:executors.test.jst_unit
    paths: [scripts/lib/job-step.sh, scripts/job-step-thoi-luong.test.mjs]
    expected: "exit 0; cây tạm chép NGUYÊN scripts/lib/job-step.sh, tệp bọc thử một dòng `source` nó rồi gọi job_step với lệnh giả. Ma trận viết trước, ô «mã 0»: stderr có ĐÚNG MỘT dòng khớp /^JOB STEP \\[jst-thu\\] bước xanh mã 0 giây [0-9]+ nhanh [01]$/, số dòng khớp /^JOB FAIL/ bằng 0, và stdout bằng ĐÚNG BYTE đầu ra của chính lệnh ấy khi chạy không qua job_step (so chuỗi, không so khoảng). Chiều đỏ CÙNG fixture: bản sao job-step.sh đột biến in dòng JOB STEP ra stdout thay vì stderr → ca đỏ ghim «JST-AC-1 dòng JOB STEP lọt vào stdout»; bản sao chỉ in JOB STEP khi mã ≠ 0 → ca đỏ ghim «JST-AC-1 bước xanh không có dòng JOB STEP»."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E2
    criterion: AC-2
    executor: test
    cmd: config:executors.test.jst_unit
    paths: [scripts/lib/job-step.sh, scripts/job-step-thoi-luong.test.mjs]
    expected: "exit 0; cùng cây tạm, một lượt chạy hai bước qua job_step: bước `cham` gọi /bin/sleep 2 (sleep THẬT, không shim) và bước `nhanh` gọi /usr/bin/true. Ô so trọn: giây của `cham` ≥ 2 và giây của `nhanh` ≤ 1, cả hai rút từ chính dòng JOB STEP trên stderr. Chiều đỏ CÙNG fixture: bản sao job-step.sh đột biến ghi hằng `giây 0` → ca đỏ ghim «JST-AC-2 giây là hằng, không phải số đo»; bản sao lấy mốc kết thúc TRƯỚC khi chạy lệnh → ca đỏ cùng thông điệp ấy."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E3
    criterion: AC-3
    executor: test
    cmd: config:executors.test.jst_unit
    paths: [scripts/lib/job-step.sh, scripts/job-step-thoi-luong.test.mjs]
    expected: "exit 0; ma trận viết trước bốn mã thoát (1, 3, 42, 127) qua job_step: mỗi ô job_step trả đúng mã ấy, stderr có dòng /^JOB STEP \\[jst-thu\\] bước do mã <n> giây [0-9]+ nhanh [01]$/ và dòng `JOB FAIL [jst-thu] bước do mã <n>` NGUYÊN VĂN, và chỉ số dòng của JOB STEP nhỏ hơn chỉ số dòng của JOB FAIL. Chiều đỏ CÙNG fixture: bản sao job-step.sh đột biến trả 0 khi lệnh hỏng → mọi ô đỏ ghim «JST-AC-3 job_step nuốt mã thoát»; bản sao nối thêm ` giây <s>` vào chính dòng JOB FAIL cũ → ca đỏ ghim «JST-AC-3 dòng JOB FAIL cũ bị đổi chữ»."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E4
    criterion: AC-4
    executor: test
    cmd: config:executors.test.jst_unit
    paths: [scripts/lib/job-step.sh, scripts/job-step-thoi-luong.test.mjs]
    expected: "exit 0; một lượt gọi job_run ba lần (mã 0, mã 3, mã 4) rồi `exit $JOB_RC`: tệp bọc thử thoát 3 (mã hỏng ĐẦU TIÊN, không bị 4 đè), mỗi lần gọi job_run trả 0 (ghi lại bằng `echo $?` sau từng lần), và stderr có đúng ba dòng JOB STEP với cặp (bước, mã) theo thứ tự [xanh 0, do3 3, do4 4]. Chiều đỏ CÙNG fixture: bản sao job-step.sh đột biến cho JOB_RC lấy mã hỏng CUỐI → ca đỏ ghim «JST-AC-4 JOB_RC lấy mã hỏng cuối»; bản sao để job_run trả mã của lệnh → ca đỏ ghim «JST-AC-4 job_run không còn luôn trả 0»."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E5
    criterion: AC-5
    executor: test
    cmd: config:executors.test.jst_unit
    paths: [scripts/lib/job-step.sh, scripts/job-step-thoi-luong.test.mjs]
    expected: "exit 0; ma trận cờ viết trước BỐN ô trên cùng cây tạm, mỗi ô chạy ba bước: S03_LUOT_NHANH=1 → mọi dòng JOB STEP kết thúc bằng ` nhanh 1`; biến KHÔNG đặt → ` nhanh 0`; S03_LUOT_NHANH=0 → ` nhanh 0`; S03_LUOT_NHANH=true → ` nhanh 0` (chỉ đúng chuỗi `1` mới là lượt nhanh). Mỗi ô còn đòi cả ba dòng khớp NGUYÊN khuôn /^JOB STEP \\[[^\\]]+\\] bước \\S+ mã [0-9]+ giây [0-9]+ nhanh [01]$/ — không thừa, không thiếu trường nào. Chiều đỏ CÙNG fixture: bản sao job-step.sh đột biến bỏ trường `nhanh` khỏi dòng → cả bốn ô đỏ ghim «JST-AC-5 dòng JOB STEP thiếu cột nhanh»; bản sao coi mọi giá trị khác rỗng là lượt nhanh → ô S03_LUOT_NHANH=true và ô =0 đỏ ghim «JST-AC-5 cột nhanh không theo đúng chuỗi 1»."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E6
    criterion: AC-6
    executor: test
    cmd: config:executors.test.jst_unit
    paths: [scripts/lib/job-step.sh, scripts/job-step-thoi-luong.test.mjs]
    expected: "exit 0; hai phần trên cùng cây tạm, cùng dãy bước (một bước mã 0, một bước mã 5). (1) Không ghi tệp: chụp ảnh cây trước lượt (đường + cỡ + mtime của mọi tệp, duyệt đệ quy) và sau lượt — hiệu hai tập rỗng cả hai chiều, 0 tệp mới và 0 tệp đổi. (2) Môi trường không ghi được: chạy lại cùng lượt với thư mục làm việc và HOME đều chmod 0o500 — mã thoát tệp bọc bằng lượt thường, stderr vẫn có đủ hai dòng JOB STEP, stdout bằng ĐÚNG BYTE stdout lượt thường, và hợp của stdout với stderr không chứa 'Permission denied' hay 'No such file'. Chiều đỏ CÙNG fixture: bản sao job-step.sh đột biến nối mỗi bản ghi vào một tệp cạnh tệp bọc → phần (1) đỏ ghim «JST-AC-6 vòng đã mở đường ghi tệp» VÀ phần (2) đỏ ghim «JST-AC-6 lỗi ghi lọt ra ngoài»."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E7
    criterion: AC-7
    executor: test
    cmd: config:executors.test.jst_unit
    paths: [scripts/zalo-import-daily.sh, scripts/lib/job-step.sh, scripts/job-step-thoi-luong.test.mjs]
    expected: "exit 0; cây tạm theo khuôn scripts/s03-nap-nhanh.test.mjs (chép NGUYÊN tệp bọc thật + job-step.sh, node giả đầu PATH, sleep giả, HOME tạm, DATABASE_URL cổng đóng). Ma trận viết trước ba kết cục của transform-zalo ở lượt --luot-nhanh: (a) xanh → dòng /^JOB STEP \\[zalo-import-daily\\] bước transform-zalo mã 0 giây [0-9]+ nhanh 1$/, exit 0; (b) node giả in 'canceling statement due to lock timeout' rồi thoát 1 → dòng JOB STEP với mã 1, dòng `BỎ LƯỢT [zalo-import-daily] bước transform-zalo: đụng khoá — lượt sau làm` NGUYÊN VĂN, không có JOB FAIL cho bước ấy, exit 0; (c) thoát 3 vì 'boom' → dòng JOB STEP mã 3 và `JOB FAIL [zalo-import-daily] bước transform-zalo mã 3`, exit 3. Mỗi ô đòi đúng MỘT dòng JOB STEP cho transform-zalo. Mã thoát ba ô so với bản tệp bọc ở origin/main chạy trên CÙNG node giả (rút bằng `git show origin/main:scripts/zalo-import-daily.sh`, không viết tay). Chiều đỏ CÙNG fixture: bản sao tệp bọc bỏ lời gọi ghi trong buoc_nhanh → cả ba ô đỏ ghim «JST-AC-7 buoc_nhanh không ghi thời lượng»; bản sao ghi rồi `return` trước nhánh BỎ LƯỢT → ô (b) đỏ ghim «JST-AC-7 dòng BỎ LƯỢT biến mất»."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E8
    criterion: AC-8
    executor: test
    cmd: config:executors.test.jst_unit
    paths: [scripts/zalo-import-daily.sh, scripts/job-step-thoi-luong.test.mjs]
    expected: "exit 0; hai phần. (1) Cây tạm lượt --luot-nhanh: stderr có ĐÚNG MỘT dòng JOB STEP mang bước `truoc-lan-claude`, và chỉ số dòng của nó nhỏ hơn chỉ số mọi dòng JOB STEP của bước transform-*; lượt cấy CHAM_BUOC=import-airbnb CHAM_GIAY=2 (node giả ngủ THẬT trong vòng nạp) → giây ≥ 2, lượt không cấy → giây ≤ 1. (2) Lưới phạm vi làn chạy trên CHÍNH cây làm việc, không trên bản sao: hàm kiểm chạy `git diff -U0 origin/main -- scripts/zalo-import-daily.sh`, lấy số dòng của mốc `# Từ đây trở xuống là làn Claude` trong bản `git show origin/main:scripts/zalo-import-daily.sh`, rồi đòi MỌI khối @@ có dòng bắt đầu LỚN HƠN số ấy, và đòi dòng mốc còn nguyên trong cây. Ba ô viết trước cho hàm ấy: (i) cây như hiện tại → xanh; (ii) ô dương — chèn tạm một dòng trống có chú thích NGAY DƯỚI mốc rồi chạy hàm → vẫn xanh, rồi `git checkout -- scripts/zalo-import-daily.sh` hoàn nguyên; (iii) chiều đỏ — chèn tạm một dòng vào vòng nạp PHÍA TRÊN mốc rồi chạy hàm → đỏ ghim «JST-AC-8 sửa phần trên ranh giới làn Claude», rồi hoàn nguyên. Ô (ii) và (iii) chạy nối tiếp, mỗi ô hoàn nguyên trong khối dọn của chính nó để cây không bẩn khi ca hỏng giữa chừng. Chiều đỏ cho phần (1) CÙNG fixture: bản sao tệp bọc bỏ dòng ghi truoc-lan-claude → phần (1) đỏ ghim «JST-AC-8 không có bước truoc-lan-claude»."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E9
    criterion: AC-9
    executor: test
    cmd: config:executors.test.jst_unit
    paths: [scripts/zalo-import-daily.sh, scripts/job-step-thoi-luong.test.mjs]
    expected: "exit 0; cùng cây tạm chạy hai lượt (--luot-nhanh và không cờ) trên HAI bản tệp bọc: bản sau vòng và bản origin/main (rút bằng `git show origin/main:scripts/zalo-import-daily.sh`, không viết tay). Tín hiệu đối chứng là NHẬT KÝ LỜI GỌI CỦA NODE GIẢ (danh sách tệp .mjs/.ts được gọi theo thứ tự) — tín hiệu này có ở CẢ hai bản: đòi dãy lời gọi và mã thoát của bản sau vòng bằng ĐÚNG dãy và mã của bản origin/main, cho cả lượt nhanh lẫn lượt 00:00. Tín hiệu thứ hai là dãy nhãn trên dòng JOB STEP, CHỈ có ở bản sau vòng, so riêng: mọi dòng của lượt nhanh kết thúc ` nhanh 1`, mọi dòng của lượt 00:00 kết thúc ` nhanh 0`, và `truoc-lan-claude` được nêu tên là bước chỉ có ở bản sau vòng nên nằm ngoài phép so đối chứng. Dãy kỳ vọng KHÔNG được viết tay ở bất kỳ ô nào. Chiều đỏ CÙNG fixture: bản sao tệp bọc bỏ bước xep-hang-gia khỏi lượt 00:00 → ca đỏ ghim «JST-AC-9 chuỗi bước lượt 00:00 đã đổi»; bản sao export S03_LUOT_NHANH=1 cho cả lượt 00:00 → ca đỏ ghim «JST-AC-9 cột nhanh sai ở lượt 00:00»."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E10
    criterion: AC-10
    executor: test
    cmd: config:executors.test.jst_regress
    paths: [scripts/lib/job-step.sh, scripts/zalo-import-daily.sh, scripts/job-exit.test.mjs, scripts/s03-nap-nhanh.test.mjs, scripts/zalo-import-job.test.mjs, scripts/zalo-import-job-nhe.test.mjs, scripts/enrich-buoc-job.test.mjs]
    expected: "exit 0; chạy năm bộ test job có sẵn không sửa kỳ vọng nào của chúng — job-exit, s03-nap-nhanh, zalo-import-job, zalo-import-job-nhe, enrich-buoc-job. Đây là lưới hồi quy của cross-cutting «dòng cũ không đổi»: năm bộ ấy đọc dòng JOB FAIL, dòng BỎ LƯỢT, dãy nhãn bước và mã thoát, nên dòng JOB STEP mới mà lọt vào stdout, đè dòng cũ hay đổi mã thoát thì ít nhất một bộ phải đỏ. Chiều đỏ CÙNG fixture: bản sao job-step.sh đột biến in JOB STEP ra stdout → scripts/job-exit.test.mjs đỏ (bộ ấy so đầu ra của bước); bản sao bỏ dòng JOB FAIL → scripts/job-exit.test.mjs đỏ ở ca mã thoát."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
