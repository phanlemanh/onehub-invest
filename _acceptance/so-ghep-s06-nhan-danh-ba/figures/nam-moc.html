<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Năm mốc triển khai</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Lora:ital,wght@0,400;1,400&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Lora', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1280px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.25;
      color: var(--color-ink);
      margin-bottom: 0.5rem;
    }
    .sub {
      font-size: 0.875rem;
      color: var(--color-muted);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 960px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Cổng Phạm vi · so-ghep-s06-nhan-danh-ba · Hỏi-5 · Hỏi-2</p>
    <h1>Năm mốc: số S06 lên trang Bán lúc nào, kèm nhãn gì</h1>
    <p class="sub">Năm bước nối tiếp, một chỗ rẽ · Người chạy: Mạnh · AC-1 · AC-4 · AC-6 · AC-7</p>

    <svg viewBox="0 0 1240 488" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
      </defs>

      <rect width="1240" height="488" fill="#f5f5f5"/>

      <!-- ===================== NĂM MỐC ===================== -->
      <text x="40" y="36" fill="#4f5d75" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.18em">NĂM MỐC TRIỂN KHAI, ĐI ĐÚNG THỨ TỰ</text>

      <!-- mũi tên vẽ trước hộp -->
      <line x1="240" y1="88" x2="280" y2="88" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="480" y1="88" x2="520" y2="88" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="720" y1="88" x2="760" y2="88" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="960" y1="88" x2="1000" y2="88" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Mốc 1 -->
      <rect x="40" y="48" width="200" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="52" y="68" fill="#4f5d75" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.18em">MỐC 1</text>
      <text x="52" y="92" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif">Gộp</text>
      <text x="52" y="112" fill="#4f5d75" font-size="12" font-family="'Geist', sans-serif">Hai PR vào nhánh chính</text>

      <!-- Mốc 2 -->
      <rect x="280" y="48" width="200" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="292" y="68" fill="#4f5d75" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.18em">MỐC 2</text>
      <text x="292" y="92" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif">Kéo về</text>
      <text x="292" y="112" fill="#4f5d75" font-size="12" font-family="'Geist', sans-serif">Máy thu lấy bản mới</text>

      <!-- Mốc 3 -->
      <rect x="520" y="48" width="200" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="532" y="68" fill="#4f5d75" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.18em">MỐC 3</text>
      <text x="532" y="92" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif">Áp cloud</text>
      <text x="532" y="112" fill="#4f5d75" font-size="12" font-family="'Geist', sans-serif">Đo trước, rồi áp</text>

      <!-- Mốc 4 -->
      <rect x="760" y="48" width="200" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="772" y="68" fill="#4f5d75" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.18em">MỐC 4</text>
      <text x="772" y="92" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif">Áp 070</text>
      <text x="772" y="112" fill="#4f5d75" font-size="12" font-family="'Geist', sans-serif">Sao lưu, rồi thêm cột nhãn</text>

      <!-- Mốc 5: tiêu điểm -->
      <rect x="1000" y="48" width="200" height="80" rx="6" fill="#f5f5f5"/>
      <rect x="1000" y="48" width="200" height="80" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4"/>
      <text x="1012" y="68" fill="#ba4513" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.18em">MỐC 5</text>
      <text x="1012" y="92" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif">Áp 068</text>
      <text x="1012" y="112" fill="#4f5d75" font-size="12" font-family="'Geist', sans-serif">Sao lưu, rồi cho ghi số S06</text>

      <!-- ===================== NGƯỜI XEM THẤY GÌ ===================== -->
      <text x="40" y="160" fill="#4f5d75" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.18em">NGƯỜI XEM TRANG BÁN THẤY GÌ LÚC ĐÓ</text>
      <text x="1200" y="160" fill="#4f5d75" font-size="12" font-family="'Geist', sans-serif" text-anchor="end">Nhãn là chữ «Chưa xác minh» cạnh số</text>

      <rect x="40" y="172" width="200" height="64" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <text x="52" y="198" fill="#2d3142" font-size="12" font-weight="500" font-family="'Geist', sans-serif">Chưa có số S06.</text>
      <text x="52" y="216" fill="#2d3142" font-size="12" font-weight="500" font-family="'Geist', sans-serif">Số đang có kèm nhãn</text>

      <rect x="280" y="172" width="200" height="64" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <text x="292" y="208" fill="#2d3142" font-size="12" font-weight="500" font-family="'Geist', sans-serif">Số cũ kèm nhãn</text>

      <rect x="520" y="172" width="200" height="64" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <text x="532" y="208" fill="#2d3142" font-size="12" font-weight="500" font-family="'Geist', sans-serif">Số cũ kèm nhãn</text>

      <rect x="760" y="172" width="200" height="64" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <text x="772" y="208" fill="#2d3142" font-size="12" font-weight="500" font-family="'Geist', sans-serif">Số cũ có trên tin hết nhãn</text>

      <rect x="1000" y="172" width="200" height="64" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <text x="1012" y="198" fill="#2d3142" font-size="12" font-weight="500" font-family="'Geist', sans-serif">Số S06 lên.</text>
      <text x="1012" y="216" fill="#2d3142" font-size="12" font-weight="500" font-family="'Geist', sans-serif">Số suy từ tài khoản kèm nhãn</text>

      <!-- ===================== DẢI DƯỚI: HAI NHÁNH ===================== -->
      <line x1="40" y1="260" x2="1200" y2="260" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <text x="40" y="284" fill="#4f5d75" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.18em">SỐ S06 CÓ VÀO DANH BẠ KHÔNG?</text>
      <text x="536" y="284" fill="#4f5d75" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.18em">DANH BẠ</text>
      <text x="756" y="284" fill="#4f5d75" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.18em">TRÊN TRANG BÁN</text>

      <!-- đường nối vẽ trước hộp -->
      <path d="M140 336 V328 Q140 320 148 320 H280" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M140 416 V424 Q140 432 148 432 H280" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="480" y1="320" x2="520" y2="320" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="480" y1="432" x2="520" y2="432" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- nhãn đường nối -->
      <rect x="196" y="298" width="32" height="16" rx="2" fill="#f5f5f5"/>
      <text x="212" y="310" fill="#636b80" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CÓ</text>
      <rect x="184" y="410" width="56" height="16" rx="2" fill="#f5f5f5"/>
      <text x="212" y="422" fill="#636b80" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">KHÔNG</text>

      <!-- chỗ rẽ -->
      <polygon points="140,336 240,376 140,416 40,376" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="140" y="372" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Biết chắc số</text>
      <text x="140" y="388" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">có trên tin?</text>

      <!-- Nhánh CÓ -->
      <rect x="280" y="296" width="200" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="292" y="324" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Số có trên tin</text>

      <rect x="520" y="296" width="440" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <line x1="740" y1="296" x2="740" y2="344" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <text x="536" y="324" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Vào danh bạ</text>
      <text x="756" y="324" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Không nhãn</text>

      <!-- Nhánh KHÔNG -->
      <rect x="280" y="408" width="200" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="292" y="428" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Số suy từ tài khoản,</text>
      <text x="292" y="444" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">hoặc mất dấu nguồn gốc</text>

      <rect x="520" y="408" width="440" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <line x1="740" y1="408" x2="740" y2="456" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <text x="536" y="436" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Không vào danh bạ</text>
      <text x="756" y="436" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Có nhãn</text>
      <rect x="812" y="420" width="112" height="24" rx="4" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4"/>
      <text x="868" y="436" fill="#ba4513" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Chưa xác minh</text>

      <!-- Hỏng theo hướng đóng -->
      <text x="1000" y="428" fill="#4f5d75" font-size="14" font-style="italic" font-family="'Lora', serif">Mất dấu thì số không bao giờ</text>
      <text x="1000" y="448" fill="#4f5d75" font-size="14" font-style="italic" font-family="'Lora', serif">hiện như số chắc chắn</text>
    </svg>
  </div>
</body>
</html>
