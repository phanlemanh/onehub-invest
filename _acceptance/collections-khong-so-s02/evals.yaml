    expected: "exit 0; dòng 'ok' của luật 'trang Thu thập không đọc trường S02' và chiều đỏ của luật trên bản sao có airdnaListings báo tệp; portal-compliance: ĐẠT"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E7
    criterion: AC-7
    executor: script
    cmd: config:executors.script.s02_smoke
    paths: [scripts/smoke-collections-khong-so-s02.mjs, scripts/lib/ops-app.mjs, app/src/components/ops/collections/**, app/src/components/ops/collections-tables.tsx]
    expected: "exit 0; dòng 'ok   bảng luồng không cột S02', 'ok   tab Listing một mục chú giải', 'ok   Rotation không huy hiệu tên', 'ok   hàng S02 lưới nguồn theo Hỏi-1', dòng ảnh chụp đã lưu, chiều đỏ 'ok   chiều đỏ: chèn huy hiệu tên vào Rotation → báo', 'dọn: 0 phiên tạm còn lại'"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
