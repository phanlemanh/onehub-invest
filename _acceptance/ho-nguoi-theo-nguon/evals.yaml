    expected: "exit 0; output có dòng 'luot1' và 'luot2' mỗi dòng in nguoi/bi_danh/vai sống và tổng dòng party_roles (kể cả đã rút) theo nguồn S03, S05, S06 với mọi số sống > 0; dòng 'ket-qua luot2: nguoi_moi=0 bi_danh_moi=0 vai_moi=0 vai_rut=0'; dòng 'bang-nhau: true' (số sống và tổng dòng party_roles lượt 2 = lượt 1); dòng 'doi-chung bo-tra-bi-danh: loi trung khoa registry_aliases → do (đúng kỳ vọng)'; dòng 'sellers_thieu_nguoi: 0'; dòng 'rollback: dem truoc = dem sau' cho parties, party_roles, sale_offer_records. Lệnh chạy trọn hai lượt transform thật (runTransformZalo, runTransformFb, runTransformChotot) + refreshBaitGap + dungNguoi trên DB thử chép từ DB local, tất cả trong MỘT giao dịch ROLLBACK; đối chứng chạy cùng dữ liệu trong cùng giao dịch (SAVEPOINT): bộ dựng bỏ tra bí danh, lượt hai phải ném lỗi trùng khoá trên chỉ mục duy nhất sống của registry_aliases. Thoát 1 nếu kết quả lượt 2 khác 0, số lượt 2 khác lượt 1, hoặc đối chứng không ném; thoát 2 nếu điều kiện dương không đạt (một nguồn có 0 người)."
