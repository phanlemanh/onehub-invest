  - id: E4
    criterion: AC-4
    executor: test
    cmd: config:executors.test.nguoi_db
    expected: "exit 0; ca 'AC-4 S03/S05 người gửi' xanh (BEGIN…ROLLBACK): fixture bài stg_zalo_posts + tin sale_offer_records tự chèn, ma trận viết trước 7 dòng (số assert = 7): S03 một bài sender 's1' → 1 vai source_field/fact tới người bí danh (S03,tai_khoan_nguon,'s1'); S03 hai bài sender 's1','s2' → 2 vai, hai người; S03 không sender, có seller_phone_hash 'h9' → 1 vai parser/observed tới người bí danh (S03,sdt_bam,'h9'); S03 không sender không SĐT → 0 vai và khong_dinh_danh.S03 tăng 1; S05 bài kênh apify-facebook sender 's1' → 1 vai tới người S05 KHÁC người S03 's1'; S05 không sender có SĐT → 1 vai parser; tin S03 đã nghỉ (retired_at khác NULL) sender 's7' → 1 vai tới người 's7'. Đối chứng dương: dòng 'không gì' thêm sender 's3' rồi chạy lại → có 1 vai. Ghim 'AC-4 sai vai: <dòng ma trận>'."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
    paths: [pipeline/lib/danh-ba-nguoi.mjs, pipeline/scripts/danh-ba-nguoi.itest.mjs]

  - id: E5
    criterion: AC-5
    executor: test
    cmd: config:executors.test.nguoi
    expected: "exit 0; ca 'AC-5 luật bí danh SĐT' trong pipeline/scripts/danh-ba-nguoi.test.mjs xanh (không DB, hàm thuần giaiNguoi trên bảng bí danh trong bộ nhớ): ma trận viết trước 7 dòng (số assert = 7) — (a) tin tài khoản A + SĐT h → vai chỉ tới người A; h là bí danh của người theo SĐT PH (nguồn S03), người A không có bí danh sdt_bam; (b) lượt sau tin chỉ SĐT h → vai parser tới PH (không tới A); (c) tin tài khoản B + SĐT h → vai tới B; h vẫn thuộc PH, không người mới; (d) tin hai người gửi A, B + SĐT k → hai vai A, B; k là bí danh người PK mới; (e) tin không tài khoản + SĐT m mới → tạo người PM, vai parser; (f) S05 SĐT h (S03 đã có PH) → người S05 mới, khác PH; (g) chạy lại toàn bộ (a)-(f) lần hai → 0 người mới, 0 bí danh mới. Chiều đỏ cùng ma trận: bản sao luật theo lối khác của Hỏi-4 (gắn SĐT chưa ai giữ vào người tài khoản duy nhất) → assert dòng (a) đỏ, thông điệp ghim 'AC-5 SĐT gắn vào người tài khoản: h'."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
    paths: [pipeline/lib/danh-ba-nguoi.mjs, pipeline/scripts/danh-ba-nguoi.test.mjs]

