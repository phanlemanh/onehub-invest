schema_version: 1
feature_slug: ho-nguoi-theo-nguon
evals:
  - id: E1
    criterion: AC-1
    executor: test
    cmd: config:executors.test.nguoi_db
    expected: "exit 0; ca 'AC-1 khung danh bạ' trong pipeline/scripts/danh-ba-nguoi.itest.mjs xanh trên DB thử oneinvest_p3_nguoi (BEGIN…ROLLBACK): nạp 055 hai lần liên tiếp → lần hai không lỗi, ảnh lược đồ (information_schema.columns + pg_constraint + pg_trigger của bốn bảng) trước/sau lần hai bằng nhau. Ma trận viết trước 18 dòng, mỗi dòng một SAVEPOINT, số assert = 18: (1) INSERT parties khoá 'pty_01HZZZZZZZZZZZZZZZZZZZZZZZ' (26 ký tự Crockford) → được; (2) khoá 'pty_abc' → từ chối; (3) khoá 'usr_01HZ…' → từ chối; (4) status 'deleted' → từ chối; (5) status 'merged' thiếu merged_into → từ chối; (6) status 'active' có merged_into → từ chối; (7) parties.source 'chotot' → từ chối; (8) registry_aliases.source 'chotot' → từ chối; (9)–(16) đủ tám ô DELETE FROM và TRUNCATE trên từng bảng parties, party_roles, registry_aliases, registry_events → từ chối, mỗi ô thông điệp chứa 'chỉ thêm'; (17) UPDATE party_roles đặt retracted_at không lý do → từ chối, thông điệp chứa 'chỉ thêm'; (18) UPDATE party_roles đổi party_key → từ chối, thông điệp chứa 'chỉ thêm'. Đối chứng dương cùng ma trận: dòng (1) và một UPDATE party_roles rút CÓ lý do đều được. Ghim 'AC-1 ràng buộc không chặn: <dòng>'."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
    paths: [db/migrations/055_danh_ba_nguoi.sql, pipeline/scripts/danh-ba-nguoi.itest.mjs]

  - id: E2
    criterion: AC-2
    executor: test
    cmd: config:executors.test.nguoi_db
    expected: "exit 0; ca 'AC-2 enum và DQ' xanh trên DB thử (BEGIN…ROLLBACK, 055 nạp): (a) chạy logic --check-db của pipeline/vocab.mjs (hàm xuất ra, cùng hàm CLI dùng) → 0 lệch cho bốn trục registry_status, alias_kind, registry_event_kind, party_role — mỗi giá trị khai ở mappings.yaml có dòng ref_lookup và CHECK của cột liệt đúng tập ấy; chiều đỏ cùng giao dịch: xoá một dòng ref_lookup ('party_role','nguoi_dang') → --check-db báo đúng trục 'party_role'. (b) gọi hàm kiểm của dq-enum-vocab.mjs → dq_check_results có dòng check_name 'enum-vocab:<cột>' cho registry_aliases.kind, party_roles.role, parties.status với status 'pass'."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
    paths: [pipeline/mappings.yaml, pipeline/lib/vocab.generated.mjs, pipeline/vocab.mjs, pipeline/dq-enum-vocab.mjs, db/migrations/055_danh_ba_nguoi.sql, pipeline/scripts/danh-ba-nguoi.itest.mjs]

  - id: E2b
    criterion: AC-2
    executor: test
    cmd: config:executors.test.nguoi_app
    expected: "exit 0; ca 'AC-2 nhãn dòng kiểm danh bạ' trong app/tests/dq-nhan-danh-ba.test.tsx xanh (không DB): ma trận viết trước — ba dòng kiểm do dq-enum-vocab sinh cho bảng mới (check_name 'enum-vocab:kind' entity 'registry_aliases'; 'enum-vocab:role' entity 'party_roles'; 'enum-vocab:status' entity 'parties'; detail đúng khuôn chữ dq-enum-vocab ghi) → dqCheckName, dqEntityLabel, dqDetail đều known:true và chữ không chứa mã thô 'party_roles'/'registry_aliases'/'parties'; DqChecksTable dựng ba dòng ra HTML không chứa ba mã thô ấy. Chiều đỏ cùng ma trận: entity 'party_roles_x' (không có nhãn) → dqEntityLabel known:false. Ghim 'AC-2 dòng kiểm chưa diễn giải: <check_name · entity>'."
