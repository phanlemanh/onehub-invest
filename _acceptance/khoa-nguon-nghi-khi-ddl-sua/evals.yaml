    expected: "exit 0; ca 'KN-AC-1' xanh trên DB của riêng lượt. Đối chứng dương trước: hàm đo giữ-33033 thấy khoá 33033 của một phiên đối chứng gọi pg_advisory_lock(33033) (không thì 'KN do khoa 33033 hong'); phiên chặn giữ ACCESS EXCLUSIVE public.field_assertions mà hàm đo thấy KHÔNG giữ 33033; phiên gọi bị chặn ở lần thử đầu (lan >= 1, không thì 'KN ca het can cu'). Phiên chặn nhả sau 1,5 s; khoaNguon(c, ['sale_offer_records','field_assertions'], {toiDa: 40}) trả về, 5 <= lan <= 25, không giữ 33033, AccessShareLock granted trên relation = 'public.sale_offer_records'::regclass và 'public.field_assertions'::regclass. Chiều đỏ (E4): mã cũ ném 55P03 HOẶC trả lan > 25 → cùng một thông điệp 'KN KHOA NGOAI 33033 QUAY KHONG NGHI'; quên nhả 33033 → 'KN CON GIU 33033'."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
