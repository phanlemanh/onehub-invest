<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hỏi-1 tin mới nhất trên cloud</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Lora:ital,wght@0,400;1,400&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Lora', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1040px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.25;
      color: var(--color-ink);
      margin-bottom: 0.5rem;
    }
    .sub {
      font-size: 0.875rem;
      color: var(--color-muted);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Cổng Phạm vi · dong-chay-len-cloud · hoi-1</p>
    <h1>Hỏi-1: trên cloud, khung «Tin mới nhất» hiện tin rao ngay hay ẩn tới TV10</h1>
    <p class="sub">DF1 · tình huống: người vận hành mở «Dòng chảy dữ liệu» trên cloud, cuộn tới «Tin mới nhất» · hai nhánh, nhánh tô cam là nhánh máy khuyên</p>

    <svg viewBox="0 0 1000 784" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- ============ Khung nhánh (nền, vẽ trước) ============ -->
      <rect x="48" y="288" width="448" height="376" rx="8" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4"/>
      <text x="64" y="312" fill="#ba4513" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.14em">NHÁNH A · MÁY KHUYÊN</text>
      <text x="64" y="336" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Hiện tin rao từ cloud</text>

      <rect x="504" y="288" width="448" height="376" rx="8" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="520" y="312" fill="#4f5d75" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.14em">NHÁNH B</text>
      <text x="520" y="336" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Ẩn bảng trên cloud tới TV10</text>

      <!-- ============ Mũi tên (vẽ trước nút) ============ -->
      <line x1="356" y1="176" x2="356" y2="208" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <line x1="272" y1="256" x2="272" y2="288" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <line x1="728" y1="256" x2="728" y2="288" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Nhánh A: bấm một tin → hồ sơ tin -->
      <line x1="272" y1="484" x2="272" y2="516" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <rect x="284" y="492" width="80" height="16" rx="2" fill="#f5f5f5"/>
      <text x="288" y="504" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.06em">BẤM MỘT TIN</text>

      <!-- ============ Trang «Dòng chảy dữ liệu» trên cloud ============ -->
      <rect x="48" y="24" width="616" height="152" rx="8" fill="#f5f5f5"/>
      <rect x="48" y="24" width="616" height="152" rx="8" fill="rgba(45,49,66,0.03)" stroke="#4f5d75" stroke-width="1"/>
      <text x="64" y="48" fill="#4f5d75" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.14em">TRANG «DÒNG CHẢY DỮ LIỆU» · TRÊN CLOUD · CUỘN XUỐNG</text>

      <rect x="64" y="60" width="584" height="28" rx="4" fill="#ffffff" stroke="#bfc0c0" stroke-width="1"/>
      <text x="80" y="78" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif">Chặng theo nguồn</text>
      <text x="632" y="78" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif" text-anchor="end">có số</text>

      <rect x="64" y="96" width="584" height="28" rx="4" fill="#ffffff" stroke="#bfc0c0" stroke-width="1"/>
      <text x="80" y="114" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif">Chất lượng theo nhóm thu</text>
      <text x="632" y="114" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif" text-anchor="end">có số</text>

      <rect x="64" y="132" width="584" height="28" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1" stroke-dasharray="5,4"/>
      <text x="80" y="150" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Tin mới nhất</text>
      <text x="632" y="150" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist', sans-serif" text-anchor="end">hiện gì?</text>

      <!-- Cloud đang có gì -->
      <rect x="752" y="24" width="200" height="152" rx="6" fill="#f5f5f5"/>
      <rect x="752" y="24" width="200" height="152" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="768" y="48" fill="#4f5d75" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.14em">CLOUD HÔM NAY CÓ</text>
      <text x="768" y="76" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Tin rao</text>
      <text x="936" y="76" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif" text-anchor="end">có</text>
      <text x="768" y="104" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Bài gốc</text>
      <text x="936" y="104" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif" text-anchor="end">chưa · TV9</text>
      <text x="768" y="132" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Trang hồ sơ tin</text>
      <text x="936" y="132" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif" text-anchor="end">chưa · TV10</text>
      <text x="768" y="160" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif">giống nhau ở cả hai nhánh</text>

      <!-- ============ Câu hỏi ============ -->
      <rect x="48" y="208" width="904" height="48" rx="6" fill="#f5f5f5"/>
      <rect x="48" y="208" width="904" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="64" y="236" fill="#4f5d75" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.14em">HỎI-1</text>
      <text x="500" y="237" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Khung «Tin mới nhất» trên cloud lấy tin rao đã có trên cloud, hay ẩn tới khi có trang hồ sơ tin?</text>

      <!-- ============ Nhánh A: hiện tin rao từ cloud ============ -->
      <text x="64" y="364" fill="#4f5d75" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.14em">KHUNG «TIN MỚI NHẤT» HIỆN</text>
      <rect x="64" y="372" width="416" height="112" rx="6" fill="#ffffff" stroke="#bfc0c0" stroke-width="1"/>
      <text x="80" y="392" fill="#4f5d75" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.14em">TIN RAO</text>
      <text x="464" y="392" fill="#4f5d75" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.14em" text-anchor="end">BẬC</text>
      <line x1="80" y1="400" x2="464" y2="400" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <text x="80" y="422" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif">Căn hộ 2 phòng ngủ · phường A</text>
      <text x="464" y="422" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif" text-anchor="end">bậc 2</text>
      <text x="80" y="446" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif">Nhà phố 4 tầng · phường B</text>
      <text x="464" y="446" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif" text-anchor="end">bậc 1</text>
      <text x="80" y="470" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif">Căn hộ 1 phòng ngủ · phường C</text>
      <text x="464" y="470" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif" text-anchor="end">bậc 3</text>

      <text x="64" y="512" fill="#4f5d75" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.14em">HỒ SƠ TIN</text>
      <rect x="64" y="516" width="416" height="40" rx="6" fill="#ffffff" stroke="#bfc0c0" stroke-width="1"/>
      <text x="80" y="540" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif">Chỗ bài gốc ghi:</text>
      <text x="196" y="540" fill="#4f5d75" font-size="12" font-family="'Geist', sans-serif">«Bài gốc chỉ xem ở máy thu»</text>

      <text x="64" y="592" fill="#ba4513" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.14em">HỆ QUẢ</text>
      <text x="64" y="616" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Thấy tin cụ thể ngay, thiếu bài gốc</text>
      <text x="64" y="636" fill="#4f5d75" font-size="12" font-family="'Geist', sans-serif">bài gốc lên cloud khi xong TV9</text>

      <!-- ============ Nhánh B: ẩn bảng tới TV10 ============ -->
      <text x="520" y="364" fill="#4f5d75" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.14em">KHUNG «TIN MỚI NHẤT» HIỆN</text>
      <rect x="520" y="372" width="416" height="112" rx="6" fill="#ffffff" stroke="#bfc0c0" stroke-width="1"/>
      <text x="728" y="424" fill="#4f5d75" font-size="12" font-family="'Geist', sans-serif" text-anchor="middle">«Tin mới nhất xem ở máy thu»</text>
      <text x="728" y="444" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">tới khi có trang hồ sơ tin (TV10)</text>

      <text x="520" y="512" fill="#4f5d75" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.14em">HỒ SƠ TIN</text>
      <rect x="520" y="516" width="416" height="40" rx="6" fill="#ffffff" stroke="#bfc0c0" stroke-width="1"/>
      <text x="536" y="540" fill="#4f5d75" font-size="12" font-family="'Geist', sans-serif">Không có tin nào để mở trên cloud</text>

      <text x="520" y="592" fill="#4f5d75" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.14em">HỆ QUẢ</text>
      <text x="520" y="616" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Cloud chỉ có số</text>
      <text x="520" y="636" fill="#4f5d75" font-size="12" font-family="'Geist', sans-serif">xem tin cụ thể phải về máy thu tới TV10</text>

      <!-- ============ Chân hình ============ -->
      <text x="500" y="696" fill="#4f5d75" font-size="12" font-family="'Geist', sans-serif" text-anchor="middle">Cả hai nhánh: các khung số trên cloud như nhau, máy thu vẫn xem tin kèm bài gốc như hôm nay</text>

      <!-- ============ Chú giải ============ -->
      <line x1="48" y1="716" x2="952" y2="716" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <text x="48" y="740" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.18em">CHÚ GIẢI</text>

      <rect x="48" y="752" width="24" height="12" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4"/>
      <text x="80" y="762" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Nhánh máy khuyên</text>

      <rect x="228" y="752" width="24" height="12" rx="2" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="260" y="762" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Nhánh còn lại</text>

      <rect x="408" y="752" width="24" height="12" rx="2" fill="#ffffff" stroke="#bfc0c0" stroke-width="1"/>
      <text x="440" y="762" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Vùng trên trang cloud</text>

      <rect x="588" y="752" width="24" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1" stroke-dasharray="5,4"/>
      <text x="620" y="762" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Khung đang hỏi</text>
    </svg>
  </div>
</body>
</html>
