<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hỏi-2 khối dòng chảy</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Lora:ital,wght@0,400;1,400&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Lora', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1040px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.25;
      color: var(--color-ink);
      margin-bottom: 0.5rem;
    }
    .sub {
      font-size: 0.875rem;
      color: var(--color-muted);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Cổng Phạm vi · dong-chay-len-cloud · hoi-2</p>
    <h1>Hỏi-2: khối dòng chảy mang gì từ máy thu lên cloud</h1>
    <p class="sub">DF1 · khó đảo: thứ đã rời máy thu không gọi về được · hai nhánh, nhánh tô cam là nhánh máy khuyên</p>

    <svg viewBox="0 0 1000 924" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- ============ Khung nhánh (nền, vẽ trước) ============ -->
      <rect x="48" y="452" width="448" height="352" rx="8" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4"/>
      <text x="64" y="476" fill="#ba4513" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.14em">NHÁNH A · MÁY KHUYÊN</text>
      <text x="64" y="500" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Đồng ý đúng bảy mục này</text>

      <rect x="504" y="452" width="448" height="352" rx="8" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="520" y="476" fill="#4f5d75" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.14em">NHÁNH B</text>
      <text x="520" y="500" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Bỏ tên nhóm thu khỏi khối</text>

      <!-- ============ Mũi tên (vẽ trước nút) ============ -->
      <!-- Đường số bốn bước -->
      <line x1="244" y1="88" x2="284" y2="88" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <line x1="480" y1="88" x2="520" y2="88" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <line x1="716" y1="88" x2="756" y2="88" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <!-- Bước 1 → đứng lại ở máy thu -->
      <line x1="144" y1="128" x2="144" y2="164" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <rect x="156" y="138" width="56" height="16" rx="2" fill="#f5f5f5"/>
      <text x="160" y="150" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.06em">GIỮ LẠI</text>
      <!-- Bước 2 → khối dòng chảy -->
      <line x1="380" y1="128" x2="380" y2="164" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <rect x="392" y="138" width="72" height="16" rx="2" fill="#f5f5f5"/>
      <text x="396" y="150" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.06em">MANG KHỐI</text>
      <!-- Khối → câu hỏi → hai nhánh -->
      <line x1="620" y1="340" x2="620" y2="372" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <line x1="272" y1="420" x2="272" y2="452" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <line x1="728" y1="420" x2="728" y2="452" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- ============ Đường số: bốn bước ============ -->
      <text x="48" y="36" fill="#4f5d75" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.14em">ĐƯỜNG SỐ · MỖI 15 PHÚT</text>

      <rect x="48" y="48" width="196" height="80" rx="6" fill="#f5f5f5"/>
      <rect x="48" y="48" width="196" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="64" y="68" fill="#4f5d75" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.14em">1 · MÁY THU</text>
      <text x="64" y="92" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Máy thu tính sẵn số</text>
      <text x="64" y="112" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif">mỗi 15 phút, một định nghĩa</text>

      <rect x="284" y="48" width="196" height="80" rx="6" fill="#f5f5f5"/>
      <rect x="284" y="48" width="196" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="300" y="68" fill="#4f5d75" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.14em">2 · GỬI</text>
      <text x="300" y="92" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Bản tin gửi lên</text>
      <text x="300" y="112" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif">mang khối dòng chảy</text>

      <rect x="520" y="48" width="196" height="80" rx="6" fill="#f5f5f5"/>
      <rect x="520" y="48" width="196" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="536" y="68" fill="#4f5d75" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.14em">3 · CLOUD</text>
      <text x="536" y="92" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Cloud lưu bản tin</text>
      <text x="536" y="112" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif">không tính lại số nào</text>

      <rect x="756" y="48" width="196" height="80" rx="6" fill="#f5f5f5"/>
      <rect x="756" y="48" width="196" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="772" y="68" fill="#4f5d75" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.14em">4 · TRANG</text>
      <text x="772" y="92" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Trang cloud đọc</text>
      <text x="772" y="112" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif">«Dòng chảy dữ liệu»</text>

      <!-- ============ Không đi lên ============ -->
      <rect x="48" y="164" width="196" height="176" rx="6" fill="#f5f5f5"/>

      <text x="64" y="188" fill="#4f5d75" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.14em">KHÔNG ĐI LÊN</text>
      <text x="64" y="204" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif">đứng lại ở máy thu</text>
      <circle cx="68" cy="224" r="2" fill="#4f5d75"/>
      <text x="76" y="228" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif">Bảng thô</text>
      <circle cx="68" cy="248" r="2" fill="#4f5d75"/>
      <text x="76" y="252" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif">Mã tin</text>
      <circle cx="68" cy="272" r="2" fill="#4f5d75"/>
      <text x="76" y="276" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif">Bài gốc</text>
      <circle cx="68" cy="296" r="2" fill="#4f5d75"/>
      <text x="76" y="300" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif">Mã nhóm</text>
      <circle cx="68" cy="320" r="2" fill="#4f5d75"/>
      <text x="76" y="324" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif">Tên nguồn thật</text>

      <!-- ============ Khối dòng chảy: đi lên ============ -->
      <rect x="284" y="164" width="668" height="176" rx="6" fill="#f5f5f5"/>
      <rect x="284" y="164" width="668" height="176" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="300" y="188" fill="#4f5d75" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.14em">KHỐI DÒNG CHẢY · ĐI LÊN</text>
      <text x="300" y="204" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif">chỉ số tổng hợp, đủ ba cửa sổ 7 ngày · 30 ngày · toàn bộ</text>

      <circle cx="304" cy="224" r="2" fill="#2d3142"/>
      <text x="316" y="228" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif">Số chặng theo nguồn</text>
      <circle cx="304" cy="248" r="2" fill="#2d3142"/>
      <text x="316" y="252" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif">Số tin đủ năm trường lõi</text>
      <circle cx="304" cy="272" r="2" fill="#2d3142"/>
      <text x="316" y="276" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif">Số theo ngày</text>
      <rect x="296" y="284" width="216" height="24" rx="4" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3"/>
      <circle cx="304" cy="296" r="2" fill="#2d3142"/>
      <text x="316" y="300" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Số theo nhóm thu kèm tên nhóm</text>
      <text x="524" y="300" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.06em">NHÁNH B BỎ</text>

      <circle cx="652" cy="224" r="2" fill="#2d3142"/>
      <text x="664" y="228" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif">Lưu trú ngắn hạn</text>
      <circle cx="652" cy="248" r="2" fill="#2d3142"/>
      <text x="664" y="252" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif">Loại giao dịch</text>
      <circle cx="652" cy="272" r="2" fill="#2d3142"/>
      <text x="664" y="276" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif">Đề xuất làm giàu đang chờ</text>
      <text x="664" y="324" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif">không mang từng tin rao nào</text>

      <!-- ============ Câu hỏi ============ -->
      <rect x="48" y="372" width="904" height="48" rx="6" fill="#f5f5f5"/>
      <rect x="48" y="372" width="904" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="64" y="400" fill="#4f5d75" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.14em">HỎI-2 · KHÓ ĐẢO</text>
      <text x="528" y="401" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Khối dòng chảy mang đúng bảy mục trên lên cloud — đồng ý, hay bỏ tên nhóm thu?</text>

      <!-- ============ Nhánh A: đồng ý ============ -->
      <text x="64" y="528" fill="#4f5d75" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.14em">CỬA RA CỦA MÁY THU</text>
      <rect x="64" y="536" width="416" height="40" rx="6" fill="#ffffff" stroke="#bfc0c0" stroke-width="1"/>
      <text x="80" y="560" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif">Trường ngoài danh sách, ví dụ mã tin → máy chặn</text>

      <text x="64" y="608" fill="#4f5d75" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LƯỚI CHẤT LƯỢNG THEO NHÓM · CLOUD · MINH HOẠ</text>
      <rect x="64" y="616" width="416" height="88" rx="6" fill="#ffffff" stroke="#bfc0c0" stroke-width="1"/>
      <text x="80" y="636" fill="#4f5d75" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.14em">NHÓM THU</text>
      <text x="336" y="636" fill="#4f5d75" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.14em" text-anchor="end">SỐ TIN</text>
      <text x="464" y="636" fill="#4f5d75" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.14em" text-anchor="end">ĐỦ 5 TRƯỜNG</text>
      <line x1="80" y1="644" x2="464" y2="644" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <text x="80" y="668" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif">Nhóm 1</text>
      <text x="336" y="668" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif" text-anchor="end">128</text>
      <text x="464" y="668" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif" text-anchor="end">86%</text>
      <text x="80" y="692" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif">Nhóm 2</text>
      <text x="336" y="692" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif" text-anchor="end">64</text>
      <text x="464" y="692" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif" text-anchor="end">71%</text>

      <text x="64" y="736" fill="#ba4513" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.14em">HỆ QUẢ</text>
      <text x="64" y="760" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Cloud có đủ số, xem được chất lượng từng nhóm</text>
      <text x="64" y="780" fill="#4f5d75" font-size="12" font-family="'Geist', sans-serif">tên nhóm thu là thông tin công khai, đã chốt</text>

      <!-- ============ Nhánh B: bỏ tên nhóm ============ -->
      <text x="520" y="528" fill="#4f5d75" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.14em">CỬA RA CỦA MÁY THU</text>
      <rect x="520" y="536" width="416" height="40" rx="6" fill="#ffffff" stroke="#bfc0c0" stroke-width="1"/>
      <text x="536" y="560" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif">Như nhánh A, thêm tên nhóm thu vào danh sách chặn</text>

      <text x="520" y="608" fill="#4f5d75" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LƯỚI CHẤT LƯỢNG THEO NHÓM · CLOUD</text>
      <rect x="520" y="616" width="416" height="88" rx="6" fill="#ffffff" stroke="#bfc0c0" stroke-width="1"/>
      <text x="728" y="656" fill="#4f5d75" font-size="12" font-family="'Geist', sans-serif" text-anchor="middle">Trống</text>
      <text x="728" y="676" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">không có tên nhóm để xếp số theo nhóm</text>

      <text x="520" y="736" fill="#4f5d75" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.14em">HỆ QUẢ</text>
      <text x="520" y="760" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Lưới chất lượng theo nhóm trên cloud trống</text>
      <text x="520" y="780" fill="#4f5d75" font-size="12" font-family="'Geist', sans-serif">xem theo nhóm thu phải về máy thu</text>

      <text x="500" y="836" fill="#4f5d75" font-size="12" font-family="'Geist', sans-serif" text-anchor="middle">Cả hai nhánh: bảng thô, mã tin, bài gốc, mã nhóm, tên nguồn thật không rời máy thu</text>

      <line x1="48" y1="856" x2="952" y2="856" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
