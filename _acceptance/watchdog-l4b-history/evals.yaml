schema_version: 1
feature_slug: watchdog-l4b-history
evals:
  - id: E1
    criterion: AC-1
    executor: script
    cmd: config:executors.script.wdh_p1
    expected: "exit 0; 'P1 PASS'; should-NOT-fire: không kill vì 2 turn cũ; có WARN; marker đúng dạng; turn mới sau đó → KILL"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
