schema_version: 1
feature_slug: quyet-dinh-phai-cham-ung-vien
evals:
  - id: E1
    criterion: AC-1
    executor: test
    cmd: config:executors.test.hd9_route
    paths: [app/src/app/api/v1/ops/review/**, app/tests/the-duyet-du-can-cu.test.tsx]
    expected: "exit 0; ca 'HD9-AC-1' xanh: thẻ chờ không có ứng viên × 3 quyết định → 422, code khong-cham-ung-vien, so_dong 0, câu lỗi nêu cặp khoá; băm bốn bảng trước = sau; chiều đỏ: bản route bỏ kiểm số dòng → ca đỏ với thông điệp ghim 'HD9-AC-1: quyết định không chạm ứng viên mà route vẫn ghi'"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

