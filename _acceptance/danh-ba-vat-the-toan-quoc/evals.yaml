schema_version: 1
feature_slug: danh-ba-vat-the-toan-quoc
evals:
  - id: E1
    criterion: AC-1
    executor: test
    cmd: config:executors.test.da1_db
    paths: [db/migrations/088_iso_tinh.sql, pipeline/scripts/danh-ba-vat-the-iso.itest.mjs]
    expected: "exit 0; ca «DA1-AC-1» trên DB của riêng lượt (db/db-thu.sh oneinvest_suite_da1 --chay — chép máy thu, có PX1, CHƯA có 088) áp 088 trong giao dịch của ca: iso_regions có đúng 34 dòng; tập admin_code bằng tập mã của pipeline/data/dvhc/tinh.json đọc bằng docDanhBa (34 assert); bảng vàng RÚT BẰNG MÁY: nối pipeline/data/iso-3166-2-vn.json (bản chụp 63 mã ISO 3166-2:VN kèm ngày đọc và nguồn) với tinh.json theo tên đã chuẩn hoá (chuanTen), ngoại lệ có lý do duy nhất là Huế 46 → Thừa Thiên-Huế VN-26; mỗi tỉnh khớp đúng một mã cũ; bảng rút ra bằng bảng trong DB từng dòng (34 assert); iso_region không trùng; mọi areas market có admin_code 2 số có dòng. Chiều đỏ ghim: bản sao trong bộ nhớ của bản chụp ISO đổi tên Hưng Yên thì phép nối đỏ với «DA1-AC-1 33 không khớp tên ISO»; bản sao bảng DB đổi Huế thành VN-HU thì đỏ với «DA1-AC-1 46 lệch bảng vàng»."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E2
    criterion: AC-2
    executor: test
    cmd: config:executors.test.da1_db
    paths: [db/migrations/088_iso_tinh.sql, pipeline/scripts/danh-ba-vat-the-iso.itest.mjs]
    expected: "exit 0; ca «DA1-AC-2» sau khi áp 088 trong giao dịch: với MỖI iso_region của bảng (34 ô) chèn một toà khoá mới (moiKhoa) với upi = upiToa(iso, khoá) dưới một nút dự án có sẵn → được nhận (SAVEPOINT mỗi ô); ba ô âm mỗi ô một SAVEPOINT và ghim lỗi: iso VN-03 → vi phạm khoá ngoại iso_region; iso VN-99 → vi phạm khoá ngoại; upi mang VN-HN mà iso_region VN-SG → vi phạm buildings_upi_khop_khoa. Đối chứng: cùng ô VN-66 trên DB CHƯA áp 088 (giao dịch riêng) bị từ chối với «DA1-AC-2 082 còn khoá hai mã» — chứng ô dương thật do 088 mở."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
