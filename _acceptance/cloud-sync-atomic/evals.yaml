schema_version: 1
feature_slug: cloud-sync-atomic
evals:
  - id: E1
    criterion: AC-1
    executor: script
    cmd: config:executors.script.cloud_sync_atomic
    expected: "exit 0; in bảng số lần đọc theo pha (trước/staging/tráo-mở/sau) × trạng thái (cũ/mới/lẫn/0); PASS ≥5 lần đọc trong lúc giao dịch tráo mở (pg_stat_activity) đều 'cũ'; PASS 0 lần '0', 0 lần 'lẫn'; fixture: số dòng lượt cũ ≠ lượt mới ở mọi bảng + 2 view (kiểm trước khi chạy); chiều đỏ cùng fixture: PASS 'ĐỎ-ĐÚNG truncate' (bộ nạp kiểu cũ → thấy 0) và PASS 'ĐỎ-ĐÚNG non-atomic' (SQL tráo gửi từng câu tự COMMIT + móc thử → thấy 0 hoặc lẫn)"
    paths: [pipeline/sync-cloud.mjs, pipeline/scripts/check-cloud-sync.mjs, db/migrations/*_sync_stage.sql]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E2
    criterion: AC-2
    executor: script
    cmd: config:executors.script.cloud_sync_fail
    expected: "exit 0; PASS (a) gãy-staging: md5 không đổi, thông điệp nêu pha 'stage', 0 dòng staging của run_id; PASS (b) gãy-tráo (cột NOT NULL cấy vào bảng đích): md5 không đổi, thông điệp nêu pha 'swap', 0 dòng staging; PASS (c) chưa có sync_stage: thoát≠0, md5 không đổi, nhật ký exec không có câu CREATE/ALTER/DROP/TRUNCATE; PASS (d) kill -9 giữa pha nạp → lùi staged_at các dòng writer thật ghi về 3 giờ trước → lượt kế xoá chúng, còn dòng staging 10 phút tuổi của run khác còn nguyên; đối chứng: lượt lành sau cùng đổi md5 (thước không hằng-đúng)"
    paths: [pipeline/sync-cloud.mjs, pipeline/scripts/check-cloud-sync.mjs]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E3
    criterion: AC-3
    executor: script
    cmd: config:executors.script.cloud_sync_fidelity
    expected: "exit 0; PASS 21/21 bảng cùng số dòng + md5 cột gửi; PASS mọi cột date khớp min/max với local; chiều đỏ: đọc local bằng bộ phân tích kiểu mặc định node-pg → 'ĐỎ-ĐÚNG date'; PASS lệch-schema (i): xoá một cột trên cloud mô phỏng → lượt lành + WARN 'lệch schema' nêu đúng tên cột; PASS (ii): thêm cột generated + cột có mặc định trên cloud → lượt lành, cột ấy giữ giá trị cloud"
    paths: [pipeline/sync-cloud.mjs, pipeline/scripts/check-cloud-sync.mjs]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E4
    criterion: AC-4
    executor: script
    cmd: config:executors.script.cloud_sync_keep
    expected: "exit 0; PASS saved_markets trỏ area còn ở local còn nguyên, tổng số dòng saved_markets không đổi; PASS chặn tụt: local giả tụt (bảng areas của DB local mô phỏng còn 30%) → thoát≠0 trước tráo, md5 cloud + saved_markets không đổi, thông điệp 'tụt'; PASS area biến mất thật → theo đáp án Hỏi-3; chiều đỏ: bộ nạp TRUNCATE CASCADE kiểu cũ xoá dòng còn hợp lệ ('ĐỎ-ĐÚNG cascade')"
    paths: [pipeline/sync-cloud.mjs, pipeline/scripts/check-cloud-sync.mjs]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E5
    criterion: AC-5
    executor: script
    cmd: config:executors.script.cloud_sync_pii
    expected: "exit 0; PASS không dòng sync_stage.rows nào (bắt lúc giữa lượt) mang khoá seller_phone/seller_name/name(sellers)/seller_name(properties); đối chứng dương: payload sale_offers có khoá offer_id; chiều đỏ: bản sao sync-cloud bỏ seller_phone khỏi PII_EXCLUDE → thước bắt (thông điệp ghim 'ĐỎ-ĐÚNG pii')"
    paths: [pipeline/sync-cloud.mjs, pipeline/scripts/check-cloud-sync.mjs]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E6
    criterion: AC-6
    executor: script
    cmd: config:executors.script.cloud_sync_stage
    expected: "exit 0; migration 2 lần exit 0 trên DB có role anon/authenticated + ALTER DEFAULT PRIVILEGES cấp ALL cho hai role (bản sao số đo cloud) và trên DB không có hai role; PASS anon/authenticated không USAGE sync_stage, không SELECT sync_stage.rows; PASS catalog (pg_class/pg_namespace/ACL) ngoài sync_stage trước = sau; đối chứng dương: postgres ghi được sync_stage.rows; chiều đỏ: bản migration bỏ REVOKE → anon SELECT được ('ĐỎ-ĐÚNG acl')"
    paths: [db/migrations/*_sync_stage.sql, pipeline/scripts/check-cloud-sync.mjs]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E7
    criterion: AC-7
    executor: script
    cmd: config:executors.script.cloud_sync_overlap
    expected: "exit 0; hai lượt chạy chồng đều xong; PASS luồng đọc 0 lần '0'; PASS khớp local như E3; PASS 0 dòng staging còn lại; PASS lượt đọc local sớm hơn mà tráo sau bị từ chối với thông điệp 'cũ hơn lượt đã tráo', dữ liệu cloud là của lượt đọc muộn hơn"
    paths: [pipeline/sync-cloud.mjs, pipeline/scripts/check-cloud-sync.mjs]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E11
    criterion: AC-11
    executor: script
    cmd: config:executors.script.cloud_sync_allow
    expected: "exit 0; PASS payload sale_offers/sellers/properties chỉ gồm cột thuộc danh sách cho phép; PASS seller_ref trên cloud mô phỏng 100% khớp ^[0-9a-f]{32}$ và bằng left(sha256(seller_ref local),32); PASS danh sách cho phép ∩ danh sách loại = ∅; chiều đỏ: thêm cột giả vào bảng local (DB local mô phỏng) → cột không có trong payload + WARN 'cột chưa duyệt'; chèn một seller_ref thô lên cloud mô phỏng → leak gate đỏ ('ĐỎ-ĐÚNG seller_ref')"
    paths: [pipeline/sync-cloud.mjs, pipeline/scripts/check-cloud-sync.mjs]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E8a
    criterion: AC-8
    executor: test
    cmd: config:executors.test.pipeline
    expected: "exit 0; mọi test pipeline xanh, gồm sync-cloud.test.mjs mới (kế hoạch topo, chia mẻ, SQL tráo) và sync-pii*.test.mjs cũ"
    paths: [pipeline/**]
    evidence_required: [run_id, exit_code, verifier, verified_at]

  - id: E8b
    criterion: AC-8
    executor: script
    cmd: config:executors.script.sync_pii_mutation
    expected: "exit 0; M0 xanh, M1 đỏ, M2 đỏ (đột biến FILL vẫn bị bắt với sync-cloud mới)"
    paths: [pipeline/sync-cloud.mjs, pipeline/sync-pii.test.mjs]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E9
    criterion: AC-9
    executor: judgment
    question: "Bốn chỗ (AGENTS.md luật 6, .claude/rules/pii-spl.md, docs/adr/0007-collector-operating-principles.md, chú thích đầu pipeline/sync-cloud.mjs) có nói CÙNG một luật về sale_offers trên cloud không, và luật đó có khớp PII_EXCLUDE trong sync-cloud.mjs (cột nào bị loại) không? Luật có còn câu nào mâu thuẫn (vd 'sale_offers không sync cloud' trong khi code đẩy) không?"
    inputs: [AGENTS.md, .claude/rules/pii-spl.md, docs/adr/0007-collector-operating-principles.md, pipeline/sync-cloud.mjs, _acceptance/cloud-sync-atomic/contract.md, _acceptance/cloud-sync-atomic/decisions.jsonl]
    evidence_required: [judged_by, verdict, rationale]

  - id: E10
    criterion: AC-10
    executor: judgment
    question: "Hướng dẫn có cho Mạnh đủ để triển khai an toàn không: vì sao; thứ tự bắt buộc (Mạnh áp migration sync_stage lên cloud TRƯỚC khi merge); lệnh áp + lệnh kiểm (sync_stage có, anon không có quyền); cách chạy lượt thử có đo bằng cloud-sync-watch và đọc kết quả; cách lùi về bản cũ; hành vi của code mới khi cloud chưa có sync_stage (dừng, không đụng dữ liệu) — và không bước nào giao agent tự đổi schema production? SQL được trỏ có khớp lời hướng dẫn không?"
    inputs: [docs/ops/cloud-sync-atomic.md, pipeline/sync-cloud.mjs, _acceptance/cloud-sync-atomic/contract.md]
    evidence_required: [judged_by, verdict, rationale]
