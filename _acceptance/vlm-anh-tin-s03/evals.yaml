    expected: "exit 0; ca VLM-AC-3: máy chủ HTTP giả qua AI_GATEWAY_BASE_URL ghi thân yêu cầu thật của Haiku và DeepSeek, máy chủ giả qua MTPLX_URL ghi thân yêu cầu thật của Qwen; ma trận viết trước ba model; hai yêu cầu Gateway có zeroDataRetention và disallowPromptTraining đúng; yêu cầu DeepSeek có model deepseek/deepseek-v4.1-flash-1017 và only đúng baseten, đối chứng: yêu cầu Haiku không mang only baseten; dòng stg mồi có giá trị canh cho mỗi trường cấm và chữ bài canh; assert mỗi thân có đúng một ảnh base64 đúng byte tệp và không chứa từng giá trị canh; đối chứng dương cùng fixture: chuỗi gốc chứa đủ giá trị canh; ca chặn: chữ còn zdn.vn vào hàm gọi → số yêu cầu tới máy giả = 0, error_kind lo-url; ca VLM-AC-2b: bài hết ảnh → số yêu cầu = 0 và không có dòng nhãn."
