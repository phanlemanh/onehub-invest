    inputs: [docs/research/s03-vlm-anh-do.md]
    question: "Báo cáo có đủ số bài có nhãn ảnh trước và sau, tỉ lệ JSON hỏng, số lo-url, số dòng có giá và có từng trường thêm, số ảnh theo loại, số ảnh mang nhãn lộ nguồn, số ảnh khác nhau so với số lượt, thời gian thật, ước thời gian hết tập đọc, có gọi nguồn bằng mã S0x, và có tránh chép đoạn chữ của tin rao không?"
    expected: "Đủ chín mục số, mỗi số có lệnh tái lập; nguồn chỉ gọi bằng mã S0x; không có đoạn chữ của tin rao."
    evidence_required: [run_id, verifier, verified_at, output]
