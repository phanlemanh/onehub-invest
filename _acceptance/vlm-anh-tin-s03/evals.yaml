    expected: "exit 0; ca VLM-AC-1: ma trận viết trước 8 bài của AC-1, assert đủ 8 phần tử, ba bài chọn với lý do và ảnh đúng, năm bài còn lại bị loại kèm tên bài; đối chứng đỏ: đổi bài đủ cả ba thành thiếu giá thì danh sách chọn đổi đúng một phần tử."
