schema_version: 1
feature_slug: backfill-zalo-media-v3
evals:
  - id: E1
    criterion: AC-1
    executor: test
    cmd: config:executors.test.pipeline
    expected: "exit 0; 0 fail; ca 'mediaSnapshots nhận v2 và v3, bỏ v1, mồ côi và nguồn khác' (should-NOT-fire: v1/mồ côi/nguồn khác không được xét) và 'postsWithMedia đọc được bài có ảnh trong snapshot v3 (có meta.kev)' CHẠY và xanh"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E2
    criterion: AC-2
    executor: script
    cmd: config:executors.script.zalo_media_roundtrip
    expected: "exit 0; stdout có 'ROUNDTRIP PASS' và 'dọn: còn 0 dòng giả'; dòng đầu của --check có 'chưa nạp: 1 ' (đỏ trước khi nạp), sau backfill 'chưa nạp: 0 '"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E3
    criterion: AC-3
    executor: script
    cmd: config:executors.script.zalo_media_backfill
    expected: "exit 0; stdout in 'snapshot zalo-agent: N (v2+: M) · bài có ảnh trong raw v2+: K · chưa nạp: 0 · stg_zalo_posts có media_files: R'"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E4
    criterion: AC-4
    executor: test
    cmd: config:executors.test.pipeline
    expected: "exit 0; 0 fail; ca 'gọi qua symlink (như ~/dev/one-invest) main vẫn chạy — không thoát 0 im lặng' CHẠY và xanh (should-NOT-fire: không được thoát 0 khi thư mục snapshots không tồn tại)"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E5
    criterion: AC-5
    executor: script
    cmd: config:executors.script.zalo_media_v3_check
    expected: "exit 0; stdout có 'V3 CHECK PASS'; dòng --check của snapshot v3 có ảnh mang '(v2+: 1)' và 'chưa nạp: 1 ' (đỏ); should-NOT-fire: snapshot v3 không ảnh mang 'chưa nạp: 0 ' (xanh)"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E6
    criterion: AC-6
    executor: script
    cmd: config:executors.script.zalo_media_roundtrip
    expected: "exit 0; stdout có dòng 'ok: v3 có ảnh → --check đỏ; backfill → --check xanh, media_files mang snapshotId v3', 'ROUNDTRIP PASS' và 'dọn: còn 0 dòng giả'; trước backfill v3 dòng --check có 'chưa nạp: 1 ' (đỏ)"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
