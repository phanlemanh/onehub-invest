  - id: E8
    criterion: AC-8
    executor: script
    cmd: config:executors.script.zc1b_bad_text
    expected: "exit 0; stdout có 'BAD-TEXT PASS'; text null/số/object/thiếu đều 400 có error, không ném; lô hợp lệ sau đó 202 accepted 1; snapshot chỉ có 1 item"
