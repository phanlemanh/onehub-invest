schema_version: 1
feature_slug: kev-nhan-cung-hoa
evals:
  - id: E1
    criterion: AC-1
    executor: script
    cmd: config:executors.script.zc1b_media_junk
    expected: "exit 0; stdout có 'MEDIA-JUNK PASS'; lô có media chuỗi/null/object trả 202, accepted đủ 6 (gồm tin lành), flush ghi đủ 6 item, ingest không ném"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E2
    criterion: AC-2
    executor: script
    cmd: config:executors.script.zc1b_media_junk
    expected: "exit 0; tin có mảng media chứa null / số / chuỗi / phần tử thiếu url được nhận trong cùng lô 202"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E3
    criterion: AC-3
    executor: script
    cmd: config:executors.script.zc1b_payload_intact
