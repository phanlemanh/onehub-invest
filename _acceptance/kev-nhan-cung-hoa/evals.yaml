    executor: script
    cmd: config:executors.script.zc1b_legacy_id
    expected: "exit 0; stdout có 'LEGACY-ID PASS'; ' abc ', 'abc', tin chữ kèm ảnh có xuống dòng cuối đều mang id sha256(group|ts|text nguyên bản)[0:32]; should-NOT-fire: ' abc ' và 'abc' không gộp"
