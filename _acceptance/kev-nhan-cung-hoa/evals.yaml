    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E4
    criterion: AC-4
    executor: script
    cmd: config:executors.script.zc1b_dedup_norm
    expected: "exit 0; stdout có 'DEDUP-NORM PASS'; 4 biến thể (đảo thứ tự, khoảng trắng, ?/# thừa, thêm rác) đều duplicates 1"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E5
    criterion: AC-5
    executor: script
    cmd: config:executors.script.zc1b_dedup_norm
    expected: "exit 0; should-NOT-fire: khác một URL / thiếu một ảnh / query thật khác đều accepted 1, duplicates 0"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E6
