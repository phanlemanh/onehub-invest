    executor: script
    cmd: config:executors.script.zc1b_legacy_id
    expected: "exit 0; text toàn khoảng trắng + ảnh băm như tin chỉ ảnh; 2 sender khác → 2 id; gửi lại với khoảng trắng khác → duplicates 1"
