schema_version: 1
feature_slug: narrow-ask-rules
evals:
  - id: E1
    criterion: AC-1
    executor: script
    cmd: config:executors.script.ask_rules_static
    expected: "exit 0; dòng 'ok   ask chỉ còn sync-public + supabase db push' và ASK-RULES STATIC PASS"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E2
    criterion: AC-2
    executor: script
    cmd: config:executors.script.ask_rules_static
    expected: "exit 0; dòng 'ok   đủ 9 luật deny, kể cả git push --force / -f'"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E3
    criterion: AC-3
    executor: script
    cmd: config:executors.script.ask_rules_static
    expected: "exit 0; dòng 'ok   hook chỉ còn guard-edits + typecheck-changed' và 'ok   không còn tệp hook guard-push-deploy'"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E4
    criterion: AC-4
    executor: script
    cmd: config:executors.script.ask_rules_static
    expected: "exit 0; dòng 'ok   ui-lint chạy trên mọi PR (không lọc paths)'"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E5
    criterion: AC-5
    executor: script
    cmd: config:executors.script.ask_rules_static
    expected: "exit 0; dòng 'ok   AGENTS.md: làn merge dùng gh pr merge, không push thẳng main'"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E6
    criterion: AC-6
    executor: script
    cmd: config:executors.script.ask_rules_mutation
    expected: "should-NOT-fire: exit 0; 'bắt 7/7 bản đột biến' — mỗi bản cấu hình hỏng làm thước đo tĩnh đỏ"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E7
    criterion: AC-7
    executor: script
    cmd: config:executors.script.ask_rules_protection
    layer: backend-effect
    expected: "exit 0; 5 dòng ok (PR · gate + ui-lint · admin không vượt · cấm force-push · cấm xoá) và ASK-RULES PROTECTION PASS — đỏ khi Mạnh chưa bật protection"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E8
    criterion: AC-8
    executor: script
    cmd: config:executors.script.ask_rules_protection_selftest
    expected: "should-NOT-fire: exit 0; 'fixture đủ → xanh' và 'bắt 6/6 fixture thiếu'"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
