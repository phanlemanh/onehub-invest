schema_version: 1
slug: cham-bong-bo-sung-tin
evals:
  - id: E1
    criterion: AC-1
    executor: script
    layer: backend-effect
    cmd: bash _acceptance/cham-bong-bo-sung-tin/probes/cham.sh AC-1
    paths: [agent/src/enrich/cham-bong/**, agent/scripts/cham-bong-bo-sung-tin.ts, agent/tests/cham-bong-bo-sung-tin.test.ts]
    expected: "Trên DB của riêng lượt, tập viết trước 14 thẻ: 10 thẻ chờ với đề xuất chờ phủ đủ năm ô và hai nguồn E1/E2 (một thẻ ba đề xuất khác ô, một thẻ hai đề xuất cùng ô loại hình khác giá trị, một thẻ S05), 1 thẻ «Để sau» có đề xuất chờ, 1 thẻ chờ có đề xuất đã áp, 2 thẻ chờ không đề xuất. Model giả lập xác định. Ma trận viết tay: mỗi thẻ chờ còn đề xuất một assert «đúng 2 lời gọi, hai model khác nhau, cả hai trong MODEL_DUYET» (10 thẻ → 20 lời gọi); mỗi đề xuất chờ một assert «đúng hai kết quả» (13 đề xuất → 26 kết quả), hai đề xuất cùng ô có kết quả lấy từ cùng lần đọc; thẻ «Để sau», đề xuất đã áp và thẻ không đề xuất một assert «0 lời gọi, 0 kết quả». Mỗi kết quả có giá trị khác rỗng một assert có trích và căn cứ. Đột biến trong bản sao (đọc cả thẻ «Để sau»; một model đọc hai lần; gọi một lần mỗi đề xuất) đỏ, thông điệp nêu mã thẻ và số lời gọi."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E2
    criterion: AC-2
    executor: script
    layer: backend-effect
    cmd: bash _acceptance/cham-bong-bo-sung-tin/probes/cham.sh AC-2
    paths: [agent/src/enrich/cham-bong/**, agent/tests/cham-bong-bo-sung-tin.test.ts]
    expected: "Với mọi thẻ của tập E1, lời nhắc thật bộ dựng gửi tới model giả lập (bắt tại lớp gọi, không dựng lại trong test) chứa nguyên văn chữ bài gốc dài hơn 300 ký tự của thẻ cài sẵn bên trong khối có ranh giới cố định, và chứa tên các ô cần đọc. Phần lời nhắc ngoài khối bài không chứa giá trị đề xuất, tên model đề xuất, hay giá trị lần đọc kia (lần đọc đầu trả chuỗi canh «GIATRI_CANH_<thẻ>»). Thêm ba thẻ canh có giá trị đề xuất «DEXUAT_CANH_<thẻ>» không có trong bài: chuỗi canh vắng trên TOÀN BỘ lời nhắc. Mỗi kết quả có băm lời nhắc bằng băm tính lại từ lời nhắc đã bắt. Đối chứng dương: thẻ khop có giá trị đề xuất «2» nằm trong khối bài vẫn xanh. Đột biến chèn giá trị đề xuất vào lời nhắc đỏ, thông điệp nêu mã thẻ và chuỗi bị lộ; đột biến dùng chữ cắt 300 ký tự đỏ."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E3
    criterion: AC-3
    executor: script
    layer: backend-effect
    cmd: bash _acceptance/cham-bong-bo-sung-tin/probes/cham.sh AC-3
    paths: [agent/src/enrich/cham-bong/**, agent/tests/cham-bong-bo-sung-tin.test.ts]
    expected: "Ma trận viết tay 8 ca, mỗi ca một assert: trích có thật → giữ giá trị; trích không có trong bài → rỗng lý do trich-gia; trích chỉ khác hoa thường và khoảng trắng → giữ; loại hình trong từ vựng → giữ; loại hình ngoài từ vựng → rỗng ngoai-tu-vung; số WC «2» → giữ; số WC «2-3» → rỗng khong-phai-so; model trả rỗng → rỗng lý do khong-suy-ra. Đột biến bỏ kiểm trích đỏ, thông điệp nêu ca trich-gia."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E4
    criterion: AC-4
    executor: script
    layer: backend-effect
    cmd: bash _acceptance/cham-bong-bo-sung-tin/probes/cham.sh AC-4
    paths: [agent/src/enrich/cham-bong/**, agent/tests/cham-bong-bo-sung-tin.test.ts]
    expected: "Ma trận toàn phần viết trước: lần đọc 1 × lần đọc 2 trên {bằng đề xuất, khác đề xuất A, khác đề xuất B, rỗng} = 16 ô cặp đọc × có/không cờ lech_tren_the × có/không o_da_co = 64 assert, mỗi ô một kết cục viết tay (khop chỉ khi cả hai bằng đề xuất; bo_trong khi có rỗng; lech_hai_lan khi hai giá trị hợp lệ khác nhau, kể cả A/B; bac_dong_thuan khi hai bằng nhau khác đề xuất) và cờ ca biên viết tay. Lời gọi lỗi không sinh kết cục (một assert). So khoá: «02» với «2», «Căn hộ» với «căn hộ» là bằng. Đối chứng dương: 4 ô khop không cờ lech_tren_the không có cờ ca biên. Đột biến so chuỗi thô thay assertion_value_key đỏ, thông điệp nêu ô «02/2»; đột biến xếp A/B thành bac_dong_thuan đỏ; đột biến bỏ cờ lech_tren_the khỏi định nghĩa ca biên đỏ."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E5
    criterion: AC-5
    executor: script
    layer: backend-effect
    cmd: bash _acceptance/cham-bong-bo-sung-tin/probes/cham.sh AC-5
    paths: [agent/src/enrich/cham-bong/**, agent/scripts/cham-bong-bo-sung-tin.ts, agent/tests/cham-bong-bo-sung-tin.test.ts]
    expected: "Trên DB của riêng lượt với tập E1: băm trọn từng dòng của mọi bảng thường trong lược đồ public trừ ai_calls trước = sau ở năm lượt: chế độ thử trọn, chế độ áp trọn, chế độ áp với model giả lập ném lỗi ở thẻ thứ 3, chế độ áp dừng vì trần, chế độ thử dừng vì trần; ở chế độ thử băm ai_calls cũng bằng. Đối chứng dương trên cùng fixture: một UPDATE sale_offers.bathrooms và một INSERT field_assertions chạy ngoài bộ chạy làm thước đỏ, thông điệp nêu tên bảng đổi. Đột biến trong bản sao cho bộ chạy ở chế độ áp gọi apply_enrichment trên một đề xuất: đỏ, thông điệp nêu bảng đổi."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E6
    criterion: AC-6
    executor: script
    layer: backend-effect
    cmd: bash _acceptance/cham-bong-bo-sung-tin/probes/cham.sh AC-6
    paths: [agent/src/enrich/cham-bong/**, agent/scripts/cham-bong-bo-sung-tin.ts, agent/tests/cham-bong-bo-sung-tin.test.ts]
    expected: "Tập E1, model giả lập trả lỗi ở đúng 2 lời gọi: số dòng sổ gọi bằng số lời gọi (20), 18 ok và 2 lỗi có tên lớp lỗi, mỗi dòng viec cham-bong-bo-sung-tin, model có tiền tố đường, trace mang mã lượt. Chế độ thử: 20 dòng trong tệp sổ, 0 dòng thêm vào bảng ai_calls; chế độ áp: 20 dòng thêm vào bảng ai_calls, 0 dòng tệp. Đột biến bỏ ghi sổ khi lỗi đỏ, thông điệp nêu số dòng thiếu."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
