<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gốc log của audit</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Lora:ital,wght@0,400;1,400&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Lora', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1320px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.25;
      color: var(--color-ink);
      margin-bottom: 0.5rem;
    }
    .sub {
      font-size: 0.875rem;
      color: var(--color-muted);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 960px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Cổng Phạm vi · audit-all-doc-log-o-checkout · ON16</p>
    <h1>Gốc log: audit đọc pipeline/logs ở đâu</h1>
    <p class="sub">Luật gốc log (thay d-1, d-2) · Hỏi-1: khi không tìm được checkout chính, người đọc thấy gì · AC-1 · AC-3 · AC-4 · AC-5</p>

    <svg viewBox="0 72 1320 448" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect x="0" y="72" width="1320" height="448" fill="#f5f5f5"/>

      <!-- ===================== MŨI TÊN (vẽ trước) ===================== -->
      <!-- Hàng giữa -->
      <line x1="200" y1="240" x2="240" y2="240" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="416" y1="240" x2="456" y2="240" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Nhánh Có: đỉnh trên của nút quyết định → hàng trên -->
      <path d="M536,192 V144 Q536,136 544,136 H656" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="832" y1="136" x2="880" y2="136" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="1056" y1="136" x2="1104" y2="136" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Nhánh Không: đỉnh dưới → hàng dưới -->
      <path d="M536,288 V336 Q536,344 544,344 H656" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="832" y1="344" x2="880" y2="344" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="1056" y1="344" x2="1104" y2="344" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>

      <!-- ===================== NHÃN MŨI TÊN ===================== -->
      <rect x="496" y="156" width="28" height="16" rx="2" fill="#f5f5f5"/>
      <text x="520" y="168" fill="#4f5d75" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.06em">CÓ</text>

      <rect x="476" y="304" width="48" height="16" rx="2" fill="#f5f5f5"/>
      <text x="520" y="316" fill="#4f5d75" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.06em">KHÔNG</text>
      <text x="520" y="332" fill="#636b80" font-size="9" font-family="'Geist', sans-serif" text-anchor="end">git lỗi · kho trần</text>
      <text x="520" y="346" fill="#636b80" font-size="9" font-family="'Geist', sans-serif" text-anchor="end">checkout chính đã dời</text>

      <rect x="1060" y="320" width="40" height="16" rx="2" fill="#f5f5f5"/>
      <text x="1080" y="332" fill="#ba4513" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">TRỐNG</text>

      <!-- ===================== HÀNG GIỮA ===================== -->
      <!-- Điểm đầu -->
      <rect x="40" y="204" width="160" height="72" rx="20" fill="#f5f5f5"/>
      <rect x="40" y="204" width="160" height="72" rx="20" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="120" y="236" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Cây đang chạy</text>
      <text x="120" y="254" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">(worktree hoặc checkout chính)</text>

      <!-- Hỏi git -->
      <rect x="240" y="204" width="176" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="240" y="204" width="176" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="328" y="230" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Hỏi git: thư mục</text>
      <text x="328" y="246" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">git chung</text>
      <text x="328" y="264" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">rev-parse --git-common-dir</text>

      <!-- Nút quyết định (luật gốc log) -->
      <polygon points="536,192 616,240 536,288 456,240" fill="#f5f5f5"/>
      <polygon points="536,192 616,240 536,288 456,240" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4"/>
      <text x="536" y="236" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Tên <tspan font-family="'Geist Mono', monospace" font-weight="500">.git</tspan> và</text>
      <text x="536" y="252" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">còn tồn tại?</text>

      <!-- ===================== HÀNG TRÊN · CÓ ===================== -->
      <rect x="656" y="100" width="176" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="656" y="100" width="176" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="744" y="126" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Gốc log =</text>
      <text x="744" y="142" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">checkout chính</text>
      <text x="744" y="160" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">&lt;X&gt; của &lt;X&gt;/.git</text>

      <rect x="880" y="100" width="176" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="880" y="100" width="176" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="968" y="132" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Đọc <tspan font-family="'Geist Mono', monospace" font-weight="500">pipeline/logs</tspan></text>
      <text x="968" y="148" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">ở checkout chính</text>

      <rect x="1104" y="100" width="176" height="72" rx="20" fill="#f5f5f5"/>
      <rect x="1104" y="100" width="176" height="72" rx="20" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="1192" y="132" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Audit / trang Ops</text>
      <text x="1192" y="148" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">hiện số thật</text>

      <!-- ===================== HÀNG DƯỚI · KHÔNG ===================== -->
      <rect x="656" y="308" width="176" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="656" y="308" width="176" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="744" y="340" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Gốc log = chính cây</text>
      <text x="744" y="358" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">giữ hành vi cũ, không lỗi</text>

      <rect x="880" y="308" width="176" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="880" y="308" width="176" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="968" y="340" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Log trống?</text>
      <text x="968" y="358" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">pipeline/logs của cây</text>

      <!-- Kết quả Hỏi-1 (khuyến nghị) -->
      <rect x="1104" y="308" width="176" height="72" rx="20" fill="#f5f5f5"/>
      <rect x="1104" y="308" width="176" height="72" rx="20" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4"/>
      <text x="1192" y="332" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Dòng LIMITED ghi</text>
      <text x="1192" y="348" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">đường đã đọc</text>
      <text x="1192" y="366" fill="#ba4513" font-size="9" font-weight="500" font-family="'Geist', sans-serif" text-anchor="middle">(Hỏi-1, khuyến nghị)</text>
      <text x="1192" y="400" fill="#636b80" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">«… trống — đọc &lt;đường&gt;»</text>

      <!-- ===================== GHI CHÚ ===================== -->
      <text x="40" y="436" fill="#4f5d75" font-size="14" font-style="italic" font-family="'Instrument Serif', 'Lora', serif">Ở checkout chính, thư mục git chung là <tspan font-family="'Geist Mono', monospace" font-style="normal" font-size="12">&lt;cây&gt;/.git</tspan> nên gốc log trùng cây.</text>
      <text x="1280" y="436" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.06em">AC-1 · AC-3 · AC-4 · AC-5</text>

      <!-- ===================== CHÚ GIẢI ===================== -->
      <line x1="40" y1="460" x2="1280" y2="460" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="480" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.18em">CHÚ GIẢI</text>

      <rect x="40" y="492" width="24" height="16" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="72" y="504" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Điểm đầu / kết quả</text>

      <rect x="196" y="492" width="24" height="16" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="228" y="504" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Bước</text>

      <polygon points="300,492 312,500 300,508 288,500" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
      <text x="320" y="504" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Luật gốc log (thay d-1, d-2)</text>

      <rect x="484" y="492" width="24" height="16" rx="8" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
      <text x="516" y="504" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Hỏi-1 — lối khuyến nghị, chờ Mạnh chọn</text>
    </svg>
  </div>
</body>
</html>
