    paths: [app/src/lib/deals.ts, app/src/app/ops/deals/**, _acceptance/can-cung-tieu-chi-toan-tap/probes/*]
    expected: "Trên DB máy thu, chỉ đọc, mọi câu trong MỘT snapshot REPEATABLE READ READ ONLY (tiến trình con nhận mã snapshot): gọi đúng hàm đọc của màn; 15/15 dòng đầu Giá tốt cấp dự án; số bốn tab và số dự án 1 bằng lệnh đếm độc lập; đi hết các trang được đúng tong mã phân biệt; số cùng tiêu chí mọi dòng trang 1 cỡ 15, 50 bằng lệnh đếm độc lập. Hai thời gian đo riêng sau các phép so, mỗi số ba lần, ghi tải máy: thời gian tới khi /ops/deals trả HTML xong (trung vị dưới 3 giây) và thời gian action cùng tiêu chí trên căn thuê có nhiều căn cùng tiêu chí nhất (trung vị dưới 1,5 giây). Đối chứng --doi-chung-trong-trang (đếm trong trang) ra số dòng hiện 0 như hôm nay và thoát khác 0."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
