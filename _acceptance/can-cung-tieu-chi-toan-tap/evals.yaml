    executor: ui-check
    layer: ui-observed
    paths: [app/src/lib/deals.ts, app/src/app/ops/deals/**, app/src/components/ops/deals-grid.tsx, app/src/components/ops/deal-sheet.tsx, app/src/components/ops/deal-similar.tsx]
    steps:
      - "Bản chạy: dev server của worktree này trên cổng 3461, DB máy thu chỉ đọc; đăng nhập vai quản trị. KHÔNG tạo hay sửa tệp nào trong cây ngoài evidence/. Trước khi chụp che SĐT, tên người bán, ảnh tin và email đăng nhập."
      - "Mở /ops/deals ở 1280 px sáng → evidence/E10-step1.png (15/15 dòng đầu ghi «Giá tốt» và tên dự án; chân bảng 1–15 / tong)"
      - "Bấm dòng 1, mở tab «Căn cùng tiêu chí» → evidence/E10-step2.png (số trên nhãn tab khác 0 khi lệnh đếm khác 0; bảng có căn; câu «Hiện 20 / N» khi N > 20)"
      - "Chọn Vinhomes Ocean Park 1 trên bộ chọn vị trí → evidence/E10-step3.png (tab Tất cả khớp lệnh đếm với mã 1; URL có project=1)"
      - "Cùng màn ở chế độ tối → evidence/E10-step4.png; khổ 390 px → evidence/E10-step5.png (trang không cuộn ngang)"
      - "Đăng nhập tài khoản thử vai Người xem, mở /ops/deals, mở sheet dòng 1 tab «Căn cùng tiêu chí» → evidence/E10-step6.png (không cột Gọi ai, không ảnh tin)"
    expected: "Sáu khung trên bản chạy: căn Giá tốt cấp dự án đứng đầu, tab cùng tiêu chí đếm trên toàn tập, số khớp lệnh đếm khi không lọc và khi lọc một dự án, đọc được ở sáng, tối, 390 px, vai Người xem không thấy liên hệ."
