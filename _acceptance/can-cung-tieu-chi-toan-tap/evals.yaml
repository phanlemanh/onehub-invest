schema_version: 1
slug: can-cung-tieu-chi-toan-tap
evals:
  - id: E1
    criterion: AC-1
    executor: script
    layer: backend-effect
    cmd: bash _acceptance/can-cung-tieu-chi-toan-tap/probes/doc.sh AC-1
    paths: [app/src/lib/deals.ts, app/src/lib/deals-chi-tiet.ts, app/tests/can-cung-tieu-chi*]
    expected: "Trên DB của riêng lượt, tập viết trước 37 căn (căn cùng tiêu chí ở trang 2 và 3, căn ở đúng 75% và 125% diện tích, căn ở 74% và 126%, hai phường trùng tên khác mã, một căn hai tin, một ứng viên không diện tích và một ứng viên chưa rõ loại hình cùng phường): ma trận viết tay mỗi dòng trang 1 × cỡ 15, 50 một assert, số trong trang.cungTieuChi bằng số viết tay. Đối chứng dương cùng fixture: căn ở 125% có mặt; ứng viên thiếu trường không được tính, có assert riêng. Đột biến trong bản sao (đếm trong trang thay vì toàn tập; so tên phường thay mã; loại theo mã tin thay can_key) đỏ, thông điệp nêu mã căn lệch và số mong đợi."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E2
    criterion: AC-2
    executor: script
    layer: backend-effect
    cmd: bash _acceptance/can-cung-tieu-chi-toan-tap/probes/doc.sh AC-2
    paths: [app/src/lib/deals.ts, app/src/lib/deals-chi-tiet.ts, app/src/app/ops/deals/**, app/src/components/ops/deal-similar.tsx, app/tests/can-cung-tieu-chi*]
    expected: "Căn có 27 căn cùng tiêu chí trải ba trang, trong đó một căn hai tin nằm trong top 20 và hai căn bằng mức giảm ở vị trí 20, 21: action trả tong 27 và đúng 20 mã căn phân biệt viết tay theo thứ tự (không xác minh trước, giảm nhiều trước, mã căn), mỗi mã một assert thoả tiêu chí; HTML dựng thật của tab có «Hiện 20 / 27 căn cùng tiêu chí» và nhãn tab ghi 27. Đối chứng: căn có 5 căn thì không có câu «Hiện 20». Đột biến bỏ sắp xác minh-cuối đỏ, thông điệp nêu vị trí lệch đầu tiên; đột biến khử trùng theo mã tin đỏ, thông điệp nêu căn lặp."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E3
    criterion: AC-3
    executor: script
    layer: backend-effect
    cmd: bash _acceptance/can-cung-tieu-chi-toan-tap/probes/doc.sh AC-3
    paths: [app/src/lib/deals.ts, app/src/lib/deals-chi-tiet.ts, app/src/app/ops/deals/**, app/src/components/ops/deal-similar.tsx, app/src/components/ops/deal-sheet.tsx, app/tests/can-cung-tieu-chi*]
    expected: "Bốn căn viết trước: (a) 0 cùng tiêu chí, 6 cùng phường; (b) 4 cùng tiêu chí, 9 cùng phường; (c) 0 và 0; (d) 27 cùng phường trải ba trang. Mỗi căn một assert: số và mã của «Xem mọi căn trong phường» bằng danh sách viết tay; HTML (a) có «Chưa có căn nào cùng tiêu chí» và nút ghi 6; (b) không có chữ trống, nút ghi 9; (c) chữ trống, không nút; (d) action trả tong 27 và đúng 20 mã viết tay, HTML có «Hiện 20 / 27 căn». Đột biến hiện trạng thái trống theo danh sách trong trang đỏ; đột biến trả đủ danh sách theo phường đỏ, thông điệp nêu số dòng trả về."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
