schema_version: 1
feature_slug: s06-vung-moi-len-canonical
evals:
  - id: E1
    criterion: AC-1
    executor: script
    cmd: config:executors.script.svm_mig
    paths: [db/migrations/064_ma_thi_truong_ngan.sql, scripts/s06-vung-moi/acceptance.mjs]
    expected: "exit 0; dòng cuối 'MIG PASS'; trên bản chép DB máy thu: trước 34 thị trường (32 mã dài), sau 34 (0 mã dài, 32 mã vn-<x> khớp danh sách tính trước từ mã dài), tên/polygon/meta từng mã bằng trước (so băm), area_sources trỏ mã dài 38 → 0 và trỏ mã mới 38; một dòng area_breakdowns và một dòng data_level_snapshot cài trước trỏ mã dài cũng sang mã mới; lần áp hai đếm 0 dòng đổi. Chiều đỏ ghim: bỏ dòng UPDATE area_sources khỏi bản chép migration → 'area_sources còn 38 mã dài'"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E2
    criterion: AC-2
    executor: script
    cmd: config:executors.script.svm_rao
    paths: [db/migrations/064_ma_thi_truong_ngan.sql, scripts/s06-vung-moi/acceptance.mjs]
    expected: "exit 0; 'RAO PASS'; ma trận viết trước 8 ca = 7 bảng khoá ngoại (properties, areas.parent_id, listing_records, market_asset_stats, market_metrics, sale_offer_records, saved_markets) + 1 va chạm mã ngắn: mỗi ca migration lỗi với thông điệp chứa đúng tên bảng (hay mã va chạm) và số mã dài trước = sau (34 thị trường, 32 mã dài); đối chứng dương cùng bản chép: không cài ca nào → áp được"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E3
    criterion: AC-3
    executor: test
    cmd: config:executors.test.svm_unit
    paths: [pipeline/lib/thi-truong.mjs, pipeline/lib/thi-truong.test.mjs, pipeline/reassign-areas.mjs, pipeline/transform-chotot.mjs]
    expected: "exit 0; fail 0; ma trận viết trước: 4 khoá bộ thu + 2 mã thị trường + 4 mã tỉnh sáp nhập → đúng mã, 3 mã lạ (rỗng, null, vn-xyz) → null; khoá module ⊂ id trong collector/src/config/cities.ts (đọc tệp thật); quét hai tệp reassign-areas.mjs, transform-chotot.mjs (bỏ chú thích): 0 chuỗi khớp /vn-[a-z-]+/ hay khoá bộ thu nào; ca quan hệ: thêm khoá giả vào bản chép module → tập thành phố mà hai bước tính ra có khoá đó; đối chứng dương: chèn 'vn-da-nang' cứng vào bản chép transform → quét đỏ ghim tên tệp; phía transform đo bằng hành vi ở E6 (bản chép module thêm mã tỉnh giả → tin mang mã đó ra phường ĐN, module gốc → mã lạ)"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E4
    criterion: AC-4
    executor: script
    cmd: config:executors.script.svm_reassign
    paths: [pipeline/reassign-areas.mjs, pipeline/lib/thi-truong.mjs, scripts/s06-vung-moi/acceptance.mjs]
    expected: "exit 0; 'REASSIGN PASS'; bản chép DB đã áp 064 + snapshot phường giả danang (polygon nằm trong polygon vn-da-nang): reassign không đối số upsert đúng các phường giả dưới vn-da-nang, id vn-da-nang-<slug>; tập id phường vn-hanoi, vn-hcmc trước = sau (so tập, không chỉ đếm); snapshot giả dựng đúng khuôn tên thư mục collector (<city.id>__osm-boundaries__<ts>, city.id đọc từ cities.ts) và nạp qua importer thật vào stg_osm_boundaries; khoá haiphong không có snapshot → đúng một dòng gọi tên 'haiphong'"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E5
    criterion: AC-5
    executor: script
    cmd: config:executors.script.svm_reassign
    paths: [pipeline/reassign-areas.mjs, pipeline/lib/thi-truong.mjs, scripts/s06-vung-moi/acceptance.mjs]
    expected: "exit 0; ca chưa áp 064 trên bản chép riêng: dòng nêu 'danang' + 'vn-da-nang' thiếu, 0 thị trường mới được chèn (34 trước = 34 sau, không có vn-da-nang), số phường upsert của Hà Nội và TP.HCM đọc từ dòng log đều > 0"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E6
    criterion: AC-6
    executor: script
    cmd: config:executors.script.svm_transform
    paths: [pipeline/transform-chotot.mjs, pipeline/lib/thi-truong.mjs, scripts/s06-vung-moi/acceptance.mjs]
    expected: "exit 0; 'TRANSFORM PASS'; bản chép DB đã áp 064 + phường giả ĐN: tin stg city_code vn-da-nang và vn-binh-duong (phường thật TP.HCM) có ward_name_v3 khớp → area_id đúng phường, confidence high; bảng (offer_id → area_id) của tin vn-hanoi, vn-hcmc chạy bằng transform của main và của nhánh trên cùng bản chép giống hệt từng dòng; quan hệ AC-3: transform chạy với bản chép module thêm SAP_NHAP vn-tinh-thu-gia → vn-da-nang xếp tin mã đó vào vn-da-nang-thu-hai, transform với module gốc để tin đó NULL và in 'city_code lạ: vn-tinh-thu-gia (1 tin)'"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E7
    criterion: AC-7
    executor: script
    cmd: config:executors.script.svm_transform
    paths: [pipeline/transform-chotot.mjs, scripts/s06-vung-moi/acceptance.mjs]
    expected: "exit 0; tin stg city_code vn-xyz-thu → vào sale_offer_records với area_id NULL, transform thoát 0, output có đúng một dòng 'city_code lạ: vn-xyz-thu' kèm số tin; không cài tin lạ → không có dòng nào (should-NOT-fire)"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E8
