    paths: [pipeline/transform-chotot.mjs, pipeline/reassign-areas.mjs, db/migrations/064_ma_thi_truong_ngan.sql, scripts/s06-vung-moi/acceptance.mjs]
    expected: "exit 0; 'REAL PASS'; bản chép DB máy thu có ranh giới S04 Đà Nẵng thật: tỉ lệ tin bán S06 sống của vn-da-nang có phường ≥ 80%, mẫu số = tin bán S06 sống có city_code ánh xạ ra vn-da-nang (in kèm số tin area_id NULL); đối chứng đỏ trên cùng bản chép: xoá area_id của 30% tin Đà Nẵng → thước đỏ, in tỉ lệ < 80%; tỉ lệ của vn-hanoi, vn-hcmc sau ≥ trước; in bảng thị trường × (sống, có phường, %); Hải Phòng đo cùng bảng khi có ranh giới, vắng thì in 'vn-hai-phong: chưa có ranh giới S04'"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
