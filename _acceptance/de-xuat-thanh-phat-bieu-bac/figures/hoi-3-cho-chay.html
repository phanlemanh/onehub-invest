<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hỏi-3 chỗ chạy</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Lora:ital,wght@0,400;1,400&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Lora', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1040px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.25;
      color: var(--color-ink);
      margin-bottom: 0.5rem;
    }
    .sub {
      font-size: 0.875rem;
      color: var(--color-muted);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Cổng Phạm vi · de-xuat-thanh-phat-bieu-bac · hoi-3-cho-chay</p>
    <h1>Hỏi-3: chỗ chạy phân bố — bước cuối cloud-sync 15′ hay sau resolve-properties</h1>
    <p class="sub">AC-9 · hai nhánh, nhánh tô cam là nhánh máy khuyên</p>

    <svg viewBox="0 0 1000 488" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- ============ Khung nhánh (nền, vẽ trước) ============ -->
      <!-- Nhánh A: khung nhấn duy nhất -->
      <rect x="232" y="24" width="752" height="160" rx="8" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4"/>
      <text x="248" y="44" fill="#ba4513" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.14em">NHÁNH A · MÁY KHUYÊN</text>
      <!-- Nhánh B -->
      <rect x="232" y="216" width="752" height="160" rx="8" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="248" y="236" fill="#4f5d75" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.14em">NHÁNH B</text>

      <!-- ============ Mũi tên (vẽ trước nút) ============ -->
      <!-- Gốc → A1 (y=112) -->
      <line x1="200" y1="112" x2="248" y2="112" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <!-- Gốc → B1 (y=304) -->
      <line x1="200" y1="304" x2="248" y2="304" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Trong nhánh A -->
      <line x1="472" y1="112" x2="496" y2="112" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <line x1="720" y1="112" x2="744" y2="112" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <!-- Trong nhánh B -->
      <line x1="472" y1="304" x2="496" y2="304" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="720" y1="304" x2="744" y2="304" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>


      <!-- ============ Gốc: câu hỏi ============ -->
      <rect x="24" y="80" width="176" height="256" rx="6" fill="#f5f5f5"/>
      <rect x="24" y="80" width="176" height="256" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="112" y="104" fill="#4f5d75" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">HỎI-3 · AC-9</text>
      <text x="112" y="204" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Phân bố bậc</text>
      <text x="112" y="224" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">chạy ở đâu?</text>

      <!-- ============ Nhánh A ============ -->
      <rect x="248" y="56" width="224" height="112" rx="6" fill="#f5f5f5"/>
      <rect x="248" y="56" width="224" height="112" rx="6" fill="#ffffff" stroke="#eb6c36" stroke-width="1"/>
      <text x="264" y="76" fill="#4f5d75" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.14em">CHỖ CHẠY</text>
      <text x="264" y="110" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Bước cuối <tspan font-family="'Geist Mono', monospace">cloud-sync</tspan> (15′),</text>
      <text x="264" y="130" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">sau <tspan font-family="'Geist Mono', monospace">push-ops-facts</tspan></text>
      <rect x="496" y="56" width="224" height="112" rx="6" fill="#f5f5f5"/>
      <rect x="496" y="56" width="224" height="112" rx="6" fill="#ffffff" stroke="#eb6c36" stroke-width="1"/>
      <text x="512" y="76" fill="#4f5d75" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.14em">HỆ QUẢ</text>
      <text x="512" y="120" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif">phân bố luôn tươi</text>
      <rect x="744" y="56" width="224" height="112" rx="6" fill="#f5f5f5"/>
      <rect x="744" y="56" width="224" height="112" rx="6" fill="#ffffff" stroke="#eb6c36" stroke-width="1"/>
      <text x="760" y="76" fill="#4f5d75" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.14em">ĐÁNH ĐỔI</text>
      <text x="760" y="100" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif">dòng kiểm fail vẫn thoát 0</text>
      <text x="760" y="120" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif">— nhịp tim <tspan font-family="'Geist Mono', monospace">/ops</tspan></text>
      <text x="760" y="140" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif">không đỏ oan</text>

      <!-- ============ Nhánh B ============ -->
      <rect x="248" y="248" width="224" height="112" rx="6" fill="#f5f5f5"/>
      <rect x="248" y="248" width="224" height="112" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.40)" stroke-width="1"/>
      <text x="264" y="268" fill="#4f5d75" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.14em">CHỖ CHẠY</text>
      <text x="264" y="292" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Sau <tspan font-family="'Geist Mono', monospace">resolve-properties</tspan></text>
      <text x="264" y="312" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">trong <tspan font-family="'Geist Mono', monospace">chotot-daily</tspan></text>
      <text x="264" y="332" fill="#4f5d75" font-size="12" font-family="'Geist', sans-serif">(mỗi đêm)</text>
      <rect x="496" y="248" width="224" height="112" rx="6" fill="#f5f5f5"/>
      <rect x="496" y="248" width="224" height="112" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.40)" stroke-width="1"/>
      <text x="512" y="268" fill="#4f5d75" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.14em">HỆ QUẢ</text>
      <text x="512" y="312" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif">tách khỏi nhịp tim <tspan font-family="'Geist Mono', monospace">/ops</tspan></text>
      <rect x="744" y="248" width="224" height="112" rx="6" fill="#f5f5f5"/>
      <rect x="744" y="248" width="224" height="112" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.40)" stroke-width="1"/>
      <text x="760" y="268" fill="#4f5d75" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.14em">ĐÁNH ĐỔI</text>
      <text x="760" y="292" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif">phân bố tươi một lần/đêm;</text>
      <text x="760" y="312" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif">sửa dãy bước đã ký</text>
      <text x="760" y="332" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif">của job đêm</text>

      <!-- ============ Chú giải ============ -->
      <line x1="24" y1="408" x2="984" y2="408" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <text x="24" y="432" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.18em">CHÚ GIẢI</text>
      <rect x="24" y="444" width="24" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="56" y="454" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Câu hỏi chờ ký</text>
      <rect x="216" y="444" width="24" height="12" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4"/>
      <text x="248" y="454" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Nhánh máy khuyên</text>
      <rect x="396" y="444" width="24" height="12" rx="2" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="428" y="454" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Nhánh còn lại</text>
    </svg>
  </div>
</body>
</html>
