      - "Chọn Vinhomes Ocean Park 1 trên bộ chọn vị trí, không gõ đường dẫn → evidence/E10-step2.png (tab Tất cả khớp lệnh đo với mã 1; URL có project=1)"
      - "Cùng màn ở chế độ tối → evidence/E10-step3.png (đọc được, nhãn hạng rõ)"
      - "Khổ 390 px → evidence/E10-step4.png (trang không cuộn ngang, nhãn hạng nằm dưới tên căn)"
      - "Đăng nhập tài khoản thử vai Người xem, mở /ops/deals ở 1280 px → evidence/E10-step5.png (không có cột Gọi ai, không ảnh tin)"
