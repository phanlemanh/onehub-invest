    long_running: 8
    expected: "exit 0; '✔ SLT-DC-KHOA hết trần thật (node:test tự huỷ, v<…>) → 33033 rảnh trong 8 s' kèm 'SLT-DC-KHOA hết trần thật: 33033 rảnh sau <x> s'; '✔ chiều đỏ SLT-DC-KHOA hết trần thật: không truyền signal'; '✔ SLT-DC-KHOA lưới máy chủ' kèm 'trần 480 s → transaction_timeout 510s' và 'trần 60 s → transaction_timeout 90s'; '✔ SLT-DC-KHOA huỷ signal của ca → khoá 33033 rảnh trong 5 s'; '✔ chiều đỏ SLT-DC-KHOA: không truyền signal'; should-NOT-fire: '✖ SLT-DC-KHOA'"
  - id: E5
