schema_version: 1
feature_slug: slt-dc-cham-va-giu-khoa-33033
# Ca «TR-AC-n» ở pipeline/scripts/assert-rut-thay.test.mjs; ca «SLT-DC-KHOA» và trần ca ở
# pipeline/scripts/transform-zalo-loai-tin-doi-chieu.test.mjs. Mọi lệnh DB chạy trên DB của riêng lượt (db/db-thu.sh --chay).
evals:
  - id: E1
    criterion: AC-1
    executor: test
    cmd: config:executors.test.trt_db
    paths: [pipeline/lib/assert.mjs, pipeline/scripts/assert-rut-thay.test.mjs]
    expected: "exit 0; '✔ TR-AC-1 bảy ca biên: tập id rút trùng câu cũ; mảng rỗng không chạy câu nào'; '✔ TR-AC-1 đối chứng dương: ca một rút đúng 1 dòng (bedrooms=4 parser), ca «chỉ ở bảng» rút 0'; '✔ chiều đỏ TR-AC-1: bản phá `<> ALL` → `= ANY`'; '✔ chiều đỏ TR-AC-1: bản phá bỏ điều kiện phương pháp'; should-NOT-fire: '✖ TR-AC-1'"
  - id: E2
    criterion: AC-2
    executor: script
    cmd: config:executors.script.trt_tuong_duong
    paths: [pipeline/lib/assert.mjs, _acceptance/slt-dc-cham-va-giu-khoa-33033/probes/tuong-duong-ba-luot.mjs]
    long_running: 15
    expected: "exit 0; ≥ 5 dòng 'lần gọi <k> (<nguồn>): mảng <n> · cũ rút <a> · mới rút <a> · nhiễu: cũ <b> mới <b> · lệch 0 · câu mới <x> s' gồm ba dòng 'S03 suy loại', một 'S06 transform-chotot', một 'S05 transform-fb', mỗi x < 60; cuối 'TUONG DUONG OK — <k> lần gọi, rút thật <a> id, rút nhiễu <b> id, lệch 0' với b > 0; should-NOT-fire: 'LECH'"
  - id: E3
    criterion: AC-3
    executor: test
    cmd: config:executors.test.trt_db
    paths: [pipeline/lib/assert.mjs, pipeline/scripts/assert-rut-thay.test.mjs]
    expected: "exit 0; ba dòng '✔ TR-AC-3 n=10|n=1000|n=200000: ép nested loop và ép hash đều không Anti Join, dưới 30 s, rút đúng 5%' kèm dòng số 'TR-AC-3 n=200000: ép nested loop <x> s · ép hash <y> s'; '✔ chiều đỏ TR-AC-3: câu cũ ép nested loop ở n=200000'; should-NOT-fire: 'TR-AC-3 quá trần', '✖ TR-AC-3'"
