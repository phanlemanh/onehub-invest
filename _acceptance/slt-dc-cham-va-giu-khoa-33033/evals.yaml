    expected: "tự kiểm 'log có bước 400 s đỏ «LAT»'; 'SAN XUAT OK — bốn bước … · trung vị ≤ 123 s'; should-NOT-fire: 'SAN XUAT DO', 'LAT'"
  - id: E8
    criterion: AC-8
    executor: script
    cmd: config:executors.script.trt_pham_vi
    paths: ["**"]
    expected: "exit 0; 'tự kiểm: app/src/app/page.tsx → NGOAI PHAM VI'; mỗi tệp 'ok'; cuối 'PHAM-VI OK'; should-NOT-fire: 'NGOAI PHAM VI pipeline', 'TU KIEM HONG'"
