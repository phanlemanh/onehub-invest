  - id: E10
    criterion: AC-9
    executor: ui-check
    layer: ui-observed
    paths: [app/src/components/ops/people/**, app/src/app/ops/people/**, app/src/app/ops/deals/**, app/src/components/ops/deal-card.tsx]
    steps:
      - "Bản chạy: dev server của worktree dãy U1 ở http://localhost:3460 (cấu hình app-3460 của .claude/launch.json phải trỏ worktree), DB máy thu :5433 có danh bạ thật, đăng nhập tài khoản thử vai Vận hành (node scripts/dev-ops-account.mjs --vai ops; đọc .claude/ops-role-test-account.json, không in mật khẩu). Không chép số thật vào báo cáo."
      - "1280 px sáng: /ops/people lọc S03 → evidence/E10-step1.png; gõ một số vào ô tìm → evidence/E10-step2.png"
      - "1280 px tối: bấm mã người có số → evidence/E10-step3.png"
      - "1280 px sáng: /ops/deals → evidence/E10-step4.png"
      - "390 px sáng: ba màn trên → evidence/E10-step5.png, E10-step6.png, E10-step7.png; ghi document.documentElement.scrollWidth và clientWidth từng màn; ở /ops/people ghi getBoundingClientRect của liên kết số đầu tiên khi chưa cuộn"
      - "Gõ qua ô tìm thật ở dạng +84… và dạng có dấu tách của cùng một số → evidence/E10-step8.png; báo cáo không chép số thật"
    expected: "Số đọc được ở sáng và tối; liên kết gọi có href tel:+84…, bấm được; scrollWidth = clientWidth ở 390 px; ở 390 px liên kết số đầu tiên nằm trọn trong khung nhìn khi chưa cuộn ngang; gõ hai dạng qua ô tìm thật đều ra đúng một hàng mang số đó; /ops/deals có khối liên hệ và không có ảnh vỡ."
    evidence_required: [run_id, screenshot, observed, verifier, verified_at]
