      - "BASE_URL=http://localhost:3460 node _acceptance/people-hien-so-goc/probes/html-vai.mjs → ghi nguyên đầu ra vào evidence/E12-output.txt (đầu ra chỉ có số khớp từng vai từng trang, không có số điện thoại)."
    expected: "Thoát 0; vai viewer 0 chuỗi khớp SĐT ở cả HTML và payload RSC (header RSC: 1) của mọi trang /ops/people, /ops/people/<khoá có số>, /ops/deals và /ops/people?q= đủ sáu dạng của một số thật; vai ops và admin ≥ 1 ở cả ba trang; /ops/deals không có tin mang số thì thoát khác 0; đối chứng dương: cùng bộ đếm trên vai ops với q đó > 0."
    evidence_required: [run_id, screenshot, observed, verifier, verified_at]
  - id: E13
