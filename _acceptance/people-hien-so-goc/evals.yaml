schema_version: 1
feature_slug: people-hien-so-goc
# Ca «SHS-AC-n» thêm vào app/tests/danh-ba-nguoi-tren-ops.test.tsx (cùng lược đồ tạm, page thật với getSessionUser giả).
# Số trong test là số bịa. Mỗi phép đo mới có cặp hai chiều trên cùng fixture, thông điệp ghim.
evals:
  - id: E1
    criterion: AC-1
    executor: test
    layer: backend-effect
    cmd: config:executors.test.danh_ba_ops
    paths: [app/src/lib/ops/people.ts, app/src/components/ops/people/**, app/src/app/ops/people/**, app/tests/danh-ba-nguoi-tren-ops.test.tsx]
    expected: "exit 0; ca SHS-AC-1 qua page thật hai vai ops, admin: HTML có `0912 345 678`, href tel:+84912345678 nằm trong ô cột đầu của hàng đó (bóc từng <td>, so quan hệ hàng ↔ số); không có «SĐT (đã che)»; người không số không có tel:; lược đồ 12 người thì đúng 12 hàng <tr> trong <tbody>, đối chứng đỏ: bản bảng để mặc định 10 hàng → ném; đối chứng đỏ: bản hienBiDanh che số → ném ('SHS-AC-1 không thấy số')."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E2
    criterion: AC-2
    executor: test
    layer: backend-effect
    cmd: config:executors.test.danh_ba_ops
    paths: [app/src/lib/ops/people.ts, app/src/components/ops/people/**, app/src/app/ops/people/**, app/tests/danh-ba-nguoi-tren-ops.test.tsx]
    expected: "exit 0; ca SHS-AC-2: trang một người có hai dòng số và hai tel:, đúng một «Đã nghỉ»; giá trị lệch khuôn hiện chữ, 0 tel:; đối chứng đỏ: telHref bỏ kiểm khuôn → ném ('SHS-AC-2 liên kết lệch khuôn')."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E3
    criterion: AC-3
    executor: test
    layer: backend-effect
    cmd: config:executors.test.danh_ba_ops
    paths: [app/src/lib/ops/people.ts, app/src/components/ops/people/**, app/src/app/ops/people/**, app/tests/danh-ba-nguoi-tren-ops.test.tsx]
    expected: "exit 0; ca SHS-AC-3: bộ quét số (bốn dạng, cả tách nhóm) trên HTML và JSON.stringify cây phần tử của page thật; viewer 0 khớp ở danh sách và trang một người, vẫn có mã người, nguồn, số tin; khách và user có «Cần đăng nhập ops.»; đối chứng dương: cùng bộ quét trên ops > 0; đối chứng đỏ: bản xem=true cho viewer → ném ('SHS-AC-3 viewer nhận số')."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E4
    criterion: AC-4
    executor: test
    layer: backend-effect
    cmd: config:executors.test.danh_ba_ops
    paths: [app/src/lib/ops/people.ts, app/src/components/ops/people/**, app/tests/danh-ba-nguoi-tren-ops.test.tsx]
    expected: "exit 0; ca SHS-AC-4: ma trận viết trước, sáu dạng gõ qua page thật vai ops ra đúng một mã người và hàng hiện đúng số vừa gõ; người hai số sống, tìm số nào hàng hiện số đó (dựng qua loader, không viết tay hàng); số không ai có → trạng thái trống; `0912` khớp người có tên chứa `0912` và không ra người có số; người chỉ có số nghỉ và người gộp không khớp; tìm tên, tài khoản như cũ; assert đủ số phần tử ma trận; đối chứng đỏ: bỏ chuẩn hoá thì dạng `0912 345 678` ném ('SHS-AC-4 không ra người')."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E5
