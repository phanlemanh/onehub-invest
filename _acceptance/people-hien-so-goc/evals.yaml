    paths: [app/src/lib/deals.ts, app/src/app/ops/deals/page.tsx, app/src/lib/ops/people.ts, CONTEXT.md, _acceptance/people-hien-so-goc/probes/chu.mjs]
    expected: "exit 0; probes/chu.mjs: deals.ts và page.tsx không còn «tầng A» gắn SĐT; 0 NHAN_CHE_SDT trong app/src; CONTEXT.md dòng Bí danh không còn «đã che»; đối chứng đỏ: chạy trên chuỗi mồi có «SĐT (đã che)» → thoát 1 với ('SHS-AC-8')."
