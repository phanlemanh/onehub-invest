    expected: "exit 0; ca SHS-AC-6 qua page thật với getDeals giả, ma trận viewer, ops, admin và bản cloud: ops có tên, nhóm, tel:, 0 <img>, không chữ bài; admin đủ; viewer 0 khớp bộ quét số và 0 tên trên HTML và JSON.stringify cây phần tử; cloud không khối liên hệ, chú thích có «máy thu»; đối chứng đỏ: lọc theo isAdmin → ném ('SHS-AC-6 ops không thấy liên hệ'); đối chứng đỏ: bỏ lọc viewer → ném ('SHS-AC-6 viewer nhận số')."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
