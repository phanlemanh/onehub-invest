<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dòng tiền vốn vay</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Lora:ital,wght@0,400;1,400&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Lora', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1360px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.25;
      color: var(--color-ink);
      margin-bottom: 0.5rem;
    }
    .sub {
      font-size: 0.875rem;
      color: var(--color-muted);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 960px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Cổng Phạm vi · yield-dong-tien-von-vay · Hỏi-1 + d-…-3</p>
    <h1>Dòng tiền vốn vay: từ ước tính lợi suất tới lợi nhuận trên tiền mặt bỏ ra</h1>
    <p class="sub">Năm bước nối tiếp, một nhánh phụ · số đi từ trái sang phải rồi vòng xuống · AC-4 · AC-5</p>

    <svg viewBox="0 88 1360 420" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
      </defs>

      <rect x="0" y="88" width="1360" height="420" fill="#f5f5f5"/>

      <!-- ===================== NHÓM ===================== -->
      <text x="40" y="112" fill="#4f5d75" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.18em">TỪ ƯỚC TÍNH LỢI SUẤT · CÙNG SỐ</text>
      <text x="832" y="112" fill="#4f5d75" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.18em">MÔ HÌNH VỐN VAY</text>
      <line x1="40" y1="124" x2="792" y2="124" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <line x1="832" y1="124" x2="1320" y2="124" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>

      <!-- ===================== ARROWS (trước hộp) ===================== -->
      <!-- hàng chính: 5 bước nối tiếp -->
      <line x1="264" y1="192" x2="300" y2="192" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="528" y1="192" x2="564" y2="192" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="792" y1="192" x2="828" y2="192" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="1056" y1="192" x2="1092" y2="192" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- nhánh: dòng tiền sau nợ → lợi nhuận năm -->
      <line x1="1208" y1="236" x2="1208" y2="312" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- gốc đã trả: từ trả nợ vay góp vào lợi nhuận năm -->
      <path d="M1024 236 V268 Q1024 276 1032 276 H1136 Q1144 276 1144 284 V312" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <rect x="1048" y="256" width="72" height="12" rx="2" fill="#f5f5f5"/>
      <text x="1084" y="265" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">GỐC ĐÃ TRẢ</text>

      <!-- hàng nhánh: chạy ngược sang trái -->
      <line x1="1096" y1="360" x2="1060" y2="360" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="832" y1="360" x2="796" y2="360" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>

      <!-- kết quả → ghi chú Hỏi-1 -->
      <line x1="568" y1="360" x2="528" y2="360" stroke="rgba(79,93,117,0.6)" stroke-width="1" stroke-dasharray="3,3"/>

      <!-- ===================== HÀNG CHÍNH ===================== -->
      <!-- 1. Doanh thu ngắn hạn -->
      <rect x="40" y="148" width="224" height="88" rx="6" fill="#f5f5f5"/>
      <rect x="40" y="148" width="224" height="88" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="48" y="154" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="64" y="163" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">AC-4</text>
      <text x="152" y="188" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Doanh thu ngắn hạn</text>
      <text x="152" y="204" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">Ước tính lợi suất (listing so sánh)</text>

      <!-- 2. − Chi phí vận hành -->
      <rect x="304" y="148" width="224" height="88" rx="6" fill="#f5f5f5"/>
      <rect x="304" y="148" width="224" height="88" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="312" y="154" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="328" y="163" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">AC-4</text>
      <text x="416" y="188" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">− Chi phí vận hành</text>
      <text x="416" y="204" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">quản lý, nền tảng, thuế, cố định</text>

      <!-- 3. = Thu nhập ròng -->
      <rect x="568" y="148" width="224" height="88" rx="6" fill="#f5f5f5"/>
      <rect x="568" y="148" width="224" height="88" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="576" y="154" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="592" y="163" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">AC-4</text>
      <text x="680" y="188" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">= Thu nhập ròng</text>
      <text x="680" y="204" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">cùng số ô KPI phía trên</text>

      <!-- 4. − Trả nợ vay -->
      <rect x="832" y="148" width="224" height="88" rx="6" fill="#f5f5f5"/>
      <rect x="832" y="148" width="224" height="88" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="840" y="154" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="856" y="163" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">AC-5</text>
      <text x="944" y="184" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">− Trả nợ vay</text>
      <text x="944" y="200" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">lãi + gốc, trả góp đều</text>
      <text x="944" y="216" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">vay = giá × (1 − vốn tự có)</text>

      <!-- 5. = Dòng tiền sau nợ -->
      <rect x="1096" y="148" width="224" height="88" rx="6" fill="#f5f5f5"/>
      <rect x="1096" y="148" width="224" height="88" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="1104" y="154" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="1120" y="163" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">AC-4</text>
      <text x="1208" y="188" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">= Dòng tiền sau nợ</text>
      <text x="1208" y="204" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">cột Hằng tháng + Năm 1…5</text>

      <!-- ===================== NHÁNH PHỤ ===================== -->
      <!-- Lợi nhuận năm -->
      <rect x="1096" y="316" width="224" height="88" rx="6" fill="#f5f5f5"/>
      <rect x="1096" y="316" width="224" height="88" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="1208" y="356" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Lợi nhuận năm</text>
      <text x="1208" y="372" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">= Dòng tiền sau nợ + Gốc đã trả</text>

      <!-- ÷ Tiền mặt bỏ ra -->
      <rect x="832" y="316" width="224" height="88" rx="6" fill="#f5f5f5"/>
      <rect x="832" y="316" width="224" height="88" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="840" y="322" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="856" y="331" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">AC-5</text>
      <text x="944" y="356" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">÷ Tiền mặt bỏ ra</text>
      <text x="944" y="372" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">vốn tự có × giá + nội thất</text>

      <!-- Lợi nhuận / tiền mặt bỏ ra (tiêu điểm) -->
      <rect x="568" y="316" width="224" height="88" rx="6" fill="#f5f5f5"/>
      <rect x="568" y="316" width="224" height="88" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4"/>
      <rect x="576" y="322" width="32" height="12" rx="2" fill="transparent" stroke="rgba(186,69,19,0.50)" stroke-width="0.8"/>
      <text x="592" y="331" fill="#ba4513" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">AC-4</text>
      <text x="680" y="356" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Lợi nhuận / tiền mặt bỏ ra</text>
      <text x="680" y="372" fill="#ba4513" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">dòng tổng ghim</text>

      <!-- ===================== GHI CHÚ HỎI-1 ===================== -->
      <rect x="40" y="328" width="488" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="40" y="328" width="488" height="64" rx="6" fill="transparent" stroke="rgba(79,93,117,0.6)" stroke-width="1" stroke-dasharray="5,4"/>
      <rect x="48" y="340" width="48" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="72" y="349" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">HỎI-1</text>
      <text x="108" y="352" fill="#4f5d75" font-size="13" font-style="italic" font-family="'Instrument Serif', 'Lora', serif">Nội thất trả tiền mặt · không phí giao dịch · 5 năm</text>
      <text x="108" y="372" fill="#4f5d75" font-size="13" font-style="italic" font-family="'Instrument Serif', 'Lora', serif">— máy khuyên giữ</text>

      <!-- ===================== LEGEND ===================== -->
      <line x1="40" y1="436" x2="1320" y2="436" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="456" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.18em">CHÚ GIẢI</text>

      <rect x="40" y="468" width="16" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="64" y="478" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Bước tính</text>

      <rect x="132" y="468" width="16" height="12" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4"/>
      <text x="156" y="478" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Kết quả ghim trên lưới</text>

      <line x1="276" y1="474" x2="300" y2="474" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4"/>
      <text x="308" y="478" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Góp thêm một phần số</text>

      <rect x="420" y="468" width="16" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.6)" stroke-width="1" stroke-dasharray="3,2"/>
      <text x="444" y="478" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Ghi chú câu hỏi</text>

      <rect x="536" y="468" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="552" y="477" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">AC-n</text>
      <text x="576" y="478" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Tiêu chí liên quan</text>
    </svg>
  </div>
</body>
</html>
