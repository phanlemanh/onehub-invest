schema_version: 1
feature_slug: yield-dong-tien-von-vay
# Ca test mang tiền tố «YDT-AC-n» trong app/tests/yield-dong-tien-von-vay.test.tsx (jsdom + hàm thuần; không cần DB).
# Smoke HTTP: scripts/smoke-yield-dong-tien.mjs — cần app chạy TỪ worktree này (BASE_URL, mặc định :3460 của dãy U1) + DB local.
# Chỉ GET, không ghi gì. ui-check KHÔNG tạo tệp tạm trong cây (bài học UI2 r1: tệp tạm đua với suite chạy song song).
evals:
  - id: E1
    criterion: AC-1
    executor: script
    cmd: config:executors.script.yield_dong_tien_smoke
    paths: [app/next.config.ts, scripts/smoke-yield-dong-tien.mjs]
    expected: "exit 0; 'ok /vn/hanoi/dau-tu → 301 /yield?area=vn-hanoi#financing' và 'ok /vn/hcmc/dau-tu → 301 /yield?area=vn-hcmc#financing' (redirect: manual, so Location ĐÚNG BẰNG chuỗi; 308/307/200/404 là FAIL nêu mã thật); should-NOT-fire: 'ok /vn/hanoi 200, không chuyển hướng'"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E2
    criterion: AC-1
    executor: test
    cmd: config:executors.test.ui_route_slugs
    paths: [app/eslint-plugin-onehub-ui/tests/route-slugs.test.mjs, app/eslint-plugin-onehub-ui/lib/route-slugs.mjs, app/next.config.ts, app/src/app/**]
    expected: "exit 0; ca cây thật xanh — cùng ca đỏ với 'ngoại lệ \"dau-tu\" đã đổi xong' nếu dòng dau-tu còn trong VIET_EXCEPTIONS, đỏ với 'thiếu redirect' nếu next.config.ts mất dòng /:country/:market/dau-tu (hai chiều đỏ có ca riêng cùng tệp)"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E3
    criterion: AC-2
    executor: test
    cmd: config:executors.test.app_ui
    paths: [app/src/**, scripts/**, app/next.config.ts, app/tests/yield-dong-tien-von-vay.test.tsx]
    expected: "exit 0; ca 'YDT-AC-2 không còn /dau-tu': quét .ts/.tsx/.mjs/.sh dưới app/src và scripts/, loại ĐÚNG hai tệp đo redirect (scripts/smoke-yield-dong-tien.mjs, scripts/smoke-portal-compliance.mjs — ca đòi chúng có thật) → 0 chỗ chứa '/dau-tu'; next.config.ts có đúng một redirect source '/:country/:market/dau-tu' destination '/yield?area=:country-:market#financing' statusCode 301; vẽ InsightActions trong jsdom với areaId 'vn-hanoi' và một mã phường 'vn-hanoi-hoan-kiem' → link chữ 'Đầu tư' có href ĐÚNG BẰNG '/yield?area=vn-hanoi#financing' / '/yield?area=vn-hanoi-hoan-kiem#financing' (đầu ra thật, không grep chuỗi mẫu); chiều đỏ: thư mục tạm có 'href=\"/vn/hanoi/dau-tu\"' → 1 chỗ kèm tên tệp"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
