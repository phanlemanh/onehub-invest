    expected: "exit 0; ngoài CI (cần DB máy thu :5433); ca «DV1-AC-7» mở máy thu bằng phiên default_transaction_read_only=on, chép 20 nút dự án (slug, area_ids, meta) sang DB thử có danh bạ xã PX1; đếm TRƯỚC số mã không có trong areas trên DB thử bằng đúng số đếm độc lập trên máy thu (một câu SQL riêng, cùng phiên chỉ đọc); chạy --sua-xa trên DB thử; SAU: 0 mã ngoài areas, 20/20 nút bằng xaMoiCuaNut của tệp; area_ids 20 nút trên máy thu sau ca bằng ảnh chụp đầu ca (chứng không ghi). In ra chỉ số đếm và slug. Chiều đỏ ghim: phép đếm «sau» chạy trên ảnh trước-khi-sửa ra > 0, đỏ với «DV1-AC-7 còn mã ngoài areas»."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
