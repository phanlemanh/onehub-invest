# 2-space indentation REQUIRED — the kit's hook parses this file line-by-line.
schema_version: 1
enforcement: strict          # strict | warn | off
gap_probe: advisory          # Luật phản biện context sạch ở pre-merge check: required | advisory | off.
                             # `advisory` in NOTE khi một slug T2/T3 trong diff PR thiếu gap-probe.md
                             # và thiếu entry descope; `required` chặn merge.
recheck: strict              # CI re-check of COMMITTED evidence — repo mới, chưa có báo cáo cũ.
# Hai ổ cắm thiết kế (repo có bề mặt người dùng): cả hai trỏ tới skill repo `onehub-ui`.
feature_loop:
  ui_standards_skill: onehub-ui
  suite_keys: [executors.test.agent, executors.test.app, executors.test.app_ui, executors.test.pipeline, executors.test.ui_lint_rules, executors.script.portal_static]   # làn ghim lại (repin) chạy mỗi lượt — agent/app_ui/pipeline thêm từ vòng enrich-qua-de-xuat
  # Khoá làn ghim lại của kit (GUIDE §7.1; Mạnh duyệt 2026-10-26, hồ sơ kit-khoa-nhom-1).
  repin_retry: 1               # lệnh đỏ chạy lại đúng một lần, một mình; xanh lần hai → dòng pin gọi tên ca chập chờn
  repin_budget_min: 80         # trần mỗi lượt; vượt → thoát 4, không ghi pin, để lại repin-do «vuot-tran»
  do_san_tren_nen: true        # vòng khác gặp đúng cái đỏ đã có dòng nền trên main vẫn ghim, kèm nhãn «đỏ sẵn trên nền», không in «ĐẠT»
design_pass:
  ds_skill: onehub-ui
  # Hàng giao diện sửa thẳng route THẬT trên nhánh của hàng (host-embedded), không dựng route proto riêng.
  # Khuôn bắt có {slug}: mở trang chủ dev server của dãy, bề mặt cụ thể của hàng truyền bằng đối số design-pass.
  # Cổng riêng mỗi dãy giao diện (3456 dùng chung): U1 = 3460, U2 = 3461 (LUAT đợt dot0, chốt U1-2 24/10).
  proto_route: "http://localhost:3460/#design-pass={slug}"
  dev_cmd: "cd app && npm run dev -- -p 3460"
  host_embed:
    guide: onehub-ui
    route: "http://localhost:3460"
    dev_flag: "không cần — route thật trên nhánh của hàng, dev server cổng riêng của dãy"
executors:
  test:
    collector: "cd collector && npm test"            # suy từ: collector/package.json — 13/13 xanh
    pipeline: "cd pipeline && npm test"              # suy từ: pipeline/package.json — 17/17 xanh
    agent: "cd agent && npm test"                    # agent/tests/parsers.test.ts — 8/8 xanh
    app: "cd app && npx tsc --noEmit && npm run lint"   # app chưa có test; lint 0 lỗi (3 cảnh báo cố ý)
    data_api: "cd data-api && npm run typecheck"     # suy từ: data-api/package.json — xanh
    app_ui: "cd app && npm test"                     # test render jsdom (app/tests) — thêm ở vòng enrich-qua-de-xuat
    ui_lint_rules: "cd app && npm run test:lint-rules"   # plugin lint onehub-ui (RuleTester + script kèm)
    ui_routes_map: "cd app && node --test eslint-plugin-onehub-ui/tests/routes-map.test.mjs"
    ui_route_slugs: "cd app && node --test eslint-plugin-onehub-ui/tests/route-slugs.test.mjs"   # URL tiếng Anh theo CONTEXT.md (glossary-context)
    sca_agent: "cd agent && node --import tsx --test tests/ai-call-log.test.ts"   # so-cuoc-goi-ai AC-2..AC-4 — model giả + DB local trong ROLLBACK
    sca_tong_hop: "node --test pipeline/lib/ai-calls.test.mjs"   # so-cuoc-goi-ai AC-5 — ma trận viết trước, không DB
    mgn_app: "cd app && node --import tsx --test tests/labels.test.tsx"   # man-gan-nhan-mu AC-3, AC-5..AC-8 — lược đồ tạm, route thật
    ngl_app: "cd app && node --import tsx --test tests/labels-gia.test.tsx"   # nhan-gia-va-luu-loi-mang AC-1..AC-3 — ma trận + route thật trên lược đồ tạm
    kns_lich_unit: "node --test pipeline/scripts/s05-b-lich.test.mjs"   # G1 2510-14
    kns_s05_unit: "node --test pipeline/scripts/s05-paused.test.mjs"   # 2510-4: luật chỉ active mới thu
    cal_unit: "node --test pipeline/scripts/install-collector-api.test.mjs"   # ZC4 2510-33
    s08_row_unit: "node --test pipeline/scripts/import-s08-row.test.mjs"   # ZC8 s08RowOf
