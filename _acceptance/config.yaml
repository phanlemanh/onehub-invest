# 2-space indentation REQUIRED — the kit's hook parses this file line-by-line.
schema_version: 1
enforcement: strict          # strict | warn | off
gap_probe: advisory          # Luật phản biện context sạch ở pre-merge check: required | advisory | off.
                             # `advisory` in NOTE khi một slug T2/T3 trong diff PR thiếu gap-probe.md
                             # và thiếu entry descope; `required` chặn merge.
recheck: strict              # CI re-check of COMMITTED evidence — repo mới, chưa có báo cáo cũ.
# Hai ổ cắm thiết kế (repo có bề mặt người dùng): cả hai trỏ tới skill repo `onehub-ui`.
feature_loop:
  ui_standards_skill: onehub-ui
  suite_keys: [executors.test.app, executors.script.portal_static]   # làn ghim lại (repin) chạy mỗi lượt
design_pass:
  ds_skill: onehub-ui
executors:
  test:
    collector: "cd collector && npm test"            # suy từ: collector/package.json — 13/13 xanh
    pipeline: "cd pipeline && npm test"              # suy từ: pipeline/package.json — 17/17 xanh
    agent: "cd agent && npm test"                    # agent/tests/parsers.test.ts — 8/8 xanh
    app: "cd app && npx tsc --noEmit && npm run lint"   # app chưa có test; lint 0 lỗi (3 cảnh báo cố ý)
    data_api: "cd data-api && npm run typecheck"     # suy từ: data-api/package.json — xanh
    ui_lint_rules: "cd app && npm run test:lint-rules"   # plugin lint onehub-ui (RuleTester + script kèm)
    ui_routes_map: "cd app && node --test eslint-plugin-onehub-ui/tests/routes-map.test.mjs"
  script:
    cli: "cd collector && npm run build && npm run collect -- list-sources"   # suy từ: CLAUDE.md Verify Commands
    portal_static: "node scripts/check-portal-compliance.mjs"     # ranh giới cổng tĩnh (luật 5/6/9) — đo trạng thái cây
    portal_smoke: "BASE_URL=http://localhost:3456 node scripts/smoke-portal-compliance.mjs"   # cần app đang chạy :3456 + DB local
    product_map: "node /Users/manhphan/.claude/plugins/cache/acceptance-gate-kit/acceptance-gate/2.32.0/scripts/product-map.mjs --root . --check"
    listing_static: "node scripts/check-listing-no-airdna.mjs"   # /listing/[id] không AirDNA (luật 5) — đo trạng thái cây
    listing_smoke: "BASE_URL=${BASE_URL:-http://localhost:3456} node scripts/smoke-listing-no-airdna.mjs"   # cần app chạy TỪ worktree đang kiểm (mặc định :3456, đổi bằng env BASE_URL) + DB local
    listing_design_gate: "node /Users/manhphan/.claude/plugins/cache/acceptance-gate-kit/acceptance-gate/2.32.0/scripts/design-gate.mjs --jsdom app 'app/src/app/(app)/listing/[id]/page.tsx'"   # design gate ghim file đích — làn ghim lại không tự nối paths: vào lệnh
    ui_mcp_config: "node scripts/ui-standards/acceptance.mjs mcp-config"            # chuẩn UI ReUI (ui-standards-reui)
    ui_mcp_connected: "node scripts/ui-standards/acceptance.mjs mcp-connected"
    ui_kit_sockets: "node scripts/ui-standards/acceptance.mjs kit-sockets"
    ui_pointers: "node scripts/ui-standards/acceptance.mjs pointers"
    ui_baseline_doc: "node scripts/ui-standards/acceptance.mjs baseline-doc"
    ui_lint_should_fire: "cd app && node eslint-plugin-onehub-ui/selftest.mjs should-fire"
    ui_lint_should_not_fire: "cd app && node eslint-plugin-onehub-ui/selftest.mjs should-not-fire"
    ui_baseline_guard: "cd app && node eslint-plugin-onehub-ui/selftest.mjs baseline-guard"
    ui_hook_selftest: "bash .claude/hooks/tests/typecheck-changed.selftest.sh"
  design:                                            # app/ là web UI
    # DOM mode cần jsdom: cài ở app/ (devDependency), trỏ bằng --jsdom app — thiếu cờ này mọi eval design ra BLOCKED.
    gate: "node /Users/manhphan/.claude/plugins/cache/acceptance-gate-kit/acceptance-gate/2.32.0/scripts/design-gate.mjs --jsdom app"   # script tier (a11y/slop)
    ui_check: "/Users/manhphan/.claude/plugins/cache/acceptance-gate-kit/acceptance-gate/2.32.0/scripts/design-scan.js"     # browser tier (authoritative P0)
risk_tiers:
  t1_skip_globs:
    - "docs/**"
    - "README.md"
    - "**/README.md"
    - "AGENTS.md"
    - "**/AGENTS.md"                                 # chỉ dẫn agent theo module (vd collector/AGENTS.md cho ZCode) — cùng loại **/CLAUDE.md; Mạnh duyệt 2026-10-23
    - "**/CLAUDE.md"
    # Bản đồ sản phẩm — máy sinh, và /acceptance-gate:approve + /acceptance-gate:signoff commit nó CÙNG commit
    # chữ ký. Thiếu dòng này thì chính commit chữ ký làm evidence stale và
    # pre-merge chặn merge, thành vòng không thoát (ADR 0007). Miễn trừ CHỈ an
    # toàn khi repo cũng chạy `executors.script.product_map` trong CI của mình —
    # .github/workflows/acceptance-gate.yml chạy bước đó.
    - "PRODUCT-MAP.md"
  t3_paths:
    - "app/src/lib/auth.ts"                          # auth + cổng /ops
    - "app/src/lib/ops-access.ts"
    - "app/src/proxy.ts"
    - "app/src/app/(auth)/**"
    - "app/src/app/actions.ts"                       # login/logout/toggleSaved
    - "app/src/app/api/v1/ops/**"                    # ingest, review decide, zalo login
    - "data-api/src/middleware/**"                   # API key auth
    - "db/migrations/**"                             # schema
    - "pipeline/sync-cloud.mjs"                      # dữ liệu rời máy (PII tầng A)
    - "pipeline/push-ops-facts.mjs"
    - "scripts/cloud-sync.sh"
    - "tools/**"                                     # đẩy ra repo public
    - "collector/openclaw/**"                        # an toàn Zalo
    - "scripts/zalo-watchdog.sh"
    - ".claude/settings.json"                        # rào chắn máy
    - ".claude/hooks/**"
signoff:
  required_for: [T2, T3]     # tiers that pre-merge-check requires signoff for
  approvers: ["Mạnh"]        # informational — gate không ép khoá này; chữ ký vẫn được kiểm
                             # (human_signoff không rỗng, không là placeholder tiếng Anh).
dev_server:
  start: "cd app && npm run dev -- -p 3456"          # suy từ: CLAUDE.md + .claude/launch.json
  url: "http://localhost:3456"
  # không có api_base: app chỉ gọi /api/v1 cùng origin
capture:
  ui: "bash scripts/ui-capture.sh"                   # <url> <out.png> qua playwright-cli; chụp ngay khi load (MapLibre có thể chưa vẽ xong)
