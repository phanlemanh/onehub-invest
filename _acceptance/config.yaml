  design:                                            # app/ là web UI
    # DOM mode cần jsdom: cài ở app/ (devDependency), trỏ bằng --jsdom app — thiếu cờ này mọi eval design ra BLOCKED.
    gate: "node \"${CLAUDE_PLUGIN_ROOT:-$(node $HOME/.claude/plugins/marketplaces/acceptance-gate-kit/feature-loop/scripts/resolve-plugin.mjs --plugin acceptance-gate --require scripts/design-gate.mjs)}/scripts/design-gate.mjs\" --jsdom app"   # script tier (a11y/slop)
    gate_don_hex_tho: "for f in app/src/components/finder/bins.ts app/src/components/finder/choropleth-map.tsx app/src/components/listing/listings-map.tsx app/src/components/mini-map.tsx app/src/components/ops/data-flow/flow-journey.tsx; do node \"${CLAUDE_PLUGIN_ROOT:-$(node $HOME/.claude/plugins/marketplaces/acceptance-gate-kit/feature-loop/scripts/resolve-plugin.mjs --plugin acceptance-gate --require scripts/design-gate.mjs)}/scripts/design-gate.mjs\" --jsdom app \"$f\" || exit $?; done"   # don-hex-tho E8 — gate từng tệp giao diện của vòng (gate không tự nối tệp từ paths); giám sát duyệt U1-63
    sca_gate: "for f in app/src/app/ops/ai-calls/page.tsx app/src/components/ops/ai-calls/ai-calls-view.tsx; do node \"${CLAUDE_PLUGIN_ROOT:-$(node $HOME/.claude/plugins/marketplaces/acceptance-gate-kit/feature-loop/scripts/resolve-plugin.mjs --plugin acceptance-gate --require scripts/design-gate.mjs)}/scripts/design-gate.mjs\" --jsdom app \"$f\" || exit $?; done"   # so-cuoc-goi-ai E10
    mgn_gate: "for f in app/src/app/ops/labels/page.tsx app/src/components/ops/labels/labels-view.tsx app/src/components/ops/labels/label-form.tsx app/src/components/ops/labels/agreement-table.tsx; do node \"${CLAUDE_PLUGIN_ROOT:-$(node $HOME/.claude/plugins/marketplaces/acceptance-gate-kit/feature-loop/scripts/resolve-plugin.mjs --plugin acceptance-gate --require scripts/design-gate.mjs)}/scripts/design-gate.mjs\" --jsdom app \"$f\" || exit $?; done"   # man-gan-nhan-mu E11
    ngl_gate: "for f in app/src/components/ops/labels/label-form.tsx app/src/components/ops/labels/luu-nhan.tsx; do node \"${CLAUDE_PLUGIN_ROOT:-$(node $HOME/.claude/plugins/marketplaces/acceptance-gate-kit/feature-loop/scripts/resolve-plugin.mjs --plugin acceptance-gate --require scripts/design-gate.mjs)}/scripts/design-gate.mjs\" --jsdom app \"$f\" || exit $?; done"   # nhan-gia-va-luu-loi-mang E5
    ui_check: "${CLAUDE_PLUGIN_ROOT:-$(node $HOME/.claude/plugins/marketplaces/acceptance-gate-kit/feature-loop/scripts/resolve-plugin.mjs --plugin acceptance-gate --require scripts/design-scan.js)}/scripts/design-scan.js"     # browser tier (authoritative P0)
    # Sàn thiết kế S4 (design-floor bậc M1): chấm hex thô trên tệp giao diện mà vòng chạm. Nối ở noi-design-floor sau khi
    # don-hex-tho dọn hết hex thô ngoài vendor; mười vòng thí điểm DO1 đếm từ hàng này (ghi chú nhận 2.35.0 của kit, mục 2.4).
    floor: "node \"${CLAUDE_PLUGIN_ROOT:-$(node $HOME/.claude/plugins/marketplaces/acceptance-gate-kit/feature-loop/scripts/resolve-plugin.mjs --plugin acceptance-gate --require scripts/design-floor-s4.mjs)}/scripts/design-floor-s4.mjs\" --root ."
# Vùng giao diện (kit 2.35.0, design-floor bậc M1): S4 bắt «diff chạm surface mà lane không có design eval»; bộ đọc bậc dùng cho M1.
# Chưa khai design_floor.tokens/registry (M2) — kho chưa có bộ token và danh mục thành phần.
design:
  # Liệt kê dương (noi-design-floor): kit 2.35.0 chưa đọc glob trừ, nên vendor (VENDOR_DIRS của app/eslint.config.mjs:
  # ui, reui, blocks, examples) nằm ngoài vùng bằng cách KHÔNG liệt kê. Thư mục giao diện mới thêm một dòng — test
  # scripts/design-floor-vung.test.mjs đỏ khi sót.
  surface_globs:
    - "app/src/app/**"
    - "app/src/components/*.tsx"
    - "app/src/components/auth/**"
    - "app/src/components/charts/**"
    - "app/src/components/compare/**"
    - "app/src/components/finder/**"
    - "app/src/components/insight/**"
    - "app/src/components/listing/**"
    - "app/src/components/marketing/**"
    - "app/src/components/ops/**"
    - "app/src/components/page/**"
    - "app/src/components/saved/**"
    - "app/src/components/shell/**"
    - "app/src/components/states/**"
    - "app/src/components/yield/**"
risk_tiers:
  t1_skip_globs:
    - "docs/**"
    - "README.md"
    - "**/README.md"
    - "AGENTS.md"
    - "**/AGENTS.md"                                 # chỉ dẫn agent theo module (vd collector/AGENTS.md cho ZCode) — cùng loại **/CLAUDE.md; Mạnh duyệt 2026-10-23
    - "**/CLAUDE.md"
    - "CONTEXT.md"                                   # bảng thuật ngữ + bối cảnh sản phẩm — văn bản; Mạnh duyệt 2026-10-23
    - ".claude/rules/**"                             # luật chữ theo đường dẫn cho Claude — văn bản; Mạnh duyệt 2026-10-23
    # Bản đồ sản phẩm — máy sinh, và /acceptance-gate:approve + /acceptance-gate:signoff commit nó CÙNG commit
    # chữ ký. Thiếu dòng này thì chính commit chữ ký làm evidence stale và
    # pre-merge chặn merge, thành vòng không thoát (ADR 0007). Miễn trừ CHỈ an
    # toàn khi repo cũng chạy `executors.script.product_map` trong CI của mình —
    # .github/workflows/acceptance-gate.yml chạy bước đó.
    - "PRODUCT-MAP.md"
    - "LO-TRINH.html"
  t3_paths:
    - "app/src/lib/auth.ts"                          # auth + cổng /ops
    - "app/src/lib/ops-access.ts"
    - "app/src/proxy.ts"
    - "app/src/app/(auth)/**"
    - "app/src/app/actions.ts"                       # login/logout/toggleSaved
    - "app/src/app/api/v1/ops/**"                    # ingest, review decide, zalo login
    - "data-api/src/middleware/**"                   # API key auth
    - "db/migrations/**"                             # schema
    - "pipeline/sync-cloud.mjs"                      # dữ liệu rời máy (PII tầng A)
    - "pipeline/push-ops-facts.mjs"
    - "scripts/cloud-sync.sh"
    - "tools/**"                                     # đẩy ra repo public
    - "collector/openclaw/**"                        # an toàn Zalo
    - "scripts/zalo-watchdog.sh"
    - ".claude/settings.json"                        # rào chắn máy
    - ".claude/hooks/**"
  # Hồ sơ chỉ cũ khi diff chạm `paths` của eval trong nó (bộ lọc đóng mặc định, GUIDE §7.1). Hồ sơ có eval máy
  # thiếu `paths` hay mục `paths` không chứng được thì giữ luật cũ. Chiến dịch ghim lại ở mốc kit chạy lưới với --stale-all.
  stale_scope: paths
signoff:
  required_for: [T2, T3]     # tiers that pre-merge-check requires signoff for
  approvers: ["Mạnh"]        # informational — gate không ép khoá này; chữ ký vẫn được kiểm
                             # (human_signoff không rỗng, không là placeholder tiếng Anh).
dev_server:
