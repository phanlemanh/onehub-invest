schema_version: 1
feature_slug: lockdown-cloud-theo-facts
evals:
  - id: E1
    criterion: AC-1
    executor: test
    cmd: config:executors.test.app_ui
    expected: "exit 0; ca 'ON23-AC-1 không bản tin: lưới khoá an toàn đúng 8 hàng = 8 cặp lớp + mô tả của getLockdownStatus (ma trận viết trước, số hàng ghim), mỗi hàng «Chỉ kiểm ở máy thu», 0 badge success và 0 bg-success trong lưới + ô, ô «—» kèm «Chưa kiểm được trên máy chủ»' ok — trang /ops/collections THẬT ở chế độ máy chủ; chiều đỏ 'ON23-AC-1 bản sao lưới mặc định lớp không khối thành «Ổn» → bắt' ok"
    paths: [app/src/app/ops/collections/page.tsx, app/src/components/ops/collections/**, app/src/lib/ops-cloud.ts, app/src/lib/ops-queries.ts, app/tests/lockdown-cloud-theo-facts.test.tsx]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E2
    criterion: AC-2
    executor: test
    cmd: config:executors.test.app_ui
    expected: "exit 0; ca 'ON23-AC-2 khối lockdown lỗi ở bên ghi thật (push-ops-facts qua handler ingest thật): lưới 8/8 «Chỉ kiểm ở máy thu», ô «—», ô Bản ghi 24h vẫn = tổng khối records24h' ok; chiều đỏ 'ON23-AC-2 bản sao đọc khối lỗi như khối có số → bắt' ok"
    paths: [app/src/lib/ops-cloud.ts, app/src/components/ops/collections/**, app/tests/lockdown-cloud-theo-facts.test.tsx]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E3
    criterion: AC-3
    executor: test
    cmd: config:executors.test.app_ui
    expected: "exit 0; ca 'ON23-AC-3 bản tin tươi có đủ true/false/null và 2 lượt tự trả lời: hàng lưới = hàng khối (lớp, mô tả, nhãn Ổn/Hỏng/Chưa kiểm được theo ok), mô tả lưới «Bộ canh chạy cuối» giờ VN của lastWatchdogAt, số trên tab Hỏng / Chưa kiểm được / Ổn = số lớp false / null / true của khối (ma trận 3 giá trị viết trước), ô = số lớp true / 8 kèm «2 lượt tự trả lời»' ok; chiều đỏ 'ON23-AC-3 bản sao bỏ qua ok null (coi như true) → bắt' ok (phép đếm tab đỏ theo)"
    paths: [app/src/lib/ops-cloud.ts, app/src/components/ops/collections/**, app/tests/lockdown-cloud-theo-facts.test.tsx]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E4
    criterion: AC-4
    executor: test
    cmd: config:executors.test.app_ui
    expected: "exit 0; ca 'ON23-AC-4 khối lùi 46′: nhãn hàng giữ nguyên, 0 success-light trong lưới, ô số mờ, 0 bg-success trong ô; hàng kev và collector-api của Máy móc giữ nhãn đọc từ khối, 0 success-light' ok; chiều đỏ 'ON23-AC-4 bản sao lưới không nhận cờ số cũ → bắt' ok; chiều đỏ 'ON23-AC-4 bản sao Máy móc bỏ qua cờ cũ của khối → bắt' ok"
    paths: [app/src/lib/ops-cloud.ts, app/src/components/ops/collections/**, app/tests/lockdown-cloud-theo-facts.test.tsx]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E5
    criterion: AC-5
    executor: test
    cmd: config:executors.test.app_ui
    layer: backend-effect
    expected: "exit 0; ca 'ON23-AC-5 ma trận 3 × 2 (ok true/false/null × Kev gate, collector API) trên bản tin thật: hàng kev và collector-api của Máy móc = «Sống» / «Không phản hồi» / «Chưa kiểm được», khoá jobs cũ nói ngược lại' ok (6 ô viết trước, đếm đủ 6); ca 'ON23-AC-5 ca chéo Kev true + collector false và đảo lại: mỗi hàng đúng lớp của cổng mình' ok; ca 'ON23-AC-5 không khối lockdown → hai hàng «Chưa kiểm được»' ok; chiều đỏ 'ON23-AC-5 bản sao đọc alive của khoá jobs cũ → bắt' ok; chiều đỏ 'ON23-AC-5 bản sao tráo ánh xạ kev ↔ collector-api → bắt' ok"
    paths: [app/src/lib/ops-cloud.ts, app/src/app/ops/collections/page.tsx, app/src/components/ops/collections/jobs-grid.tsx, app/src/lib/collections-queries.ts, app/tests/lockdown-cloud-theo-facts.test.tsx]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E6
    criterion: AC-6
    executor: test
    cmd: config:executors.test.app_ui
    expected: "exit 0; ca 'ON23-AC-6 DB máy thu đủ bảng: lưới từ getLockdownStatus, 0 chữ «Chỉ kiểm ở máy thu», 0 truy vấn ops_heartbeat' ok; đối chứng dương 'ON23-AC-6 bộ bắt truy vấn thấy ops_heartbeat ở chế độ máy chủ' ok"
    paths: [app/src/app/ops/collections/page.tsx, app/src/components/ops/collections/**, app/tests/lockdown-cloud-theo-facts.test.tsx]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E7
    criterion: AC-7
    executor: judgment
    inputs: ["docs/superpowers/specs/2026-10-25-lockdown-cloud-theo-facts-design.md", "docs/adr/0014-ops-cloud-doc-so-tong-hop.md", "CONTEXT.md", "app/src/components/ops/collections/lockdown-grid.tsx", "app/src/components/ops/collections/jobs-grid.tsx", "app/src/components/ops/collections/collections-tiles.tsx", "app/src/components/ops/collections/collections-view.tsx"]
    question: "Đối chiếu bảng trạng thái (ST-lockdown-*) của đặc tả UX với chữ thật trong lưới khoá an toàn, ô Khoá an toàn, lưới Máy móc và view thu thập, cùng ADR-0014 §Ngưỡng trễ và nhãn trong CONTEXT.md (máy thu, máy chủ, Khoá an toàn): lớp không có số có hiện «Chỉ kiểm ở máy thu», lớp không kiểm được có hiện «Chưa kiểm được», có chỗ nào hiện «Ổn», «Sống» hay màu xanh khi không kiểm, có chữ «máy local»/«cloud»/«lockdown» còn sót trên giao diện không? Lưu ý: riêng lưới Khoá an toàn, bat_khi ON23 (8/8 hàng ghi «Chỉ kiểm ở máy thu», ghi trong design mục Cách làm) thắng luật «chữ chỉ-local đúng một lần mỗi trang» của ADR-0014 — 8 nhãn hàng không phải vi phạm. Lệch hay còn trạng thái giả thì FAIL."
    expected: "chữ khớp bảng trạng thái, ADR-0014 và CONTEXT.md; không lớp nào xanh khi không kiểm"
    paths: ["docs/superpowers/specs/2026-10-25-lockdown-cloud-theo-facts-design.md", "app/src/components/ops/collections/lockdown-grid.tsx", "app/src/components/ops/collections/jobs-grid.tsx", "app/src/components/ops/collections/collections-tiles.tsx", "app/src/components/ops/collections/collections-view.tsx"]
    evidence_required: [run_id, verdict, judges, verified_at]

  - id: E8
    criterion: AC-8
    executor: test
    cmd: config:executors.test.app
    expected: "exit 0; tsc sạch và npm run lint sạch — luật onehub-ui không bắt vi phạm nào ở tệp của vòng"
    paths: [app/src/components/ops/**, app/src/app/ops/**]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E8b
    criterion: AC-8
    executor: test
    cmd: config:executors.test.ui_lint_rules
    expected: "exit 0; npm run test:lint-rules xanh"
    paths: [app/src/components/ops/**]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E9
    criterion: AC-9
    executor: ui-check
    layer: ui-observed
    steps:
      - "Dựng lược đồ như máy chủ bằng `node scripts/ops-cloud-proto.mjs --mode <none|fresh|stale|mixed>` (in VERCEL=1 và DATABASE_URL); chạy dev server của worktree đang kiểm ở cổng :3460 với đúng hai biến đó; đăng nhập tài khoản ops thử (scripts/dev-ops-account.mjs)"
      - "--mode none: chụp evidence/E9-ST-lockdown-none.png (/ops/collections, cuộn tới #lockdown)"
      - "--mode fresh: chụp evidence/E9-ST-lockdown-fresh.png (ô Khoá an toàn + lưới #lockdown)"
      - "--mode mixed (bản tin thật, đổi ok của khối lockdown thành đủ true/false/null): chụp evidence/E9-ST-lockdown-mixed.png — phải thấy cả ba nhãn và ba số trên tab"
      - "--mode stale: chụp evidence/E9-ST-lockdown-stale.png"
      - "Tối: chụp evidence/E9-dark-ST-lockdown-stale.png; 390px: chụp evidence/E9-narrow-ST-lockdown-none.png và evidence/E9-narrow-ST-lockdown-fresh.png, mỗi lần kiểm document.documentElement.scrollWidth <= innerWidth"
    expected: "mỗi dòng ST-lockdown-* có khung mang đúng tên, khớp mô tả; khung tối và 390px đúng trạng thái ghi trong tên; không thanh cuộn ngang"
    paths: [app/src/components/ops/collections/**, app/src/lib/ops-cloud.ts, scripts/ops-cloud-proto.mjs]
    evidence_required: [run_id, exit_code, verifier, verified_at, screenshot, observed]
