    expected: "exit 0; ca 'ECR-AC-1' của gopNhan trên chữ tin ghép: bộ đọc trả đúng diện tích, giá, loại tin. Chiều đỏ: cùng nhãn chấm trên URL ảnh thì số đúng tụt, ghim tên trường."
