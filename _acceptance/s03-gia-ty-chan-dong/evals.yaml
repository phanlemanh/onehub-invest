schema_version: 1
feature_slug: s03-gia-ty-chan-dong
# Ca test mang tiền tố «GT-AC-n» ở pipeline/scripts/gia-ty-chan-dong.test.mjs (trong npm test của pipeline).
# Mỗi ma trận có ca đỏ: bản sao đột biến của transform-zalo.mjs (chép cạnh tệp thật, xoá ngay) với thông điệp ghim.
evals:
  - id: E1
    criterion: AC-1
    executor: test
    cmd: config:executors.test.pipeline
    paths: [pipeline/transform-zalo.mjs, pipeline/scripts/gia-ty-chan-dong.test.mjs]
    expected: "exit 0; ca 'GT-AC-1' xanh: 8 dòng viết trước (5 giá tỷ chẵn bằng đồng, 3 dạng đã đúng) — số assert bằng số dòng, mỗi dòng đúng số đồng; ca đỏ trên bản sao bỏ điều kiện bỏ-qua đuôi nhóm nghìn trong gatSo ghim «3.000.000.000»"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E2
    criterion: AC-2
    executor: test
    cmd: config:executors.test.pipeline
    paths: [pipeline/transform-zalo.mjs, pipeline/scripts/gia-ty-chan-dong.test.mjs]
    expected: "exit 0; ca 'GT-AC-2' xanh: 7 dòng viết trước (4 SĐT sau dấu chấm/phẩy câu, 2 SĐT nối SĐT, 1 SĐT sau «m2,») ra giá 9 triệu; ca đỏ trên bản sao bỏ điều kiện dạng nhóm 3 chữ số (chỉ xét ký tự đứng trước) ghim «0901234567,0912345678»"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E3
    criterion: AC-3
    executor: test
    cmd: config:executors.test.pipeline
    paths: [pipeline/transform-zalo.mjs, pipeline/scripts/gia-ty-chan-dong.test.mjs]
    expected: "exit 0; ca 'GT-AC-3' xanh: extractPhones ra [] ở 5 dòng giá tỷ chẵn, cả hai số ở dòng SĐT nối SĐT bằng phẩy, [\"0901234567\"] ở các dòng AC-2 khác; ca đỏ trên bản sao đưa điều kiện dấu chấm/phẩy vào biểu thức của bộ bóc SĐT (SDT_RE — từ SD2 bộ bóc tách khỏi PHONE_RE dùng chung; giám sát duyệt P1-78) ghim «0901234567,0912345678» chỉ còn một số"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E4
    criterion: AC-4
    executor: test
    cmd: config:executors.test.pipeline
    paths: [pipeline/transform-zalo.mjs, pipeline/scripts/gia-ty-chan-dong.test.mjs]
    expected: "exit 0; ca 'GT-AC-4' xanh: lyDoGiaPhiLy(parsePost(chữ)) ra ban-tren-100-ty cho «150.000.000.000» và thue-tu-1-ty cho «1.000.000.000/tháng»; đối chứng: hai dòng ấy trên bản sao bỏ điều kiện bỏ-qua ra null (giá bị nuốt nên lọt chốt)"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E5
    criterion: AC-5
    executor: test
    cmd: config:executors.test.pipeline
    paths: [pipeline/**]
    expected: "exit 0; toàn bộ test pipeline xanh, gồm cam-mau-s03.test.mjs (ma trận N1) và gia-ty-chan-dong.test.mjs"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E6
    criterion: AC-6
    executor: script
    layer: backend-effect
    cmd: config:executors.script.gia_ty_chan_dong_so
    paths: [pipeline/transform-zalo.mjs, pipeline/scripts/so-gia-ty-chan-dong.mjs]
    expected: "exit 0; so-gia-ty-chan-dong in số bài S03 thật, số bài đổi giá, số bài đổi danh sách SĐT (=0; từ SD2 boc-sdt-du-va-chon-ro — giám sát duyệt P1-81 — danh sách «trước» lấy bằng bộ bóc của cây vì bộ bóc đổi có chủ ý sau bản nền), và mỗi bài đổi giá kèm mã bài + nhãn dạng; mọi bài đổi giá mang nhãn 'gia-ty-chan-dong', bài đổi ngoài dạng ấy = 0; lượt đối chứng (luôn chạy trong cùng lệnh): bản sao đưa điều kiện dấu chấm/phẩy vào biểu thức của bộ bóc SĐT (SDT_RE, tách khỏi PHONE_RE dùng chung từ SD2), trên cùng bộ bài thật cộng một bài tổng hợp «Cho thuê 2PN 9tr LH 0901234567,0912345678 T.Lan», phải TRƯỢT và gọi tên bài tổng hợp đổi SĐT — không bắt được thì lệnh exit 1"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E5b
    criterion: AC-5
    executor: script
    layer: backend-effect
    cmd: config:executors.script.cam_mau_s03_that
    paths: [pipeline/transform-zalo.mjs]
    expected: "exit 0; ca DB của N1 xanh và do-cam-mau-s03 in bảy thước 'ĐẠT' ở lượt cây trên bản chép dữ liệu thật (DB thử), lượt đối chứng tái lập mốc gốc từng thước"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
