schema_version: 1
feature_slug: l2-bao-thu-doi-probe-that
# Ca mới:
# - «CD-AC-13…15» ở agent/tests/judge-entity-duong.test.ts (L2 bảo thủ, không DB).
# - «CD-AC-16» ở agent/probes/o-duong-that.test.ts (đếm giá trị đổi khoá trên DB máy thu).
# - «PT-AC-n» ở agent/probes/du-lieu-that.test.ts (script probe chung + quét suite + tsconfig).
# Các ca probe dời giữ nguyên tên.
evals:
  - id: E1
