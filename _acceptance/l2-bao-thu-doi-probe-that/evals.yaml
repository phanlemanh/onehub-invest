    expected: "exit 0; ca 'CD-AC-14 L2 không bóc khi sau phẩy không phải tiền tố đường': soDuong(x, 'Lê Lợi') = 'thieu' hai chiều cho «3,5m», «4,5m», «7,5m», «4,3m», «15, Q1», «208, P12», «12, Phuong 5», «50 , Tân Khánh , tân Uyên , Tp , Hcm», «12, Phong Phú», «8, Phổ Quang»; khoaDuong(«2A, Khu dân cư Vĩnh Phú 1») không phần tử nào chứa 'khu dan cu'; «3/2, Phường 12, Quận 10»↔«3/2» và «19/5, Tân Bình»↔«Đường 19/5» 'khop'; «208, Nguyễn Hữu Cảnh, Phường 22, Quận Bình Thạnh, Tp Hồ Chí Minh»↔«Nguyễn Hữu Cảnh» = 'thieu' (ma trận L2 của CD-AC-9 đổi đúng một kỳ vọng này, ghi chú tên hồ sơ); chiều đỏ: bản đột biến dùng L2 của main f78e7382 (dòng danh sách loại trừ) → đỏ 'CD-AC-14 L2: 3,5m ↔ Lê Lợi'; bản đột biến bỏ ranh giới từ của tiền tố → đỏ 'CD-AC-14 L2: 12, Phong Phú ↔ Lê Lợi'"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
