    executor: test
    cmd: config:executors.test.judge_entity_duong
    layer: backend-effect
    paths: [agent/src/agents/judge-entity.ts, agent/tests/judge-entity-duong.test.ts]
    expected: "exit 0; ca 'CD-AC-13 L2 bóc khi sau phẩy là tiền tố đường': mỗi tiền tố một ca: «46, Đường Điện Biên Phủ, …»↔«Điện Biên Phủ», «12, Phố Huế»↔«Huế», «7, Đ. Lê Lợi»↔«Lê Lợi», «9, duong Lang»↔«Đường Láng», «3, pho Hue»↔«Phố Huế», «237/6, Hẻm 237 Đường Hoàng Diệu»↔«Hoàng Diệu», «5, Ngõ 12 Lê Lợi»↔«Lê Lợi», «4, Ngách 3 Ngõ 9 La Dương»↔«La Dương», «6, Kiệt 12 Hùng Vương»↔«Hùng Vương», «33/3, Đường 25A»↔«Đường 25A» soDuong 'khop' hai chiều, apNguong không có khac_duong; chiều đỏ: bản đột biến bỏ dòng L2 → đỏ 'CD-AC-13 L2: 237/6, Hẻm 237 Đường Hoàng Diệu ↔ Hoàng Diệu'"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
