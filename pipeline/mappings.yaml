# ==========================================================================
# pipeline/mappings.yaml — artifact thực thi ADR-0011 (luật dữ liệu RESO-first)
# Mọi field/enum dữ liệu listing MỚI phải khai ở đây trước khi merge — đủ 6
# điều kiện ở ADR-0011 Quyết định 3 (bằng chứng tra DD, lý do đặc trưng VN,
# migration, CHECK constraint, khai báo ở đây, DQ check).
#
# Quy ước:
#   dd         : field Data Dictionary 2.0 tương đương NGỮ NGHĨA (đã tra dd.reso.org)
#   dd: null   : đã tra, không có tương đương → local extension (bắt buộc có rationale)
#   checked_on : ngày tra DD gần nhất của ánh xạ
# Cột DB giữ snake_case; dd chỉ là ánh xạ ngữ nghĩa — không đổi tên cột.
# ==========================================================================

meta:
  law: docs/adr/0011-reso-first-data-law.md
  research: docs/research/reso-standards.md
  dd_version: "2.0"
  checked_on: "2026-10-22"

# --------------------------------------------------------------------------
# LỚP CANONICAL — sale_offers (23 cột hiện tại)
# --------------------------------------------------------------------------
canonical:
  table: sale_offers
  fields:
    offer_id:
      dd: Key
      note: "hash(source|external_id) — gộp vai trò Key + OriginatingSystemKey"
      checked_on: "2026-10-22"
    source:
      dd: OriginatingSystemName
      note: "qua SPL mã S0x (ADR-0007) — không phải tên nguồn thật"
      checked_on: "2026-10-22"
    kind:
      dd: PropertyType
      note: >
        DD phân biệt bán vs thuê qua CHÍNH PropertyType (Residential vs
        ResidentialLease) + ListingAgreement (RightToSell vs RightToLease),
        không có field "loại giao dịch" riêng. rent_lt ≈ PropertyType=
        ResidentialLease + LeaseAmountFrequency=Monthly (giá VND/tháng);
        sale ≈ PropertyType ∈ Residential/Land/ResidentialIncome. STR
        (rent_st tương lai) KHÔNG có mô hình DD — frequency Daily +
        LeaseTerm ShortTermLease chỉ là mảnh rời → local extension.
      checked_on: "2026-10-22"
    price_vnd:
      dd: ListPrice
      note: "VND bigint (ADR-0011 Qđ 4); với rent_lt gần ngữ nghĩa LeaseAmount"
      checked_on: "2026-10-22"
    area_m2:
      dd: LivingArea
      note: "LivingAreaUnits='sqm' ngầm hiểu (ADR-0011 Qđ 4)"
      checked_on: "2026-10-22"
    price_perm2:
      dd: null
      rationale: "metric tự tính (price/area) cho ruler — DD không có trường giá/m² chuẩn"
      checked_on: "2026-10-22"
    bedrooms:
      dd: BedroomsTotal
      checked_on: "2026-10-22"
    phuong_raw:
      dd: null
      rationale: >
        text phường thô trước khi match areas; sau match thì area_id là phân
        cấp hành chính ≈ Country/StateOrProvince/City của DD (VN dùng phường)
      checked_on: "2026-10-22"
    district_raw:
      dd: null
      rationale: "tương tự phuong_raw, cấp quận"
      checked_on: "2026-10-22"
    confidence:
      dd: null
      rationale: "độ tin parser nội bộ (high|medium|low)"
      checked_on: "2026-10-22"
    first_seen:
      dd: null
      rationale: >
        thời điểm collector THẤY lần đầu — không phải OnMarketDate của nguồn;
        làm mốc replication nội bộ (≈ TimestampReplication)
      checked_on: "2026-10-22"
    last_seen:
      dd: null
      rationale: "tương tự first_seen — mốc replication nội bộ"
      checked_on: "2026-10-22"
    n_reposts:
      dd: null
      rationale: "gộp tin trùng trong cùng nguồn (dedup nội bộ)"
    post_ids:
      dd: null
      rationale: "danh sách post gốc gộp vào offer này"
    price_tier:
      dd: null
      rationale: >
        P1 giá thật (Zalo) / P2 giá vải (Chợ Tốt) — đặc trưng VN: giá công khai
        ≠ giá giao dịch thật
      checked_on: "2026-10-22"
    seller_name:
      dd: Member
      note: "ngữ nghĩa resource Member, không phải field Property"
    seller_phone:
      dd: Member
      note: "tầng C, E.164; lên cloud, trên cổng Invest chỉ qua route contact (sửa đổi ADR-0007, 02/11). Số S06 không có dấu trực tiếp đi kèm seller_phone_inferred"
    seller_phone_inferred:
      dd: null
      rationale: >
        Số người bán chưa xác minh: tin S06 có số mà không mang dấu s06-so-tren-tin, tức số suy từ tin khác cùng tài khoản hoặc
        thiếu bằng chứng. Đặc trưng VN: S06 ẩn số theo từng tin nhưng cùng tài khoản lộ số ở tin khác, người xem cần biết số đó
        chưa chắc của tin đang đọc. Tra dd.reso.org 03/11, Member DD 2.0 và 2.1: 15 field điện thoại (MemberDirectPhone,
        MemberMobilePhone, MemberPreferredPhone…) chỉ nói loại số và định dạng, phần mô tả hiển thị không có trạng thái xác minh.
        Migration 070 (cột tính của view sale_offers). Kiểu boolean nên không cần CHECK. DQ: so-chua-xac-minh ở pipeline/sql/450_dq_checks.sql.
        Migration 079 (enrich-nguoi-s03, tra lại 06/11) mở thêm tin S03 mang dấu s03-qua-nguoi-dang: số suy qua liên lạc của
        người đăng (party_contacts), không lấy từ chính tin.
      checked_on: "2026-11-06"
    seller_phone_hash:
      dd: Member
      note: "khoá sellers registry ≈ ULI — định danh xuyên nguồn"
    seller_ref:
      dd: null
      rationale: "ID người bán tại nguồn (ct:<account_id>…) ≈ OriginatingSystemKey của Member"
    bait_gap_pct:
      dd: null
      rationale: "metric P4 — chênh giá công khai vs nội bộ cùng người bán"
    listing_url:
      dd: null
      rationale: "URL gốc tin đăng"
      checked_on: "2026-10-22"
    property_type:
      dd: PropertySubType
      note: >
        loại hình là PropertySubType (DA4, ROADMAP §3 mục 39 C7) — PropertyType do `kind` mang (sale/rent_lt).
        apartment≈Residential+SubType Condominium; house≈Residential SFR/Townhouse;
        land≈Land; commercial≈CommercialSale/CommercialLease; unknown=chưa có tín
        hiệu (P1 text); room=LOCAL EXTENSION VN (Phòng trọ — DD PropertySubType
        31 giá trị không có; migration 025, xác minh category Chợ Tốt 1050)
      checked_on: "2026-10-22"
    street_raw:
      dd: StreetName
      note: "tên đường/phố extract từ text P1 (E2 enrich — M-3); S06 đọc payload street_name qua phát biểu source_field (DS1); số nhà chưa tách cột"
      checked_on: "2026-11-03"
    block_raw:
      dd: BuildingName
      note: >
        mã tòa/block kiểu môi giới VN (LBV, LD2, S1.03) — chữ thô của tên toà
        (BuildingName, ADR-0013 §2); toà chuẩn hoá qua danh bạ vật thể `buildings`
        (ADR-0016 §2), không qua họ Vùng
      checked_on: "2026-11-11"
    floor_raw:
      dd: UnitFloorLocation
      note: >
        số tầng nơi căn rao nằm (1–999, chữ số không đệm). Tra DD 2.1 local 11/11: UnitFloorLocation (Property, chuỗi
        ≤3 ký tự, không danh sách giá trị); EntryLevel là tầng lối vào chính, StoriesTotal là tổng tầng toà — không dùng.
        S06 có từ 030; S03 đọc từ chữ bài qua phát biểu (DV4 tang-tren-tin-s03, migration 095); cột do resolve_offer_fields dựng.
      checked_on: "2026-11-11"
    floor_band:
      dd: null
      rationale: >
        dải tầng «tầng thấp, trung, cao» khi môi giới không nói số (đo 09/11: phần lớn tin S03 ghi tầng là dải). DD 2.1 không
        có field dải tầng (UnitFloorLocation là một tầng, ≤3 ký tự) → extension đủ 6 điều kiện ADR-0011: tra cứu 11/11,
        lý do VN, migration 095, trigger miền lower|middle|upper + trục floor_band, khai ở đây, DQ s03-floor-fill. Không có cột:
        chỉ ở phát biểu và field_provenance của tin.
      checked_on: "2026-11-11"
    project_node_id:
      dd: SubdivisionName
      note: >
        dự án của tin — id nút asset_nodes loại project (ADR-0016 §1, CONTEXT «Dự án»). Tra DD 2.1 local 12/11:
        SubdivisionName có ở Property và Building. Chỉ phát biểu (DA2, migration 096: trigger kiểm id là nút project);
        bộ phân xử chưa dựng cột — GCQ2, DA9 đọc phát biểu.
      checked_on: "2026-11-12"
    subzone_node_id:
      dd: null
      rationale: >
        phân khu của tin — id nút asset_nodes loại subzone (ba nút building của Grand Park được nhận tới khi DA1 đổi loại).
        Sáu điều kiện ADR-0011 Qđ 3: (1) tra DD 2.1 local 12/11 — ComplexName chỉ có ở resource Building, Property không có
        field phân khu; (2) lý do VN: phân khu là nhánh mở bán riêng trong đại dự án cùng chủ đầu tư, người mua tìm theo nó;
        (3) migration 096; (4) trigger field_assertions_vat_the_082 kiểm id là nút phân khu, chỉ resource Property; (5) khai ở
        mappings này (canonical.fields + trục assertion_field); (6) DQ: miền giá trị qua pipeline/dq-enum-vocab.mjs
        (field_assertions.field), độ phủ trên tin ở hàng DA9 — thoả một phần tới khi DA9 gộp. Không có cột.
      checked_on: "2026-11-12"
    area_id:
      dd: null
      note: >
        phường/xã của tin — mã areas cấp submarket (DA2, migration 096 mở phát biểu area_id cho resource Property; 082 đã có
        ở Building). Local: DD 2.1 không có cấp phường, City là tên không phải mã. Chỉ phát biểu, chưa dựng cột trên tin.
      checked_on: "2026-11-12"
    bathrooms:
      dd: BathroomsTotalInteger
      note: "đối chiếu research/reso-standards.md bảng field map; migration 030/031"
      checked_on: "2026-10-22"
    street_number:
      dd: StreetNumber
      note: "số nhà của tin S06 (payload street_number, vắng thì streetnumber_display) — chỉ qua phát biểu, migration 061 (HD5)"
      checked_on: "2026-10-31"
    unit_number:
      dd: UnitNumber
      note: "mã căn công bố của tin S06 (payload unitnumber_display, vắng thì unitnumber) — giữ nguyên chữ nguồn; migration 061"
      checked_on: "2026-10-31"
    frontage_length:
      dd: FrontageLength
      note: "mặt tiền (m) — payload width S06; numeric, CHECK > 0; migration 061"
      checked_on: "2026-10-31"
    lot_size_dimensions:
      dd: LotSizeDimensions
      note: "«ngang x dài» (m) khi S06 có cả width lẫn length — RESO không có trường chiều sâu lô riêng; migration 061"
      checked_on: "2026-10-31"
    stories:
      dd: Stories
      note: "số tầng của nhà (payload floors S06) — Property.Stories, không phải StoriesTotal của toà (ADR-0013); migration 061"
      checked_on: "2026-10-31"
    latitude:
      dd: Latitude
      note: "vĩ độ tin S06 (cột latitude của stg) — CHECK [-90, 90]; migration 061"
      checked_on: "2026-10-31"
    longitude:
      dd: Longitude
      note: "kinh độ tin S06 (cột longitude của stg) — CHECK [-180, 180]; migration 061"
      checked_on: "2026-10-31"

# --------------------------------------------------------------------------
# LỚP MEDIA — bảng `media` (migration 053, NH1 media-canonical-reso): ảnh tin theo resource Media
# của RESO DD 2.1, một dòng mỗi ảnh khác nhau của một tin. Bên ghi pipeline/transform-media.mjs.
# KHÔNG sync cloud (media_url S06 mang tên miền nguồn, tầng A). ResourceName = Property và
# MediaCategory = Photo ngầm hiểu (bảng chỉ chứa ảnh của tin) — thêm cột kèm lookup khi có loại khác.
# --------------------------------------------------------------------------
media:
  table: media
  dd_resource: Media
  dd_version: "2.1"
  checked_on: "2026-10-30"  # tra research-local/reso/dd-2.1.json
  fields:
    media_key:
      dd: MediaKey
      note: "md5(resource_record_key | local_file ?? media_url) — ổn định qua các lượt nạp"
    resource_record_key:
      dd: ResourceRecordKey
      note: "offer_id (FK sale_offer_records); ResourceName = Property ngầm hiểu"
    originating_system_name:
      dd: OriginatingSystemName
      note: "mã S0x (ADR-0007), không phải tên nguồn thật"
    originating_system_resource_record_key:
      dd: OriginatingSystemResourceRecordKey
      note: "post_id (S03/S05) hoặc list_id (S06) — bản ghi gốc ở nguồn"
    media_url:
      dd: MediaURL
      note: "URL gốc http(s); tầng A với S06 (tên miền nguồn) — chỉ máy thu"
    media_order:
      dd: Order
      note: "ảnh đã tải trước, rồi URL gốc (luật ghép của review-media-backend AC-5)"
    local_file:
      dd: null
      rationale: >
        con trỏ tới ảnh đã tải vào raw snapshot của máy thu, dạng <snapshotId>/media/<tên>
        (route /api/zalo-media) — DD 2.1 resource Media không có trường cho bản lưu cục bộ;
        không phải trường miền nghiệp vụ. DQ: dq_check_results `media:local-file` mỗi nguồn mỗi lượt.
      checked_on: "2026-10-30"
    media_modification_timestamp:
      dd: MediaModificationTimestamp
      note: "đổi khi nội dung dòng đổi; dòng không đổi giữ nguyên"

# --------------------------------------------------------------------------
# LỚP NGUỒN — staging → canonical
# --------------------------------------------------------------------------
sources:
  S03:
    label: "zalo (P1 — giá thật)"
    staging: stg_zalo_posts
    transform: pipeline/transform-zalo.mjs
    distinguish: "agent_id khác 'apify-facebook' (S05 dùng chung bảng staging)"
    method: "parse text tự do — không có field cấu trúc"
    fields:
      text: "→ price_vnd, area_m2, bedrooms, phuong_raw, kind (regex + fallback)"
      post_id: "→ thành phần hash offer_id"
      media_files: "→ bảng media (053) qua transform-media.mjs: local_file khi tải được, media_url khi lỗi — chỉ máy thu"
      media: "→ bảng media (053): URL gốc chưa có bản tải, đứng sau ảnh đã tải"
  S05:
    label: "facebook groups (P2)"
    staging: stg_zalo_posts
    transform: pipeline/transform-fb.mjs
    distinguish: "agent_id = 'apify-facebook'"
    method: "parse text tự do (Apify collector → cùng lưới parse)"
    fields:
      text: "→ price_vnd, area_m2, bedrooms, phuong_raw, kind"
  S06:
    label: "chợ tốt (P2 — giá vải)"
    staging: stg_chotot_ads
    transform: pipeline/transform-chotot.mjs
    method: "field cấu trúc trực tiếp"
    fields:
      list_id: "→ thành phần hash offer_id (S06|list_id)"
      ad_type: "s→sale, u→rent_lt → kind"
      price: "→ price_vnd"
      size_m2: "→ area_m2"
      rooms: "→ bedrooms"
      "ward_name_v3 | ward_name | area_name + subject": "→ phuong_raw / district_raw (match areas)"
      "seller.full_name": "→ seller_name"
      "payload.account_id": "→ seller_ref"
      images: "→ bảng media (053) qua transform-media.mjs: mảng images.images, giữ thứ tự, bỏ trùng — URL mang tên miền nguồn, chỉ máy thu"
    da_dua_sang_canonical:
      - "category → property_type (migration 025 — ĐÃ LÀM)"
    chua_dua_sang_canonical:
      - "pty_project_name → asset_nodes match (G-2 matcher 2 tầng)"
      - "toilets → BathroomsTotalInteger"
      - "floornumber, unitnumber, block → dedup cấp căn (R4)"
      - "latitude, longitude (phủ 99.98%) → geo-polygon (R2)"
  S08:
    label: "danh mục dự án (quỹ căn chủ đầu tư — thông tin dự án công khai, ROADMAP §3 mục 38)"
    staging: stg_s08_inventory
    transform: null  # chưa có — importer của ZCode (PL10 bước 1) nạp staging trước
    method: "field cấu trúc trực tiếp (item inventory_unit, DATA-CONTRACT v4)"
    policy: "thông tin dự án (kể cả giá chủ đầu tư, trạng thái quỹ căn) là công khai — được lên cloud, cổng Invest, API qua danh bạ (mục 38); tên nguồn thật là tầng A, không rời máy; stg_s08_inventory không sync nguyên bảng; căn sơ cấp chưa thành tin trong danh sách Bán (mục 39 Hỏi-3)"
    checked_on: "2026-10-24"  # tra research-local/reso/dd-2.1.json
    fields:
      project_id: "khoá nối sang nút dự án qua s08_project_links (migration 074), không phải field RESO; là bí danh của nút dự án"
      project_name: "→ SubdivisionName (tên nút dự án `project`, ADR-0013 §2) — đối chiếu qua bảng nối dự án (DA3), không tự ghi đè tên nút"
      product_code: "→ UnitNumber (mã căn; tầng/toà tách ở transform — ADR-0013 §2)"
      subdivision_name: "→ Building.ComplexName (phân khu); high_rise lẫn toà → BuildingName"
      apartment_type_name: "→ PropertySubType (chữ nguồn không đồng nhất — chuẩn hoá ở transform)"
      land_area: "→ LotSizeArea (SquareMeters)"
      construction_area: "→ BuildingAreaTotal (SquareMeters)"
      base_direction_name: "→ DirectionFaces"
      number_of_room: "→ BedroomsTotal"
      number_of_wc: "→ BathroomsTotalInteger"
      apartment_price: "→ ListPrice"
      state: "notSold → StandardStatus Active · sold → Closed"
    chua_dua_sang_canonical:
      - "early_payment_price — DD không có tương đương; cần extension đủ 6 điều kiện nếu đưa lên"
      - "row_code, state_line, delivery_standard_name, fund_groups_sell_code — giữ ở staging"

# --------------------------------------------------------------------------
# SỔ TỪ VỰNG — nguồn duy nhất của mọi enum dữ liệu (PL6, ADR-0013 §8: khuôn RESO Lookup / RelatedLookup)
#   Sửa ở đây rồi chạy `node pipeline/vocab.mjs --write` — sinh hằng pipeline/agent/app + khối CONTEXT.md.
#   `node pipeline/vocab.mjs --lint` đỏ khi có danh sách viết tay ngoài sổ; `--check-db` so DB (ref_*, CHECK).
#   Mỗi trục: term_vi (thuật ngữ CONTEXT.md) · dd_field (field RESO DD 2.1, null = local) · columns (cột bị
#   CHECK) · values: code + label_vi + (dd_lookup = StandardLookupValue gần nhất | local: true + rationale).
#   Trục local cả khối khai local/rationale/checked_on ở cấp trục, giá trị kế thừa.
#   Giá trị mới cho trục có columns → cần migration mới (ref_lookup + CHECK), --check-db nhắc.
# --------------------------------------------------------------------------
enums:
  kind:
    term_vi: Loại tin
    dd_field: PropertyType
    columns: [sale_offers.kind, silver_labels.kind]
    nullable: false
    values:
      - { code: sale, label_vi: Bán, dd_lookup: Residential }
      - { code: rent_lt, label_vi: Cho thuê, dd_lookup: ResidentialLease }
    note: "DD phân biệt bán/thuê qua chính PropertyType; rent_lt ≈ ResidentialLease + LeaseAmountFrequency=Monthly. rent_st (STR) chưa có."
    checked_on: "2026-10-26"
  property_type:
    term_vi: Loại hình
    dd_field: PropertySubType
    columns: [sale_offers.property_type, properties.property_type]
    nullable: true
    values:
      - { code: apartment, label_vi: Căn hộ, dd_lookup: Condominium }
      - { code: house, label_vi: Nhà riêng, dd_lookup: Townhouse }
      - { code: land, label_vi: Đất, dd_lookup: UnimprovedLand }
      - { code: room, label_vi: Phòng, local: true, rationale: "phòng trọ — DD PropertySubType 31 giá trị không có (migration 025, category Chợ Tốt 1050)" }
      - { code: commercial, label_vi: Mặt bằng, dd_lookup: "CommercialSale / CommercialLease (PropertyType)" }
      - { code: unknown, label_vi: Chưa rõ, local: true, rationale: "«chưa biết» — chưa có phát biểu nào; không gửi ra API (ADR-0013 §8)" }
    note: "reso-khung-phan-loai.md §7: apartment/house ở cấp PropertySubType, land/commercial ở cấp PropertyType."
    checked_on: "2026-10-26"
  confidence:
    term_vi: Độ tin trích xuất
    dd_field: null
    local: true
    rationale: "độ tin parser nội bộ — reso-khung §4: thay dần bằng *Source + FieldAssertion"
    checked_on: "2026-10-22"
    columns: [sale_offers.confidence]
    nullable: false
    values:
      - { code: high, label_vi: cao }
      - { code: medium, label_vi: trung bình }
      - { code: low, label_vi: thấp }
  price_tier:
