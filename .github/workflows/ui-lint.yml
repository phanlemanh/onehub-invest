name: ui-lint

# Chặn tự vẽ tay UI (luật onehub-ui + baseline suppressions trong app/eslint-suppressions.json).
# Vi phạm mới → eslint exit 1; suppression đã hết hiệu lực mà chưa prune → exit 2.
# Chạy riêng khỏi acceptance-gate để lỗi lint hiện thẳng ở check của PR.
on:
  pull_request:
    paths:
      - "app/**"
      - ".github/workflows/ui-lint.yml"
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/ui-lint.yml"

jobs:
  ui-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: cài phụ thuộc
        working-directory: app
        run: npm ci

      - name: test luật onehub-ui
        working-directory: app
        run: npm run test:lint-rules

      - name: lint (eslint + check-bare-disables)
        working-directory: app
        run: npm run lint
