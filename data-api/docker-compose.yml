version: "3.9"

services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set_password}
      POSTGRES_DB: onehub
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Sample schema (db/schema.sql) runs on first start
      - ./db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@db:5432/onehub
      PORT: 3001
      # Required: the API refuses to start without keys (only NODE_ENV=development|test may run keyless).
      DATA_API_KEYS: ${DATA_API_KEYS:?set_api_keys}
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
